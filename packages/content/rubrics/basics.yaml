- question: what-is-react
  points:
    - id: ui-library-components
      text: "React — библиотека для построения UI из компонентов: переиспользуемых функций, которые принимают props и возвращают разметку"
      weight: 3
    - id: declarative-ui
      text: "Подход декларативный: описываешь, как UI выглядит при данном состоянии, а React сам вычисляет минимальные изменения и применяет их к DOM"
      weight: 3
    - id: one-way-data-flow
      text: Данные текут сверху вниз через props, а изменения происходят через явные обновления состояния, поэтому поведение предсказуемо
      weight: 2
    - id: not-a-framework
      text: "React — не фреймворк «всё в одном»: роутинг, загрузку данных, сборку и SSR решают отдельные инструменты или фреймворки (Next.js, React Router, TanStack Start); новые проекты рекомендуют начинать с фреймворка или Vite"
      weight: 2
    - id: platform-agnostic-renderers
      text: "Ядро `react` не зависит от платформы: результат к конкретной среде применяют рендереры `react-dom`, `react-native` и другие"
      weight: 1
    - id: honest-limitations
      text: "Названы ограничения: многое (стейт-менеджер, стили, формы) выбирается самостоятельно, а модель рендеринга и правила хуков требуют времени на освоение"
      weight: 1
  misconceptions:
    - React — полноценный фреймворк со встроенными роутингом, работой с данными и SSR
    - Virtual DOM делает React быстрее ручной работы с DOM
    - React работает только в браузере и привязан к DOM
    - "В React данные свободно текут в обе стороны: дочерний компонент может напрямую менять props родителя"
- question: jsx
  points:
    - id: syntax-extension-compiled
      text: JSX — синтаксическое расширение JavaScript, которое браузер не понимает напрямую; его преобразует компилятор (Babel, SWC, esbuild, TypeScript)
      weight: 3
    - id: compiles-to-jsx-calls
      text: JSX компилируется в вызовы `jsx()` из `react/jsx-runtime` (раньше — `React.createElement`), которые возвращают обычные JS-объекты — React-элементы
      weight: 3
    - id: new-transform-no-import
      text: С новым JSX transform (React 17+) импорт `import React from 'react'` в каждом файле больше не обязателен
      weight: 2
    - id: jsx-rules
      text: "Называет основные правила: один корневой элемент или фрагмент `<>...</>`, все теги закрыты, атрибуты в camelCase (`className`, `htmlFor`), в `{}` только выражения, а не инструкции `if`/`for`"
      weight: 2
    - id: capitalized-components
      text: Имя с заглавной буквы — компонент, с маленькой — HTML-тег, поэтому компонент с маленькой буквы будет воспринят как тег
      weight: 1
    - id: escaping-and-zero-pitfall
      text: Значения в `{}` экранируются (защита от XSS, в отличие от `dangerouslySetInnerHTML`); упоминает подвох `{count && <Badge />}`, рендерящий `0`
      weight: 1
  misconceptions:
    - JSX — это HTML внутри JavaScript, который браузер понимает напрямую
    - JSX компилируется сразу в DOM-узлы или HTML-строку, а не в JS-объекты (React-элементы)
    - В фигурных скобках JSX можно писать любые инструкции, включая `if` и `for`
    - Импорт `React` обязателен в каждом файле с JSX даже в React 17+ с новым transform
- question: component-vs-element
  points:
    - id: component-is-function
      text: Компонент — функция (или класс), которая описывает часть UI и возвращает элементы
      weight: 3
    - id: element-is-description
      text: Элемент — неизменяемый объект вида `{ type, props, key }`, который создаёт JSX; это лишь описание того, что отрендерить
      weight: 3
    - id: instance-holds-state
      text: Экземпляр — «живая» копия компонента в дереве со своим состоянием; у функциональных компонентов эту роль играет внутренний Fiber-узел
      weight: 2
    - id: element-not-render
      text: "Создание элемента не вызывает компонент: React вызовет функцию только когда элемент попадёт в дерево"
      weight: 2
    - id: state-by-position
      text: "Состояние привязано к позиции в дереве: два `<Counter />` рядом независимы; при том же типе на том же месте состояние сохраняется, при смене типа поддерево пересоздаётся"
      weight: 2
    - id: nested-component-pitfall
      text: Объявление компонента внутри другого компонента создаёт новый тип на каждом рендере, из-за чего поддерево размонтируется и теряет состояние и фокус
      weight: 1
  misconceptions:
    - JSX/элемент сразу вызывает функцию компонента и рендерит его в DOM
    - Состояние хранится в самой функции компонента или в переменной, поэтому все `<Counter />` разделяют одно состояние
    - Элемент — это DOM-узел или изменяемый объект, который можно модифицировать после создания
    - Компонент и элемент — синонимы, разницы между ними нет
- question: props
  points:
    - id: props-definition
      text: Props — входные параметры компонента, которые передаёт ему родитель
      weight: 3
    - id: props-read-only
      text: "Props доступны только для чтения: компонент должен вести себя как чистая функция от своих props, а изменяемые данные хранятся в state (своём или родителя, который передаст новые props)"
      weight: 3
    - id: mutation-breaks-comparison
      text: Мутация props ломает поведение, потому что React сравнивает старые и новые значения по ссылке, и мутированный объект делает рендер непредсказуемым
      weight: 2
    - id: callback-props
      text: Чтобы изменить данные «снизу», ребёнок вызывает функцию из props (например, `onChange`), а состояние меняет родитель
      weight: 2
    - id: children-prop
      text: "`children` — особый prop, содержащий всё, что вложено между тегами компонента; это основа композиции"
      weight: 1
    - id: defaults-key-ref
      text: Значения по умолчанию задаются через деструктуризацию (`defaultProps` для функциональных компонентов удалён в React 19); `key` не попадает в компонент, а `ref` в React 19 передаётся как обычный prop
      weight: 1
  misconceptions:
    - Props можно менять внутри компонента, если присвоить новое значение полю объекта props — React это заметит и перерендерит
    - Скопировать prop в state через `useState(props.value)` — нормальный способ, state будет синхронизироваться при изменении prop
    - "`key` доступен внутри компонента как `props.key`"
    - В React 19 для функциональных компонентов по-прежнему нужно использовать `defaultProps` или `forwardRef` для передачи `ref`
- question: state-vs-props
  points:
    - id: state-definition
      text: "State — внутренняя «память» компонента: данные, которые меняются со временем и при изменении через функцию обновления вызывают повторный рендер"
      weight: 3
    - id: props-readonly-from-parent
      text: Props приходят от родителя и внутри компонента только читаются; изменить их может только родитель, а state принадлежит самому компоненту и меняется через `setState`/`setCount`
      weight: 3
    - id: why-not-local-variable
      text: "Обычная переменная `let` не подходит: она сбрасывается при каждом вызове функции-компонента и её изменение не сообщает React о необходимости перерисовки"
      weight: 2
    - id: no-derived-state
      text: В state кладут только то, что нельзя вычислить из props или другого state; производные значения считают прямо во время рендера, а не синхронизируют через `useEffect`
      weight: 2
    - id: async-update
      text: После вызова `setCount` значение `count` в текущем рендере не меняется — новое значение будет доступно только в следующем рендере
      weight: 1
    - id: example-counter
      text: Приводит пример, где одно значение — prop (например, `step`), а другое — state (`count` через `useState`)
      weight: 1
  misconceptions:
    - Компонент может изменять свои props напрямую (например, `props.value = ...`)
    - Значение state обновляется синхронно сразу после вызова функции обновления
    - Можно хранить данные в обычной локальной переменной или мутировать state напрямую, и React перерисует компонент
    - Производные данные (например, `fullName` из `first` и `last`) правильно хранить в отдельном state и синхронизировать через `useEffect`
- question: immutable-updates
  points:
    - id: create-new-reference
      text: "State нужно обновлять иммутабельно: создавать новый объект или массив вместо изменения существующего и передавать его в сеттер"
      weight: 3
    - id: object-is-comparison
      text: React сравнивает state по ссылке (`Object.is`), поэтому после мутации ссылка та же и изменение не будет замечено (ререндера не будет)
      weight: 3
    - id: shallow-spread-nested
      text: "Спред копирует только один уровень, поэтому при изменении вложенного поля нужно копировать каждый уровень на пути к нему: `{ ...u, address: { ...u.address, city } }`"
      weight: 2
    - id: array-immutable-patterns
      text: "Для массивов используются немутирующие операции: добавление через `[...xs, item]`, удаление через `filter`, изменение элемента через `map` с копией объекта"
      weight: 2
    - id: mutating-methods-alternatives
      text: Методы `push`, `splice`, `sort`, `reverse` и присваивание по индексу мутируют массив; вместо них — копия или ES2023-аналоги `toSorted`, `toReversed`, `toSpliced`, `with`
      weight: 2
    - id: immer-or-flatten
      text: Для глубоко вложенных структур можно использовать Immer (`useImmer`, Redux Toolkit) или сделать state более плоским; мутации также ломают мемоизацию и Strict Mode
      weight: 1
  misconceptions:
    - Можно изменить объект напрямую (`user.name = 'X'`) и вызвать `setUser(user)` — React увидит изменение и перерисует компонент
    - "`{ ...obj }` или `[...arr]` делают глубокую копию, поэтому вложенные объекты можно мутировать безопасно"
    - "`setItems(items.sort(...))` безопасен, потому что результат передаётся в `setState`"
    - React глубоко сравнивает содержимое объектов state, чтобы решить, нужен ли ререндер
- question: conditional-rendering
  points:
    - id: conditional-techniques
      text: Условия в JSX выражаются через тернарный оператор, `&&` или ранний `return` (включая `return null`, чтобы ничего не рендерить)
      weight: 3
    - id: zero-nan-pitfall
      text: "`false`, `null`, `undefined` и `true` ничего не рендерят, а `0` и `NaN` рендерятся, поэтому `{items.length && <List />}` выведет `0`; нужно явное сравнение вроде `items.length > 0`"
      weight: 3
    - id: list-map-key
      text: Списки рендерят через `map`, каждому элементу дают стабильный уникальный `key` (например, `id` из данных)
      weight: 2
    - id: hooks-before-return
      text: Все хуки должны вызываться до условного раннего `return`, иначе нарушаются правила хуков
      weight: 2
    - id: type-change-resets-state
      text: "Если условие меняет тип элемента в одной позиции (`isEdit ? <EditForm /> : <ViewForm />`), состояние поддерева сбрасывается"
      weight: 1
    - id: avoid-nested-ternaries
      text: Вложенные тернарники лучше выносить в переменную или отдельный компонент ради читаемости
      weight: 1
  misconceptions:
    - "`0` в JSX ничего не рендерит, так же как `false`, поэтому `{items.length && <List />}` безопасен"
    - Хук можно вызывать после условного `return`, если условие редко срабатывает
    - Индекс массива всегда подходит как `key`, даже при фильтрации и перестановке элементов
    - Переключение между разными компонентами в одной позиции сохраняет их состояние
- question: events
  points:
    - id: root-delegation
      text: "React не навешивает обработчики на каждый элемент, а использует делегирование: слушатели висят на корневом контейнере приложения (с React 17 — на root, а не на `document`)"
      weight: 3
    - id: synthetic-event
      text: В обработчик приходит `SyntheticEvent` — кроссбраузерная обёртка над нативным событием с тем же API (`preventDefault`, `stopPropagation`, `target`)
      weight: 3
    - id: pass-function-not-call
      text: Обработчик передаётся как функция в camelCase-пропсе (`onClick={handleClick}`), а не как вызов `handleClick()`; для аргументов используют стрелку `() => remove(id)`
      weight: 2
    - id: prevent-default-explicit
      text: Чтобы отменить действие по умолчанию, нужно явно вызвать `e.preventDefault()` — `return false` в React не работает
      weight: 2
    - id: bubbling-capture-portals
      text: События всплывают по дереву React-компонентов (в том числе из порталов, независимо от положения в DOM), а фаза перехвата задаётся суффиксом `Capture`, например `onClickCapture`
      weight: 1
    - id: onchange-every-input
      text: "`onChange` в React срабатывает на каждый ввод, как нативное `input`, а не при потере фокуса"
      weight: 1
  misconceptions:
    - React навешивает отдельный нативный обработчик на каждый DOM-элемент с `onClick`
    - В современном React нужно вызывать `e.persist()`, потому что объекты событий переиспользуются (event pooling удалён в React 17)
    - Возврат `return false` из обработчика отменяет действие по умолчанию, как в inline-обработчиках HTML
    - Событие из портала всплывает по DOM-дереву, поэтому React-родитель портала его не получит
- question: controlled-vs-uncontrolled
  points:
    - id: controlled-source-of-truth
      text: В контролируемом компоненте значение хранится в state и передаётся через `value`, а изменения приходят через `onChange` — источником истины является React
      weight: 3
    - id: uncontrolled-dom-state
      text: Неконтролируемый компонент хранит значение сам (в DOM), а React читает его при необходимости — через `ref`, `FormData` или form action; начальное значение задаётся через `defaultValue`
      weight: 3
    - id: when-controlled
      text: "Контролируемый подход выбирают, когда UI должен реагировать на каждый ввод: маски, мгновенная валидация, зависимые поля, disabled-кнопка"
      weight: 2
    - id: when-uncontrolled
      text: Неконтролируемый подход подходит для простых форм и интеграции с не-React кодом; `<input type="file">` всегда неконтролируемый, а form actions в React 19 делают этот подход удобным
      weight: 2
    - id: pitfalls-warnings
      text: "`value` без `onChange` делает поле read-only с предупреждением, а переход `value={undefined}` → строка переключает поле из неконтролируемого в контролируемое — поэтому инициализируют пустой строкой"
      weight: 1
    - id: custom-components-rhf
      text: Термин применим и к своим компонентам (поведение задаётся props, а не внутренним state); React Hook Form по умолчанию использует неконтролируемые поля ради производительности
      weight: 1
  misconceptions:
    - Файловый инпут `<input type="file">` можно сделать контролируемым через `value`
    - Неконтролируемые компоненты — устаревший или неправильный подход, всегда нужно использовать контролируемые
    - Передать `value` без `onChange` достаточно, чтобы поле оставалось редактируемым
    - "`value={undefined}` эквивалентен пустой строке и не влияет на режим поля"
- question: fragments
  points:
    - id: no-extra-dom-node
      text: Фрагмент группирует несколько элементов и позволяет вернуть их из компонента, не добавляя лишнего узла-обёртки в DOM
      weight: 3
    - id: key-needs-full-form
      text: У короткого синтаксиса `<>...</>` нельзя указать `key`. Когда нужен `key`, например при рендере списка через `map`, используется полная форма `<Fragment key={...}>`
      weight: 3
    - id: valid-semantic-markup
      text: Лишний `<div>` внутри `<table>`, `<ul>` или `<dl>` ломает валидность HTML, семантику и доступность. Фрагмент позволяет, например, отдать пары `<dt>`/`<dd>` или ячейки `<td>` без обёртки
      weight: 2
    - id: flex-grid-layout
      text: Во flex- и grid-контейнерах раскладка строится по прямым потомкам. Лишняя обёртка ломает раскладку, а фрагмент её сохраняет
      weight: 2
    - id: cleaner-dom
      text: Без лишних обёрток в DOM меньше узлов, поэтому проще стилизация и отладка
      weight: 1
    - id: array-alternative
      text: Альтернатива — вернуть массив элементов, но тогда `key` нужен каждому элементу и запись менее удобна. Поэтому фрагмент обычно предпочтительнее
      weight: 1
  misconceptions:
    - Фрагмент рендерится в DOM как реальный элемент, например `<div>` или `<span>`
    - "`key` можно указать у короткого синтаксиса `<>`"
    - Фрагменту можно передать `className`, `style` или обработчики событий, например `onClick`, — на деле `Fragment` принимает только `key` и `children`
    - Фрагмент мемоизирует детей или заметно ускоряет перерендер, как `memo`
