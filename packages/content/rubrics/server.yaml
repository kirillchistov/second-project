- question: rendering-strategies
  points:
    - id: csr-vs-ssr-where
      text: При CSR сервер отдаёт почти пустой HTML и всё рендерится в браузере после загрузки JS, а при SSR HTML генерируется на сервере на каждый запрос и затем гидрируется на клиенте
      weight: 3
    - id: ssg-isr-build-time
      text: SSG генерирует HTML заранее при сборке, а ISR дополнительно перегенерирует статические страницы в фоне по таймеру или по событию (инвалидации)
      weight: 3
    - id: tradeoffs
      text: "Названы компромиссы: CSR — пустой экран до загрузки JS и хуже SEO; SSR — нагрузка на сервер и TTFB зависит от данных; SSG — данные устаревают до пересборки"
      weight: 2
    - id: choice-criteria
      text: Выбор стратегии зависит от динамичности данных, важности SEO и времени до первого контента; например, для внутренних приложений за логином разумен CSR (например, на Vite)
      weight: 2
    - id: hydration-meaning
      text: Гидрация — React на клиенте строит дерево компонентов, сверяет его с серверной разметкой и навешивает обработчики; до её окончания страница видна, но не интерактивна
      weight: 2
    - id: hybrid-approaches
      text: "Современные подходы смешивают стратегии: Partial Prerendering (статическая оболочка + динамические части со стримингом), Server Components без отправки своего кода на клиент, выборочная гидрация"
      weight: 1
  misconceptions:
    - SSR делает страницу сразу интерактивной — на деле до окончания гидрации обработчики не работают
    - SSG/ISR-страницы рендерятся заново на каждый запрос — на деле HTML готовится заранее и отдаётся из кэша/CDN, ISR обновляет его в фоне
    - При SSR можно свободно обращаться к `window` и `localStorage` во время рендера — это ошибка на сервере или несовпадение гидрации
    - Server Components — это то же самое, что SSR — на деле их код вообще не отправляется на клиент, а SSR-компоненты гидрируются в браузере
- question: server-components
  points:
    - id: server-only-execution
      text: Server Components выполняются только на сервере (или при сборке), и их код не попадает в клиентский бандл
      weight: 3
    - id: async-direct-data
      text: Server Component может быть `async` и напрямую обращаться к БД или файловой системе без API-слоя и `useEffect`
      weight: 2
    - id: use-client-boundary
      text: "Директива `'use client'` помечает модуль-границу: всё, что он импортирует, тоже становится клиентским и гидрируется"
      weight: 3
    - id: rsc-not-ssr
      text: "RSC — не то же самое, что SSR: SSR даёт HTML для первой загрузки с гидрацией всего дерева, а RSC payload передаёт сериализованное дерево (в том числе при навигации), и часть компонентов вообще не попадает на клиент; обычно их используют вместе"
      weight: 2
    - id: serializable-props
      text: Через границу server/client передаются только сериализуемые props (примитивы, объекты, массивы, Date, Map/Set, промисы, JSX, Server Functions), обычные функции и классы — нельзя
      weight: 2
    - id: children-composition
      text: Server Component можно передать в Client Component как `children`, чтобы серверный контент оказался внутри клиентской обёртки
      weight: 1
  misconceptions:
    - RSC — это просто новое название SSR, и все компоненты всё равно гидрируются на клиенте
    - "`'use client'` делает клиентским только тот компонент, где стоит директива, а не весь импортируемый им граф модулей"
    - В Server Components можно использовать `useState`, `useEffect` и обработчики событий вроде `onClick`
    - Из Server Component в Client Component можно передать любую функцию-колбэк как prop
- question: server-functions
  points:
    - id: public-endpoint
      text: Server Function с `'use server'` вызывается с клиента как асинхронная функция, но фреймворк превращает вызов в POST-запрос, то есть по сути это публичный HTTP-эндпоинт, который можно вызвать напрямую
      weight: 3
    - id: auth-inside
      text: Аутентификацию и авторизацию нужно проверять внутри самой функции, а не только скрытием кнопки в UI
      weight: 3
    - id: runtime-validation
      text: Аргументы нужно валидировать в рантайме (Zod/Valibot), потому что TypeScript-типы на сервере не проверяются
      weight: 2
    - id: return-data-leak
      text: Возвращаемое значение уходит клиенту, поэтому нельзя возвращать лишние поля (хэши, внутренние id); секреты также не стоит захватывать замыканием в функции внутри Server Component
      weight: 2
    - id: csrf-rate-limit
      text: Фреймворки обычно защищают от CSRF проверкой Origin, но при своей инфраструктуре это задача разработчика; плюс нужны rate limiting и логирование, как у любого API
      weight: 1
    - id: mutations-not-fetching
      text: Server Functions предназначены для мутаций (формы, Actions), а не для загрузки данных, так как выполняются последовательно; Server Action — это Server Function, переданная в `action` формы или вызванная в transition
      weight: 1
  misconceptions:
    - TypeScript-типы параметров гарантируют корректность входных данных на сервере
    - Если кнопка или форма скрыта от пользователя без прав, функцию нельзя вызвать, и проверка прав на сервере не нужна
    - Server Functions — внутренний вызов, не доступный извне, поэтому их не нужно защищать как API-эндпоинт
    - Server Functions подходят для загрузки данных наравне с fetch в Server Components
- question: streaming-ssr
  points:
    - id: shell-then-chunks
      text: Стриминговый SSR (`renderToPipeableStream` / `renderToReadableStream`) сначала отправляет оболочку страницы с fallback-ами Suspense-границ, а затем дописывает HTML готовых границ по мере готовности данных
      weight: 3
    - id: inline-scripts-swap
      text: Догруженный HTML границы приходит вместе с небольшими инлайн-скриптами, которые вставляют его на место fallback-а без ожидания основного JS
      weight: 2
    - id: selective-hydration
      text: Выборочная гидрация гидрирует Suspense-границы независимо, по мере загрузки их кода, а не всю страницу разом; в первую очередь — ту, с которой взаимодействует пользователь, с последующим воспроизведением события
      weight: 3
    - id: ttfb-benefit
      text: "В отличие от `renderToString`, TTFB не ждёт самых медленных данных: `onShellReady` позволяет начать `pipe` сразу после готовности оболочки"
      weight: 2
    - id: status-headers-limit
      text: Статус-код и заголовки отправляются до того, как известно содержимое отложенных частей; для SEO-ботов или статики можно ждать `onAllReady` либо использовать `prerender` / `prerenderToNodeStream`
      weight: 2
    - id: error-and-abort
      text: "Ошибка внутри Suspense-границы не ломает страницу: отдаётся fallback, рендер повторяется на клиенте, а узнать об ошибке нужно через `onError`; `abort` по таймауту не держит соединение бесконечно"
      weight: 1
  misconceptions:
    - Стриминговый SSR требует загрузить весь клиентский JS, прежде чем начнётся гидрация хотя бы одной части
    - После начала стрима можно поменять статус-код или заголовки ответа, если в отложенной границе произошла ошибка
    - Ошибка в Suspense-границе при стриминге роняет весь ответ так же, как ошибка в оболочке
    - Клик по ещё не гидрированной части теряется — React не может приоритизировать и воспроизвести событие
- question: hydration-mismatch
  points:
    - id: mismatch-definition
      text: Ошибка гидрации возникает, когда HTML, отрендеренный на сервере, не совпадает с результатом первого клиентского рендера
      weight: 3
    - id: typical-causes
      text: "Называет типичные причины: недетерминированные значения (`Date.now()`, `Math.random()`, локаль/часовой пояс), ветвление по `typeof window` или `localStorage` в рендере, невалидная вложенность HTML (`<div>` внутри `<p>`), расширения браузера, меняющие DOM"
      weight: 3
    - id: client-after-mount
      text: "Клиентские значения нужно показывать только после монтирования: первый клиентский рендер совпадает с серверным (например, через `useSyncExternalStore` с `getServerSnapshot` → `false`), либо компонент рендерится только на клиенте (`dynamic(..., { ssr: false })`)"
      weight: 2
    - id: share-server-data
      text: "Сделать оба рендера детерминированными: передавать время запроса и часовой пояс с сервера в props, тему хранить в cookie или ставить класс на `<html>` инлайн-скриптом до гидрации"
      weight: 2
    - id: suppress-limits
      text: "`suppressHydrationWarning` — точечное решение для заведомо разного текста/атрибутов (таймстемп), действует только на один уровень и не исправляет реальные ошибки"
      weight: 2
    - id: react-recovery-cost
      text: При mismatch React перерисовывает дерево на клиенте до ближайшей Suspense-границы — это дорого и может вызывать мигание; в React 19 ошибка выводится одним сообщением с диффом
      weight: 1
  misconceptions:
    - Проверка `typeof window !== 'undefined'` прямо в рендере — правильный способ избежать ошибки гидрации
    - "`suppressHydrationWarning` отключает проверку для всего поддерева и подходит, чтобы скрыть любую ошибку гидрации"
    - Ошибка гидрации — лишь предупреждение в консоли, React просто оставит серверный HTML без последствий
    - Тему из `localStorage` можно безопасно прочитать при первом рендере, так как сервер её тоже увидит
