- question: testing-library
  points:
    - id: test-behavior-not-implementation
      text: Тестируют поведение глазами пользователя (что видно и что происходит при действиях), а не детали реализации — тогда рефакторинг внутренностей не ломает тесты
      weight: 3
    - id: query-priority-by-role
      text: Элементы ищут по ролям и подписям (`getByRole`, `getByLabelText`), а `getByTestId` — в последнюю очередь; если элемент не находится по роли, это часто сигнал о проблеме с доступностью
      weight: 3
    - id: user-event-over-fireevent
      text: Взаимодействие выполняется через `user-event` (`userEvent.setup()`, `await user.click`/`user.type`), потому что он воспроизводит реальную последовательность событий (focus, keydown, input), в отличие от `fireEvent`
      weight: 2
    - id: get-query-find-variants
      text: "`getBy…` бросает ошибку, если элемента нет; `queryBy…` возвращает `null` и подходит для проверки отсутствия; `findBy…` возвращает промис и ждёт появления элемента в асинхронном UI"
      weight: 2
    - id: vitest-why
      text: Vitest в проектах на Vite переиспользует ту же конфигурацию и трансформации, нативно понимает ESM и TypeScript, работает быстрее и имеет Jest-совместимый API (`vi.fn()` вместо `jest.fn()`)
      weight: 2
    - id: avoid-state-css-assertions
      text: "Называет антипаттерн: проверки внутреннего state, вызовов хуков или имён CSS-классов делают тесты хрупкими"
      weight: 1
  misconceptions:
    - Лучше всего искать элементы по `data-testid` или CSS-селекторам — это самый надёжный способ
    - "`fireEvent` и `user-event` эквивалентны, `fireEvent` полностью имитирует действия пользователя"
    - Для проверки отсутствия элемента нужно использовать `getBy…` (на деле он бросит ошибку — нужен `queryBy…`)
    - Enzyme с shallow-рендерингом — актуальный способ тестировать современные React-компоненты
- question: testing-async-msw
  points:
    - id: findby-waitfor
      text: Асинхронное появление UI дожидаются через `findBy…` (или `waitFor`), а не синхронными `getBy…` или ручными задержками
      weight: 3
    - id: msw-http-level
      text: Сеть мокают на уровне HTTP через MSW, который перехватывает реальные запросы, вместо подмены `fetch` или `vi.mock` модулей API
      weight: 3
    - id: server-lifecycle-override
      text: "`setupServer` запускают в `beforeAll`, сбрасывают через `resetHandlers` в `afterEach`, а сценарии вроде ошибки 500 переопределяют в конкретном тесте через `server.use`"
      weight: 2
    - id: fresh-query-client
      text: "На каждый тест создаётся новый `QueryClient` с `retry: false` в обёртке `renderWithProviders`, иначе кэш протекает между тестами"
      weight: 2
    - id: shared-handlers
      text: Одни и те же MSW-обработчики переиспользуются в Node-тестах, Storybook и при локальной разработке в браузере
      weight: 1
    - id: fake-timers-act
      text: "Для debounce используют `vi.useFakeTimers()` с `user-event` и `advanceTimers: vi.advanceTimersByTime`; предупреждение `act(...)` обычно значит, что тест не дождался обновления"
      weight: 1
  misconceptions:
    - Предупреждение `act(...)` лечится оборачиванием всего подряд в `act` или его игнорированием, а не ожиданием результата через `findBy`
    - Внутри `waitFor` можно выполнять клики и другие побочные эффекты — на деле колбэк вызывается многократно
    - MSW работает только в браузере через Service Worker и неприменим в Node-тестах
    - Один общий `QueryClient` на все тесты безопасен и ускоряет прогон
- question: testing-hooks
  points:
    - id: render-hook-result-current
      text: Переиспользуемый хук тестируют отдельно через `renderHook` из `@testing-library/react`, который рендерит хук в тестовом компоненте, а актуальное значение читают из `result.current`
      weight: 3
    - id: act-and-waitfor
      text: Вызовы функций хука, меняющие состояние, оборачивают в `act`, а асинхронный результат ожидают через `waitFor`
      weight: 3
    - id: single-use-via-component
      text: Хук, используемый в одном компоненте, лучше тестировать через этот компонент, потому что такой тест ближе к реальному поведению
      weight: 2
    - id: wrapper-for-context
      text: Провайдеры контекста (например, `QueryClientProvider`) передают в `renderHook` через опцию `wrapper`
      weight: 2
    - id: rerender-and-unmount
      text: "Смену аргументов проверяют через `rerender` с новыми пропсами (хук не должен показывать данные старого аргумента), а очистку — через `unmount()`: таймеры и подписки должны быть сняты"
      weight: 2
    - id: stale-destructuring-fake-timers
      text: "Называет подводные камни: деструктуризация `result.current` фиксирует устаревшее значение; таймеры и debounce тестируют через `vi.useFakeTimers()` и `act(() => vi.advanceTimersByTime(...))`; в тестовом `QueryClient` отключают `retry`"
      weight: 1
  misconceptions:
    - Хук можно вызвать напрямую как обычную функцию в тесте, вне компонента и без `renderHook`
    - Можно один раз деструктурировать `const { count } = result.current` и потом проверять обновлённое значение после `act`
    - "`renderHook` нужно импортировать из отдельного пакета `@testing-library/react-hooks` и в актуальных версиях React"
    - Любой собственный хук обязательно тестировать изолированно, даже если он используется только в одном компоненте
- question: mocking-boundaries
  points:
    - id: mock-boundaries-not-own-code
      text: Мокать нужно границы системы (сеть, время, случайность, браузерные API, которых нет в jsdom), а не собственные модули и компоненты
      weight: 3
    - id: msw-for-network
      text: "Сеть лучше перехватывать на уровне HTTP через MSW: тогда настоящие `fetch`, TanStack Query и обработка ошибок работают как в продакшене"
      weight: 3
    - id: vi-mock-last-resort
      text: "`vi.mock` модуля — крайняя мера (например, для тяжёлых сторонних SDK вроде аналитики или карт): он привязывает тест к структуре импортов и подталкивает проверять вызов мока вместо поведения"
      weight: 2
    - id: time-and-globals
      text: Время подменяется фейковыми таймерами (`vi.useFakeTimers`, `vi.setSystemTime`), а отсутствующие в jsdom API вроде `matchMedia` и `IntersectionObserver` — через `vi.stubGlobal`
      weight: 2
    - id: dependency-injection
      text: "Предпочтительнее мока — внедрение зависимостей: передать `now`, `random`, `storage` или API-клиент параметром или через контекст и подставить реализацию в тесте"
      weight: 1
    - id: reset-between-tests
      text: Моки и обработчики нужно сбрасывать между тестами (`server.resetHandlers()`, `restoreMocks`), иначе тесты зависят от порядка запуска
      weight: 1
  misconceptions:
    - Достаточно проверить `expect(api.get).toHaveBeenCalledWith(...)` — такой тест проходит даже при сломанном UI
    - Лучше всего замокать через `vi.mock` модуль API-клиента или сам `fetch`, чем поднимать MSW
    - Для тестирования таймеров надо вручную подменять `setTimeout` своей функцией
    - Чем больше собственных модулей и дочерних компонентов замокано, тем надёжнее и изолированнее тест
- question: e2e-playwright
  points:
    - id: role-locators
      text: Локаторы строятся по роли и доступному имени/тексту (`getByRole`, при необходимости `getByTestId`), а не по CSS-классам и структуре DOM, которые ломаются при рефакторинге вёрстки
      weight: 3
    - id: web-first-assertions
      text: Используются web-first проверки с автоожиданием (`await expect(locator).toBeVisible()`/`toHaveText`), которые повторяются до выполнения условия или таймаута; `expect(await locator.isVisible()).toBe(true)` проверяет один раз и даёт флаки
      weight: 3
    - id: data-isolation
      text: "Каждый тест изолирован: создаёт свои данные (лучше через API, `request.post`) или использует подготовленное состояние и не зависит от порядка и результатов соседних тестов"
      weight: 2
    - id: no-fixed-timeouts
      text: "Вместо фиксированных пауз `waitForTimeout` ждут конкретного состояния: текста, URL (`toHaveURL`) или ответа сети (`page.waitForResponse`)"
      weight: 2
    - id: auth-storage-state
      text: Аутентификация выполняется один раз в setup-проекте с сохранением `storageState`, остальные тесты стартуют уже залогиненными
      weight: 1
    - id: network-and-trace
      text: "Нестабильные внешние сервисы подменяются через `page.route`, а падения в CI разбираются через trace viewer (`trace: 'on-first-retry'`)"
      weight: 1
  misconceptions:
    - Нестабильность тестов решается добавлением `waitForTimeout`/`sleep` на несколько секунд
    - "`expect(await locator.isVisible()).toBe(true)` ждёт появления элемента так же, как `toBeVisible()`"
    - Лучшие селекторы — CSS-классы или XPath по структуре DOM
    - E2E-тестами нужно покрывать все сценарии и граничные случаи, а не только критичные пути
- question: testing-strategy
  points:
    - id: integration-core
      text: Основную уверенность дают интеграционные тесты компонентов и страниц (Testing Library + MSW с замоканным API) — они проверяют поведение, а не реализацию («тестовый трофей»)
      weight: 3
    - id: layers-by-purpose
      text: "Каждому слою своя задача: unit (Vitest) — для чистой логики (утилиты, редьюсеры, валидация), E2E (Playwright) — только для немногих критичных пользовательских путей вроде регистрации и оплаты"
      weight: 3
    - id: static-foundation
      text: "Фундамент — статический анализ: TypeScript strict и ESLint (правила хуков, a11y-линтер)"
      weight: 2
    - id: confidence-not-coverage
      text: Метрика — уверенность в релизе, а не процент покрытия; погоня за 100% порождает тесты на детали реализации, ломающиеся при рефакторинге
      weight: 2
    - id: extra-layers
      text: "Дополнительные слои: визуальная регрессия для дизайн-системы (Storybook + Chromatic или скриншоты Playwright), проверки доступности, контрактные тесты/сгенерированные из OpenAPI типы"
      weight: 1
    - id: ci-and-flaky
      text: Упоминает организацию запуска (pre-commit — быстрые, PR — всё, nightly — тяжёлые e2e) или борьбу с flaky-тестами (автоожидания Playwright, изоляция данных, ретраи с отчётом)
      weight: 1
  misconceptions:
    - Стратегия строится вокруг большого количества e2e-тестов, потому что они «ближе к пользователю» — на деле это медленно и нестабильно
    - Главный показатель качества тестов — 100% покрытие кода
    - Интеграционные тесты должны ходить в реальный бэкенд, а мокать API нельзя (MSW как раз для изоляции от API)
    - Хорошие тесты проверяют внутреннее состояние и вызовы методов компонента, а не видимое поведение
- question: flaky-tests
  points:
    - id: flaky-harm
      text: "Флаки-тест хуже отсутствия теста: команда привыкает перезапускать CI и пропускает настоящие падения"
      weight: 2
    - id: root-causes
      text: "Называет типичные классы причин: ожидание по таймауту вместо состояния, общее состояние между тестами или зависимость от порядка, реальные время/сеть/случайность, гонки анимаций"
      weight: 3
    - id: fix-cause-not-retry
      text: Лечат воспроизведением и устранением причины (ждать наблюдаемое состояние через web-first проверки, `findBy`/`waitFor`; фейковые таймеры, фиксированный seed, моки сети, сброс состояния), а не бесконечными ретраями и увеличением таймаутов
      weight: 3
    - id: reproduce-loop
      text: Для воспроизведения тест гоняют в цикле без ретраев (`--repeat-each` в Playwright, `--retry=0`), в случайном порядке с фиксированным seed или на медленной машине / с CPU throttling
      weight: 2
    - id: quarantine-owner-deadline
      text: Карантин допустим только временно — с задачей, владельцем и сроком, иначе превращается в кладбище тестов
      weight: 2
    - id: retries-as-signal
      text: Ретраи в CI используются как сигнал для обнаружения (тест помечается нестабильным, ведётся отчёт о самых нестабильных), а не чтобы «позеленить» сборку
      weight: 1
  misconceptions:
    - Достаточно увеличить таймаут или добавить `waitForTimeout`/`sleep`, пока тест не перестанет падать
    - Включить автоматические ретраи в CI — это и есть решение проблемы флаки-тестов
    - Нестабильный тест можно просто отключить или игнорировать без владельца и срока — вреда от этого нет
    - Общий «тестовый пользователь» и разделяемое состояние между тестами безопасны, если тесты проходят в текущем порядке запуска
