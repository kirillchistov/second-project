- question: fetch-http
  points:
    - id: request-response-structure
      text: HTTP-запрос состоит из метода, URL, заголовков и опционального тела, а ответ — из статуса, заголовков и тела (обычно JSON); в браузере запрос делают через `fetch`
      weight: 3
    - id: fetch-no-reject-on-http-errors
      text: "`fetch` отклоняет промис только при сетевой ошибке, поэтому статусы 4xx/5xx нужно проверять вручную через `response.ok` или `response.status`"
      weight: 3
    - id: status-groups
      text: "Статусы делятся на группы: 2xx — успех, 3xx — перенаправление, 4xx — ошибка клиента, 5xx — ошибка сервера; кандидат приводит примеры вроде `401` против `403` или `404`"
      weight: 2
    - id: methods-semantics-idempotency
      text: "`GET` только читает и кэшируется, `PUT` заменяет ресурс целиком, `PATCH` — частично; `GET`/`PUT`/`DELETE` идемпотентны, а повтор `POST` может создать дубликат"
      weight: 2
    - id: json-body-and-parsing-pitfall
      text: "Для отправки JSON нужны заголовок `Content-Type: application/json` и `JSON.stringify`, а `res.json()` падает с `SyntaxError` на ответе `204` или HTML-странице ошибки"
      weight: 1
    - id: react-data-libraries
      text: "В React запросы обычно не пишут голым `fetch` в `useEffect`: чтение берут на себя TanStack Query, загрузчики роутера или Server Components, изменения — мутации или Actions"
      weight: 1
  misconceptions:
    - "`fetch` сам выбрасывает исключение (отклоняет промис) на ответах 404 или 500"
    - "`401` и `403` означают одно и то же — «нет доступа» (на деле `401` — не аутентифицирован, `403` — аутентифицирован, но нет прав)"
    - "`POST` идемпотентен и его можно безопасно повторять, как `GET`"
    - "`PUT` и `PATCH` взаимозаменяемы — оба частично обновляют ресурс"
- question: cors
  points:
    - id: same-origin-response-read
      text: "По умолчанию действует same-origin policy: кросс-доменный запрос уходит, но браузер не даёт скрипту прочитать ответ, пока сервер не вернёт `Access-Control-Allow-Origin` с разрешённым origin"
      weight: 3
    - id: origin-definition
      text: Origin — это схема, домен и порт вместе; отличие любого из них (например, `app.example.com` и `api.example.com`) делает запрос кросс-доменным
      weight: 2
    - id: browser-not-server-protection
      text: "CORS защищает пользователя в браузере, а не сервер: curl и бэкенд-клиенты CORS не проверяют, а разрешение даёт сервер своими заголовками"
      weight: 3
    - id: preflight-options
      text: Непростые запросы (например, `PUT`, JSON-тело, свои заголовки вроде `authorization`) сначала проходят preflight — запрос `OPTIONS` с `Access-Control-Request-Method`/`-Headers`, а простые `GET`/`POST` с form-типами уходят сразу
      weight: 2
    - id: fix-server-or-proxy
      text: "Чинят на сервере (явный список разрешённых origin) или убирают кросс-доменность: прокси dev-сервера (`server.proxy` в Vite) или фронт и API за одним доменом через reverse proxy/BFF"
      weight: 2
    - id: credentials-no-wildcard
      text: "Для cookies нужны `credentials: 'include'` на клиенте и `Access-Control-Allow-Credentials: true` на сервере, и тогда `Access-Control-Allow-Origin: *` запрещён — нужен конкретный origin"
      weight: 1
  misconceptions:
    - CORS блокирует отправку запроса на сервер (на деле простой запрос доходит до сервера, браузер блокирует лишь чтение ответа скриптом)
    - "CORS можно отключить на клиенте через `mode: 'no-cors'` (это даёт непрозрачный ответ, который скрипт не может прочитать)"
    - CORS защищает сервер/API от чужих запросов или от CSRF
    - Безопасно настроить сервер так, чтобы он отражал любой входящий `Origin` или ставил `*` вместе с credentials
- question: web-storage
  points:
    - id: cookies-sent-to-server
      text: Cookies автоматически отправляются на сервер с каждым запросом к своему домену, поэтому подходят для сессии; `localStorage`, `sessionStorage` и IndexedDB на сервер не уходят
      weight: 3
    - id: httponly-for-tokens
      text: "Токены и сессию хранят в cookie с `HttpOnly` (плюс `Secure`, `SameSite`): такую cookie нельзя прочитать из JS, поэтому при XSS её не украсть, а Web Storage доступен любому скрипту на странице"
      weight: 3
    - id: local-vs-session-lifetime
      text: "`localStorage` хранит данные бессрочно, `sessionStorage` — пока открыта вкладка; оба синхронные, объёмом около 5 МБ, подходят для настроек UI и черновиков"
      weight: 2
    - id: indexeddb-async-large
      text: IndexedDB — асинхронная база для больших объёмов (сотни МБ) и офлайн-данных, обычно через обёртку вроде `idb` или Dexie
      weight: 2
    - id: strings-only
      text: Web Storage хранит только строки, поэтому объекты сериализуют через `JSON.stringify`/`JSON.parse`, а парсинг оборачивают в `try/catch` на случай битых данных
      weight: 1
    - id: no-storage-on-ssr
      text: "На сервере при SSR `localStorage` нет: обращаться к нему нужно только на клиенте, иначе SSR падает или возникают ошибки гидрации"
      weight: 1
  misconceptions:
    - "`localStorage` надёжно защищён и подходит для хранения access/refresh токенов"
    - "`localStorage` и `sessionStorage` автоматически отправляются на сервер вместе с запросами, как cookies"
    - В `localStorage` можно напрямую положить объект или число и получить их обратно того же типа
    - Cookie с флагом `HttpOnly` можно прочитать через `document.cookie`
- question: abort-controller
  points:
    - id: signal-to-fetch-abort
      text: Создаётся `new AbortController()`, его `controller.signal` передаётся в опции `fetch`, а вызов `controller.abort()` отменяет запрос.
      weight: 3
    - id: abort-error-reject
      text: После `abort()` промис `fetch` реджектится с ошибкой `name === 'AbortError'`. Её нужно отфильтровать в `catch`, иначе пользователь увидит ложную ошибку вместо тихой отмены.
      weight: 3
    - id: effect-cleanup-abort
      text: В React контроллер создаётся внутри `useEffect`, а `controller.abort()` вызывается в cleanup. Так при смене зависимости (например, `id`) или размонтировании устаревший ответ не попадёт в `setUser` и не перезапишет данные.
      weight: 2
    - id: server-not-stopped
      text: "`abort()` не останавливает обработку запроса на сервере, если запрос уже ушёл. Клиент перестаёт ждать и обрабатывать ответ и обрывает соединение, если браузер его ещё держит."
      weight: 2
    - id: one-controller-many-fetch
      text: Один `signal` можно передать в несколько `fetch`, и один вызов `abort()` отменит их все. Это удобно при параллельной загрузке ресурсов страницы.
      weight: 1
    - id: timeout-combination
      text: Упоминает совмещение отмены с таймаутом, например через `setTimeout(() => controller.abort(), ms)` или `AbortSignal.timeout(ms)`.
      weight: 1
  misconceptions:
    - "`abort()` останавливает или откатывает обработку запроса на сервере."
    - После `abort()` промис `fetch` резолвится (например, с `undefined`) или просто «зависает», а не реджектится с `AbortError`.
    - Можно один раз создать контроллер вне эффекта и переиспользовать его. На деле после `abort()` сигнал навсегда остаётся отменённым, и последующие `fetch` с ним сразу падают.
    - "`AbortController` — это универсальная отмена любого промиса. На деле он работает только с API, которые принимают и слушают `signal`."
- question: fetch-error-handling
  points:
    - id: reject-only-network
      text: "Промис `fetch` реджектится только при сетевой ошибке: нет соединения, DNS не резолвится, CORS заблокировал ответ"
      weight: 3
    - id: http-errors-resolve
      text: Ответ со статусом 404 или 500 — это выполненный (resolved) промис с `response.ok === false`, а не реджект
      weight: 3
    - id: check-response-ok
      text: "`response.ok` (или `response.status`) нужно проверять явно и при ошибке самому бросать исключение, иначе ошибки сервера пройдут как успех"
      weight: 2
    - id: try-catch-not-enough
      text: "Обёртка `fetch` в `try/catch` не ловит HTTP-ошибки: без проверки `ok` код распарсит тело ошибки как успешные данные"
      weight: 2
    - id: json-parse-non-json
      text: Если при ошибке сервер вернул не JSON (например, HTML-страницу 502 от прокси), `response.json()` упадёт с ошибкой парсинга — стоит проверять статус и `Content-Type` до парсинга
      weight: 1
  misconceptions:
    - "`fetch` реджектит промис при статусах 4xx/5xx, поэтому `catch` поймает 404 и 500"
    - Ошибка CORS возвращается как обычный ответ с кодом ошибки, который можно прочитать в `response.status`
    - "`fetch` ведёт себя как `axios` и сам выбрасывает ошибку при неуспешном HTTP-статусе"
    - "`response.json()` безопасно вызывать до проверки статуса, так как тело всегда будет JSON"
- question: fetch-vs-axios
  points:
    - id: fetch-error-semantics
      text: "`fetch` реджектит промис только при сетевой ошибке. Ответы 4xx/5xx он резолвит, поэтому нужно проверять `response.ok`. `axios` по умолчанию реджектит промис на ошибочном статусе."
      weight: 3
    - id: fetch-low-level-axios-features
      text: "`fetch` — встроенный низкоуровневый API: в нём нет интерсепторов, автопарсинга JSON (нужен `response.json()`) и готового таймаута. `axios` добавляет интерсепторы, автоматический JSON и прогресс загрузки."
      weight: 3
    - id: thin-wrapper-enough
      text: "Для простого приложения с парой запросов хватает `fetch` или тонкой обёртки над ним: проверка `response.ok`, базовый URL, токен, типизация. Тянуть зависимость ради этого не нужно."
      weight: 2
    - id: interceptors-justify-library
      text: Библиотека оправдана, когда нужны сквозные интерсепторы, например подстановка токена и обработка 401 в одном месте для всех запросов.
      weight: 2
    - id: query-libs-make-client-secondary
      text: Если кэширование и инвалидация решены на уровне RTK Query или TanStack Query, выбор HTTP-клиента почти не важен. Эти библиотеки по умолчанию работают поверх `fetch`.
      weight: 1
    - id: alternatives-and-legacy
      text: Кандидат упоминает альтернативы с готовыми интерсепторами (`ky`) или поддержку старых сред без `fetch` как редкий аргумент за `axios`.
      weight: 1
  misconceptions:
    - "`fetch` реджектит промис на ответах 404/500, поэтому HTTP-ошибки ловятся в `catch` так же, как в `axios`."
    - Запрос через `fetch` вообще нельзя отменить. На самом деле отмена работает через `AbortController`/`AbortSignal`.
    - "`axios` нужен, чтобы работать с JSON. На деле с `fetch` это одна строка `await response.json()`."
    - "`axios` по умолчанию не реджектит промис на 4xx/5xx, и статус тоже нужно проверять вручную."
- question: fetch-formdata
  points:
    - id: use-formdata-body
      text: Для файлов и смешанных полей тело запроса собирают через `FormData` (`append` файла и полей) и передают его в `body` у `fetch`, а не сериализуют через `JSON.stringify`
      weight: 3
    - id: no-manual-content-type
      text: "Заголовок `Content-Type` вручную не указывают: браузер сам выставит `multipart/form-data` с boundary, а без boundary сервер не распарсит тело"
      weight: 3
    - id: formdata-from-form
      text: "`FormData` можно собрать прямо из DOM-формы через `new FormData(formElement)`, при этом попадают поля с атрибутом `name`"
      weight: 2
    - id: json-field-stringify
      text: Вложенные JSON-данные внутри multipart-запроса передают отдельным полем, сериализованным в строку через `JSON.stringify`
      weight: 1
    - id: no-upload-progress
      text: У `fetch` нет событий прогресса загрузки; для прогресс-бара используют `XMLHttpRequest` с событием `progress` или библиотеку поверх него (например, `axios`)
      weight: 2
  misconceptions:
    - "Нужно вручную выставить заголовок `Content-Type: multipart/form-data` при отправке `FormData`"
    - Файл можно отправить, положив его в объект и передав через `JSON.stringify`
    - Прогресс загрузки файла можно отследить через события или промис `fetch`
    - "`new FormData(form)` включает поля формы без атрибута `name`"
- question: rest-api-design
  points:
    - id: resources-nouns-methods
      text: "API строится вокруг ресурсов: URL — существительные во множественном числе (`/orders/42/items`), действие задаёт HTTP-метод, а не глагол в пути"
      weight: 3
    - id: status-codes-semantics
      text: Результат передаётся корректным статус-кодом (`201` + `Location` при создании, `204` при удалении, `422`/`400` для валидации, `401` против `403`, `409` для конфликта состояния), а не `200` с ошибкой в теле
      weight: 3
    - id: unified-error-format
      text: Ошибки возвращаются в едином формате по всему API (например, RFC 9457 Problem Details) с указанием полей при ошибке валидации
      weight: 2
    - id: cursor-vs-offset-pagination
      text: Пагинация и фильтрация — через query-параметры; offset прост, но медленный на больших таблицах и «прыгает» при вставках, cursor стабилен и подходит для лент
      weight: 2
    - id: versioning-compat
      text: Версионирование через `/v1` в пути или заголовок; добавление полей совместимо без новой версии, удаление и переименование — ломающие изменения
      weight: 2
    - id: idempotency-etag-openapi
      text: Упоминает идемпотентность повторяемых запросов, оптимистическую блокировку через `ETag` + `If-Match` (`412`) или описание контракта в OpenAPI с генерацией клиентских типов
      weight: 1
  misconceptions:
    - Нормально класть глаголы в URL (`/getOrders`, `/createOrder`) — это и есть REST
    - Можно всегда отвечать `200 OK`, а ошибку передавать полем `error` в теле
    - "`401` и `403` взаимозаменяемы — оба означают «нет доступа»"
    - Удаление или переименование поля в ответе не требует новой версии API, если клиенты обновятся
- question: oauth-oidc
  points:
    - id: oauth-vs-oidc
      text: OAuth 2.0 — делегирование доступа (токен на действия от имени пользователя без его пароля), а OpenID Connect поверх него добавляет аутентификацию через `id_token` (JWT) с данными о вошедшем пользователе
      weight: 3
    - id: auth-code-flow-steps
      text: "Описан Authorization Code Flow: редирект на `/authorize` с `client_id`, `redirect_uri`, `scope`, `state`; провайдер возвращает `code` на `redirect_uri`; клиент меняет `code` на токены через POST `/token`"
      weight: 3
    - id: pkce-purpose
      text: "PKCE: клиент генерирует `code_verifier` и отправляет `code_challenge = SHA256(code_verifier)`; перехваченный `code` бесполезен без `code_verifier`, что защищает публичных клиентов (SPA, мобильные) без секрета"
      weight: 2
    - id: state-csrf
      text: "Параметр `state` проверяется при возврате и защищает от CSRF: без него атакующий может подсунуть свой `code` и залогинить жертву в чужой аккаунт"
      weight: 2
    - id: token-purposes
      text: "`id_token` нужен клиенту, чтобы узнать пользователя, и не отправляется в API; `access_token` — для API, которое проверяет подпись, `aud`, `iss` и `exp`"
      weight: 2
    - id: bff-storage
      text: "Обмен `code` надёжнее делать на своём сервере (BFF): токены остаются на сервере, браузер получает `HttpOnly` cookie сессии, тогда как токены в `localStorage` уязвимы при XSS"
      weight: 1
  misconceptions:
    - OAuth 2.0 сам по себе является протоколом аутентификации и сообщает, кто пользователь
    - Implicit flow — рекомендуемый способ для SPA, а PKCE нужен только серверным приложениям
    - "`id_token` можно отправлять в API как токен доступа"
    - Достаточно проверить подпись `access_token`, проверка `aud` не обязательна
- question: http-caching
  points:
    - id: cache-control-directives
      text: "Свежесть задаётся заголовком `Cache-Control`: `max-age` — время свежести для браузера, `s-maxage` — для общих кэшей (CDN), `no-store` — не хранить вовсе"
      weight: 3
    - id: conditional-request-304
      text: После истечения свежести (или при `no-cache`) браузер делает условный запрос с `If-None-Match` по `ETag` и при неизменном ресурсе получает `304 Not Modified` без тела
      weight: 3
    - id: spa-hashed-assets-html
      text: Для SPA ассеты с хэшем в имени отдают с `max-age=31536000, immutable`, а `index.html` — с `no-cache`, чтобы после деплоя подтянулись новые ассеты
      weight: 2
    - id: private-personal-data
      text: Ответы с персональными данными помечают `private`, чтобы их не сохранил CDN и не отдал другим пользователям
      weight: 2
    - id: stale-while-revalidate
      text: "`stale-while-revalidate` позволяет мгновенно отдать устаревший ответ из кэша и обновить его в фоне"
      weight: 1
    - id: vary-and-invalidation
      text: "`Vary` указывает, по каким заголовкам запроса (`Accept-Encoding`, `Accept-Language`) различать варианты в кэше; при деплое и изменении данных CDN инвалидируют по путям или тегам"
      weight: 1
  misconceptions:
    - "`no-cache` означает «не кэшировать вовсе» (на деле это `no-store`, а `no-cache` требует перепроверки у сервера перед использованием)"
    - "`index.html` можно кэшировать надолго так же, как ассеты (пользователь застрянет на старом HTML со ссылками на удалённые ассеты)"
    - "`304 Not Modified` возвращает ответ заново целиком (на деле тело не передаётся, браузер берёт версию из своего кэша)"
    - "`max-age` управляет временем хранения на CDN так же, как `s-maxage`, и `s-maxage` влияет на браузер (на деле `s-maxage` действует только для общих кэшей)"
- question: node-event-loop
  points:
    - id: single-thread-libuv
      text: JavaScript в Node.js выполняется в одном потоке, а ввод-вывод (сеть, диск, таймеры) асинхронно выполняет libuv. Колбэки по готовности возвращаются в главный поток через event loop.
      weight: 3
    - id: blocking-stalls-all
      text: Пока синхронный код занимает поток (тяжёлый цикл, `pbkdf2Sync`, `JSON.parse` огромных данных), сервер не обслуживает ни один другой запрос, поэтому зависает весь процесс.
      weight: 3
    - id: loop-phases
      text: "Event loop по кругу проходит фазы: таймеры, ожидающие колбэки, poll (ввод-вывод), check (`setImmediate`), close."
      weight: 2
    - id: microtasks-order
      text: Между колбэками выполняются сначала `process.nextTick`, затем микрозадачи промисов. Поэтому они срабатывают раньше `setTimeout(fn, 0)` и `setImmediate`.
      weight: 2
    - id: offload-cpu-work
      text: "CPU-тяжёлую работу выносят из главного потока: в `worker_threads`, в очередь задач с отдельными воркерами или в отдельный сервис. Можно также взять асинхронные версии API, которые работают в пуле потоков libuv."
      weight: 2
    - id: diagnostics-starvation
      text: Кандидат упоминает диагностику или подводные камни. Например, задержку цикла можно измерить через `monitorEventLoopDelay` из `perf_hooks`. Рекурсивный `process.nextTick` или бесконечная цепочка микрозадач «голодит» event loop, и ввод-вывод не обрабатывается.
      weight: 1
  misconceptions:
    - Асинхронность Node.js означает параллельное выполнение JavaScript-кода в нескольких потоках, поэтому тяжёлые вычисления в обработчике не мешают другим запросам.
    - "`setTimeout(fn, 0)` выполняется раньше `process.nextTick` и промисов или сразу после синхронного кода."
    - Порядок `setTimeout(fn, 0)` и `setImmediate` в главном модуле всегда гарантирован.
    - Обернуть синхронный CPU-тяжёлый код в `async` функцию или `Promise` достаточно, чтобы он перестал блокировать поток.
- question: fetch-timeout
  points:
    - id: abort-controller-timer
      text: "У `fetch` нет параметра `timeout`. Таймаут делают так: создают `AbortController`, передают `controller.signal` в `fetch`, а `setTimeout` вызывает `controller.abort()`, если ответ не пришёл за отведённое время."
      weight: 3
    - id: clear-timer
      text: Если ответ пришёл раньше, таймер сбрасывают через `clearTimeout`, обычно в блоке `finally`, чтобы он сработал и при успехе, и при ошибке.
      weight: 2
    - id: abort-signal-timeout
      text: "Есть готовый хелпер `AbortSignal.timeout(ms)`: он создаёт сигнал, который сам срабатывает через `ms` миллисекунд. Запись `fetch(url, { signal: AbortSignal.timeout(5000) })` заменяет ручную связку, отдельные `setTimeout` и `clearTimeout` не нужны."
      weight: 2
    - id: server-keeps-working
      text: "Таймаут на клиенте не отменяет работу на сервере: начатая операция, например запись в базу, продолжится, клиент просто перестаёт ждать ответ. Для настоящей отмены сервер тоже должен её поддерживать."
      weight: 2
    - id: rejection-error-type
      text: "После срабатывания сигнала промис `fetch` отклоняется с `DOMException`: при ручном `abort()` это `AbortError`, при `AbortSignal.timeout` — `TimeoutError`. Такие ошибки обрабатывают в `catch` и отличают от сетевых."
      weight: 1
  misconceptions:
    - У `fetch` есть опция `timeout` в параметрах запроса, как в axios или XHR.
    - Вызов `abort()` на клиенте останавливает или откатывает операцию на сервере, например запись в базу.
    - "`Promise.race` с промисом-таймером отменяет сам HTTP-запрос. На деле он только перестаёт ждать ответ, а запрос продолжает выполняться, если не передан `signal`."
    - Неочищенный `setTimeout` после успешного ответа сломает результат или вызовет ошибку. На деле лишний `abort()` на уже отработавший контроллер безвреден, он просто мусорит.
- question: fetch-retry-backoff
  points:
    - id: retry-transient-only
      text: "Повторять стоит только временные ошибки: сетевой обрыв, 503, 429. Ошибки вроде 400 или 404 повторять бессмысленно, потому что ответ не изменится."
      weight: 3
    - id: exponential-backoff-jitter
      text: Пауза между попытками растёт экспоненциально (например, `2 ** i * base`). К ней добавляется случайный разброс (jitter), чтобы ретраи многих клиентов не ударили по восстановившемуся серверу одновременно.
      weight: 3
    - id: idempotency-required
      text: Ретраи безопасны для идемпотентных запросов (`GET`, `PUT`, `DELETE`). `POST` можно повторять только при ключе идемпотентности или иной защите от дублей на сервере, иначе повтор создаст дубликат операции, например второй заказ.
      weight: 2
    - id: respect-retry-after
      text: Если сервер прислал заголовок `Retry-After` при 429 или 503, паузу берут из него, а не из собственного расчёта.
      weight: 2
    - id: limit-attempts
      text: Число попыток (и/или общее время ожидания) ограничено. После исчерпания попыток выбрасывается ошибка, а не идёт бесконечный цикл.
      weight: 1
    - id: fetch-status-vs-network
      text: "`fetch` отклоняет промис только при сетевой ошибке, а HTTP-статусы ошибок нужно проверять отдельно через `res.ok`/`res.status`. Поэтому сетевые сбои ловятся в `catch`, а статусы анализируются вручную."
      weight: 1
  misconceptions:
    - Повторять нужно любую неудачу, включая 400/404 и другие 4xx.
    - Любой `POST` можно безопасно повторить, сервер сам разберётся с дублями.
    - Фиксированная пауза без jitter достаточна, синхронизация клиентов не создаёт проблем.
    - "`fetch` сам выбрасывает исключение на ответы 404/500, поэтому достаточно `try/catch` без проверки `res.ok`."
- question: fetch-credentials
  points:
    - id: default-same-origin
      text: "По умолчанию `fetch` использует `credentials: 'same-origin'` и отправляет cookies только в запросах на тот же origin."
      weight: 3
    - id: include-for-cross-origin
      text: "Чтобы cookies ушли в кросс-доменный запрос, на клиенте нужно явно указать `credentials: 'include'`, иначе cookie просто не отправится."
      weight: 3
    - id: server-cors-headers
      text: "Сервер должен ответить `Access-Control-Allow-Credentials: true` и указать конкретный origin в `Access-Control-Allow-Origin`: комбинацию с `*` браузер отклонит."
      weight: 2
    - id: cors-blocks-response
      text: Если нужных CORS-заголовков нет, браузер не отдаст ответ скрипту. Это ограничение политики CORS, а не самого `fetch`.
      weight: 2
    - id: samesite-attribute
      text: Атрибут cookie `SameSite` (`Lax`/`Strict`/`None`) независимо от `credentials` влияет на отправку cookie. Поддомены одного домена браузер считает «тем же сайтом», поэтому для API на поддомене обычно достаточно `SameSite=Lax`.
      weight: 1
  misconceptions:
    - "`fetch` по умолчанию вообще никогда не отправляет cookies, даже на тот же origin."
    - "`Access-Control-Allow-Origin: *` можно использовать вместе с `Access-Control-Allow-Credentials: true`."
    - "Достаточно указать `credentials: 'include'` на клиенте, и серверная настройка CORS не нужна."
    - "С `credentials: 'include'` cookie отправится всегда, независимо от атрибута `SameSite`."
- question: fetch-headers-content-type
  points:
    - id: json-needs-explicit-content-type
      text: "Для строкового тела (`JSON.stringify(...)`) `fetch` не ставит `application/json`, поэтому `Content-Type: application/json` нужно указать явно. Иначе сервер не распознает JSON, и тело придёт нераспарсенным или как `undefined`."
      weight: 3
    - id: formdata-auto-boundary
      text: "Для `FormData` браузер сам выставляет `multipart/form-data` с `boundary`. Указывать `Content-Type` вручную нельзя: потеряется `boundary`, и сервер не разберёт части запроса."
      weight: 3
    - id: string-body-text-plain
      text: Для строкового тела без заголовка браузер по умолчанию отправляет `text/plain;charset=UTF-8`. Поэтому JSON-парсер на сервере такой запрос не обрабатывает.
      weight: 1
    - id: accept-for-multiple-formats
      text: Заголовок `Accept` нужен, когда сервер умеет отдавать разные форматы (например, JSON или CSV). Без него сервер вернёт формат по умолчанию.
      weight: 2
    - id: forbidden-headers
      text: "Часть заголовков браузер не даёт выставить из кода ради безопасности: `Content-Length`, `Host`, `Cookie`. Через `headers` их задать нельзя, браузер ставит их сам."
      weight: 2
  misconceptions:
    - "`fetch` сам ставит `Content-Type: application/json`, если в `body` передана JSON-строка или объект"
    - "Для `FormData` нужно вручную указать `Content-Type: multipart/form-data`"
    - Заголовки `Cookie`, `Host` или `Content-Length` можно свободно задать через опцию `headers` в `fetch`
    - Без заголовка `Accept` сервер вернёт ошибку или не вернёт JSON вообще
- question: sse-vs-websocket
  points:
    - id: sse-unidirectional-http
      text: SSE — однонаправленный поток событий от сервера к клиенту поверх обычного HTTP; клиент не может отправлять данные через это же соединение
      weight: 3
    - id: ws-bidirectional
      text: "WebSocket — двунаправленный канал: и клиент, и сервер могут слать сообщения через одно соединение"
      weight: 3
    - id: sse-auto-reconnect
      text: "`EventSource` переподключается автоматически силами браузера, а в WebSocket встроенного автореконнекта нет, его приходится писать самому"
      weight: 2
    - id: use-cases
      text: SSE достаточно, когда клиент только слушает (уведомления, прогресс долгой операции, лента обновлений); WebSocket нужен, когда клиент тоже активно шлёт данные (чат, совместное редактирование, игры)
      weight: 2
    - id: sse-simpler-text-only
      text: SSE проще в серверной реализации и проходит через обычные прокси, но передаёт только текст — для бинарных данных нужен WebSocket
      weight: 1
    - id: long-polling-tradeoff
      text: "Long polling — третий вариант на обычных HTTP-запросах: проще в инфраструктуре, но даёт большую задержку и накладные расходы на каждое новое соединение"
      weight: 1
  misconceptions:
    - SSE позволяет клиенту отправлять сообщения серверу через то же соединение
    - WebSocket сам автоматически переподключается после обрыва, как `EventSource`
    - SSE умеет передавать бинарные данные так же, как WebSocket
    - SSE требует отдельного протокола и специальной поддержки прокси, как WebSocket, а не работает поверх обычного HTTP
- question: websocket-auth
  points:
    - id: no-custom-headers
      text: Браузерный конструктор `WebSocket` не позволяет задать произвольные заголовки, поэтому передать `Authorization` с токеном в хендшейке напрямую нельзя
      weight: 3
    - id: transport-options
      text: "Называет рабочие способы передачи учётных данных: query-параметр URL (`?token=...`), subprotocol-заголовок (`Sec-WebSocket-Protocol`) или cookie, которую браузер сам приложит к хендшейку"
      weight: 3
    - id: query-token-leaks
      text: Токен в query-параметре может осесть в логах сервера и прокси, а также в истории, поэтому долгоживущий секрет так передавать не стоит
      weight: 2
    - id: first-message-auth
      text: "Альтернатива: открыть соединение без токена, отправить токен первым сообщением после `onopen` и не слать остальные данные до подтверждения от сервера"
      weight: 2
    - id: token-expiry-mid-connection
      text: "Учитывает истечение токена в долгом соединении: сервер периодически проверяет его свежесть или закрывает соединение кодом, по которому клиент переавторизуется и переподключается с новым токеном"
      weight: 1
  misconceptions:
    - В браузере можно передать заголовок `Authorization` в конструктор `WebSocket` через опции, как в `fetch`
    - Если токен проверен при хендшейке, о его истечении во время открытого соединения можно не думать
    - Токен в query-параметре при `wss://` полностью безопасен, так как URL шифруется и нигде не сохраняется
    - Cookie к WebSocket-хендшейку браузер не прикладывает, поэтому cookie-аутентификация для WebSocket невозможна
- question: api-styles
  points:
    - id: choose-by-clients
      text: "Выбор определяется клиентами: публичный API для партнёров — REST (с OpenAPI), много разнородных клиентов (веб, мобильное, виджеты) — GraphQL, один TypeScript-фронтенд и бэкенд в монорепо — tRPC (или Server Functions)"
      weight: 3
    - id: core-tradeoffs
      text: REST опирается на ресурсы и HTTP-семантику и прост для любых клиентов; GraphQL даёт один эндпоинт со схемой, где клиент сам выбирает поля, что решает over- и under-fetching
      weight: 3
    - id: caching-difference
      text: REST бесплатно использует HTTP-кэш и CDN, а GraphQL обычно идёт через `POST` и требует нормализованного клиентского кэша или persisted queries
      weight: 2
    - id: trpc-types-internal
      text: tRPC передаёт типы сервера клиенту напрямую через `typeof appRouter` без схемы и кодогенерации, но это внутренний API, а не публичный контракт
      weight: 2
    - id: graphql-server-risks
      text: "GraphQL легко порождает N+1 в резолверах и тяжёлые запросы: нужны DataLoader и лимиты глубины и сложности запросов, иначе один запрос может положить сервер"
      weight: 2
    - id: trpc-auth-validation
      text: tRPC-эндпоинты — обычные публичные HTTP-эндпоинты, поэтому авторизация и валидация входа (например, через `zod`) обязательны, даже если их вызывает только свой фронтенд
      weight: 1
  misconceptions:
    - tRPC подходит как публичный API для сторонних партнёров и клиентов на других языках
    - GraphQL кэшируется через HTTP/CDN так же просто, как REST
    - tRPC-эндпоинты внутренние и недоступны извне, поэтому авторизация и валидация входа на них не нужны
    - GraphQL автоматически решает проблемы производительности и не порождает N+1
- question: bff-pattern
  points:
    - id: client-owned-layer
      text: "BFF — серверный слой, принадлежащий конкретному фронтенду (клиенту): им владеет фронтенд-команда, он меняется вместе с UI, и у каждого типа клиента (веб, мобильное приложение) может быть свой BFF"
      weight: 3
    - id: aggregation-screen-shape
      text: BFF агрегирует данные из нескольких сервисов в один ответ в форме, удобной конкретному экрану (переименование, отсечение лишних полей), сокращая число запросов с клиента — это особенно важно на мобильных сетях
      weight: 3
    - id: tokens-on-server
      text: "Токены и ключи сервисов хранятся в BFF, а не в браузере: клиент получает только `HttpOnly` cookie сессии (паттерн token handler)"
      weight: 2
    - id: no-business-logic
      text: В BFF должны быть только композиция и адаптация данных; бизнес-правила (расчёт цены, права) в нём дублируют сервисы и расходятся с ними, превращая BFF во «второй бэкенд»
      weight: 2
    - id: cost-and-resilience
      text: "Называет цену паттерна (ещё один сервис для деплоя, мониторинга и масштабирования, дублирование между несколькими BFF) и/или его роль в устойчивости: таймауты, кэш, мягкая деградация при падении некритичного сервиса, параллельные вызовы вместо последовательных"
      weight: 1
    - id: server-components-as-bff
      text: В Next.js и других фреймворках с серверными компонентами роль BFF часто берут на себя Server Components и Server Functions
      weight: 1
  misconceptions:
    - BFF — это то же самое, что общий API Gateway для всех клиентов, которым владеет бэкенд-команда
    - Основная бизнес-логика (расчёт цен, проверка прав) должна жить в BFF, ведь он ближе к UI
    - BFF всегда ускоряет загрузку, даже если вызывает сервисы последовательно — на деле последовательные вызовы делают его медленнее прямых запросов
    - С BFF токены доступа к сервисам по-прежнему нужно хранить в браузере, например в `localStorage`
- question: database-for-frontend
  points:
    - id: index-avoids-seq-scan
      text: "Без индекса по полю фильтрации или сортировки база читает всю таблицу (`Seq Scan`); составной индекс работает слева направо: `(user_id, created_at)` помогает фильтру по `user_id`, но не по одному `created_at`"
      weight: 3
    - id: n-plus-one-fix
      text: N+1 — это один запрос за списком из N записей и ещё N запросов за связанными данными; решается через JOIN/`include` или пакетную загрузку, а увидеть его помогает лог SQL в ORM
      weight: 3
    - id: transaction-atomicity
      text: Транзакция гарантирует, что несколько изменений (например, списание остатка и создание заказа) применятся вместе или не применятся вовсе
      weight: 2
    - id: read-check-write-race
      text: "«Прочитать, проверить в коде, записать» без транзакции и блокировки или условного `UPDATE` (`stock >= qty`) даёт гонку: последний товар продадут дважды"
      weight: 2
    - id: explain-and-index-cost
      text: Использование индекса проверяют через `EXPLAIN ANALYZE` (`Index Scan` против `Seq Scan`); индексы не бесплатны — замедляют запись и занимают место
      weight: 1
    - id: cursor-pagination-pool-migrations
      text: "Знает смежные практики: курсорная пагинация вместо глубокого `OFFSET`, пул соединений (их число ограничено), многошаговые миграции без простоя"
      weight: 1
  misconceptions:
    - Чем больше индексов, тем лучше — индексы ускоряют всё и ничего не стоят
    - Индекс `(user_id, created_at)` ускоряет запрос с фильтром только по `created_at`
    - ORM автоматически избавляет от N+1, поэтому о запросах думать не нужно
    - Проверки остатка в коде приложения перед записью достаточно, транзакция или атомарное условное обновление не нужны
- question: queues-background-jobs
  points:
    - id: decouple-accept-execute
      text: "Очередь отделяет приём запроса от выполнения работы: API кладёт задачу в очередь и сразу отвечает (`202 Accepted` с `jobId`), а воркеры обрабатывают её в отдельном процессе"
      weight: 3
    - id: benefits-resilience-scaling
      text: Очередь сглаживает пиковую нагрузку, изолирует сбои медленных внешних сервисов от основного запроса и позволяет масштабировать воркеры независимо от API; примеры задач — письма, отчёты, обработка видео
      weight: 2
    - id: at-least-once-idempotency
      text: Очереди обычно доставляют задачу at-least-once, поэтому обработчик должен быть идемпотентным (например, дедупликация через `jobId` или ключ идемпотентности), иначе повтор спишет деньги или создаст запись дважды
      weight: 3
    - id: retries-backoff-dlq
      text: Ошибки обрабатываются повторами с экспоненциальной задержкой, а задачи, исчерпавшие попытки, уходят в dead letter queue
      weight: 2
    - id: frontend-result-delivery
      text: Фронтенд узнаёт о результате через polling статуса `GET /jobs/:id` (например, `refetchInterval` в TanStack Query), push через SSE/WebSocket или уведомление вне сессии для долгих задач
      weight: 2
    - id: outbox-observability
      text: "Outbox-паттерн: событие пишется в таблицу в той же транзакции, что и бизнес-данные, а отдельный процесс публикует его в очередь; плюс мониторинг длины очереди, времени ожидания и доли ошибок"
      weight: 1
  misconceptions:
    - Очередь гарантирует доставку задачи ровно один раз (exactly-once), поэтому об идемпотентности обработчика можно не думать
    - Отправлять письмо или вызывать медленный внешний API можно прямо в обработчике HTTP-запроса — это лишь немного дольше
    - Достаточно сначала записать в базу, а потом поставить задачу в очередь отдельным вызовом — расхождения между ними не бывает
    - Фоновая задача — это `setTimeout` или промис без `await` внутри процесса API, отдельная очередь и воркер не нужны
- question: idempotency-retries
  points:
    - id: lost-response-problem
      text: "Повтор опасен, потому что запрос мог выполниться, а ответ потеряться: клиент не знает результата. `GET`, `PUT` и `DELETE` идемпотентны по семантике, а `POST` — нет."
      weight: 2
    - id: idempotency-key
      text: Для `POST` клиент генерирует уникальный ключ на операцию и передаёт его в `Idempotency-Key`. Все повторы этой операции идут с тем же ключом, а не с новым на каждую попытку.
      weight: 3
    - id: server-stores-result
      text: Сервер атомарно сохраняет ключ вместе с результатом, например под уникальным индексом в одной транзакции с действием. При повторе с тем же ключом он возвращает сохранённый ответ и не выполняет действие снова, даже при параллельном дубликате.
      weight: 3
    - id: retryable-errors
      text: "Повторять стоит только то, что может пройти: сетевые ошибки, `429`, `502`, `503`, `504`. Ошибки `400`, `401`, `403`, `404`, `422` ретрай не исправит."
      weight: 2
    - id: backoff-jitter
      text: Задержка между попытками растёт экспоненциально и включает jitter, чтобы клиенты не повторяли синхронно и не добивали восстанавливающийся сервис. Учитывается `Retry-After`, а число попыток и общее время ограничены.
      weight: 2
    - id: ui-not-substitute
      text: Блокировка повторной отправки в UI (`useFormStatus`, `isPending`) — это только UX и не заменяет серверную идемпотентность. Включать `retry` для мутаций в TanStack Query без идемпотентности на сервере опасно. Для зависимостей на сервере полезен circuit breaker.
      weight: 1
  misconceptions:
    - «`POST` можно безопасно повторять, если запрос упал по таймауту, ведь он, скорее всего, не выполнился.»
    - «Ключ идемпотентности нужно генерировать заново на каждую попытку повтора.»
    - «Достаточно задизейблить кнопку отправки формы, и дублей на сервере не будет.»
    - «Ретраить стоит любые ошибки, включая `400`/`401`/`422`, с фиксированной задержкой.»
- question: fetch-streaming
  points:
    - id: body-is-readable-stream
      text: "`response.body` — это `ReadableStream` байтов, который читается по частям через `getReader()` и `reader.read()` в цикле до `done: true`, не дожидаясь полного ответа"
      weight: 3
    - id: decode-stream-true
      text: "Чанки декодируются через `TextDecoder` с `{ stream: true }`, иначе многобайтовый UTF-8 символ, разрезанный между чанками, декодируется с ошибкой"
      weight: 3
    - id: use-cases
      text: "Приводит сценарии применения: прогресс загрузки большого файла, построчная обработка NDJSON, вывод токенов LLM по мере генерации"
      weight: 2
    - id: pipe-through-transform
      text: Для построчного потока поток пропускают через `pipeThrough(new TextDecoderStream())` и построчный `TransformStream`, чтобы получать готовые строки, а не разбирать границы вручную
      weight: 2
    - id: content-length-progress
      text: "Общий размер для процента прогресса берётся из `Content-Length`, которого может не быть при `Transfer-Encoding: chunked`"
      weight: 1
    - id: json-defeats-streaming
      text: "`response.json()` или `response.text()` читают весь поток целиком и лишают смысла стриминг"
      weight: 1
  misconceptions:
    - "`reader.read()` возвращает строки, а не `Uint8Array` байтов, поэтому декодировать не нужно"
    - "Каждый чанк можно безопасно декодировать отдельно через `decoder.decode(value)` без `{ stream: true }`"
    - Один чанк из `reader.read()` всегда соответствует одной строке или одному JSON-объекту, отправленному сервером
    - "`Content-Length` всегда доступен, поэтому процент прогресса можно посчитать для любого ответа"
- question: websocket-binary-data
  points:
    - id: send-accepts-binary
      text: "`ws.send()` принимает не только строку, но и бинарные данные: `Blob`, `ArrayBuffer` или типизированный массив вроде `Uint8Array`."
      weight: 3
    - id: binary-type-controls-incoming
      text: "Свойство `ws.binaryType` задаёт вид входящих бинарных сообщений в `event.data`: `'blob'` по умолчанию или `'arraybuffer'`."
      weight: 3
    - id: arraybuffer-sync-access
      text: "При `'arraybuffer'` байты можно разобрать сразу через `Uint8Array` или `DataView`. `Blob` синхронно не прочитать: нужно асинхронное чтение через `FileReader` или `blob.arrayBuffer()`."
      weight: 2
    - id: when-binary-justified
      text: Бинарный формат (Protocol Buffers или свой компактный протокол) выбирают, когда объём трафика критичен. Типичный случай — частые мелкие сообщения вроде координат курсора или аудиоданных, для которых JSON слишком многословен.
      weight: 2
    - id: debuggability-tradeoff
      text: "Минус бинарного протокола — его сложнее отлаживать: во вкладке Network его не прочитать глазами, нужны специальные инструменты или логирование в декодированном виде. Если трафик не критичен, такая цена не оправдана."
      weight: 2
    - id: check-data-type
      text: "В `onmessage` тип `event.data` проверяют, например через `instanceof ArrayBuffer`: по одному соединению могут приходить и текстовые, и бинарные сообщения."
      weight: 1
  misconceptions:
    - WebSocket передаёт только текст, поэтому бинарные данные обязательно кодировать в base64 или JSON.
    - Значение по умолчанию у `binaryType` — `'arraybuffer'`.
    - "`binaryType` влияет на формат отправляемых через `send()` данных, а не только входящих."
    - Бинарный протокол всегда лучше JSON, и его стоит использовать в любом WebSocket-приложении.
- question: websocket-scaling
  points:
    - id: stateful-connection
      text: WebSocket-соединение — долгоживущее состояние на конкретном инстансе, и балансировщик не может перенаправить его на другой инстанс, не разорвав, в отличие от отдельного HTTP-запроса.
      weight: 3
    - id: pubsub-broker
      text: "Чтобы доставлять события между инстансами, используют pub/sub-брокер (Redis Pub/Sub, NATS): инстанс, получивший событие, публикует его в канал, а инстанс, где открыто соединение с нужным клиентом, подписан на канал и пересылает сообщение в сокет."
      weight: 3
    - id: cross-instance-problem
      text: "Ключевая проблема: событие для клиента A может возникнуть на инстансе, где A не подключён (например, REST-вызов другого пользователя попал на другой инстанс)."
      weight: 2
    - id: sticky-sessions
      text: Sticky sessions (привязка по cookie или IP) направляют клиента всегда на один и тот же инстанс, но сами по себе не решают доставку событий, пришедших на другие инстансы.
      weight: 2
    - id: connection-registry
      text: Информацию о том, какой клиент к какому инстансу подключён, нужно хранить и синхронизировать между инстансами вне памяти отдельного процесса.
      weight: 1
    - id: restart-reconnect
      text: При рестарте, деплое или ребалансировке инстанса все его соединения обрываются разом, поэтому клиенты должны переподключаться, а система — переживать переезд клиента на другой инстанс.
      weight: 1
  misconceptions:
    - Sticky sessions полностью решают масштабирование WebSocket и делают внешний брокер ненужным.
    - Балансировщик может прозрачно перенести открытое WebSocket-соединение на другой инстанс без разрыва.
    - Достаточно хранить карту подключений в памяти каждого инстанса — синхронизация между инстансами не нужна.
    - При деплое новой версии открытые WebSocket-соединения сохраняются и автоматически переходят на новый процесс.
- question: websocket-backpressure
  points:
    - id: backpressure-definition
      text: Backpressure — это когда отправитель шлёт сообщения быстрее, чем сеть или получатель успевает их обработать. Из-за этого растёт буфер отправки, увеличивается потребление памяти и накапливается задержка доставки.
      weight: 3
    - id: buffered-amount
      text: "`ws.bufferedAmount` показывает, сколько байт ещё не отправлено в сеть. Большое и растущее значение — сигнал, что пора замедлить отправку."
      weight: 2
    - id: drop-or-throttle
      text: При перегрузке канала отправку замедляют или отбрасывают неважные высокочастотные сообщения, например обновления позиции курсора. Для этого перед `ws.send` проверяют `bufferedAmount` по порогу.
      weight: 2
    - id: order-guaranteed-tcp
      text: "Внутри одного WebSocket-соединения порядок сообщений гарантирован: протокол работает поверх TCP, и сообщения приходят в порядке отправки."
      weight: 3
    - id: reconnect-gap
      text: Проблема возникает при переподключении, а не с порядком внутри соединения. Сообщения, отправленные сервером во время реконнекта, теряются, если протокол приложения не предусматривает их досылку.
      weight: 2
    - id: order-vs-delivery
      text: Гарантия порядка внутри соединения и гарантия доставки через разрывы — разные вещи. Вторую нужно реализовывать на уровне приложения, например через досылку пропущенного после реконнекта.
      weight: 1
  misconceptions:
    - WebSocket не гарантирует порядок сообщений внутри одного соединения, поэтому их нужно переупорядочивать на клиенте.
    - TCP под WebSocket гарантирует доставку всех сообщений даже при разрыве и переподключении.
    - "`ws.send` блокирует выполнение, пока данные не уйдут в сеть, поэтому backpressure невозможен."
    - "`bufferedAmount` показывает число непрочитанных входящих сообщений у получателя."
