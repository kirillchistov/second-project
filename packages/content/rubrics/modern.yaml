- question: react-19-changes
  points:
    - id: actions-form-hooks
      text: "В React 19 появились Actions и хуки для форм и мутаций: `useActionState`, `useFormStatus`, `useOptimistic`"
      weight: 3
    - id: ref-as-prop
      text: "`ref` передаётся в функциональный компонент как обычный prop, поэтому `forwardRef` больше не нужен"
      weight: 3
    - id: use-and-context
      text: "Появился API `use` для чтения промисов и контекста, а контекст можно рендерить напрямую как провайдер: `<Context value>` вместо `<Context.Provider>`"
      weight: 2
    - id: metadata-in-components
      text: "`<title>`, `<meta>` и стили можно рендерить прямо в компоненте, и React сам поднимет их в `<head>`"
      weight: 2
    - id: ref-callback-cleanup
      text: Ref-колбэк может вернуть функцию очистки, поэтому стрелка с неявным возвратом (`ref={n => (this.x = n)}`) будет воспринята как cleanup
      weight: 2
    - id: removed-legacy-apis
      text: "Удалены устаревшие API: `propTypes` и `defaultProps` у функциональных компонентов, строковые refs, legacy context, `ReactDOM.render` и `hydrate`. Миграция идёт через React 18.3 и codemods"
      weight: 1
  misconceptions:
    - Утверждать, что в React 19 `forwardRef` по-прежнему обязателен для передачи `ref` в функциональный компонент
    - Считать, что `ReactDOM.render` и `defaultProps` у функциональных компонентов в React 19 продолжают работать, а не удалены
    - Считать, что хук `use` подчиняется тем же правилам, что обычные хуки, и его нельзя вызывать в условиях
    - Утверждать, что значение, возвращаемое из ref-колбэка, игнорируется, как в React 18
- question: view-transition
  points:
    - id: browser-api-wrapper
      text: "`<ViewTransition>` оборачивает элементы и анимирует их появление, исчезновение и изменение через браузерный View Transition API"
      weight: 3
    - id: only-transition-updates
      text: Анимация запускается только для обновлений-переходов (`startTransition`, раскрытие `<Suspense>`, `useDeferredValue`); обычный срочный `setState`, например ввод в поле, не анимируется
      weight: 3
    - id: four-animation-types
      text: "Есть четыре типа анимации: `enter` (появился в дереве), `exit` (удалён), `update` (изменились стили или содержимое детей) и `share` (элемент с одинаковым `name` исчез в одном месте и появился в другом, например «карточка → детальная страница»)"
      weight: 2
    - id: css-class-props
      text: По умолчанию это cross-fade; анимацию настраивают пропсами `enter`/`exit`/`update`/`share`, значение которых — имя CSS-класса для псевдоэлементов `::view-transition-old/new(.class)`
      weight: 2
    - id: add-transition-type
      text: "`addTransitionType` внутри `startTransition` задаёт причину перехода, чтобы одно и то же изменение анимировалось по-разному (например, `next`/`previous`); тип доступен и в CSS через `:active-view-transition-type()`"
      weight: 1
    - id: callbacks-and-caveats
      text: "Упоминает колбэки `onEnter`/`onExit`/`onUpdate`/`onShare` для анимаций через Web Animations API или подводные камни: работает пока только в DOM, а для `prefers-reduced-motion` анимации нужно отключать"
      weight: 1
  misconceptions:
    - Любое обновление состояния внутри `<ViewTransition>`, включая обычный `setState` в обработчике, анимируется автоматически
    - "`<ViewTransition>` сам рассчитывает анимации на JS (через `requestAnimationFrame`), не используя браузерный View Transition API"
    - Shared element переход (`share`) срабатывает без совпадающего `name` у двух `<ViewTransition>`
    - "`<ViewTransition>` уже полноценно работает в React Native и других рендерерах так же, как в DOM"
- question: fragment-refs
  points:
    - id: fragment-instance
      text: "`<Fragment>` принимает `ref` и отдаёт не DOM-узел, а объект `FragmentInstance`, который работает со всеми DOM-детьми фрагмента как с группой."
      weight: 3
    - id: replaces-wrapper-div
      text: Fragment ref заменяет лишний обёрточный `<div>`, который ломал раскладку (flex, grid, строки таблицы, пункты `<li>`) и семантику разметки.
      weight: 3
    - id: events-and-observers
      text: Через `FragmentInstance` можно навесить обработчики (`addEventListener`/`removeEventListener`/`dispatchEvent`) и подключить `IntersectionObserver` или `ResizeObserver` ко всем детям через `observeUsing`/`unobserveUsing`.
      weight: 2
    - id: first-level-vs-focus
      text: Методы событий, наблюдателей и измерений действуют на детей первого уровня, а `focus()`/`focusLast()` ищут первый или последний фокусируемый элемент в глубину.
      weight: 2
    - id: use-cases
      text: Полезно, когда у компонента нет одного корневого DOM-элемента или когда дети — чужие компоненты, которые не принимают `ref`.
      weight: 2
    - id: dom-only-effects
      text: "Это DOM-возможность: на сервере и в React Native методов нет, поэтому их вызывают в эффектах и снимают в cleanup (например, `unobserveUsing`)."
      weight: 1
  misconceptions:
    - Fragment ref указывает на первый DOM-элемент или массив DOM-узлов фрагмента — на самом деле это отдельный объект `FragmentInstance`.
    - "`addEventListener` на фрагменте напрямую навешивает обработчик на все вложенные элементы любой глубины — он работает с детьми первого уровня."
    - Fragment с `ref` создаёт в DOM реальный узел-обёртку.
    - Методы `FragmentInstance` можно безопасно вызывать во время рендера или на сервере.
- question: use-transition
  points:
    - id: non-urgent-interruptible
      text: "`startTransition` помечает обновление состояния как несрочное: React рендерит его в фоне и может прервать этот рендер ради срочных обновлений, например ввода"
      weight: 3
    - id: suspense-keeps-old-ui
      text: "Внутри transition React не показывает Suspense-fallback для уже видимого контента: старый UI остаётся на экране до готовности нового"
      weight: 2
    - id: is-pending-indicator
      text: "`useTransition` возвращает `isPending`, по которому можно показать индикатор ожидания (например, приглушить старый контент)"
      weight: 2
    - id: async-actions-await
      text: В React 19 `startTransition` принимает async-функцию (Action), но обновления state после `await` нужно снова оборачивать в `startTransition`
      weight: 2
    - id: sync-call-deferred-render
      text: Функция в `startTransition` вызывается сразу и синхронно — откладывается не вызов, а рендер; поэтому контролируемый текстовый инпут нельзя обновлять внутри transition
      weight: 1
    - id: standalone-start-transition
      text: "`startTransition`, импортированный из `react` без хука, используется вне компонентов (роутер, стор), но не даёт `isPending`"
      weight: 1
  misconceptions:
    - Transition ускоряет рендер или уменьшает объём работы — на деле он лишь делает рендер неблокирующим
    - Колбэк `startTransition` выполняется отложенно, как в `setTimeout` или debounce
    - Все обновления state после `await` внутри async transition автоматически остаются частью transition
    - Значение контролируемого текстового инпута стоит обновлять внутри transition, чтобы ввод не тормозил
- question: use-deferred-value
  points:
    - id: lagging-copy-two-pass
      text: "`useDeferredValue` возвращает отстающую копию значения: сначала срочный рендер идёт со старым отложенным значением, затем в фоне — рендер с новым значением"
      weight: 3
    - id: interruptible-background
      text: "Фоновый рендер с новым значением прерываемый: если пользователь продолжает вводить, React бросает его и начинает заново с актуальным значением"
      weight: 2
    - id: no-fixed-delay-vs-debounce
      text: "В отличие от debounce нет фиксированной задержки: на быстром устройстве обновление почти мгновенное, на медленном отставание адаптивно растёт"
      weight: 3
    - id: not-for-reducing-requests
      text: "`useDeferredValue` улучшает отзывчивость рендера, но не уменьшает число запросов к API — для этого нужен debounce/throttle"
      weight: 2
    - id: memo-required
      text: Тяжёлый компонент, получающий отложенное значение, нужно обернуть в `memo`, иначе он перерендерится и в срочном проходе и выигрыша не будет
      weight: 2
    - id: vs-transition-stale-suspense
      text: "Отличие от `useTransition`: `useDeferredValue` применяют, когда нет контроля над `setState` (значение из props или стороннего хука); устаревание можно показать через `query !== deferredQuery`, а при Suspense вместо fallback остаётся старый контент"
      weight: 1
  misconceptions:
    - "`useDeferredValue` — это встроенный debounce с фиксированной задержкой (например, в несколько сотен миллисекунд)"
    - "`useDeferredValue` сокращает количество сетевых запросов или вызовов эффектов при вводе"
    - "`useDeferredValue` сам по себе ускоряет тяжёлый компонент, даже без `memo`"
    - Отложенный рендер блокирует ввод и не может быть прерван, пока не завершится
- question: suspense-deep-dive
  points:
    - id: suspend-mechanism
      text: Компонент приостанавливается, когда при рендере читает неготовые данные (`use(promise)`, `lazy`, библиотека с поддержкой Suspense). React прерывает рендер этого поддерева, показывает fallback ближайшей `<Suspense>` и повторяет рендер, когда промис разрешится.
      weight: 3
    - id: boundary-design-ux
      text: "Расстановка границ — это UX-решение: критичный контент грузится вместе под общей границей, независимые части получают свои вложенные границы. Одна граница на всё приложение заменяет спиннером весь экран, а слишком много мелких даёт «попкорн» из скелетонов."
      weight: 3
    - id: stable-promise
      text: Промис должен быть стабильным (кэшированным). Если создавать его в рендере, каждый повтор запускает новый запрос и загрузка становится бесконечной. Поэтому для данных используют фреймворки и библиотеки (`useSuspenseQuery`, RSC).
      weight: 2
    - id: transitions-no-fallback
      text: "При обновлении внутри transition fallback для уже видимого контента не показывается: старый экран остаётся, пока новый не готов. Чтобы при смене параметра снова показать fallback, меняют `key` у границы."
      weight: 2
    - id: ssr-streaming
      text: "На сервере границы Suspense задают точки стриминга: оболочка отправляется сразу, а содержимое границ досылается по мере готовности."
      weight: 2
    - id: throttling-prewarming
      text: React группирует (throttling) появление соседних границ, чтобы контент не мигал по кускам. В React 19 после показа fallback он в фоне пре-рендерит соседей приостановленного компонента (pre-warming), чтобы их запросы шли параллельно.
      weight: 1
  misconceptions:
    - "Suspense сам загружает данные или отслеживает любой `fetch`/`useEffect` внутри поддерева: на деле он реагирует только на источники, интегрированные с Suspense (`use`, `lazy`, библиотеки)."
    - "Можно создавать промис прямо в рендере и передавать его в `use()`: на деле это приводит к повторным запросам и бесконечной загрузке."
    - "При приостановке React сохраняет и возобновляет частично выполненный рендер компонента с места остановки: на деле рендер поддерева перезапускается с начала, когда промис разрешается."
    - "При transition-обновлении уже видимый контент всегда заменяется fallback: на деле в transition старый экран остаётся до готовности нового."
- question: react-compiler
  points:
    - id: build-time-auto-memo
      text: React Compiler — плагин сборки (Babel, с интеграциями для Vite, Next.js, Expo), который на этапе компиляции автоматически мемоизирует значения, функции и JSX внутри компонентов и хуков
      weight: 3
    - id: manual-memo-mostly-unneeded
      text: Для нового кода ручные `memo`, `useMemo` и `useCallback` в большинстве случаев не нужны, но остаются как инструмент точного контроля, например для стабильных зависимостей эффектов
      weight: 3
    - id: rules-of-react-bailout
      text: Компилятор опирается на Rules of React (чистота, иммутабельность props/state, правила хуков) и код с нарушениями не оптимизирует, а пропускает, не ломая его; нарушения показывает `eslint-plugin-react-hooks`
      weight: 2
    - id: fine-grained-conditional
      text: "Мемоизация гранулярнее ручной: на уровне отдельных выражений через кэш компонента, в том числе в условных ветках и после раннего `return`, где `useMemo` вызвать нельзя"
      weight: 2
    - id: incremental-adoption
      text: "Внедрение постепенное: сначала линтер и исправление нарушений, затем включение по директориям или через `'use memo'`, отключение для компонента через `'use no memo'`, затем проверка поведения и профилирование"
      weight: 1
    - id: pitfalls-and-versions
      text: Компилятор не ускоряет само вычисление, а лишь избегает его повторов; код, зависевший от мутаций во время рендера, может изменить поведение; поддерживается React 17+ (для 17/18 нужен `react-compiler-runtime`)
      weight: 1
  misconceptions:
    - React Compiler работает в рантайме, например как часть React DevTools или нового рендерера, а не на этапе сборки
    - Компилятор ломает или выдаёт ошибку на коде, нарушающем Rules of React, вместо того чтобы просто пропустить его оптимизацию
    - После включения компилятора `useMemo`/`useCallback` устарели, удалены или запрещены
    - Компилятор ускоряет медленные алгоритмы и тяжёлые вычисления сами по себе, а не только устраняет лишние повторные вычисления
- question: actions
  points:
    - id: action-async-transition
      text: "Action — это асинхронная функция, запущенная в transition: React сам управляет состоянием ожидания, передаёт ошибки в Error Boundary и выполняет последовательные отправки по порядку, поэтому не нужны ручные `isLoading`, `try/finally` и защита от гонок."
      weight: 3
    - id: use-action-state-signature
      text: "`useActionState(fn, initialState)` возвращает `[state, formAction, isPending]`. Функция действия получает предыдущее состояние и `FormData` и возвращает новое состояние, то есть результат последнего действия, например ошибку или данные."
      weight: 3
    - id: use-form-status-child
      text: "`useFormStatus` возвращает `pending` ближайшей родительской `<form>` и работает только в компоненте-потомке формы, а не в том компоненте, где она рендерится. Благодаря этому не нужно прокидывать `isSubmitting` в кнопку."
      weight: 2
    - id: form-action-reset
      text: "`<form action={fn}>` вызывает действие с `FormData` и после успеха сбрасывает неконтролируемые поля. Чтобы введённые значения не потерялись, их нужно вернуть в state, например через `defaultValue={state.name}`."
      weight: 2
    - id: progressive-enhancement
      text: С серверными функциями (`'use server'`) форма отправляется ещё до загрузки JS (прогрессивное улучшение). Для этого `useActionState` может принимать `permalink`.
      weight: 1
    - id: limits-and-optimistic
      text: "Кандидат упоминает связь с `useOptimistic` для оптимистичных обновлений или ограничения подхода: для сложной клиентской валидации по-прежнему часто берут React Hook Form."
      weight: 1
  misconceptions:
    - "`useFormStatus` можно вызвать в том же компоненте, где объявлена `<form>`, и он вернёт её статус."
    - "`useActionState` делает поля формы контролируемыми и сохраняет введённые значения после отправки."
    - Actions работают только с серверными функциями или только в Next.js и неприменимы к клиентским async-функциям.
    - Исключение, выброшенное в action, автоматически попадает в `state` из `useActionState`. На самом деле оно уходит в Error Boundary, а ошибку для показа в state нужно вернуть явно.
- question: use-optimistic
  points:
    - id: temporary-state-during-action
      text: "`useOptimistic(state, updateFn)` возвращает временное оптимистичное значение, которое показывается только пока выполняется Action, а затем UI возвращается к реальному `state`"
      weight: 3
    - id: auto-rollback
      text: При ошибке Action оптимистичное значение отбрасывается автоматически, ручной откат не нужен, но сообщить пользователю об ошибке нужно самим (Error Boundary или state ошибки)
      weight: 3
    - id: call-inside-transition
      text: "`addOptimistic` нужно вызывать внутри Action или `startTransition`, иначе React выдаст предупреждение"
      weight: 2
    - id: source-must-update
      text: После успеха реальный `state` должен обновиться из источника (props, кэш, ответ сервера), иначе значение «откатится» к старому
      weight: 2
    - id: update-fn-and-pending
      text: "`updateFn(current, value)` вычисляет оптимистичное состояние из текущего и переданного значения; типичный пример — добавить сообщение с флагом `pending` и показать его полупрозрачным"
      weight: 1
    - id: vs-tanstack-query
      text: В TanStack Query оптимизм делается вручную через `onMutate` со снимком и откатом в `onError` (или через `variables`), а `useOptimistic` проще, но завязан на модель Actions
      weight: 1
  misconceptions:
    - Оптимистичное значение сохраняется после завершения Action и становится новым состоянием
    - При ошибке нужно вручную откатывать состояние в `catch`
    - "`addOptimistic` можно вызывать где угодно, например в обычном `onClick` вне transition, без последствий"
    - "`useOptimistic` сам отправляет запрос на сервер или заменяет обновление реального состояния"
- question: use-hook
  points:
    - id: reads-promise-or-context
      text: "`use(resource)` читает во время рендера значение промиса или контекста (`use(ThemeContext)` как замена `useContext`)"
      weight: 3
    - id: suspense-and-error-boundary
      text: С промисом компонент приостанавливается до разрешения и показывается fallback ближайшего `Suspense`, а отклонённый промис передаёт ошибку в Error Boundary
      weight: 3
    - id: conditional-call
      text: В отличие от остальных хуков, `use` можно вызывать внутри условий и циклов (например, после раннего `return`)
      weight: 2
    - id: stable-external-promise
      text: "Промис должен быть стабильным и приходить извне (из Server Component, кэша или библиотеки): созданный в рендере клиентского компонента промис пересоздаётся при каждом рендере и даёт бесконечную загрузку (предупреждение «uncached promise»)"
      weight: 2
    - id: server-to-client-promise
      text: "Типовой паттерн: Server Component запускает запрос без `await` и передаёт промис пропсом в Client Component, который читает его через `use` внутри `Suspense`"
      weight: 1
    - id: no-try-catch
      text: "`use` нельзя вызывать в `try/catch`: ошибки обрабатываются Error Boundary или через `promise.catch(...)` с запасным значением"
      weight: 1
  misconceptions:
    - "`use(fetch(url))` прямо в клиентском компоненте — нормальный способ загрузить данные"
    - "`use` подчиняется тем же правилам хуков, что и `useState`/`useEffect`, и его нельзя вызывать условно"
    - Ошибку отклонённого промиса в `use` можно поймать, обернув вызов в `try/catch`
    - "`use` заменяет библиотеку данных и сам кэширует, инвалидирует и повторяет запросы"
- question: activity
  points:
    - id: preserves-state-dom
      text: '`<Activity mode="hidden">` скрывает часть UI, но сохраняет её state и DOM (в отличие от условного рендеринга `{cond && <X />}`, который теряет state и удаляет DOM)'
      weight: 3
    - id: effects-unmount-when-hidden
      text: "В режиме `hidden` эффекты размонтируются (cleanup, подписки и таймеры останавливаются), а при возврате в `visible` запускаются снова — этим Activity отличается от простого CSS `display: none`"
      weight: 3
    - id: low-priority-updates
      text: "Скрытое содержимое визуально прячется через `display: none`, а его обновления/рендер обрабатываются с самым низким приоритетом, не мешая видимому UI"
      weight: 2
    - id: use-cases
      text: "Приводит применения: вкладки/боковые панели с сохранением скролла и черновиков, back/forward навигация, предзагрузка следующего экрана в фоне (рендер в `hidden` заранее подгружает данные и код через Suspense)"
      weight: 2
    - id: pitfalls
      text: "Называет подводные камни: фоновая логика (например, плеер) в скрытом дереве перестанет работать из-за отключённых эффектов — её нужно выносить выше; скрытые деревья занимают память, много тяжёлых экранов держать не стоит"
      weight: 1
    - id: stable-19-2
      text: Упоминает, что `Activity` стабилен с React 19.2 и принимает `mode="visible" | "hidden"`
      weight: 1
  misconceptions:
    - Activity в режиме `hidden` размонтирует компонент и теряет его state (как условный рендеринг)
    - "Activity — это то же самое, что обёртка с CSS `display: none`: эффекты и подписки в скрытом дереве продолжают работать"
    - В режиме `hidden` содержимое вообще не рендерится и не обновляется, поэтому предзагрузку через Activity сделать нельзя
    - Activity бесплатен по памяти, поэтому можно держать скрытыми сколько угодно тяжёлых экранов
