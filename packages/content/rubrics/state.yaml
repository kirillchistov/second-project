- question: lifting-state-up
  points:
    - id: callback-to-parent
      text: Ребёнок влияет на родителя через функцию-колбэк, которую родитель передаёт ему в props (например, `onChange`), потому что данные в React идут только сверху вниз
      weight: 3
    - id: lift-to-common-ancestor
      text: Общее для соседей состояние поднимают в ближайшего общего предка, а вниз передают значение и функции его изменения (lifting state up)
      weight: 3
    - id: concrete-example
      text: "Приводит пример: предок хранит `useState`, одному ребёнку передаёт `value` и `onChange={setQuery}`, другому — `query` для чтения (фильтр и список)"
      weight: 2
    - id: prop-drilling-solutions
      text: "Называет prop drilling проблемой при глубокой передаче и перечисляет решения: композиция через `children`, Context, внешний стор (Zustand/Redux) или URL"
      weight: 2
    - id: not-too-high
      text: "Поднимать state нужно не выше необходимого: состояние в корне приложения заставляет перерисовываться всё дерево при каждом изменении"
      weight: 1
    - id: single-source-of-truth
      text: "Одно состояние должно иметь один источник истины: дублировать его в двух компонентах и синхронизировать через `useEffect` — антипаттерн"
      weight: 1
  misconceptions:
    - Ребёнок может напрямую изменить props или состояние родителя без переданного колбэка
    - Соседние компоненты могут передавать данные друг другу напрямую, минуя общего предка
    - Для синхронизации соседей нормально держать копию состояния в каждом и связывать их через `useEffect`
    - Context — единственный правильный способ избежать prop drilling и всегда лучше поднятия состояния
- question: context
  points:
    - id: provider-nearest-value
      text: Провайдер задаёт значение, а потомки читают его через `useContext` (или `use`) без явной передачи props. Читается значение ближайшего провайдера выше по дереву.
      weight: 3
    - id: all-consumers-rerender
      text: "Главная проблема — производительность: при смене `value` перерисовываются все компоненты, читающие этот контекст, даже если им нужна лишь часть данных."
      weight: 3
    - id: memoize-value
      text: "`value` нужно мемоизировать (`useMemo`/`useCallback`). Иначе на каждом рендере провайдера создаётся новый объект, и все потребители перерисовываются."
      weight: 2
    - id: split-contexts
      text: "Контексты стоит разделять: данные отдельно от функций (`StateContext`/`DispatchContext`), редко и часто меняющиеся данные — по разным контекстам. Один гигантский `AppContext` — антипаттерн."
      weight: 2
    - id: transport-not-state-manager
      text: "Context — механизм передачи, а не стейт-менеджер. Он хорош для редко меняющихся данных (тема, локаль, текущий пользователь, API-клиенты). Для часто меняющегося глобального состояния лучше стор с селекторами (Zustand, Redux, Jotai): он подписывает компонент только на нужный срез."
      weight: 2
    - id: default-value-no-provider
      text: Значение по умолчанию из `createContext` используется только когда выше нет провайдера. Отсюда частая ошибка «контекст не работает» и практика кастомного хука с проверкой на `null`.
      weight: 1
  misconceptions:
    - "`React.memo` на компоненте-потребителе защищает его от перерисовки при смене значения контекста. На деле обновление контекста проходит сквозь `memo`."
    - React перерисовывает только тех потребителей, чьё поле в объекте `value` изменилось. На деле значение сравнивается целиком по ссылке (`Object.is`), без селекторов.
    - Значение по умолчанию в `createContext` — это начальное значение провайдера или запасное значение, когда провайдер передал `undefined`.
    - Context сам хранит и управляет состоянием как полноценный стейт-менеджер. На деле состояние живёт в `useState`/`useReducer` провайдера, а Context лишь передаёт его вниз.
- question: tanstack-query
  points:
    - id: server-vs-client-state
      text: "Серверное состояние — копия данных, принадлежащих серверу: оно асинхронно, может устареть и разделяется многими компонентами; клиентское — данные UI (открыта ли модалка, текст в поле, выбранная вкладка)"
      weight: 3
    - id: cache-by-key-dedup
      text: "TanStack Query кэширует данные по `queryKey` и дедуплицирует запросы: два компонента с одним ключом порождают один запрос"
      weight: 3
    - id: stale-while-revalidate
      text: "Данные обновляются в фоне по схеме stale-while-revalidate: показываются закэшированные, затем перезапрашиваются (при возврате на вкладку, восстановлении сети); `staleTime` задаёт, сколько данные считаются свежими"
      weight: 2
    - id: mutations-invalidation
      text: Мутации через `useMutation` после успеха инвалидируют связанные запросы (`invalidateQueries`), и они перезапрашиваются
      weight: 2
    - id: key-includes-params
      text: "`queryKey` должен включать все параметры запроса (например, `['todos', filter]`), иначе разные данные попадут в одну запись кэша"
      weight: 1
    - id: less-global-state
      text: Когда серверные данные уходят в TanStack Query, глобального клиентского состояния остаётся мало и тяжёлый стейт-менеджер часто не нужен
      weight: 1
  misconceptions:
    - TanStack Query — это замена Redux для любого состояния, включая UI-состояние вроде открытой модалки
    - Данные из `useQuery` нужно копировать в `useState`, чтобы с ними работать (на деле теряется синхронизация с кэшем)
    - "`staleTime` определяет, когда данные удаляются из кэша (за удаление неиспользуемых данных отвечает `gcTime`)"
    - Каждый компонент, вызвавший `useQuery` с одним ключом, делает свой отдельный сетевой запрос
- question: redux-toolkit
  points:
    - id: core-principles
      text: Redux — единый store, состояние меняется только через `dispatch` действий (`{ type, payload }`), а новое состояние вычисляют чистые reducers `(state, action) => newState`
      weight: 3
    - id: rtk-create-slice
      text: "Современный Redux пишут через Redux Toolkit: `configureStore` создаёт store, `createSlice` генерирует action creators и reducer, а внутри Immer позволяет писать «мутирующий» код, который превращается в иммутабельное обновление"
      weight: 3
    - id: hooks-instead-connect
      text: В компонентах используют хуки `useSelector` и `useDispatch` вместо `connect` и `mapStateToProps`; типизация — через `RootState = ReturnType<typeof store.getState>` и `useSelector.withTypes<RootState>()`
      weight: 2
    - id: selector-rerender
      text: "`useSelector` перерисовывает компонент, только если результат селектора изменился по `===`, поэтому селектор, возвращающий новый массив или объект (например, через `filter`), вызывает ререндер на каждое изменение стора"
      weight: 2
    - id: create-selector-memo
      text: Для производных данных используют мемоизированные селекторы `createSelector`, которые возвращают ту же ссылку, пока входные данные не изменились
      weight: 1
    - id: when-redux-rtk-query
      text: Redux оправдан для большого клиентского состояния со сложными переходами, DevTools с time-travel, middleware и строгих соглашений в больших командах; серверные данные лучше держать в RTK Query или TanStack Query, а не класть вручную
      weight: 1
  misconceptions:
    - В `createSlice` нельзя писать `state.items.push(...)`, потому что это мутирует состояние и ломает Redux (на самом деле Immer превращает это в иммутабельное обновление)
    - "`useSelector` сравнивает результат селектора глубоко (deep equal), поэтому возврат нового массива через `filter` безопасен"
    - "`connect` и `mapStateToProps` — основной рекомендуемый способ подключать компоненты к Redux"
    - Reducer может выполнять побочные эффекты (запросы к API, `Math.random`, запись в `localStorage`)
- question: redux-async
  points:
    - id: reducer-sync-async-in-middleware
      text: Reducer должен оставаться синхронным и чистым, поэтому асинхронная логика выносится в middleware — обёртку над `dispatch`, которая видит каждое действие до reducer
      weight: 3
    - id: thunk-async-thunk-lifecycle
      text: Redux Thunk позволяет диспатчить функции; в RTK `createAsyncThunk` автоматически создаёт действия `pending/fulfilled/rejected`, которые обрабатываются в `extraReducers`
      weight: 3
    - id: rtk-query-server-data
      text: "Для загрузки и кэширования серверных данных лучше подходит RTK Query: кэш, дедупликация, статусы загрузки и хуки вроде `useGetUserQuery` генерируются автоматически"
      weight: 2
    - id: saga-for-complex-flows
      text: Redux-Saga (генераторы) и Redux-Observable (RxJS) нужны для сложной оркестрации — отмена, гонки, очереди, WebSocket; в новых проектах встречаются редко
      weight: 2
    - id: listener-middleware-alternative
      text: Listener middleware из RTK — современная альтернатива saga для реакции на действия и долгоживущих процессов
      weight: 1
    - id: no-manual-loading-flags
      text: "Упоминает подводный камень: не стоит вручную хранить `isLoading` для каждого запроса, если RTK Query уже управляет этим состоянием; либо упоминает отмену через `signal` в `createAsyncThunk`"
      weight: 1
  misconceptions:
    - Асинхронный запрос можно делать прямо в reducer (например, сделать reducer `async`)
    - "`createAsyncThunk` сам кэширует и дедуплицирует запросы так же, как RTK Query"
    - Redux-Saga — рекомендуемый по умолчанию способ работы с асинхронностью в новых проектах на RTK
    - RTK Query работает без Redux store и middleware — достаточно вызвать хук
- question: state-management-choice
  points:
    - id: classify-state-first
      text: "Сначала состояние классифицируют: серверное (TanStack Query, RTK Query, Server Components), URL (search params), формы (React Hook Form), локальное UI (`useState`); глобальный клиентский стор нужен только для остатка, который обычно невелик"
      weight: 3
    - id: no-server-data-in-store
      text: "Серверные данные не стоит класть в глобальный клиентский стор: для них есть специализированные инструменты с кэшированием и инвалидацией"
      weight: 2
    - id: context-is-transport
      text: "Context — это транспорт, а не стейт-менеджер: он подходит для редко меняющихся значений, потому что у него нет подписки на срез и при смене `value` перерисовываются все потребители"
      weight: 3
    - id: library-tradeoffs
      text: "Кандидат различает библиотеки: Zustand — простой стор-хук с селекторами, Jotai — атомарное состояние, Redux Toolkit — жёсткие соглашения и лучшие DevTools для больших команд и сложной логики"
      weight: 2
    - id: zustand-selectors
      text: В Zustand нужно подписываться на срез через селектор (`useCart((s) => s.items.length)`); вызов `useCart()` без селектора подписывает компонент на весь стор
      weight: 2
    - id: use-sync-external-store
      text: Внешние сторы интегрируются через `useSyncExternalStore`, поэтому они безопасны в конкурентном рендеринге и не дают tearing
      weight: 1
  misconceptions:
    - Context — полноценный стейт-менеджер, и потребители перерисовываются только при изменении той части значения, которую они используют
    - Деструктуризация `const { items } = useCart()` в Zustand подписывает компонент только на `items`
    - Redux нужен в любом серьёзном приложении, даже если глобальных флагов всего несколько
    - Данные с сервера правильно хранить в глобальном Redux/Zustand-сторе вместо TanStack Query или RTK Query
- question: url-state
  points:
    - id: shareable-state
      text: "В URL хранят состояние, которым пользователь захочет поделиться или к которому вернётся: фильтры, сортировку, поиск, пагинацию, открытую вкладку, выбранный элемент"
      weight: 3
    - id: url-benefits
      text: URL как хранилище даёт воспроизводимость экрана по ссылке, работу кнопок «Назад/Вперёд» и сохранение состояния после перезагрузки
      weight: 3
    - id: single-source-of-truth
      text: "URL должен быть единственным источником истины: значения читаются из `useSearchParams`, а не копируются в `useState` или глобальный стор"
      weight: 2
    - id: validate-params
      text: Search params — это пользовательский ввод, поэтому их нужно парсить и валидировать с дефолтами (Zod, типизированные search params TanStack Router, `nuqs`)
      weight: 2
    - id: replace-vs-push
      text: Для частых изменений вроде ввода в поиск используют `replace`, а не `push`, чтобы не засорять историю каждым символом
      weight: 1
    - id: what-not-in-url
      text: В URL не кладут секреты и персональные данные, большие объёмы данных и временные UI-флаги вроде hover; параметры URL удобно включать в `queryKey` TanStack Query
      weight: 1
  misconceptions:
    - Значения из URL можно использовать без проверки, раз их выставило само приложение
    - Фильтры стоит держать одновременно в URL и в `useState`/сторе и синхронизировать их эффектом
    - В URL безопасно класть токены или персональные данные, если они в query-параметрах, а не в пути
    - Каждое изменение параметра нужно делать через `push`, иначе «Назад» не будет работать
- question: use-sync-external-store
  points:
    - id: tearing-definition
      text: Tearing — это когда в конкурентном (прерываемом) рендере разные компоненты читают разные версии внешнего стора, потому что стор изменился, пока рендер был прерван, и UI становится несогласованным
      weight: 3
    - id: uses-api-purpose
      text: "`useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot)` — официальный способ подписки на внешний источник данных, при котором React гарантирует согласованное чтение без tearing; на нём построены Redux и Zustand"
      weight: 3
    - id: snapshot-referential-stability
      text: "`getSnapshot` должен возвращать одно и то же значение по ссылке, пока данные не изменились; новый объект или массив на каждый вызов (`{ ...state }`, `filter`) приводит к бесконечному циклу рендеров"
      weight: 2
    - id: stable-subscribe
      text: "`subscribe` должен быть стабильным (объявлен вне компонента или мемоизирован), иначе React переподписывается на каждом рендере; он возвращает функцию отписки"
      weight: 2
    - id: sync-fallback-transition
      text: Если стор меняется во время non-blocking transition, React откатывается к синхронному (блокирующему) рендеру, поэтому внешние сторы теряют часть преимуществ конкурентности
      weight: 1
    - id: server-snapshot-or-effect-pitfall
      text: "`getServerSnapshot` задаёт значение для SSR и гидрации; подход `useEffect` + `useState` хуже, так как допускает tearing и пропуск обновлений между рендером и подпиской"
      weight: 1
  misconceptions:
    - Tearing возникает и в обычном синхронном рендеринге React — на самом деле он характерен именно для прерываемого конкурентного рендера
    - Подписка через `useEffect` + `useState` эквивалентна `useSyncExternalStore` и тоже защищает от tearing
    - Можно возвращать из `getSnapshot` новый объект на каждый вызов — React сравнит содержимое глубоко (на деле сравнение по `Object.is`, будет бесконечный цикл)
    - Обновления внешнего стора, прочитанного через `useSyncExternalStore`, можно сделать неблокирующими через `startTransition` так же, как обновления `useState`
- question: context-selectors
  points:
    - id: context-rerenders-all
      text: Context перерисовывает всех потребителей при любом изменении `value`, и встроенных селекторов у него нет
      weight: 3
    - id: stable-store-uses
      text: В контексте хранится не само значение, а стабильная ссылка на стор с `subscribe`/`getState`. Компонент подписывается на свой срез через `useSyncExternalStore` с селектором и перерисовывается, только когда этот срез изменился
      weight: 3
    - id: split-contexts
      text: Более простой вариант — разделить контексты по частоте изменений и на «данные» и «действия», чтобы компонент не подписывался на лишнее
      weight: 2
    - id: selector-stable-value
      text: "Селектор должен возвращать стабильное значение: примитив или мемоизированный объект. `s => ({ a: s.a })` на каждый вызов создаёт новый объект и ведёт к бесконечным рендерам; нужен shallow-компаратор (`useShallow` в Zustand) или мемоизация"
      weight: 2
    - id: libraries-same-pattern
      text: Zustand, Redux и Jotai устроены по этому же принципу (внешний стор + `useSyncExternalStore`). В продукте лучше взять их, а не писать свой стор
      weight: 1
    - id: store-in-context-ssr
      text: "Стор кладут в контекст, а не в модульную переменную, ради SSR и тестов: у каждого запроса и каждого теста свой экземпляр"
      weight: 1
  misconceptions:
    - Если обернуть потребителей в `React.memo` или мемоизировать `value`, то при реальном изменении `value` перерисуются только те, кто использует изменившееся поле
    - React Compiler устраняет лишние рендеры от контекста — на деле он мемоизирует внутри компонента, но не отменяет подписку на весь контекст
    - Селектор может спокойно возвращать новый объект или массив на каждый вызов, `useSyncExternalStore` сам сравнит его по содержимому
    - У `useContext` есть встроенный селектор или второй аргумент для выбора среза
- question: state-machines
  points:
    - id: impossible-states
      text: Автомат нужен, когда набор независимых булевых флагов (`isLoading`, `isError`, `isSubmitted` и т.п.) допускает невозможные комбинации; явное перечисление состояний делает такие комбинации непредставимыми
      weight: 3
    - id: state-dependent-transitions
      text: "Автомат явно описывает состояния, события и допустимые переходы: результат события зависит от текущего состояния, а недопустимое событие (например, `SUCCESS` в `idle`) игнорируется"
      weight: 3
    - id: reducer-discriminated-union
      text: Для простых случаев достаточно `useReducer` с discriminated union по полю `status`, где данные (например, `progress`, `url`, `message`) существуют только в соответствующем состоянии
      weight: 2
    - id: xstate-for-complex
      text: "Для сложных случаев используют XState: вложенные и параллельные состояния, отложенные переходы, вызов промисов и акторов, визуализация в Stately, генерация тестовых путей"
      weight: 2
    - id: good-use-cases
      text: "Приводит подходящие кейсы: многошаговые мастера, загрузка файлов, видеоплеер, сложные формы с асинхронной валидацией, real-time соединения"
      weight: 1
    - id: testability-and-overkill
      text: Логику автомата можно тестировать и визуализировать отдельно от UI, но для простых флагов автомат (особенно XState) — лишняя церемония
      weight: 1
  misconceptions:
    - Конечный автомат в UI требует обязательно подключать XState — на чистом `useReducer` автомат построить нельзя
    - Автоматы стоит применять для любого состояния компонента, даже для одного булева флага вроде открыт/закрыт модалки
    - Discriminated union сам по себе запрещает недопустимые переходы — на деле переходы контролирует только логика редьюсера, проверяющая текущее состояние
    - Набор независимых булевых флагов эквивалентен автомату, если аккуратно их сбрасывать
- question: realtime
  points:
    - id: connection-outside-components
      text: Соединение живёт вне компонентов — в модуле-клиенте или провайдере, одно на приложение; компоненты лишь подписываются на нужные события
      weight: 3
    - id: update-server-cache
      text: Входящие сообщения обновляют кэш серверного состояния (`queryClient.setQueryData` или `invalidateQueries`), а не разрозненные `useState` в компонентах
      weight: 3
    - id: reconnect-resync
      text: Нужно переподключение с экспоненциальным backoff и догрузка пропущенных после разрыва данных (resync/инвалидация при `onopen`)
      weight: 2
    - id: unsubscribe-cleanup
      text: Подписка оформляется в `useEffect`, а отписка возвращается из cleanup, чтобы не было утечек и дублирующих обработчиков
      weight: 2
    - id: throttle-high-frequency
      text: При высокой частоте сообщений обновления батчатся (например, раз в `requestAnimationFrame`), данные хранятся во внешнем сторе с подпиской через селекторы
      weight: 2
    - id: transport-choice
      text: SSE — однонаправленный, поверх HTTP, с автопереподключением; WebSocket — двусторонний; для совместного редактирования — CRDT (Yjs, Automerge) поверх транспорта; учитывать порядок сообщений и гонку с начальной загрузкой
      weight: 1
  misconceptions:
    - Открывать отдельное WebSocket-соединение в каждом компоненте, которому нужны данные, — нормальная практика
    - Каждое входящее сообщение стоит класть в React state через `setState` — React сам справится с любой частотой
    - "После переподключения ничего догружать не нужно: сервер или браузер гарантирует доставку пропущенных событий"
    - SSE поддерживает двустороннюю связь так же, как WebSocket
