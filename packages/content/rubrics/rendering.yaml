- question: virtual-dom
  points:
    - id: vdom-definition
      text: Virtual DOM — это описание UI в виде дерева JS-объектов (React-элементов), а не настоящий DOM
      weight: 3
    - id: reconciliation-diff
      text: При обновлении React строит новое дерево, сравнивает его с предыдущим (reconciliation) и применяет к реальному DOM только необходимые изменения
      weight: 3
    - id: update-phases
      text: "Обновление проходит этапы: trigger (`setState`, контекст, рендер родителя) → render (вызов компонентов) → reconciliation → commit (изменения в DOM, затем эффекты)"
      weight: 2
    - id: diff-heuristics
      text: "Вместо O(n³) полного сравнения React использует эвристики за O(n): элемент другого типа — старое поддерево удаляется целиком, элементы списка сопоставляются по `key`"
      weight: 2
    - id: render-not-dom-update
      text: "Рендер компонента не означает обновление DOM: если результат не изменился, DOM не трогается"
      weight: 1
    - id: not-speed-magic
      text: "Virtual DOM — не «магия скорости»: ручная точечная работа с DOM может быть быстрее, ценность — в декларативности при достаточно эффективных обновлениях; Svelte/Solid обходятся без VDOM"
      weight: 1
  misconceptions:
    - Virtual DOM всегда быстрее прямой работы с DOM
    - Каждый рендер компонента приводит к перерисовке/изменению реального DOM
    - React при каждом обновлении пересоздаёт весь реальный DOM целиком
    - Сравнение деревьев в React — точный алгоритм O(n³), без эвристик по типу элемента и `key`
- question: keys
  points:
    - id: key-purpose
      text: "`key` позволяет React сопоставлять элементы списка между рендерами и понимать, какой элемент добавлен, удалён или переставлен"
      weight: 3
    - id: index-breaks-state
      text: С `key={index}` при вставке, удалении или сортировке локальное состояние и DOM остаются на позиции и «переезжают» к чужому элементу (например, текст в инпуте после удаления первого элемента)
      weight: 3
    - id: stable-unique-key
      text: Ключ должен быть стабильным и уникальным среди соседей — обычно это id из данных
      weight: 2
    - id: index-ok-static
      text: "Индекс допустим, если список статичен: не сортируется, не фильтруется, а элементы не имеют собственного состояния"
      weight: 2
    - id: no-random-key
      text: "`Math.random()` или `crypto.randomUUID()` в рендере в качестве ключа приводят к пересозданию компонентов на каждом рендере"
      weight: 1
    - id: key-reset-state
      text: Смена `key` вне списка заставляет React пересоздать компонент со свежим состоянием (например, `<ProfileForm key={userId} />`)
      weight: 1
  misconceptions:
    - "`key` должен быть уникален глобально во всём приложении, а не только среди соседей"
    - "`key` доступен внутри компонента через `props.key`"
    - Генерация ключа через `Math.random()` или `crypto.randomUUID()` прямо в рендере — нормальный способ получить уникальный ключ
    - "`key` нужен только для подавления предупреждения в консоли и не влияет на состояние и поведение компонентов"
- question: lifecycle
  points:
    - id: three-phases
      text: "У компонента три этапа: монтирование (появление в дереве), обновления (повторные рендеры при изменении state, props или контекста) и размонтирование (удаление из дерева)"
      weight: 3
    - id: effects-not-lifecycle-methods
      text: В функциональных компонентах нет методов жизненного цикла — их роль выполняют эффекты, которые синхронизируются с внешней системой и очищаются (cleanup) при изменении зависимостей или размонтировании
      weight: 3
    - id: class-to-hooks-mapping
      text: "Приводит соответствие с классами: `componentDidMount` ≈ `useEffect(fn, [])`, `componentDidUpdate` ≈ `useEffect` с зависимостями, `componentWillUnmount` ≈ cleanup-функция эффекта"
      weight: 2
    - id: render-commit-effects-order
      text: "Порядок обновления: render (вызов функций компонентов) → commit (обновление DOM) → синхронный `useLayoutEffect` → отрисовка кадра браузером → `useEffect`"
      weight: 2
    - id: strict-mode-double-effect
      text: В Strict Mode в разработке эффект монтирования выполняется дважды (запуск → cleanup → запуск), поэтому `useEffect(fn, [])` не точный аналог `componentDidMount` и код должен это выдерживать
      weight: 1
    - id: no-hook-for-did-catch
      text: У `componentDidCatch` нет аналога-хука — Error Boundary пишется только классовым компонентом
      weight: 1
  misconceptions:
    - "`useEffect(fn, [])` — точный аналог `componentDidMount` и гарантированно выполняется ровно один раз"
    - "`useEffect` запускается синхронно до того, как браузер отрисует изменения (это поведение `useLayoutEffect`)"
    - Cleanup-функция эффекта вызывается только при размонтировании, а не перед каждым повторным запуском эффекта
    - Error Boundary можно сделать на хуках в функциональном компоненте
- question: purity-strict-mode
  points:
    - id: pure-function-of-inputs
      text: "Компонент — чистая функция от `props`, state и контекста: при одинаковых входных данных возвращает одинаковый JSX"
      weight: 3
    - id: no-side-effects-in-render
      text: "Во время рендера нельзя делать побочные эффекты: мутировать внешние переменные, `props`/state, делать запросы, подписки, трогать DOM или `ref.current` (кроме ленивой инициализации)"
      weight: 3
    - id: strict-mode-double-invoke
      text: StrictMode только в разработке вызывает рендер дважды, а эффекты и ref-колбэки прогоняет через дополнительный цикл mount → unmount → mount, чтобы выявить нечистый код и отсутствие cleanup
      weight: 2
    - id: why-purity-matters
      text: Чистота важна, потому что React может вызывать рендер несколько раз, прерывать его и выбрасывать результат (конкурентный рендеринг), а React Compiler опирается на чистоту для автоматической мемоизации
      weight: 2
    - id: local-mutation-ok
      text: Локальные мутации внутри рендера допустимы — например, заполнение массива, созданного в этом же рендере
      weight: 1
    - id: double-logs-expected
      text: Двойные `console.log` в разработке — ожидаемое следствие StrictMode, а не баг; в DevTools второй вызов показывается приглушённым
      weight: 1
  misconceptions:
    - StrictMode работает и в production, замедляя приложение двойными рендерами
    - Двойной рендер или двойной запуск эффекта в разработке — это баг, который нужно «чинить» флагами вроде `useRef(false)` вместо написания корректного cleanup
    - Любая мутация внутри рендера запрещена, даже мутация объекта, созданного в этом же рендере
    - Безусловный вызов `setState` или запрос данных прямо в теле компонента допустимы, если результат потом отображается
- question: batching
  points:
    - id: batching-definition
      text: Batching — это объединение нескольких обновлений состояния в один рендер
      weight: 3
    - id: automatic-batching-react18
      text: "С React 18 батчинг автоматический везде: в обработчиках, промисах, `setTimeout` и нативных событиях; в React 17 вне обработчиков React-событий его не было"
      weight: 2
    - id: updater-uses-queue-value
      text: Функция-апдейтер `setX(prev => ...)` получает актуальное значение из очереди обновлений, а `setX(x + 1)` использует значение из снимка текущего рендера, поэтому несколько `setCount(count + 1)` подряд дают +1, а не +N
      weight: 3
    - id: stale-closure
      text: В интервалах, подписках и асинхронном коде `setCount(count + 1)` захватывает устаревшее значение (stale closure), апдейтер решает эту проблему
      weight: 2
    - id: flush-sync
      text: "`flushSync` из `react-dom` применяет обновление синхронно (например, чтобы прокрутить к добавленному элементу), но это редкий инструмент, ухудшающий производительность"
      weight: 1
    - id: updater-pure-strict-mode
      text: "Апдейтер должен быть чистой функцией: в Strict Mode React вызывает его дважды"
      weight: 1
  misconceptions:
    - После вызова `setState` значение состояния сразу меняется и доступно в следующей строке того же обработчика
    - В React 18+ батчинг работает только в обработчиках событий React, а в промисах и таймаутах каждый `setState` вызывает отдельный рендер
    - Апдейтер и передача значения всегда эквивалентны, разница только в стиле записи
    - У сеттера из `useState` есть второй аргумент-колбэк после обновления, как у `this.setState` в классах
- question: when-rerender
  points:
    - id: three-triggers
      text: "Компонент перерендеривается в трёх случаях: изменился его собственный state, изменился контекст, который он читает, или перерендерился его родитель"
      weight: 3
    - id: parent-renders-children
      text: По умолчанию при рендере родителя React рендерит всех его потомков, даже если их props не изменились (если компонент не обёрнут в `memo`)
      weight: 3
    - id: render-not-dom
      text: "Рендер не означает обновление DOM: если результат рендера не изменился, React не трогает DOM"
      weight: 2
    - id: limit-rerenders
      text: "Лишние рендеры ограничивают так: опускают state в компонент, которому он нужен, передают тяжёлую часть как `children` из компонента выше, оборачивают дорогой компонент в `memo` со стабильными props или полагаются на React Compiler"
      weight: 2
    - id: same-value-bailout
      text: "`setState` с тем же значением (по `Object.is`) обычно не вызывает рендер, но React иногда всё же рендерит компонент один раз, прежде чем прекратить"
      weight: 1
    - id: debug-tools
      text: Увидеть рендеры и их причины можно в React DevTools Profiler («Highlight updates», «Why did this render?») или на треках Performance в Chrome DevTools
      weight: 1
  misconceptions:
    - Компонент перерендеривается только тогда, когда меняются его props (на деле изменение props — следствие рендера родителя)
    - Каждый рендер компонента приводит к обновлению DOM
    - Ребёнок без props или с теми же props не рендерится при рендере родителя, даже без `memo`
    - "`setState` с тем же значением всегда гарантированно не вызывает рендер"
- question: portals
  points:
    - id: render-to-other-dom-node
      text: "`createPortal(children, domNode)` рендерит потомков в другой DOM-узел (обычно `document.body`), но в React-дереве они остаются на прежнем месте"
      weight: 3
    - id: events-bubble-react-tree
      text: "События из портала всплывают по React-дереву, а не по DOM: клик внутри модалки дойдёт до `onClick` React-родителя, хотя в DOM она лежит в `body`"
      weight: 3
    - id: use-cases-overflow-zindex
      text: "Порталы нужны для модалок, тултипов, тостов и выпадающих меню, чтобы их не обрезал `overflow: hidden` и не перекрывал `z-index` родителя"
      weight: 2
    - id: context-works
      text: Контекст (тема, роутер, стор) доступен внутри портала без дополнительной настройки, потому что связь идёт по React-дереву
      weight: 2
    - id: click-outside-pitfall
      text: Обработчик «клик снаружи» через DOM `contains()` ошибается для вложенных порталов, а всплытие по React-дереву может неожиданно срабатывать у родителя (например, нужен `stopPropagation`)
      weight: 1
    - id: ssr-and-a11y
      text: При SSR `document.body` нет, поэтому портал рендерят после монтирования; для доступной модалки нужны focus trap, Escape, `aria-modal` и возврат фокуса (или нативный `<dialog>` с `showModal()`)
      weight: 1
  misconceptions:
    - События из портала всплывают по DOM-дереву, поэтому родительский React-компонент их не получит
    - Внутри портала контекст недоступен, и провайдеры нужно оборачивать заново
    - Портал создаёт отдельное React-дерево или отдельный root, отвязанный от родителя
    - Портал сам по себе делает модалку доступной (фокус, Escape, `aria-modal`) и решает проблему клика снаружи
- question: preserve-reset-state
  points:
    - id: state-tied-to-position
      text: Состояние привязано к позиции компонента в дереве рендера (UI-дереве), а не к JSX-тегу или переменной; пока на той же позиции рендерится компонент того же типа с тем же `key`, state сохраняется
      weight: 3
    - id: type-or-key-change-resets
      text: Если на той же позиции появляется компонент другого типа или меняется `key`, React размонтирует старое поддерево со всем его состоянием (включая дочерние компоненты) и монтирует новое с чистым state
      weight: 3
    - id: key-to-reset-form
      text: Для сброса состояния при смене сущности используют `key` (например, `<EditContact key={contact.id} />`), а не эффект, синхронизирующий state с пропсами
      weight: 2
    - id: no-nested-component-definitions
      text: "Нельзя объявлять компонент внутри другого компонента: на каждом рендере создаётся новая функция, то есть новый тип, поэтому state, фокус и ввод теряются"
      weight: 2
    - id: preserve-hidden-state
      text: Чтобы сохранить state скрытой части UI (например, вкладки), её продолжают рендерить и скрывают через CSS, поднимают state выше или используют `<Activity mode="hidden">` (React 19.2)
      weight: 1
    - id: position-by-jsx-tree
      text: "Позиция определяется деревом JSX, а не DOM: в `{cond && <A />}<B />` выражение `false` тоже занимает слот, поэтому `B` всегда остаётся на второй позиции и не теряет state"
      weight: 1
  misconceptions:
    - Состояние хранится внутри самого JSX-элемента или экземпляра функции компонента, поэтому разные теги `<Counter />` в тернарнике всегда имеют отдельный state
    - Смена пропсов (например, `isFancy`) у компонента того же типа на той же позиции сбрасывает его состояние
    - "`key` нужен только в списках и не влияет на сохранение или сброс состояния отдельного компонента"
    - Изменение только родительской DOM-обёртки (например, `div` на `section`) не затрагивает state дочерних компонентов
- question: fiber
  points:
    - id: fiber-unit-of-work
      text: "Fiber — архитектура reconciler, появившаяся в React 16: каждый компонент представлен узлом-файбером, то есть единицей работы с `type`, props, состоянием хуков (`memoizedState`) и флагами изменений"
      weight: 3
    - id: interruptible-rendering
      text: "Главное отличие от старого stack reconciler: рендер стал прерываемым — работу можно приостановить, приоритизировать, продолжить или выбросить и начать заново с более приоритетным обновлением"
      weight: 3
    - id: loop-not-recursion
      text: Связи `return`/`child`/`sibling` позволяют обходить дерево циклом без рекурсии и отдавать управление браузеру между единицами работы (time slicing, примерно каждые 5 мс), поэтому большое обновление не блокирует ввод
      weight: 2
    - id: double-buffering
      text: React держит два дерева — `current` (на экране) и `workInProgress` (строящееся), связанные через `alternate`; commit просто переключает указатель
      weight: 2
    - id: concurrent-features
      text: "На Fiber построены конкурентные возможности: transitions, Suspense, выборочная гидрация; приоритет работы хранится в `lanes`"
      weight: 1
  misconceptions:
    - Fiber нужен, чтобы React рендерил быстрее — на деле он делает рендер прерываемым и приоритизируемым, выигрыш в отзывчивости, а не в сырой скорости
    - Fiber — это новый Virtual DOM или замена DOM-диффинга, а не архитектура reconciler с единицами работы
    - Commit-фаза тоже прерываемая — на самом деле прерывать можно только render, commit выполняется синхронно
    - Fiber обходит дерево рекурсивно, как и старый reconciler
- question: render-vs-commit
  points:
    - id: render-pure-interruptible
      text: В фазе render React вызывает компоненты и вычисляет, что изменилось. Эта фаза должна быть чистой, без побочных эффектов, и её можно прерывать.
      weight: 3
    - id: commit-sync-dom
      text: В фазе commit React синхронно и без прерываний применяет изменения к DOM, обновляет refs и запускает layout-эффекты.
      weight: 3
    - id: render-may-be-discarded
      text: Рендер может выполниться несколько раз или быть выброшен, не дойдя до commit, особенно в конкурентном режиме. Поэтому подписка или мутация внешнего состояния в рендере может остаться без отписки и cleanup. Побочные эффекты допустимы только в эффектах и обработчиках.
      weight: 2
    - id: layout-vs-passive-effects
      text: "`useLayoutEffect` выполняется синхронно в commit до отрисовки кадра и блокирует её, поэтому подходит для измерений DOM. `useEffect` выполняется асинхронно после отрисовки, но до следующего рендера."
      weight: 2
    - id: commit-subphases
      text: "Кандидат называет подфазы commit: before mutation (чтение DOM до изменений, например `getSnapshotBeforeUpdate`), mutation (вставка, обновление и удаление узлов) и layout (присоединение refs, `useLayoutEffect`, `componentDidMount/Update`)."
      weight: 1
    - id: discrete-event-flush
      text: Если обновление вызвано дискретным событием (например, кликом), React синхронно выполняет пассивные эффекты до следующего события, чтобы не было рассинхронизации.
      weight: 1
  misconceptions:
    - Фаза render изменяет реальный DOM, а commit только сравнивает деревья.
    - "`useEffect` выполняется синхронно сразу после мутации DOM до отрисовки, так же как `useLayoutEffect`."
    - Каждый вызов рендера компонента гарантированно доходит до commit и попадает на экран, а рендер выполняется ровно один раз на обновление.
    - Фазу commit, как и render, можно прервать и продолжить позже.
- question: reconciliation
  points:
    - id: different-type-remount
      text: "Элементы разных типов дают разные деревья: при смене типа (например, `div` на `section`) старое поддерево размонтируется целиком вместе со state детей, без сравнения детей"
      weight: 3
    - id: keys-match-children
      text: Дети списка сопоставляются по `key`, а без ключей — по индексу; с ключами вставка в начало списка даёт одно перемещение/вставку вместо обновления каждого элемента
      weight: 3
    - id: same-type-update
      text: Для элементов одного типа DOM-узел/экземпляр сохраняется, React обновляет только изменившиеся атрибуты и рекурсивно сравнивает детей
      weight: 2
    - id: linear-complexity
      text: Благодаря эвристикам сравнение идёт за O(n) вместо O(n³) у общего алгоритма сравнения деревьев
      weight: 2
    - id: compare-output-not-props
      text: "React не сравнивает props, чтобы решить, рендерить ли компонент: он вызывает компонент (если нет `memo` или bailout) и сравнивает результат"
      weight: 1
    - id: bailout-same-element
      text: "Bailout: поддерево пропускается, если props (по ссылке), state и контекст файбера не изменились — например, когда родитель вернул тот же элемент из `children`"
      weight: 1
  misconceptions:
    - React по умолчанию глубоко сравнивает props и не перерендеривает компонент, если они не изменились
    - При смене типа обёртки React сравнивает детей и сохраняет state вложенных компонентов
    - Ключи нужны только для подавления предупреждения и не влияют на сопоставление элементов и сохранение state
    - Использовать индекс массива как `key` всегда безопасно, даже при вставке и переупорядочивании элементов
- question: lanes-priorities
  points:
    - id: lane-per-update
      text: Каждое обновление получает приоритет — lane, представленный битом в битовой маске; дискретные события (клик, ввод) получают синхронный lane, непрерывные (scroll, mousemove) — чуть ниже, обычные — default, `startTransition` — transition lanes (есть также idle и offscreen)
      weight: 3
    - id: interrupt-low-priority
      text: React сначала обрабатывает самые приоритетные lanes и может прервать низкоприоритетный (transition) рендер ради срочного обновления, а затем начать прерванный рендер заново
      weight: 3
    - id: why-priorities-example
      text: "Цель приоритетов — срочный ввод не должен ждать тяжёлого рендера: например, `setQuery` вызывается напрямую, а тяжёлый `setResults` оборачивается в `startTransition`"
      weight: 2
    - id: bitmask-benefits
      text: Битовые маски позволяют дёшево объединять обновления в группы, проверять принадлежность lane набору и рендерить несколько lanes за один проход
      weight: 2
    - id: scheduler-yield
      text: Scheduler выполняет работу по приоритету и отдаёт управление браузеру примерно каждые 5 мс через `MessageChannel`
      weight: 1
    - id: starvation-entanglement
      text: Слишком долго откладываемый lane помечается просроченным и выполняется синхронно (защита от starvation); связанные обновления (entanglement) обрабатываются вместе, чтобы не показать промежуточное состояние
      weight: 1
  misconceptions:
    - Обновление контролируемого инпута стоит оборачивать в `startTransition` — на деле ввод станет «ленивым», значение инпута должно обновляться срочно
    - "`startTransition` работает как debounce/throttle и откладывает обновление на фиксированное время — на деле рендер начинается сразу, но с низким приоритетом и может быть прерван"
    - Прерванный низкоприоритетный рендер продолжается с места остановки с уже устаревшими данными — на деле React отбрасывает его и начинает заново
    - Transition-обновления могут откладываться бесконечно — на деле из-за защиты от starvation просроченный lane выполняется синхронно
