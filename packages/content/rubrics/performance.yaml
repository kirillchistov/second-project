- question: use-memo-use-callback
  points:
    - id: what-they-cache
      text: "`useMemo` кэширует результат вычисления, а `useCallback` — саму функцию (ссылку) между рендерами, пока не изменились зависимости; `useCallback(fn, deps)` эквивалентен `useMemo(() => fn, deps)`"
      weight: 2
    - id: three-use-cases
      text: "Мемоизация оправдана в трёх случаях: дорогое вычисление, передача значения в компонент, обёрнутый в `memo`, или использование значения как зависимости другого хука (например, `useEffect`)"
      weight: 3
    - id: memo-needs-stable-refs
      text: Без стабильной ссылки на функцию или объект `memo` у дочернего компонента бесполезен, потому что новая ссылка на каждом рендере проваливает поверхностное сравнение пропсов
      weight: 3
    - id: not-free-measure-first
      text: Мемоизация не бесплатна (хранение, сравнение зависимостей, усложнение кода), поэтому «дороговизну» нужно измерять через `console.time` или Profiler с CPU throttling, а не мемоизировать всё подряд
      weight: 2
    - id: hint-not-guarantee
      text: "`useMemo` — подсказка для оптимизации, а не гарантия: React может сбросить кэш, поэтому корректность кода не должна от него зависеть"
      weight: 1
    - id: compiler-and-alternatives
      text: React Compiler автоматически делает большую часть ручной мемоизации; до мемоизации стоит попробовать опустить state ниже или передать JSX через `children`
      weight: 1
  misconceptions:
    - "`useCallback` предотвращает повторное создание функции и поэтому сам по себе ускоряет рендер — на деле функция создаётся каждый раз, а без `memo` у потребителя выигрыша нет"
    - Обернуть всё в `useMemo`/`useCallback` «на всякий случай» всегда полезно и ничего не стоит
    - "`useMemo` гарантирует, что значение никогда не будет пересчитано, пока зависимости не изменились, и на это можно опираться для корректности логики"
    - "`useMemo` или `useCallback` в родителе предотвращают ререндер дочернего компонента без `memo`"
- question: react-memo
  points:
    - id: shallow-props-compare
      text: "`memo` пропускает повторный рендер компонента, если все props поверхностно равны предыдущим: каждый prop сравнивается через `Object.is`."
      weight: 3
    - id: new-props-break-memo
      text: "`memo` бесполезен, если какой-то prop на каждом рендере родителя создаётся заново: инлайн-объект, стрелочная функция или `children`."
      weight: 3
    - id: stabilize-with-hooks
      text: Чтобы `memo` сработал, props-функции и объекты стабилизируют через `useCallback`/`useMemo` или передают исходную ссылку (например, `item` вместо `{ ...item }`).
      weight: 2
    - id: state-context-bypass
      text: "`memo` не предотвращает рендер из-за изменения собственного state компонента или контекста, который он читает через `useContext`."
      weight: 2
    - id: custom-compare-risk
      text: "Вторым аргументом можно передать `arePropsEqual(prev, next)`, но это рискованно: забытый prop приводит к «застывшему» UI. Кроме того, на дешёвых компонентах само сравнение props может стоить дороже рендера."
      weight: 1
    - id: alternatives-without-memo
      text: "Альтернативы без `memo`: опустить state вниз, в компонент, которому он нужен, или передавать тяжёлые части как `children`. Элементы, созданные выше, не пересоздаются при смене state промежуточного компонента."
      weight: 1
  misconceptions:
    - "`memo` делает глубокое сравнение props, поэтому новый объект с тем же содержимым не вызовет рендер."
    - "`memo` полностью изолирует компонент, и он не перерисуется даже при изменении его state или используемого контекста."
    - "`arePropsEqual` должна вернуть `true`, если компонент нужно перерисовать. На самом деле `true` означает «props равны, рендер пропустить»."
    - "`memo` и `useMemo` — одно и то же. На самом деле `memo` мемоизирует компонент по props, а `useMemo` мемоизирует значение внутри компонента."
- question: lazy-suspense
  points:
    - id: lazy-loads-on-first-render
      text: "`lazy(() => import(...))` загружает код компонента отдельным чанком только при первом рендере, поэтому этот код не попадает в начальный бандл"
      weight: 3
    - id: suspense-shows-fallback
      text: Пока чанк загружается, ближайший `<Suspense fallback={...}>` выше по дереву показывает запасной UI
      weight: 3
    - id: default-export-required
      text: "`lazy` ожидает модуль с default-экспортом; именованный экспорт нужно обернуть через `.then(m => ({ default: m.X }))`"
      weight: 2
    - id: declare-at-module-level
      text: "`lazy` объявляют на уровне модуля, а не внутри компонента: иначе при каждом рендере создаётся новый тип компонента и его состояние сбрасывается"
      weight: 2
    - id: error-boundary-for-chunk-failure
      text: Ошибку загрузки чанка (например, после деплоя старые файлы удалены) ловит Error Boundary, а не Suspense
      weight: 2
    - id: transition-keeps-old-ui
      text: Если переход обёрнут в `startTransition`, React продолжает показывать старый экран вместо fallback; дополнительно можно предзагружать чанк по наведению через вызов `import()`
      weight: 1
  misconceptions:
    - "`Suspense` сам обрабатывает ошибки загрузки чанка и показывает fallback при сбое"
    - "`lazy` можно вызывать внутри тела компонента без последствий"
    - "`lazy` напрямую работает с именованными экспортами модуля"
    - Чем мельче дробить код на чанки, тем всегда лучше производительность
- question: virtualization
  points:
    - id: windowing-core
      text: "Используется виртуализация (windowing): в DOM рендерятся только видимые строки плюс небольшой запас (`overscan`), а невидимая часть заменяется отступом/контейнером общей высоты, чтобы скролл выглядел как у полного списка"
      weight: 3
    - id: library-or-mechanics
      text: "Называет готовую библиотеку (TanStack Virtual, `react-window`, `react-virtuoso`) или объясняет механику: оценка высоты строки, вычисление видимого диапазона по `scrollTop`, абсолютное позиционирование элементов через `top`/`translateY`"
      weight: 2
    - id: alternatives
      text: "Упоминает альтернативы виртуализации: пагинацию, бесконечную подгрузку или CSS `content-visibility: auto` для простых случаев"
      weight: 2
    - id: tradeoffs-a11y-search
      text: "Отмечает компромисс: скрытых строк нет в DOM, поэтому страдают поиск по странице (Ctrl+F) и доступность"
      weight: 2
    - id: keys-memo-variable-height
      text: "Говорит о деталях реализации: стабильные ключи и `memo` для строк, чтобы прокрутка не перерисовывала всё; для переменной высоты — измерение элементов (`measureElement`)"
      weight: 1
    - id: deferred-filtering
      text: Для фильтрации большого массива предлагает `useDeferredValue`, чтобы ввод оставался отзывчивым, и/или отмечает, что для небольших списков (десятки элементов) виртуализация — лишняя сложность
      weight: 1
  misconceptions:
    - Достаточно обернуть строки в `memo` или использовать `key` — и 10 000 DOM-узлов перестанут тормозить (проблема в количестве DOM-узлов и стоимости первичного рендера, а не только в перерендерах)
    - "Виртуализация скрывает невидимые элементы через `display: none`/`visibility: hidden`, но они остаются в DOM"
    - При виртуализации браузерный поиск Ctrl+F и скринридеры по-прежнему видят все элементы списка
    - В качестве `key` для виртуализированных строк можно безопасно использовать индекс видимой позиции в окне — это не влияет на корректность
- question: debounce-throttle
  points:
    - id: debounce-vs-throttle
      text: Debounce откладывает вызов до паузы в событиях (например, поиск по вводу), а throttle ограничивает частоту вызовов не чаще раза в интервал (скролл, resize)
      weight: 3
    - id: stable-instance
      text: Debounced-функция должна быть стабильной между рендерами (через `useMemo`/`useRef`), иначе на каждом рендере создаётся новая функция со своим таймером и debounce не работает
      weight: 3
    - id: cleanup-cancel
      text: Отложенный вызов нужно отменять в cleanup эффекта при размонтировании (`clearTimeout`/`cancel`), чтобы избежать лишних запросов и обновлений состояния после размонтирования
      weight: 2
    - id: debounced-value-hook
      text: Часто достаточно дебаунсить значение через хук вроде `useDebouncedValue(query, 300)` и использовать его как зависимость запроса, а не саму функцию
      weight: 2
    - id: latest-fn-ref
      text: Актуальный колбэк хранится в `ref` (`fnRef.current = fn`), чтобы стабильная debounced-функция не захватывала устаревшее замыкание и не пересоздавалась при смене `fn`
      weight: 1
    - id: deferred-value-difference
      text: "`useDeferredValue` не откладывает по времени и не уменьшает число запросов, а позволяет рендерить тяжёлый результат с низким приоритетом без блокировки ввода: для API — debounce, для фильтрации большого локального списка — `useDeferredValue`"
      weight: 2
  misconceptions:
    - Можно просто вызвать `debounce(fn, 300)` в теле компонента — и это будет работать корректно между рендерами
    - "`useDeferredValue` — это встроенный debounce с задержкой по времени, который уменьшает количество сетевых запросов"
    - "Debounce и throttle — одно и то же: оба просто вызывают функцию не чаще раза в N мс"
    - Отменять таймер при размонтировании не нужно, React сам очищает все `setTimeout` компонента
- question: data-waterfalls
  points:
    - id: waterfall-definition-cause
      text: Водопад — цепочка последовательных запросов, где каждый ждёт предыдущего без необходимости; типичная причина — загрузка внутри компонентов, когда дочерний компонент начинает грузить данные только после того, как родитель загрузил свои и отрендерился
      weight: 3
    - id: parallel-independent-requests
      text: "Независимые запросы нужно запускать параллельно: стартовать промисы без `await` и ждать их вместе через `Promise.all` (или `useQueries` на клиенте), а не делать последовательные `await`"
      weight: 3
    - id: fetch-before-render
      text: Загрузку стоит начинать раньше рендера — в loader роутера, в обработчике навигации/клика, через prefetch (например, `queryClient.prefetchQuery` по наведению) или в Server Components (render-as-you-fetch с чтением летящего промиса через Suspense)
      weight: 2
    - id: react-cache-scope
      text: "`cache()` из React дедуплицирует вызовы только в рамках одного серверного рендера, а не между запросами; для кэша между запросами используют механизмы фреймворка или клиентский кэш вроде TanStack Query"
      weight: 2
    - id: hoist-and-dedupe
      text: Запросы поднимают выше по дереву и дедуплицируют через кэш по ключу, чтобы одинаковые данные не грузились повторно разными компонентами
      weight: 1
    - id: backend-aggregation-hints
      text: "Дополнительные приёмы: агрегация на бэкенде (BFF, GraphQL), если экрану нужно много запросов, и ресурсные подсказки (`preload`, `preconnect`) для критичных ресурсов"
      weight: 1
  misconceptions:
    - "`cache()` из React кэширует данные между разными запросами пользователей / глобально на сервере"
    - Последовательные `await` в Server Component не создают водопада, потому что код выполняется на сервере
    - Обёртка каждого компонента в собственную Suspense-границу сама по себе устраняет водопад (на деле вложенные границы с загрузкой в каждой дают водопад «по слоям»)
    - "`useQuery` в дочернем компоненте автоматически начинает загрузку параллельно с родителем, даже если родитель не рендерит его до получения своих данных"
- question: performance-methodology
  points:
    - id: measure-first
      text: Сначала выбирается метрика (INP, LCP, время конкретного взаимодействия) и проводится измерение, а оптимизация начинается только после того, как узкое место найдено
      weight: 3
    - id: profile-to-find-bottleneck
      text: "Узкое место ищут профайлером: Chrome Performance (long tasks), React Profiler (какие компоненты и почему рендерятся) и анализатор бандла"
      weight: 3
    - id: reproduce-prod-throttled
      text: Проблему воспроизводят на production-сборке с CPU throttling и медленной сетью, потому что dev-режим и StrictMode искажают картину
      weight: 2
    - id: fix-by-category
      text: "Решение подбирается по категории проблемы, например: большой бандл — code splitting через `lazy`, лишние рендеры — state ниже или `memo`, длинные списки — виртуализация, тяжёлый рендер — `useTransition` или `useDeferredValue`"
      weight: 2
    - id: field-data-rum
      text: "Отправной точкой служат полевые данные реальных пользователей (RUM: `web-vitals`, Sentry): они показывают, где и у кого медленно"
      weight: 1
    - id: verify-and-guard
      text: Эффект проверяется теми же измерениями, а от регресса защищают бюджетами размера бандла и performance-тестами в CI
      weight: 1
  misconceptions:
    - Оптимизация производительности в React — это в первую очередь расстановка `memo`/`useMemo`/`useCallback` везде, без предварительного профилирования
    - Замеры производительности в dev-режиме достоверно отражают поведение production-сборки
    - "`shouldComponentUpdate`, `PureComponent` и `React.memo` устарели и больше не работают в современном React"
    - Проверки на мощном рабочем ноутбуке без throttling достаточно, чтобы судить о производительности у пользователей
- question: web-vitals
  points:
    - id: lcp-causes-fixes
      text: LCP (цель ≤ 2.5 с) ухудшают CSR с пустым HTML, большой JS-бандл и поздний старт загрузки главного изображения/данных; лечится SSR/SSG/стримингом и приоритизацией LCP-ресурса (`fetchpriority="high"`, `preload`, без `loading="lazy"`)
      weight: 3
    - id: inp-long-tasks
      text: INP (цель ≤ 200 мс) ухудшают долгие задачи в главном потоке — тяжёлые рендеры, синхронные обработчики, гидрация; лечится разбиением работы (`startTransition`, `scheduler.yield()`/`setTimeout`) и уменьшением объёма рендера на взаимодействие (`memo`, Compiler, state ниже, виртуализация)
      weight: 3
    - id: cls-reserve-space
      text: "CLS (цель ≤ 0.1) вызывает контент, появляющийся без зарезервированного места; лечится `width`/`height` или `aspect-ratio` у медиа, скелетонами того же размера и настройкой шрифтов (`font-display: optional`, `size-adjust`)"
      weight: 2
    - id: hydration-cost
      text: Стоимость гидрации снижают Server Components, выборочная гидрация и меньшее число клиентских компонентов; тяжёлые вычисления выносят в Web Worker
      weight: 2
    - id: field-vs-lab
      text: Google оценивает по полевым данным (CrUX/RUM) на 75-м перцентиле, а не по Lighthouse; поэтому нужен RUM, например библиотека `web-vitals`
      weight: 2
    - id: attribution
      text: "`web-vitals/attribution` позволяет узнать конкретный элемент/взаимодействие, вызвавшее плохой INP (`attribution.interactionTarget`)"
      weight: 1
  misconceptions:
    - Хороший Lighthouse score на мощном ноутбуке означает хорошие Core Web Vitals у пользователей
    - INP измеряет только задержку до начала обработки первого взаимодействия (это был FID), а не до следующей отрисовки
    - Ленивая загрузка (`loading="lazy"`) LCP-изображения улучшает LCP
    - Скелетон любого размера предотвращает CLS
- question: memory-leaks
  points:
    - id: effects-without-cleanup
      text: Главный источник утечек — подписки, таймеры, слушатели событий, WebSocket и наблюдатели (`ResizeObserver`, `IntersectionObserver`), которые не освобождаются в cleanup-функции `useEffect`. Cleanup должен вызывать `off`, `removeEventListener`, `clearInterval`, `disconnect` и т.п.
      weight: 3
    - id: heap-snapshot-comparison
      text: "Утечки ищут во вкладке Memory Chrome DevTools: снимают heap snapshot, несколько раз повторяют сценарий (открыть и закрыть модалку, перейти между страницами), снимают второй snapshot и сравнивают их в режиме Comparison. Там ищут растущие классы и элементы с пометкой «Detached»."
      weight: 3
    - id: retainers-chain
      text: Чтобы найти причину, в heap snapshot изучают Retainers — цепочку ссылок, которая не даёт сборщику мусора освободить объект.
      weight: 2
    - id: closures-caches-detached
      text: Утечки также дают замыкания, удерживающие большие объекты, глобальные кэши и сторы без ограничения размера и инвалидации, а также отсоединённые DOM-узлы, на которые продолжают ссылаться refs или сторонние библиотеки.
      weight: 2
    - id: third-party-destroy
      text: Экземпляры сторонних библиотек (графики, карты, редакторы), созданные в эффекте, нужно явно уничтожать в cleanup, например через `chart.destroy()`.
      weight: 1
    - id: extra-tools
      text: "Дополнительные инструменты: Performance monitor показывает рост JS heap и числа DOM-узлов со временем, Strict Mode через двойной mount выявляет отсутствующий cleanup, `FinalizationRegistry` помогает при отладке."
      weight: 1
  misconceptions:
    - Предупреждение «Can't perform a React state update on an unmounted component» надёжно указывает на утечку памяти. На самом деле в React 18 его убрали, потому что оно чаще срабатывало ложно.
    - React сам автоматически отписывает компонент от `socket`, таймеров и DOM-слушателей при размонтировании, поэтому cleanup писать необязательно.
    - Двойной запуск эффектов в Strict Mode сам по себе создаёт утечки, и его нужно отключать. На самом деле он помогает обнаружить отсутствующий cleanup и работает только в development.
    - Сборщик мусора освободит любой объект, как только компонент размонтирован, даже если на него ссылается глобальный кэш или замыкание.
- question: resource-loading
  points:
    - id: metadata-hoisting
      text: "`<title>`, `<meta>` и `<link>`, отрендеренные в любом компоненте, React 19 сам поднимает в `<head>`, в том числе при стриминге SSR, поэтому `react-helmet` больше не нужен"
      weight: 3
    - id: stylesheet-precedence
      text: Стили с атрибутом `precedence` React вставляет в `<head>` в заданном порядке и дедуплицирует, а внутри Suspense не показывает контент до загрузки стилей, что предотвращает вспышку нестилизованного контента (FOUC)
      weight: 3
    - id: resource-hint-apis
      text: "Из `react-dom` доступны API ресурсных подсказок: `preload`, `preinit`, `preconnect`, `prefetchDNS`, `preloadModule`. Их вызывают прямо в компоненте, и React дедуплицирует повторные вызовы"
      weight: 2
    - id: preload-vs-preinit
      text: "`preload` только загружает ресурс заранее, а `preinit` загружает и сразу применяет его: выполняет скрипт или подключает стиль"
      weight: 2
    - id: lcp-impact
      text: "`preload` LCP-изображения (с `fetchPriority: 'high'`) и `preconnect` к CDN улучшают LCP, но если делать `preload` для всего подряд, ресурсы начинают конкурировать за полосу с критичными"
      weight: 2
    - id: spa-seo-limit
      text: В SPA без SSR `<title>` в компонентах выставляется только на клиенте, поэтому такой SEO-выгоды, как при SSR, он не даёт
      weight: 1
  misconceptions:
    - Считать, что `<title>`/`<meta>` в компоненте рендерятся на месте в `<body>` и для `<head>` по-прежнему нужен `react-helmet`
    - Утверждать, что `preload` выполняет скрипт или применяет стиль (путать его с `preinit`)
    - Считать, что `preload` всех ресурсов всегда ускоряет страницу
    - Полагать, что метаданные в компонентах дают SPA без SSR ту же SEO-выгоду, что и серверный рендеринг
