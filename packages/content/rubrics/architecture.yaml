- question: prop-drilling
  points:
    - id: definition
      text: Prop drilling — это передача данных через несколько промежуточных компонентов, которым эти данные сами не нужны и которые лишь пробрасывают их дальше
      weight: 3
    - id: composition-first
      text: "Первое и самое лёгкое решение — композиция: передать готовый элемент через `children` или prop-слот (например, `sidebar={<Sidebar><UserMenu user={user} /></Sidebar>}`), чтобы промежуточный компонент ничего не знал о данных"
      weight: 3
    - id: choose-by-data-type
      text: "Инструмент выбирается по характеру данных: Context — для редко меняющихся данных при глубокой вложенности (тема, пользователь, локаль), внешний стор с селекторами — для часто меняющегося глобального состояния"
      weight: 2
    - id: url-and-server-cache
      text: Фильтры и выбор, которые должны переживать перезагрузку и делиться ссылкой, хранятся в URL (search params), а серверные данные берутся из кэша вроде TanStack Query через `useQuery` с тем же ключом без передачи через props
      weight: 2
    - id: shallow-props-ok
      text: Передача props на 2–3 уровня — нормальна и явна, это не проблема, которую нужно устранять
      weight: 1
    - id: context-implicit-deps
      text: Злоупотребление Context вводит неявные зависимости, которые хуже явных props, поэтому убегать в Context при первой возможности — ошибка
      weight: 1
  misconceptions:
    - Любая передача props через промежуточный компонент — антипаттерн, и её всегда нужно заменять на Context или стор
    - "Context — это полноценная замена стора для часто меняющегося состояния: подписчики Context перерисовываются точечно, как с селекторами"
    - Единственные способы избежать prop drilling — Context или Redux; композиция через `children` и слоты не решает проблему
    - Серверные данные нужно загрузить в корневом компоненте и раздавать через props или Context, а не читать из кэша запросов в месте использования
- question: hoc-render-props-hooks
  points:
    - id: hoc-render-props-definition
      text: HOC — функция, которая принимает компонент и возвращает новый компонент с дополнительными props (например, `withRouter`, `connect`). Render props — компонент, который вызывает функцию из prop, чтобы отрендерить разметку.
      weight: 3
    - id: hooks-default-choice
      text: Хуки (с React 16.8) решают ту же задачу переиспользования логики проще, почти полностью заменили оба паттерна и сейчас являются выбором по умолчанию.
      weight: 3
    - id: hoc-problems
      text: "Хуки решили проблемы HOC и render props: «wrapper hell» (глубокая вложенность в DevTools), коллизии имён props у нескольких HOC, неявность (непонятно, какой HOC добавил prop), сложная типизация HOC в TypeScript. Достаточно назвать хотя бы две из них."
      weight: 2
    - id: hoc-still-useful
      text: "HOC остаются уместны для сквозной функциональности на уровне всего компонента: проверка доступа (`withAuth` с редиректом), error boundary, аналитика."
      weight: 2
    - id: render-props-headless
      text: Render props всё ещё применяются в headless-библиотеках (Downshift, `Controller` из React Hook Form), где управление разметкой нужно отдать пользователю.
      weight: 1
    - id: hoc-pitfalls
      text: "Подводные камни HOC: если создать HOC внутри рендера, на каждом рендере получится новый тип компонента и состояние сбросится; ещё легко забыть пробросить `ref` и статические поля обёрнутого компонента."
      weight: 1
  misconceptions:
    - Хуки разделяют одно состояние между всеми компонентами, которые их вызывают. На самом деле каждый вызов хука хранит собственное состояние, а переиспользуется только логика.
    - HOC и render props удалены из React или больше не работают. Это обычные паттерны на функциях и компонентах, они полностью рабочие, просто реже нужны.
    - Вызывать HOC (`withX(Component)`) прямо внутри рендера безопасно. На самом деле каждый рендер создаёт новый тип компонента, и поддерево с его состоянием перемонтируется.
    - Error boundary можно написать на хуках. На самом деле error boundary по-прежнему требует классового компонента, поэтому его часто оборачивают в HOC или берут готовую библиотеку.
- question: project-structure
  points:
    - id: group-by-feature
      text: "Код группируется по фичам/функциональности, а не по типам файлов (`components/`, `hooks/`, `utils/`): компонент, его хуки, стили, тесты и API лежат рядом (colocation), потому что меняются вместе"
      weight: 3
    - id: public-api
      text: У каждой фичи есть публичный API (`index.ts`), а импорт внутренностей чужой фичи (глубокие импорты) запрещён
      weight: 3
    - id: dependency-direction
      text: "Зависимости направлены сверху вниз (`app → pages → features → entities → shared`): нижние слои не знают о верхних, общее (UI-кит, утилиты, http-клиент) лежит в `shared`"
      weight: 2
    - id: lint-enforcement
      text: Границы модулей и запрет глубоких импортов проверяются линтером (`eslint-plugin-boundaries`, `steiger` для FSD), а не только договорённостью
      weight: 1
    - id: grow-gradually
      text: "Не дробить раньше времени: маленькому проекту хватает `components/`, `pages/`, `hooks/`, `lib/`, структура усложняется по мере роста; упоминается Feature-Sliced Design как формализация"
      weight: 2
    - id: barrel-pitfall
      text: Barrel-файлы, реэкспортирующие всё подряд, могут ухудшать tree-shaking и замедлять dev-сервер
      weight: 1
  misconceptions:
    - Лучшая структура — раскладывать файлы по типам (`components/`, `hooks/`, `utils/`) в любом проекте, в том числе большом
    - Нижние слои (`shared`, `entities`) могут импортировать из `features` или `pages`, направление зависимостей не важно
    - Feature-Sliced Design обязателен с первого дня даже для маленького проекта
    - Barrel-файлы (`index.ts` с реэкспортом всего) никак не влияют на бандл и скорость сборки
- question: large-scale-architecture
  points:
    - id: goal-independent-change
      text: Цель архитектуры — чтобы команды могли менять код независимо и предсказуемо, а решения зависят от контекста (размер команды, частота релизов, SEO, офлайн)
      weight: 3
    - id: domain-modules-public-api
      text: Код разбивается на модули по доменам (каталог, корзина, профиль) с явным публичным API; импорт внутренностей запрещён, зависимости направлены только «вниз»
      weight: 3
    - id: boundaries-enforced-by-tools
      text: Границы модулей и контракты проверяются автоматически линтером и в CI, а решения фиксируются в ADR — не только устными договорённостями
      weight: 2
    - id: state-and-data-layer
      text: Типы состояния разделяются (серверное, URL, формы, UI); серверные данные идут через типизированный API-клиент, сгенерированный из OpenAPI/GraphQL, и TanStack Query/RTK Query с единой обработкой ошибок и авторизации
      weight: 2
    - id: monorepo-shared-packages
      text: Монорепозиторий (pnpm workspaces + Turborepo/Nx) с общими пакетами `ui`, `api-client`, `config`, кэшированием сборок и запуском только затронутого
      weight: 2
    - id: tradeoffs-and-observability
      text: "Упоминает компромиссы и риски (преждевременные микрофронтенды, бесхозный пакет `utils`/`common`) и/или наблюдаемость: Sentry, RUM, feature flags, границы рендеринга RSC/SSR с Suspense и Error Boundary"
      weight: 1
  misconceptions:
    - Микрофронтенды — архитектура по умолчанию для любого большого приложения, даже если над ним работает одна команда
    - Общий пакет `utils`/`common`, от которого зависят все модули, — хорошее средство переиспользования
    - Достаточно договориться о границах модулей в команде, автоматическая проверка в CI не нужна
    - Всё состояние, включая серверные данные, стоит хранить в одном глобальном сторе
- question: micro-frontends
  points:
    - id: organizational-problem
      text: Микрофронтенды решают организационную проблему (много команд, независимые релизы и деплой), а не техническую; для одной-двух команд модульный монолит почти всегда лучше
      weight: 3
    - id: cost-tradeoffs
      text: Цена подхода — сложность инфраструктуры, дублирование зависимостей, согласование версий, сложность единообразного UX и потери производительности
      weight: 2
    - id: integration-approaches
      text: "Называет и сравнивает способы интеграции: build-time npm-пакеты (нет независимого деплоя), Module Federation (рантайм-загрузка), маршрутизация по путям (переход с перезагрузкой), iframe (изоляция ценой коммуникации и a11y), Web Components"
      weight: 3
    - id: module-federation-singleton
      text: "В Module Federation `react` и `react-dom` объявляются как `shared` с `singleton: true`, иначе два экземпляра React ломают хуки и контекст"
      weight: 2
    - id: fallback-boundaries
      text: Удалённый модуль подключается через `lazy` с `Suspense` и Error Boundary как fallback на случай его недоступности
      weight: 1
    - id: shared-contracts
      text: "Нужны обязательные договорённости: общая дизайн-система, единая авторизация, минимальный контракт коммуникации (события, URL) без общего глобального стора, мониторинг ошибок по модулям"
      weight: 1
  misconceptions:
    - Микрофронтенды — техническое решение для повышения производительности или упрощения кода, полезное даже одной команде
    - Сборка частей как npm-пакетов даёт независимый деплой
    - Нормально грузить на страницу несколько экземпляров React — каждый микрофронтенд со своим React без проблем делит контекст и хуки
    - Общее глобальное состояние между микрофронтендами — хороший способ коммуникации (на деле это превращает их в распределённый монолит)
- question: design-system
  points:
    - id: design-tokens-css-vars
      text: Основа системы — дизайн-токены (цвета, типографика, отступы, радиусы), реализованные как CSS-переменные, из которых строятся темы
      weight: 3
    - id: headless-behavior
      text: Сложное поведение (фокус, клавиатура, ARIA, позиционирование) берётся из headless-библиотек вроде Radix UI, React Aria или Ariakit, а стили накладываются свои
      weight: 3
    - id: composable-api
      text: "API компонентов композиционное: compound components, `asChild` или полиморфный `as`, проброс нативных props вместо множества boolean-флагов"
      weight: 2
    - id: storybook-quality
      text: Документация в Storybook, а качество обеспечивают тесты взаимодействия (play-функции), визуальная регрессия (Chromatic/Playwright) и a11y-проверки axe в CI
      weight: 2
    - id: rsc-compatible-styles
      text: Стили выбираются без runtime CSS-in-JS (CSS Modules, Tailwind, zero-runtime), чтобы библиотека работала с RSC
      weight: 1
    - id: distribution-versioning
      text: Обсуждает поставку пакетом против копирования кода (подход shadcn/ui) и версионирование через Changesets с codemods для breaking changes
      weight: 1
  misconceptions:
    - Модалки, меню и комбобоксы лучше писать с нуля, доступность можно добавить потом
    - Гибкость компонента достигается добавлением boolean-props вроде `isLarge`, `isRounded`, `withIcon`
    - Runtime CSS-in-JS (styled-components, Emotion) без ограничений работает в React Server Components
    - Headless-библиотеки навязывают собственные стили, которые придётся перебивать
- question: component-patterns
  points:
    - id: compound-components
      text: Compound components — набор связанных компонентов (`<Tabs>`, `<Tabs.List>`, `<Tabs.Panel>`), которые делят неявное общее состояние через контекст, а потребитель свободно компонует разметку
      weight: 3
    - id: control-props
      text: Control props — компонент работает и в контролируемом (`value` + `onValueChange`), и в неконтролируемом (`defaultValue`) режиме; режим определяется по тому, передан ли `value` (`!== undefined`)
      weight: 3
    - id: headless-prop-getters
      text: Headless hooks и prop getters — хук отдаёт логику, состояние и функции для навешивания props (например, `getItemProps`), а разметка полностью остаётся за потребителем (`useCombobox`, TanStack Table)
      weight: 2
    - id: state-reducer
      text: State reducer — потребитель может передать свой reducer и переопределить переходы состояния (например, чтобы меню не закрывалось при выборе, как в Downshift)
      weight: 2
    - id: slot-aschild
      text: Slot/`asChild` — компонент передаёт своё поведение и props произвольному дочернему элементу вместо рендера собственного
      weight: 1
    - id: mode-switch-pitfall
      text: Переключение между контролируемым и неконтролируемым режимом за время жизни компонента — источник багов, об этом стоит предупреждать в dev-режиме
      weight: 1
  misconceptions:
    - Compound components делят состояние через глобальный стор или клонирование всех детей через `React.cloneElement`, и контекст для этого не нужен
    - Контролируемый компонент сам хранит значение во внутреннем `useState` и лишь уведомляет родителя — на деле в контролируемом режиме источник истины только проп `value`
    - Headless hook рендерит готовую разметку со стилями, которую можно лишь слегка настроить через props
    - Неконтролируемый режим означает, что `onChange` не вызывается — на деле колбэк вызывается в обоих режимах
- question: legacy-migration
  points:
    - id: incremental-major-steps
      text: "Миграция идёт постепенно, по одной мажорной версии (16 → 17 → 18.3 → 19): сначала последняя минорная своей ветки и устранение предупреждений, затем следующая мажорная, а не «большой взрыв» с заморозкой фич"
      weight: 3
    - id: classes-not-mandatory
      text: "Классовые компоненты в React 19 поддерживаются, переписывать всё не обязательно: на хуки переводят активно меняющийся код и новые фичи («правило бойскаута»)"
      weight: 3
    - id: safety-net-first
      text: "Перед обновлением нужна страховка: аудит устаревших API, e2e-тесты на ключевые сценарии, мониторинг ошибок, feature flags"
      weight: 2
    - id: remove-legacy-apis-before-19
      text: "До React 19 обязательно убрать удалённые API: строковые refs, legacy context, `ReactDOM.render` (заменяется на `createRoot`), `findDOMNode`, `propTypes`/`defaultProps` у функций; помогают официальные codemods (`react/19/migration-recipe`, `types-react-codemod`)"
      weight: 2
    - id: react18-batching-strictmode
      text: "При переходе на React 18 нужно проверить автоматический батчинг и StrictMode: двойной запуск эффектов в dev выявляет ошибки в cleanup"
      weight: 1
    - id: parallel-infra
      text: "Параллельно обновляют инфраструктуру и проверяют совместимость сторонних библиотек: CRA → Vite (`REACT_APP_` → `VITE_`), Enzyme → Testing Library, PropTypes → TypeScript, `connect` → хуки Redux"
      weight: 1
  misconceptions:
    - Перед обновлением до React 19 нужно обязательно переписать все классовые компоненты на хуки, т.к. классы больше не поддерживаются
    - Error Boundary можно реализовать на хуках без класса (без обёртки вроде `react-error-boundary`)
    - Можно сразу прыгнуть с React 16 на 19, не проходя 18.3 и не устраняя предупреждения об устаревших API
    - Двойной запуск эффектов в StrictMode — баг React, и StrictMode стоит просто отключить
- question: flux-unidirectional
  points:
    - id: mvc-two-way-cascades
      text: В клиентском MVC с двусторонним связыванием представление и модель обновляют друг друга, из-за чего возникают каскадные обновления и источник изменения трудно отследить
      weight: 3
    - id: flux-cycle
      text: Во Flux данные идут по одностороннему циклу Action → Dispatcher → Store → View, а пользовательские события порождают новые действия
      weight: 3
    - id: store-only-mutation
      text: Состояние меняется только в сторе в ответ на явные действия, поэтому любое изменение можно отследить, залогировать и воспроизвести (лог действий, time-travel в Redux DevTools)
      weight: 2
    - id: redux-simplification
      text: Redux упростил Flux до одного стора и чистых редьюсеров; та же идея лежит в `useReducer`, Zustand, Elm
      weight: 2
    - id: react-itself-unidirectional
      text: React сам по себе однонаправлен (props вниз, события вверх, «state → UI»), однонаправленный поток не требует обязательного Redux
      weight: 2
    - id: modern-landscape
      text: Сегодня большая часть «глобального состояния» — серверный кэш (TanStack Query, RSC), клиентского состояния мало, а сигналы дают гранулярную реактивность, сохраняя однонаправленный поток
      weight: 1
  misconceptions:
    - Однонаправленный поток данных = обязательно использовать Redux или Flux-библиотеку
    - Во Flux/Redux View может напрямую изменять состояние стора, минуя действия
    - В React есть встроенное двустороннее связывание данных, как `v-model` или `ng-model`
    - Сигналы отменяют однонаправленный поток и возвращают двустороннее связывание
- question: system-design-autocomplete
  points:
    - id: requirements-first
      text: "Ответ начинается с уточнения требований: функциональных (минимум символов, клавиатура, мышь, недавние запросы, мобильные) и нефункциональных (латентность, масштаб), а не с кода"
      weight: 2
    - id: debounce-abort-race
      text: "Поток данных: ввод проходит через debounce, устаревшие запросы отменяются через `AbortSignal`/`AbortController`, чтобы поздний ответ на старый запрос не перезаписал актуальные результаты (гонки)"
      weight: 3
    - id: combobox-a11y
      text: 'Доступность по паттерну combobox WAI-ARIA: поле с `role="combobox"`, `aria-expanded`, `aria-controls`, `aria-activedescendant`; список `role="listbox"` с `role="option"`/`aria-selected`; навигация стрелками, Enter, Escape, фокус остаётся в поле'
      weight: 3
    - id: client-cache
      text: Результаты кэшируются на клиенте по ключу запроса (например, `queryKey` со `staleTime` в TanStack Query), а предыдущие результаты показываются во время загрузки, чтобы список не мигал
      weight: 2
    - id: ui-states
      text: "Явно перечислены состояния UI: пусто/меньше минимума символов, загрузка, результаты, ошибка с повтором, «нет результатов»"
      weight: 2
    - id: edge-cases-perf
      text: "Названы краевые случаи и оптимизации: IME-ввод через события composition, виртуализация длинного списка, безопасная подсветка совпадений без `dangerouslySetInnerHTML`, закрытие по клику снаружи; тестирование через MSW, фейковые таймеры и axe"
      weight: 1
  misconceptions:
    - "Отмена через `AbortController` не нужна: достаточно debounce, гонок ответов при нём не бывает"
    - При навигации стрелками фокус нужно переносить на элемент списка — на самом деле фокус остаётся в поле, активный вариант указывается через `aria-activedescendant`
    - Подсветку совпадений проще и безопасно делать через `dangerouslySetInnerHTML` с вставкой `<mark>` в строку
    - Отправлять запрос на каждое событие ввода, включая промежуточные состояния IME-композиции, — это корректное поведение
- question: code-review
  points:
    - id: correctness-focus
      text: "В первую очередь проверяется корректность: эффекты и честность их зависимостей, наличие cleanup, гонки и утечки, стабильные ключи списков, отсутствие мутаций state"
      weight: 3
    - id: automate-style
      text: "Стиль и простые правила не обсуждаются человеком: их проверяют Prettier, ESLint и TypeScript в CI, а ревьюер смотрит на смысл"
      weight: 3
    - id: state-architecture
      text: "Проверяется архитектура состояния: оно минимально, нет дублирования источников истины, производные данные вычисляются при рендере, а не хранятся в state с синхронизацией через `useEffect`; серверные данные — в кэше, а не в `useState`"
      weight: 2
    - id: perf-a11y-security
      text: Отдельно смотрят производительность (лишние рендеры на горячих путях, компоненты внутри компонентов, размер бандла), доступность (семантика, клавиатура, фокус) и безопасность (`dangerouslySetInnerHTML`, пользовательские URL, секреты в клиенте, права на сервере)
      weight: 2
    - id: types-tests-states
      text: Типы без `any` и лишних `as`, невозможные состояния непредставимы; обработаны загрузка, ошибка и пустой результат; тесты проверяют поведение, а не реализацию
      weight: 2
    - id: review-culture
      text: "Культура ревью: объяснять «почему», разделять блокирующие замечания и `nit:`, быстро отвечать и требовать небольших PR, которые можно понять примерно за 15 минут"
      weight: 1
  misconceptions:
    - Главная цель code review — следить за форматированием и стилем кода
    - Хранить отфильтрованный/производный список в `useState` и синхронизировать его через `useEffect` — нормальная практика
    - Большой PR можно одобрить «LGTM», если CI зелёный, не разбираясь в изменениях
    - Проверка прав доступа на клиенте достаточна для безопасности
- question: system-design-news-feed
  points:
    - id: cursor-pagination
      text: "API пагинируется курсором (`GET /feed?cursor=&limit=` → `{ items, nextCursor }`), а не offset: курсор стабилен при появлении новых постов, offset даёт дубликаты и пропуски"
      weight: 3
    - id: virtualization-sentinel
      text: Длинный список виртуализируется (например, `@tanstack/react-virtual`), а следующая страница подгружается заранее по `IntersectionObserver`-сентинелу с `rootMargin`, без дублирующих запросов во время загрузки
      weight: 3
    - id: infinite-query-cache
      text: Серверное состояние хранится в TanStack Query через `useInfiniteQuery` с кэшем страниц и `getNextPageParam`, возвращающим `nextCursor`; локальное UI-состояние остаётся в компонентах
      weight: 2
    - id: new-posts-banner
      text: "Новые посты (polling или SSE) не вставляются под пальцем: показывается баннер «N новых постов», и вставка происходит только по действию пользователя"
      weight: 2
    - id: optimistic-likes
      text: "Лайки оптимистичные: UI обновляется сразу, при ошибке откатывается, быстрые повторные нажатия дедуплицируются"
      weight: 1
    - id: layout-a11y-scroll
      text: 'Учтены изображения без сдвига вёрстки (`width`/`height` или `aspect-ratio`, `loading="lazy"`), восстановление позиции прокрутки при возврате и доступность: `role="feed"`/`article`, порядок фокуса, кнопка «Показать ещё» как альтернатива'
      weight: 1
  misconceptions:
    - Offset/номер страницы так же надёжен для живой ленты, как курсор — на деле при вставке новых постов он даёт дубликаты и пропуски
    - Виртуализация не нужна, достаточно `loading="lazy"` у картинок — тысячи DOM-узлов всё равно убивают плавность прокрутки и раздувают память
    - Новые посты нужно сразу автоматически вставлять в начало ленты — это сдвигает контент, который пользователь читает
    - Подгрузку следующей страницы стоит делать через обработчик `scroll` с вычислением `scrollTop` на каждое событие вместо `IntersectionObserver`
- question: system-design-chat
  points:
    - id: persistent-connection-transport
      text: Для входящих событий используется постоянное соединение (WebSocket); кандидат упоминает альтернативу — SSE + `POST` или long polling как запасной вариант
      weight: 2
    - id: optimistic-send-client-id
      text: Каждое исходящее сообщение получает клиентский id, сразу показывается со статусом «отправляется», а сервер подтверждает его (ack) по этому id; без подтверждения за таймаут — статус «ошибка» и возможность повторить
      weight: 3
    - id: order-dedup-server-seq
      text: Порядок задаётся серверным порядковым номером (или серверным временем), а не порядком прихода по сокету; дубликаты отбрасываются по `id`/`clientId`
      weight: 3
    - id: reconnect-sync-cursor
      text: При обрыве — heartbeat и переподключение с экспоненциальной задержкой, после чего клиент запрашивает пропущенные события с последнего известного курсора (`lastSeq`) и досылает очередь неотправленных
      weight: 2
    - id: virtualized-list-scroll
      text: Список сообщений виртуализирован, история подгружается вверх с сохранением позиции прокрутки, а автопрокрутка к низу срабатывает только если пользователь уже внизу
      weight: 2
    - id: extras-offline-indicators-security
      text: "Сильный ответ затрагивает доп. аспекты: исходящие и черновики в IndexedDB для офлайна, троттлинг «печатает…», пакетные отметки прочтения, аутентификация соединения и санитизация контента"
      weight: 1
  misconceptions:
    - Можно полагаться на порядок прихода сообщений по WebSocket — после переподключения события приходят вперемешку, нужна сортировка по серверному номеру
    - Сообщение можно показывать только после ответа сервера, а клиентский id не нужен — тогда невозможно сопоставить ack с оптимистичным сообщением и избежать дублей
    - При переподключении достаточно просто заново открыть сокет — без синхронизации по курсору пропущенные сообщения теряются
    - Правильно автоматически прокручивать вниз при каждом новом сообщении — это выбрасывает пользователя из контекста, когда он читает историю
- question: offline-first-sync
  points:
    - id: local-source-of-truth
      text: "Локальная база (IndexedDB/Dexie в вебе, SQLite в мобильном) — источник истины для UI: чтение идёт из неё мгновенно, изменения сначала пишутся локально, а не ждут ответа сервера"
      weight: 3
    - id: outbox-idempotent-ops
      text: Изменения вместе с записью в локальную базу попадают в очередь исходящих операций (outbox); каждая операция имеет уникальный id (`opId`), и сервер применяет её идемпотентно, поэтому повторная отправка безопасна
      weight: 3
    - id: pull-by-cursor
      text: "Синхронизация двусторонняя: клиент отправляет свои операции и получает чужие изменения с последнего сохранённого курсора; принятые сервером операции удаляются из очереди"
      weight: 2
    - id: conflict-strategies
      text: "Конфликты разрешаются выбранной стратегией: last-write-wins прост, но теряет данные; слияние по полям и версии сущности подходят для форм; CRDT (Yjs, Automerge) — для совместного редактирования текста"
      weight: 2
    - id: intent-ops-not-snapshots
      text: В очередь кладут операции с намерением («переименовать в X»), а не снимки состояния целиком
      weight: 1
    - id: pitfalls-clock-tombstones
      text: "Называет подводные камни: время устройства ненадёжно для разрешения конфликтов (нужны версии или серверный порядок), а удаления требуют tombstones, иначе другой клиент «воскресит» запись"
      weight: 1
  misconceptions:
    - Persist кэша TanStack Query (или кэш Service Worker) сам по себе даёт полноценный offline-first с офлайн-записью — на деле это только офлайн-чтение
    - Конфликты надёжно разрешаются сравнением `Date.now()` с устройств по принципу last-write-wins без потери данных
    - Удалённую запись можно просто стереть из локальной базы и сервера — специальная пометка об удалении не нужна
    - Повторная отправка операции после обрыва сети безопасна и без уникального id операции и идемпотентной обработки на сервере
- question: monorepo
  points:
    - id: atomic-changes-shared-code
      text: "Главный плюс монорепозитория — атомарные изменения: библиотека и все её потребители меняются в одном коммите/PR, а код переиспользуется без публикации пакетов"
      weight: 3
    - id: infra-workspaces-orchestrator
      text: "Монорепозиторий требует инфраструктуры: workspaces пакетного менеджера (pnpm/npm/Yarn) и оркестратор задач с графом зависимостей и кэшем (Turborepo, Nx)"
      weight: 3
    - id: affected-and-remote-cache
      text: В CI запускаются только задачи затронутых изменением пакетов и их зависимых, а кэш (в том числе remote cache) пропускает задачи с неизменившимися входами — иначе CI растёт до часов
      weight: 2
    - id: structure-apps-packages
      text: "Типичная структура: `apps/*` для приложений (web, mobile, api) и `packages/*` для общих пакетов (`ui`, `core` с доменной логикой без React, `config` с общими tsconfig/eslint)"
      weight: 2
    - id: package-boundaries
      text: "Нужны границы между пакетами: приложение не импортирует другое приложение, `core` не зависит от React, импорт только через `exports`, а не из внутренних путей; проверяется линтером или тегами Nx"
      weight: 2
    - id: pnpm-internal-packages-changesets
      text: "Упоминает практические решения: pnpm строже (нет фантомных зависимостей), внутренние пакеты можно отдавать исходниками TS без сборки, Changesets — для версионирования публикуемых наружу пакетов"
      weight: 1
  misconceptions:
    - "Монорепозиторий — это то же самое, что монолит: все приложения обязательно собираются и деплоятся вместе как одно целое"
    - Чтобы использовать общий пакет в монорепозитории, его обязательно нужно публиковать в npm-реестр и обновлять версию
    - В монорепозитории CI всегда пересобирает и тестирует весь репозиторий при любом изменении — это неизбежная цена подхода
    - Импорт из `packages/ui/src/internal/...` в обход `exports` допустим, раз код всё равно лежит в одном репозитории
- question: feature-flags
  points:
    - id: deploy-vs-release
      text: "Feature flag отделяет деплой кода от релиза функции: код уже в продакшене, но включается флагом для сегмента (команда, процент пользователей, конкретный клиент)"
      weight: 3
    - id: gradual-rollout-kill-switch
      text: Флаг даёт постепенную выкатку (внутренние → 1% → 10% → 50% → 100%) с мониторингом ошибок и метрик на каждом шаге и мгновенное выключение без отката деплоя
      weight: 3
    - id: server-evaluation
      text: Значения флагов вычисляются на сервере, правила раскатки не попадают в бандл; при SSR клиент получает значения до рендера, чтобы не было мигания и ошибок гидрации
      weight: 2
    - id: flag-cleanup
      text: "Временные флаги нужно удалять (есть владелец и срок): каждый живой флаг удваивает число путей в коде и тестах, а зависящие друг от друга флаги дают непротестированные комбинации"
      weight: 2
    - id: deterministic-bucketing
      text: Раскатка на процент детерминирована (хеш от флага и `userId`), поэтому пользователь всегда попадает в одну группу; безопасное значение по умолчанию — выключено, если сервис флагов недоступен
      weight: 2
    - id: flag-types-openfeature
      text: Различает типы флагов (release, experiment, ops/kill switch, permission) и упоминает OpenFeature как единый API поверх провайдеров вроде LaunchDarkly, Unleash, GrowthBook
      weight: 1
  misconceptions:
    - Флаги можно вычислять на клиенте после загрузки без последствий — на деле это мигание старого интерфейса и расхождение с SSR
    - Процент раскатки можно определять через `Math.random()` при каждом запросе — пользователь будет прыгать между вариантами
    - Флаги, включённые на 100%, можно оставлять в коде навсегда — это технический долг, удваивающий пути в коде и тестах
    - При недоступности сервиса флагов по умолчанию стоит включать новую функцию
