- question: use-state
  points:
    - id: setter-queues-rerender
      text: Вызов `setValue` не меняет переменную в текущем рендере, а ставит обновление в очередь и планирует новый рендер
      weight: 3
    - id: render-snapshot
      text: "Каждый рендер видит свой «снимок» состояния: внутри обработчика `count` остаётся старым значением, поэтому `console.log` после `setCount` выводит прежнее значение"
      weight: 3
    - id: updater-function
      text: Для обновления на основе предыдущего значения передают функцию-апдейтер `setCount(c => c + 1)`; два вызова `setCount(count + 1)` дадут +1, а два апдейтера — +2
      weight: 2
    - id: batching
      text: Несколько обновлений в одном обработчике объединяются в один рендер (батчинг), а начиная с React 18 — также в промисах и таймаутах
      weight: 2
    - id: object-is-and-replace
      text: Новое значение сравнивается с текущим через `Object.is`, поэтому мутация того же объекта не вызовет рендер; `setState` хука заменяет объект целиком, а не сливает поля
      weight: 1
    - id: lazy-init
      text: Ленивая инициализация `useState(() => expensiveInit())` вызывает функцию только при первом рендере, а `useState(expensiveInit())` — при каждом
      weight: 1
  misconceptions:
    - "`setState` синхронно меняет значение переменной, и его можно сразу прочитать в следующей строке"
    - "`setState` в хуке сливает (merge) переданный объект с предыдущим, как `this.setState` в классах"
    - Можно мутировать объект состояния и передать его же в `setState` — React заметит изменение и перерендерит
    - Батчинг работает только в обработчиках событий React, а в промисах и `setTimeout` каждый вызов вызывает отдельный рендер (так было до React 18)
- question: use-effect-basics
  points:
    - id: sync-external-system
      text: "`useEffect` нужен для синхронизации компонента с внешней системой: сетью, подписками, таймерами, DOM-API, сторонними виджетами"
      weight: 3
    - id: timing-and-cleanup
      text: Эффект запускается после того, как React применил изменения к экрану; cleanup вызывается перед следующим запуском эффекта и при размонтировании
      weight: 3
    - id: deps-array-modes
      text: "Массив зависимостей управляет запусками: `[a, b]` — при изменении зависимостей (сравнение `Object.is`), `[]` — только после монтирования, без массива — после каждого рендера"
      weight: 2
    - id: when-not-needed
      text: Эффект не нужен для вычисления данных для рендера (считать в теле компонента), реакции на действия пользователя (обработчик событий) и сброса state при смене props (`key`)
      weight: 2
    - id: strict-mode-double-run
      text: В Strict Mode в разработке React монтирует, размонтирует и снова монтирует компонент, чтобы проверить корректность cleanup — это не баг
      weight: 1
    - id: deps-pitfalls
      text: Пропущенные зависимости приводят к stale closure (стоит доверять `react-hooks/exhaustive-deps`), а объекты и функции, создаваемые в рендере, в зависимостях вызывают запуск эффекта на каждом рендере
      weight: 1
  misconceptions:
    - Эффект запускается синхронно во время рендера или до отрисовки на экране
    - Cleanup вызывается только при размонтировании компонента, а не перед каждым повторным запуском эффекта
    - Двойной запуск эффекта в разработке — это баг, и его нужно подавлять (например, флагом-ref или отключением Strict Mode)
    - Зависимости сравниваются глубоко (по содержимому объектов), а не через `Object.is`
- question: use-ref
  points:
    - id: mutable-persistent-object
      text: "`useRef(initial)` возвращает изменяемый объект `{ current }`, который сохраняется между рендерами на всё время жизни компонента"
      weight: 3
    - id: no-rerender-on-change
      text: Изменение `ref.current` не вызывает повторный рендер, поэтому для данных, отображаемых на экране, нужен state, а не ref
      weight: 3
    - id: two-use-cases
      text: "Два основных применения: доступ к DOM-узлу (фокус, скролл, размеры, интеграция с библиотеками) и хранение значения вне рендера (id таймера, предыдущее значение, экземпляр стороннего объекта)"
      weight: 2
    - id: no-read-write-in-render
      text: Читать или писать `ref.current` во время рендера нельзя (кроме ленивой инициализации) — делать это следует в обработчиках событий и эффектах
      weight: 2
    - id: useref-vs-createref
      text: "`createRef` создаёт новый объект при каждом вызове и предназначен для классов; в функциональном компоненте он давал бы новый ref на каждом рендере, поэтому используется `useRef`"
      weight: 1
    - id: react19-ref-as-prop
      text: В React 19 `ref` передаётся в свой компонент как обычный prop без `forwardRef`, а ref-колбэк может возвращать функцию очистки
      weight: 1
  misconceptions:
    - Изменение `ref.current` вызывает перерендер компонента
    - "`useRef` создаёт новый объект на каждом рендере, как `createRef`"
    - Ref можно использовать вместо state для отображаемых данных — UI обновится
    - В React 19 для передачи `ref` в свой функциональный компонент по-прежнему обязателен `forwardRef`
- question: rules-of-hooks
  points:
    - id: top-level-only
      text: Хуки вызываются только на верхнем уровне компонента или кастомного хука. Их нельзя вызывать в условиях, циклах, обработчиках событий, колбэках `useEffect`/`useMemo` и после раннего `return`.
      weight: 3
    - id: order-based-matching
      text: React хранит состояние хуков компонента в связном списке на Fiber и сопоставляет его с хуками по порядку вызова. Если порядок между рендерами меняется, состояние «съезжает» к другому хуку.
      weight: 3
    - id: only-components-and-custom-hooks
      text: Хуки можно вызывать только из функциональных компонентов и кастомных хуков. Имя кастомного хука начинается с `use`.
      weight: 2
    - id: early-return-example
      text: "Пример нарушения: ранний `return` до `useState` (например, `if (!user) return null`). Исправление: сначала объявить все хуки, затем писать условия."
      weight: 2
    - id: use-exception
      text: "Исключение — хук `use` из React 19: его можно вызывать в условиях и циклах, потому что он не хранит состояние в списке хуков."
      weight: 1
    - id: purity-and-linter
      text: Хуки и компоненты должны быть чистыми, а значения, переданные в хуки и возвращённые из них, не мутируются. Соблюдение правил проверяет `eslint-plugin-react-hooks`, включая проверки для React Compiler.
      weight: 1
  misconceptions:
    - Правила хуков — всего лишь стилистическое соглашение линтера, не связанное с внутренним устройством React.
    - React различает хуки по имени переменной или по ключу, поэтому порядок вызовов не важен.
    - Хук можно вызвать внутри колбэка `useEffect`, `useMemo` или обработчика события, раз он всё равно находится внутри компонента.
    - Хуки можно использовать в классовых компонентах или в обычных функциях без префикса `use`, если вызывать их из компонента.
- question: effect-race-conditions
  points:
    - id: race-cause
      text: "Гонка возникает, когда зависимость меняется быстрее, чем приходит ответ: старый запрос завершается позже нового и перезаписывает актуальные данные"
      weight: 3
    - id: cleanup-abort-or-ignore
      text: В cleanup эффекта нужно отменить запрос через `AbortController` (`controller.abort()`) или выставить флаг, по которому устаревший результат игнорируется
      weight: 3
    - id: handle-abort-error
      text: При отмене через `AbortController` нужно отфильтровывать `AbortError` в `catch`, иначе при каждом переключении в UI появятся ложные ошибки
      weight: 2
    - id: use-libraries
      text: В продакшене чаще используют TanStack Query, SWR или загрузчики роутера, которые решают гонки из коробки и дают кэш, дедупликацию, повторы, обновление при фокусе окна
      weight: 2
    - id: no-async-effect
      text: "Нельзя передавать `async` функцию прямо в `useEffect`: она вернёт промис вместо функции cleanup, асинхронную функцию объявляют внутри эффекта"
      weight: 1
    - id: waterfalls
      text: Упоминает водопады запросов при загрузке в эффектах и то, что фреймворки решают их, начиная загрузку до рендера (loaders, Server Components, prefetch)
      weight: 1
  misconceptions:
    - Можно написать `useEffect(async () => ...)` и React сам дождётся промиса и корректно выполнит cleanup
    - Cleanup эффекта вызывается только при размонтировании компонента, поэтому при смене `userId` старый запрос не отменить
    - Ответы на `fetch` всегда приходят в порядке отправки запросов, поэтому гонки невозможны
    - "`AbortError` — это настоящая ошибка сети, и её нужно показывать пользователю"
- question: you-might-not-need-an-effect
  points:
    - id: effect-for-external-sync
      text: Эффект нужен только для синхронизации компонента с внешней системой (DOM-API, подписки, сеть, сторонние виджеты), а не для преобразования данных или реакции на события
      weight: 3
    - id: derived-data-in-render
      text: Производные данные вычисляются прямо в рендере (при дорогом расчёте — через `useMemo`), а не через `useEffect` + `setState`
      weight: 3
    - id: user-actions-in-handlers
      text: "Логика, вызванная действием пользователя (покупка, отправка формы, уведомление родителя через `onChange`), выполняется в обработчике события, а не в эффекте. Критерий: код должен выполниться «потому что пользователь нажал», а не «потому что компонент показан»"
      weight: 2
    - id: reset-state-with-key
      text: Сброс state при смене сущности делается через `key` (например, `<Comments key={postId} />`), а не эффектом, который вызывает `setState` при изменении props
      weight: 2
    - id: effect-chains
      text: Цепочки эффектов, где один эффект меняет state, а другой на это реагирует, превращают компонент в неявную машину состояний и усложняют отладку
      weight: 1
    - id: cost-of-extra-effects
      text: "Цена лишних эффектов: дополнительный рендер сначала со старым значением, затем с новым, мерцание UI и баги с порядком обновлений"
      weight: 1
  misconceptions:
    - Считать, что производный state нужно синхронизировать через `useEffect` и `setState`, потому что так «реактивнее» или правильнее
    - Утверждать, что `useMemo` обязателен для любых вычислений в рендере, а без него нужно использовать эффект
    - Считать, что любая аналитика или побочное действие должны быть в эффекте, включая события «по клику», хотя они относятся к обработчику
    - Утверждать, что эффект выполняется синхронно до отрисовки и поэтому `setState` в нём не вызывает лишнего рендера
- question: use-reducer
  points:
    - id: reducer-pure-function
      text: Reducer — чистая функция `(state, action) => newState`, которая описывает все переходы состояния в одном месте
      weight: 3
    - id: when-use-reducer
      text: "`useReducer` выбирают, когда state сложный, переходы зависят друг от друга или одно действие меняет несколько полей; для независимых простых значений проще `useState`"
      weight: 3
    - id: purity-no-side-effects
      text: "В reducer нельзя делать запросы, вызывать `Math.random()` и мутировать state: в Strict Mode он вызывается дважды"
      weight: 2
    - id: immutable-return
      text: "Reducer должен возвращать новый объект: если мутировать `state` и вернуть ту же ссылку, рендера не будет"
      weight: 2
    - id: stable-dispatch
      text: "`dispatch` стабилен между рендерами, его можно передавать вниз без `useCallback`"
      weight: 1
    - id: testability-and-types
      text: Логику reducer легко тестировать отдельно от компонента, а discriminated unions в TypeScript исключают невозможные состояния
      weight: 1
  misconceptions:
    - Внутри reducer можно выполнять запросы или другие сайд-эффекты, например вызывать fetch
    - Можно мутировать `state` в reducer и вернуть тот же объект — React всё равно перерисует компонент
    - "`dispatch` создаётся заново на каждый рендер, поэтому его нужно оборачивать в `useCallback`"
    - "`useReducer` всегда предпочтительнее `useState`, даже для простых независимых значений"
- question: custom-hooks
  points:
    - id: use-prefix-calls-hooks
      text: Кастомный хук — обычная функция с именем на `use`, которая внутри вызывает другие хуки (`useState`, `useEffect` и т.д.) и инкапсулирует переиспользуемую логику с состоянием
      weight: 3
    - id: logic-not-state-shared
      text: "Хуки делятся логикой, а не состоянием: каждый вызов хука в разных компонентах получает своё независимое состояние; для общего состояния нужен Context или стор"
      weight: 3
    - id: concrete-purpose
      text: Хороший хук решает одну конкретную задачу с понятным API (например, `useDebouncedValue`, `useOnlineStatus`, `useMediaQuery`), а обёртки вроде `useMount`/`useEffectOnce` плохи, так как прячут суть эффекта
      weight: 2
    - id: stable-return-api
      text: Возвращаемые функции стоит делать стабильными через `useCallback`, а объекты мемоизировать, иначе новый объект на каждом рендере ломает мемоизацию и зависимости у потребителей
      weight: 2
    - id: concrete-example
      text: Приводит рабочий пример хука, например debounce через `useEffect` с `setTimeout` и `clearTimeout` в cleanup или подписку на внешний источник через `useSyncExternalStore`
      weight: 1
    - id: testing-and-libraries
      text: Упоминает тестирование хука через `renderHook` из Testing Library или совет не переизобретать готовые решения (TanStack Query, React Hook Form)
      weight: 1
  misconceptions:
    - Два компонента, вызывающие один и тот же кастомный хук, разделяют общее состояние
    - Префикс `use` — лишь соглашение об именовании, без него хук работает так же и проверки линтера не нужны
    - Кастомный хук можно вызывать условно или внутри циклов, поскольку это обычная функция
    - Кастомный хук обязан возвращать JSX или является разновидностью компонента/HOC
- question: use-layout-effect
  points:
    - id: timing-before-paint
      text: "`useLayoutEffect` запускается синхронно после обновления DOM (commit), но до отрисовки кадра браузером. `useEffect` запускается после отрисовки и не блокирует её."
      weight: 3
    - id: measure-without-flicker
      text: "`useLayoutEffect` нужен, чтобы измерить DOM и сразу поправить положение или размер без визуального мерцания. Примеры: тултипы, поповеры, автоскролл."
      weight: 2
    - id: blocks-paint-tradeoff
      text: "`useLayoutEffect` блокирует отрисовку, поэтому тяжёлый код в нём ухудшает отзывчивость интерфейса."
      weight: 2
    - id: default-use-effect
      text: По умолчанию используют `useEffect`. На `useLayoutEffect` переходят, только если видно мерцание из-за измерений DOM.
      weight: 1
    - id: ssr-not-run
      text: На сервере `useLayoutEffect` не выполняется (раньше при SSR React выдавал предупреждение).
      weight: 1
    - id: insertion-effect
      text: "Есть ещё `useInsertionEffect`: он запускается до layout-эффектов и предназначен только для авторов CSS-in-JS библиотек, чтобы вставлять стили."
      weight: 1
  misconceptions:
    - "`useLayoutEffect` запускается до изменения DOM или во время рендера, поэтому в нём нельзя прочитать актуальные размеры элементов"
    - Если перенести загрузку данных в `useLayoutEffect`, данные придут быстрее (на деле это не ускоряет загрузку, а только блокирует кадр)
    - "`useEffect` тоже выполняется синхронно до отрисовки, а хуки отличаются только названием или порядком"
    - "`useLayoutEffect` выполняется на сервере при SSR так же, как на клиенте"
- question: use-id
  points:
    - id: stable-ssr-id
      text: "`useId()` возвращает уникальный идентификатор, который стабилен между рендерами и совпадает на сервере и клиенте"
      weight: 3
    - id: a11y-linking
      text: "Основное назначение — связывать элементы через атрибуты доступности: `htmlFor`/`id`, `aria-describedby`, `aria-labelledby`"
      weight: 3
    - id: random-breaks-hydration
      text: "`Math.random()` или глобальный счётчик не подходят: при SSR id на сервере и клиенте расходятся, и гидрация ломается"
      weight: 2
    - id: hardcoded-not-unique
      text: Захардкоженный `id` перестаёт быть уникальным, если компонент отрендерен на странице несколько раз, и `label` ссылается не на тот элемент
      weight: 2
    - id: tree-path-based
      text: id строится из пути компонента в дереве, поэтому не зависит от порядка выполнения кода; из одного id можно получить несколько через суффиксы (`${id}-hint`)
      weight: 1
    - id: not-for-keys
      text: "`useId` не используют для `key` в списках: ключи должны выводиться из данных"
      weight: 1
  misconceptions:
    - "`useId` подходит для генерации `key` элементов списка"
    - "`useId` возвращает новое значение при каждом рендере"
    - При SSR для id можно безопасно использовать `Math.random()` или инкрементный счётчик
    - "`useId` генерирует идентификаторы для данных (например, id записей для базы или API)"
- question: stale-closure
  points:
    - id: stale-count-diagnosis
      text: Эффект с пустыми зависимостями `[]` захватывает `count` из первого рендера, поэтому колбэк интервала всегда вызывает `setCount(0 + 1)`, и счётчик застревает на 1.
      weight: 3
    - id: updater-fix
      text: "Основное исправление — функция-апдейтер `setCount(c => c + 1)`: она получает актуальное состояние, и эффекту вообще не нужен `count` в зависимостях."
      weight: 3
    - id: render-closure-cause
      text: Каждый рендер — отдельный вызов функции со своими константами, и колбэк видит значения только своего рендера. Это обычное замыкание JavaScript, а не особенность React.
      weight: 2
    - id: deps-fix-drawback
      text: Добавление `count` в зависимости формально работает, но интервал пересоздаётся каждую секунду и сбивается, поэтому это худшее решение.
      weight: 2
    - id: use-effect-event
      text: Чтобы читать актуальные значения (например, `step`) без перезапуска интервала, логику выносят в `useEffectEvent` (React 19.2) и вызывают её из эффекта с `[]`.
      weight: 2
    - id: no-lint-disable-other-cases
      text: Отключать правило `exhaustive-deps` — не решение, а маскировка бага. Та же проблема встречается в подписках на события, WebSocket-обработчиках, `setTimeout` и колбэках сторонних библиотек; альтернатива — хранить актуальное значение в `ref`.
      weight: 1
  misconceptions:
    - Устаревшее замыкание — это баг или особое поведение React, а не обычная семантика замыканий JavaScript.
    - Отключение правила линтера `exhaustive-deps` исправляет проблему.
    - Добавить `count` в массив зависимостей — правильное решение без побочных эффектов.
    - Функцию из `useEffectEvent` нужно указывать в зависимостях эффекта, или её можно вызывать во время рендера и передавать как проп.
- question: use-effect-event
  points:
    - id: reactive-vs-nonreactive
      text: "`useEffectEvent` разделяет логику эффекта на реактивную (изменение значения должно перезапускать эффект, например `roomId`) и нереактивную (значение нужно только прочитать, например `theme`)"
      weight: 3
    - id: latest-values-not-dependency
      text: Функция-событие всегда видит последние props и state, но не является реактивной зависимостью, поэтому её изменение не перезапускает эффект
      weight: 3
    - id: chat-example
      text: "Приводит пример: смена `theme` не должна переподключать чат, хотя уведомление о подключении должно использовать актуальную тему"
      weight: 2
    - id: usage-rules
      text: "Называет правила: вызывать только внутри эффектов (и функций, вызываемых из них), не в рендере и не в обработчиках, не передавать в другие компоненты и хуки, не добавлять в массив зависимостей"
      weight: 2
    - id: ref-latest-pattern
      text: Упоминает, что раньше эту задачу решали паттерном `useRef` с «latest value»
      weight: 1
    - id: not-linter-bypass
      text: "Подчёркивает, что это не способ обойти линтер: оборачивание всего кода эффекта ломает синхронизацию, и сначала стоит проверить, нужна ли зависимость вообще"
      weight: 1
  misconceptions:
    - "`useEffectEvent` — это аналог `useCallback`, возвращающий стабильную мемоизированную функцию, которую можно передавать в дочерние компоненты или обработчики"
    - Функцию из `useEffectEvent` нужно добавлять в массив зависимостей эффекта
    - "`useEffectEvent` можно вызывать во время рендера или в обычных обработчиках событий вроде `onClick`"
    - Можно обернуть весь код эффекта в `useEffectEvent`, чтобы безопасно избавиться от зависимостей
