# actions: принято из черновика 2026-10-11
- id: actions-vs-onsubmit-quiz
  skill: react-actions-concept
  question: actions
  difficulty: 2
  prompt: Чем Action в React 19 (`<form action={fn}>`, `useActionState`) отличается от ручного onSubmit с fetch?
  explanation: "Action — это async-функция, запущенная в transition. Поэтому React сам отслеживает pending, пробрасывает ошибки в Error Boundary, ставит отправки в очередь и после успеха сбрасывает неконтролируемые поля. Правило: всё, что раньше писали через isLoading и try/finally, теперь даёт сам React."
  type: quiz
  options:
    - label: "Action — async-функция в transition: React сам ведёт pending, ошибки, очередь отправок и сбрасывает неконтролируемые поля"
      why: Верно. Transition даёт pending-состояние и обработку ошибок через Error Boundary, а последовательные вызовы выполняются по порядку без гонок.
    - label: "Это сахар над onSubmit: React вызывает preventDefault и передаёт FormData, а pending и ошибки по-прежнему ведутся вручную"
      why: FormData и отмена перезагрузки — лишь часть. Главное в том, что функция запускается в transition, и состояние ожидания React ведёт сам.
    - label: Actions работают только с серверными функциями 'use server', для клиентской логики нужен onSubmit
      why: В action можно передать и обычную клиентскую async-функцию. Серверные функции добавляют прогрессивное улучшение, но не обязательны.
    - label: useActionState делает поля контролируемыми и сохраняет введённые значения после отправки
      why: Это типичный подводный камень. Поля остаются неконтролируемыми и сбрасываются после action, а нужные значения надо вернуть в state.
  answer: 0
- id: actions-form-status-same-component
  skill: use-form-status-scope
  question: actions
  difficulty: 2
  prompt: Кнопка никогда не блокируется во время отправки. Найдите строку с ошибкой.
  explanation: "`useFormStatus` возвращает статус ближайшей **родительской** `<form>`. Здесь форму рендерит тот же компонент, поэтому родительской формы нет и pending всегда false. Исправить можно двумя способами: вынести кнопку в дочерний SubmitButton или взять isPending третьим элементом из useActionState."
  type: find-bug
  language: tsx
  code: |-
    function NameForm() {
      const [state, formAction] = useActionState(
        updateName, { error: null }
      );
      const { pending } = useFormStatus();
      return (
        <form action={formAction}>
          <input name="name" />
          <button disabled={pending}>Save</button>
          {state.error && <p>{state.error}</p>}
        </form>
      );
    }
  bugLines:
    - 5
  causes:
    - "useFormStatus вызван в компоненте, который сам рендерит form: родительской формы нет, и pending всегда false"
    - useActionState нужно вызывать внутри дочернего компонента формы, иначе action не запустится
    - В action формы нельзя передавать функцию из useActionState, только исходную async-функцию
    - У кнопки нет type="submit", поэтому форма не отправляется и pending не меняется
  answer: 0
- id: actions-use-action-state-wiring
  skill: use-action-state-api
  question: actions
  difficulty: 2
  prompt: "Допишите форму: action читает поле из FormData, а форма получает результат и флаг ожидания через хук."
  explanation: "Функция для useActionState получает (prevState, formData) и возвращает новый state. Хук отдаёт кортеж [state, formAction, isPending], а formAction передаётся в проп `action` у form. useFormStatus не подходит: он нужен в потомке формы и не хранит результат."
  type: fill-tokens
  language: tsx
  code: |-
    async function addTodo(prev: State, data: FormData) {
      const title = String(data.___('title'));
      return api.addTodo(title);
    }
    function TodoForm() {
      const [state, formAction, isPending] =
        ___(addTodo, { error: null });
      return (
        <form ___={formAction}>
          <input name="title" />
          <button disabled={isPending}>Add</button>
        </form>
      );
    }
  tokens:
    - get
    - useActionState
    - action
  decoys:
    - value
    - useFormStatus
    - onSubmit
    - useTransition
- id: actions-progressive-form-choice
  skill: form-actions-choice
  question: actions
  difficulty: 3
  prompt: Next.js App Router, форма отзыва. Она должна отправляться ещё до загрузки JS, а ошибку серверной валидации нужно показать под полем. Клиентской валидации почти нет. Что выбрать?
  explanation: "Если важны прогрессивное улучшение и результат с сервера, берите серверную функцию с useActionState: форма работает как обычный HTML-POST, а state приносит ошибку. Для тяжёлой клиентской валидации лучше React Hook Form, а useFormStatus лишь дополняет этот выбор и показывает pending в кнопке."
  type: choose-tool
  options:
    - label: Серверная функция ('use server') + useActionState
      why: "Лучший выбор: <form action> работает до гидрации, state возвращает ошибку валидации, isPending даётся из коробки. Можно передать permalink."
    - label: onSubmit + useState + fetch к API-роуту
      why: Подойдёт, если нужен полный ручной контроль. Но без JS форма не работает, а pending, ошибки и гонки придётся вести самому.
    - label: React Hook Form
      why: Хорош при сложной клиентской валидации и зависимых полях. Но он требует JS, поэтому прогрессивного улучшения не даст.
    - label: Только useFormStatus в кнопке отправки
      why: Даёт лишь pending родительской формы в потомке. Результата действия и ошибок сервера у него нет, это дополнение к useActionState.
  answer: 0

# activity: принято из черновика 2026-10-11
- id: activity-hidden-semantics-quiz
  skill: activity-hidden-semantics
  question: activity
  difficulty: 2
  prompt: Что происходит с поддеревом внутри `<Activity mode="hidden">`?
  explanation: "Activity — середина между `{cond && <X />}` и CSS `display: none`. State и DOM сохраняются, эффекты отключаются, а обновления идут с самым низким приоритетом. Поэтому скрытый экран можно заранее отрендерить, и при показе он появится мгновенно."
  type: quiz
  options:
    - label: State и DOM сохраняются, эффекты размонтируются, а обновления рендерятся с самым низким приоритетом
      why: "Верно. Содержимое скрыто через display: none. При возврате в visible state на месте, а эффекты запускаются снова."
    - label: "Всё как с CSS `display: none`: state, DOM и эффекты продолжают работать, просто элемент не виден"
      why: "Именно это Activity и исправляет: у display: none подписки и таймеры работают зря. Activity вызывает cleanup эффектов скрытого дерева."
    - label: "Как условный рендеринг: DOM удаляется, но React запоминает state и восстанавливает его при показе"
      why: "DOM не удаляется, он остаётся в документе со стилем display: none. За счёт этого сохраняется, например, значение неконтролируемых полей."
    - label: React вообще не рендерит скрытое дерево, пока mode не станет visible
      why: "Наоборот: hidden-дерево рендерится в фоне с низким приоритетом. Поэтому Activity подходит для предзагрузки данных и кода следующего экрана."
  answer: 0
- id: activity-toggle-effects-state
  skill: activity-hidden-semantics
  question: activity
  difficulty: 2
  prompt: StrictMode нет. Сначала open = true, пользователь вводит «hi». Затем open становится false, потом снова true. Что будет в консоли и в поле?
  explanation: "При переходе в hidden React вызывает cleanup эффектов, но state не трогает. При возврате в visible эффекты запускаются снова, а text по-прежнему равен «hi». Правило: Activity сохраняет state, но не сохраняет работающие эффекты."
  type: predict-output
  language: tsx
  code: |-
    function Draft() {
      const [text, setText] = useState('');
      useEffect(() => {
        console.log('subscribe');
        return () => console.log('unsubscribe');
      }, []);
      return <input value={text}
        onChange={(e) => setText(e.target.value)} />;
    }

    <Activity mode={open ? 'visible' : 'hidden'}>
      <Draft />
    </Activity>
  options:
    - subscribe → unsubscribe → subscribe; в поле «hi»
    - subscribe → unsubscribe → subscribe; поле пустое
    - subscribe; в поле «hi»
    - subscribe → subscribe; в поле «hi»
  answer: 0
- id: activity-background-player
  skill: activity-effects-in-background
  question: activity
  difficulty: 3
  prompt: Музыка должна продолжать играть, когда пользователь уходит с вкладки плеера. Но она останавливается. Где ошибка?
  explanation: В hidden-режиме Activity размонтирует эффекты, и cleanup вызывает `audio.pause()`. Логику, которая должна работать в фоне (плеер, загрузка, сокет), выносят выше Activity, а в скрываемой части оставляют только UI управления.
  type: find-bug
  language: tsx
  code: |-
    function Player({ src }: { src: string }) {
      const ref = useRef<HTMLAudioElement>(null);
      useEffect(() => {
        const audio = ref.current!;
        audio.play();
        return () => audio.pause();
      }, [src]);
      return <audio ref={ref} src={src} />;
    }

    <Activity mode={tab === 'player' ? 'visible' : 'hidden'}>
      <Player src={track} />
    </Activity>
  bugLines:
    - 6
    - 11
    - 12
  causes:
    - "Плеер лежит внутри Activity: при hidden React вызывает cleanup эффектов и `pause()` срабатывает. Плеер нужно вынести выше"
    - Activity в режиме hidden удаляет `<audio>` из DOM, и воспроизведение прерывается
    - Эффект перезапускается, потому что src указан в зависимостях
    - В режиме hidden React навсегда перестаёт рендерить компонент, поэтому `play()` больше не вызывается
  answer: 0
- id: activity-tabs-hiding-choice
  skill: ui-hiding-strategy-choice
  question: activity
  difficulty: 2
  prompt: Вкладки «Лента» и «Сообщения». Черновик сообщения и загруженные данные лежат в локальном state компонентов вкладок, переписывать их не хочется. При переключении всё это нужно сохранять. Скрытая вкладка не должна держать WebSocket-подписку. Что выбрать?
  explanation: "Выбор способа скрытия сводится к трём вопросам: нужно ли сохранить state, нужно ли сохранить DOM и должны ли работать эффекты. «Сохранить всё, но остановить эффекты» — это `<Activity>`. «Ничего сохранять не нужно» — условный рендеринг. «Эффекты обязаны работать в фоне» — логику выносят выше дерева."
  type: choose-tool
  options:
    - label: '`<Activity mode="visible" | "hidden">`'
      why: Лучший вариант. State и DOM сохраняются, эффекты (и подписка) отключаются при скрытии и снова запускаются при показе.
    - label: Условный рендеринг `{tab === 'inbox' && <Inbox />}`
      why: Подписку остановит, но черновик и данные пропадут. Подходит для лёгких экранов без ценного локального state.
    - label: "CSS `display: none` через className"
      why: State и DOM сохранит, но эффекты продолжат работать, и WebSocket будет висеть зря. Годится для простых статичных блоков без подписок.
    - label: Поднять черновик и данные в глобальный стор (Zustand)
      why: Сработает, но придётся переписать компоненты, а DOM и прочий локальный state всё равно пересоздадутся. Оправдано, если данные нужны другим экранам.
  answer: 0

# react-19-changes: принято из черновика 2026-10-11
- id: react-19-changes-quiz
  skill: react-19-overview
  question: react-19-changes
  difficulty: 2
  prompt: Какое утверждение верно описывает изменение React 19 для повседневного кода?
  explanation: "Главные изменения React 19: Actions и хуки для форм (useActionState, useFormStatus, useOptimistic), API use, ref как prop, <Context> вместо <Context.Provider>, cleanup у ref-колбэков, <title>/<meta> прямо в компонентах. Удалены propTypes и defaultProps у функций, строковые refs, legacy context, ReactDOM.render."
  type: quiz
  options:
    - label: Функциональный компонент получает ref как обычный prop — forwardRef больше не нужен
      why: Верно. В React 19 ref приходит в props функционального компонента, forwardRef можно убрать (codemod делает это автоматически).
    - label: "useEffect заменён Actions: побочные эффекты теперь пишут в action-функциях"
      why: Actions — это асинхронные переходы для мутаций и форм. useEffect по-прежнему нужен для синхронизации с внешними системами.
    - label: defaultProps у функциональных компонентов стал основным способом задавать значения по умолчанию
      why: "Наоборот: defaultProps у функций в React 19 удалён. Значения по умолчанию задают через параметры по умолчанию при деструктуризации props."
    - label: <Context.Provider> удалён, старый синтаксис больше не работает
      why: Появилась возможность рендерить <Context> как провайдер, но <Context.Provider> продолжает работать; его устаревание планируется позже.
  answer: 0
- id: react-19-ref-callback-leak
  skill: ref-callback-cleanup
  question: react-19-changes
  difficulty: 2
  prompt: Панель перерисовывается при каждом onResize, и со временем вкладка начинает тормозить. Найдите строку с ошибкой.
  explanation: "Инлайн ref-колбэк — новая функция на каждом рендере, поэтому React отсоединяет старый ref и вызывает новый. Без cleanup каждый вызов создаёт ещё один ResizeObserver, а старые не отключаются. В React 19 из ref-колбэка можно вернуть cleanup: return () => ro.disconnect()."
  type: find-bug
  language: tsx
  code: |-
    function Panel({ onResize }: Props) {
      return (
        <div
          ref={(node) => {
            if (!node) return;
            const ro = new ResizeObserver(onResize);
            ro.observe(node);
          }}
        />
      );
    }
  bugLines:
    - 7
  causes:
    - "После observe нет return () => ro.disconnect(): при каждом новом вызове ref создаётся ещё один observer, а старые продолжают работать"
    - "Строка if (!node) return; ломает код: в React 19 undefined из ref-колбэка воспринимается как cleanup"
    - ResizeObserver нельзя создавать в ref-колбэке — только в useLayoutEffect
    - В React 19 ref-колбэк вызывается только один раз при монтировании, поэтому onResize устаревает
  answer: 0
