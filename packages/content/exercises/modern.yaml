    - "Исправить нарушения Rules of React: мутации в рендере, нечистые компоненты"
    - "Включить компилятор частично: по директориям или через директиву 'use memo'"
    - Прогнать тесты и сравнить профили до и после
    - Расширить охват, проблемные компоненты временно пометить 'use no memo'
- id: react-compiler-slow-render-choice
  skill: react-compiler-limits
  question: react-compiler
  difficulty: 2
  prompt: "React Compiler включён, но поиск по таблице из 20 000 строк тормозит при вводе. Профайлер показывает: основное время уходит на рендер тысяч строк, а видно на экране около 30. Что выбрать?"
  explanation: Компилятор избегает повторной работы при тех же входах, но при новом query отфильтрованный список честно рендерится заново. Если узкое место — объём работы, его нужно уменьшить, а не мемоизировать. Виртуализация рендерит только видимые строки.
  type: choose-tool
  options:
    - label: Виртуализация списка (например, TanStack Virtual)
      why: "Лучший вариант: число рендеримых строк сокращается с тысяч до нескольких десятков видимых."
    - label: Обернуть фильтрацию в useMemo, а строки — в memo
      why: Компилятор уже мемоизирует это сам. При новом query список пересчитывается, и тысячи строк всё равно рендерятся и монтируются.
    - label: useDeferredValue для query
      why: Сохранит отзывчивость инпута, если рендер умеренно тяжёлый. Но тысячи строк всё равно отрендерятся — это хорошее дополнение к виртуализации.
    - label: Пометить таблицу директивой 'use no memo'
      why: Директива отключает компилятор для компонента. Это нужно, когда компиляция ломает поведение, но не ускорит рендер.
  answer: 0

# suspense-deep-dive: принято из черновика 2026-10-11
- id: suspense-deep-dive-mechanics
  skill: suspense-mechanics
  question: suspense-deep-dive
  difficulty: 2
  prompt: Что делает React, когда компонент при рендере читает через `use(promise)` ещё не разрешённый промис?
  explanation: "Suspense — это не await внутри компонента. React бросает незавершённый рендер поддерева, показывает fallback ближайшей границы и потом рендерит компонент заново с нуля. Отсюда два правила: промис должен быть стабильным (кэшированным), а граница определяет, какой кусок UI заменится скелетоном."
  type: quiz
  options:
    - label: Прерывает рендер поддерева, показывает fallback ближайшей <Suspense> и повторяет рендер, когда промис разрешится
      why: Верно. Незавершённый рендер выбрасывается, граница показывает fallback, а после resolve React заново вызывает функцию компонента — теперь use вернёт значение.
    - label: Ставит компонент на паузу в месте вызова use и продолжает с той же строки после resolve, как await
      why: React не сохраняет стек выполнения компонента. Функция вызывается заново целиком, поэтому промис, созданный в рендере, при повторе окажется новым.
    - label: Рендерит компонент с undefined вместо данных, а после resolve делает обычный ререндер
      why: Так работает ручной паттерн useEffect + useState с флагом загрузки. С Suspense компонент не коммитится, пока данные не готовы.
    - label: Скрывает только этот компонент, а соседей внутри той же границы оставляет на экране
      why: Fallback заменяет всё содержимое границы. Чтобы соседи грузились независимо, их оборачивают в отдельные вложенные <Suspense>.
  answer: 0
- id: suspense-deep-dive-uncached-promise
  skill: suspense-stable-promise
  question: suspense-deep-dive
  difficulty: 2
  prompt: Компонент обёрнут в <Suspense>, но вместо постов скелетон крутится бесконечно. Найдите строку с ошибкой.
  explanation: "После resolve React повторяет рендер, и fetchPosts создаёт новый, ещё не готовый промис — компонент снова приостанавливается, и так по кругу. Промис должен приходить из кэша: useSuspenseQuery, RSC, кэш фреймворка или промис, созданный выше и переданный в props."
  type: find-bug
  language: tsx
  code: |-
    function Posts({ userId }: { userId: string }) {
      const posts = use(fetchPosts(userId));
      return (
        <ul>
          {posts.map((p) => (
            <li key={p.id}>{p.title}</li>
          ))}
        </ul>
      );
    }
  bugLines:
    - 2
  causes:
    - "Промис создаётся в каждом рендере: при повторе после resolve появляется новый незавершённый промис, и компонент приостанавливается снова"
    - use умеет читать только Context, для промисов внутри компонента нужен await
    - Клиентский компонент должен быть async, иначе use не дождётся промиса
    - Ключ p.id меняется между рендерами, поэтому список перемонтируется и снова грузится
  answer: 0
- id: suspense-deep-dive-keep-old-tab
  skill: suspense-transitions
  question: suspense-deep-dive
  difficulty: 3
  prompt: Вкладки «Посты» и «Друзья» внутри одной Suspense-границы. При клике на вкладку видимый контент сразу сменяется скелетоном. Нужно оставить текущую вкладку на экране, пока новая не загрузится. Что сделать?
  explanation: "Обновление в transition не прячет уже показанный контент за fallback: React держит старый UI, пока новое дерево не готово, а isPending даёт лёгкий индикатор. key на границе — обратный приём: он нужен, когда старые данные показывать нельзя."
  type: choose-tool
  options:
    - label: Обернуть setTab в startTransition (или useTransition с isPending)
      why: Лучший вариант. Transition не показывает fallback для уже видимого контента, старая вкладка остаётся до готовности новой, а isPending позволяет приглушить её.
    - label: Поставить key={tab} на границу <Suspense>
      why: Даёт обратный эффект — граница сбрасывается и гарантированно показывает fallback. Подходит, когда устаревший контент показывать нельзя, например при смене userId.
    - label: Вынести единую границу <Suspense> на уровень всего приложения
      why: "Fallback станет только крупнее: любая загрузка заменит спиннером весь экран. Это классический антипаттерн дизайна границ."
    - label: Убрать Suspense и вести флаг isLoading через useEffect
      why: Старый контент можно удержать вручную, но придётся самим решать гонки, кэш и координацию загрузок. Это шаг назад, если данные уже работают через Suspense.
  answer: 0
- id: suspense-deep-dive-suspend-timeline
  skill: suspense-render-timeline
  question: suspense-deep-dive
  difficulty: 3
  prompt: "Первый рендер страницы: внутри границы <Suspense> компонент Posts читает неготовый промис, а рядом стоят Friends. Расставьте события по порядку (React 19)."
  explanation: В React 19 при приостановке React сразу коммитит fallback и не дорендеривает соседей. Затем он pre-warm'ит их в фоне, чтобы их запросы стартовали параллельно, а не водопадом. После resolve React повторяет рендер и заменяет fallback контентом.
  type: order
  kind: timeline
  steps:
    - React рендерит дерево, Posts вызывает use(promise) с неразрешённым промисом
    - React прекращает рендер содержимого ближайшей границы <Suspense>
    - Коммитит fallback этой границы — пользователь видит скелетон
    - В фоне предрендерит соседей (Friends), чтобы запустить их запросы параллельно
    - Промис разрешается, и React заново рендерит содержимое границы
    - Коммитит готовый контент вместо fallback

# use-deferred-value: принято из черновика 2026-10-11
- id: use-deferred-value-vs-debounce-quiz
  skill: deferred-value-vs-debounce
  question: use-deferred-value
  difficulty: 3
  prompt: Что делает `useDeferredValue` и чем он принципиально отличается от debounce?
  explanation: "`useDeferredValue` управляет приоритетом рендера, а не временем. React рендерит срочное обновление со старым значением, затем в фоне с новым и прерывает фоновый рендер при новом вводе. Задержки нет: отставание зависит от скорости устройства. Сократить запросы к API так нельзя — для этого нужен debounce."
  type: quiz
  options:
    - label: "Отдаёт отстающую копию: срочный рендер со старым значением, затем прерываемый фоновый с новым, без фиксированной задержки"
      why: Верно. На быстром устройстве значение догоняет почти сразу, на медленном отстаёт, а ввод не блокируется.
    - label: "Это встроенный debounce: значение обновляется через фиксированную паузу после последнего изменения"
      why: Таймера нет. React начинает фоновый рендер сразу после срочного, а не после паузы во вводе.
    - label: "Сокращает число запросов к API: отложенное значение меняется реже, чем исходное"
      why: На быстром устройстве отложенное значение обновляется почти на каждый символ. Если нужно меньше запросов, используйте debounce.
    - label: Тяжёлый потомок не рендерится, пока ввод не стихнет, даже без memo
      why: Без memo потомок перерисуется в срочном проходе со старым значением, потому что перерисовывается родитель. Выигрыша не будет.
  answer: 0
- id: use-deferred-value-missing-memo
  skill: deferred-value-memo
  question: use-deferred-value
  difficulty: 2
  prompt: Проект без React Compiler. Ввод всё равно лагает, хотя список получает отложенное значение. Найдите строку с причиной.
  explanation: При каждом нажатии Search перерисовывается срочно, и вместе с ним SlowList — пусть со старым deferred, но вся тяжёлая работа выполняется. `memo(SlowList)` пропустит срочный проход, потому что props не изменились, и тяжёлым останется только прерываемый фоновый рендер. React Compiler мемоизирует такое автоматически.
  type: find-bug
  language: tsx
  code: |-
    function Search() {
      const [query, setQuery] = useState('');
      const deferred = useDeferredValue(query);
      const onChange = (e: ChangeEvent<HTMLInputElement>) =>
        setQuery(e.target.value);
      return (
        <>
          <input value={query} onChange={onChange} />
          <SlowList query={deferred} />
        </>
      );
    }

    function SlowList({ query }: { query: string }) {
      return <ul>{renderThousandsOfRows(query)}</ul>;
    }
  bugLines:
    - 14
  causes:
    - SlowList не обёрнут в memo и тяжело рендерится в каждом срочном проходе со старым значением
    - useDeferredValue нужно передать задержку в мс вторым аргументом, иначе откладывания нет
    - В input нужно передавать deferred вместо query, иначе срочный рендер не отложится
    - Вызов setQuery нужно обернуть в setTimeout, чтобы useDeferredValue заработал
  answer: 0
- id: use-deferred-value-external-prop
  skill: deferred-value-for-heavy-render
  question: use-deferred-value
  difficulty: 3
  prompt: Компонент `Chart` получает `filter` через props из сторонней формы, её код менять нельзя. Тяжёлый рендер графика тормозит ввод в форме. Запросов к API нет. Что выбрать?
  explanation: "Правило: контролируете вызов `setState` — берите `useTransition`. Значение пришло извне (props, сторонний хук) — `useDeferredValue` + `memo`. Нужно реже ходить в сеть — debounce. `useMemo` не делает рендер прерываемым."
  type: choose-tool
  options:
    - label: useDeferredValue(filter) + memo на тяжёлом графике
      why: Значение приходит извне, обновление не обернуть. Отложенная копия даёт прерываемый фоновый рендер, ввод остаётся отзывчивым.
    - label: useTransition вокруг обновления filter
      why: Подошёл бы, если бы setState был в нашем коде. Здесь он внутри сторонней формы, обернуть его в startTransition нельзя.
    - label: Debounce filter на 300 мс
      why: Уместен для сокращения запросов к API. Для рендера это фиксированная задержка даже на быстром устройстве, а сам тяжёлый рендер всё равно блокирует поток.
    - label: useMemo для вычисления данных графика
      why: Помогает, только если тяжёлое вычисление повторяется с теми же входами. При новом filter расчёт всё равно синхронный и блокирует ввод.
  answer: 0
- id: use-deferred-value-render-timeline
  skill: deferred-value-rendering
  question: use-deferred-value
  difficulty: 3
  prompt: Search с `useDeferredValue` и memo-списком. Пользователь ввёл «a», а пока шёл фоновый рендер — ещё «b». Расставьте события по порядку.
  explanation: "Срочный проход всегда идёт первым и использует старое отложенное значение — поэтому ввод мгновенный. Фоновый рендер прерываем: новый ввод отбрасывает незавершённую работу. На экран попадает только актуальное отложенное значение «ab», промежуточное «a» может так и не закоммититься."
  type: order
  kind: timeline
  steps:
    - "Срочный рендер: query = 'a', deferredQuery остаётся ''"
    - "Коммит: в input видно 'a', memo-список не перерисовался"
    - Начинается фоновый рендер с deferredQuery = 'a'
    - Ввод 'b' прерывает фоновый рендер, его результат отброшен
    - Срочный рендер и коммит с query = 'ab'
    - Фоновый рендер и коммит с deferredQuery = 'ab'

# use-hook: принято из черновика 2026-10-11
- id: use-hook-vs-other-hooks
  skill: use-hook-semantics
  question: use-hook
  difficulty: 3
  prompt: Чем хук `use` из React 19 принципиально отличается от остальных хуков?
  explanation: "`use(resource)` читает промис или контекст прямо в рендере. Пока промис не разрешён, компонент приостанавливается до ближайшего Suspense, а отклонение уходит в Error Boundary. Состояния в списке хуков у `use` нет, поэтому его можно вызывать в условиях и циклах. Промис при этом должен быть стабильным и приходить извне."
  type: quiz
  options:
    - label: Он читает промис или контекст во время рендера, приостанавливает компонент через Suspense и его можно вызывать в условиях и циклах
      why: Верно. `use` не хранит состояние в списке хуков Fiber, поэтому порядок вызова не важен. Ожидание промиса реализовано через Suspense, а ошибки уходят в Error Boundary.
    - label: "Это аналог useEffect для загрузки данных: запускает запрос после рендера и кладёт результат в состояние"
      why: Нет. `use` ничего не запускает и работает во время рендера, а не после него. Запрос должен быть создан заранее, например в Server Component или библиотеке.
    - label: Он сам кэширует промисы, поэтому в него можно передавать `fetch(url)` прямо из рендера
      why: Кэша у `use` нет. Новый промис на каждом рендере, в том числе после приостановки, даёт бесконечную загрузку и предупреждение «uncached promise».
    - label: Это обычная функция, а не хук, поэтому её можно вызывать где угодно, даже вне компонентов
      why: "`use` можно вызывать условно, но только в рендере компонента или внутри другого хука. Вне React-рендера он не работает."
  answer: 0
- id: use-hook-uncached-promise
  skill: use-hook-stable-promise
  question: use-hook
  difficulty: 2
  prompt: Клиентский компонент обёрнут в Suspense, но вечно показывает fallback. Найдите ошибку.
  explanation: "При каждом рендере вызывается новый `fetch`, и `use` получает новый промис. После приостановки React рендерит компонент заново, создаётся ещё один промис, и так по кругу. Промис должен быть стабильным: прийти из Server Component, из кэша или из библиотеки данных (TanStack Query, фреймворк)."
  type: find-bug
  language: tsx
  code: |-
    'use client';
    function UserCard({ id }: { id: string }) {
      const user = use(
        fetch(`/api/users/${id}`).then((r) => r.json())
      );
      return <p>{user.name}</p>;
    }
  bugLines:
    - 3
    - 4
  causes:
    - "Промис создаётся в рендере: после каждой приостановки появляется новый, и загрузка никогда не заканчивается"
    - Хук `use` нельзя вызывать в Client Component — только в Server Component
    - Перед `fetch` не хватает `await`, поэтому `use` получает не данные, а промис
    - Вызов `use` нужно обернуть в try/catch, иначе Suspense не сработает
