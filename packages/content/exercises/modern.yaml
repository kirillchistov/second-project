      why: Запросы пойдут параллельно, но страница будет ждать самый медленный. Подходит, если без комментариев страница бессмысленна.
    - label: useEffect + fetch в Client Component после гидрации
      why: Запрос начнётся только после загрузки JS и гидрации, это водопад. Кэш и гонки придётся писать вручную. Оправдано разве что в чистом SPA без сервера.
    - label: "`use(fetch(url))` прямо в Client Component"
      why: Каждый рендер создаёт новый промис, поэтому загрузка бесконечная. На клиенте промис должен приходить из кэша или библиотеки, например useSuspenseQuery.
  answer: 0

# use-optimistic: принято из черновика 2026-10-11
- id: use-optimistic-after-action
  skill: use-optimistic-lifecycle
  question: use-optimistic
  difficulty: 2
  prompt: Что происходит с оптимистичным значением из useOptimistic, когда Action завершился?
  explanation: useOptimistic — это временный слой поверх реального state, который живёт только пока идёт Action. После завершения слой исчезает, и UI показывает тот state, что передан в хук. Поэтому источник (props, кэш, setState) должен обновиться сам, а об ошибке нужно сообщить отдельно.
  type: quiz
  options:
    - label: "Оно отбрасывается, и UI показывает текущий state, переданный в хук: при успехе там уже свежие данные, при ошибке это и есть откат"
      why: Верно. Хук не хранит результат и ничего не фиксирует. Он показывает оптимистичное значение, пока Action в процессе, а потом снова отдаёт state.
    - label: При успешном промисе оптимистичное значение фиксируется и становится новым состоянием
      why: Хук ничего не фиксирует. Если источник state не обновился, после успеха значение «откатится» к старому. Это главный подводный камень.
    - label: При ошибке откат нужно сделать вручную, повторно вызвав addOptimistic со старым значением
      why: "Откат автоматический: при ошибке оптимистичное значение тоже отбрасывается. Вручную придётся только показать ошибку пользователю."
    - label: Оно держится до следующего рендера родителя, даже если Action уже завершился
      why: Время жизни оптимистичного значения привязано к Action или transition, а не к рендерам родителя. Как только действие завершено, значение пропадает.
  answer: 0
- id: use-optimistic-like-rollback
  skill: use-optimistic-lifecycle
  question: use-optimistic
  difficulty: 3
  prompt: Лайк засчитывается на сервере, но через мгновение счётчик на кнопке возвращается к старому числу. Где ошибка?
  explanation: "Когда Action завершается, useOptimistic отбрасывает своё значение и показывает likes, а likes так и не изменился. Реальный state нужно обновить: после await вызвать `startTransition(() => setLikes(n => n + 1))` или взять свежее значение из props или кэша."
  type: find-bug
  language: tsx
  code: |-
    const add = (n: number, d: number) => n + d;
    function Like({ initial }: { initial: number }) {
      const [likes, setLikes] = useState(initial);
      const [shown, addOptimistic] = useOptimistic(likes, add);
      async function action() {
        addOptimistic(1);
        await api.like();
      }
      return (
        <form action={action}>
          <button>♥ {shown}</button>
        </form>
      );
    }
  bugLines:
    - 7
  causes:
    - После await реальный likes не обновляется, а оптимистичное значение по завершении Action отбрасывается, поэтому счётчик откатывается
    - addOptimistic вызван вне transition, поэтому React сразу игнорирует обновление
    - Функция add должна быть объявлена внутри компонента, иначе useOptimistic её не видит
    - Action формы не может быть async-функцией, поэтому промис api.like() не дожидается
  answer: 0
- id: use-optimistic-onclick-transition
  skill: use-optimistic-transition
  question: use-optimistic
  difficulty: 2
  prompt: Кнопка «звёздочка» срабатывает в onClick, а не через form action. Допишите код, чтобы оптимистичное обновление работало без предупреждений.
  explanation: Оптимистичное обновление допустимо только внутри Action или transition. Форма с action делает это за нас, а в обычном onClick вызов нужно обернуть в startTransition. Пока async-функция выполняется, shown показывает новое значение, а затем возвращается к props starred.
  type: fill-tokens
  language: tsx
  code: |-
    function Star({ starred, save }: Props) {
      const [shown, setShown] = ___(
        starred,
        (_cur: boolean, next: boolean) => next,
      );
      const [isPending, startTransition] = ___();
      function onClick() {
        ___(async () => {
          setShown(!starred);
          await save(!starred);
        });
      }
      return <StarIcon on={shown} onClick={onClick} />;
    }
  tokens:
