- id: use-hook-stream-promise-to-client
  skill: use-hook-server-promise-streaming
  question: use-hook
  difficulty: 2
  prompt: "Допишите код: страница не ждёт комментарии, а клиентский компонент читает их, когда они придут."
  explanation: Server Component запускает запрос и передаёт промис без `await`. Промисы сериализуются при передаче в Client Component. Клиент читает промис через `use`, а пока данные не пришли, Suspense показывает `fallback`. Остальная страница стримится сразу.
  type: fill-tokens
  language: tsx
  code: |-
    // Server Component
    async function Page({ id }: { id: string }) {
      const commentsPromise = getComments(id);
      return (
        <Suspense ___={<Skeleton />}>
          <Comments commentsPromise={___} />
        </Suspense>
      );
    }
    // Client Component
    function Comments({ commentsPromise }: Props) {
      const comments = ___(commentsPromise);
      return comments.map((c) => <p key={c.id}>{c.text}</p>);
    }
  tokens:
    - fallback
    - commentsPromise
    - use
  decoys:
    - loading
    - comments
    - useEffect
    - await
