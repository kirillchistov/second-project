    - label: Типы стираются при компиляции, и `as` ничего не проверяет. Схема реально проверяет данные в рантайме и даёт тип через z.infer
      why: Верно. `as User` просто верит данным на слово. Поломка контракта всплывёт глубоко в UI, а схема упадёт у границы с путём к полю.
    - label: "`as User` проверяет форму объекта в рантайме, а Zod нужен только для красивых сообщений об ошибках"
