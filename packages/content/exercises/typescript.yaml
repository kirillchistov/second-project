# typescript-utility-types: принято из черновика 2026-10-13
- id: typescript-utility-types-main-idea
  skill: utility-types-derive
  question: typescript-utility-types
  difficulty: 2
  prompt: В чём главная польза утилитарных типов (`Partial`, `Pick`, `ComponentProps`, `ReturnType`…) в React-коде?
  explanation: "Утилитарные типы строят новый тип из существующего: модели, функции, компонента или HTML-элемента. Источник истины один, поэтому при его изменении производные типы обновятся сами. Все типы стираются при компиляции, поэтому данные из внешних источников нужно проверять в рантайме отдельно, например через zod."
  type: quiz
  options:
    - label: Тип выводится из одного источника истины, поэтому изменения модели или компонента сами доходят до производных типов
      why: Верно. Ручные копии полей расходятся с оригиналом, а `Omit<User, 'id'>` или `ComponentProps<typeof Select>` всегда соответствуют исходному типу.
    - label: Они добавляют рантайм-проверки props, поэтому можно отказаться от валидации
      why: Типы стираются при компиляции, и в рантайме от них ничего не остаётся. Проверять данные приходится отдельно.
    - label: Они гарантируют, что ответ сервера соответствует типу, например `Awaited<ReturnType<typeof fetchUser>>`
      why: "Этот тип лишь повторяет то, что объявила функция. Если сервер вернул другое, TypeScript об этом не узнает: нужна схема вроде zod."
    - label: Они нужны в основном авторам библиотек, а в приложении понятнее писать интерфейсы вручную
      why: Ручные интерфейсы дублируют поля и устаревают. Формы, DTO и обёртки над компонентами есть в любом приложении.
  answer: 0
- id: typescript-utility-types-compose
  skill: utility-types-compose
  question: typescript-utility-types
  difficulty: 2
  prompt: Заполните пропуски так, чтобы каждый тип соответствовал комментарию над ним.
  explanation: "`Omit` убирает `id`, а `Partial` делает остальные поля необязательными: так выглядит тело PATCH. `Pick<User, 'id'>` оставил бы только `id`. `Awaited` разворачивает `Promise<User>` в `User`. `Record` с ключом-объединением требует все варианты: забытая роль даст ошибку компиляции."
  type: fill-tokens
  language: ts
  code: |-
    type Role = 'admin' | 'user';
    type User = { id: string; name: string; role: Role };
    declare function fetchUser(id: string): Promise<User>;

    // PATCH: всё необязательно, id менять нельзя
    type UserPatch = Partial<___<User, 'id'>>;
    // User, а не Promise<User>
    type Fetched = ___<ReturnType<typeof fetchUser>>;
    // забыть роль — ошибка компиляции
    const labels: ___<Role, string> = {
      admin: 'Администратор',
      user: 'Пользователь',
    };
  tokens:
    - Omit
    - Awaited
    - Record
  decoys:
    - Pick
    - Required
    - Promise
    - Map
- id: typescript-utility-types-omit-union
  skill: omit-union-distributive
  question: typescript-utility-types
  difficulty: 3
  prompt: TypeScript ругается на `d.text` в строке 8, хотя `d.type` проверен. Где ошибка?
  explanation: "`Omit<A | B, K>` не распределяется по вариантам объединения. Он берёт только общие ключи (`type`, `id`), и вариант `add` теряет поле `text`. Решение — распределяющий Omit: `type DOmit<T, K extends PropertyKey> = T extends unknown ? Omit<T, K> : never`."
  type: find-bug
  language: ts
  code: |-
    type Action =
      | { type: 'add'; id: string; text: string }
      | { type: 'remove'; id: string };

    type Draft = Omit<Action, 'id'>;

    function describe(d: Draft) {
      if (d.type === 'add') return d.text;
      return 'remove';
    }
  bugLines:
    - 5
  causes:
    - "`Omit` на объединении схлопывает его до общих ключей, поэтому поле `text` и различие вариантов теряются"
    - Сужение по `d.type === 'add'` не работает без `as const` у литералов
    - "`Omit` удаляет и `type`, ведь он есть в обоих вариантах"
    - В объединении нельзя повторять одно и то же поле `id` в разных вариантах
  answer: 0
- id: typescript-utility-types-status-config
  skill: record-exhaustive-keys
  question: typescript-utility-types
  difficulty: 2
  prompt: Есть `type Status = 'draft' | 'paid' | 'shipped'`. Нужен объект с цветом и подписью бейджа для каждого статуса. Когда добавят новый статус, компилятор должен сам указать, где не хватает конфигурации. Как типизировать?
  explanation: "Правило: словарь с ключом-объединением типизируют через `Record<Union, V>`. Он требует все ключи и не пускает лишние. `Partial<Record>` и индексная сигнатура этой проверки лишены, а `Map` проверяет ключи только при вызове `set`."
  type: choose-tool
  options:
    - label: Record<Status, BadgeConfig>
      why: "Лучший вариант: TypeScript потребует ключ для каждого статуса, а новый статус сразу даст ошибку в конфиге."
    - label: Partial<Record<Status, BadgeConfig>>
      why: Подходит, когда конфиг задаётся не для всех ключей и есть значение по умолчанию. Забытый статус компилятор пропустит.
    - label: "{ [key: string]: BadgeConfig }"
      why: Нужен для словаря с заранее неизвестными ключами, например по id. Опечатки и пропущенные статусы не ловит.
    - label: new Map<Status, BadgeConfig>()
      why: Уместен при динамическом наполнении и частых добавлениях и удалениях. Полноту ключей компилятор не проверит, а `get` вернёт `undefined`.
  answer: 0
