- id: ts-unknown-type-guard-fill
  skill: ts-type-guards
  question: ts-unknown-vs-any
  difficulty: 2
  prompt: Допишите type guard так, чтобы после `if (isApiError(x))` значение `x` типа `unknown` сузилось до `ApiError`.
  explanation: "Параметр guard'а — `unknown`: функция обязана принимать что угодно, а `{}` не примет `unknown`-аргумент. Предикат `value is ApiError` сообщает компилятору о сужении. `typeof null === 'object'`, поэтому null отсекаем отдельно. Оператор `in` (TS 4.9+) открывает доступ к `value.code` для дальнейшей проверки типа поля."
  type: fill-tokens
  language: ts
  code: |-
    interface ApiError { code: string; message: string }

    function isApiError(
      value: ___,
    ): value ___ ApiError {
      return (
        typeof value === ___ &&
        value !== ___ &&
        'code' in value &&
        typeof value.code === 'string' &&
        'message' in value
      );
    }
  tokens:
