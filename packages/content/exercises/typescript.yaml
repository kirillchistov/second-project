# typescript-hooks: принято из черновика 2026-10-11
- id: typescript-hooks-union-vs-flags
  skill: discriminated-union-state
  question: typescript-hooks
  difficulty: 2
  prompt: "Почему асинхронное состояние лучше описать discriminated union по полю status, а не тремя useState: isLoading, error, data?"
  explanation: "Независимые флаги допускают 2×2×2 комбинаций, и многие из них бессмысленны. Union по status оставляет только допустимые состояния, а сужение типа даёт доступ к data или error только в нужной ветке. Правило: «невозможные состояния — непредставимые»."
  type: quiz
  options:
    - label: Невозможные комбинации (loading и error одновременно) становятся непредставимыми, а поля доступны только в своей ветке
      why: "Верно. Каждая ветка union несёт только свои поля, и после проверки status TypeScript сужает тип: state.data есть лишь при status === 'success'."
    - label: Один useState вместо трёх заметно уменьшает число ререндеров
      why: React 18+ батчит обновления в обработчиках и промисах, так что три setState обычно дают один рендер. Выигрыш union — в типобезопасности, а не в производительности.
    - label: TypeScript не умеет выводить тип для useState(null), поэтому флаги типизировать нельзя
      why: "Можно: useState<string | null>(null). Проблема флагов не в выводе типов, а в том, что тип разрешает противоречивые комбинации."
    - label: Union можно хранить только в useReducer, и это делает переходы между состояниями явными
      why: Union прекрасно хранится и в useState<State>. useReducer полезен для сложных переходов, но к сути discriminated union он не обязателен.
  answer: 0
