  prompt: Расставьте шаги постепенной миграции большого JS-проекта на TypeScript.
  explanation: "Сначала JS и TS должны уживаться вместе (`allowJs`), а счётчик долга фиксируют с первого дня. Файлы переводят снизу вверх по графу зависимостей: тогда у верхних модулей уже есть типизированные импорты. Строгие флаги по ходу включают в папках, уже переведённых на TS. `allowJs` убирают, когда .js не осталось, и только потом включают strict в корне."
