    type DeepPartial<T> =
      T extends (...args: never[]) => unknown
        ? T
        : T extends Date
          ? T
          : T extends (___ U)[]
            ? ___<U>[]
            : T extends ___
              ? { [K in keyof T]___: DeepPartial<T[K]> }
              : T;
  tokens:
