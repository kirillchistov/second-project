# satisfies-and-const: принято из черновика 2026-10-13
- id: satisfies-vs-annotation-quiz
  skill: ts-satisfies-vs-annotation
  question: satisfies-and-const
  difficulty: 2
  prompt: "Чем `const ROUTES = {...} satisfies Record<string, Route>` отличается от `const ROUTES: Record<string, Route> = {...}`?"
  explanation: "Аннотация `: T` проверяет значение и заменяет его тип на `T`, поэтому детали теряются. `satisfies T` проверяет так же строго, но оставляет точный выведенный тип. Правило: если тип нужен для проверки, а работать дальше надо с конкретными ключами, используйте `satisfies`."
  type: quiz
  options:
    - label: "satisfies проверяет форму, но оставляет выведенный тип: ключи home и profile известны, и ROUTES.profle будет ошибкой"
      why: "Верно. Аннотация расширила бы тип до Record<string, Route>: любой строковый ключ стал бы допустим, и опечатку TypeScript бы не заметил."
    - label: "На уровне типов разницы нет: satisfies — просто более короткая запись аннотации"
      why: Разница есть. С аннотацией тип переменной равен T, а с satisfies переменная сохраняет свой точный тип, и от этого зависят автодополнение и поиск опечаток.
    - label: satisfies, как и `as`, отключает проверку, поэтому лишние или неверные поля в значении пропустит
      why: "Наоборот: `as` — утверждение, и оно ослабляет проверку. satisfies проверяет совместимость, так что `{} satisfies User` не скомпилируется."
    - label: satisfies делает объект readonly и сужает строки до литералов, как as const
      why: "Этим занимается as const. satisfies ничего не делает readonly, он только проверяет тип. Если нужны оба эффекта, их комбинируют: `as const satisfies T`."
  answer: 0
- id: satisfies-hook-tuple-as-const
  skill: ts-as-const-tuples
  question: satisfies-and-const
  difficulty: 2
  prompt: TypeScript подчёркивает `onClick={toggle}`. В какой строке настоящая причина ошибки?
  explanation: Литерал массива `[on, toggle]` выводится как `(boolean | (() => void))[]`. После деструктуризации у toggle тип объединения, и в onClick его передать нельзя. `return [on, toggle] as const` даёт readonly-кортеж `[boolean, () => void]`, как у useState.
  type: find-bug
  language: tsx
  code: |-
    function useToggle(initial = false) {
      const [on, setOn] = useState(initial);
      const toggle = () => setOn((v) => !v);
      return [on, toggle];
    }

    function Panel() {
      const [open, toggle] = useToggle();
      return (
        <button onClick={toggle}>{open ? '-' : '+'}</button>
      );
    }
  bugLines:
    - 4
  causes:
    - Без as const хук возвращает массив `(boolean | (() => void))[]`, и у toggle тип объединения, который не подходит для onClick
    - Параметр по умолчанию в хуке ломает вывод типа useState, поэтому on и toggle получают тип any
    - Кастомный хук обязан возвращать объект, а не массив, иначе деструктуризация не типизируется
    - toggle не обёрнут в useCallback, и TypeScript не может вывести стабильный тип функции
  answer: 0
- id: satisfies-variant-component-map
  skill: ts-union-from-const-array
  question: satisfies-and-const
  difficulty: 2
  prompt: "Допишите код: тип Variant должен выводиться из массива, а карта иконок — давать ошибку, если какой-то вариант забыт, и при этом сохранять свой точный тип."
