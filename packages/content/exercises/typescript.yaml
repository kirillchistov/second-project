# ts-unknown-vs-any: принято из черновика 2026-11-07
- id: ts-unknown-vs-any-quiz
  skill: ts-unknown-narrowing
  question: ts-unknown-vs-any
  difficulty: 1
  prompt: Почему для результата `JSON.parse` или пойманной ошибки `unknown` безопаснее, чем `any`?
  explanation: "`any` выключает проверку типов и «заражает» всё, к чему прикасается. `unknown` честно говорит: «форма неизвестна». Компилятор не даст читать свойства, пока вы не докажете тип через typeof, instanceof, in, type guard или схему валидации. Сами типы в рантайме не существуют — проверку всегда пишете вы."
  type: quiz
  options:
    - label: "`unknown` принимает любое значение, но не даёт им пользоваться без сужения типа; `any` разрешает всё и молча отключает проверки"
      why: Верно. Ошибка «нельзя читать свойство unknown» ловит на этапе компиляции то, что с `any` упало бы в рантайме.
    - label: "`unknown` при присваивании автоматически проверяет данные в рантайме, а `any` — нет"
      why: "Типы стираются при компиляции, и никаких рантайм-проверок `unknown` не добавляет. Проверку должны написать вы: guard, instanceof или Zod."
    - label: "`any` нельзя присвоить переменной конкретного типа, а `unknown` можно — поэтому он гибче"
      why: "Наоборот: `any` присваивается чему угодно, поэтому и опасен. `unknown` присваивается только `unknown` и `any`, пока тип не сужен."
    - label: После `value as ApiError` компилятор проверит, что у `unknown` действительно есть поля `code` и `message`
      why: "`as` ничего не проверяет: это обещание компилятору, а не доказательство. Если данные другой формы, код упадёт в рантайме."
  answer: 0
