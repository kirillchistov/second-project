      why: Неверно. strict влияет только на проверки при компиляции. Что пришло по сети, он не знает и знать не может.
    - label: Схема нужна, только если бэкенд написан не на TypeScript; при общих типах в монорепо проверка не нужна
      why: "Общие типы не гарантируют, что развёрнутая версия API им соответствует: старый деплой, прокси или баг сервера. Проверка на границе всё равно полезна."
