  explanation: "Строгость вводят постепенно: по папкам или пакетам, с метрикой долга в CI. Метрика — счётчик `any` и `@ts-expect-error`, который не должен расти. Массовая «починка» через `as any` или `@ts-ignore` прячет ошибки и делает типы ложными. Смысл в том, чтобы каждый включённый флаг реально защищал код, а не только давал зелёный CI."
  type: quiz
  options:
    - label: Включать strict-флаги по папкам или пакетам, а счётчик any и @ts-expect-error в CI не должен расти
      why: Верно. Ошибки чинят порциями, новый код сразу пишут строго, а метрика не даёт долгу расти незаметно.
    - label: Включить strict одним коммитом и быстро закрыть ошибки через as any
      why: Тысячи `as any` отключают проверку там, где она нужнее всего. Типы начинают врать, и это хуже исходного состояния.
    - label: Включить strict и поставить @ts-ignore над каждой ошибкой, потом разобрать
      why: "`@ts-ignore` молчит и после исправления ошибки, поэтому «потом» не наступит. Если подавлять, то через `@ts-expect-error` и со счётчиком."
    - label: "Не включать strict: в большом проекте выгода не окупает затрат"
      why: Без strict nullable-ошибки и неявные any доходят до продакшена. Постепенное включение делает затраты управляемыми.
  answer: 0
- id: typescript-at-scale-js-migration-recipe
  skill: ts-strictness-migration
  question: typescript-at-scale
