- id: satisfies-theme-tokens-choice
  skill: ts-as-const-satisfies
  question: satisfies-and-const
  difficulty: 3
  prompt: "Объект токенов темы `{ primary: '#0a7', radius: 8 }`. Нужно, чтобы `theme.primary` имел тип `'#0a7'`, поля были readonly, `theme.primry` давал ошибку, а значение не того типа (например, null) ловилось сразу. Как объявить?"
  explanation: "`as const` отвечает за точность: литералы и readonly. `satisfies` проверяет форму и не расширяет тип. Порядок фиксирован: `as const` ставится к самому литералу, а `satisfies T` — после него. Запись `satisfies T as const` не скомпилируется, потому что const-утверждение применимо только к литералам. Аннотацию берите, когда ключи динамические и точный тип не нужен."
  type: choose-tool
  options:
    - label: as const satisfies Record<string, string | number>
      why: Даёт литералы и readonly, сохраняет известные ключи и проверяет, что каждое значение — string или number. Выполнены все четыре требования.
    - label: "Аннотация `: Record<string, string | number>`"
      why: "Форму проверит, но тип станет просто Record: primary — string | number, любой ключ допустим, опечатка не ловится. Подходит для словарей с динамическими ключами."
    - label: Только satisfies Record<string, string | number>
      why: Ключи сохранятся, и форма будет проверена, но поля не станут readonly, а литералы расширятся до string. Достаточно, когда точные значения не нужны.
    - label: Только as const
      why: "Даёт литералы и readonly, но не проверяет форму: null или объект в значении пройдут молча. Хватает для списков вариантов, где проверять нечего."
  answer: 0

# typescript-at-scale: принято из черновика 2026-10-13
- id: typescript-at-scale-strict-rollout
