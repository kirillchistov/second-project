    - Аннотация `unknown` запрещает приведение через `as`, поэтому строка 6 на самом деле не компилируется
    - "`res.json()` возвращает строку, и её сначала нужно передать в `JSON.parse`"
    - "`toUpperCase` нельзя вызывать у свойства объекта, полученного через `fetch`"
