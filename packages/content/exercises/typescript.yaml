- id: ts-deep-readonly-build
  skill: ts-recursive-conditional-types
  question: ts-deep-utility-types
  difficulty: 2
  prompt: Соберите `DeepReadonly<T>`, который не ломает функции и `Date`, а массивы делает readonly с рекурсией на элементы.
  explanation: "Порядок веток: функции → `Date` → массив → объект → примитив. `readonly (infer U)[]` ловит и обычные, и readonly-массивы. Рекурсия на `U` делает readonly и вложенные объекты в элементах. Если вернуть `readonly U[]`, сам массив станет неизменяемым, а элементы останутся мутабельными."
  type: parsons
  language: ts
  lines:
    - type DeepReadonly<T> =
    - "  T extends (...args: never[]) => unknown"
    - "    ? T"
    - "    : T extends Date"
    - "      ? T"
    - "      : T extends readonly (infer U)[]"
    - "        ? readonly DeepReadonly<U>[]"
    - "        : T extends object"
    - "          ? { readonly [K in keyof T]: DeepReadonly<T[K]> }"
    - "          : T;"
  distractors:
    - "        ? readonly U[]"
    - type DeepReadonly<T> = T extends object

# ts-discriminated-loading-state: принято из черновика 2026-11-07
