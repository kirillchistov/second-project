  explanation: "`infer U` достаёт тип элемента массива, и рекурсия идёт по `U`, поэтому `Item[]` становится `DeepPartial<Item>[]`, а не объектом с `length`. Встроенный `Partial` работает только на один уровень. Модификатор `?` в mapped type делает ключи необязательными, а `-?`, наоборот, снимает необязательность."
