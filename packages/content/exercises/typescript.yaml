# ts-route-params-type: принято из черновика 2026-11-07
- id: ts-route-params-types-vs-runtime
  skill: ts-types-vs-runtime-drift
  question: ts-route-params-type
  difficulty: 3
  prompt: "`useParams(path)` возвращает `ExtractParams<Path>`, а внутри парсит путь регуляркой. Почему тип может «врать», хотя всё компилируется?"
  explanation: "Тип и рантайм — две независимые реализации одной идеи. TS разбирает литерал сопоставлением с шаблоном и ничего не знает о регулярке. Компилятор проверяет только самосогласованность типов. Правило: держите обе реализации рядом и покрывайте рантайм-парсер тестами на тех же путях."
  type: quiz
  options:
    - label: TS сопоставляет литерал с шаблоном только в системе типов и не видит рантайм-парсер — если они разойдутся, компилятор этого не заметит
      why: Верно. Регулярку никто не сверяет с типом. Каст `as ExtractParams<Path>` заставляет компилятор поверить на слово.
    - label: TS при компиляции выполняет регулярку из реализации и выводит тип из её групп, поэтому тип может врать только при ошибке в регулярке
      why: TS не запускает код и не читает регулярки. Template literal types — это чистое сопоставление с шаблоном на уровне типов.
    - label: Без `as const` литерал расширится до `string`, и тип параметров станет пустым объектом
      why: В generic с ограничением `Path extends string` аргумент-литерал выводится как литеральный тип, `as const` для этого не нужен.
    - label: Template literal types проверяют строку в рантайме, но только в dev-сборке, поэтому в продакшене тип может не совпасть
      why: Типы полностью стираются при компиляции и в рантайме не существуют ни в dev, ни в prod.
  answer: 0
- id: ts-route-params-fill-recursive
  skill: ts-recursive-conditional-types
  question: ts-route-params-type
  difficulty: 3
  prompt: "Допишите тип: для `'/users/:userId/posts/:postId'` должно получиться `{ userId: string; postId: string }`, для `'/about'` — `{}`."
  explanation: "`infer Name` захватывает сегмент до ближайшего `/`, а остаток пути разбирается рекурсивно. `keyof` достаёт имена ключей из результата рекурсии. Базовый случай `{}` обязателен. С `never` выйдет ошибка: `keyof never` — это `string | number | symbol`, и тип расползётся до индексной сигнатуры."
  type: fill-tokens
  language: ts
  code: |-
    type Params<P extends string> =
      P extends `${string}:${___ Name}/${infer Rest}`
        ? { [K in Name | ___ Params<`/${___}`>]: string }
        : P extends `${string}:${infer Name}`
          ? { [K in Name]: string }
          : ___;
  tokens:
    - infer
    - keyof
    - Rest
    - "{}"
  decoys:
    - typeof
    - never
    - Name
    - extends
- id: ts-route-params-branch-order-bug
  skill: ts-template-literal-matching
  question: ts-route-params-type
  difficulty: 3
  prompt: Для `'/users/:id/posts/:postId'` тип даёт ключ `'id/posts/:postId'` вместо `id` и `postId`. Где ошибка?
  explanation: "Каждый плейсхолдер захватывает текст до первого вхождения следующего литерала. Если за `${infer Param}` нет литерала, он забирает весь остаток строки. Поэтому первая ветка ловит любой путь с `:` целиком, а ветка с рекурсией недостижима. Правило: сначала проверяйте более специфичный шаблон (с `/` после параметра), потом — последний параметр."
  type: find-bug
  language: ts
  code: |-
    type ExtractParams<P extends string> =
      P extends `${string}:${infer Param}`
        ? { [K in Param]: string }
        : P extends `${string}:${infer Param}/${infer Rest}`
          ? { [K in Param | keyof ExtractParams<Rest>]: string }
          : {};

    type Params = ExtractParams<'/users/:id/posts/:postId'>;
  bugLines:
    - 2
    - 3
  causes:
    - "Общий шаблон стоит первым: `infer Param` в конце забирает весь остаток после первого `:`, и ветка с рекурсией никогда не срабатывает"
    - "`${string}` жадный и захватывает всё до последнего `:`, поэтому Param получает только `postId`"
    - Нет базового случая, и рекурсия по Rest зацикливается
    - Переменную из `infer` нельзя использовать в mapped type, поэтому ключ берётся как строка целиком
  answer: 0
- id: ts-route-params-build-path-choice
  skill: ts-typed-routes-choice
  question: ts-route-params-type
  difficulty: 2
  prompt: В приложении десятки маршрутов вида `'/orders/:orderId/items/:itemId'`. Хелпер `buildPath(path, params)` должен ловить пропущенный параметр или опечатку в его имени при компиляции и не требовать ручного дублирования. Что выбрать?
  explanation: Когда структура данных закодирована в строковом литерале, template literal types + `infer` выводят тип прямо из него — единый источник правды без дублирования. Рантайм-валидация нужна для внешнего ввода, а ручные типы — когда параметрам нужны отличные от string типы или маршрутов мало.
  type: choose-tool
  options:
    - label: Выводить тип params из литерала пути через template literal types и `infer`
      why: "Лучший вариант: имена параметров берутся из самой строки. Опечатка или пропуск — ошибка компиляции, новый маршрут типизируется автоматически."
    - label: Типизировать params как `Record<string, string>`
      why: Подходит, только если пути динамические и неизвестны на этапе компиляции. Здесь любой ключ пройдёт, опечатку никто не поймает.
    - label: Вручную описать interface параметров для каждого маршрута
      why: Уместно при паре маршрутов или если параметрам нужны числа и union-типы. На десятках маршрутов интерфейсы разойдутся со строками путей.
    - label: Zod-схема для params и проверка при вызове
      why: Нужна для внешних данных (URL из адресной строки), но ловит ошибку только в рантайме, а не при компиляции.
  answer: 0
