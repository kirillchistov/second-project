  prompt: "Иногда сервер отвечает `{ error: 'not found' }`. Код компилируется без ошибок, но падает в рантайме. Какая строка виновата?"
  explanation: "`as User` снимает с `unknown` всю защиту и при этом ничего не проверяет. Когда приходит `{ error }`, `user.name` равен undefined, и `toUpperCase` падает. Нужен type guard (`isUser(data)`) или схема Zod, а для неподходящей формы — явная ошибка. Правило: `as` уместен только там, где вы уже знаете тип точнее компилятора."
  type: find-bug
