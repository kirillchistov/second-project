- id: ts-unknown-runtime-validation-choice
  skill: runtime-validation-choice
  question: ts-unknown-vs-any
  difficulty: 2
  prompt: Внешний API партнёра возвращает заказ с вложенным массивом позиций и датами-строками. Формат иногда меняется без предупреждения. Нужно проверить ответ и получить точный тип. Что выбрать?
  explanation: "Данные извне — это `unknown`, пока не доказано обратное. Для сложных и нестабильных форм выбирайте схему (Zod, Valibot): она одновременно валидирует данные в рантайме и выводит тип через `z.infer`, поэтому тип и проверка не разъедутся. Ручной guard подходит для 2–3 полей, а `as` и `any` ничего не проверяют."
  type: choose-tool
  options:
    - label: Схема Zod + `safeParse` над `unknown`-ответом, тип через `z.infer`
      why: "Лучший вариант: вложенные структуры и преобразование дат описываются декларативно, ошибки содержат путь к полю, а тип выводится из той же схемы."
    - label: "Ручной type guard `isOrder(value: unknown): value is Order`"
      why: Хорош для маленьких и стабильных форм, например `ApiError`. Для вложенных массивов получится громоздко, и guard легко разойдётся с интерфейсом.
    - label: "`const order = (await res.json()) as Order`"
      why: Годится, только если вы контролируете бэкенд и уже доверяете контракту, например при генерации типов из OpenAPI. Изменение формата не поймает.
    - label: Оставить ответ `any` и проверять поля по месту использования
      why: Проверки рассыплются по коду и будут забыты, а `any` отключит типизацию у всего, что получит эти данные. Допустимо разве что в одноразовом прототипе.
  answer: 0

