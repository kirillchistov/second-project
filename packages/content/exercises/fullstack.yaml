  explanation: "`fetch` реджектит промис только при сетевой ошибке. На 4xx/5xx он успешно резолвится с `res.ok === false`. Перед парсингом нужна проверка `if (!res.ok) throw ...`. Не переносите на `fetch` привычку axios, который реджектит на ошибочный статус сам."
