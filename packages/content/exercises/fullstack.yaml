- id: websocket-resume-protocol-recipe
  skill: websocket-resume-protocol
  question: websocket-backpressure
  difficulty: 3
  prompt: Расставьте шаги протокола, который не теряет сообщения при переподключении WebSocket.
  explanation: Устойчивость к разрывам строится на уровне приложения. Сообщения нумеруются, клиент помнит позицию и сообщает её при реконнекте. Сервер досылает хвост или, если буфер его уже не хранит, отдаёт снапшот. Дедупликация по seq делает повторную доставку безопасной.
  type: order
  kind: recipe
  steps:
    - Сервер присваивает каждому сообщению возрастающий seq и хранит последние N в буфере
    - Клиент после применения сообщения запоминает его seq как lastSeq
    - При реконнекте клиент передаёт lastSeq в запросе подписки
    - Сервер досылает сообщения с seq > lastSeq, а если их уже нет в буфере — отправляет полный снапшот
    - Клиент игнорирует сообщения с seq ≤ lastSeq как дубликаты
