  explanation: "AbortSignal.timeout(ms) начинает отсчёт в момент создания. Сигнал создан один раз при импорте модуля: через 5 с он отменён навсегда, и fetch с уже отменённым сигналом сразу отклоняется. Сигнал таймаута создают на каждый запрос."
  type: find-bug
