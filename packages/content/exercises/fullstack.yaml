# api-styles: принято из черновика 2026-10-13
- id: api-styles-main-criterion
  skill: api-style-choice
  question: api-styles
  difficulty: 2
  prompt: Что в первую очередь должно определять выбор между REST, GraphQL и tRPC?
  explanation: Стиль API выбирают по клиентам и контракту, а не по моде. Публичный контракт и HTTP-кэш — REST с OpenAPI. Много разнородных клиентов с разными потребностями в данных — GraphQL. Один TS-фронтенд и бэкенд в монорепо — tRPC. Типы есть везде, различается способ их получить.
  type: quiz
  options:
    - label: "Кто клиенты и какой контракт им нужен: публичный и кэшируемый, гибкий для многих клиентов или внутренний TS"
      why: Верно. От клиентов зависят кэширование, типизация, стабильность контракта и стоимость поддержки.
    - label: "Производительность: GraphQL всегда быстрее, потому что всё приходит одним запросом"
      why: "Один запрос не гарантирует скорости: резолверы легко порождают N+1, а POST-запросы не попадают в HTTP-кэш и CDN."
    - label: "Типобезопасность: только tRPC даёт клиенту типы, поэтому для TS-проекта он всегда лучше"
      why: У REST типы дают OpenAPI и генерация клиента, у GraphQL — схема и codegen. tRPC удобен, но это внутренний API, а не публичный контракт.
    - label: "Актуальность: REST устарел, новые проекты стоит сразу делать на GraphQL"
      why: REST не устарел. Он проще, понятен любым клиентам и бесплатно кэшируется. GraphQL требует отдельной экспертизы и защиты от тяжёлых запросов.
  answer: 0
- id: api-styles-many-clients
  skill: api-style-choice
  question: api-styles
  difficulty: 2
  prompt: Данные заказов нужны вебу, нативным iOS и Android и встраиваемому виджету. Каждому экрану нужен свой набор полей заказа, позиций и клиента. Мобильные клиенты жалуются на десятки запросов и лишние данные. Что выбрать?
  explanation: "Разнородные клиенты с разными потребностями в данных — классический случай GraphQL. Схема даёт контракт и codegen для любого языка, клиент выбирает поля. Цена этого: DataLoader против N+1, лимиты глубины и сложности запросов, клиентский кэш или persisted queries."
  type: choose-tool
  options:
    - label: GraphQL со схемой и codegen для каждого клиента
      why: Каждый экран одним запросом получает ровно нужные поля. Over- и under-fetching уходят, схема типизирует и Swift, и Kotlin, и TS.
    - label: REST + OpenAPI
      why: Лучший выбор для публичного API партнёров и HTTP-кэша. Здесь пришлось бы плодить эндпоинты под экраны или мириться с лишними данными.
    - label: tRPC
      why: Подходит, когда TS-фронтенд и бэкенд живут в одном монорепо. Нативные iOS и Android не получат выведенных типов, а контракт останется внутренним.
    - label: Отдельный BFF под каждый клиент
      why: Хорош, когда клиентов мало и под каждый есть команда. При четырёх клиентах придётся дублировать агрегацию и поддерживать четыре сервиса.
  answer: 0
- id: api-styles-trpc-public-mutation
  skill: trpc-endpoint-security
  question: api-styles
  difficulty: 2
  prompt: «Эту процедуру вызывает только наш фронтенд после логина», — говорит автор. Найдите строку с уязвимостью.
  explanation: "Процедура tRPC — обычный HTTP-эндпоинт: её можно вызвать curl-ом в обход UI. Нужна процедура с middleware, которое проверяет ctx.session (обычно её называют protectedProcedure), и проверка, что заказ принадлежит пользователю. Валидация через zod тоже обязательна — здесь она уже есть."
  type: find-bug
  language: ts
  code: |-
    export const appRouter = router({
      deleteOrder: publicProcedure
        .input(z.object({ id: z.string() }))
        .mutation(({ input }) =>
          db.order.delete(input.id)),
    });
  bugLines:
    - 2
  causes:
    - "publicProcedure не проверяет сессию: любой может вызвать HTTP-эндпоинт и удалить чужой заказ"
    - z.string() не валидирует id — нужна ручная проверка типа
    - Удаление нужно оформить как query, а не mutation
    - tRPC требует описать схему и запустить кодогенерацию, иначе вход не проверяется
  answer: 0
- id: api-styles-trpc-type-inference
  skill: trpc-type-inference
  question: api-styles
  difficulty: 2
  prompt: Допишите tRPC-роутер так, чтобы клиент мог вызвать процедуру через useQuery и получить типы без кодогенерации.
  explanation: "`.input()` задаёт zod-схему: она и валидирует вход на рантайме, и типизирует input. `.query()` нужен для чтения — useQuery работает только с query-процедурами. Клиент импортирует лишь тип `typeof appRouter`: серверный код в бандл не попадает, а типы выводятся напрямую из кода."
  type: fill-tokens
  language: ts
  code: |-
    export const appRouter = router({
      orderById: publicProcedure
        .___(z.object({ id: z.string() }))
        .___(({ input }) =>
          db.order.find(input.id)),
    });
    export type AppRouter = ___ appRouter;

    // client
    const order = trpc.orderById.useQuery({
      id: '42',
    });
  tokens:
    - input
    - query
    - typeof
  decoys:
    - mutation
    - keyof
    - schema

# bff-pattern: принято из черновика 2026-10-13
- id: bff-pattern-quiz
  skill: bff-responsibility
  question: bff-pattern
  difficulty: 2
  prompt: Что точнее всего описывает Backend for Frontend (BFF)?
  explanation: "BFF — серверный слой одного фронтенда. Он собирает данные из сервисов в форму под экран, держит токены вне браузера и даёт клиенту простой API. Граница: в BFF только композиция и адаптация, без бизнес-правил. Сквозные задачи для всех клиентов (маршрутизация, rate limiting) решает API Gateway."
  type: quiz
  options:
    - label: "Серверный слой конкретного фронтенда, которым владеет его команда: агрегирует и адаптирует данные под экраны, хранит токены"
      why: Верно. BFF меняется вместе с UI, сокращает число запросов с клиента и не выпускает секреты в браузер.
    - label: "Единый шлюз для всех клиентов: маршрутизация, rate limiting и проверка аутентификации на входе в систему"
      why: "Это API Gateway: он общий и сквозной, а не заточен под экраны конкретного клиента. BFF может стоять за гейтвеем."
    - label: Слой, куда переносят расчёт цен и проверку прав, чтобы фронтенд не зависел от правил сервисов
      why: Это главный подводный камень. Бизнес-правила в BFF начинают расходиться с сервисами, и BFF превращается во «второй бэкенд».
    - label: Кэширующий прокси перед сервисами, который ускоряет ответы, не меняя их формы
      why: Кэш может быть частью BFF, но суть паттерна в композиции и адаптации данных под экран. Прозрачный прокси форму ответа не меняет.
  answer: 0
- id: bff-pattern-sequential-calls
  skill: bff-parallel-aggregation
  question: bff-pattern
  difficulty: 2
  prompt: После перехода на BFF экран товара грузится дольше, чем раньше, когда браузер ходил в сервисы напрямую. Найдите причину.
  explanation: product, reviews и stock зависят только от id, но не друг от друга. Последовательные await складывают задержки всех трёх вызовов, а браузер раньше делал те же запросы параллельно. Независимые вызовы объединяйте через Promise.all. Последовательно вызывайте только зависимые, например когда нужен id из первого ответа.
  type: find-bug
  language: ts
  code: |-
    app.get('/bff/product/:id', async (c) => {
      const token = await getServiceToken(c);
      const id = c.req.param('id');
      const product = await catalogApi.get(id, token);
      const reviews = await reviewsApi.list(id, token);
      const stock = await stockApi.get(id, token);
      return c.json({
        title: product.title,
        price: product.price,
        rating: reviews.average,
        stock: stock.count,
      });
    });
  bugLines:
    - 4
    - 5
    - 6
  causes:
    - "Независимые вызовы сервисов идут последовательно: задержки складываются, хотя их можно запустить параллельно через Promise.all"
    - await внутри обработчика блокирует event loop, и BFF не обслуживает другие запросы, пока ждёт сервисы
    - "BFF должен отдавать ответы сервисов целиком: обрезка полей в c.json замедляет сериализацию"
    - Токен надо получать в браузере и передавать в заголовке, иначе BFF тратит время на сессию при каждом запросе
  answer: 0
- id: bff-pattern-next-server-components
  skill: bff-vs-server-components
  question: bff-pattern
  difficulty: 3
  prompt: Веб-приложение на Next.js App Router, других клиентов нет. Экрану заказа нужны данные из трёх внутренних сервисов, токены сервисов не должны попасть в браузер. Как это организовать?
  explanation: В фреймворках с серверным рендерингом роль BFF часто берут на себя Server Components и Server Functions. Они выполняются на сервере, видят секреты, собирают данные и отдают клиенту готовый результат. Отдельный BFF-сервис оправдан, когда клиентов несколько или слой нужно масштабировать отдельно.
  type: choose-tool
  options:
    - label: Server Components и Server Functions в Next.js
      why: Лучший вариант здесь. Агрегация и токены остаются на сервере, нет лишнего сервиса для деплоя, а код меняется вместе с UI.
    - label: Отдельный BFF-сервис на Hono или Express
      why: Подходит, если есть мобильные клиенты, фронтенд не на Next.js или слою нужно своё масштабирование. Здесь это лишний сервис без выгоды.
    - label: API Gateway перед сервисами
      why: Решает маршрутизацию, rate limiting и аутентификацию для всех клиентов, но не собирает данные в форму конкретного экрана.
    - label: TanStack Query из браузера напрямую в сервисы
      why: Хорош для кэша на клиенте, но токены окажутся в браузере, а экран будет делать несколько запросов. Уместен поверх BFF, а не вместо него.
  answer: 0
- id: bff-pattern-token-handler-flow
  skill: bff-token-handler
  question: bff-pattern
  difficulty: 3
  prompt: "Расставьте по порядку шаги паттерна token handler: вход пользователя и запрос данных через BFF."
  explanation: OAuth-токены получает и хранит BFF, браузер видит только HttpOnly cookie сессии. XSS не может украсть access-токен, а client secret никогда не уходит на клиент. На каждый запрос BFF сам подставляет токен из сессии при вызове сервисов.
  type: order
  kind: timeline
  steps:
    - Браузер открывает /bff/login, BFF перенаправляет на OAuth-провайдера
    - После входа провайдер возвращает authorization code на callback BFF
    - BFF обменивает code на access- и refresh-токены, используя client secret
    - BFF сохраняет токены в серверной сессии и ставит HttpOnly cookie
    - Браузер делает запрос к BFF, отправляя только cookie сессии
    - BFF берёт access-токен из сессии и вызывает сервисы

# cors: принято из черновика 2026-10-13
- id: cors-browser-not-server
  skill: cors-same-origin-policy
  question: cors
  difficulty: 1
  prompt: Фронтенд на `app.example.com` делает fetch на `api.example.com` и получает в консоли ошибку CORS. Тот же URL через curl отвечает нормально. Почему?
  explanation: "CORS — правило браузера, защищающее пользователя: скрипт с чужого origin не прочитает ответ без разрешения сервера. Сам запрос при этом может уйти и выполниться. curl и бэкенд CORS не проверяют, поэтому CORS не защищает API и не заменяет авторизацию."
  type: quiz
  options:
    - label: "Браузер применяет same-origin policy: ответ не отдаётся скрипту без `Access-Control-Allow-Origin`, а curl эту политику не применяет"
      why: Верно. Блокирует браузер, а не сервер. Origin — схема, домен и порт, поэтому поддомен api уже считается другим origin.
    - label: Сервер видит по User-Agent, что запрос из браузера, и отклоняет кросс-доменные обращения
      why: "Сервер ничего не блокирует: он отвечает как обычно, просто без нужного заголовка. Решение о блокировке принимает браузер."
    - label: Браузер вообще не отправляет запрос на другой origin, пока сервер не разрешит
      why: Простые запросы (GET, form-POST) уходят сразу и выполняются на сервере. Браузер не отдаёт скрипту только ответ. Preflight нужен лишь для «сложных» запросов.
    - label: CORS защищает API от чужих клиентов, а curl обходит защиту, подделывая заголовок Origin
      why: "CORS не защищает сервер: любой небраузерный клиент шлёт что угодно. Для защиты API нужны авторизация и CSRF-токены, а не CORS."
  answer: 0
- id: cors-credentials-wildcard
  skill: cors-credentials
  question: cors
  difficulty: 2
  prompt: Клиент шлёт запрос с cookies, сервер выставляет оба CORS-заголовка, но браузер всё равно блокирует ответ. Найдите ошибку.
  explanation: "С `credentials: 'include'` браузер требует, чтобы `Access-Control-Allow-Origin` содержал конкретный origin, а не `*`. Правильно сверить `req.headers.origin` со списком разрешённых, вернуть его и добавить `Vary: Origin`. Отражать любой Origin без проверки опасно."
  type: find-bug
  language: ts
  code: |-
    app.use((req, res, next) => {
      res.setHeader(
        'Access-Control-Allow-Origin', '*'
      );
      res.setHeader(
        'Access-Control-Allow-Credentials', 'true'
      );
      next();
    });

    // client: https://app.example.com
    fetch('https://api.example.com/me', {
      credentials: 'include',
    });
  bugLines:
    - 3
  causes:
    - С credentials нельзя отвечать `*` в Allow-Origin — нужен конкретный разрешённый origin
    - "На клиенте не хватает `mode: 'no-cors'`, без него cookies не уходят на другой домен"
    - Allow-Credentials должен быть булевым true, а строка 'true' браузером игнорируется
    - Cookies не отправляются с GET-запросом через origin — нужен POST
  answer: 0
- id: cors-local-dev-proxy
  skill: cors-fix-strategy
  question: cors
  difficulty: 2
  prompt: Локально фронтенд на Vite (`localhost:5173`), API другой команды на `localhost:8080`, и их CORS-конфиг быстро не поменять. В продакшене оба будут за одним доменом через `/api`. Как разрабатывать без ошибок CORS?
  explanation: "Самый надёжный способ избавиться от CORS — сделать origin одинаковым: в dev это прокси dev-сервера, в проде reverse proxy или BFF. Настраивать CORS на сервере нужно, только когда кросс-доменные запросы действительно нужны, и то со списком origin."
  type: choose-tool
  options:
    - label: "`server.proxy` в Vite: `/api` → `localhost:8080`"
      why: Браузер видит один origin, и CORS не нужен. Схема совпадает с продовой, где `/api` тоже на том же домене.
    - label: "Добавить в fetch `mode: 'no-cors'`"
      why: "Ответ станет непрозрачным (opaque): скрипт не прочитает ни тело, ни статус. «Отключить» CORS с клиента нельзя."
    - label: Расширение браузера, отключающее CORS
      why: Работает только у вас и скрывает реальные проблемы. Годится для разовой отладки, но не как способ разработки для команды.
    - label: Попросить бэкенд отражать любой Origin с Allow-Credentials
      why: "Это дыра в безопасности: любой сайт сможет читать ответы с cookies пользователя. Разрешённые origin задают списком."
  answer: 0
- id: cors-preflight-timeline
  skill: cors-preflight
  question: cors
  difficulty: 2
  prompt: Скрипт с `app.example.com` делает PUT на `api.example.com` с JSON-телом и заголовком Authorization. Расставьте события по порядку.
  explanation: Из-за PUT, JSON и своего заголовка запрос «сложный», поэтому браузер сначала спрашивает разрешение через OPTIONS. Если preflight не прошёл, PUT вообще не отправится. `Access-Control-Max-Age` кэширует разрешение. Allow-Origin проверяется и в ответе на сам запрос.
  type: order
  kind: timeline
  steps:
    - Скрипт вызывает fetch с методом PUT и заголовком Authorization
    - Браузер отправляет OPTIONS с Origin, Access-Control-Request-Method и -Headers
    - Сервер отвечает 204 с Allow-Origin, Allow-Methods, Allow-Headers и Max-Age
    - Браузер сверяет разрешения и кэширует их на Access-Control-Max-Age
    - Браузер отправляет сам PUT-запрос с телом
    - Браузер проверяет Allow-Origin в ответе и отдаёт его скрипту

# database-for-frontend: принято из черновика 2026-10-13
- id: database-for-frontend-atomic-stock
  skill: db-transactions-atomicity
  question: database-for-frontend
  difficulty: 3
  prompt: "Внутри `db.$transaction` сначала вызывается `product.update` с `where: { id, stock: { gte: qty } }` и `decrement: qty`, затем `order.create`. Что именно гарантирует этот код?"
  explanation: "Транзакция даёт атомарность: изменения применяются все или ни одного. От гонки защищает условие в самом UPDATE: база проверяет остаток и списывает его одной операцией над заблокированной строкой. Правило: не делайте «прочитать → проверить в коде → записать». Перенесите проверку в WHERE или берите блокировку (`SELECT … FOR UPDATE`)."
  type: quiz
  options:
    - label: Списание и заказ применятся вместе или не применятся вовсе, а остаток проверяется базой атомарно, поэтому последний товар не продадут дважды
      why: Верно. Если строка не подошла под условие, update бросит ошибку, транзакция откатится и заказ не создастся. Второй параллельный UPDATE дождётся блокировки строки и уже не пройдёт по условию.
    - label: Транзакция блокирует всю таблицу products, поэтому параллельные заказы просто выполняются по очереди
      why: Неверно. Postgres блокирует изменяемые строки, а не таблицу. Уровень изоляции по умолчанию (Read Committed) не сериализует транзакции целиком.
    - label: Защиту даёт сама транзакция, условие `stock gte qty` можно убрать и проверять остаток в коде после чтения
      why: Неверно. При Read Committed две транзакции одновременно прочитают stock = 1, обе пройдут проверку в коде и обе спишут товар. Это классическая гонка read-check-write.
    - label: Если остатка не хватит, update вернёт null, и заказ создастся без списания — нужен ручной откат
      why: Неверно. Если запись не найдена, Prisma `update` бросает ошибку, а не возвращает null. Исключение внутри `$transaction` само откатывает все изменения.
  answer: 0
- id: database-for-frontend-n-plus-one
  skill: orm-n-plus-one
  question: database-for-frontend
  difficulty: 2
  prompt: Эндпоинт ленты возвращает правильные данные, но медленно отвечает под нагрузкой. Найдите строку-причину.
