      why: Верно. Сервер узнаёт повтор по ключу и возвращает результат первой попытки, даже если клиент не дождался ответа.
    - label: AbortSignal.timeout(10000) и повтор запроса после TimeoutError
      why: "Хорош для обычных GET, но abort не откатывает списание: первая попытка могла пройти на сервере, и повтор спишет деньги ещё раз."
