  question: database-for-frontend
  difficulty: 2
  prompt: "Бесконечная лента заказов: 2 млн строк, сортировка по `created_at DESC`. Первые страницы открываются мгновенно, но чем глубже прокрутка, тем медленнее ответ. Индекс по `created_at` уже есть. Что сделать?"
  explanation: "`OFFSET N` заставляет базу пройти и выбросить N строк даже при наличии индекса, поэтому время растёт с глубиной. Курсор (keyset) начинает чтение индекса сразу с нужного места, и время не зависит от номера страницы. `OFFSET` оставьте для небольших таблиц и интерфейсов с «перейти на страницу 7»."
  type: choose-tool
  options:
    - label: "Курсорная пагинация: `WHERE (created_at, id) < ($1, $2) ORDER BY created_at DESC, id DESC LIMIT 20` + индекс под это"
      why: "Лучший вариант: база спускается по индексу сразу к курсору. Скорость одинакова на любой глубине, а `id` в ключе разрешает совпадения `created_at`."
    - label: Оставить `OFFSET`, но добавить ещё один индекс по `(created_at, id)`
      why: Индекс ускорит сортировку, но `OFFSET` всё равно прочитает и выбросит все пропущенные строки. Подходит, если глубина пагинации невелика.
    - label: Кэшировать страницы в Redis по ключу `offset`
      why: Первое обращение к странице останется медленным, новые заказы сдвигают страницы и ломают кэш. Кэш уместен для горячих неизменных выборок, а не для лечения плохого запроса.
    - label: Увеличить `LIMIT` до 500, чтобы реже ходить за новыми страницами
      why: Растут payload и память клиента, а глубокие страницы всё так же медленные. Крупный `LIMIT` уместен для экспорта или батч-обработки, а не для ленты.
  answer: 0
