      why: "Верно. Для строки fetch ставит text/plain, а express.json() разбирает только тела с JSON-типом. Нужен явный 'Content-Type': 'application/json'."
    - label: fetch видит, что строка — валидный JSON, и ставит application/json, значит, ошибка на сервере
      why: "fetch не анализирует содержимое строки. Тип зависит только от вида body: для строки всегда text/plain."
    - label: Без Content-Type браузер вообще не отправляет тело POST-запроса
      why: Тело отправляется. Проблема в том, как сервер его интерпретирует, а не в том, дошло ли оно.
    - label: "Нужно было передать объект в body без JSON.stringify: fetch сериализует его сам"
      why: 'fetch не сериализует объекты: обычный объект превратится в строку "[object Object]". Сериализация и заголовок — ваша задача.'
