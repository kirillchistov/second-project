  explanation: Таймер вызывает abort() у контроллера, чей signal передан в fetch. finally гарантирует clearTimeout и после успеха, и после ошибки — иначе останется лишний отложенный вызов. Короткая альтернатива — `AbortSignal.timeout(ms)`.
  type: fill-tokens
  language: tsx
  code: |-
    async function fetchWithTimeout(url: string, ms: number) {
      const controller = new ___();
      const timer = setTimeout(() => controller.___(), ms);
      try {
        return await fetch(url, { signal: controller.___ });
      } ___ {
        clearTimeout(timer);
      }
    }
  tokens:
    - AbortController
    - abort
    - signal
    - finally
  decoys:
    - AbortSignal
    - cancel
    - catch
    - timeout
