  explanation: "Сначала измеряйте, потом чините: лог SQL показывает реальные запросы, которые генерирует ORM, а `EXPLAIN ANALYZE` показывает план. Индекс строят под WHERE + ORDER BY, равенство ставят слева. В проде индекс создают через миграцию с `CONCURRENTLY`, чтобы не блокировать запись. В конце план проверяют ещё раз."
