  prompt: После входа через OIDC клиент получил `id_token` и `access_token`. Как правильно понимать их роли?
  explanation: "OAuth 2.0 делегирует доступ: `access_token` даёт право вызывать API. OIDC добавляет аутентификацию: `id_token` (JWT) сообщает клиенту, кто вошёл. В API отправляют только `access_token`, а API проверяет подпись, `iss`, `aud` и `exp`."
  type: quiz
  options:
    - label: id_token сообщает клиенту, кто вошёл; access_token отправляют в API, и API проверяет его подпись, iss, aud и exp
      why: Верно. OIDC добавляет поверх OAuth аутентификацию, а id_token предназначен клиенту. Доступ к API — задача access_token.
    - label: "id_token удобнее отправлять в свой API: в нём уже есть email и sub, поэтому отдельная проверка прав не нужна"
      why: Типичная ошибка. Аудитория id_token — клиент, а не API, и в нём нет scopes. API должен принимать access_token, выпущенный именно для него.
    - label: "Это одно и то же в разных форматах: OIDC просто переименовал access_token и сделал его JWT"
      why: Нет. Это два разных токена с разным назначением. Access_token вообще может быть непрозрачной строкой, а id_token в OIDC всегда JWT.
    - label: OAuth 2.0 сам аутентифицирует пользователя, а OIDC нужен только для получения refresh_token
      why: Наоборот. OAuth 2.0 — протокол делегирования доступа, аутентификацию поверх него добавляет OIDC. Refresh_token есть и в чистом OAuth.
  answer: 0
- id: oauth-pkce-flow-steps
  skill: oauth-pkce-flow
  question: oauth-oidc
  difficulty: 2
  prompt: Расставьте по порядку шаги входа по Authorization Code Flow с PKCE через свой сервер (BFF).
  explanation: "Verifier и state создаются до редиректа и остаются у клиента, провайдеру уходит только хэш (challenge). State сверяют до обмена code на токены. Обмен на сервере позволяет не отдавать токены браузеру: тот получает только HttpOnly cookie сессии."
  type: order
  kind: timeline
  steps:
    - Сгенерировать state, code_verifier и code_challenge = SHA256(verifier), сохранить state и verifier
    - Редирект на /authorize с response_type=code, scope, state и code_challenge
    - Пользователь входит у провайдера, тот редиректит на redirect_uri с code и state
    - Сверить пришедший state с сохранённым
    - POST /token с code, code_verifier и redirect_uri — получить access, id и refresh токены
    - Сохранить токены на сервере и выдать браузеру HttpOnly cookie сессии
- id: oauth-callback-missing-state-check
  skill: oauth-state-csrf
  question: oauth-oidc
  difficulty: 2
  prompt: Это обработчик redirect_uri на BFF. Найдите строку с уязвимостью.
  explanation: "Проверить, что state присутствует, мало: его нужно сравнить с сохранённым до редиректа значением. Иначе атакующий подсунет жертве ссылку со своим code и залогинит её в свой аккаунт (login CSRF). Правило: `state !== saved` → 400, и только потом обмен code."
  type: find-bug
  language: ts
  code: |-
    export async function GET(req: Request) {
      const url = new URL(req.url);
      const code = url.searchParams.get('code');
      const state = url.searchParams.get('state');
      const saved = readCookie(req, 'oauth_state');
      const verifier = readCookie(req, 'pkce');
      if (!code || !state) {
        return new Response('Bad', { status: 400 });
      }
      const tokens = await exchangeCode(code, verifier);
      await createSession(tokens);
      return Response.redirect(new URL('/', req.url));
    }
  bugLines:
    - 7
  causes:
    - state не сравнивается с сохранённым значением, поэтому возможен login CSRF с подсунутым чужим code
