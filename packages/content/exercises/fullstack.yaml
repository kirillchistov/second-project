  explanation: Ответ идёт в одну сторону и инициирован запросом с телом, поэтому `fetch` + чтение `res.body` подходит лучше всего. EventSource даёт авто-переподключение и разбор событий, но работает только с GET и без своих заголовков. WebSocket нужен для постоянного двустороннего обмена.
  type: choose-tool
