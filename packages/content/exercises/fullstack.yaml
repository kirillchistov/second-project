  prompt: Чем SSE отличается от WebSocket и когда SSE достаточно?
  explanation: "Решает направление трафика. Если клиент в основном слушает, хватит SSE: обычный HTTP, автореконнект в браузере, редкие действия идут через fetch/POST. WebSocket нужен, когда клиент сам часто шлёт данные (чат, совместное редактирование, игры) или нужен бинарный формат."
  type: quiz
  options:
    - label: SSE — поток сервер→клиент поверх HTTP с автореконнектом; хватает, когда клиент слушает, а редкие действия шлёт обычными запросами
      why: Верно. Однонаправленность — не минус, если клиенту нужно только получать события. Встречные действия делаются отдельными POST.
    - label: Оба канала двунаправленные, просто SSE легче и поэтому подходит для небольшого трафика
      why: Через EventSource клиент ничего не может отправить по тому же соединению. Выбор зависит от направления данных, а не от объёма.
    - label: "WebSocket всегда предпочтительнее: он быстрее и сам переподключается при обрыве"
      why: У WebSocket нет встроенного автореконнекта, его пишут вручную. Автореконнект как раз есть у EventSource, а сервер для WebSocket сложнее.
    - label: SSE использует отдельный протокол, поэтому корпоративные прокси его часто режут, а WebSocket проходит
      why: "Наоборот: SSE — обычный HTTP-ответ text/event-stream. С апгрейдом соединения до WebSocket у прокси проблем бывает больше."
