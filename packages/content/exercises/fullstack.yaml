# idempotency-retries: принято из черновика 2026-10-13
- id: idempotency-retries-lost-response
  skill: idempotency-key
  question: idempotency-retries
  difficulty: 2
  prompt: POST /api/payments дошёл до сервера, деньги списались, но ответ потерялся по таймауту. Как сделать повтор этого запроса безопасным?
  explanation: "Клиент не знает, выполнилось ли действие, поэтому повтор неизбежен. Безопасным его делает пара: один ключ на операцию у клиента и дедупликация по ключу на сервере (уникальный индекс плюс сохранённый ответ). Блокировка кнопки и смена метода — не замена серверной идемпотентности."
  type: quiz
  options:
    - label: Сгенерировать ключ один раз на операцию, повторять с тем же Idempotency-Key, а сервер по ключу вернёт сохранённый ответ
      why: Верно. Сервер узнаёт повтор по ключу и отдаёт прошлый результат без повторного списания. Уникальный индекс по ключу защищает и от параллельных дубликатов.
    - label: Блокировать кнопку оплаты через isPending, чтобы второй запрос не ушёл
      why: "Это UX: защищает от двойного клика, но не от ретраев на сетевом уровне, перезагрузки страницы или повтора из очереди. Серверной защиты нет."
    - label: "Поменять метод на PUT: он идемпотентен, значит повтор безопасен"
      why: Идемпотентность PUT — это обещание семантики, а не свойство кода. Обработчик, который при каждом вызове списывает деньги, от смены метода безопаснее не станет.
    - label: Не повторять POST автоматически, а показать ошибку и попросить нажать ещё раз
      why: Пользователь нажмёт снова, и получится тот же дубликат, только вручную. Без ключа сервер не отличит повтор от новой оплаты.
  answer: 0
- id: idempotency-retries-key-per-attempt
  skill: idempotency-key
  question: idempotency-retries
  difficulty: 2
  prompt: Ретраи с ключом идемпотентности добавили, но при плохой сети пользователей всё равно списывают дважды. Найдите строку с ошибкой.
  explanation: "Колбэк retry вызывается заново на каждую попытку, и вместе с ним каждый раз генерируется новый UUID. Для сервера каждый повтор — новая операция. Ключ нужно создать один раз до retry: const key = crypto.randomUUID(). Правило: один ключ на одну логическую операцию."
  type: find-bug
  language: ts
  code: |-
    async function pay(orderId: string, amount: number) {
      return retry(() => fetch('/api/payments', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Idempotency-Key': crypto.randomUUID(),
        },
        body: JSON.stringify({ orderId, amount }),
      }), { attempts: 3 });
    }
  bugLines:
    - 6
  causes:
    - Ключ генерируется внутри функции повтора, поэтому каждая попытка уходит с новым ключом и сервер не узнаёт дубликат
    - crypto.randomUUID недоступен в браузере, поэтому заголовок уходит пустым
    - Имя заголовка должно быть в нижнем регистре, иначе сервер его не прочитает
    - POST нельзя повторять никогда, поэтому retry нужно убрать совсем
  answer: 0
- id: idempotency-retries-retry-policy
  skill: retry-policy
  question: idempotency-retries
  difficulty: 2
  prompt: "Допишите политику ретраев: повторять только временные ошибки, уважать подсказку сервера и не бить в сервис всем хором."
  explanation: "Повторять стоит сетевые ошибки, 429, 502, 503 и 504: 4xx вроде 400 и 422 повтор не исправит. Если сервер прислал Retry-After, ждать нужно столько, сколько он просит. Иначе используйте экспоненту с jitter (Math.random), чтобы клиенты не повторяли синхронно."
  type: fill-tokens
  language: ts
  code: |-
    const RETRYABLE = [429, 502, 503, ___];

    function shouldRetry(res: Response | null) {
      if (res === null) return true; // network
      return RETRYABLE.includes(res.status);
    }

    function getDelay(n: number, res: Response | null) {
      const ra = res?.headers.get('___');
      if (ra) return Number(ra) * 1000;
      return 2 ** n * 300 + Math.___() * 300;
