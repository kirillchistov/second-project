  explanation: В состоянии CONNECTING `send` бросает InvalidStateError, а в CLOSING/CLOSED данные молча теряются, поэтому сначала проверяем OPEN. `bufferedAmount` показывает, сколько байт ещё не ушло в сеть. Если значение большое, заменяемые данные вроде курсора лучше отбросить, иначе задержка накопится и UI получит устаревшие позиции. Важные сообщения так терять нельзя.
