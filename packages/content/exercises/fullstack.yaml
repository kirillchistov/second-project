  explanation: "Для multipart-тела нужна случайная граница между частями, и её знает только браузер, который сериализует FormData. Он сам ставит `multipart/form-data; boundary=...`. Правило: передали FormData в body — заголовок Content-Type не трогаем."
  type: quiz
  options:
    - label: Браузер сам выставит multipart/form-data с boundary; ручной заголовок без boundary не даст серверу разобрать тело
      why: Верно. Boundary генерирует браузер при сериализации FormData, и указать его вручную правильно нельзя.
    - label: fetch по умолчанию шлёт application/json, а сервер сам определит, что пришёл файл
      why: Неверно. Дефолта application/json у fetch нет, а сервер разбирает тело по Content-Type, а не угадывает формат.
    - label: Заголовок нужен, но только со значением application/x-www-form-urlencoded
      why: Неверно. urlencoded — формат пар ключ=значение без поддержки бинарных файлов. Для FormData нужен multipart.
    - label: Указывать можно, но FormData сначала нужно превратить в JSON.stringify(formData)
      why: 'Неверно. JSON.stringify(formData) даст "{}": файлы и поля потеряются. FormData передают в body как есть.'
