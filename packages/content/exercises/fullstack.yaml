  options:
    - label: Redis Pub/Sub (или NATS) между инстансами
      why: Инстанс-отправитель публикует событие в канал, а инстанс с сокетом получателя подписан на него и пересылает сообщение. Любой инстанс обслуживает любой запрос.
    - label: Sticky sessions на балансировщике
      why: Закрепляют клиента за инстансом при переподключении, но REST-запрос другого пользователя всё равно попадёт не туда. Полезны как дополнение, например для long-polling fallback.
    - label: Общая Map сокетов в памяти процесса
      why: Map видна только своему процессу, а сокет — живой объект, который в другой инстанс не передать. Подходит как локальный реестр или при одном инстансе.
    - label: Клиенты опрашивают БД каждые 2 секунды
      why: Работает при любом числе инстансов, но даёт задержку, нагружает БД и обесценивает WebSocket. Разумно лишь как временный fallback.
  answer: 0
- id: websocket-scaling-pubsub-flow
  skill: websocket-pubsub-fanout
  question: websocket-scaling
  difficulty: 2
  prompt: Пользователь B отправил сообщение через REST, запрос попал на инстанс 2, а сокет пользователя A открыт на инстансе 1. Расставьте шаги доставки по порядку.
  explanation: "Инстанс 2 не знает, где подключён A, и не должен знать: он лишь публикует событие. Брокер раздаёт его подписчикам, а отправляет в сокет только тот инстанс, у которого соединение есть в локальном реестре. Остальные инстансы событие игнорируют."
  type: order
  kind: timeline
  steps:
    - Инстанс 1 при подключении A кладёт сокет в локальную Map и подписан на канал в Redis
    - REST-запрос от B попадает на инстанс 2
    - Инстанс 2 сохраняет сообщение и публикует событие в канал Redis
    - Redis рассылает событие всем подписчикам канала
    - Инстанс 1 получает событие и находит сокет A в своей Map
    - Инстанс 1 вызывает ws.send, и A видит сообщение
- id: websocket-scaling-local-only-send
  skill: websocket-pubsub-fanout
  question: websocket-scaling
  difficulty: 2
  prompt: Сервер запущен в 3 инстансах. Иногда получатели не видят новые сообщения, хотя POST /messages отвечает 202. Найдите строку с ошибкой.
  explanation: "`sockets` содержит только соединения своего процесса. Если получатель подключён к другому инстансу, `sockets.get(to)` вернёт undefined, и сообщение молча потеряется. Нужно `pub.publish('chat', JSON.stringify({ to, text }))`: подписчик на нужном инстансе сам отправит его в сокет."
  type: find-bug
  language: ts
  code: |-
    const sockets = new Map<string, WebSocket>();
    const sub = new Redis();
    const pub = new Redis();
    sub.subscribe('chat');
    sub.on('message', (_ch, raw) => {
      const { to, text } = JSON.parse(raw);
      sockets.get(to)?.send(text);
    });

    app.post('/messages', (req, res) => {
      const { to, text } = req.body;
      sockets.get(to)?.send(text);
      res.sendStatus(202);
    });
  bugLines:
    - 12
  causes:
    - POST отправляет только в локальный сокет; если получатель подключён к другому инстансу, сообщение теряется — нужен pub.publish
    - Для публикации и подписки нельзя использовать два разных подключения к Redis
    - Обработчик message задваивает сообщения для клиентов этого инстанса
    - Реестр сокетов нельзя держать в памяти процесса — его нужно хранить в Redis
  answer: 0

# websocket-backpressure: принято из черновика 2026-11-07
- id: websocket-order-vs-delivery-quiz
  skill: websocket-delivery-guarantees
  question: websocket-backpressure
  difficulty: 2
  prompt: Что верно про порядок и доставку сообщений в WebSocket?
  explanation: "Порядок в WebSocket обеспечивает TCP, но только в пределах одного соединения. Сообщения, отправленные во время разрыва, просто теряются. Досылку должен обеспечить протокол приложения, например через seq и lastSeq. Буфер отправки тоже растёт без ограничений: решать, что отбрасывать, должен ваш код по `bufferedAmount`."
  type: quiz
  options:
    - label: В одном соединении порядок гарантирован TCP, но сообщения во время разрыва теряются, если протокол не умеет их досылать
      why: Верно. Гарантия порядка и гарантия доставки через разрывы — разные вещи. Вторую должно обеспечить приложение.
    - label: "WebSocket гарантирует порядок и доставку: после реконнекта браузер сам дошлёт пропущенные сообщения"
      why: Новое соединение ничего не знает о старом. Ни браузер, ни стандарт WebSocket не хранят и не досылают пропущенное.
    - label: Порядок не гарантирован даже внутри соединения, поэтому клиент обязан сортировать сообщения по seq
      why: WebSocket работает поверх TCP, а TCP доставляет данные упорядоченно. seq нужен для досылки и дедупликации после реконнекта, а не для сортировки.
    - label: При перегрузке канала браузер сам отбрасывает старые сообщения, чтобы буфер не рос
      why: "Браузер ничего не отбрасывает: он буферизует, и `bufferedAmount` растёт. Решать, что пропустить, должно приложение."
  answer: 0
- id: websocket-reconnect-without-resume
  skill: websocket-resume-protocol
  question: websocket-backpressure
  difficulty: 3
  prompt: Сервер нумерует сообщения полем seq и умеет досылать пропущенные, начиная с переданного номера. Найдите строку, из-за которой после переподключения клиент теряет события.
  explanation: "Клиент честно запоминает lastSeq, но при подписке его не отправляет. Сервер не знает, с какого места досылать, и всё, что пришло во время разрыва, теряется. Правило: при реконнекте передавай позицию последнего применённого сообщения, например `{ op: 'sub', since: lastSeq }`."
  type: find-bug
  language: ts
  code: |-
    let lastSeq = 0;

    function connect() {
      const ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        ws.send(JSON.stringify({ op: 'sub' }));
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        apply(msg);
        lastSeq = msg.seq;
      };
      ws.onclose = () => setTimeout(connect, 1000);
    }
  bugLines:
    - 6
  causes:
    - При подписке не передаётся lastSeq — сервер не знает, с какого сообщения досылать пропущенное
    - lastSeq нужно сбрасывать в 0 при каждом новом соединении
    - Сообщения могут прийти не по порядку, поэтому их надо сортировать по seq перед apply
    - Вызов connect из onclose через setTimeout создаёт утечку соединений
  answer: 0
- id: websocket-cursor-backpressure-guard
