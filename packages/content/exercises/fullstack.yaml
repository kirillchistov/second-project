# abort-controller: принято из черновика 2026-11-07
- id: abort-controller-what-abort-does
  skill: abort-controller-semantics
  question: abort-controller
  difficulty: 1
  prompt: Эффект грузит пользователя через fetch с `signal`, а в cleanup вызывает `controller.abort()`. Что на самом деле даёт отмена?
  explanation: "`abort()` переводит signal в состояние aborted, и `fetch` реджектится с `AbortError`. Код после `.then` не выполнится, и устаревший ответ не попадёт в state. Браузер оборвёт соединение, если оно ещё открыто. Но сервер мог уже принять и обработать запрос: отмена работает только на клиенте."
  type: quiz
  options:
    - label: "fetch реджектится с AbortError: ответ не обработается, браузер оборвёт соединение, но сервер мог уже обработать запрос"
      why: Верно. Отмена работает на стороне клиента. Её цель — не записать в state чужие данные, а побочные эффекты на сервере она не откатывает.
    - label: Сервер получает сигнал отмены и откатывает начатую операцию
      why: Протокол не передаёт серверу команду «отменить». Если запрос уже дошёл, сервер обработает его до конца, а POST нужно делать идемпотентным.
    - label: Промис fetch навсегда остаётся в pending, поэтому then и catch не вызываются
      why: Промис не зависает, а отклоняется с AbortError. Поэтому этот случай нужно отфильтровать в catch, иначе пользователь увидит ложную ошибку.
    - label: Ответ всё равно придёт в .then, но React не даст вызвать setState
      why: React ничего не блокирует. Устаревший ответ не доходит до .then именно потому, что промис fetch отклонён.
  answer: 0
- id: abort-controller-shared-instance
  skill: effect-race-conditions
  question: abort-controller
  difficulty: 2
  prompt: Первый пользователь загружается. После смены `id` данные больше никогда не приходят, ошибок в консоли нет. Где баг?
  explanation: "Signal, который однажды перешёл в aborted, обратно не возвращается. Если один контроллер общий для всех, после первого cleanup каждый новый fetch сразу реджектится с AbortError, а catch молча это глотает. Контроллер создают внутри эффекта: на каждый запуск свой, и cleanup отменяет именно его запрос."
  type: find-bug
  language: tsx
  code: |-
    const controller = new AbortController();
    function User({ id }: { id: string }) {
      const [user, setUser] = useState<U | null>(null);
      useEffect(() => {
        fetch(`/api/users/${id}`, {
          signal: controller.signal,
        })
          .then((r) => r.json())
          .then(setUser)
          .catch((e) => {
            if (e.name !== 'AbortError') console.error(e);
          });
        return () => controller.abort();
      }, [id]);
  bugLines:
    - 1
  causes:
    - "Контроллер общий для всех запусков эффекта: после первого abort() его signal навсегда aborted, и каждый новый fetch сразу отменяется"
    - AbortError нужно пробрасывать дальше, а не фильтровать в catch
    - В cleanup нужно вызывать controller.signal.abort(), а не controller.abort()
    - В зависимостях эффекта не хватает controller
  answer: 0
- id: abort-controller-multiple-fetches
  skill: abort-controller-semantics
  question: abort-controller
  difficulty: 2
  prompt: Один контроллер передан в два fetch, и abort() вызван сразу, до прихода ответов. Что выведется в консоль?
  explanation: Один signal можно передать в любое число запросов, и `abort()` отменит их все одним вызовом. Это удобно, когда страница параллельно грузит несколько ресурсов. Оба промиса отклоняются с `AbortError`, а `allSettled` дожидается обоих.
  type: predict-output
  language: ts
  code: |-
    const c = new AbortController();
    const a = fetch('/a', { signal: c.signal });
    const b = fetch('/b', { signal: c.signal });
    c.abort();

    const res = await Promise.allSettled([a, b]);
    console.log(
      res.map((r) =>
        r.status === 'rejected' ? r.reason.name : 'ok'
      )
    );
  options:
    - "['AbortError', 'AbortError']"
    - "['ok', 'ok']"
    - "['AbortError', 'ok']"
    - "['ok', 'AbortError']"
  answer: 0
- id: abort-controller-timeout-and-unmount
  skill: fetch-timeout-cancel
  question: abort-controller
  difficulty: 3
  prompt: Запрос в эффекте нужно оборвать, если он идёт дольше 5 секунд, и отменить, если компонент размонтировался раньше. Как это сделать?
  explanation: Для таймаута есть `AbortSignal.timeout(ms)`, а `AbortSignal.any()` объединяет несколько сигналов в один. По таймауту fetch реджектится с `TimeoutError`, а не с `AbortError`. Поэтому в catch таймаут стоит показать пользователю, а отмену при unmount — тихо проигнорировать.
  type: choose-tool
  options:
    - label: "signal: AbortSignal.any([controller.signal, AbortSignal.timeout(5000)]), в cleanup — controller.abort()"
      why: "Лучший вариант: один signal срабатывает и по таймауту, и при unmount, а соединение реально обрывается в обоих случаях."
    - label: Promise.race(fetch, промис с setTimeout и reject через 5 с)
      why: "Даёт только видимость таймаута: сам запрос продолжает висеть и тратить соединение. Годится лишь там, где API вообще не поддерживает signal."
    - label: "Только signal: AbortSignal.timeout(5000)"
      why: Таймаут сработает, но при unmount или смене id запрос не отменится, и устаревший ответ может записаться в state. Подходит для разовых запросов вне компонента.
    - label: Флаг let ignore = true в cleanup и проверка перед setState
      why: Защищает от гонок без отмены, например для промисов без поддержки signal. Но таймаута здесь нет, и соединение не обрывается.
  answer: 0

# fetch-error-handling: принято из черновика 2026-11-07
- id: fetch-error-when-rejects
  skill: fetch-rejection-semantics
  question: fetch-error-handling
  difficulty: 1
  prompt: В каком случае промис, который вернул `fetch('/api/todos')`, будет отклонён (reject)?
  explanation: "`fetch` реджектится, только если HTTP-ответ вообще не получен: нет сети, DNS, CORS или abort. Любой статус, включая 404 и 500, — это выполненный промис с `res.ok === false`. Правило: всегда проверяйте `res.ok` сами, а `catch` оставьте для сетевых сбоев."
  type: quiz
  options:
    - label: "Только если ответ не получен: нет сети, DNS не резолвится, CORS заблокировал ответ или запрос отменён"
      why: Верно. Ответ с любым HTTP-статусом считается успешно полученным, и промис выполняется.
    - label: При любом статусе 400 и выше — 404, 401, 500 и т. д.
      why: Так ведёт себя axios с настройками по умолчанию. У fetch промис выполнится, а `res.ok` будет false.
    - label: "Только при 5xx: ошибка сервера реджектит, а 4xx считается ответом"
      why: fetch не различает классы статусов. И 4xx, и 5xx дают выполненный промис с `ok === false`.
    - label: Если тело ответа не JSON — fetch не сможет его разобрать
      why: fetch тело не разбирает. Реджектится уже `res.json()`, и это отдельная ошибка парсинга.
  answer: 0
- id: fetch-error-500-json-body
  skill: fetch-rejection-semantics
  question: fetch-error-handling
  difficulty: 2
  prompt: 'Сервер отвечает на /api/todos статусом 500, `Content-Type: application/json` и телом `{"error":"db down"}`. Что выведет консоль?'
  explanation: "Ответ с кодом 500 — выполненный промис, поэтому `catch` не срабатывает. `res.json()` успешно разбирает объект ошибки, а у объекта нет `length`. Получаем тихий баг: в UI окажется `undefined` вместо массива. Нужна явная проверка `if (!res.ok) throw ...`."
  type: predict-output
  language: ts
  code: |-
    async function loadTodos() {
      try {
        const res = await fetch('/api/todos');
        const data = await res.json();
        console.log('items:', data.length);
      } catch (e) {
        console.log('caught');
      }
    }

    loadTodos();
  options:
    - "items: undefined"
    - caught
    - "items: 0"
    - "items: 1"
  answer: 0
- id: fetch-error-json-before-ok
  skill: fetch-response-validation
  question: fetch-error-handling
  difficulty: 2
  prompt: Когда прокси возвращает 502 с HTML-страницей, пользователь видит «Unexpected token '<'» вместо «HTTP 502». Найдите строку с ошибкой.
  explanation: "Тело разбирается как JSON ещё до проверки статуса. Ответ с ошибкой может быть HTML, тогда `json()` падает с ошибкой парсинга и прячет настоящую причину. Правильный порядок: сначала `res.ok` (и при необходимости Content-Type), потом `res.json()`."
  type: find-bug
  language: ts
  code: |-
    async function loadTodos(): Promise<Todo[]> {
      const res = await fetch('/api/todos');
      const data = await res.json();
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      return data;
    }
  bugLines:
    - 3
  causes:
    - "`res.json()` вызывается до проверки `res.ok`, а тело ошибочного ответа может оказаться не JSON"
    - "`fetch` нужно обернуть в try/catch, иначе ошибка 502 не будет поймана"
    - "`res.status` недоступен после чтения тела, поэтому сообщение теряется"
    - Функция должна возвращать `res`, а не `data`, иначе тип Promise<Todo[]> неверен
  answer: 0
- id: fetch-error-safe-fetch-json
  skill: fetch-response-validation
  question: fetch-error-handling
