      why: Sticky помогает при переподключении, но событие из REST-запроса другого пользователя родится на другом инстансе. А при рестарте соединения рвутся разом.
    - label: Балансировщик может отправить каждое сообщение на любой свободный инстанс, как обычный HTTP-запрос
      why: Сообщения идут внутри уже открытого TCP-соединения с одним инстансом. Перенаправить их без разрыва нельзя.
  answer: 0
