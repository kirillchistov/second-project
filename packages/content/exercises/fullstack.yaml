# fetch-retry-backoff: принято из черновика 2026-11-07
- id: fetch-retry-strategy-quiz
  skill: retry-strategy
  question: fetch-retry-backoff
  difficulty: 2
  prompt: Клиент получает ошибки от API. Какая стратегия автоматических повторов корректна?
  explanation: "Повторять стоит только временные сбои: сетевой обрыв, 429, 503 и другие 5xx. Ответ на 400/404 при повторе не изменится. Паузу между попытками растят экспоненциально и добавляют jitter, чтобы клиенты не пришли к восстановившемуся серверу одновременно. Если сервер прислал Retry-After, берут паузу из него."
  type: quiz
  options:
    - label: Повторять сетевые ошибки, 429 и 5xx вроде 503 с экспоненциально растущей паузой и случайным jitter
      why: Верно. Это временные сбои, которые могут пройти сами. Backoff даёт серверу время восстановиться, а jitter разносит повторы разных клиентов во времени.
    - label: "Повторять любой ответ с !res.ok через фиксированную паузу в 1 секунду: так нагрузка на сервер предсказуема"
      why: 400/404 при повторе не изменятся. Фиксированная пауза синхронизирует клиентов, и их повторы приходят на сервер одной волной.
    - label: "Повторять всё, включая 400 и 404, но с экспоненциальным backoff: пауза и так защищает сервер"
      why: Backoff снижает нагрузку, но не делает повтор осмысленным. Ошибка в самом запросе вернётся снова, а пользователь будет зря ждать.
    - label: "Повторять сетевые ошибки и 5xx сразу, без паузы: пользователь быстрее получит ответ"
      why: Мгновенные повторы добивают перегруженный сервер и почти наверняка получат тот же 503. Серверу нужно время на восстановление.
  answer: 0
