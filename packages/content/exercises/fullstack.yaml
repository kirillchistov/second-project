      why: "Большинство очередей дают at-least-once: после сбоя задачу доставят повторно. Без идемпотентности получатся двойные списания и записи."
    - label: Очередь позволяет вернуть готовый результат в том же HTTP-ответе, обходя таймаут
      why: "Наоборот: ответ уходит до выполнения работы. О результате клиент узнаёт позже через polling, SSE/WebSocket или уведомление."
