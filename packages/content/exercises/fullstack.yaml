  explanation: "POST не идемпотентен: если повторить его вслепую после таймаута, заказ может создаться дважды. Ключ идемпотентности, один на одну попытку оформления, позволяет серверу распознать повтор и вернуть уже созданный заказ. GET, PUT и DELETE идемпотентны по семантике, поэтому их повторять безопаснее."
  type: choose-tool
  options:
    - label: Заголовок Idempotency-Key с одним ключом на все повторы и дедупликация на сервере
      why: Лучший вариант. Сервер видит знакомый ключ и возвращает уже созданный заказ вместо нового. Так делают платёжные API.
    - label: Просто повторять POST до 3 раз при ответах 5xx
      why: Подходит для идемпотентных запросов вроде GET. Для POST при 504 заказ мог уже создаться, и повтор даст дубликат.
    - label: Блокировать кнопку «Оформить», пока запрос в полёте
      why: "Полезно против двойного клика, но с повтором после таймаута не помогает: дубль появится при ретрае."
    - label: Заменить POST на GET с параметрами заказа в query
      why: GET должен только читать. Его могут кэшировать и повторять прокси, и тогда побочный эффект станет непредсказуемым.
