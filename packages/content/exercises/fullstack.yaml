  explanation: Выбирайте канал по условиям. Тот же домен и сессия в cookie — полагайтесь на cookie и проверяйте Origin. Секреты в URL запрещены — подключайтесь без токена и отправляйте его первым сообщением. Остальные данные шлите только после подтверждения от сервера.
