- id: node-event-loop-sync-crypto-login
  skill: node-event-loop-blocking
  question: node-event-loop
  difficulty: 2
  prompt: Под нагрузкой логин тормозит, а с ним и все остальные эндпоинты сервера. Найдите строку-виновника.
  explanation: "scryptSync специально сделан медленным и выполняется прямо в главном потоке. Пока считается хэш, сервер не обслуживает ни один другой запрос. Асинхронный crypto.scrypt (через promisify) отдаёт работу пулу потоков libuv. Правило: синхронные API допустимы при старте приложения, но не в обработчике запроса."
  type: find-bug
  language: ts
  code: |-
    app.post('/login', async (c) => {
      const { email, password } = await c.req.json();
      const user = await db.users.find(email);
      if (!user) return c.json({ ok: false }, 401);
      const hash = crypto.scryptSync(
        password, user.salt, 64);
      const ok = crypto.timingSafeEqual(
        hash, user.hash);
      return c.json({ ok }, ok ? 200 : 401);
    });
  bugLines:
    - 5
    - 6
  causes:
    - Синхронный scryptSync занимает главный поток на время хэширования и блокирует event loop для всех запросов
    - timingSafeEqual работает медленно, и его нужно заменить обычным сравнением ===
    - await db.users.find блокирует поток, пока база не ответит
    - Обработчик объявлен как async, поэтому Node.js выполняет его последовательно для всех запросов
  answer: 0
- id: node-event-loop-pdf-reports-offload
  skill: node-cpu-offload-choice
  question: node-event-loop
  difficulty: 2
  prompt: Эндпоинт генерирует PDF-отчёт за 20–40 секунд работы CPU. Задачи должны переживать рестарт при деплое и повторяться при сбое, а пользователь должен видеть статус. Что выбрать?
  explanation: "Правило выбора: короткая CPU-работа внутри запроса — worker_threads. Долгие задачи, которые должны переживать рестарт, с повторами и статусом — очередь с отдельными воркерами. async/await не снимает нагрузку с CPU, а cluster масштабирует обработку запросов, но не изолирует тяжёлую работу."
  type: choose-tool
  options:
    - label: Очередь задач (BullMQ) и отдельные процессы-воркеры
      why: Задачи хранятся в Redis и переживают рестарт. Повторы, статусы и прогресс есть из коробки, а тяжёлая работа идёт вне API-процесса и масштабируется отдельно.
    - label: worker_threads (например, пул Piscina) в API-процессе
      why: Хороши для коротких CPU-задач, результат которых нужен в том же запросе. При рестарте задачи потеряются, а повторы и статусы придётся писать самому.
    - label: Сделать генерацию async и вызывать через await
      why: Ключевое слово async не уводит вычисления из главного потока. Подходит только для I/O, а CPU-работа так и продолжит блокировать event loop.
    - label: Запустить несколько процессов через cluster
      why: Подходит для масштабирования обычного трафика. Но каждый отчёт всё равно заблокирует свой процесс на 40 секунд, а гарантий выполнения и повторов не будет.
  answer: 0

# oauth-oidc: принято из черновика 2026-10-13
