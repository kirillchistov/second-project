- id: fetch-timeout-payment-retry
  skill: client-timeout-vs-server-work
  question: fetch-timeout
  difficulty: 3
  prompt: "Кнопка «Оплатить»: клиент ждёт ответ не дольше 10 с, а при таймауте повторяет запрос. Нельзя, чтобы деньги списались дважды. Что главное?"
  explanation: "Таймаут на клиенте лишь перестаёт ждать — сервер может уже выполнить операцию. Поэтому ретраи небезопасных запросов требуют поддержки на сервере: идемпотентный ключ превращает повтор в «верни результат первой попытки»."
