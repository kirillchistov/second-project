  explanation: "Открытый сокет — состояние, привязанное к одному процессу. Чтобы масштабироваться, нужно ответить на два вопроса: как клиент попадает на инстанс (sticky sessions или любой) и как событие доходит до инстанса с нужным сокетом. Ответ на второй — pub/sub-брокер: Redis Pub/Sub или NATS."
  type: quiz
  options:
    - label: Соединение — долгоживущее состояние на конкретном инстансе, а событие для клиента может возникнуть там, где его сокета нет
      why: "Верно. Сокет нельзя переселить на другой инстанс, поэтому нужен путь доставки: брокер, который доносит событие до инстанса с соединением."
    - label: Балансировщики не умеют проксировать WebSocket, поэтому нужен отдельный шлюз
      why: Nginx, HAProxy и ALB проксируют Upgrade-запросы. Проблема не в проксировании, а в том, где живёт соединение после установки.
