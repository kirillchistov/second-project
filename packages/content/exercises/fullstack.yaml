  prompt: Сервер ответил на `fetch('/api/todos')` статусом 500 с JSON-телом ошибки. Что произойдёт с промисом fetch?
  explanation: "fetch отклоняет промис только при сетевой ошибке: нет соединения, CORS, abort. Любой HTTP-ответ, даже 404 или 500, — это успешный Response. Правило: после await fetch всегда проверяйте `res.ok` (статус 200–299) и бросайте ошибку сами."
  type: quiz
  options:
    - label: Промис выполнится с Response, у которого ok === false и status === 500
      why: Верно. Для fetch это успешно полученный ответ. Отличить ошибку можно только по res.ok или res.status.
    - label: Промис отклонится с TypeError, потому что статус 5xx
      why: TypeError бывает при сетевой ошибке или блокировке CORS. Статус ответа на сам промис не влияет.
    - label: Промис отклонится только при 5xx, а при 4xx выполнится
      why: "Частое заблуждение. fetch не различает 4xx и 5xx: в обоих случаях промис выполняется."
    - label: fetch сам повторит запрос несколько раз и после этого отклонит промис
      why: У fetch нет встроенных повторов. Ретраи делают вручную или через библиотеку, например TanStack Query.
