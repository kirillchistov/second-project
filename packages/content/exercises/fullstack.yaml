  question: node-event-loop
  difficulty: 3
  prompt: Скрипт запущен в Node.js как CommonJS-модуль. Что будет в консоли?
  explanation: "Сначала выполняется синхронный код колбэка (io). Затем опустошаются очереди: сначала nextTick, потом микрозадачи промисов. Колбэк readFile выполняется в фазе poll, а следующая за ней фаза — check, поэтому setImmediate гарантированно сработает раньше setTimeout. Неопределённость их порядка есть только в главном модуле."
  type: predict-output
  language: js
  code: |-
    const fs = require('fs');
    const log = console.log;

    fs.readFile(__filename, () => {
      setTimeout(() => log('timeout'), 0);
      setImmediate(() => log('immediate'));
      Promise.resolve().then(() => log('promise'));
      process.nextTick(() => log('nextTick'));
      log('io');
    });
  options:
    - io → nextTick → promise → immediate → timeout
    - io → promise → nextTick → immediate → timeout
    - io → nextTick → promise → timeout → immediate
    - nextTick → promise → io → immediate → timeout
