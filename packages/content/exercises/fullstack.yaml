# fetch-timeout: принято из черновика 2026-11-07
- id: fetch-timeout-how
  skill: fetch-timeout-abort
  question: fetch-timeout
  difficulty: 2
  prompt: Как правильно ограничить время ожидания ответа от `fetch`?
  explanation: "У fetch нет опции timeout, но есть `signal`. Таймаут — это сигнал, который срабатывает по таймеру: `AbortSignal.timeout(ms)` или связка AbortController + setTimeout(abort) + clearTimeout в finally. Promise.race только перестаёт ждать, а сам запрос не отменяет."
  type: quiz
  options:
    - label: "Передать в fetch `signal`, который отменится по таймеру: `AbortSignal.timeout(ms)` или AbortController + setTimeout(abort)"
      why: Верно. Отмена через signal реально обрывает запрос, и fetch отклоняется с ошибкой (AbortError или TimeoutError у AbortSignal.timeout).
    - label: "Указать опцию `fetch(url, { timeout: 5000 })`"
      why: Такой опции у fetch нет — неизвестное поле просто проигнорируется, и запрос будет ждать сколько угодно. Опция timeout есть у axios, но не у fetch.
    - label: Обернуть в `Promise.race` с промисом, который отклоняется через setTimeout
      why: "Промис отклонится вовремя, но сам запрос продолжит висеть: соединение не закрыто, ответ потом скачается впустую. Без signal отмены нет."
    - label: "Таймаут не нужен: браузер сам обрывает fetch через 30 секунд"
      why: "Единого короткого таймаута нет: браузер может ждать долго, и время зависит от браузера и сети. Полагаться на это нельзя."
  answer: 0
- id: fetch-timeout-manual-controller
