- id: websocket-auth-browser-limits
  skill: websocket-auth-transport
  question: websocket-auth
  difficulty: 2
  prompt: Браузерный клиент должен аутентифицировать WebSocket-соединение токеном. Какое утверждение верно?
  explanation: "Браузерный `new WebSocket(url, protocols)` не принимает заголовки. Поэтому токен передают иначе: query-параметром (риск попасть в логи), через subprotocol, через cookie того же домена или первым сообщением после `onopen`. Сервер должен обрабатывать истечение токена и в уже открытом соединении."
  type: quiz
  options:
    - label: Браузерный WebSocket не даёт задать свои заголовки — токен передают через URL, subprotocol, cookie или первым сообщением
      why: Верно. Хендшейк формирует браузер, и Authorization туда не добавить. Остаются обходные каналы, у каждого свои компромиссы.
    - label: "Заголовок можно передать вторым аргументом: new WebSocket(url, { headers: { Authorization } })"
      why: Так умеет Node-библиотека ws. В браузере второй аргумент — список subprotocol-ов, объект с headers там не поддерживается.
    - label: "Аутентификация не нужна: wss шифрует соединение, и посторонний не сможет к нему подключиться"
      why: Шифрование защищает трафик от перехвата, но не говорит серверу, кто подключился. Подключиться к открытому эндпоинту может кто угодно.
    - label: "Достаточно проверить токен на хендшейке: пока соединение открыто, пользователь считается авторизованным"
      why: Соединение может жить часами, и токен успеет истечь. Сервер должен перепроверять токен или закрывать соединение кодом, требующим переавторизации.
  answer: 0
