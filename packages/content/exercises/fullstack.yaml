  explanation: "Если есть свой сервер, самая надёжная схема — BFF: code обменивается на сервере, токены туда же и сохраняются, а браузер получает только HttpOnly cookie. Тогда XSS не украдёт токены. PKCE в браузере — выбор для чистой SPA без бэкенда. Implicit flow устарел."
