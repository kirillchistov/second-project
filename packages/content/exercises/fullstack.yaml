# fetch-streaming: принято из черновика 2026-11-07
- id: fetch-streaming-body-quiz
  skill: fetch-readable-stream
  question: fetch-streaming
  difficulty: 2
  prompt: Сервер отдаёт большой CSV по частям. Как в браузере обрабатывать данные по мере прихода, а не после полной загрузки?
  explanation: "`response.body` — это `ReadableStream<Uint8Array>`. Каждый `read()` отдаёт очередной чанк, а в конце возвращает `done: true`. Методы `json()`, `text()` и `blob()` сначала дочитывают поток до конца. Подходит любой HTTP-ответ, который сервер отправляет частями. SSE или WebSocket для этого не нужны."
  type: quiz
  options:
    - label: "Взять `res.body.getReader()` и в цикле вызывать `read()`: каждый вызов вернёт чанк байтов, как только он придёт"
      why: "Верно. body — ReadableStream байтов, reader отдаёт чанки по мере прихода, а done: true сигнализирует о конце потока."
    - label: "Периодически вызывать `await res.text()`: каждый вызов вернёт новую порцию пришедшего текста"
      why: "text() ждёт весь поток и возвращает его целиком. Повторный вызов упадёт с ошибкой: тело ответа уже прочитано."
    - label: Читать `res.body` как строку, которая дополняется по мере загрузки, и смотреть её длину
      why: body — это не строка, а ReadableStream с бинарными чанками Uint8Array. Текст получают через TextDecoder.
    - label: "Через fetch так нельзя: частичная обработка возможна только через EventSource или WebSocket"
      why: Заблуждение. fetch умеет читать любой ответ, который сервер отправляет частями. SSE — лишь один из форматов поверх такого потока.
  answer: 0
- id: fetch-streaming-utf8-split
  skill: stream-text-decoding
  question: fetch-streaming
  difficulty: 3
  prompt: На английском тексте функция работает, а в русском изредка появляются символы �. Найдите ошибку.
  explanation: "Кириллица в UTF-8 занимает 2 байта, и граница чанка может разрезать символ. Без `{ stream: true }` каждый вызов `decode()` считается законченным, и неполные байты превращаются в �. В потоковом режиме декодер хранит хвост до следующего чанка. В конце нужен вызов `decode()` без аргументов, чтобы сбросить остаток."
  type: find-bug
  language: tsx
  code: |-
    async function readText(res: Response) {
      const reader = res.body!.getReader();
      const decoder = new TextDecoder();
      let text = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        text += decoder.decode(value);
      }
      return text + decoder.decode();
    }
  bugLines:
    - 8
  causes:
    - "decode без { stream: true } считает чанк законченным, и многобайтовый символ на границе чанков ломается"
    - TextDecoder по умолчанию использует latin1, нужно передать 'utf-8' в конструктор
    - Нужно проверять value === undefined вместо done, иначе последний чанк теряется
    - reader.read() возвращает строки, поэтому decode повторно портит уже готовый текст
  answer: 0
