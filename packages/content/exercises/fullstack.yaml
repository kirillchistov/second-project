# node-event-loop: принято из черновика 2026-10-13
- id: node-event-loop-blocking-quiz
  skill: node-event-loop-blocking
  question: node-event-loop
  difficulty: 2
  prompt: Сервер на Node.js спокойно держит 1000 одновременных запросов к базе. Но один обработчик с синхронным циклом на 2 секунды «вешает» все запросы. Почему?
  explanation: Async I/O — это не параллельные вычисления. Ожиданием сети и диска занимается libuv, а весь JS выполняется в одном потоке. Пока синхронный код занимает этот поток, event loop не может вызвать ни один колбэк. CPU-тяжёлую работу выносят в worker_threads, очередь или отдельный сервис.
  type: quiz
  options:
    - label: "JS выполняется в одном потоке: пока цикл занимает его, event loop не может вызвать колбэки других запросов"
      why: Верно. Запросы к БД ждут ответа в libuv и не занимают поток. Синхронный цикл занимает его целиком, и до конца цикла event loop стоит.
    - label: libuv выделяет каждому запросу свой поток, но пул из 4 потоков быстро заканчивается
      why: Сетевой I/O не использует пул потоков, а JS-обработчики не выполняются в пуле. Пул (UV_THREADPOOL_SIZE) нужен для fs, crypto, dns.lookup и zlib.
    - label: Node.js ставит синхронный код в очередь с низким приоритетом, и остальные запросы ждут свою очередь
      why: "Приоритетов у синхронного кода нет. Его нельзя прервать: он выполняется до конца, а очереди event loop в это время просто не обрабатываются."
    - label: Если обернуть цикл в async-функцию, он уйдёт в фон и перестанет блокировать сервер
      why: async не переносит код в другой поток. Тело функции до первого await выполняется синхронно, поэтому цикл всё равно займёт главный поток.
  answer: 0
- id: node-event-loop-io-callback-order
