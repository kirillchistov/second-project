  explanation: "Парсинг JSON, отмена и работа в Node у `fetch` есть: `res.json()`, `AbortController`/`AbortSignal.timeout()`, глобальный `fetch` с Node 18. Библиотека нужна ради сквозной логики для всех запросов: интерсепторов, refresh токена, прогресса загрузки. Для пары запросов хватит тонкой обёртки."
  type: quiz
  options:
    - label: "Нужны сквозные интерсепторы: токен в каждом запросе и единая обработка 401 с refresh и повтором"
      why: Верно. Это логика для всех запросов сразу. У axios для неё есть готовые интерсепторы, на fetch её придётся писать в обёртке самому.
    - label: fetch не умеет парсить JSON, а axios делает это сам
      why: Парсинг — одна строка `await res.json()`. Тащить зависимость ради этого — типичный антипаттерн.
    - label: fetch нельзя отменить или ограничить по времени
      why: "Можно: `AbortController` и `signal`, а для таймаута — `AbortSignal.timeout(ms)`. Готового параметра timeout нет, но пишется он в пару строк."
    - label: fetch не работает на сервере, поэтому для SSR нужен axios
      why: В Node 18+ `fetch` глобальный, а Next.js даже расширяет его опциями кеширования. Это аргумент из прошлого.
  answer: 0
