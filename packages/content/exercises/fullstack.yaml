  explanation: "`new Headers(init.headers)` сохраняет заголовки вызывающего кода, и к ним добавляется токен. Проверка `!res.ok` ловит все 4xx/5xx, а не только 500. Без базового URL и без `headers` в опциях обёртка теряет смысл. Обычно этих нескольких строк хватает вместо axios."
