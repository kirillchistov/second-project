  type: quiz
  options:
    - label: Входящие бинарные сообщения придут в `event.data` как ArrayBuffer, а не Blob — байты можно читать синхронно
      why: Верно. Это влияет только на представление входящих бинарных кадров. С Blob пришлось бы асинхронно читать данные через `arrayBuffer()` или FileReader.
    - label: Все исходящие сообщения, включая строки, будут отправляться как бинарные кадры
      why: "Неверно. Тип исходящего кадра определяется аргументом `send()`: строка уходит текстовым кадром, буфер — бинарным. `binaryType` на отправку не влияет."
    - label: Текстовые сообщения от сервера тоже начнут приходить как ArrayBuffer
      why: Неверно. Текстовые кадры всегда приходят строкой. Поэтому в `onmessage` обычно проверяют `instanceof ArrayBuffer`.
    - label: "Это согласование формата с сервером: без него сервер не сможет слать бинарные данные"
      why: Неверно. Свойство локальное и никуда не передаётся. Сервер может слать бинарные кадры при любом значении, меняется лишь их тип на клиенте.
  answer: 0
