  explanation: "Повтор POST без защиты может создать дубль: клиент не знает, выполнил ли сервер первый запрос. Ключ идемпотентности генерируют один раз на операцию, а не на попытку. Сервер хранит результат по этому ключу и на повтор возвращает его, не создавая заказ заново. Без такой защиты безопасно повторять только идемпотентные GET, PUT и DELETE."
