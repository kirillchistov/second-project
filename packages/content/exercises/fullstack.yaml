  explanation: "Для строкового тела fetch сам ставит `text/plain;charset=UTF-8`, а не JSON. Серверные JSON-парсеры смотрят на `Content-Type` и пропускают такое тело. Правило: для JSON-строки всегда явно указывайте `application/json`. Тип, соответствующий данным, браузер выводит сам только для FormData, URLSearchParams и Blob (если у Blob задан type)."
