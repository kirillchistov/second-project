  explanation: Очередь разделяет «принять запрос» и «выполнить работу». API отвечает 202, а воркер выполняет задачу с повторами. Пики сглаживаются, сбой внешнего сервиса не роняет запрос, воркеры масштабируются отдельно. Доставка обычно at-least-once, поэтому обработчик должен быть идемпотентным.
