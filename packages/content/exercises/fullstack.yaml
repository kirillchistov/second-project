# http-caching: принято из черновика 2026-10-13
- id: http-caching-no-cache-vs-no-store
  skill: http-cache-control-directives
  question: http-caching
  difficulty: 2
  prompt: "Чем `Cache-Control: no-cache` отличается от `no-store`?"
  explanation: "`no-cache` означает «храни, но перед использованием сверься с сервером». Обычно это условный запрос с ETag, и ответ `304` приходит без тела. `no-store` полностью запрещает сохранять ответ. Для HTML SPA подходит `no-cache`. `no-store` нужен только для действительно чувствительных данных."
  type: quiz
  options:
    - label: "`no-cache` разрешает хранить ответ, но требует сверки с сервером перед использованием; `no-store` запрещает сохранять его вовсе"
      why: Верно. При `no-cache` кэш шлёт условный запрос и при `304` берёт тело у себя. При `no-store` ответа в кэше просто нет.
    - label: "`no-cache` запрещает сохранять ответ где-либо, а `no-store` запрещает хранить его только на CDN и прокси"
      why: "Это типичная путаница: «не кэшировать» — это `no-store`. Запрет хранения в общих кэшах задаёт `private`."
    - label: "`no-cache` заставляет браузер каждый раз скачивать ответ целиком, а `no-store` позволяет взять его из кэша"
      why: С валидатором (ETag или Last-Modified) сервер ответит коротким `304`, и тело заново не передаётся. А `no-store` как раз ничего не хранит.
    - label: "Это синонимы: `no-store` оставлен для старых браузеров, современные понимают оба одинаково"
      why: "Синонимами они не являются. Директивы дают разное поведение: одна требует ревалидации, другая запрещает хранение."
  answer: 0
- id: http-caching-spa-index-html
  skill: http-cache-spa-strategy
  question: http-caching
  difficulty: 2
  prompt: "После деплоя SPA у части пользователей белый экран: старый `index.html` ссылается на удалённые чанки `app.3f9a1c.js`. Ассеты уже с хэшем и `immutable`. Какой `Cache-Control` поставить для `index.html`?"
  explanation: "Стратегия для SPA: ассеты с хэшем в имени кэшируются «навсегда» (`immutable`), а HTML всегда ревалидируется (`no-cache` + ETag). Новый деплой меняет HTML, HTML ссылается на новые имена файлов, и старые ассеты не мешают."
  type: choose-tool
  options:
    - label: "`no-cache` + `ETag`"
      why: Браузер хранит HTML, но каждый раз сверяется с сервером. Пока ничего не менялось, приходит быстрый `304`, а после деплоя сразу новая версия.
    - label: "`public, max-age=31536000, immutable`"
      why: Подходит для файлов с хэшем в имени. У `index.html` имя не меняется, поэтому пользователь застрянет на старой версии на год.
    - label: "`no-store`"
      why: Проблему тоже решит, но HTML будет скачиваться целиком при каждом заходе. Подходит для чувствительных данных, а не для публичного HTML.
    - label: "`public, s-maxage=3600`"
      why: CDN целый час будет отдавать старый HTML после деплоя. Годится для API каталога, где допустима устаревшая на минуты выдача.
