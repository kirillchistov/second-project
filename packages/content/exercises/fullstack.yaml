- id: websocket-auth-expired-reconnect
  skill: websocket-token-expiry
  question: websocket-auth
  difficulty: 2
  prompt: Сервер закрывает соединение кодом 4001, когда токен истёк. Клиент после этого бесконечно переподключается и снова получает 4001. Где ошибка?
  explanation: Код 4001 означает, что нужна переавторизация, а не просто переподключение. Замыкание держит старый токен, поэтому каждая попытка снова получает отказ. Сначала обновите токен, например `refreshToken().then(connect)`, и только потом подключайтесь.
  type: find-bug
  language: tsx
  code: |-
    function connect(token: string) {
      const ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'auth', token }));
      };
      ws.onclose = (e) => {
        if (e.code === 4001) {
          setTimeout(() => connect(token), 1000);
        }
      };
      return ws;
    }
  bugLines:
    - 8
  causes:
    - Переподключение идёт со старым, уже истёкшим токеном — сначала нужно получить новый
    - Токен нужно отправлять в onmessage, а не в onopen — до первого сообщения сервер не готов
    - Коды 4000–4999 зарезервированы протоколом, поэтому клиент получает не тот код
    - Старый сокет не закрыт, и новое соединение конфликтует с ним
