    - label: URL описывает ресурс существительным во множественном числе, действие задаёт HTTP-метод, результат — статус-код
      why: "Верно. Одна схема на весь API: зная ресурс, клиент угадывает URL, метод и коды ответов без чтения документации к каждому эндпоинту."
    - label: "Каждому действию — свой понятный URL: /getOrders, /createOrder, /deleteOrder"
      why: "Глагол в URL дублирует HTTP-метод. Имена становятся произвольными, и единообразие ломается: где-то /removeOrder, где-то /deleteItem."
    - label: Один эндпоинт POST /api с полем action в теле — так проще расширять
      why: Это RPC-стиль. Теряются кэширование GET, семантика и идемпотентность методов, а статус-коды ничего не говорят о результате.
    - label: Всегда отвечать 200, а успех или ошибку передавать полем в теле
      why: "Кэши, мониторинг и клиентские библиотеки сочтут ошибку успехом. Результат должен выражаться статус-кодом: 404, 409, 422 и т. д."
  answer: 0
- id: rest-api-feed-pagination
  skill: rest-pagination
  question: rest-api-design
  difficulty: 2
  prompt: Лента событий на миллионы записей, бесконечный скролл, новые события появляются каждую секунду. При подгрузке элементы не должны дублироваться или пропадать. Какую пагинацию выбрать?
  explanation: "Cursor-пагинация: курсор кодирует позицию последнего элемента (например, createdAt + id), сервер делает `WHERE (created_at, id) < cursor ORDER BY ... LIMIT n` по индексу. Это быстро на любой глубине и стабильно при вставках. Offset оставьте для небольших таблиц с номерами страниц."
  type: choose-tool
  options:
    - label: "Cursor: ?cursor=…&limit=20 → { items, nextCursor }"
      why: Запрос идёт от позиции последнего элемента по индексу — скорость не зависит от глубины, а новые записи не сдвигают уже загруженные страницы.
    - label: "Offset: ?page=3&limit=20"
      why: Хорош для админки с номерами страниц и небольших таблиц. Здесь OFFSET на глубоких страницах медленный, а вставки сдвигают окно — появятся дубли.
    - label: Отдать весь список и резать на клиенте
      why: Годится для десятков-сотен статичных записей. Миллионы событий — огромный ответ, память и трафик, а данные устаревают сразу после загрузки.
    - label: Параметр ?fields= для урезанных ответов
      why: Уменьшает размер каждого элемента, когда клиенту нужно мало полей, но не решает пагинацию и проблему сдвига при вставках.
  answer: 0
- id: rest-api-error-with-200
  skill: rest-status-codes
  question: rest-api-design
  difficulty: 1
  prompt: Route handler создаёт заказ. Найдите строку, из-за которой клиент и мониторинг неверно поймут результат.
  explanation: "`Response.json` по умолчанию отдаёт 200. Ошибка валидации с кодом 200 выглядит успехом для fetch-обёрток, TanStack Query, кэшей и алертов. Нужно `{ status: 422 }` и тело в едином формате, например Problem Details с перечнем полей: `errors: [{ field, message }]`."
  type: find-bug
  language: ts
  code: |-
    export async function POST(req: Request) {
      const body = await req.json();
      const parsed = OrderSchema.safeParse(body);
      if (!parsed.success) {
        return Response.json({ error: 'Invalid' });
      }
      const order = await createOrder(parsed.data);
      return Response.json(order, {
        status: 201,
        headers: {
          Location: `/api/v1/orders/${order.id}`,
        },
      });
    }
  bugLines:
    - 5
  causes:
    - Ошибка валидации уходит со статусом 200 по умолчанию — нужен 422 (или 400) и единый формат ошибки с полями
    - Для созданного ресурса нужно возвращать 200, а не 201
    - Заголовок Location обязан содержать абсолютный URL с доменом
    - Тело запроса нельзя читать через await req.json() в route handler
  answer: 0
- id: rest-api-etag-conflict-timeline
  skill: rest-optimistic-locking
  question: rest-api-design
  difficulty: 3
  prompt: Алиса и Борис одновременно редактируют заказ, API использует ETag + If-Match. Расставьте события по порядку.
  explanation: "Оптимистическая блокировка: клиент присылает версию, которую видел (If-Match). Если ресурс уже изменили, сервер отвечает 412 и не затирает чужую правку. Без этого сработал бы last write wins и изменения Бориса молча потерялись бы."
  type: order
  kind: timeline
  steps:
    - 'Оба загружают заказ: GET → 200, ETag: "v7"'
    - 'Борис отправляет PATCH с If-Match: "v7"'
    - 'Версии совпали: сервер сохраняет правку и отдаёт ETag: "v8"'
    - 'Алиса отправляет PATCH с If-Match: "v7"'
    - Сервер отвечает 412 Precondition Failed, правка не применена
    - Клиент Алисы перечитывает заказ и предлагает повторить правку

# web-storage: принято из черновика 2026-10-13
- id: web-storage-token-in-localstorage
  skill: web-storage-security
  question: web-storage
  difficulty: 1
  prompt: Команда хранит токен сессии в `localStorage`. Чем это хуже, чем `HttpOnly` cookie?
  explanation: "`localStorage` открыт любому JS того же origin, поэтому XSS превращается в кражу токена. `HttpOnly` cookie скрипт не прочитает, а браузер сам отправит её на сервер. От XSS это спасает не полностью: скрипт может слать запросы от имени пользователя. Ещё cookie нужно защищать от CSRF через `SameSite`."
  type: quiz
  options:
    - label: Любой скрипт на странице, в том числе внедрённый через XSS, прочитает токен и отправит его злоумышленнику
      why: "Верно. `localStorage` доступен всему JS этого origin. `HttpOnly` cookie из скрипта не прочитать: её видит только браузер при отправке запроса."
    - label: Содержимое localStorage уходит на сервер с каждым запросом, и токен можно перехватить
      why: Неверно. С запросами автоматически уходят только cookies. `localStorage` на сервер сам не попадает.
    - label: Токен пропадёт, как только пользователь закроет вкладку
      why: Так ведёт себя `sessionStorage`. Данные в `localStorage` хранятся бессрочно.
    - label: Токен смогут прочитать другие сайты, открытые в соседних вкладках
      why: Неверно. Storage изолирован по origin, чужой сайт его не видит. Опасен скрипт, который выполняется на вашей же странице.
  answer: 0
- id: web-storage-form-draft-choice
  skill: web-storage-choice
  question: web-storage
  difficulty: 1
  prompt: Длинная форма заявки. Черновик должен пережить случайную перезагрузку страницы, но не появляться в других вкладках и не оставаться после закрытия вкладки. Где его хранить?
  explanation: Выбирайте по времени жизни и по тому, кому нужны данные. Нужно на одну вкладку — `sessionStorage`. Нужно навсегда и во всех вкладках — `localStorage`. Нужно серверу — cookie. Большие или офлайн-данные — IndexedDB.
  type: choose-tool
  options:
    - label: sessionStorage
      why: Данные живут, пока открыта вкладка, и переживают перезагрузку. Каждая вкладка получает своё хранилище. Для небольшого черновика синхронного API хватает.
    - label: localStorage
      why: "Хранит бессрочно и общий для всех вкладок origin, поэтому черновик всплывёт в другой вкладке и после закрытия. Подходит для настроек UI: тема, свёрнутая панель."
    - label: IndexedDB
      why: Асинхронная база для больших объёмов и офлайн-кэша. Для текстового черновика это избыточно, и хранится она бессрочно — чистить пришлось бы вручную.
    - label: Cookie
      why: Уходит на сервер с каждым запросом и ограничена ~4 КБ. Её место — сессия и данные, которые нужны серверу, а не черновики UI.
  answer: 0
- id: web-storage-missing-stringify
  skill: web-storage-serialization
  question: web-storage
  difficulty: 1
  prompt: Приложение только клиентское, без SSR. Корзина вроде бы сохраняется, но после перезагрузки страница падает с SyntaxError в `JSON.parse`. Где ошибка?
  explanation: 'Storage хранит только строки и молча вызывает `String()` для любого значения. Массив объектов превращается в `"[object Object],[object Object]"`, и JSON из этого не разобрать. Правило: запись через `JSON.stringify`, чтение через `JSON.parse` в `try/catch`.'
  type: find-bug
  language: jsx
  code: |-
    function useCart() {
      const [items, setItems] = useState(() => {
        const raw = localStorage.getItem('cart');
        return raw ? JSON.parse(raw) : [];
      });
      useEffect(() => {
        localStorage.setItem('cart', items);
      }, [items]);
      return [items, setItems];
    }
  bugLines:
    - 7
  causes:
    - 'В `setItem` передан массив: он приводится к строке `"[object Object],..."`, и `JSON.parse` после перезагрузки падает'
    - "Читать `localStorage` в ленивом инициализаторе `useState` нельзя: значение потеряется"
    - В зависимостях эффекта не хватает `setItems`, поэтому запись срабатывает не всегда
    - "`JSON.parse` возвращает строку, поэтому `items` никогда не станет массивом"
  answer: 0
- id: web-storage-session-cookie-flags
  skill: session-cookie-flags
  question: web-storage
  difficulty: 2
  prompt: Route handler в Next.js ставит cookie сессии. Заполните пропуски так, чтобы скрипт не мог её прочитать, она шла только по HTTPS и отправлялась при переходе по ссылке с чужого сайта, но не с кросс-сайтовыми POST.
  explanation: "`httpOnly` прячет cookie от `document.cookie`, и XSS не может украсть токен. `secure` запрещает отправку по HTTP. `sameSite: 'lax'` — разумный дефолт: cookie уходит при навигации, но не с кросс-сайтовыми POST, что защищает от CSRF. `'strict'` сломал бы вход по внешней ссылке, `'none'` убрал бы защиту."
  type: fill-tokens
  language: ts
  code: |-
    export async function POST(req: Request) {
      const token = await createSession(req);
      const store = await cookies();
      store.set('session', token, {
        ___: true, // hidden from document.cookie
        ___: true, // HTTPS only
        sameSite: '___',
        maxAge: 60 * 60 * 24 * 7,
      });
      return Response.json({ ok: true });
    }
  tokens:
    - httpOnly
    - secure
    - lax
  decoys:
    - strict
    - none
    - readonly
    - private
