  prompt: Фронт на app.example.com вызывает `fetch('https://api.example.com/me')` без опций. Сессионная cookie (SameSite=Lax) до сервера не доходит. Почему?
  explanation: "Не путайте origin и site. Origin — это схема, хост и порт, поэтому поддомены считаются разными origin. Site — это регистрируемый домен, и поддомены одного домена — один site. По умолчанию fetch работает с `credentials: 'same-origin'`, и для другого origin cookie не уходит. Нужен `credentials: 'include'` плюс CORS-заголовки на сервере."
  type: quiz
  options:
    - label: "По умолчанию credentials: 'same-origin', а поддомен — другой origin, поэтому нужно явно указать credentials: 'include'"
      why: Верно. Origin = схема + хост + порт. app. и api. — разные хосты, значит запрос кросс-доменный и cookie без include не отправляется.
    - label: SameSite=Lax запрещает отправку cookie на другой поддомен, нужен SameSite=None
      why: Поддомены одного домена — это один site, так что Lax здесь не мешает. Проблема в режиме credentials у fetch.
    - label: Cookie ушла, но CORS не дал серверу её прочитать без Access-Control-Allow-Credentials
      why: CORS ограничивает доступ скрипта к ответу, а не то, что сервер видит в запросе. Здесь cookie не была отправлена вовсе.
    - label: fetch никогда не отправляет cookies по умолчанию, даже на тот же origin
      why: "Это поведение старых реализаций. Сейчас по умолчанию действует 'same-origin': на свой origin cookie уходят."
