- id: lifting-state-up-filters-in-url
  skill: url-state-choice
  question: lifting-state-up
  difficulty: 2
  prompt: Каталог с фильтрами и пагинацией. Нужно, чтобы фильтры сохранялись после перезагрузки, ссылкой с ними можно было поделиться, а кнопка «Назад» возвращала прошлый фильтр. Где хранить состояние?
  explanation: "Правило: если состояние должно пережить перезагрузку, попадать в ссылку и историю браузера, его место в URL. Поднятый state и Context подходят для временного UI-состояния. Внешний стор — для клиентских данных, нужных многим частям приложения."
  type: choose-tool
  options:
    - label: В search params URL (например, useSearchParams и router в Next.js)
      why: "Лучший вариант: URL переживает перезагрузку, им можно поделиться, а каждое изменение попадает в историю браузера, так что «Назад» работает само."
    - label: useState в общем предке фильтров и списка
      why: Подходит, если фильтры временные. Но после перезагрузки они сбросятся, в ссылку не попадут, а «Назад» уведёт со страницы.
    - label: React Context с фильтрами на уровне приложения
      why: Решает prop drilling, если фильтры нужны глубоко в дереве. Но он не сохраняет данные между перезагрузками и не связан с историей браузера.
    - label: Zustand с persist в localStorage
      why: Переживёт перезагрузку, но ссылкой не поделиться и «Назад» не сработает. Удобен для настроек пользователя вроде темы или свёрнутого сайдбара.
