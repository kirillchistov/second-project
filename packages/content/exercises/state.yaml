  explanation: "Серверное состояние в TanStack Query обычно не нормализуют: после мутации инвалидируют затронутые ключи, а для мгновенного отклика точечно правят кэш через setQueryData. Нормализованный стор оправдан, когда клиент — источник истины: редакторы, офлайн, real-time."
