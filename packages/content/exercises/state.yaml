      why: "Сработает, но держится на дисциплине: забудут один раз — и devtools уйдёт в прод. Подходит разве что для разового прототипа."
    - label: "Оставить как есть: расширение стоит только у разработчиков"
      why: "Довод неверный: расширение может поставить любой пользователь. Без явного enabled поведение зависит от настроек сборки и неочевидно."
    - label: Заменить devtools на console.log в `api.subscribe`
      why: Логи пригодятся для быстрой отладки, но пропадут time-travel и именованные actions. И логи тоже придётся отключать в production.
