  prompt: Компонент вызывает `useSelector((s) => s.todos.items.filter((t) => t.done))`. Почему он перерисовывается при любом dispatch, даже не связанном с todos?
  explanation: "useSelector перезапускает селектор после каждого dispatch и сравнивает результат с прошлым через ===. Вычисляемый селектор без мемоизации каждый раз отдаёт новую ссылку, и React-Redux считает это изменением. Правило: селектор, который создаёт массив или объект, оборачивай в createSelector."
  type: quiz
  options:
    - label: filter каждый раз возвращает новый массив, а useSelector сравнивает результат по === и видит «изменение»
      why: Верно. Данные те же, но ссылка новая, поэтому проверка === не проходит и компонент перерисовывается.
    - label: useSelector подписывает компонент на весь стор и перерисовывает его после любого action
      why: Селектор действительно вызывается после каждого action, но перерисовка будет, только если результат изменился по ===.
    - label: Стрелочная функция-селектор создаётся на каждом рендере, и useSelector из-за этого переподписывается
      why: "Новая функция-селектор сама по себе не страшна: React-Redux просто вызывает её. Проблема в том, что она возвращает новую ссылку."
    - label: Каждый action создаёт новую копию state.todos.items, потому что Redux иммутабелен
      why: Редьюсер копирует только изменённые ветки. Если todos не трогали, items сохраняет прежнюю ссылку.
  answer: 0
