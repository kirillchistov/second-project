  explanation: StrictMode в разработке намеренно прогоняет mount → cleanup → mount, чтобы проверить, что cleanup корректно отменяет эффект. Если после этого живёт ровно одно соединение — хук написан правильно. Чинить нужно, только если сокеты копятся, то есть cleanup отсутствует. В production двойного монтирования нет.
  type: quiz
  options:
    - label: "Это StrictMode: эффект монтируется, размонтируется и снова монтируется, cleanup закрыл первый сокет. В production так не будет"
      why: Верно. Это проверка того, что cleanup есть. Одно живое соединение после двойного монтирования — признак корректного хука.
    - label: "Это баг: нужно запомнить в ref, что сокет уже создан, и не открывать его повторно"
      why: "Такой флаг ломает логику: после cleanup первый сокет закрыт, а новый не создастся. Заодно он маскирует реальные проблемы с очисткой."
    - label: "Это утечка: сокет нужно создавать не в эффекте, а прямо в теле компонента"
      why: Тело компонента — это render, он должен быть чистым. Там сокет будет создаваться на каждый рендер, и закрыть его будет негде.
    - label: Браузер переподключился после неудачного handshake — на стороне React делать ничего не нужно
      why: WebSocket в браузере сам не переподключается. Второе соединение создал ваш код при повторном запуске эффекта.
