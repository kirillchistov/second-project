# rtk-query-reauth: принято из черновика 2026-11-07
- id: rtk-query-reauth-where
  skill: rtk-query-reauth-basequery
  question: rtk-query-reauth
  difficulty: 2
  prompt: Где в RTK Query правильно обработать истечение access-токена, чтобы запрос с ответом 401 прозрачно повторился с новым токеном?
  explanation: "Ответ сервера и возможность заново выполнить запрос есть только на уровне baseQuery. Поэтому `fetchBaseQuery` оборачивают своей функцией: при 401 она делает refresh, сохраняет токен через dispatch и повторяет исходный запрос. Если refresh не удался — явный `loggedOut`. `prepareHeaders` нужен только для подстановки токена."
  type: quiz
  options:
    - label: "Обернуть fetchBaseQuery своей baseQuery: поймать 401, сделать refresh, сохранить токен и повторить исходный запрос"
      why: Верно. Обёртка видит результат запроса и может вызвать raw baseQuery ещё раз, причём для всех эндпоинтов сразу.
    - label: В prepareHeaders проверять, истёк ли токен, и там же запускать refresh после ответа 401
      why: prepareHeaders вызывается до запроса и работает только с заголовками. Ответа сервера он не видит и повторить запрос не может.
    - label: В каждом эндпоинте через transformErrorResponse ловить 401 и обновлять токен
      why: transformErrorResponse только преобразует ошибку для кэша. Повторить запрос он не умеет, а логика разошлась бы по всем эндпоинтам.
    - label: Обернуть baseQuery в retry из RTK Query, чтобы 401 повторялся несколько раз
      why: retry повторяет запрос с тем же просроченным токеном. Без refresh каждый повтор снова получит 401.
  answer: 0
- id: rtk-query-reauth-retry-before-dispatch
  skill: rtk-query-reauth-basequery
  question: rtk-query-reauth
  difficulty: 2
  prompt: Refresh проходит успешно, но повторный запрос снова получает 401. `raw` — это fetchBaseQuery, а prepareHeaders берёт токен из state. Найдите ошибку.
  explanation: "prepareHeaders читает токен из store в момент каждого запроса. Здесь повтор отправляется до `tokenRefreshed`, поэтому уходит со старым токеном и снова получает 401. Правило: сначала сохранить новый токен через dispatch, потом повторять запрос."
  type: find-bug
  language: tsx
  code: |-
    const reauth: typeof raw = async (args, api, extra) => {
      let result = await raw(args, api, extra);
      if (result.error?.status === 401) {
        const r = await raw('/auth/refresh', api, extra);
        if (r.data) {
          result = await raw(args, api, extra);
          api.dispatch(tokenRefreshed(r.data));
        } else {
          api.dispatch(loggedOut());
        }
      }
      return result;
    };
  bugLines:
    - 6
    - 7
  causes:
    - Повтор отправляется до dispatch нового токена — prepareHeaders подставит старый токен
    - raw нельзя вызывать повторно с теми же args — RTK Query отменит дубликат
    - Refresh нужно вызывать через api.dispatch(endpoint.initiate()), иначе токен не сохранится
    - При неудачном refresh нужно вернуть r, а не result — из-за этого повтор и падает
  answer: 0
- id: rtk-query-reauth-mutex-branch
