# rtk-query-tags: принято из черновика 2026-11-07
- id: rtk-query-tags-invalidation-quiz
  skill: rtk-query-tag-invalidation
  question: rtk-query-tags
  difficulty: 2
  prompt: "Мутация с `invalidatesTags: [{ type: 'Todo', id: 'LIST' }]` успешно завершилась. Что сделает RTK Query?"
  explanation: Теги связывают мутации и запросы без прямых ссылок друг на друга. Запрос объявляет в `providesTags`, что он кеширует. Мутация объявляет в `invalidatesTags`, что она изменила. Совпали теги — запросы с активными подписками перезапрашиваются автоматически, и компоненту не нужно знать о мутации.
  type: quiz
  options:
    - label: Найдёт записи кэша, предоставившие этот тег в providesTags, и перезапросит те, на которые есть активные подписки
      why: Верно. Связь идёт только через совпадение тегов. Компонент со списком ничего не знает о мутации, но получит свежие данные.
    - label: Перезапросит все активные запросы этого api, раз данные на сервере изменились
      why: Нет. Перезапрашиваются только запросы с совпавшим тегом. Именно поэтому точные теги лучше одного общего тега на всё.
    - label: Положит ответ мутации в кэш списка, не делая нового запроса
      why: Нет. Это ручное обновление через `updateQueryData` (оптимистичное или пессимистичное). Инвалидация по тегам делает refetch.
    - label: Пометит список устаревшим, а перезапрос случится только при ручном refetch() или следующем монтировании
      why: Нет. Для запросов с активными подписками refetch запускается автоматически. Ручной `refetch()` как раз и не нужен.
  answer: 0
