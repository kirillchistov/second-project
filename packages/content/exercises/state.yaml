- id: state-management-zustand-no-selector
  skill: zustand-selectors
  question: state-management-choice
  difficulty: 2
  prompt: CartBadge перерисовывается при каждом открытии и закрытии панели корзины (toggle), хотя items не меняются. Найдите причину.
  explanation: "Вызов `useCart()` без селектора подписывает компонент на весь стор: любое изменение (здесь isOpen) создаёт новый объект состояния и вызывает перерисовку. Правило: всегда выбирайте нужный срез — `useCart((s) => s.items.length)`. Для нескольких полей подойдёт `useShallow`."
  type: find-bug
  language: tsx
  code: |-
    const useCart = create<CartStore>()((set) => ({
      items: [],
      isOpen: false,
      add: (item) =>
        set((s) => ({ items: [...s.items, item] })),
      toggle: () => set((s) => ({ isOpen: !s.isOpen })),
    }));

    function CartBadge() {
      const { items } = useCart();
      return <span>{items.length}</span>;
    }
  bugLines:
    - 10
  causes:
    - "Стор вызван без селектора: компонент подписан на всё состояние и перерисовывается при любом его изменении"
    - set должен возвращать полное состояние, иначе Zustand теряет items и пересоздаёт массив
    - toggle мутирует состояние напрямую, поэтому Zustand не может сравнить старое и новое значение
