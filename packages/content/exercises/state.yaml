  explanation: "Подвисшее соединение бывает «открытым» долго: ОС и TCP могут узнать о разрыве лишь через минуты. Надёжнее всего прикладной heartbeat: клиент шлёт ping по интервалу и ждёт pong с таймаутом. Нет ответа — закрываем сокет сами и запускаем обычный реконнект с resume."
