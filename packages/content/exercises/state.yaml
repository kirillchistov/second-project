- id: redux-selectors-shared-derived-list
  skill: derived-state-choice
  question: redux-selectors-reselect
  difficulty: 2
  prompt: Отфильтрованный и отсортированный список просроченных задач (тысячи элементов) нужен в трёх компонентах. Он же служит входом для счётчика в шапке. Стор часто меняется из-за несвязанных событий. Что выбрать?
  explanation: Производные данные из Redux храни как мемоизированные селекторы на уровне модуля. Так получается один кэш на всё приложение, пересчёт только при смене входов и композиция с другими селекторами. useMemo — локальная оптимизация одного компонента, а shallowEqual лишь отсекает лишние рендеры.
  type: choose-tool
  options:
    - label: createSelector на уровне модуля
      why: Один кэш на всех потребителей. Сортировка выполняется, только когда меняются items, а селектор можно использовать как вход для селектора счётчика.
    - label: useMemo в каждом компоненте над items из useSelector
      why: Годится для одного компонента. Здесь каждый экземпляр сортировал бы отдельно, а переиспользовать результат в других селекторах нельзя.
    - label: useSelector с shallowEqual вторым аргументом
      why: Поэлементное сравнение отсечёт лишние рендеры, но фильтр и сортировка тысяч элементов всё равно выполнятся после каждого dispatch.
    - label: Хранить готовый список в сторе и обновлять в редьюсерах
      why: "Это дублирование источника истины: копию придётся синхронизировать во всех редьюсерах. Оправдано разве что для очень дорогих вычислений с редкими изменениями."
