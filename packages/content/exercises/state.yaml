# websocket-reconnect: принято из черновика 2026-11-07
- id: websocket-reconnect-lost-messages
  skill: websocket-message-recovery
  question: websocket-reconnect
  difficulty: 2
  prompt: "Чат на WebSocket: соединение пропало на 20 секунд, затем клиент переподключился с backoff. Что случилось с сообщениями, которые сервер отправил за это время?"
  explanation: WebSocket — это транспорт, а гарантии доставки задаёт протокол поверх него. Реконнект открывает **новое** соединение, в котором старых сообщений нет. Чтобы их не потерять, клиент хранит id или cursor последнего события и после реконнекта запрашивает у сервера всё, что было `since` этого места. Сервер должен хранить историю.
  type: quiz
  options:
    - label: "Они потеряны, если протокол не умеет догружать: после реконнекта клиент должен запросить у сервера события since последнего cursor"
      why: "Верно. Реконнект восстанавливает только транспорт. Пропущенное возвращает отдельный механизм: история на сервере и запрос по since/cursor."
    - label: Браузер буферизует входящие сообщения и отдаст их в onmessage после переподключения
      why: Браузер ничего не копит между соединениями. bufferedAmount относится к исходящим данным открытого сокета, а новый WebSocket — это новое соединение.
    - label: TCP гарантирует доставку, поэтому сервер дошлёт их в новое соединение
      why: Гарантии TCP действуют только в пределах одного соединения. Когда оно оборвалось, неотправленные данные пропадают вместе с ним.
    - label: "Их вернёт heartbeat: на ping сервер отвечает pong с пропущенными сообщениями"
      why: Heartbeat только проверяет, что соединение живо. Сообщения он не переносит, но помогает быстрее заметить разрыв.
  answer: 0
- id: websocket-reconnect-after-unmount
  skill: websocket-reconnect-lifecycle
  question: websocket-reconnect
  difficulty: 2
  prompt: Эффект внутри хука держит WebSocket. После ухода со страницы в Network продолжают появляться новые подключения. Найдите строки с ошибкой.
  explanation: "`ws.close()` в cleanup генерирует событие close. `onclose` не отличает намеренное закрытие от разрыва и безусловно планирует реконнект уже после размонтирования. Исправление: в cleanup выставить флаг `disposed = true` и вызвать `clearTimeout` для запланированного таймера, а в onclose не планировать реконнект, если `disposed`."
  type: find-bug
  language: tsx
  code: |-
    useEffect(() => {
      let ws: WebSocket;
      const open = (attempt: number) => {
        ws = new WebSocket(url);
        ws.onopen = () => { attempt = 0; };
        ws.onmessage = (e) => onMsg(JSON.parse(e.data));
        ws.onclose = () => {
          const delay = Math.min(1000 * 2 ** attempt, 30000);
          setTimeout(() => open(attempt + 1), delay);
        };
      };
      open(0);
      return () => ws.close();
    }, [url]);
  bugLines:
    - 9
    - 13
  causes:
    - close() в cleanup вызывает onclose, и тот планирует реконнект после размонтирования; нужен флаг disposed и clearTimeout
    - attempt = 0 в onopen не влияет на onclose, поэтому задержка растёт бесконечно и соединения копятся
    - url в массиве зависимостей вызывает бесконечный цикл переподключений
    - Обработчики нужно назначать через addEventListener, иначе при реконнекте они дублируются
  answer: 0
- id: websocket-resume-recipe
