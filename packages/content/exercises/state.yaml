# rtk-query-polling: принято из черновика 2026-11-07
- id: rtk-query-polling-unsubscribe
  skill: rtk-query-polling-lifecycle
  question: rtk-query-polling
  difficulty: 2
  prompt: "Экран котировок использует `useGetPricesQuery(undefined, { pollingInterval: 5000 })`. Пользователь ушёл на другой экран, и все компоненты с этим хуком размонтировались. Что будет с опросом?"
  explanation: "Polling в RTK Query привязан к подписке: пока есть хотя бы один подписанный компонент, запрос повторяется, а без подписчиков опрос прекращается. Сами данные остаются в кэше ещё keepUnusedDataFor секунд (по умолчанию 60). Ручной setInterval поверх не нужен: он только дублирует логику и может пережить компонент."
  type: quiz
  options:
    - label: "Опрос остановится сам: подписчиков не осталось. Данные ещё полежат в кэше keepUnusedDataFor секунд"
      why: Верно. Хук отписывается при размонтировании, а polling живёт только при активной подписке. Удаление кэша идёт по отдельному таймеру keepUnusedDataFor.
    - label: Опрос продолжится в middleware, пока не вызвать api.util.resetApiState()
      why: RTK Query не держит фоновые запросы для данных, которые никто не показывает. resetApiState сбрасывает весь кэш, а не останавливает опрос.
    - label: Запросы будут идти ещё keepUnusedDataFor секунд (60 по умолчанию), а потом прекратятся вместе с удалением кэша
      why: Здесь смешаны две вещи. keepUnusedDataFor определяет, сколько хранятся неиспользуемые данные. Опрос прекращается сразу, как исчезла подписка.
    - label: Нужно в useEffect вернуть cleanup, который остановит интервал, иначе опрос продолжится
      why: Это типичная лишняя «ручная очистка». Хук сам отписывается при размонтировании, и интервала, который надо чистить, у компонента нет.
  answer: 0
- id: rtk-query-polling-setup-tokens
  skill: rtk-query-refetch-options
  question: rtk-query-polling
  difficulty: 2
  prompt: "Допишите код: refetchOnFocus должен реально срабатывать, цены опрашиваются каждые 5 с, а пока вкладка скрыта, запросов нет."
  explanation: "refetchOnFocus и refetchOnReconnect работают только после `setupListeners(store.dispatch)`: эта функция подписывается на события focus, visibilitychange и online. Опрос включает `pollingInterval`. `skip: true` снимает подписку, поэтому опрос тоже останавливается. refetchInterval и enabled — это опции TanStack Query, в RTK Query их нет."
  type: fill-tokens
  language: tsx
  code: |-
    export const store = configureStore({
      reducer: { [api.reducerPath]: api.reducer },
      middleware: (getDefault) =>
        getDefault().concat(api.middleware),
    });
    ___(store.dispatch);

    // Prices.tsx
    const { data } = useGetPricesQuery(undefined, {
      ___: 5000,
      refetchOnFocus: true,
      ___: !isTabVisible,
    });
  tokens:
    - setupListeners
    - pollingInterval
    - skip
  decoys:
    - refetchInterval
    - enabled
    - keepUnusedDataFor
    - setupPolling
- id: rtk-query-polling-unread-counter
  skill: rtk-query-polling-vs-realtime
  question: rtk-query-polling
  difficulty: 2
  prompt: "В проекте уже есть RTK Query. Нужен счётчик непрочитанных уведомлений в шапке: задержка до 30–60 с допустима, WebSocket-инфраструктуры на бэкенде нет. Что выбрать?"
  explanation: "Правило выбора: «почти-реалтайм» с допустимой задержкой — pollingInterval (плюс refetchOnFocus). Частые обновления и важна задержка — стрим через WebSocket в onCacheEntryAdded. Ручной таймер поверх RTK Query — антипаттерн."
  type: choose-tool
  options:
    - label: "pollingInterval: 30000 + refetchOnFocus в хуке запроса"
      why: Лучший выбор. Опрос из коробки, сам останавливается без подписчиков, а при возврате на вкладку данные сразу обновятся. Бэкенд менять не нужно.
    - label: WebSocket и updateCachedData в onCacheEntryAdded
      why: "Подходит для котировок или чата, где важна каждая секунда и есть сокет-сервер. Здесь это избыточно: нужна новая инфраструктура ради счётчика."
    - label: useEffect с setInterval(refetch, 30000)
      why: Дублирует то, что уже есть в RTK Query, требует ручной очистки и легко переживает компонент. Оправдан разве что без библиотеки данных.
    - label: Только refetchOnFocus без опроса
      why: Подходит для данных, которые редко меняются. Если вкладка долго открыта и в фокусе, счётчик не обновится вовсе.
  answer: 0

# rtk-query-transform-select: принято из черновика 2026-11-07
- id: rtk-query-transform-vs-select
  skill: rtk-query-transform-vs-select
  question: rtk-query-transform-select
  difficulty: 2
  prompt: Чем `transformResponse` в эндпоинте отличается от `selectFromResult` в хуке RTK Query?
  explanation: "`transformResponse` решает, какая форма данных лежит в кэше для всех потребителей. Срабатывает один раз на ответ. `selectFromResult` — это клиентская выборка для конкретного хука. Она определяет, от каких изменений перерисуется компонент. Правило: нормализуй форму в эндпоинте, а выбирай нужную часть в компоненте."
  type: quiz
  options:
    - label: transformResponse меняет ответ один раз до записи в кэш, selectFromResult выбирает часть кэша для конкретного компонента
      why: Верно. Первый формирует общий кэш для всех подписчиков. Второй работает на клиенте и сокращает подписку компонента до нужных полей, чтобы не было лишних перерисовок.
    - label: Оба выполняются на каждом рендере компонента, разница только в том, где записан код
      why: transformResponse вызывается только при получении ответа сервера, а не при рендере. Его результат один раз записывается в кэш.
    - label: transformResponse вызывается отдельно для каждого хука, поэтому каждый компонент может получить свою форму данных
      why: transformResponse описан в эндпоинте и срабатывает один раз на ответ. Все компоненты видят один и тот же преобразованный результат из кэша.
    - label: selectFromResult перезаписывает данные в кэше, и другие компоненты тоже видят только выбранную часть
      why: "selectFromResult ничего не пишет в кэш: он лишь возвращает производное значение одному хуку. Остальные подписчики видят полный результат."
  answer: 0
- id: rtk-query-transform-select-fill
  skill: rtk-query-transform-vs-select
  question: rtk-query-transform-select
