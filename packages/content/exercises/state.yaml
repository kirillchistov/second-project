  explanation: "`createApi` — декларативное описание эндпоинтов: `query` для чтения, `mutation` для изменений. Из него генерируются хуки, а кэш, статусы, дедупликация и инвалидация по тегам работают через `api.reducer` и `api.middleware` в общем Redux store."
  type: quiz
  options:
    - label: Декларативно описывает эндпоинты, генерирует хуки и берёт на себя кэш, статусы загрузки и дедупликацию запросов
      why: "Верно. Не нужно вручную хранить isLoading/error и данные: всё лежит в кэше в store, а хуки на него подписываются."
    - label: Генерирует хуки-обёртки над fetch, но кэш и статусы нужно хранить в своём slice
      why: Кэш и статусы RTK Query хранит сам в `api.reducer`. Писать свой slice для этих же данных — дублирование.
    - label: "Работает отдельно от Redux: подключать api к configureStore не обязательно"
      why: RTK Query построен на Redux. Без `api.reducer` и `api.middleware` в store хуки не будут корректно работать.
    - label: "query и mutation отличаются только HTTP-методом: query — GET, mutation — POST/PUT/DELETE"
      why: "Различие в семантике: query кешируется и подписывается на данные, mutation запускается вручную и инвалидирует теги. query может использовать и POST."
