- id: rtk-query-shared-mutation-status
  skill: rtk-query-shared-mutation-state
  question: rtk-query-mutations
  difficulty: 3
  prompt: Форма запускает мутацию `saveDraft`. Индикатор «Сохраняется…» и текст ошибки нужно показать в шапке, которая находится в другой ветке дерева. Что выбрать?
  explanation: "По умолчанию у каждого вызова хука мутации своё состояние: оно отражает только запуски через его собственный триггер. `fixedCacheKey` связывает вызовы хука с одной записью в кэше мутаций, и все компоненты видят общие `isLoading`, `data` и `error`. Свой стейт заводите, только если RTK Query этот статус не хранит."
  type: choose-tool
  options:
    - label: Одинаковый `fixedCacheKey` в `useSaveDraftMutation` в форме и в шапке
      why: Оба вызова хука читают одну запись кэша мутации, поэтому шапка видит статус запуска из формы без проброса пропсов и без своего стейта.
    - label: Вызвать `useSaveDraftMutation()` без опций в обоих компонентах
      why: У каждого вызова своё состояние, и шапка не узнает о запуске из формы. Такой вариант подходит, когда статус нужен только там, где мутацию запускают.
    - label: Свой `isSaving` в `useState` и проброс через Context
      why: Дублирует то, что RTK Query уже хранит, и легко рассинхронизируется. Оправдан, если статус объединяет несколько разных запросов или не-RTK логику.
    - label: Слайс с `extraReducers` на `matchPending`/`matchFulfilled` эндпоинта
      why: Работает, но требует много шаблонного кода. Подходит, если на мутацию должен реагировать другой редьюсер, а не только UI.
