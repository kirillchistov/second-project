# redux-devtools: принято из черновика 2026-11-07
- id: redux-devtools-time-travel-why
  skill: redux-time-travel-purity
  question: redux-devtools
  difficulty: 2
  prompt: Почему Redux DevTools может «отмотать» стор к любому прошлому action и показать diff после каждого?
  explanation: "Time-travel опирается на два правила Redux: reducer — чистая функция, а состояние не мутируется. Тогда initialState + список actions однозначно задают любое промежуточное состояние. Мутация в reducer ломает diff и перемотку, потому что «прошлые» состояния указывают на тот же изменённый объект."
  type: quiz
  options:
    - label: "Reducer чистый, состояние неизменяемо: из начального state и списка actions можно заново вычислить любое промежуточное состояние"
      why: Верно. Детерминированный reducer + иммутабельные снимки позволяют пересчитать или показать любой шаг истории.
    - label: После каждого action DevTools сохраняет снимок DOM и дерева компонентов и при перемотке восстанавливает его
      why: DevTools работает со стором, а не с DOM. UI просто перерисовывается из восстановленного состояния через подписки.
    - label: Для каждого action DevTools записывает обратную операцию и при перемотке выполняет их в обратном порядке
      why: В Redux нет обратных actions. Перемотка — это не undo, а выбор или пересчёт состояния из истории.
    - label: Расширение перехватывает любые изменения состояния в браузере, поэтому способ обновления state не важен
      why: "Важен: DevTools видит только dispatch через стор. Мутации в обход reducer или внутри него история не отразит корректно."
  answer: 0
- id: redux-devtools-mutating-reducer
  skill: redux-reducer-immutability
