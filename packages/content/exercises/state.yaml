      why: Подходит для временного значения, которое не сохраняют и не сравнивают. Здесь нужна персистентность, а Date после JSON станет строкой.
    - label: Хранить Date в React Context рядом со store
      why: Разносит одни и те же данные заказа по двум источникам. Context не решает ни сортировку, ни сохранение, а синхронизировать их придётся вручную.
  answer: 0

# rtk-entity-adapter: принято из черновика 2026-11-07
- id: rtk-entity-adapter-purpose
  skill: rtk-entity-adapter
  question: rtk-entity-adapter
  difficulty: 2
  prompt: Зачем в Redux Toolkit нужен `createEntityAdapter`?
  explanation: "Адаптер — это нормализация «словарь по id» без boilerplate: формат `{ ids, entities }`, готовые CRUD-редьюсеры, мемоизированные селекторы и опциональная сортировка через `sortComparer`. Серверный кэш — задача RTK Query, мутабельный синтаксис — Immer."
  type: quiz
  options:
    - label: Хранит коллекцию нормализованно в `{ ids, entities }` и даёт готовые CRUD-редьюсеры и мемоизированные селекторы
      why: "Верно. Не нужно вручную писать addOne/updateOne/removeOne и поиск по id: обновление по id за O(1), а selectAll не создаёт новый массив без изменений."
    - label: Кэширует данные с сервера, дедуплицирует запросы и сам делает рефетч при фокусе
      why: Это RTK Query. Адаптер ничего не знает о сети, он лишь описывает форму state и операции над ней. Внутри RTK Query его можно использовать для нормализации.
    - label: Позволяет «мутировать» state в редьюсерах, сохраняя иммутабельность
      why: Это делает Immer внутри createSlice. Методы адаптера тоже работают через Immer, но их главная ценность не в этом.
    - label: Заменяет createSlice и генерирует слайс с экшенами целиком
      why: Адаптер даёт функции-редьюсеры, initialState и селекторы, а слайс вы всё равно создаёте через createSlice и сами решаете, какие экшены завести.
  answer: 0
- id: rtk-entity-adapter-manual-entities
  skill: rtk-entity-adapter
  question: rtk-entity-adapter
  difficulty: 2
  prompt: После `dispatch(added(todo))` новая задача не появляется в `selectAll`. Найдите ошибку.
  explanation: "Нормализованный state — это две согласованные структуры: `ids` задаёт состав и порядок, `entities` хранит данные. `selectAll` строит массив по ids, поэтому запись только в entities не видна. Используйте `todosAdapter.addOne`: он обновит обе структуры и учтёт sortComparer."
  type: find-bug
