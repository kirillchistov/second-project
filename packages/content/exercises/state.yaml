# rtk-query-mutations: принято из черновика 2026-11-07
- id: rtk-query-mutation-await-result
  skill: rtk-query-mutation-unwrap
  question: rtk-query-mutations
  difficulty: 2
  prompt: Сервер ответил 500 на `await addTodo(title)` (без `.unwrap()`) внутри `try/catch`. Что произойдёт?
  explanation: "Промис триггера мутации в RTK Query по умолчанию всегда резолвится объектом `{ data }` или `{ error }`. Так забытый `catch` не превращается в unhandled rejection. Если логика строится на `try/catch` (закрыть модалку только после успеха), вызывайте `.unwrap()`: он вернёт `data` или выбросит ошибку."
  type: quiz
  options:
    - label: Промис резолвится объектом `{ error }`, `catch` не сработает, код после `await` продолжит выполняться
      why: Верно. Триггер не реджектится при ошибке запроса, ошибка лежит в результате и в `error` состояния хука.
    - label: Промис реджектится, сработает `catch`, а `error` в состоянии хука останется пустым
      why: "Промис реджектится только при `.unwrap()`. Состояние хука при этом всё равно получит error: оно не зависит от способа обработки промиса."
    - label: "`await` вернёт `undefined`, ошибку можно узнать только из `error` хука"
      why: "Результат не пустой: в нём есть поле `error` с ошибкой baseQuery, например `{ status: 500, data }`."
    - label: Возникнет unhandled rejection, потому что `catch` не перехватывает ошибки RTK Query
      why: "Наоборот: промис специально не реджектится, чтобы необработанных исключений не было. С `.unwrap()` обычный `catch` их ловит."
  answer: 0
- id: rtk-query-mutation-missing-unwrap
  skill: rtk-query-mutation-unwrap
  question: rtk-query-mutations
  difficulty: 2
  prompt: Модалка закрывается, даже когда сервер вернул ошибку, а toast не показывается. Найдите строку с ошибкой.
  explanation: "Без `.unwrap()` промис триггера резолвится объектом `{ error }`, поэтому `close()` выполняется всегда, а `catch` не вызывается никогда. Исправление: `await updateTodo({ ... }).unwrap()`. Правило: если после мутации есть ветвление «успех/ошибка» через `try/catch`, нужен `.unwrap()`."
  type: find-bug
  language: tsx
  code: |-
    function EditTodoModal({ todo, close }: Props) {
      const [updateTodo, { isLoading }] =
        useUpdateTodoMutation();

      async function save(title: string) {
        try {
          await updateTodo({ id: todo.id, title });
          close();
        } catch {
          toast.error('Save failed');
        }
      }
      return <TodoForm onSubmit={save} busy={isLoading} />;
    }
  bugLines:
    - 7
  causes:
    - "Триггер без `.unwrap()` резолвится и при ошибке: `close()` вызовется, а `catch` не сработает"
    - "`isLoading` нельзя брать из кортежа мутации, для этого нужен свой `useState`"
    - Триггер мутации можно вызывать только внутри `useEffect`, а не в обработчике
    - "Аргументы нужно передавать позиционно: `updateTodo(todo.id, title)`"
