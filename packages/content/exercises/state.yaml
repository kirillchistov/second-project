# websocket-basics: принято из черновика 2026-11-07
- id: websocket-vs-http-core
  skill: websocket-vs-http
  question: websocket-basics
  difficulty: 1
  prompt: Чем WebSocket принципиально отличается от обычного HTTP-запроса через fetch?
  explanation: "HTTP — это пары «запрос → ответ», и инициатор всегда клиент. WebSocket стартует как HTTP-запрос с `Upgrade: websocket`, а затем остаётся открытым TCP-каналом: обе стороны шлют сообщения когда угодно. Поэтому он нужен, когда сервер сам инициирует события: чат, котировки, совместное редактирование."
  type: quiz
  options:
    - label: После рукопожатия через HTTP Upgrade соединение остаётся открытым, и сервер может слать сообщения сам, без запроса клиента
      why: "Верно. Главное отличие — долгоживущий двусторонний канал: сообщения идут в обе стороны без нового запроса на каждое."
    - label: "Это облегчённый fetch: каждый send открывает короткое соединение, но без HTTP-заголовков"
      why: Нет. Соединение открывается один раз при рукопожатии, а все send идут по нему же. Новое соединение на сообщение — это как раз модель HTTP.
    - label: WebSocket работает поверх UDP, поэтому быстрее HTTP и может терять сообщения
      why: "Нет. WebSocket работает поверх TCP, как и HTTP/1.1: порядок и доставка гарантированы. Выигрыш — в отсутствии нового запроса на каждое сообщение."
    - label: Сервер может писать клиенту в любой момент, но клиент отправляет данные только обычными HTTP-запросами
      why: "Это описание Server-Sent Events: там канал односторонний (сервер → клиент). В WebSocket клиент тоже шлёт сообщения по тому же соединению."
  answer: 0
- id: websocket-overkill-report-status
  skill: realtime-transport-choice
  question: websocket-basics
  difficulty: 2
  prompt: В админке нужно показывать статус ночной генерации отчёта. Статус меняется раз в несколько минут, задержка в 30–60 секунд не критична. Что выбрать?
  explanation: "Правило: постоянное соединение оправдано, когда событий много и задержка важна. Двусторонний частый обмен — WebSocket, односторонний поток от сервера — SSE, редкие изменения без жёстких требований к задержке — обычный polling. Лишний сокет — это сложность и на клиенте, и на сервере."
  type: choose-tool
  options:
    - label: "Polling: useQuery с refetchInterval"
      why: "Лучший выбор: изменения редкие, задержка не важна. Один GET раз в 30 секунд проще поддерживать, а кэш и обработка ошибок уже есть."
    - label: WebSocket с подпиской на статус
      why: Подошёл бы для частого двустороннего обмена (чат, совместное редактирование). Здесь это лишняя инфраструктура, переподключения и состояние на сервере.
    - label: Server-Sent Events
      why: Хорош для частого одностороннего потока сервер → клиент (лента событий, прогресс). Для пары изменений за ночь держать открытый канал избыточно.
    - label: Long polling
      why: Компромисс, когда push нужен, а WebSocket/SSE недоступны. Требует поддержки на сервере и не нужен там, где хватает простого опроса.
  answer: 0
- id: websocket-effect-no-cleanup
  skill: websocket-effect-cleanup
  question: websocket-basics
  difficulty: 1
  prompt: Пользователь переключает комнаты чата. Через какое-то время сообщения начинают дублироваться и приходят из чужих комнат. Где ошибка?
  explanation: "Эффект открывает сокет, но не возвращает cleanup. При смене roomId старый WebSocket остаётся открытым и продолжает вызывать setMsgs, а при размонтировании сокеты утекают. Правило: кто открыл соединение в эффекте, тот закрывает его в cleanup — `return () => ws.close();`."
  type: find-bug
  language: tsx
  code: |-
    function Chat({ roomId }: { roomId: string }) {
      const [msgs, setMsgs] = useState<string[]>([]);
      useEffect(() => {
        const ws = new WebSocket(`wss://x.io/${roomId}`);
        ws.onmessage = (e) =>
          setMsgs((m) => [...m, e.data]);
      }, [roomId]);
      return <MessageList items={msgs} />;
    }
  bugLines:
    - 7
  causes:
    - "Эффект не возвращает cleanup с ws.close(): старые сокеты остаются открытыми и продолжают дописывать сообщения"
    - Функциональный апдейтер в setMsgs теряет сообщения — нужно писать setMsgs([...msgs, e.data])
    - WebSocket нужно создавать в теле компонента, а не в эффекте, чтобы он был доступен в JSX
    - roomId не должен быть в зависимостях, иначе сокет пересоздаётся — нужен пустой массив
  answer: 0
- id: websocket-reconnect-recipe
  skill: websocket-reconnect
  question: websocket-basics
  difficulty: 2
  prompt: Расставьте шаги переподключения к WebSocket после разрыва связи так, чтобы не потерять сообщения и не завалить сервер.
  explanation: Экспоненциальная задержка с джиттером не даёт тысячам клиентов одновременно ломиться на сервер после сбоя. Намеренное закрытие (размонтирование) нельзя путать с разрывом, иначе сокет оживёт после ухода со страницы. Последний id нужен, чтобы догрузить пропущенное.
  type: order
  kind: recipe
  steps:
    - В onmessage запоминать id последнего полученного сообщения
    - В onclose проверить, что закрытие не намеренное (не размонтирование и не ws.close())
    - "Посчитать задержку: экспонента от числа попыток, с потолком и джиттером"
    - По таймеру создать новый WebSocket и навесить те же обработчики
    - В onopen сбросить счётчик попыток и заново отправить join с последним id

# why-redux: принято из черновика 2026-11-07
- id: why-redux-purpose
  skill: redux-purpose
  question: why-redux
  difficulty: 1
  prompt: Какую задачу решает Redux, которую `useState` и `Context` сами по себе не решают?
  explanation: "`useState` хранит локальное состояние, Context только передаёт значение вниз. Redux даёт единое хранилище, переходы action → reducer, подписку через селекторы и трассировку изменений в DevTools. Он оправдан, когда клиентское состояние общее для многих несвязанных частей и важно понимать, кто и почему его поменял."
  type: quiz
  options:
    - label: Единое место для логики изменений, предсказуемые переходы action → reducer, селекторы и трассировка в DevTools
      why: Верно. Этих гарантий нет ни у useState, ни у Context. Context + useReducer даёт лишь ручную мини-версию без middleware и DevTools.
    - label: "Избавляет от prop drilling: Context не умеет передавать значение глубоко в дерево"
      why: Неверно. Context как раз и решает prop drilling. Он не решает хранение, изменение и выборочную подписку.
