- id: server-list-with-cache
  type: choose-tool
  skill: server-state-choice
  question: state-management-choice
  prompt: >-
    Список заказов с сервера: при возврате на экран сразу показать закешированные данные,
    обновлять при фокусе вкладки и после создания нового заказа. Что выбрать?
  options:
    - label: TanStack Query
      why: Это серверное состояние — кэш, фоновое обновление, refetch при фокусе и инвалидация после мутации есть из коробки.
    - label: useEffect + useState
      why: Кэш между экранами, гонки запросов, повторы и обновление при фокусе придётся писать вручную.
    - label: Слайс Redux Toolkit
      why: Подходит для клиентского состояния; кэш серверных данных пришлось бы делать самому (или брать RTK Query).
    - label: React Context
      why: Context передаёт значение, но не кеширует и не обновляет данные, а любое изменение перерисует всех потребителей.
  answer: 0
  explanation: >-
    Правило выбора: серверное состояние (принадлежит серверу, может устареть) — TanStack Query, SWR или RTK Query;
    клиентское — useState, Zustand или Redux; URL-состояние — в адресе.
