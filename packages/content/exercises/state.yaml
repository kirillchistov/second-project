  explanation: "RTK Query и createSlice решают разные задачи и спокойно живут в одном store. Серверные данные (кэш, загрузка, инвалидация) — RTK Query. Клиентское UI-состояние (модалка, фильтр, черновик) — slice или useState. Главное правило: у каждого куска состояния ровно один источник истины."
