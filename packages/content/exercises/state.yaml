- id: server-list-with-cache
  type: choose-tool
  skill: server-state-choice
  question: state-management-choice
  prompt: >-
    Список заказов с сервера: при возврате на экран сразу показать закешированные данные,
    обновлять при фокусе вкладки и после создания нового заказа. Что выбрать?
  options:
    - label: TanStack Query
      why: Это серверное состояние — кэш, фоновое обновление, refetch при фокусе и инвалидация после мутации есть из коробки.
    - label: useEffect + useState
      why: Кэш между экранами, гонки запросов, повторы и обновление при фокусе придётся писать вручную.
    - label: Слайс Redux Toolkit
      why: Подходит для клиентского состояния; кэш серверных данных пришлось бы делать самому (или брать RTK Query).
    - label: React Context
      why: Context передаёт значение, но не кеширует и не обновляет данные, а любое изменение перерисует всех потребителей.
  answer: 0
  explanation: >-
    Правило выбора: серверное состояние (принадлежит серверу, может устареть) — TanStack Query, SWR или RTK Query;
    клиентское — useState, Zustand или Redux; URL-состояние — в адресе.

# context-selectors: принято из черновика 2026-10-11
- id: context-selectors-quiz
  skill: context-rerender-avoidance
  question: context-selectors
  difficulty: 3
  prompt: Как стор в контексте с подпиской через `useSyncExternalStore` и селектором избавляет от лишних рендеров, которые даёт обычный Context?
  explanation: "Context не умеет в селекторы: любое новое value перерисует всех потребителей. Поэтому в контекст кладут стабильную ссылку на стор, а подписку на нужный срез делают через `useSyncExternalStore`. По этому принципу устроены Zustand, Redux и Jotai."
  type: quiz
  options:
    - label: Ссылка на стор в контексте не меняется, а компонент перерисуется, только если селектор вернул новое значение (сравнение через Object.is)
      why: Верно. Контекст больше не меняется, и обновления идут по подписке subscribe. React сравнивает снапшоты и рендерит только тех, у кого изменился срез.
    - label: Достаточно обернуть value провайдера в useMemo — потребители перестанут рендериться при изменении части данных
      why: useMemo спасает только от нового объекта при рендере родителя. Когда меняются сами данные, value всё равно новое, и перерисуются все потребители.
    - label: Можно оставить обычный Context и обернуть потребителей в React.memo — тогда они пропустят лишние обновления
      why: memo сравнивает props, но не блокирует обновление по useContext. Компонент, читающий контекст, перерисуется при любом новом value.
    - label: "С React Compiler это не нужно: он сам мемоизирует потребителей и отсекает рендеры от неиспользуемых полей"
      why: Компилятор мемоизирует вычисления и JSX внутри компонента. Подписку на весь контекст он не отменяет и селекторов не добавляет.
  answer: 0
- id: context-selectors-unstable-selector
  skill: store-selector-stability
  question: context-selectors
  difficulty: 3
  prompt: "`useAppStore` построен на `useSyncExternalStore` с селектором. После монтирования компонент падает с «Maximum update depth exceeded». Найдите причину."
  explanation: "`getSnapshot` вызывает селектор, а тот каждый раз возвращает новый объект. React сравнивает снапшоты через Object.is, видит «изменение» и рендерит снова — получается бесконечный цикл. Чините так: два вызова с примитивными срезами, shallow-сравнение (`useShallow` в Zustand) или мемоизированный селектор."
  type: find-bug
  language: tsx
  code: |-
    function CartBadge() {
      const { items, total } = useAppStore((s) => ({
        items: s.cart.items,
        total: s.cart.total,
      }));
      return (
        <span>
          {items.length} · {total}
        </span>
      );
    }
  bugLines:
    - 2
  causes:
    - Селектор при каждом вызове возвращает новый объект — снапшот никогда не равен прошлому, и React рендерит бесконечно
    - Инлайн-селектор нужно обернуть в useCallback, иначе подписка пересоздаётся на каждом рендере
    - Деструктуризация результата хука разрывает подписку на стор
    - Не передан getServerSnapshot, без него useSyncExternalStore зацикливается
  answer: 0
- id: context-selectors-use-app-store
  skill: external-store-subscription
  question: context-selectors
  difficulty: 2
  prompt: "Допишите хук: контекст отдаёт стабильный стор, а компонент подписывается только на свой срез."
  explanation: Из контекста берём ссылку на стор, она не меняется и не вызывает рендеров. `useSyncExternalStore` получает `subscribe` и функцию снапшота `selector(getState())`. Компонент обновится, только когда изменится значение среза.
  type: fill-tokens
  language: tsx
  code: |-
    export function useAppStore<S>(
      selector: (s: AppState) => S,
    ): S {
      const store = ___(StoreContext)!;
      return ___(
        store.___,
        () => selector(store.___()),
      );
    }
  tokens:
    - useContext
    - useSyncExternalStore
    - subscribe
    - getState
  decoys:
    - useState
    - useEffect
    - setState
    - useReducer
- id: context-selectors-ssr-dashboard
  skill: global-state-without-rerenders
  question: context-selectors
  difficulty: 3
  prompt: Next.js App Router, редактор дашборда. Десятки виджетов читают разные поля общего состояния, которое меняется при каждом drag. Начальное состояние строится на сервере из данных пользователя. Что выбрать?
  explanation: "Частые обновления при многих читателях требуют подписки на срезы, а не Context со значением. При SSR стор нельзя держать в модуле: экземпляр должен быть у каждого запроса. Поэтому стор создают в провайдере и передают через контекст. Свой велосипед со стором не пишем, если есть Zustand или Redux."
  type: choose-tool
  options:
    - label: "Zustand: createStore в провайдере, стор в Context, чтение срезов через useStore(store, selector)"
      why: Лучший вариант. Виджеты рендерятся только при изменении своего среза, а у каждого запроса свой экземпляр стора, инициализированный серверными данными.
    - label: Один React Context с value в useMemo
      why: "Годится для редких изменений: темы, локали, текущего пользователя. Здесь каждый drag создаёт новое value и перерисовывает все десятки виджетов."
    - label: Разделить состояние на несколько контекстов
      why: Помогает, когда срезов мало и они меняются с разной частотой, например данные отдельно от действий. Десятки полей с частыми изменениями так не разложить.
    - label: Глобальный стор Zustand через create() на уровне модуля
      why: "Нормально для чистого SPA. На сервере модуль общий для всех запросов: данные одного пользователя утекут к другому, а тесты делят один экземпляр."
  answer: 0

# context: принято из черновика 2026-10-11
- id: context-main-problem
  skill: context-rerenders
  question: context
  difficulty: 2
  prompt: В чём главная проблема Context, из-за которой его не считают полноценным стейт-менеджером?
  explanation: Context — это механизм передачи значения, а не стейт-менеджер. Подписка идёт на значение целиком, поэтому его стоит мемоизировать и разделять на части. Для часто меняющегося глобального состояния лучше стор с селекторами.
  type: quiz
  options:
    - label: "При смене value перерисовываются все потребители контекста, даже если им нужна лишь часть данных: селекторов нет"
      why: Верно. useContext подписывает компонент на значение целиком. Изменилось одно поле объекта — рендерятся все, кто читает этот контекст.
    - label: При смене value перерисовывается всё поддерево провайдера, включая компоненты, которые контекст не читают
      why: Нет. React точечно обновляет потребителей. Компоненты, которые не читают контекст и обёрнуты в memo или переданы как children, сами по себе не рендерятся.
    - label: Значение копируется в каждого потребителя, поэтому большие объекты в контексте расходуют много памяти
      why: "Ничего не копируется: все потребители получают ссылку на один и тот же объект. Проблема в рендерах, а не в памяти."
    - label: Значение задаётся один раз в createContext и потом не обновляется без перезагрузки дерева
      why: В createContext задаётся лишь значение по умолчанию. Value провайдера можно менять из state, и потребители получат новое значение.
  answer: 0
- id: context-nearest-provider
  skill: context-provider-lookup
  question: context
  difficulty: 1
  prompt: Что по порядку появится на экране?
  explanation: useContext читает значение ближайшего провайдера выше по дереву. Внутренний провайдер перекрывает внешний. Последний Label стоит вне провайдеров и получает значение по умолчанию из createContext. Из-за этого правила часто кажется, что «контекст не работает».
  type: predict-output
  language: tsx
  code: |-
    const ThemeContext = createContext('light');
    const Label = () => <b>{useContext(ThemeContext)} </b>;
    export function App() {
      return (
        <>
          <ThemeContext value="dark">
            <Label />
            <ThemeContext value="blue"><Label /></ThemeContext>
          </ThemeContext>
          <Label />
        </>
      );
    }
  options:
    - dark blue light
    - dark dark light
    - dark blue undefined
    - dark blue dark
  answer: 0
- id: context-inline-value-object
  skill: context-value-memoization
  question: context
  difficulty: 2
  prompt: "`UserMenu` обёрнут в `memo` и читает `AuthContext`, но перерисовывается на каждый символ в поле поиска. Найдите причину."
  explanation: Каждый ввод перерисовывает App, и литерал `{ user, logout }` даёт новый объект. Context сравнивает value по ссылке, поэтому все потребители рендерятся, и memo не спасает. Исправление — useMemo(() => ({ user, logout }), [user, logout]) или вынести query в отдельный компонент. React Compiler мемоизирует такой объект автоматически.
  type: find-bug
  language: tsx
  code: |-
    function App() {
      const [query, setQuery] = useState('');
      const [user, setUser] = useState<User | null>(null);
      const logout = useCallback(() => setUser(null), []);
      return (
        <AuthContext value={{ user, logout }}>
          <input value={query}
            onChange={(e) => setQuery(e.target.value)} />
          <Dashboard query={query} />
          <UserMenu />
        </AuthContext>
      );
    }
  bugLines:
    - 6
  causes:
    - Объект value создаётся заново на каждом рендере App, и при вводе все потребители AuthContext получают новую ссылку
    - useCallback для logout создаёт новую функцию на каждом рендере и тем самым ломает memo
    - input находится внутри провайдера и при каждом изменении сам обновляет контекст
    - В React 19 без AuthContext.Provider значение не передаётся, и UserMenu получает default
  answer: 0
- id: context-vs-store-selectors
  skill: context-vs-store-choice
  question: context
  difficulty: 2
  prompt: "Клиентский редактор таблицы: сотни ячеек, тулбар показывает выделение, панель — формулу активной ячейки. Состояние меняется на каждое нажатие клавиши, и каждому компоненту нужен свой маленький срез. Что выбрать?"
  explanation: "Context подходит для редко меняющихся значений: темы, локали, пользователя, API-клиентов. Если глобальное состояние меняется часто и потребителям нужны разные срезы, берите стор с селекторами (Zustand, Redux, Jotai): компонент рендерится, только когда меняется его срез."
  type: choose-tool
  options:
    - label: Zustand-стор с селекторами
      why: Лучший выбор. Компонент подписан только на свой срез, например useStore(s => s.cells[id]). Смена одной ячейки не трогает остальные сотни.
    - label: Один Context со всем состоянием и value в useMemo
      why: useMemo спасает от лишних рендеров, только пока данные не меняются. Здесь они меняются на каждый ввод, и тогда рендерятся все потребители. Подходит для темы или локали.
    - label: Разделить на StateContext и DispatchContext
      why: "Хорошо, когда многим компонентам нужны только действия: они перестанут рендериться. Но всё, что читает state, по-прежнему рендерится целиком на каждый ввод."
    - label: Хранить состояние в корне и передавать через props с memo
      why: "Терпимо при малой глубине дерева. Здесь тулбар и ячейки далеко друг от друга: придётся протаскивать props через слои и стабилизировать каждый колбэк."
  answer: 0

# lifting-state-up: принято из черновика 2026-10-11
- id: lifting-state-up-quiz
  skill: lifting-state-up
  question: lifting-state-up
  difficulty: 1
  prompt: Как в React передать данные от ребёнка к родителю и сделать общее состояние для двух соседних компонентов?
  explanation: "Данные идут сверху вниз, а события — снизу вверх через колбэки. Общее состояние живёт у ближайшего общего предка, у него единственный источник правды. Не поднимайте его выше, чем нужно: изменение перерисует всё поддерево предка."
  type: quiz
  options:
    - label: Родитель хранит state и передаёт ребёнку колбэк; общее для соседей состояние поднимают к ближайшему общему предку
      why: Верно. Ребёнок сообщает о событии через колбэк, а предок передаёт вниз значение и функцию изменения. Так у состояния остаётся один владелец.
    - label: Ребёнок записывает новое значение прямо в объект props, и родитель его увидит
      why: Props доступны только для чтения. Мутация не вызовет ререндер родителя и нарушает однонаправленный поток данных.
    - label: Каждый сосед держит свою копию state, а useEffect синхронизирует копии между собой
      why: "Это антипаттерн: появляются лишние рендеры, копии могут рассинхронизироваться, а данные приходится дублировать. Хватит одного источника правды у общего предка."
    - label: Родитель через ref и useImperativeHandle читает state ребёнка, когда он нужен
      why: Это обходной путь для императивных действий вроде focus() или scroll. Чтение через ref не вызывает ререндер, поэтому соседи не узнают об изменении.
  answer: 0
- id: lifting-state-up-duplicated-state
  skill: single-source-of-truth
  question: lifting-state-up
  difficulty: 2
  prompt: Кнопка Reset очищает query, и список показывает все товары, но в поле ввода остаётся старый текст. Найдите причину.
  explanation: "У Filters своя копия состояния, которая синхронизируется с родителем эффектом. Поток идёт только вверх, поэтому сброс у родителя до инпута не доходит. Решение — сделать Filters контролируемым: принимать value и onChange от родителя без собственного useState и эффекта."
  type: find-bug
  language: tsx
  code: |-
    function Filters({ onChange }: FiltersProps) {
      const [value, setValue] = useState('');
      useEffect(() => onChange(value), [value]);
      return <input value={value}
        onChange={(e) => setValue(e.target.value)} />;
    }
    function ProductPage() {
      const [query, setQuery] = useState('');
      return <>
        <button onClick={() => setQuery('')}>Reset</button>
        <Filters onChange={setQuery} />
        <ProductList query={query} />
      </>;
    }
  bugLines:
    - 2
    - 3
  causes:
    - "Состояние продублировано: Filters держит свою копию и лишь шлёт её вверх эффектом, поэтому сброс query у родителя не доходит до инпута"
    - В зависимостях эффекта нет onChange, поэтому он вызывает устаревший колбэк
    - Функцию setQuery нельзя передавать в дочерний компонент как prop
    - Фрагмент <> нельзя возвращать без круглых скобок вокруг JSX
  answer: 0
