- id: tanstack-query-rarely-changing-data
  skill: stale-time-vs-gc-time
  question: tanstack-query
  difficulty: 3
  prompt: Справочник стран меняется раз в месяц. Он уже в кэше TanStack Query, но при каждом монтировании селекта уходит новый запрос. Что настроить?
  explanation: "staleTime отвечает, сколько данные считаются свежими: пока они свежие, монтирование и фокус не вызывают перезапрос. gcTime — сколько неиспользуемая запись живёт в кэше до удаления. Перезапросы убирает именно staleTime."
  type: choose-tool
  options:
    - label: Увеличить staleTime (вплоть до Infinity) для этого запроса
      why: "Лучший выбор: пока данные свежие, новые подписчики берут их из кэша без запроса. По умолчанию staleTime = 0, поэтому каждый mount запускает фоновый refetch."
    - label: Увеличить gcTime до Infinity
      why: gcTime лишь продлевает жизнь неактивной записи в кэше. Данные останутся, но будут stale, и при монтировании запрос всё равно уйдёт. Полезно вместе со staleTime.
    - label: Отключить refetchOnWindowFocus
      why: Уберёт только перезапросы при возврате на вкладку. Перезапрос при монтировании останется — за него отвечает свежесть данных.
    - label: Один раз загрузить список и положить его в React Context
      why: "Дублирует кэш вручную: теряются дедупликация, повторы и инвалидация. Уместно для клиентских значений, а не для серверных данных."
