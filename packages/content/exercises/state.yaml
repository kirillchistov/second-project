  question: rtk-entity-adapter
  difficulty: 2
  prompt: "Канбан-доска на Redux Toolkit: тысячи карточек, частые обновления одной карточки по id (drag-and-drop, события из WebSocket), список отсортирован по позиции. Как хранить карточки?"
  explanation: Если коллекция живёт в Redux, часто обновляется по id и читается разными компонентами, нормализуйте её. `createEntityAdapter` даёт это без ручного кода. Массивы и вложенность хороши для маленьких статичных данных, а Context не решает вопросы хранения.
  type: choose-tool
  options:
    - label: createEntityAdapter с sortComparer
      why: Словарь по id даёт обновление за O(1), готовые updateOne/upsertMany для событий из сокета, порядок держит sortComparer, а селекторы уже мемоизированы.
    - label: Массив карточек в слайсе + findIndex
      why: Годится для небольших списков. На тысячах карточек каждое обновление стоит O(n), а CRUD и сортировку придётся писать и тестировать вручную.
