    - label: "devtools нужно ставить внутрь: внутренний слой первым видит изменения, и история будет точнее"
      why: Внутренний слой ближе к исходному `set`, но не видит, что добавили внешние обёртки. Для отладки нужен взгляд на итоговый стор, то есть снаружи.
