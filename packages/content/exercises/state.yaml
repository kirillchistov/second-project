# rtk-create-async-thunk: принято из черновика 2026-11-07
- id: rtk-async-thunk-lifecycle-quiz
  skill: rtk-async-thunk-lifecycle
  question: rtk-create-async-thunk
  difficulty: 2
  prompt: Что происходит при `dispatch(fetchUser('42'))`, если `fetchUser` создан через `createAsyncThunk`?
  explanation: createAsyncThunk генерирует три action creators (`pending`, `fulfilled`, `rejected`) и сам диспатчит их по ходу промиса. Хранить status и error в state и писать ветки в `extraReducers` — ваша задача. Если `rejected` не обработать, UI навсегда останется в loading.
  type: quiz
  options:
    - label: Сразу уходит pending, затем fulfilled с результатом в payload или rejected с ошибкой в error (или в payload через rejectWithValue)
      why: Верно. Аргумент вызова лежит в `action.meta.arg`, а у всех трёх actions общий `meta.requestId`.
    - label: Уходит pending, затем fulfilled; при ошибке исключение пробрасывается из dispatch, и его нужно ловить в try/catch
      why: Неверно. Промис от dispatch всегда резолвится финальным action. Исключение бросает только `.unwrap()`.
    - label: Уходит только fulfilled; pending и rejected нужно создать вручную через createAction
      why: Неверно. Избавить от ручного написания трёх action creators — ровно та задача, ради которой создан createAsyncThunk.
    - label: Thunk сам добавляет в слайс поля status и error и обновляет их без extraReducers
      why: Неверно. Thunk только диспатчит actions. Как реагировать на них, вы описываете в `builder.addCase`. Готовый кэш со статусами даёт RTK Query.
  answer: 0
- id: rtk-async-thunk-fetch-not-ok
  skill: rtk-async-thunk-errors
  question: rtk-create-async-thunk
  difficulty: 2
  prompt: На неверный пароль сервер отвечает 401 с JSON `{ code, message }`, но в store срабатывает `login.fulfilled`. Найдите ошибку.
  explanation: "`fetch` отклоняет промис только при сетевой ошибке: 401 и 500 для него — успешный ответ. Thunk вернул тело ошибки, и RTK отправил fulfilled. Правило: проверяйте `res.ok` и для бизнес-ошибок делайте `return rejectWithValue(data)`, тогда структурированная ошибка попадёт в `action.payload` у rejected."
  type: find-bug
  language: tsx
  code: |-
    const login = createAsyncThunk(
      'auth/login',
      async (creds: Creds, { rejectWithValue }) => {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(creds),
        });
        const data = await res.json();
        return data as Session;
      },
    );
  bugLines:
    - 10
  causes:
    - "Нет проверки `res.ok`: fetch не отклоняет промис на 4xx/5xx, и тело ошибки уходит в fulfilled как payload"
    - Не передан `signal` из thunkAPI, поэтому ошибочный ответ не может попасть в rejected
    - Без try/catch вокруг fetch createAsyncThunk не умеет отправлять rejected
    - Приведение `as Session` заставляет RTK считать любой ответ успешным
  answer: 0
- id: rtk-async-thunk-reject-with-value
  skill: rtk-async-thunk-errors
  question: rtk-create-async-thunk
  difficulty: 2
  prompt: Допишите код так, чтобы в `state.error` попало поле `message` из JSON-ответа сервера, а не текст исключения.
  explanation: "`rejectWithValue` берут из thunkAPI (второй аргумент payloadCreator) и **возвращают**. Тогда rejected получит значение в `action.payload`, типизированное через `rejectValue`. В `action.error.message` в этом случае будет просто 'Rejected'. `payload` может быть undefined, если thunk упал с исключением, поэтому нужен `?.`."
  type: fill-tokens
