- id: rtk-query-logout-reset
  skill: rtk-query-cache-reset
  question: rtk-query-internals
  difficulty: 2
  prompt: При выходе пользователя нужно, чтобы следующий пользователь не увидел чужие закэшированные данные RTK Query. Остальное состояние приложения трогать не нужно. Что выбрать?
  explanation: Кэш RTK Query — часть Redux state, но кроме данных у middleware есть подписки и таймеры. api.util.resetApiState() сбрасывает и то и другое штатно. Инвалидация перезапрашивает, а не очищает; keepUnusedDataFor управляет временем жизни неиспользуемых данных, а не логаутом.
  type: choose-tool
  options:
    - label: dispatch(api.util.resetApiState())
      why: "Штатно очищает весь срез API: данные, статусы и внутреннее состояние подписок. Остальные срезы store не затрагиваются."
    - label: dispatch(api.util.invalidateTags(['Todo']))
      why: Подходит, когда данные устарели после мутации. Старые данные остаются до ответа, а активные запросы перезапросятся — лишняя сетевая нагрузка при логауте.
    - label: "keepUnusedDataFor: 0 во всех эндпоинтах"
      why: Удаляет только данные без подписчиков, смонтированные экраны их сохранят. Уместно для редко нужных тяжёлых данных, но убивает кэш при навигации.
    - label: window.location.reload()
      why: Гарантированно всё сбросит, но вместе со всем остальным состоянием и ценой полной перезагрузки. Крайняя мера, если стор сбросить нельзя.
  answer: 0

