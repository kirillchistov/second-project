    - label: Перед каждым set состояние глубоко клонируется, и изменения применяются к копии
      why: Глубокого клонирования нет. Оно сменило бы все ссылки и перерисовало бы всех подписчиков. Immer копирует только узлы на пути изменения.
    - label: Подписчики начинают сравнивать состояние по значению, поэтому мутация безопасна
      why: "Сравнение не меняется: Zustand по умолчанию сравнивает результат селектора через Object.is. Immer как раз выдаёт новые ссылки, чтобы это сравнение сработало."
  answer: 0
