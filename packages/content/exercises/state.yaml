  explanation: Ключ кэша — эндпоинт плюс сериализованные аргументы. Первый подписчик запускает запрос, следующие только добавляют подписку и делят тот же кэш. Когда подписчиков ноль, запись живёт ещё keepUnusedDataFor (по умолчанию 60 с), затем удаляется — следующий монтаж снова пойдёт на сервер.
