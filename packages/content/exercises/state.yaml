  explanation: "`immer` оборачивает `set`: функция получает черновик, Immer записывает изменения и строит новое состояние. Изменённые ветки получают новые ссылки, а нетронутые переиспользуются. Поэтому селекторы по ссылке работают как раньше, и не нужно вручную раскрывать spread на каждом уровне."
  type: quiz
  options:
    - label: "Immer записывает изменения черновика и создаёт новое состояние: новые ссылки только на изменённом пути, остальное переиспользуется"
      why: "Верно. Это structural sharing: user и address получают новые объекты, а соседние ветки сохраняют прежние ссылки, и их подписчики не перерисуются."
