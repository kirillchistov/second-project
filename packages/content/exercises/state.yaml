# normalized-state: принято из черновика 2026-10-13
- id: normalized-state-why
  skill: state-normalization
  question: normalized-state
  difficulty: 2
  prompt: "Зачем в клиентском сторе хранить сущности нормализованно: словарь по id, связи через id?"
  explanation: "Нормализация — хранение как в БД: каждая сущность один раз, связи через id. Она даёт консистентность (одно место правды), дешёвые иммутабельные обновления и O(1) доступ. Нужна, когда одни сущности видны в разных местах и меняются на клиенте. Серверный кэш TanStack Query обычно не нормализуют, а инвалидируют."
  type: quiz
  options:
    - label: "Сущность хранится один раз: обновил её по id — и изменение видно везде, обновление дешёвое, поиск по id O(1)"
      why: Верно. Без вложенных копий нет рассинхрона, а иммутабельно заменить одну запись в словаре проще, чем искать её по всему дереву.
    - label: Нормализованный стор сам по себе уменьшает число рендеров компонентов
      why: Нет. Селекторы, собирающие «пост с автором», без мемоизации, наоборот, дают лишние рендеры. Цель нормализации — консистентность данных.
    - label: Без нормализации Redux не сможет отследить иммутабельные изменения
      why: Redux сравнивает ссылки при любой форме данных. Вложенное дерево тоже можно обновлять иммутабельно — просто это дороже и легко забыть копию.
    - label: Это стандартная практика, поэтому так стоит хранить и серверный кэш TanStack Query
      why: В TanStack Query кэш по ключам обычно инвалидируют или правят через setQueryData. Нормализованный кэш есть в Apollo/urql, но он добавляет сложности.
  answer: 0
- id: normalized-state-unmemoized-selector
  skill: memoized-selectors
  question: normalized-state
  difficulty: 2
  prompt: PostCard перерисовывается при любом dispatch в сторе, даже не связанном с постами. Где причина?
  explanation: "useSelector сравнивает результат по ссылке (===). Спред создаёт новый объект на каждом вызове, поэтому любой dispatch даёт «изменение» и рендер. Решение — createSelector из Reselect/RTK: он вернёт прежний объект, пока post и author не изменились."
  type: find-bug
  language: tsx
  code: |-
    const selectPostWithAuthor = (
      state: RootState,
      id: string,
    ) => {
      const post = state.posts.entities[id];
      const author = state.users.entities[post.authorId];
      return { ...post, author };
    };
    function PostCard({ id }: { id: string }) {
      const post = useSelector((s: RootState) =>
        selectPostWithAuthor(s, id),
      );
      return <h3>{post.title} — {post.author.name}</h3>;
    }
  bugLines:
    - 7
  causes:
    - Селектор каждый раз возвращает новый объект, а useSelector сравнивает по ссылке — рендер на каждый dispatch
    - Стрелочная функция в useSelector пересоздаётся на каждом рендере, из-за этого подписка обновляется
    - Доступ к entities[id] по ключу без проверки заставляет Redux пересчитывать весь срез
    - Нормализованный стор нельзя читать из двух срезов в одном селекторе
  answer: 0
