    >('auth/login', async (creds, { ___ }) => {
      const res = await postLogin(creds);
      if (!res.ok) return ___(await res.json());
      return res.json();
    });

    builder.addCase(login.___, (state, action) => {
      state.error = action.___?.message;
    });
  tokens:
    - rejectWithValue
    - rejectWithValue
    - rejected
    - payload
  decoys:
    - fulfillWithValue
    - error
    - pending
    - reject
