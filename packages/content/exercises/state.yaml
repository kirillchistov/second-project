  explanation: Серверному состоянию нужна библиотека с кэшем. Если Redux Toolkit уже есть, RTK Query естественно встаёт в тот же store и DevTools. Без Redux равноценный выбор — TanStack Query. Ручные thunk и эффекты оправданы только для единичных нестандартных запросов.
