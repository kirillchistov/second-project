# rtk-create-slice: принято из черновика 2026-11-07
- id: rtk-create-slice-quiz
  skill: rtk-create-slice-immer
  question: rtk-create-slice
  difficulty: 2
  prompt: Что делает `createSlice` и какую роль в нём играет Immer?
  explanation: "`createSlice` избавляет от `switch` и строковых констант: из `name` и ключей `reducers` он генерирует типы вида `todos/added`, action creators и общий reducer. Immer даёт редьюсеру черновик-прокси и по записанным изменениям собирает новое состояние. Неизменённые части он переиспользует по ссылке."
  type: quiz
  options:
    - label: Генерирует action creators и reducer из name и reducers; Immer превращает «мутации» черновика в новое иммутабельное состояние
      why: Верно. Ручные типы и switch не нужны, а `state.push(x)` меняет только draft. Исходный state остаётся нетронутым.
    - label: Создаёт отдельный store для фичи, а Immer глубоко копирует состояние перед каждым вызовом редьюсера
      why: "Slice — не store, его reducer подключают в `configureStore`. Immer не копирует всё подряд: он копирует только изменённые ветки, остальные делит по ссылке."
    - label: "Immer отключает иммутабельность: state меняется на месте, а подписчиков уведомляет прокси"
      why: Исходный объект не меняется, корень получает новую ссылку. Иначе селекторы и `useSelector` не увидели бы изменений.
