- id: zustand-first-store-selector-rerender
  skill: zustand-selectors
  question: zustand-first-store
  difficulty: 1
  prompt: "Действие `increment` меняет qty товара через `map`: массив `items` новый, длина прежняя. Перерисуется ли `CartBadge` с селектором `(s) => s.items.length`?"
  explanation: "Компонент подписан на **результат селектора**. После каждого `set` Zustand вызывает селектор и сравнивает новое значение со старым через `Object.is`. Число 2 равно числу 2, поэтому рендера не будет. Правило: выбирайте из стора узкий срез, лучше примитив, и компонент обновится только при его изменении."
  type: quiz
  options:
    - label: "Нет: селектор вернул то же число, Zustand сравнил его через Object.is и не стал перерисовывать"
      why: Верно. Сравнивается то, что вернул селектор, а не поля стора, которые он прочитал. Длина не изменилась, значит рендера нет.
    - label: "Да: у items новая ссылка, а селектор читает items, значит компонент подписан на него"
      why: Zustand не отслеживает, какие поля читает селектор. Он сравнивает только итоговое значение, а здесь это число.
    - label: "Да: любой вызов set перерисовывает все компоненты, которые используют хук стора"
      why: "Так ведёт себя `useCartStore()` без селектора: он возвращает весь state, а после set это новый объект."
    - label: Нет, но только если обернуть CartBadge в React.memo
      why: memo пропускает рендер при тех же props. Подписка на стор работает в обход props, и решение принимает селектор, а не memo.
  answer: 0
