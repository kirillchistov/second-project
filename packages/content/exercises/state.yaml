    - Сущность записана в entities, но её id не добавлен в ids, а selectAll собирает массив именно по ids
    - "Мутировать state напрямую нельзя: редьюсер должен вернуть новый объект"
    - Метод адаптера removeOne нельзя передавать в reducers напрямую, нужна обёртка
    - getInitialState нужно вызывать с начальным массивом сущностей
