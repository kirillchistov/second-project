  explanation: Оптимистичное обновление в RTK Query делается вручную. В `onQueryStarted` мутации правят кэш нужного запроса через `updateQueryData` и получают patch. Если `queryFulfilled` реджектится, вызывают `patch.undo()`. Теги дают только рефетч после ответа сервера, это пессимистичный путь.
  type: quiz
  options:
    - label: В onQueryStarted сразу править кэш запроса через updateQueryData, а при реджекте queryFulfilled вызвать patch.undo()
      why: Верно. Кэш меняется до ответа сервера, dispatch возвращает patch с undo(), и при ошибке он откатывает правку.
    - label: Указать invalidatesTags — RTK Query сам применит изменение до ответа и откатит его при ошибке
      why: invalidatesTags только помечает кэш устаревшим и запускает рефетч после мутации. Мгновенной правки и отката нет.
    - label: "Включить в эндпоинте мутации опцию optimistic: true — RTK Query сделает обновление и откат автоматически"
      why: Такой опции нет. RTK Query не знает, как мутация меняет данные, поэтому правку кэша описывают вручную.
    - label: В onQueryStarted сначала дождаться await queryFulfilled, затем вызвать updateQueryData
      why: "Это пессимистичное обновление: UI ждёт round-trip до сервера. Подход полезен, но мгновенной реакции не даёт."
  answer: 0
