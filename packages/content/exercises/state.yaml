  difficulty: 3
  prompt: Проект на Redux Toolkit. Action `loggedIn` диспатчат из трёх мест. После каждого такого action нужно загрузить настройки пользователя, а при `loggedOut` — отменить незавершённую загрузку. Что выбрать?
  explanation: "Есть два класса эффектов. Если эффект запускают явно, подходит thunk или createAsyncThunk. Если эффект — реакция на чужие actions, нужна подписка: в RTK это listener middleware, в сложных процессах с каналами и гонками — redux-saga. Fetch внутри reducer недопустим никогда."
