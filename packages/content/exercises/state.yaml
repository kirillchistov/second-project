  explanation: "Изменяемые объекты-«ручки» (сокеты, таймеры, инстансы библиотек) хранят в useRef: значение переживает рендеры и не вызывает их. Создают такой объект в эффекте, а очищают в его cleanup. В state кладут только то, что влияет на разметку, — например, сообщения или статус соединения."
