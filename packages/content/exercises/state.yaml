  explanation: Первый запрос с 401 видит свободный mutex, захватывает его через `acquire()` и делает refresh. Остальные ждут в `waitForUnlock()` и повторяют запрос уже с новым токеном. `release()` стоит в finally, чтобы mutex освободился даже при ошибке. Ещё в начале baseQuery обычно вызывают `await mutex.waitForUnlock()`.
