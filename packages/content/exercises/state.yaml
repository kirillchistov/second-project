# realtime: принято из черновика 2026-10-11
- id: realtime-architecture-quiz
  skill: realtime-architecture
  question: realtime
  difficulty: 2
  prompt: Как правильно организовать real-time данные (WebSocket, SSE) в React-приложении?
  explanation: "Соединение — внешняя система, поэтому оно живёт вне компонентов. Компоненты только подписываются и отписываются в cleanup. Входящие события обновляют кэш серверного состояния (`setQueryData` или инвалидация). Обязательная обвязка: backoff при переподключении, догрузка пропущенного, ограничение частоты обновлений UI."
  type: quiz
  options:
    - label: Одно соединение в модуле-клиенте или провайдере, компоненты подписываются в эффекте, события обновляют кэш серверного состояния
      why: Верно. Одно соединение на приложение, отписка в cleanup, единый источник правды в кэше (TanStack Query или внешний стор), а не разрозненные useState.
    - label: Открывать WebSocket в useEffect каждого компонента, которому нужны данные, — соединение живёт ровно столько, сколько компонент
      why: N компонентов дадут N соединений, дублирующиеся сообщения и лишнюю нагрузку на сервер. Компонент должен подписываться на общий клиент, а не владеть соединением.
    - label: Класть каждое сообщение в useState корневого компонента и раздавать данные вниз через Context
      why: При частых сообщениях каждое изменение перерисует всех потребителей контекста. К тому же данные разойдутся с кэшем запросов, который грузил начальный снимок.
    - label: "Хватит useQuery с refetchInterval: 1000 — частый polling и есть real-time, сокеты не нужны"
      why: Polling годится для редко меняющихся данных, где задержка допустима. Но это задержка до интервала и пустые запросы, а не push-обновления.
  answer: 0
- id: realtime-transport-sse
  skill: realtime-transport-choice
  question: realtime
  difficulty: 2
  prompt: Лента уведомлений и статусы CI-сборок. Данные идут только от сервера к клиенту, всё должно работать через корпоративные HTTP-прокси, а переподключение хочется без своего кода. Что выбрать?
  explanation: "SSE выбирают, когда поток однонаправленный (сервер → клиент). WebSocket нужен, когда клиент тоже часто шлёт сообщения: чат, игры, совместные курсоры. CRDT (Yjs, Automerge) работает поверх транспорта и нужен для слияния конкурентных правок. Polling подходит, когда допустима задержка."
  type: choose-tool
  options:
    - label: Server-Sent Events (EventSource)
      why: Однонаправленный поток по обычному HTTP. Браузер сам переподключается и передаёт Last-Event-ID, чтобы сервер дослал пропущенное.
    - label: WebSocket
      why: "Нужен для двустороннего обмена с низкой задержкой (чат, игры). Здесь он избыточен: переподключение и backoff придётся писать самому, а прокси иногда режут upgrade."
    - label: Yjs (CRDT) поверх WebSocket
      why: Решает слияние конкурентных правок при совместном редактировании документа. Для потока уведомлений конфликтов нет.
    - label: TanStack Query с refetchInterval
      why: Подходит, если задержка в десятки секунд не важна и событий мало. Для мгновенных уведомлений это лишние запросы и задержка до интервала.
  answer: 0
- id: realtime-connection-per-component
  skill: realtime-shared-connection
  question: realtime
  difficulty: 2
  prompt: OrderBadge рендерится в таблице на 200 строк. Найдите строку с архитектурной ошибкой.
  explanation: "Каждый экземпляр открывает собственное соединение: 200 бейджей — 200 WebSocket, и каждый получает весь поток заказов. Соединение должно быть одно — в модуле-клиенте. Компонент подписывается через `realtime.subscribe` и отписывается в cleanup, а данные лучше брать из общего кэша."
  type: find-bug
  language: tsx
  code: |-
    function OrderBadge({ id }: { id: string }) {
      const [order, setOrder] = useState<Order>();
      useEffect(() => {
        const ws = new WebSocket(ORDERS_URL);
        ws.onmessage = (e) => {
          const ev: OrderEvent = JSON.parse(e.data);
          if (ev.order.id === id) setOrder(ev.order);
        };
        return () => ws.close();
      }, [id]);
      return <span>{order?.status}</span>;
    }
  bugLines:
    - 4
  causes:
    - Каждый экземпляр компонента открывает своё соединение — вместо подписки на общий клиент получается 200 WebSocket
    - ws.close() в cleanup закрывает соединение до того, как придут сообщения
    - id в зависимостях эффекта вызывает бесконечный цикл переподключений
    - setState внутри onmessage запрещён, потому что вызывается вне рендера React
  answer: 0
- id: realtime-reconnect-resync-recipe
  skill: realtime-reconnect-resync
  question: realtime
  difficulty: 3
  prompt: Соберите алгоритм переподключения, при котором не теряются и не дублируются события.
  explanation: Буферизацию включают вместе с переподпиской, до догрузки. Иначе событие, пришедшее во время resync, потеряется или применится раньше снимка. Версия или id события решает и гонку «начальная загрузка vs события», и проблему дубликатов. Backoff с потолком не даёт тысячам клиентов одновременно атаковать упавший сервер.
  type: order
  kind: recipe
  steps:
    - На onclose запланировать переподключение с экспоненциальной задержкой и потолком
    - На onopen сбросить счётчик попыток
    - Включить буферизацию живых событий и переподписаться на каналы
    - Догрузить пропущенное с последнего полученного id или инвалидировать запросы и перезагрузить снимок
    - Применить буфер поверх, отбрасывая события с версией не новее уже применённой

# redux-async: принято из черновика 2026-10-11
- id: redux-async-where-side-effects-live
  skill: redux-async-middleware
  question: redux-async
  difficulty: 2
  prompt: Почему в Redux нельзя сделать запрос прямо в reducer и где тогда живёт асинхронная логика?
  explanation: "Reducer — чистая синхронная функция (state, action) → state. Её можно повторить, протестировать и «отмотать» в DevTools. Всё асинхронное выносят в middleware: thunk, listener middleware или saga. Оно видит действия и диспатчит новые с результатом. Для загрузки и кэширования данных лучше сразу брать RTK Query."
  type: quiz
  options:
    - label: Reducer обязан быть чистым и синхронным, поэтому эффекты выносят в middleware (thunk, listener, saga), а оно диспатчит результат
      why: Верно. Middleware оборачивает dispatch и видит каждое действие до reducer. Там можно ждать, отменять и вызывать эффекты, а в reducer приходит уже готовый payload.
    - label: "Можно, если reducer вернёт Promise: Redux дождётся его и запишет результат в стор"
      why: Redux не ждёт промисы. Что вернул reducer, то и станет новым состоянием, поэтому в сторе окажется сам Promise.
    - label: В createSlice можно, потому что Immer отследит изменения state и после await
      why: Immer фиксирует черновик синхронно, в момент выхода из reducer. Изменения после await не станут результатом этого действия.
    - label: Асинхронность пишут только в useEffect компонентов, а middleware нужен лишь для логирования
      why: Логирование — лишь один из сценариев. Thunk и listener как раз и созданы, чтобы вынести асинхронную логику из компонентов в слой Redux.
  answer: 0
- id: redux-async-reducer-bug
  skill: redux-async-middleware
  question: redux-async
  difficulty: 1
  prompt: Коллега добавил загрузку пользователя в слайс. Найдите, что здесь принципиально не так.
  explanation: Reducer должен синхронно вычислить новое состояние, без побочных эффектов. Async-функция возвращает Promise, а запись после await не станет результатом действия. Запрос переносят в createAsyncThunk, а в extraReducers обрабатывают pending/fulfilled/rejected. Для данных с сервера ещё удобнее RTK Query.
  type: find-bug
  language: tsx
  code: |-
    const userSlice = createSlice({
      name: 'user',
      initialState: { data: null as User | null },
      reducers: {
        loadUser: async (state, action) => {
          const res = await fetch(`/api/u/${action.payload}`);
          state.data = await res.json();
        },
      },
    });
  bugLines:
    - 5
    - 6
  causes:
    - "Reducer асинхронный и делает запрос: он должен быть синхронным и чистым, а эффекты нужно вынести в thunk или middleware"
    - В reducer createSlice нельзя мутировать state — нужно вернуть новый объект
    - Действие loadUser нужно обрабатывать в extraReducers, а не в reducers
    - В fetch не передан signal, поэтому запрос нельзя отменить
  answer: 0
- id: redux-async-create-async-thunk
  skill: create-async-thunk
  question: redux-async
  difficulty: 2
  prompt: Допишите thunk с поддержкой отмены и обработку его жизненного цикла в слайсе.
  explanation: "createAsyncThunk сам генерирует три действия: pending, fulfilled и rejected. Результат функции попадает в action.payload. Второй аргумент — thunkAPI с signal: если вызвать abort() у промиса из dispatch, запрос прервётся, а thunk завершится через rejected."
  type: fill-tokens
  language: tsx
  code: |-
    export const fetchUser = createAsyncThunk(
      'user/fetch',
      async (id: string, { ___ }) => {
        const res = await fetch(`/api/users/${id}`, { signal });
        return (await res.json()) as User;
      },
    );
    builder
      .addCase(fetchUser.___, (s) => { s.status = 'loading'; })
      .addCase(fetchUser.fulfilled, (s, a) => {
        s.status = 'idle';
        s.data = a.___;
      })
      .addCase(fetchUser.___, (s) => { s.status = 'failed'; });
  tokens:
    - signal
    - pending
    - payload
    - rejected
  decoys:
    - abort
    - loading
    - data
    - error
- id: redux-async-autosave-orchestration
  skill: redux-async-tool-choice
  question: redux-async
  difficulty: 3
  prompt: Проект на Redux Toolkit. На каждое действие draft/changed нужно подождать 500 мс тишины, отменить предыдущую попытку и сохранить черновик на сервер. Что выбрать?
  explanation: "Правило выбора: данные с сервера и их кэш — RTK Query; разовая асинхронная операция — createAsyncThunk; реакция на действия с отменой, задержками и гонками — listener middleware, а при сложной оркестрации в легаси-коде — saga."
  type: choose-tool
  options:
    - label: "Listener middleware: startListening + cancelActiveListeners() и delay(500)"
      why: Лучший вариант. Встроен в RTK и реагирует на действие. cancelActiveListeners() гасит прошлый запуск, а delay() даёт debounce без сторонних библиотек.
    - label: createAsyncThunk, который диспатчится из onChange
      why: Подходит для разовой операции. Debounce и отмену прошлой попытки пришлось бы писать вручную в компоненте.
    - label: RTK Query mutation saveDraft
      why: Удобна для самого запроса и инвалидации кэша, но не умеет реагировать на action с задержкой. Её можно вызвать уже из listener.
    - label: Redux-Saga с takeLatest и delay
      why: Решит задачу, но добавит зависимость и генераторы. Оправдано, если saga уже есть в проекте и логика сложнее.
  answer: 0

# redux-toolkit: принято из черновика 2026-10-11
- id: redux-toolkit-create-slice-immer
  skill: redux-toolkit-slices
  question: redux-toolkit
  difficulty: 2
  prompt: Что делает `createSlice` и почему в его редьюсерах можно писать `state.items.push(...)`?
  explanation: "Современный Redux пишут на RTK. `createSlice` по объекту `reducers` генерирует action creators и reducer, а Immer превращает мутации черновика в новое иммутабельное состояние. Правило: внутри slice-редьюсера либо мутируй draft, либо верни новое значение. Делать то и другое сразу нельзя."
  type: quiz
  options:
    - label: Генерирует action creators и reducer; внутри Immer, и «мутации» черновика превращаются в новое иммутабельное состояние
      why: Верно. state в редьюсере — это Proxy-черновик Immer. По записанным изменениям Immer строит новый объект и копирует только изменённые ветки (structural sharing).
    - label: "RTK снимает требование иммутабельности: стор хранит изменяемый объект и уведомляет подписчиков через Proxy"
      why: "Неверно. Состояние в сторе по-прежнему иммутабельно: после dispatch получается новый объект, иначе useSelector не заметил бы изменений по ===."
    - label: Перед каждым редьюсером createSlice делает глубокую копию state, поэтому мутировать её безопасно
      why: Неверно. Глубокое копирование было бы дорогим. Immer копирует только изменённые пути, а неизменённые ветки сохраняют прежние ссылки.
    - label: Мутировать можно только массивы через push, а объекты всё равно нужно обновлять через spread
      why: "Неверно. Через draft можно менять любые поля: state.user.name = 'x' тоже корректно. Spread внутри createSlice не нужен."
  answer: 0
