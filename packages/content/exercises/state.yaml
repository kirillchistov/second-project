# zustand-async-actions: принято из черновика 2026-11-09
- id: zustand-async-action-basics
  skill: zustand-async-actions
  question: zustand-async-actions
  difficulty: 2
  prompt: Что нужно, чтобы в Zustand-сторе сделать действие, которое загружает данные с сервера и показывает состояние загрузки?
  explanation: "Действие в Zustand — обычная JS-функция в объекте стора. Она может быть `async`, читать актуальное состояние через `get()` и вызывать `set()` сколько угодно раз: до `await` для loading, после — для результата или ошибки. Middleware вроде thunk не нужен."
  type: quiz
  options:
    - label: "Объявить действие как async-функцию: get() для чтения, set() до await для loading и после — для данных или ошибки"
      why: Верно. Действие — просто функция, а set можно вызывать сколько угодно раз и в любой момент, в том числе после await.
    - label: Подключить middleware наподобие redux-thunk, иначе set после await не обновит подписчиков
      why: Это перенос опыта из Redux. В Zustand set — обычная функция из замыкания, она работает и после await, без всяких middleware.
    - label: Вернуть из действия Promise с новым состоянием — Zustand сам применит его после resolve
      why: Zustand не смотрит на возвращаемое значение действия. Состояние меняется только через вызов set.
    - label: "Вызвать set один раз в конце: промежуточные set внутри async-действия приводят к рассинхрону"
      why: "Несколько set подряд — нормальный паттерн: так UI видит переходы idle → loading → idle/error. Каждый set синхронно обновляет стор."
  answer: 0
- id: zustand-async-stuck-loading
  skill: zustand-async-error-handling
  question: zustand-async-actions
  difficulty: 2
  prompt: Один раз пропала сеть, и после этого список задач больше никогда не обновляется, хотя fetchTodos вызывают снова. Найдите причину.
  explanation: "Без try/catch reject из fetch или json() просто «теряется» в промисе действия, и status навсегда остаётся 'loading'. После этого защита от повторного запроса в строке 6 блокирует все следующие вызовы. Правило: в async-действии всегда есть catch, который переводит стор в 'error'."
  type: find-bug
  language: tsx
  code: |-
    const useTodosStore = create<TodosStore>(
      (set, get) => ({
      todos: [],
      status: 'idle',
      fetchTodos: async () => {
        if (get().status === 'loading') return;
        set({ status: 'loading' });
        const res = await fetch('/api/todos');
        const todos = await res.json();
        set({ todos, status: 'idle' });
      },
    }));
  bugLines:
    - 8
    - 9
  causes:
    - "Нет try/catch: при reject status навсегда остаётся 'loading', и проверка выше блокирует все следующие вызовы"
    - get() в async-действии возвращает состояние на момент создания стора, поэтому проверка всегда видит 'idle'
    - set после await не уведомляет подписчиков — для этого нужен отдельный middleware
    - set({ todos, status }) затирает остальные поля стора, включая саму функцию fetchTodos
  answer: 0
- id: zustand-async-fill-action
  skill: zustand-async-actions
  question: zustand-async-actions
  difficulty: 1
  prompt: "Допишите действие: оно не запускает второй параллельный запрос, а при сбое переводит стор в состояние ошибки."
  explanation: "Действие объявляют `async`, текущее состояние читают через `get()`: оно всегда актуально, а не взято из замыкания. Ошибку ловят в `catch` и переводят стор в 'error', иначе UI зависнет в loading. `finally` здесь не подходит: он выполнился бы и при успехе."
  type: fill-tokens
  language: tsx
  code: |-
    fetchTodos: ___ () => {
      if (___().status === 'loading') return;
      set({ status: 'loading' });
      try {
        const res = await fetch('/api/todos');
        const todos = await res.json();
        set({ todos, status: 'idle' });
      } ___ {
        set({ status: ___ });
      }
    },
  tokens:
    - async
    - get
    - catch
    - "'error'"
  decoys:
    - await
    - getState
    - finally
    - "'idle'"
- id: zustand-async-abort-previous
  skill: zustand-abort-previous-request
  question: zustand-async-actions
  difficulty: 3
  prompt: fetchTodos(filter) могут вызвать снова с новым фильтром, пока старый запрос ещё идёт. Расставьте шаги, чтобы отменять предыдущий запрос, а не игнорировать новый.
  explanation: "Проверка `status === 'loading'` подходит, только когда новый вызов можно отбросить. Если важен последний вызов, старый запрос отменяют через AbortController: хранят его вне React-состояния, вызывают abort() перед новым запросом, передают signal в fetch и не считают AbortError настоящей ошибкой."
  type: order
  kind: recipe
  steps:
    - "Хранить текущий AbortController вне рендера: в переменной модуля или в нереактивном поле стора"
    - В начале действия вызвать abort() у предыдущего контроллера, если он есть
    - Создать новый AbortController и сохранить его как текущий
    - "Вызвать set({ status: 'loading' }) и передать controller.signal в fetch"
    - "После await записать результат через set({ todos, status: 'idle' })"
    - "В catch пропустить AbortError, а при остальных ошибках вызвать set({ status: 'error' })"

# zustand-slices-organization: принято из черновика 2026-11-09
