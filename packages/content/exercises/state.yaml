  explanation: Middleware — это обёртка вокруг `dispatch`. Action идёт по цепочке, и каждое звено решает, что с ним делать, а затем вызывает `next`. Код до `next(action)` видит старый state, код после него — уже новый. Асинхронность живёт в middleware (thunk), потому что reducer обязан быть чистым и синхронным.
  type: quiz
  options:
    - label: "Action идёт по цепочке middleware: каждый может его изменить, задержать или остановить и через next передаёт дальше до reducer"
      why: Верно. Последний `next` в цепочке — это исходный dispatch стора, который вызывает reducer.
    - label: Сначала reducer вычисляет новый state, затем middleware получают action и готовое состояние, как подписчики
      why: Так работают подписчики `subscribe`. Middleware срабатывает до reducer и может вообще не пропустить action. Новый state он видит, только если прочитает его после `next`.
    - label: Все middleware вызываются параллельно с одним и тем же action, а reducer ждёт, пока они завершатся
      why: "Цепочка последовательная: каждый middleware получает `next` следующего звена. Reducer ничего не ждёт — его вызывает последний `next`."
    - label: Middleware только читают action, а для асинхронности reducer может вернуть Promise, который Redux дождётся
      why: Reducer должен быть чистым и синхронным, Redux не ждёт промисы. Асинхронность добавляют именно через middleware, например thunk.
