  explanation: "Хранилище по умолчанию — localStorage, а его нет в React Native. `createJSONStorage(() => AsyncStorage)` превращает асинхронный строковый движок в storage для persist. Остальная механика при этом не меняется: partialize, migrate и флаг гидрации работают как в вебе."
  type: choose-tool
