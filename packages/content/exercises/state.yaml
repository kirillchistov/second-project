- id: redux-toolkit-unstable-selector
  skill: redux-selectors
  question: redux-toolkit
  difficulty: 2
  prompt: Компонент перерисовывается при любом dispatch, даже когда меняется несвязанный слайс. Найдите причину.
  explanation: "`useSelector` после каждого dispatch вызывает селектор и сравнивает результат с прошлым по `===`. `filter` каждый раз создаёт новый массив, поэтому компонент перерисовывается всегда. Варианты исправления: выбирать примитив (`.length`) или мемоизировать селектор через `createSelector`. В dev-режиме React-Redux предупреждает о таких нестабильных селекторах."
  type: find-bug
  language: tsx
  code: |-
    function DoneCount() {
      const done = useAppSelector((s) =>
        s.todos.items.filter((t) => t.done)
      );
      return <span>Готово: {done.length}</span>;
    }
  bugLines:
    - 2
    - 3
  causes:
    - Селектор каждый раз возвращает новый массив, и useSelector по === считает результат изменившимся после любого dispatch
    - Внутри селектора нельзя вызывать методы массивов — можно только читать поля стора
    - useAppSelector нельзя использовать без useDispatch в том же компоненте
    - filter мутирует массив в сторе, и Redux перерисовывает всех подписчиков
  answer: 0
- id: redux-toolkit-server-data-choice
  skill: server-state-choice
  question: redux-toolkit
  difficulty: 2
  prompt: Проект уже на Redux Toolkit. Нужно загрузить список заказов, кешировать его между экранами, показывать статус загрузки и перезапрашивать после создания заказа. Что выбрать?
  explanation: "Серверные данные — это кеш, а не обычное клиентское состояние. В проекте на RTK для них есть RTK Query: кеш, статусы, дедупликация запросов и инвалидация по тегам. Обычные слайсы оставь для клиентского состояния."
  type: choose-tool
  options:
    - label: "RTK Query: createApi с query и mutation, invalidatesTags"
      why: "Лучший выбор: RTK Query уже входит в RTK и живёт в том же сторе. Кеш, isLoading, дедупликация и refetch после мутации через теги есть из коробки."
    - label: createAsyncThunk и слайс со status и items
      why: "Рабочий, но ручной путь: кеш, устаревание, дедупликацию и перезапрос после мутации придётся писать самому. Подходит для разовой асинхронной логики, а не для кеша."
