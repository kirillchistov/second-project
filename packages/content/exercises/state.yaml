  explanation: Серверное состояние — асинхронная копия чужих данных, которая устаревает. Нужны кэш по ключу, дедупликация, фоновое обновление, повторы и инвалидация после мутаций. Когда эти данные уходят в TanStack Query, глобального клиентского состояния обычно остаётся мало.
  type: quiz
  options:
    - label: "Серверное — копия чужих данных: асинхронна, может устареть, нужна многим. Ей нужны кэш, дедупликация, фоновое обновление"
      why: Верно. Отсюда и набор задач — кэш по ключу, stale-while-revalidate, повторы, инвалидация. Писать это руками в useEffect долго и с багами.
    - label: Серверное состояние — то, что хранится глобально, а клиентское — локально в компоненте
      why: "Глобальность ни при чём: тема или открытый сайдбар могут быть глобальными, но остаются клиентскими. Важно, кому принадлежат данные и могут ли они устареть."
    - label: TanStack Query — это глобальный стор вроде Redux, просто с меньшим количеством бойлерплейта
      why: Это не стор для произвольного стейта, а кэш асинхронных данных. Класть туда состояние модалки или текста в поле — не по назначению.
    - label: "Разницы нет: TanStack Query нужен только для того, чтобы не писать isLoading и error вручную"
      why: Флаги загрузки — мелочь. Главное — общий кэш, дедупликация, отмена, обновление при фокусе и восстановлении сети, инвалидация после мутаций.
