# zustand-persist: принято из черновика 2026-11-09
- id: zustand-persist-ssr-mismatch
  skill: zustand-persist-hydration
  question: zustand-persist
  difficulty: 2
  prompt: Next.js-приложение, стор с `persist` хранит тему в localStorage. Почему опасно сразу рендерить `theme` из стора в клиентском компоненте?
  explanation: "Сервер не видит localStorage и рендерит значения по умолчанию. С синхронным localStorage клиентский стор восстанавливается ещё при создании, поэтому первый клиентский рендер не совпадает с HTML. Это ошибка гидрации React. Надёжный приём — `skipHydration: true` и вызов `persist.rehydrate()` в useEffect. Другой вариант — показывать сохранённое значение только после монтирования."
  type: quiz
  options:
    - label: На сервере нет localStorage, и HTML собран с дефолтом. Клиентский стор может быть уже восстановлен — первый рендер не совпадёт
      why: Верно. Это ошибка гидрации React, а не только логики. Помогает skipHydration + rehydrate() в useEffect или показ значения после монтирования.
    - label: persist на сервере обращается к localStorage и падает с ReferenceError
      why: "Нет: persist обращается к storage безопасно. Если хранилища нет, состояние просто не восстанавливается, и сервер рендерит значения по умолчанию."
    - label: persist сериализует экшены, и после перезагрузки они становятся undefined
      why: Функции в JSON не попадают. При восстановлении сохранённые данные сливаются с текущим состоянием, поэтому экшены остаются из инициализатора.
    - label: "Опасности нет: React сам подставит значение из localStorage до гидрации"
      why: React ничего не знает о localStorage. Он только сверяет первый клиентский рендер с серверным HTML и сообщает о расхождении.
  answer: 0
- id: zustand-persist-shape-change
