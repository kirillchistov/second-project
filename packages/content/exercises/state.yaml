  explanation: "Обёртку снимает `transformResponse`: он срабатывает один раз на ответ, и в кэше сразу лежит `Todo[]`. В хуке `selectFromResult` возвращает только `title`, поэтому компонент перерисуется лишь при изменении этой строки. У запроса без аргумента первым параметром передаётся `undefined`. Опция `select` относится к TanStack Query, а не к RTK Query."
  type: fill-tokens
  language: tsx
  code: |-
    getTodos: builder.query<Todo[], void>({
      query: () => 'todos',
      ___: (res: { data: Todo[] }) => res.___,
    }),

    // в компоненте
    const { title } = useGetTodosQuery(___, {
