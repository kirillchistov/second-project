  explanation: "Слайсы разносят по файлам **определение** стора. Сам стор остаётся один, хук `useStore` — тоже один. Каждый слайс типизирован на весь `StoreState` и получает общие `set`/`get`. Поэтому изоляция между слайсами — договорённость, а не гарантия. Неймспейсов тоже нет: поля всех слайсов лежат на одном уровне."
  type: quiz
  options:
    - label: "Один стор и один хук: слайсы — функции (set, get, api) => ({...}), их результаты объединяют spread-ом в одном create()"
      why: Верно. Физически код разнесён по файлам, но в рантайме это один объект состояния с общими set/get.
    - label: Каждый слайс — отдельный стор со своим хуком, а create() связывает их подписками
      why: Так устроен подход «несколько независимых сторов». Слайсы же собираются в один вызов create() и дают один useStore.
    - label: "Слайсы изолированы: set внутри слайса может менять только поля этого слайса"
      why: set и get общие для всего стора, а StateCreator<StoreState, ...> типизирован на весь стор. Слайс может читать и менять чужие поля.
    - label: Каждый слайс получает свой неймспейс, поэтому одинаковые имена полей в разных слайсах не конфликтуют
      why: "Неймспейсов нет: spread кладёт все поля на один уровень, и последний слайс молча перетирает одноимённое поле предыдущего."
  answer: 0
- id: zustand-slices-reset-collision
  skill: zustand-slice-key-collision
  question: zustand-slices-organization
  difficulty: 2
  prompt: "Store = CartSlice & UserSlice. При выходе вызывают useStore.getState().reset(): пользователь сбрасывается, а корзина — нет. Где ошибка?"
  explanation: "Оба слайса объявляют поле `reset`. При сборке spread-ом `userSlice` идёт последним и перетирает `reset` корзины. TypeScript молчит: в пересечении типов обе сигнатуры `() => void` совместимы. Правило: давайте действиям в слайсах уникальные имена (`resetCart`, `resetUser`). Общий сброс делайте отдельным действием, которое явно вызывает оба."
  type: find-bug
  language: tsx
  code: |-
    const cartSlice: StateCreator<Store, [], [], CartSlice> =
      (set) => ({
        items: [],
        reset: () => set({ items: [] }),
      });
    const userSlice: StateCreator<Store, [], [], UserSlice> =
      (set) => ({
        user: null,
        reset: () => set({ user: null }),
      });
    export const useStore = create<Store>()((...a) => ({
      ...cartSlice(...a),
      ...userSlice(...a),
    }));
  bugLines:
    - 4
    - 9
  causes:
    - Оба слайса объявляют поле reset — при spread-объединении reset из userSlice молча перетирает reset корзины
    - set внутри слайса может менять только поля этого слайса, поэтому items не обновляются
    - Слайсы нужно передавать в create() без spread, иначе Zustand теряет их действия
    - Аргументы ...a нельзя передавать сразу в несколько слайсов — второй слайс получает другой set
  answer: 0
- id: zustand-slices-cross-slice-logout
  skill: zustand-cross-slice-actions
  question: zustand-slices-organization
  difficulty: 3
  prompt: В cartSlice есть действие clearCart. Допишите userSlice так, чтобы logout очищал корзину через общий стор, и подключите слайс.
  explanation: Слайс типизирован на **весь** `StoreState`, а не на свою часть. Только так `get()` видит действия других слайсов, в том числе `clearCart`, и не нужен импорт cartSlice — значит, нет циклической зависимости. Все слайсы получают одни и те же аргументы `(set, get, api)` через `...a`. Такую связность между слайсами стоит вводить осознанно.
  type: fill-tokens
  language: tsx
  code: |-
    const createUserSlice: StateCreator<
      ___, [], [], UserSlice
    > = (set, get) => ({
      user: null,
      logout: () => {
        get().___();
        set({ user: null });
      },
    });
    export const useStore = create<StoreState>()((...a) => ({
      ...createCartSlice(...a),
      ...createUserSlice(___),
    }));
  tokens:
    - StoreState
    - clearCart
    - ...a
  decoys:
    - UserSlice
    - CartSlice
    - a
    - reset
- id: zustand-slices-structure-choice
  skill: zustand-store-structure-choice
  question: zustand-slices-organization
  difficulty: 3
  prompt: "Zustand-стор разросся до 600 строк: корзина, пользователь, фильтры. При logout корзина должна очищаться атомарно, а persist и devtools должны остаться одни на всё. Как реорганизовать?"
  explanation: Домены связаны (logout очищает корзину), а middleware должны быть общими. Значит, нужен один стор, определение которого разнесено по слайсам. Отдельные сторы подходят, когда домены действительно независимы. Если стор маленький, слайсы только усложнят код.
  type: choose-tool
  options:
    - label: Слайсы в разных файлах, собранные spread-ом в одном create()
      why: "Лучший вариант: один стор с одним persist/devtools, а связь корзины и пользователя выражается явно через общий get()/set()."
    - label: Несколько независимых create() и синхронизация через subscribe
      why: Подходит для действительно независимых доменов. Здесь связь пришлось бы синхронизировать снаружи, без атомарности, а middleware настраивать для каждого стора.
    - label: Оставить один файл и разбить его комментариями-секциями
      why: Нормально для небольшого стора на пару полей и действий. На 600 строках файл нечитаем и порождает конфликты при параллельной работе.
    - label: Разнести состояние по нескольким React Context
      why: "Context передаёт значения, но не даёт селекторов: любое изменение перерисует всех потребителей. Логику действий и persist придётся писать вручную."
  answer: 0

# zustand-outside-react: принято из черновика 2026-11-09
- id: zustand-outside-react-quiz
  skill: zustand-store-api-outside-react
  question: zustand-outside-react
  difficulty: 3
  prompt: Loader роутера должен проверить токен из Zustand-стора ещё до первого рендера страницы. Почему это вообще возможно?
  explanation: Стор Zustand живёт в модуле, а не в дереве React. Хук — лишь мост к нему через подписку. Вне компонентов читай через `getState()`, пиши через `setState()` или экшены, реагируй на изменения через `subscribe()`. Для полной независимости от React есть `createStore` из `zustand/vanilla`.
  type: quiz
  options:
    - label: У результата create() есть getState/setState/subscribe — они работают с хранилищем напрямую, без рендера и правил хуков
      why: Верно. create() возвращает хук, к которому прикреплено API стора. Стор — обычный объект в модуле, React для доступа к нему не нужен.
    - label: Zustand хранит состояние в React Context, а loader выполняется внутри RouterProvider, поэтому хук там доступен
      why: "Zustand не использует Context по умолчанию: стор — замыкание в модуле. А хук вне компонента нарушает правила хуков, даже если есть провайдер."
    - label: Можно просто вызвать useAuthStore() — хуки Zustand, в отличие от встроенных, разрешено вызывать где угодно
      why: Внутри хук опирается на useSyncExternalStore, поэтому подчиняется правилам хуков. Вызов вне рендера компонента — ошибка.
    - label: "Никак: стор из create() привязан к React, вне компонентов нужен только createStore из zustand/vanilla"
      why: vanilla нужен для полной изоляции от React, например в библиотеке. Но getState и subscribe есть и у стора из create().
  answer: 0
- id: zustand-outside-react-stale-getstate
  skill: zustand-getstate-staleness
  question: zustand-outside-react
  difficulty: 2
  prompt: Пользователь залогинился, но запросы всё равно уходят с `Bearer undefined`. Найдите строку с ошибкой.
  explanation: "`getState()` — разовое чтение, а не подписка. Значение, сохранённое в переменную модуля при импорте, навсегда останется тем, что было в сторе в тот момент. Вызывайте `useAuthStore.getState()` внутри `apiFetch`, в момент использования."
  type: find-bug
  language: ts
  code: |-
    import { useAuthStore } from './authStore';

    const { token } = useAuthStore.getState();

    export function apiFetch(url: string) {
      return fetch(url, {
        headers: { Authorization: `Bearer ${token}` },
      });
    }
  bugLines:
    - 3
  causes:
    - "token читается один раз при загрузке модуля: getState() не создаёт подписку, и после логина значение не обновится"
    - getState() нельзя вызывать вне компонента — здесь нужен хук useAuthStore()
    - Деструктуризация результата getState() отключает реактивность всего стора
    - Токен нужно записывать в стор через setState прямо перед fetch
  answer: 0
- id: zustand-outside-react-ws-subscribe
  skill: zustand-subscribe-cleanup
  question: zustand-outside-react
  difficulty: 2
  prompt: "Подключите WebSocket к стору без компонентов: входящие сообщения пишутся в стор, изменение typing отправляется на сервер, а функция отключения убирает всё за собой."
  explanation: В обработчике события берём актуальные экшены через `getState()`. `subscribe((state, prev) => …)` вызывается при каждом изменении стора. Вне React никто не сделает cleanup за вас, поэтому отписку нужно вызвать вручную вместе с закрытием сокета.
  type: fill-tokens
  language: ts
  code: |-
    export function connectChat(url: string) {
      const ws = new WebSocket(url);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        useChatStore.___().addMessage(msg);
      };
      const unsub = useChatStore.___((s, prev) => {
        if (s.typing !== prev.typing) {
          ws.send(JSON.stringify({ t: s.typing }));
        }
      });
      return () => { ___(); ws.close(); };
    }
  tokens:
    - getState
    - subscribe
    - unsub
  decoys:
    - setState
    - useStore
    - destroy
- id: zustand-outside-react-vanilla-widgets
  skill: zustand-vanilla-store
  question: zustand-outside-react
  difficulty: 3
  prompt: "Библиотека виджетов: состояние нужно и в vanilla-JS части без React, и в React-обёртке. На одной странице может быть несколько независимых виджетов. Как устроить стор?"
  explanation: "Правило: стор без знания о React — `createStore` из `zustand/vanilla`. Компоненты подключаются к нему через `useStore(store, selector)`. Несколько экземпляров — фабрика, которая создаёт стор на каждый виджет и передаёт его через Context, а не модульный синглтон."
  type: choose-tool
  options:
    - label: Фабрика createStore из zustand/vanilla на каждый виджет, в React — useStore(store, selector) через Context
      why: Стор не зависит от React и работает в vanilla-части. Отдельный экземпляр на виджет даёт изоляцию, а хук подключается только там, где нужен.
    - label: Один глобальный стор через create() из zustand
      why: Подходит для приложения с единственным экземпляром. Здесь модульный синглтон смешает состояние всех виджетов на странице.
    - label: useReducer + React Context внутри каждого виджета
      why: "Изоляцию даёт, но состояние заперто в дереве React: vanilla-JS части до него не добраться без костылей."
    - label: Глобальный Redux Toolkit store с ключом виджета в слайсе
      why: Годится для большого приложения на Redux. Для библиотеки это тяжёлая зависимость и общий стор вместо изолированных экземпляров.
  answer: 0
