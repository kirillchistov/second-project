    - B с теми же аргументами добавляет вторую подписку, новый запрос не уходит
    - "Приходит ответ: action fulfilled, данные под ключом getTodo(1) видят оба"
    - Оба размонтировались, подписчиков ноль — стартует таймер keepUnusedDataFor
