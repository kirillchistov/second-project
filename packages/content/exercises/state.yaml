    if (!mutex.___()) {
      const release = await mutex.___();
      try {
        const r = await raw('/auth/refresh', api, extra);
        if (r.data) {
          api.dispatch(tokenRefreshed(r.data));
          result = await raw(args, api, extra);
        } else api.dispatch(loggedOut());
      } finally { ___(); }
    } else {
      await mutex.___();
      result = await raw(args, api, extra);
    }
  tokens:
    - isLocked
    - acquire
    - release
    - waitForUnlock
  decoys:
    - lock
    - unlock
    - isBusy
    - runExclusive
- id: rtk-query-reauth-mutex-recipe
  skill: rtk-query-refresh-mutex
  question: rtk-query-reauth
  difficulty: 3
  prompt: Страница одновременно запускает три query, и токен уже истёк. Расставьте шаги baseQuery с Mutex по порядку.
  explanation: Перед запросом нужно дождаться, пока завершится уже идущий refresh, иначе запрос уйдёт со старым токеном. Refresh выполняет только тот запрос, который захватил mutex. Если refresh упал — `loggedOut` вместо повтора, иначе получится цикл. Освобождение в finally гарантирует, что остальные запросы не зависнут.
  type: order
  kind: recipe
  steps:
    - Дождаться разблокировки mutex (waitForUnlock), если refresh уже идёт
    - Выполнить исходный запрос через raw baseQuery
    - При 401 и свободном mutex захватить его (acquire) и отправить refresh
    - "Успех: dispatch нового токена и повтор запроса; неудача: dispatch(loggedOut)"
    - Освободить mutex в finally, чтобы ждущие запросы повторились с новым токеном

