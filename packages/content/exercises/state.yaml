  question: websocket-reconnect
  difficulty: 2
  prompt: Расставьте шаги надёжного переподключения к WebSocket без потери сообщений.
  explanation: "Cursor копят заранее, иначе после разрыва не с чего продолжить. Разрыв приходит в onclose: там планируют попытку с backoff, потолком и jitter, чтобы клиенты не ударили по серверу разом. В onopen сбрасывают счётчик, запускают heartbeat и шлют resume с cursor. Ответ применяют, отбрасывая дубликаты по id: события на границе разрыва могут прийти повторно."
  type: order
