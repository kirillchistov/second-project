  difficulty: 2
  prompt: Reducer написан вручную, без createSlice. После todos/added список на экране не обновляется, а перемотка в DevTools назад не возвращает старый список. Где ошибка?
  explanation: "push мутирует существующий массив, и reducer возвращает ту же ссылку. useSelector видит прежнюю ссылку и не перерисовывает компонент, а прошлые состояния в истории указывают на тот же изменённый массив, поэтому перемотка «портится». Нужно вернуть новый объект: { ...state, items: [...state.items, action.payload] }."
  type: find-bug
  language: js
  code: |-
    function todosReducer(state = initial, action) {
      switch (action.type) {
        case 'todos/added':
          state.items.push(action.payload);
          return state;
        default:
          return state;
      }
    }
  bugLines:
    - 4
    - 5
  causes:
    - Reducer мутирует текущий state и возвращает ту же ссылку — прошлые шаги истории и подписчики видят один изменённый объект
    - В default нужно выбрасывать ошибку, иначе DevTools не отличит неизвестный action
    - DevTools видит только actions, созданные через createAction, а строковый type он не отслеживает
    - "В configureStore нужно явно передать devTools: true, иначе перемотка не работает"
