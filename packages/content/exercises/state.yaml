      why: "Худший вариант: гонки запросов, отсутствие кеша и дублирование логики в каждом компоненте. Это классическая ошибка «серверные данные вручную в Redux»."
    - label: Добавить TanStack Query рядом с Redux
      why: Отличный инструмент для серверного состояния. Его стоит брать, если Redux в проекте нет. Здесь же RTK уже подключён, и вторая библиотека кеша дублирует RTK Query.
  answer: 0

# state-machines: принято из черновика 2026-10-11
- id: state-machines-when-to-use
  skill: state-machine-when
  question: state-machines
  difficulty: 3
  prompt: В каком случае стоит описывать логику UI как конечный автомат?
  explanation: Главный сигнал — флаги начинают противоречить друг другу, а переходы зависят от текущего состояния. Автомат перечисляет состояния, события и допустимые переходы, поэтому невозможное состояние нельзя даже записать. Для простого случая хватит `useReducer` с discriminated union, для сложного подойдёт XState.
  type: quiz
  options:
    - label: Много состояний и переходов, а булевы флаги допускают невозможные комбинации вроде isLoading && isError
      why: Верно. Автомат делает такие комбинации непредставимыми, а переходы задаёт явно. Логику можно визуализировать и тестировать отдельно от UI.
    - label: Компонент часто перерисовывается, а автомат сокращает число рендеров
      why: Автомат — это про корректность логики, а не про производительность. Число рендеров зависит от того, как меняется state, а не от того, как он смоделирован.
    - label: Как только в компоненте больше двух useState, их лучше заменить машиной XState
      why: Это типичный перегиб. Для простых независимых флагов XState — лишняя церемония. Критерий — связанные состояния и переходы, а не количество хуков.
    - label: Состояние нужно разделить между многими компонентами, и автомат заменяет глобальный стор
      why: Шаринг состояния решают Context, Zustand или Redux. Автомат описывает допустимые переходы, а где он хранится — отдельный вопрос.
  answer: 0
- id: state-machines-switch-on-event
  skill: state-dependent-transitions
  question: state-machines
  difficulty: 2
  prompt: После успешной загрузки запоздалое событие PROGRESS возвращает UI в состояние uploading. Где корень проблемы?
  explanation: Редьюсер ветвится только по событию, поэтому любое событие срабатывает в любом состоянии. В автомате переход определяется парой «текущее состояние + событие». Нужно делать switch по `state.status` и внутри разрешать только допустимые события, а остальные игнорировать, возвращая `state`.
  type: find-bug
  language: tsx
  code: |-
    function reducer(state: State, e: Event): State {
      switch (e.type) {
        case 'START':
          return { status: 'uploading', progress: 0 };
        case 'PROGRESS':
          return { status: 'uploading', progress: e.value };
        case 'SUCCESS':
          return { status: 'done', url: e.url };
        case 'FAIL':
          return { status: 'error', message: e.message };
        default:
          return state;
      }
    }
  bugLines:
    - 2
  causes:
    - Переход выбирается только по событию без учёта текущего состояния, поэтому PROGRESS срабатывает и в done
    - В ветке PROGRESS нужно спредить ...state, иначе теряются остальные поля
    - В default нужно бросать ошибку, а не возвращать state
    - Редьюсер должен мутировать state, чтобы React не создавал лишний объект
  answer: 0
- id: state-machines-ignored-events
  skill: state-dependent-transitions
  question: state-machines
  difficulty: 2
