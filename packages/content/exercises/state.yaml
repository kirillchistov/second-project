  difficulty: 2
  prompt: В прошлом релизе `user` хранился строкой, теперь это объект `User`. После обновления у старых пользователей Greeting падает с TypeError. Где ошибка?
  explanation: persist восстанавливает то, что лежит в хранилище, не проверяя форму данных. Старая строка попадает в `user`, `user.name` равно undefined, и вызов `.toUpperCase()` падает. При изменении формы данных нужно поднять `version` и написать `migrate`, который приведёт старые данные к новому формату.
