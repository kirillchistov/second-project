- id: rtk-query-select-new-array
  skill: rtk-query-select-memoization
  question: rtk-query-transform-select
  difficulty: 3
  prompt: "`TodoList` обёрнут в `memo`, но перерисовывается при каждом refetch, даже когда список выполненных задач не изменился. Найдите причину."
  explanation: Хук сравнивает объект из `selectFromResult` поверхностно. `filter` и `?? []` при каждом пересчёте создают новый массив, поэтому сравнение не проходит. Пересчёт происходит, например, когда `isFetching` меняется при refetch. Решение — мемоизированный селектор `createSelector` от `data`. Благодаря structural sharing ссылка на `data` остаётся прежней, если содержимое не изменилось.
  type: find-bug
  language: tsx
  code: |-
    function DoneTodos() {
      const { done, isLoading } = useGetTodosQuery(
        undefined,
        {
          selectFromResult: ({ data, isLoading }) => ({
            isLoading,
            done: data?.filter((t) => t.done) ?? [],
          }),
        },
      );
      if (isLoading) return <Spinner />;
      return <TodoList items={done} />;
    }
  bugLines:
    - 7
  causes:
    - filter и ?? [] создают новый массив при каждом пересчёте, и поверхностное сравнение результата всегда видит изменение
    - isLoading нельзя возвращать из selectFromResult — из-за этого хук теряет мемоизацию
    - Функцию selectFromResult нужно обернуть в useCallback, иначе хук пересоздаёт подписку
    - Фильтрацию нужно перенести в transformResponse, selectFromResult не умеет работать с массивами
  answer: 0
- id: rtk-query-row-subscription
  skill: rtk-query-select-from-result
  question: rtk-query-transform-select
  difficulty: 2
  prompt: "Таблица на 500 строк: каждая `<TodoRow id={id} />` показывает одну задачу из общего запроса `getTodos`. При переключении чекбокса в одной строке перерисовываются все 500. Что сделать?"
  explanation: Когда много компонентов подписаны на один запрос, а каждому нужна своя часть, используй `selectFromResult`. Хук перерисует компонент, только если изменилась выбранная им часть. Structural sharing в RTK Query сохраняет ссылки на неизменённые элементы, поэтому `find` вернёт тот же объект.
  type: choose-tool
  options:
    - label: "selectFromResult в TodoRow: вернуть { todo: data?.find((t) => t.id === id) }"
      why: Лучший вариант. Строка подписана только на свой элемент. После обновления у остальных задач ссылки прежние, и их строки не перерисовываются.
    - label: transformResponse, превращающий массив в объект по id
      why: Ускорит поиск по id, но каждая строка всё равно подписана на весь результат и перерисуется. Полезно в дополнение к selectFromResult, а не вместо него.
    - label: useMemo в TodoRow поверх data.find(...)
      why: "useMemo экономит вычисление, но не перерисовку: хук вернёт новый data, и компонент уже отрендерится. Мемоизация внутри рендера не отменяет сам рендер."
    - label: Отдельный запрос getTodo(id) в каждой строке
      why: Даст 500 запросов и 500 записей в кэше вместо одной. Уместно, когда элемент грузят отдельно, например на странице деталей задачи.
  answer: 0

# when-not-redux: принято из черновика 2026-11-07
- id: when-not-redux-server-cache-quiz
  skill: server-vs-client-state
  question: when-not-redux
  difficulty: 2
  prompt: Команда загружает список товаров в `useEffect` и кладёт его в Redux-слайс. В чём главная проблема такого подхода?
  explanation: "Сначала спросите: где источник истины? Если на сервере, это кэш, и нужен инструмент для серверного состояния: TanStack Query или RTK Query. Redux-слайсы нужны для клиентского состояния без серверного оригинала: выбранный элемент, открытая панель, активный фильтр."
  type: quiz
  options:
    - label: "Это кэш ответа сервера: устаревание, повторные запросы, фоновое обновление и инвалидацию придётся писать вручную"
      why: Верно. У серверных данных источник истины на сервере. TanStack Query и RTK Query решают эти задачи из коробки, а в слайсе это самописный код.
    - label: "Redux медленный: любое изменение стора перерисовывает всё приложение"
      why: Заблуждение. `useSelector` подписывает компонент только на выбранный кусок стора, и перерисовываются лишь те, чей селектор вернул новое значение.
    - label: "Асинхронные данные в Redux положить нельзя: редьюсер обязан быть синхронным"
      why: Редьюсер действительно синхронный, но асинхронность решают thunk-и или RTK Query. Положить данные можно, вопрос в том, стоит ли.
    - label: "Проблемы нет: всё состояние в одном сторе — это единообразие и предсказуемость"
      why: Это типичная ловушка. Единообразие не окупает ручной кэш и бойлерплейт, если данные принадлежат серверу или нужны одному компоненту.
  answer: 0
- id: when-not-redux-local-form-ui
  skill: state-colocation
  question: when-not-redux
  difficulty: 1
  prompt: Форма оформления заказа. Флаг «открыта ли модалка подтверждения» и выбранный способ доставки нужны только самой форме и двум её дочерним компонентам. Где хранить это состояние?
  explanation: Состояние держат как можно ближе к месту использования. Пока его читают компонент и пара детей, хватит `useState` и props. Глобальный стор «для единообразия» добавляет связность и бойлерплейт, но ничего не даёт взамен.
  type: choose-tool
  options:
    - label: useState в форме + props детям
      why: "Лучший выбор: состояние локальное, потребителей двое, передать props тривиально. Состояние живёт и умирает вместе с формой."
    - label: Слайс Redux Toolkit
      why: Оправдан, когда это состояние читают и меняют многие несвязанные части дерева. Здесь будут только лишние action-ы и ручной сброс при уходе со страницы.
    - label: Context + useReducer
      why: Пригодится, если props пришлось бы протаскивать через много уровней или переходов состояния много. Для двух прямых детей это избыточно.
    - label: Глобальный стор Zustand
      why: Подходит для клиентского состояния, которое разделяют далёкие компоненты. Локальный UI-флаг формы в глобальном сторе переживёт размонтирование и протечёт.
  answer: 0
- id: when-not-redux-editor-shared-state
  skill: global-store-choice
  question: when-not-redux
  difficulty: 2
  prompt: Редактор документов. Выделение, историю undo/redo и состояние панелей читают и меняют тулбар, канвас, сайдбар и горячие клавиши. Изменения частые. Каждое изменение нужно логировать и воспроизводить баги в DevTools. Что выбрать?
  explanation: Redux оправдан, когда клиентское состояние разделяют многие несвязанные части дерева и важна трассируемость. Тогда нужен единый способ изменения через action-ы, которые можно залогировать, протестировать и прокрутить в DevTools. Серверные данные при этом всё равно лучше держать в query-кэше.
  type: choose-tool
  options:
    - label: Redux Toolkit
      why: "Лучший выбор: клиентское состояние с многими несвязанными читателями и писателями. Action-ы дают лог, тесты редьюсеров, time-travel в DevTools и удобный undo/redo."
    - label: TanStack Query
      why: "Нужен для серверного состояния: кэш, refetch, инвалидация. У выделения и undo нет источника истины на сервере, поэтому это не его задача."
    - label: Context + useReducer
      why: Годится для редко меняющихся данных у нескольких потребителей. При частых изменениях перерисует всех потребителей, а DevTools и middleware для логов нет.
    - label: useState в корне + props
      why: Хватает, когда потребителей мало и они рядом. Здесь props придётся тянуть через всё дерево, а изменения нельзя отследить централизованно.
  answer: 0
- id: when-not-redux-placement-recipe
  skill: state-placement-algorithm
  question: when-not-redux
  difficulty: 2
  prompt: Расставьте по порядку вопросы, которые стоит задать себе, решая, где хранить новое состояние.
  explanation: "Сначала отсейте серверное состояние: это кэш, и для него нужен query-инструмент. Остальное держите локально и поднимайте выше только при реальной нужде: сначала в Context, затем в глобальный стор. Глобальный стор — последняя ступень, а не вариант по умолчанию."
  type: order
  kind: recipe
  steps:
    - Есть ли источник истины на сервере? Да — TanStack Query или RTK Query
    - Нужно ли оно одному компоненту и его детям? Да — useState и props
    - Читают ли его несколько далёких компонентов, но меняется оно редко? Да — Context
    - Меняют ли его часто многие несвязанные части и нужна ли трассировка? Да — Zustand или Redux

