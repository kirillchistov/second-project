  prompt: "Какая формулировка точнее всего описывает модель Cache Components в Next.js (флаг `cacheComponents: true`)?"
  explanation: "Cache Components переворачивают старую модель: по умолчанию всё динамично, кэшируется только помеченное `'use cache'`. Кэшируемое пререндерится в статическую оболочку, а динамика внутри `<Suspense>` стримится при запросе (PPR). Кэш виден в коде."
  type: quiz
  options:
    - label: Всё динамично по умолчанию, кэшируется только помеченное 'use cache'; оно идёт в статическую оболочку, а динамика в Suspense стримится
      why: "Верно. Явное кэширование плюс Partial Prerendering: одна страница сочетает пререндеренную оболочку и динамические части."
    - label: Next.js автоматически кэширует все fetch, а директива 'use cache' нужна, чтобы точечно управлять или отключать этот кэш
      why: "Это смесь со старой моделью App Router. В Cache Components неявного кэширования fetch нет: без 'use cache' данные запрашиваются при каждом запросе."
    - label: "'use cache' сохраняет результат в браузере, как useMemo, чтобы не повторять запрос при клиентской навигации"
      why: "Это серверный кэш: результат переиспользуется между запросами разных пользователей. Поэтому персональные данные туда класть нельзя."
    - label: "'use cache' делает всю страницу статической, как ISR, а без него страница целиком рендерится при каждом запросе"
      why: Граница проходит не по странице, а по компонентам и функциям. Статическая оболочка и динамические части в Suspense живут на одной странице.
  answer: 0
