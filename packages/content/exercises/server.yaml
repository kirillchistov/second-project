- id: server-functions-not-for-reads
  skill: server-functions-use-cases
  question: server-functions
  difficulty: 2
  prompt: "Next.js App Router: при открытии страницы поста нужно показать комментарии. Важны SEO и минимум клиентского JS, обновлять данные в реальном времени не нужно. Что выбрать?"
  explanation: Server Functions нужны для мутаций. Это POST-запросы, фреймворк выполняет их последовательно, и они не встраиваются в серверный рендер. Начальную загрузку данных делает async Server Component. Клиентский фетчинг нужен, когда данные надо обновлять интерактивно.
  type: choose-tool
  options:
    - label: async Server Component, который читает данные через слой доступа к БД
      why: "Лучший вариант: данные приходят прямо в HTML, клиентского JS для загрузки нет, SEO работает из коробки. Проверку доступа держим в слое данных."
    - label: Server Function, вызванная из useEffect в клиентском компоненте
      why: "Антипаттерн: функции рассчитаны на мутации и выполняются последовательно, а данные появятся только после гидрации. Нет ни SSR, ни кэша."
    - label: Route Handler и fetch в useEffect
      why: Подходит, если тот же API нужен внешним клиентам, например мобильному приложению. Для этой страницы это лишний водопад запросов и клиентский JS.
    - label: TanStack Query на клиенте поверх Route Handler
      why: Подходит, если нужны polling, refetch при фокусе или оптимистичные обновления. Для статичного показа при открытии это избыточно.
  answer: 0

# streaming-ssr: принято из черновика 2026-10-11
- id: streaming-ssr-quiz
  skill: streaming-ssr-basics
  question: streaming-ssr
  difficulty: 3
  prompt: Чем стриминговый SSR с выборочной гидрацией лучше связки `renderToString` + `hydrateRoot`?
  explanation: "Стриминг разрывает «водопад» классического SSR: всё получить → всё отрендерить → весь JS загрузить → всё гидрировать. Единица независимости — Suspense-граница. Она отдельно приходит в HTML и отдельно гидрируется. Приоритет получает та часть, с которой взаимодействует пользователь."
  type: quiz
  options:
    - label: Оболочка с fallback-ами уходит сразу, готовые границы досылаются позже, а гидрация идёт по границам — сначала та, где был клик
      why: Верно. TTFB не ждёт медленных данных. Гидрация не ждёт весь HTML и JS. Границу, по которой кликнули, React гидрирует вне очереди и воспроизводит событие.
    - label: HTML приходит по частям, но гидрация стартует, только когда пришёл весь HTML и загрузился весь JS
      why: "Это гидрация по модели классического SSR: «всё или ничего». Выборочная гидрация гидрирует готовые границы, не дожидаясь остальных."
    - label: Сервер отдаёт пустой HTML, а контент рендерится на клиенте кусками по мере загрузки чанков
      why: "Это CSR с code splitting. При стриминге в HTML приходит реальная разметка: сначала оболочка, затем содержимое границ."
    - label: Сервер рендерит компоненты параллельно в нескольких потоках, поэтому HTML готов быстрее
      why: "Стриминг не распараллеливает рендер. Он не ждёт медленные части: отдаёт на их месте fallback и досылает HTML позже."
  answer: 0
- id: streaming-ssr-timeline
  skill: streaming-ssr-timeline
  question: streaming-ssr
  difficulty: 3
  prompt: На странице есть медленная Suspense-граница с отзывами. client.js загрузился уже после прихода всего HTML, а пользователь кликнул по отзывам во время гидрации. Расставьте события по порядку.
  explanation: "Сначала уходит оболочка: onShellReady → pipe. Потом сервер досылает HTML границ вместе с инлайн-скриптами, которые подменяют fallback. Гидрация начинается после загрузки JS. Клик по ещё не гидрированной границе повышает её приоритет, и React воспроизводит событие после гидрации."
  type: order
  kind: timeline
  steps:
    - "Оболочка отрендерена: срабатывает onShellReady, и pipe(res) начинает отдавать HTML"
    - Браузер показывает оболочку с fallback вместо отзывов
    - "Данные готовы: сервер досылает HTML отзывов с инлайн-скриптом"
    - Инлайн-скрипт заменяет fallback на готовую разметку
    - Загружается client.js, hydrateRoot запускает гидрацию
    - "Клик по отзывам: React гидрирует эту границу первой и воспроизводит событие"
- id: streaming-ssr-shell-blocked
  skill: streaming-ssr-suspense-boundaries
  question: streaming-ssr
  difficulty: 2
  prompt: Reviews и Recommendations читают медленные данные через use(). Отзывы грузятся 3 с, и TTFB страницы тоже стал 3 с, хотя используется renderToPipeableStream. Найдите строку с причиной.
  explanation: "Оболочка — это всё, что не внутри Suspense-границы. Reviews приостанавливается снаружи границы, поэтому onShellReady ждёт его данные, и стриминг ничего не даёт. Правило: каждую часть с медленными данными оборачивайте в свою Suspense-границу."
  type: find-bug
  language: tsx
  code: |-
    function Page() {
      return (
        <Layout>
          <Header />
          <Reviews />
          <Suspense fallback={<Spinner />}>
            <Recommendations />
          </Suspense>
        </Layout>
      );
    }
  bugLines:
    - 5
  causes:
    - Reviews приостанавливается вне Suspense-границы и становится частью оболочки, поэтому onShellReady ждёт его данные
    - Recommendations внутри Suspense блокирует отправку оболочки, пока не загрузится
    - Header рендерится синхронно, поэтому стрим не начинается до конца рендера страницы
    - Layout должен быть внутри Suspense, иначе стриминг отключается
  answer: 0
- id: streaming-ssr-bots
  skill: streaming-ssr-seo
  question: streaming-ssr
  difficulty: 3
  prompt: Страница каталога отдаётся через renderToPipeableStream. Поисковым ботам нужен полный HTML всех Suspense-границ в одном ответе, а люди должны и дальше получать быстрый стрим. Что сделать?
  explanation: onShellReady даёт ранний TTFB для людей. onAllReady срабатывает, когда готовы все границы, — подходит ботам и случаям, где нужен итоговый статус-код. Стрим можно настроить под user-agent, не отказываясь от Suspense.
  type: choose-tool
  options:
    - label: Для ботов вызывать pipe(res) в onAllReady, для остальных — в onShellReady
      why: Лучший вариант. Бот получает полный HTML, а заодно можно выставить статус по итогам рендера. Люди по-прежнему получают оболочку сразу.
    - label: Перейти на renderToString для всех запросов
      why: Стриминг пропадёт для всех. К тому же renderToString не ждёт данных Suspense и отдаёт fallback. Подходит только для простых страниц без асинхронных данных.
    - label: Убрать Suspense-границы, чтобы всё попало в оболочку
      why: Бот получит всё, но и люди будут ждать самых медленных данных. Оправдано, только если медленных частей на странице нет.
    - label: Увеличить таймаут перед abort() до 30 секунд
      why: Таймаут лишь ограничивает, сколько ждать отложенные части. Бот всё равно получит HTML по частям с fallback-ами. Таймаут нужен как страховка, а не для SEO.
  answer: 0

# app-router-conventions: принято из черновика 2026-10-13
- id: app-router-layout-persistence
  skill: app-router-layout-vs-template
  question: app-router-conventions
  difficulty: 2
  prompt: В `app/dashboard/layout.tsx` есть сайдбар — клиентский компонент с `useState`. Пользователь раскрыл в нём секцию и через `<Link>` перешёл с `/dashboard` на `/dashboard/42`. Что произойдёт?
  explanation: Layout — общая обёртка сегмента. При навигации между дочерними маршрутами он не перемонтируется, а меняется только `page`. Если обёртка должна создаваться заново при каждом переходе (сброс состояния, анимация входа, повтор эффектов), нужен `template.tsx`.
  type: quiz
  options:
    - label: "Layout не перемонтируется: состояние сайдбара сохранится, заменится только содержимое page"
      why: Верно. Layout сохраняется при навигации между дочерними страницами, React не размонтирует его поддерево.
    - label: Layout перемонтируется при каждом переходе, и раскрытая секция свернётся
      why: Так ведёт себя `template.tsx`. Layout для этого и нужен, чтобы не перемонтироваться.
    - label: Состояние сохранится, только если обернуть сайдбар в `memo`
      why: "`memo` пропускает лишние ререндеры, но на монтирование не влияет. Состояние сохраняется потому, что layout остаётся смонтированным."
    - label: Страница перезагрузится целиком, потому что `[projectId]` — динамический сегмент
      why: "`<Link>` выполняет клиентскую навигацию для любых сегментов, в том числе динамических. Полной перезагрузки нет."
  answer: 0
