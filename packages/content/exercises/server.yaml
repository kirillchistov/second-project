# server-runtimes: принято из черновика 2026-10-13
- id: server-runtimes-edge-far-db
  skill: edge-vs-db-latency
  question: server-runtimes
  difficulty: 3
  prompt: SSR каталога перенесли с serverless во Франкфурте на edge-функции. Postgres остался во Франкфурте. Пользователи из Азии говорят, что страница стала грузиться медленнее. В чём главная причина?
  explanation: "Edge выигрывает только на первом участке — до пользователя. Если рендер ходит в базу в одном регионе, каждый запрос пересекает континенты, а цепочка запросов умножает задержку. Правило: edge — для лёгких решений без базы, а SSR с данными размещают рядом с базой."
  type: quiz
  options:
    - label: Каждый запрос к базе из точки рядом с пользователем идёт через полмира, а цепочка из нескольких запросов умножает эту задержку
      why: Верно. Один round-trip Азия–Франкфурт стоит 150–250 мс. При 4 последовательных запросах это уже около секунды, а раньше было несколько мс внутри региона.
    - label: У edge-функций долгий холодный старт, его и замечают пользователи
      why: "Наоборот: edge стартует за единицы мс. Долгий холодный старт — проблема serverless-функций, а не edge."
    - label: Edge-рантайм выполняет JavaScript заметно медленнее, чем Node
      why: Изоляты V8 исполняют JS не медленнее Node. Урезан набор API, а не скорость. Сам рендер почти не изменился, выросла сетевая задержка.
    - label: Edge-функции не умеют кешировать ответы, поэтому каждый рендер идёт с нуля
      why: Кеширование на CDN и в edge есть. К тому же и без кэша рендер был бы быстрым, если бы данные лежали рядом.
  answer: 0
- id: server-runtimes-spiky-ssr
  skill: runtime-choice
  question: server-runtimes
  difficulty: 2
  prompt: SSR-страницы и API интернет-магазина, Postgres в одном регионе. Ночью трафика почти нет, в распродажи он вырастает в 50 раз. WebSocket и долгих задач нет. Где запускать?
  explanation: "Неравномерная нагрузка, типичный SSR и API, база в одном регионе — это serverless в регионе базы. Пулер обязателен: каждый экземпляр функции открывает свои соединения. Edge оправдан без базы, долгоживущий сервер — для real-time и стабильной высокой нагрузки."
  type: choose-tool
  options:
    - label: Serverless в регионе базы + пулер соединений (PgBouncer, Data API)
      why: Автомасштабирование под пики, почти ноль затрат в простое, база рядом. Пулер не даст сотням экземпляров исчерпать лимит соединений Postgres.
    - label: Serverless-функции с прямым подключением к Postgres
      why: Подход тот же, но на распродаже тысячи экземпляров откроют свои соединения и упрутся в max_connections. Годится только при малом трафике.
    - label: Edge-функции во всех точках CDN
      why: Хороши для редиректов, A/B и проверки токена без базы. Здесь каждый рендер ходит в базу в одном регионе, и выигрыш от близости к пользователю теряется.
    - label: Долгоживущий Node-кластер с автоскейлером
      why: Подошёл бы при стабильной высокой нагрузке, WebSocket или фоновых задачах. Здесь придётся держать запас мощности под пики и обслуживать кластер самому.
  answer: 0
- id: server-runtimes-memory-rate-limit
  skill: serverless-stateless
  question: server-runtimes
  difficulty: 2
  prompt: Route handler развёрнут как serverless-функция. Лимит в 10 запросов с IP на нагрузке почти не срабатывает, а иногда внезапно обнуляется. Окно сброса опущено для краткости. Где ошибка?
  explanation: Состояние в памяти модуля живёт только внутри одного экземпляра функции. Параллельные экземпляры считают каждый своё, а при холодном старте или масштабировании счётчик пропадает. Общее состояние между запросами (лимиты, сессии, кэш) выносят во внешнее хранилище, например Redis или Upstash.
  type: find-bug
  language: ts
  code: |-
    const hits = new Map<string, number>();

    export async function POST(req: Request) {
      const ip = req.headers.get('x-real-ip') ?? '';
      const count = (hits.get(ip) ?? 0) + 1;
      hits.set(ip, count);
      if (count > 10) {
        return new Response('Too many', { status: 429 });
      }
      return Response.json(await createOrder(req));
    }
  bugLines:
    - 1
  causes:
    - "Счётчик хранится в памяти экземпляра: параллельные экземпляры не видят друг друга, а при новом старте он пропадает"
    - В serverless-функции нельзя читать заголовки IP, поэтому ip всегда пустой
    - Map нельзя объявлять на уровне модуля — функция упадёт при импорте
    - hits.set нужно вызывать с await, иначе запись не успевает сохраниться
  answer: 0
