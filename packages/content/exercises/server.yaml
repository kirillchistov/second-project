# hydration-mismatch: принято из черновика 2026-10-11
- id: hydration-mismatch-quiz
  skill: hydration-mismatch-causes
  question: hydration-mismatch
  difficulty: 3
  prompt: Что такое ошибка гидрации и что React делает, когда она случается?
  explanation: "Гидрация «прикрепляет» React к готовому HTML и требует, чтобы первый клиентский рендер совпал с серверным. Отсюда правило: в рендере не должно быть значений, которые различаются на сервере и клиенте. Клиентские значения появляются после монтирования или передаются с сервера."
  type: quiz
  options:
    - label: Серверный HTML не совпал с первым клиентским рендером — React отбрасывает его и рендерит поддерево на клиенте до ближайшей Suspense-границы
      why: Верно. Привязаться к несовпадающему DOM нельзя, поэтому React восстанавливается клиентским рендером. Это дорого, теряет выгоду SSR и может вызвать мигание.
    - label: React сравнивает серверный HTML с состоянием после всех эффектов, поэтому setState в useEffect тоже вызывает mismatch
      why: Нет. Сравнивается только первый рендер. Эффекты выполняются после гидрации, и обновление в useEffect — обычный повторный рендер. На этом и держится паттерн «значение после монтирования».
    - label: Ошибка возникает, если данные на клиенте изменились уже после загрузки страницы, например пришёл новый ответ API
      why: Изменения после гидрации — это обычные обновления состояния. Mismatch бывает только при расхождении в самом первом клиентском рендере.
    - label: "Это лишь предупреждение в dev: React точечно исправляет отличия в DOM и спокойно продолжает гидрацию"
      why: Неверно. При расхождении текста или структуры React выбрасывает recoverable error и перерисовывает поддерево. Различия в атрибутах он вообще не исправляет, они так и остаются.
  answer: 0
- id: hydration-mismatch-typeof-window
  skill: hydration-mismatch-causes
  question: hydration-mismatch
  difficulty: 2
  prompt: Компонент рендерится через SSR. У пользователя в localStorage сохранено theme = 'dark'. Найдите строки, из-за которых возникает ошибка гидрации.
  explanation: "Проверка `typeof window` в рендере даёт разный результат: на сервере получается 'light', а на клиенте при первом же рендере — 'dark'. Тему лучше хранить в cookie, чтобы сервер знал её заранее, или читать localStorage после монтирования."
  type: find-bug
  language: tsx
  code: |-
    function ThemeBadge() {
      const saved =
        typeof window !== 'undefined'
          ? localStorage.getItem('theme')
          : null;
      const theme = saved ?? 'light';
      return (
        <span className={`badge ${theme}`}>
          {theme}
        </span>
      );
    }
  bugLines:
    - 3
    - 4
  causes:
    - "Рендер ветвится по typeof window: сервер рендерит 'light', а первый клиентский рендер — 'dark', поэтому HTML не совпадает"
    - На сервере localStorage.getItem выбросит ReferenceError и SSR упадёт
    - Шаблонная строка в className не сериализуется при SSR
    - Оператор ?? не поддерживается при серверном рендере
  answer: 0
- id: hydration-mismatch-use-is-client
  skill: hydration-client-only-value
  question: hydration-mismatch
  difficulty: 3
  prompt: Допишите хук так, чтобы при гидрации компонент показал серверную заглушку, а затем — локальное время.
  explanation: useSyncExternalStore принимает subscribe, getSnapshot и getServerSnapshot. На сервере и во время гидрации React берёт getServerSnapshot (false), поэтому HTML совпадает. Затем он перерисовывает компонент с клиентским снимком (true). Эффект и лишний state не нужны.
  type: fill-tokens
  language: tsx
  code: |-
    function useIsClient() {
      return ___(
        () => () => {},
        () => ___,
        () => ___,
      );
    }
    function LocalTime() {
      const isClient = useIsClient();
      if (!isClient) return <span>—</span>;
      const t = new Date().toLocaleTimeString();
      return <span>{t}</span>;
    }
  tokens:
    - useSyncExternalStore
    - "true"
    - "false"
  decoys:
    - useEffect
    - useState
    - "null"
    - typeof window
- id: hydration-mismatch-dark-theme
  skill: hydration-fix-choice
  question: hydration-mismatch
  difficulty: 3
  prompt: "Next.js-приложение рендерится на сервере на каждый запрос. Пользователь выбирает тёмную тему, и после перезагрузки страница должна сразу открыться тёмной: без вспышки светлой и без ошибок гидрации. Что выбрать?"
  explanation: Если значение нужно уже в первом HTML, сервер должен знать его заранее. Cookie приходит с запросом, поэтому оба рендера совпадают. Чтение после монтирования и ssr:false убирают mismatch ценой мигания. suppressHydrationWarning лишь глушит симптом.
  type: choose-tool
  options:
    - label: Хранить тему в cookie и читать её на сервере при рендере
      why: "Лучший вариант: сервер знает тему ещё до рендера, HTML сразу тёмный, а клиентский рендер совпадает с серверным. Нет ни мигания, ни mismatch."
    - label: Читать localStorage в useEffect после монтирования и вызывать setTheme
      why: Mismatch не будет, но первый кадр отрисуется светлым, и тема мигнёт. Подходит для некритичных клиентских настроек, которые не влияют на первый экран.
    - label: Повесить suppressHydrationWarning на корневой элемент
      why: Атрибут работает на один уровень и только для текста и атрибутов. Он глушит предупреждение, но не делает тему правильной. Уместен для заведомо разных значений вроде таймстемпа.
    - label: "Обернуть страницу в dynamic(..., { ssr: false })"
      why: "Пропадает вся польза SSR: до загрузки JS пользователь видит пустоту. Подходит для чисто клиентских виджетов вроде карт и редакторов, а не для всей страницы."
  answer: 0

# rendering-strategies: принято из черновика 2026-10-11
- id: rendering-strategies-core-difference
  skill: rendering-strategies-concept
  question: rendering-strategies
  difficulty: 2
  prompt: В чём главное различие между CSR, SSR, SSG и ISR?
  explanation: "Ключевой вопрос — где и когда появляется HTML: в браузере (CSR), на каждый запрос (SSR), при сборке (SSG) или при сборке с фоновой перегенерацией (ISR). От ответа зависят свежесть данных, SEO, TTFB и нагрузка на сервер. Интерактивность во всех случаях даёт JS на клиенте."
  type: quiz
  options:
    - label: "В том, где и когда генерируется HTML: в браузере, на каждый запрос, при сборке или при сборке с фоновым обновлением"
      why: Верно. Это и определяет компромисс между свежестью данных, скоростью первого контента, SEO и стоимостью инфраструктуры.
    - label: "В том, работает ли React на клиенте: при SSR и SSG страница остаётся статичной и не выполняет JS"
      why: "Неверно. SSR- и SSG-страницы гидрируются: React на клиенте навешивает обработчики и делает их интерактивными."
    - label: ISR — это SSR, где ответ кешируется в браузере пользователя на заданное время
      why: Неверно. ISR перегенерирует статическую страницу на сервере в фоне (по таймеру или событию) и раздаёт её всем, а не кеширует у одного пользователя.
    - label: SSG подходит только для страниц без данных, а любые данные из API требуют SSR
      why: Неверно. SSG загружает данные при сборке и встраивает их в HTML. Проблема лишь в том, что до пересборки они устаревают.
  answer: 0
- id: rendering-strategies-catalog-choice
  skill: rendering-strategy-choice
  question: rendering-strategies
  difficulty: 2
  prompt: "Каталог интернет-магазина: 50 000 страниц товаров, важны SEO и скорость. Цены меняются пару раз в день, админка может отправить вебхук при изменении товара. Какую стратегию выбрать?"
  explanation: "Правило: данные меняются редко, а SEO важен — статика. Если страниц много и обновлять их нужно без полной пересборки, подойдёт ISR с on-demand ревалидацией. SSR нужен, когда данные персональные или меняются почти на каждый запрос. CSR — когда SEO не важен."
  type: choose-tool
  options:
    - label: ISR с ревалидацией по вебхуку
      why: Страницы отдаются как статика с CDN, а изменённый товар перегенерируется точечно по событию. Так получается скорость SSG и достаточная свежесть.
    - label: SSG с пересборкой при каждом изменении
      why: Хорошо для небольших сайтов с редкими правками. При 50 000 страниц каждая правка цены запускает долгую полную сборку.
    - label: SSR на каждый запрос
      why: Подходит для персональных или очень часто меняющихся данных. Здесь каждый запрос нагружает сервер и БД, а TTFB зависит от скорости данных.
    - label: CSR-приложение на Vite
      why: "Разумно для внутренних приложений за логином. Для каталога плохо: пустой HTML до загрузки JS вредит SEO и времени до первого контента."
  answer: 0
- id: rendering-strategies-localstorage-mismatch
  skill: hydration-mismatch
  question: rendering-strategies
  difficulty: 3
  prompt: Компонент рендерится через SSR. У пользователя с сохранённой тёмной темой в консоли появляется ошибка гидрации. Найдите причину.
  explanation: На сервере window нет, поэтому рендерится 'light'. При гидрации на клиенте initializer возвращает 'dark', и первый клиентский рендер не совпадает с HTML. Первый рендер должен совпадать с серверным. Читайте localStorage в useEffect, через useSyncExternalStore с getServerSnapshot или передавайте тему через cookie.
  type: find-bug
  language: tsx
  code: |-
    'use client';
    import { useState } from 'react';

    export function ThemeToggle() {
      const [theme, setTheme] = useState(() =>
        typeof window !== 'undefined'
          ? localStorage.getItem('theme') ?? 'light'
          : 'light'
      );
      const next = theme === 'dark' ? 'light' : 'dark';
      return (
        <button onClick={() => setTheme(next)}>{theme}</button>
      );
    }
  bugLines:
    - 6
    - 7
  causes:
    - "Начальное состояние на сервере и на клиенте разное: первый клиентский рендер не совпадает с серверным HTML"
    - localStorage вызовет ReferenceError на сервере, потому что компонент обращается к нему при рендере
    - Ленивый инициализатор useState нельзя использовать в компонентах с 'use client'
    - Компоненты с 'use client' не рендерятся на сервере, поэтому HTML для них пустой
  answer: 0
- id: rendering-strategies-ssr-hydration-timeline
  skill: hydration-lifecycle
  question: rendering-strategies
  difficulty: 2
  prompt: Расставьте по порядку, что происходит при открытии SSR-страницы.
  explanation: "При SSR контент виден раньше, чем загрузится JS. Интерактивным он становится только после гидрации: React строит дерево, сверяет его с готовой разметкой и навешивает обработчики. Эффекты запускаются уже после коммита гидрации. Разрыв между «увидел» и «смог кликнуть» зависит от размера бандла и стоимости гидрации."
  type: order
  kind: timeline
  steps:
    - Сервер получает запрос и загружает данные
    - Сервер рендерит компоненты в HTML и отправляет ответ
    - "Браузер отображает HTML: контент виден, но не интерактивен"
    - Загружается и выполняется JS-бандл
    - "React гидрирует: строит дерево, сверяет с разметкой, навешивает обработчики — страница становится интерактивной"
    - После коммита гидрации запускаются эффекты (useEffect) компонентов

# server-components: принято из черновика 2026-10-11
- id: server-components-vs-ssr
  skill: rsc-mental-model
  question: server-components
  difficulty: 3
  prompt: Что принципиально отличает React Server Components от классического SSR?
  explanation: SSR отвечает на вопрос «как быстро показать HTML», а RSC — «какой код вообще нужен на клиенте». Server Components выполняются только на сервере или при сборке, их код не уходит в бандл. Клиент получает RSC payload и при первой загрузке, и при навигации. Обычно RSC и SSR работают вместе.
  type: quiz
  options:
    - label: Код Server Components не попадает в бандл и не гидрируется; клиент получает RSC payload, в том числе при навигации
      why: Верно. SSR даёт HTML первой загрузки, а потом гидрирует всё дерево. В RSC серверная часть дерева так и остаётся на сервере.
    - label: "Это новое название SSR в App Router: компоненты на каждый запрос рендерятся на сервере в HTML"
      why: Нет. Результат RSC — сериализованный payload, а не HTML. Такие компоненты могут выполняться и при сборке. HTML из payload получают отдельно, через SSR.
    - label: Server Components рендерятся на сервере, а затем гидрируются на клиенте и становятся интерактивными
      why: У Server Components нет гидрации, state и обработчиков. Интерактивность есть только у Client Components за границей 'use client'.
    - label: Server Components работают только на первой загрузке, а при клиентской навигации их подменяют клиентские
      why: "Наоборот: при навигации без перезагрузки роутер запрашивает RSC payload нового маршрута. Серверные компоненты при этом снова выполняются на сервере."
  answer: 0
- id: server-components-function-prop
  skill: rsc-serializable-props
  question: server-components
  difficulty: 2
  prompt: Counter — Client Component с 'use client'. Найдите строку, из-за которой страница упадёт при рендере.
  explanation: "Props, которые идут через границу server→client, сериализуются в RSC payload. Обычную функцию сериализовать нельзя, и React выдаст ошибку «Functions cannot be passed directly to Client Components». Есть два решения: объявить обработчик внутри клиентского компонента или передать Server Function с 'use server'."
  type: find-bug
  language: tsx
  code: |-
    // app/page.tsx — Server Component
    import { Counter } from './Counter';

    export default async function Page() {
      const start = await getInitialCount();
      return (
        <Counter
          initial={start}
          onChange={(n) => console.log(n)}
        />
      );
    }
  bugLines:
    - 9
  causes:
    - Обычная функция не сериализуется и не может пройти через границу server/client как prop
    - Async-компонент не может рендерить Client Component — нужен dynamic import
    - Результат await нельзя передавать в props клиентского компонента
    - console.log запрещён в Server Components, потому что консоли на сервере нет
  answer: 0
- id: server-components-heavy-article
  skill: rsc-client-boundary-placement
  question: server-components
  difficulty: 2
  prompt: Статья блога рендерится тяжёлой библиотекой подсветки кода (~300 КБ). Контент меняется только при публикации, рядом стоит кнопка «лайк». Next.js App Router. Как организовать?
  explanation: Границу 'use client' опускайте как можно ниже, до интерактивных листьев. Тогда тяжёлые зависимости для чистого рендера остаются на сервере, а в бандл попадают только клиентские острова.
  type: choose-tool
  options:
    - label: Статья — Server Component с подсветкой на сервере, кнопка «лайк» — отдельный 'use client' остров
      why: Лучший вариант. Библиотека подсветки не попадает в бандл, статья приходит готовой разметкой, а гидрируется только маленькая кнопка.
    - label: "'use client' на всей странице, данные загружать через useEffect"
      why: 300 КБ уйдут в бандл, контент появится только после загрузки JS и запроса. Так стоит делать лишь для полностью интерактивного виджета без SEO.
    - label: Client Component страницы, отрендеренный через SSR, — HTML будет сразу
      why: HTML действительно будет сразу, но для гидрации библиотека всё равно скачается и выполнится. Подходит, если подсветка должна быть интерактивной, например в живом редакторе.
    - label: Подгрузить библиотеку подсветки через lazy/dynamic import на клиенте
      why: Бандл первой загрузки станет меньше, но код всё равно скачается и выполнится в браузере. Уместно для тяжёлого интерактивного виджета, который нужен не сразу.
  answer: 0
