- id: app-router-modal-with-url
  skill: app-router-parallel-intercepting
  question: app-router-conventions
  difficulty: 3
  prompt: "Лента фото: по клику фото открывается в модалке поверх ленты, а URL становится `/photo/42`. По этой ссылке или после обновления страницы должна открываться полноценная страница фото. Что выбрать?"
  explanation: "Модалка с собственным URL строится так: параллельный слот `@modal` рендерит модалку рядом с лентой, а перехватывающий маршрут `(.)photo/[id]` подменяет переход при клиентской навигации. При прямом заходе перехвата нет, и срабатывает обычный `photo/[id]/page.tsx`."
  type: choose-tool
  options:
    - label: Параллельный слот `@modal` + перехватывающий маршрут `(.)photo/[id]` и обычный `photo/[id]/page.tsx`
      why: Лучший вариант. При клиентском переходе показывается модалка поверх ленты, при прямом заходе — полная страница. URL один и тот же, работает «назад».
    - label: "`useState` в ленте и модалка-компонент"
