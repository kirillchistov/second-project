  prompt: Файл `app/api/health/route.ts` перенесли из Pages Router. Запрос `GET /api/health` не находит обработчик. Где ошибка?
  explanation: "В `route.ts` обработчики экспортируются именованными функциями по HTTP-методам: `export async function GET()`, `POST` и т.д. Default export, как в `pages/api`, здесь не работает. На неподдержанные методы Next сам ответит 405, ручная проверка `req.method` не нужна."
  type: find-bug
