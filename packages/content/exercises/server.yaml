  question: cache-components
  difficulty: 3
  prompt: Каталог кэшируется через 'use cache' с тегом `products:${category}`. Админ меняет цену в форме (Server Action) и после сабмита должен сразу увидеть новую цену. Что вызвать?
  explanation: "Правило: «изменил и сразу вижу» в Server Function — `updateTag`. Фоновые обновления, например вебхук из CMS, — `revalidateTag(tag, profile)` со stale-while-revalidate. Тег делайте узким: общий `products` после каждой правки сбросит весь каталог."
  type: choose-tool
  options:
    - label: updateTag('products:keyboards') в Server Action
      why: Инвалидирует тег немедленно, и следующий рендер читает свежие данные. Тег узкий, поэтому сбрасывается только одна категория.
    - label: revalidateTag('products:keyboards', 'max')
      why: "Это stale-while-revalidate: первый запрос может получить старую цену. Подходит для фоновых обновлений, например вебхука из CMS."
    - label: cacheLife('seconds') вместо 'hours'
      why: Короткий TTL нагружает базу и всё равно не гарантирует свежесть сразу после сабмита. Уместен для данных, где небольшое устаревание допустимо.
    - label: Убрать 'use cache' с getProducts
      why: Свежесть будет, но ценой похода в базу на каждый запрос, и каталог выпадет из статической оболочки. Оправдано для персональных или realtime-данных.
  answer: 0

# hydration-mismatch: принято из черновика 2026-10-13
- id: hydration-mismatch-client-only-widget
  skill: client-only-rendering-choice
  question: hydration-mismatch
  difficulty: 3
  prompt: Next.js App Router. Нужна интерактивная карта на Leaflet, а библиотека обращается к window прямо при импорте модуля. SEO для карты не важно. Как её подключить?
  explanation: "Если библиотека трогает window уже при импорте, условный рендер не поможет: модуль всё равно выполнится на сервере. Даже use(browser()) из React 19.3 — штатная замена useIsClient для клиентских частей UI — откладывает только рендер, но не import. Нужно, чтобы модуль вообще не загружался при SSR. Это делает dynamic с ssr: false в клиентском компоненте ('use client')."
  type: choose-tool
  options:
    - label: "`dynamic(() => import('./Map'), { ssr: false })` в клиентском компоненте"
      why: "Модуль карты не импортируется на сервере: сервер отдаёт loading-заглушку, карта грузится и рендерится только в браузере, расхождения нет."
    - label: "`use(browser())` в компоненте карты внутри Suspense (React 19.3)"
      why: Штатно отдаёт fallback на сервере вместо рендера, но статический import Leaflet всё равно выполнится при SSR и упадёт на window.
    - label: Хук useIsClient (useSyncExternalStore) и рендер `<Map />` только после гидрации
      why: Корректно для значений, доступных лишь в браузере. Но статический import Leaflet выполнится на сервере и упадёт на window.
    - label: "`{typeof window !== 'undefined' && <Map />}` в разметке"
      why: "Даёт mismatch: сервер рендерит пустоту, а клиент при гидрации рендерит карту. Проблему импорта на сервере это тоже не решает."
    - label: "`suppressHydrationWarning` на контейнере карты"
      why: Работает только для текста и атрибутов на один уровень. Подходит для таймстемпа, но не для целого виджета, который падает на сервере.
  answer: 0

# nextjs-proxy: принято из черновика 2026-10-13
- id: nextjs-proxy-purpose-quiz
  skill: nextjs-proxy-responsibility
  question: nextjs-proxy
  difficulty: 2
  prompt: Что уместно делать в `proxy.ts` (бывший `middleware.ts`) в Next.js?
  explanation: "Proxy выполняется до маршрутизации на каждый подходящий запрос и видит только сам запрос. Его задача — быстрые решения: redirect, rewrite, заголовки, cookies. Проверка в нём оптимистичная. Подпись сессии и права проверяют там, где читаются данные: в Server Components, Server Functions и Route Handlers."
  type: quiz
  options:
    - label: "Быстро решать по самому запросу: редирект без cookie, язык, A/B-rewrite, заголовки. Права проверять там, где читаются данные"
      why: "Верно. Proxy — сетевая граница перед приложением: дешёвые решения по запросу, а настоящая авторизация остаётся рядом с данными."
    - label: "Всю авторизацию: если proxy закрыл путь /dashboard, страницы и Server Functions можно не защищать"
      why: Server Function вызывается POST-запросом напрямую, минуя страницу и её путь. Защита только в proxy оставляет дыру.
    - label: "Загружать пользователя из базы и передавать его страницам: proxy выполняется раньше всех и экономит запросы"
      why: Запрос к базе в proxy выполняется на каждый запрос, включая статические страницы, и тормозит всё приложение.
    - label: "Только переписывать URL: ставить cookies и заголовки или сразу вернуть ответ proxy не может"
      why: Может. Proxy умеет redirect, rewrite, ставить заголовки и cookies, а также сразу вернуть свой Response.
  answer: 0
- id: nextjs-proxy-redirect-loop
  skill: nextjs-proxy-redirects
  question: nextjs-proxy
  difficulty: 2
  prompt: Пользователь без cookie сессии открывает /dashboard, и браузер показывает ошибку «слишком много перенаправлений». Где ошибка?
  explanation: "Matcher пропускает в proxy и /login. Там cookie по-прежнему нет, поэтому снова срабатывает редирект на /login, и так по кругу. Правило: условие редиректа должно исключать саму целевую страницу. Либо проверяйте только защищённые пути (`startsWith('/dashboard')`), либо исключите /login в matcher."
  type: find-bug
  language: ts
  code: |-
    export function proxy(request: NextRequest) {
      const session = request.cookies.get('session');
      if (!session) {
        const login = new URL('/login', request.url);
        return NextResponse.redirect(login);
      }
      return NextResponse.next();
    }

    export const config = {
      matcher: ['/((?!_next/static|_next/image).*)'],
    };
  bugLines:
    - 3
    - 11
  causes:
    - Запрос к /login тоже проходит через proxy и без cookie снова уходит на /login — бесконечный цикл редиректов
    - В proxy нельзя читать cookies, доступны только заголовки запроса
    - NextResponse.redirect принимает только строку, объект URL передавать нельзя
    - matcher не поддерживает регулярные выражения, пути нужно перечислять явно
  answer: 0
- id: nextjs-proxy-subdomain-rewrite
  skill: nextjs-proxy-rewrite
  question: nextjs-proxy
  difficulty: 2
  prompt: "Допишите proxy для мультитенантности: acme.example.com/about должен отдавать страницу /acme/about, а URL в браузере не должен меняться."
  explanation: "`rewrite` отдаёт содержимое другого пути и не меняет адрес, а `redirect` сменил бы URL в браузере. Поддомен берём из заголовка `host`. `nextUrl` — разобранный URL, и его клонируют, чтобы не мутировать исходный запрос. Через `config.matcher` из обработки исключают служебные пути."
  type: fill-tokens
  language: ts
  code: |-
    export function proxy(request: NextRequest) {
      const host = request.headers.get('___') ?? '';
      const tenant = host.split('.')[0];
      const url = request.___.clone();
      url.pathname = `/${tenant}${url.pathname}`;
      return NextResponse.___(url);
    }

    export const ___ = {
      matcher: ['/((?!_next|favicon.ico).*)'],
    };
  tokens:
    - host
    - nextUrl
    - rewrite
    - config
  decoys:
    - redirect
    - url
    - next
    - matcher
- id: nextjs-proxy-ownership-check
  skill: nextjs-auth-placement
  question: nextjs-proxy
  difficulty: 2
  prompt: Server Function `deleteProject(id)` должна удалять проект, только если текущий пользователь — его владелец. Где выполнить эту проверку?
  explanation: "Правило: proxy и layout дают оптимистичный, удобный для UX барьер, но права проверяются там, где читаются или меняются данные. Server Function — публичная точка входа, её можно вызвать напрямую. Поэтому сессию и владение проверяют внутри неё, удобнее всего через общий слой доступа к данным (DAL)."
  type: choose-tool
  options:
    - label: "Внутри Server Function: проверить сессию и владельца через слой доступа к данным"
      why: "Лучший вариант: проверка стоит рядом с мутацией и срабатывает при любом способе вызова, в том числе при прямом POST в обход страницы."
    - label: "В proxy: нет cookie на /projects — редирект на /login"
      why: Полезно для UX, но proxy видит только наличие cookie и путь. Подпись сессии и владение проектом он не проверяет, а Server Function вызывается в обход пути.
    - label: "В layout.tsx раздела /projects: проверить пользователя перед рендером"
      why: Подходит, чтобы не показывать страницу чужим. Но Server Function выполняется независимо от проверки в layout, и она не стоит на пути мутации.
    - label: "На клиенте: не показывать кнопку удаления, если пользователь не владелец"
      why: "Улучшает интерфейс, но не защищает: запрос можно отправить вручную. Это дополнение к серверной проверке, а не её замена."
  answer: 0

