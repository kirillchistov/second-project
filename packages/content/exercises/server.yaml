- id: server-components-context-nonserializable
  skill: rsc-context
  question: server-components
  difficulty: 3
  prompt: "`ThemeContext` создан в модуле с `'use client'`, проект на React 19.3. Найдите строку, из-за которой layout упадёт при рендере."
  explanation: Контекст можно предоставлять прямо из Server Component, но его значение пересекает границу server/client и должно сериализоваться. Обычную функцию сериализовать нельзя. Передавайте данные (`theme`), а производные вычисляйте в клиентском хуке. Для мутаций подойдёт Server Function или клиентская обёртка со state.
  type: find-bug
  language: tsx
  code: |-
    // app/layout.tsx — Server Component
    import { ThemeContext } from './theme-context';

    export default async function Layout({ children }: Props) {
      const theme = await getUserTheme();
      return (
        <ThemeContext
          value={{ theme, isDark: () => theme === 'dark' }}
        >
          {children}
        </ThemeContext>
      );
    }
  bugLines:
    - 8
  causes:
    - В value лежит обычная функция, а значение контекста из Server Component должно сериализоваться
