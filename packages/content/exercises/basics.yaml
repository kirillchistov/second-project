  code: |-
    function Avatar() {
      console.log('Avatar');
      return <img alt="" />;
    }

    function App() {
      const el = <Avatar />;
      console.log('App');
      return <>{el}{el}</>;
    }
  options:
    - App → Avatar → Avatar
    - Avatar → App → Avatar
    - Avatar → App
    - App → Avatar
  answer: 0
- id: component-element-state-by-position
  skill: state-by-tree-position
  question: component-vs-element
  difficulty: 2
  prompt: Counter хранит число кликов в useState, показывает его и красит текст в color. По счётчику кликнули 3 раза, затем нажали toggle. Что на экране?
  explanation: Состояние привязано к позиции и типу, а не к конкретному JSX. В обеих ветках на одном месте стоит Counter — React видит тот же экземпляр с новыми props, поэтому счёт сохраняется. Сбросить можно разным key или разными позициями.
  type: predict-output
  language: tsx
  code: |-
    function App() {
      const [red, setRed] = useState(false);
      return (
