            : <Counter color="blue" />}
          <button onClick={() => setRed(!red)}>
            toggle
          </button>
        </div>
      );
    }
  options:
    - 3, красным цветом
    - 0, красным цветом
    - 3, синим цветом
    - 0, синим цветом
  answer: 0
- id: component-element-nested-definition
  skill: nested-component-definition
  question: component-vs-element
  difficulty: 2
  prompt: После каждого введённого символа поле теряет фокус. Найдите строку с причиной.
  explanation: "SearchInput объявлен внутри SearchPage: каждый рендер создаёт новую функцию, то есть новый type. React видит другой тип на той же позиции, размонтирует старый input и монтирует новый — фокус и состояние теряются. Компоненты объявляют на верхнем уровне модуля и передают данные через props."
  type: find-bug
  language: tsx
  code: |-
    function SearchPage() {
      const [query, setQuery] = useState('');
      function SearchInput() {
        return (
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
        );
      }
      return <SearchInput />;
    }
  bugLines:
    - 3
  causes:
    - "Компонент объявлен внутри другого: на каждом рендере новый тип, и React пересоздаёт input"
    - Контролируемый input нельзя связывать с состоянием родителя через замыкание
    - setQuery нужно вызывать с функцией-апдейтером, иначе ввод сбрасывается
    - Не хватает key у <SearchInput />, поэтому React путает экземпляры
  answer: 0

# conditional-rendering: принято из черновика 2026-10-11
- id: conditional-rendering-and-zero
  skill: jsx-falsy-values
  question: conditional-rendering
  difficulty: 1
  prompt: Почему `{items.length && <List />}` для пустого массива выводит на экран `0` и как это исправить?
  explanation: "`&&` возвращает сам левый операнд, если он falsy. `false`, `null`, `undefined` и `true` React не рендерит, а числа (включая `0` и `NaN`) выводит как текст. Левая часть `&&` в JSX должна быть настоящим boolean: `items.length > 0`, `!!items.length` или тернарник."
  type: quiz
  options:
    - label: "`&&` возвращает левый операнд `0`, а числа React рендерит как текст — нужно условие-boolean: `items.length > 0`"
      why: Верно. Выражение даёт число 0, а не false. React пропускает только false, null, undefined и true, поэтому 0 становится текстовым узлом.
    - label: React выводит любое falsy-значение как строку, поэтому так же покажутся `false` и `null`
      why: "Неверно. false, null и undefined ничего не рендерят. Особый случай — именно числа 0 и NaN: для React это обычный контент."
    - label: '`items.length` в JSX приводится к строке "0", а непустая строка — truthy'
      why: Неверно. length — число, и `&&` вычисляется до того, как React что-то рендерит. Если бы там была строка "0", `<List />` бы отрисовался.
    - label: Это артефакт dev-режима и StrictMode, в production-сборке ноль не появится
      why: Неверно. Это обычная семантика JavaScript и правило рендеринга React, оно одинаково в dev и production.
  answer: 0
- id: conditional-rendering-falsy-text
  skill: jsx-falsy-values
  question: conditional-rendering
  difficulty: 2
  prompt: Какой текст окажется внутри `<p>` после рендера?
  explanation: "`items.length && …` даёт 0, `score && …` даёт NaN: оба числа React выводит как текст. `null`, `false`, `true` и `undefined` пропускаются. Пустая строка `''` тоже falsy: `&&` возвращает `''`, а пустой текст на экране не виден. Итог: «0NaN»."
  type: predict-output
  language: tsx
  code: |-
    function App() {
      const items: string[] = [];
      const score = NaN;
      return (
        <p>
          {items.length && <b>list</b>}
          {null}{false}{true}{undefined}
          {score && <i>score</i>}
          {'' && <i>empty</i>}
        </p>
      );
    }
  options:
    - 0NaN
    - Пусто — все значения falsy
    - 0NaNtrue
    - "0"
  answer: 0
- id: conditional-rendering-type-reset
  skill: element-type-state-reset
  question: conditional-rendering
  difficulty: 2
  prompt: Пользователь ввёл имя, затем `editable` переключился, и текст в поле пропал. Где причина?
  explanation: React сравнивает дерево по позиции и типу. Корень меняется с `label` на `div`, поэтому всё поддерево размонтируется вместе с DOM-узлом input и его значением. Решение — оставить одинаковую обёртку и менять только props или поднять значение в состояние родителя.
  type: find-bug
  language: tsx
  code: |-
    function NameField({ editable }: Props) {
      if (editable) {
        return <label>Name <input /></label>;
      }
      return <div>Name <input /></div>;
    }
  bugLines:
    - 3
    - 5
  causes:
    - Тип корневого элемента на одной позиции меняется (label ↔ div), и React пересоздаёт поддерево вместе с input
    - Неконтролируемый input без value React очищает при каждом ререндере
    - Ранний return внутри if сбрасывает состояние компонента
    - У input нет key, поэтому React не может сопоставить его между рендерами
  answer: 0
