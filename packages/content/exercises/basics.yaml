- id: immutable-updates-deep-nested-config
  skill: nested-state-strategy
  question: immutable-updates
  difficulty: 2
  prompt: "Редактор конфигурации: объект с API глубиной 4–5 уровней, формат менять нельзя — его же отправляют обратно. Десяток обработчиков правят поля в глубине. Что выбрать?"
  explanation: "Ручной спред верен, но на глубине 4+ многословен и легко забыть уровень. Immer даёт «мутирующий» синтаксис и структурное разделение: новые ссылки только у изменённых веток. Если структуру можно менять — сначала подумайте о плоском state."
  type: choose-tool
  options:
    - label: "Immer: useImmer или produce"
      why: "Лучший выбор: код читается как мутация, а результат — новый объект, где неизменённые ветки сохраняют ссылки, и memo продолжает работать."
    - label: Ручной спред на каждом уровне
      why: Подходит для 1–2 уровней. На глубине 4–5 в десятке обработчиков — громоздко, и пропущенный уровень даст тихую мутацию.
