      return (
        <button onClick={() => ___(!on)}>
          {on ? 'ON' : 'OFF'}
        </button>
      );
    }

    function Settings() {
      const [on, setOn] = ___(false);
      return <Toggle on={on} onToggle={___} />;
    }
  tokens:
    - onToggle
    - useState
    - setOn
  decoys:
    - useRef
    - setState
    - on
- id: props-reset-copied-state
  skill: reset-state-with-key
  question: props
  difficulty: 2
  prompt: Форма EditName получает name выбранного пользователя, и поле можно править локально. При выборе другого пользователя поле должно сброситься на его имя. Как лучше?
  explanation: "`useState(prop)` берёт значение только при монтировании — это частый баг «скопировали props в state». Если локальный черновик нужно сбрасывать при смене сущности, проще всего пересоздать компонент через key. Если черновик не нужен — сделайте поле контролируемым родителем."
  type: choose-tool
  options:
    - label: <EditName key={user.id} name={user.name} /> — сброс через key
      why: "Лучший вариант: новый key — новый экземпляр, state заново инициализируется из props. Нет лишнего рендера со старым значением и кода синхронизации."
    - label: useEffect(() => setValue(name), [name]) внутри EditName
      why: Работает, но сначала отрисуется старое значение, а затем пройдёт ещё один рендер. Синхронизация через эффект — антипаттерн; если key не подходит, state корректируют во время рендера.
    - label: Оставить useState(name) — React обновит state при новом prop
      why: "Не обновит: начальное значение useState читается лишь при монтировании. Это и есть исходный баг."
    - label: Записать новое имя прямо в props.name из обработчика
      why: "Props только для чтения: мутация не вызовет рендер и испортит данные родителя. Чтобы поменять значение, нужен колбэк, и тогда state меняет родитель."
  answer: 0

# state-vs-props: принято из черновика 2026-10-11
- id: state-vs-props-core
  skill: state-vs-props
  question: state-vs-props
  difficulty: 1
  prompt: Чем state отличается от props?
  explanation: "Props — входные данные от родителя, компонент их только читает. State — память самого компонента: живёт между рендерами, меняется через функцию обновления, и это изменение запускает новый рендер. В state кладут только то, что нельзя вычислить из props или другого state."
  type: quiz
  options:
    - label: Props приходят от родителя и только читаются; state принадлежит компоненту, меняется через setter и запускает рендер
      why: Верно. Props меняет только родитель, повторно отрендерив дочерний компонент. State компонент меняет сам через функцию обновления.
    - label: Props можно менять внутри компонента, а state меняет только React
      why: "Наоборот: props только для чтения, их мутация ломает однонаправленный поток данных. State компонент меняет сам через setState."
    - label: State хранит данные, которые не влияют на UI, а props — то, что отображается
      why: "Это описание useRef: он хранит значение без рендера. State как раз для данных, изменение которых должно перерисовать UI."
    - label: State сбрасывается при каждом рендере, а props сохраняются между рендерами
      why: "Наоборот: React хранит state между рендерами, в этом его смысл. Props при каждом рендере заново передаёт родитель."
  answer: 0
- id: state-vs-props-stale-after-set
  skill: state-update-snapshot
  question: state-vs-props
  difficulty: 1
  prompt: Компонент смонтировали (без StrictMode), затем один раз нажали кнопку. Что будет в консоли?
  explanation: "setCount не меняет переменную count: это константа текущего рендера, снимок state. Обработчик видит 0, а новое значение 1 появится только в следующем рендере. Если нужно новое значение сразу, вычислите его в локальную переменную: const next = count + 1."
  type: predict-output
  language: tsx
  code: |-
    function Counter() {
      const [count, setCount] = useState(0);
      console.log('render', count);

      function handleClick() {
        setCount(count + 1);
        console.log('click', count);
      }

      return <button onClick={handleClick}>+</button>;
    }
  options:
    - render 0 → click 0 → render 1
    - render 0 → click 1 → render 1
    - render 0 → render 1 → click 1
    - render 0 → click 0
  answer: 0
- id: state-vs-props-copied-prop
  skill: derived-state-avoidance
  question: state-vs-props
  difficulty: 2
  prompt: Родитель передаёт новое name, но заголовок продолжает показывать старое имя. Найдите строку с ошибкой.
  explanation: Аргумент useState — только начальное значение, его читают на первом рендере. Копия prop в state перестаёт следить за родителем. Если значение не редактируется локально, используйте prop напрямую. Если нужен сброс при смене сущности — key на компоненте.
  type: find-bug
  language: tsx
  code: |-
    function Greeting({ name }: { name: string }) {
      const [label] = useState(name);
      return <h1>Привет, {label}</h1>;
    }
  bugLines:
    - 2
  causes:
    - "Prop скопирован в state: аргумент useState учитывается только на первом рендере, дальше новое name игнорируется"
    - Нужно обернуть name в useMemo, иначе React не заметит его изменения
    - Компонент не перерисовывается, потому что props неизменяемы
    - Без setter React запрещает компоненту перерисовываться при смене props
  answer: 0
- id: state-vs-props-filtered-list
  skill: derived-state-avoidance
  question: state-vs-props
  difficulty: 2
  prompt: Компонент получает через props todos (около 50 штук) и query. Нужно показать отфильтрованный список и счётчик найденного. Как получить filtered?
  explanation: "Если значение можно вычислить из props или state, его не хранят: его считают во время рендера. Так у данных остаётся единый источник истины и нет лишнего рендера. Мемоизацию добавляют, только когда замер показал дорогое вычисление."
  type: choose-tool
  options:
    - label: "Вычислить при рендере: const filtered = todos.filter(...)"
      why: Лучший вариант. Фильтр 50 элементов дешёвый, значение всегда согласовано с props, лишнего state и лишних рендеров нет.
    - label: useMemo(() => todos.filter(...), [todos, query])
      why: Нужен, если вычисление действительно дорогое, и это подтвердил профайлер. С React Compiler ручной useMemo обычно не нужен.
    - label: useState для filtered + useEffect, который обновляет его при смене props
      why: "Антипаттерн: дублирует данные, даёт лишний рендер с устаревшим списком и рискует рассинхронизироваться."
    - label: Хранить filtered в useRef и обновлять в эффекте
      why: "Ref не вызывает рендер, поэтому UI покажет устаревший список. Ref подходит для значений вне отображения: таймеров, DOM-узлов."
  answer: 0

# what-is-react: принято из черновика 2026-10-11
- id: what-is-react-core-idea
  skill: react-declarative-model
  question: what-is-react
  difficulty: 1
  prompt: Какую главную задачу решает React?
  explanation: Суть React — UI как функция от состояния. Вы описываете, **что** должно быть на экране, а React сам вычисляет разницу и применяет её через рендерер (react-dom, react-native). Роутинг, данные и SSR берут на себя фреймворки поверх React.
  type: quiz
  options:
    - label: Позволяет описать UI как функцию от состояния, а React сам вычисляет и применяет нужные изменения к DOM
      why: "Верно. Это декларативная модель: вы описываете результат, а React берёт на себя переход от старого дерева к новому."
    - label: "Даёт полный набор для приложения: роутинг, загрузку данных, сборку и SSR из коробки"
      why: Это задачи метафреймворков вроде Next.js или React Router. Сам React — библиотека для UI, поэтому без оговорок называть его фреймворком неточно.
    - label: "Ускоряет приложение: Virtual DOM всегда обновляет страницу быстрее ручной работы с DOM"
      why: Распространённый миф. Точечная ручная мутация DOM не медленнее. Virtual DOM делает достаточно быстрым декларативный код, а не обгоняет императивный.
    - label: "Предоставляет готовую библиотеку UI-элементов: кнопки, модалки, формы и их стили"
      why: Готовые компоненты дают отдельные библиотеки (MUI, Radix и др.). React даёт только модель компонентов, а стили и виджеты выбираете сами.
  answer: 0
- id: what-is-react-imperative-dom
  skill: react-declarative-model
  question: what-is-react
  difficulty: 1
  prompt: После первого клика счётчик показывает 1, а дальше не растёт. Найдите ошибку.
  explanation: "Обработчик меняет DOM вручную, а состояние count остаётся 0, поэтому каждый клик снова пишет «1». Ручная правка к тому же ломает связь React с DOM: textContent заменяет текстовый узел, которым управляет React. В React меняют состояние, например `setCount(c => c + 1)`, а разметку выводят из него декларативно."
  type: find-bug
  language: tsx
  code: |-
    function Counter() {
      const [count, setCount] = useState(0);
      function handleClick() {
        const el = document.getElementById('count');
        el!.textContent = String(count + 1);
      }
      return (
        <div>
          <span id="count">{count}</span>
          <button onClick={handleClick}>+</button>
        </div>
      );
    }
  bugLines:
    - 4
    - 5
  causes:
    - "DOM меняется вручную вместо обновления состояния: count остаётся 0, и UI рассинхронизирован с данными"
    - "В React нельзя использовать атрибут id: он конфликтует с внутренними ключами"
    - Обработчик нужно назначать через onclick в нижнем регистре, иначе он сработает один раз
    - useState можно вызывать только внутри useEffect, иначе значение сбрасывается
  answer: 0
- id: what-is-react-project-start
  skill: react-project-setup
  question: what-is-react
  difficulty: 2
  prompt: "Новый публичный продукт: каталог, важны SEO и быстрая первая загрузка, нужны роутинг и загрузка данных на сервере. С чего стартовать?"
  explanation: React — библиотека для UI, а роутинг, данные, сборку и SSR решают инструменты поверх него. Команда React рекомендует начинать с фреймворка. Если нужен SSR и SEO, выбирайте метафреймворк, а для внутренней SPA подойдёт Vite.
  type: choose-tool
  options:
    - label: Next.js (App Router)
      why: "Лучший выбор: SSR, Server Components, файловый роутинг и загрузка данных на сервере из коробки закрывают SEO и первую загрузку."
    - label: Vite + React + React Router (SPA)
      why: Отлично для внутренних админок и SPA без требований к SEO. SSR и серверную загрузку данных пришлось бы собирать самому.
    - label: Create React App
      why: CRA объявлен устаревшим и не развивается. В нём нет ни SSR, ни роутинга, так что для новых проектов он не подходит.
    - label: React через <script> без сборщика
      why: Годится разве что для прототипа или виджета на готовой странице. Нет JSX-сборки, роутинга и SSR.
  answer: 0
- id: what-is-react-thinking-in-react
  skill: thinking-in-react
  question: what-is-react
  difficulty: 2
  prompt: "Расставьте шаги построения нового экрана «по-реактовски»: от макета до рабочего UI."
  explanation: "Это алгоритм Thinking in React. Сначала структура компонентов и статика на props, затем минимальное состояние и его владелец. Данные текут сверху вниз, а изменения поднимаются колбэками. Вычисляемые значения не храните в state: их выводят при рендере."
  type: order
  kind: recipe
  steps:
    - Разбить макет на иерархию компонентов
    - Собрать статическую версию, которая рендерит данные только через props
    - Найти минимальное полное состояние, остальное вычислять из него
    - Определить, какой компонент владеет каждым кусочком состояния
    - "Добавить обратный поток данных: колбэки из дочерних обновляют состояние владельца"
