  explanation: "Схема по умолчанию: refresh-токен или сессия — в httpOnly Secure SameSite cookie, короткий access-токен — в памяти JS. Цена такого выбора — защита от CSRF: помогают SameSite и CSRF-токен. Для OAuth добавьте PKCE или BFF."
