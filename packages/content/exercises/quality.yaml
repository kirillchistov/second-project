    - label: React перехватывает фокус при каждом ре-рендере, поэтому его нужно восстанавливать в эффектах
      why: Элементы, которые React переиспользует при reconciliation, фокус сохраняют. Теряется он, только когда сфокусированный элемент удаляют или заменяют.
    - label: "Проблема касается только мыши: клавиатура и скринридеры сами находят новый контент"
      why: "Наоборот: страдают именно клавиатура и скринридер. Без переноса фокуса они не узнают о смене контента и остаются на старой позиции."
