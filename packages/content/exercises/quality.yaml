# csrf: принято из черновика 2026-10-13
- id: csrf-why-it-works
  skill: csrf-mechanism
  question: csrf
  difficulty: 2
  prompt: У атакующего нет доступа к cookies жертвы. Почему CSRF-атака всё равно срабатывает?
  explanation: "CSRF использует **автоматическую** отправку cookies браузером. Атакующему не нужно читать cookie или ответ, достаточно, чтобы запрос выполнился. Поэтому защищаются так, чтобы сервер мог отличить свой сайт от чужого: `SameSite`, проверка `Origin`/`Sec-Fetch-Site`, CSRF-токен."
  type: quiz
  options:
    - label: Браузер сам прикрепляет cookies к запросу на сайт, и сервер не может отличить его от действия пользователя
      why: Верно. Форма или ссылка на чужой странице ведёт на ваш домен, и браузер добавляет к запросу сессионную cookie. Для сервера это обычный запрос залогиненного пользователя.
    - label: Чужой скрипт читает document.cookie и подставляет сессию в свой запрос
      why: Это кража cookie через XSS, другая атака. Скрипт с чужого сайта не видит cookies вашего домена, а httpOnly-cookie не прочитать даже через XSS.
    - label: Сервер неправильно настроил CORS и разрешил запросы с любого Origin
      why: CORS управляет только чтением ответа. Простой кросс-сайтовый POST из формы уходит и выполняется при любых настройках CORS.
    - label: Сайт работает без HTTPS, и атакующий перехватывает cookie в сети
      why: "Это MITM-перехват. CSRF работает и по HTTPS: атакующему не нужно видеть трафик, браузер жертвы сам отправляет запрос."
  answer: 0
