- id: frontend-monitoring-silent-boundary
  skill: frontend-error-reporting
  question: frontend-monitoring
  difficulty: 1
  prompt: Корневых колбэков onCaughtError нет. Виджет в проде иногда падает, пользователи видят Fallback, но команда об этом не знает. Где ошибка?
  explanation: Error Boundary без отправки отчёта превращает падение в тихий fallback. `console.error` в браузере пользователя никто не прочитает. В `componentDidCatch` (или в `onCaughtError` на корне) ошибку отправляют в мониторинг вместе с `info.componentStack`, релизом и маршрутом.
  type: find-bug
  language: tsx
  code: |-
    class Boundary extends Component<Props, State> {
      state: State = { failed: false };
      static getDerivedStateFromError(): State {
        return { failed: true };
      }
      componentDidCatch(error: Error) {
        console.error(error);
      }
      render() {
        if (this.state.failed) return <Fallback />;
        return this.props.children;
      }
    }
  bugLines:
    - 7
  causes:
    - Ошибка пишется только в консоль браузера пользователя — в сервис мониторинга отчёт не уходит
    - getDerivedStateFromError должен быть методом экземпляра, иначе Boundary не сработает
    - Если есть getDerivedStateFromError, React не вызывает componentDidCatch
    - Error Boundary должен показывать null, а не Fallback, иначе ошибка повторится
  answer: 0
