  explanation: При полной загрузке браузер сам сбрасывает фокус и скринридер читает новую страницу. В SPA этим занимается код. После перехода фокус ставят на заголовок с `tabIndex={-1}`. Модалка переносит фокус внутрь, удерживает его и при закрытии возвращает открывателю. Если сфокусированный элемент удаляют, фокус переводят на соседний.
  type: quiz
  options:
    - label: "Документ не перезагружается: фокус остаётся на старом элементе или улетает в body, и переносить его должен код"
      why: Верно. При полной загрузке браузер сбрасывает фокус в начало документа, и скринридер читает новую страницу. В SPA за это отвечает разработчик.
    - label: Браузер сбрасывает фокус при каждом history.pushState, поэтому вручную нужно обрабатывать только модалки
