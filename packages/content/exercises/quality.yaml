- id: csrf-legacy-forms-defense
  skill: csrf-defense-choice
  question: csrf
  difficulty: 3
  prompt: "Старое многостраничное приложение: сессия в cookie, HTML-формы. Корпоративный прокси клиента вырезает Origin и Referer, часть пользователей сидит на старых браузерах без SameSite. Чем закрыть CSRF?"
  explanation: "Защита строится слоями, но каждый слой опирается на поддержку браузера или сети. Если заголовкам и SameSite доверять нельзя, остаётся CSRF-токен: секрет, привязанный к сессии, который чужая страница не может узнать. CORS и перенос токена в localStorage решают другие задачи."
  type: choose-tool
  options:
    - label: Synchronizer CSRF-токен в скрытом поле формы, сверяемый с сессией
      why: "Лучший вариант здесь. Токен не зависит от заголовков и поддержки SameSite: чужой сайт не знает его значения и не может подставить его в форму."
    - label: Проверка Origin / Referer на сервере
      why: "Хорошо работает в современных средах. Здесь прокси вырезает эти заголовки: строгая проверка отвергнет легитимных пользователей, а мягкая пропустит атаку."
    - label: "Настроить CORS: разрешить только свой домен"
      why: CORS ограничивает чтение ответа, а не отправку запроса. POST из формы на чужой странице выполнится всё равно.
    - label: Перенести сессию в JWT в localStorage и слать его в Authorization
      why: Такой вариант к CSRF не уязвим, но требует JS-клиента вместо обычных форм и открывает кражу токена через XSS. Это переписывание архитектуры, а не точечная защита.
  answer: 0

# focus-management: принято из черновика 2026-10-13
- id: focus-management-spa-why
