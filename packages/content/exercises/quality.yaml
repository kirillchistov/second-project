  skill: csrf-safe-methods
  question: csrf
  difficulty: 2
  prompt: Route Handler удаляет пост залогиненного пользователя. Найдите строку, из-за которой его можно вызвать с чужого сайта.
  explanation: "Изменение состояния через GET — классическая дыра. При `SameSite=Lax` cookie отправляется на top-level переходы с безопасными методами, поэтому ссылка или редирект с чужого сайта удалит пост. Правило: GET только читает, мутации — POST/DELETE с проверкой Origin или токеном."
  type: find-bug
