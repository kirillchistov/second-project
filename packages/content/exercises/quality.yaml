  question: focus-management
  difficulty: 2
  prompt: После «Сохранить» форма остаётся на месте, а в углу появляется тост «Изменения сохранены». Скринридер должен озвучить сообщение, а пользователь — продолжить работу с формой. Что выбрать?
  explanation: 'Переносить фокус стоит при смене контекста: модалка, новая страница. Сообщения о статусе объявляют через live-область, не трогая фокус. Для рядовых событий подходит `polite` (role="status"), для срочных ошибок — `assertive` (role="alert"). Контейнер должен быть в DOM до появления текста.'
  type: choose-tool
  options:
    - label: Постоянный контейнер с role="status" (aria-live="polite"), куда вставляется текст
      why: Скринридер озвучит текст, когда тот появится в уже существующей live-области, а фокус останется в форме. Контейнер должен быть в DOM заранее.
    - label: Перенести фокус на тост через tabIndex={-1} и focus()
      why: "Фокус уйдёт с формы, и пользователь потеряет своё место. Такой перенос уместен при смене контекста: открытии модалки или переходе на новую страницу."
    - label: role="alert" на тосте
      why: "Это assertive-область: она прерывает текущую речь скринридера. Подходит для срочных ошибок, а не для рядового сообщения об успехе."
    - label: Атрибут inert на форме, пока виден тост
      why: inert делает форму недоступной для фокуса и скринридера. Он нужен для фона под своим оверлеем или панелью, а не для уведомлений.
  answer: 0

