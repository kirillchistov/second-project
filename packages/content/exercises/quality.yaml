# accessibility: принято из черновика 2026-10-11
- id: accessibility-semantics-first
  skill: a11y-semantic-html
  question: accessibility
  difficulty: 2
  prompt: С чего начинать доступность React-компонента и какую роль в ней играет ARIA?
  explanation: "Порядок такой: семантический HTML, затем ARIA для пробелов (кнопки-иконки, live-регионы, связь поля с ошибкой), затем управление фокусом в SPA. Проверка — клавиатурой, скринридером, axe и eslint-plugin-jsx-a11y."
  type: quiz
  options:
    - label: "С семантического HTML: button, a href, label, заголовки и landmarks. ARIA — только там, где HTML не хватает, плюс управление фокусом"
      why: Верно. Нативные элементы бесплатно дают роль, фокус, Enter/Space и имя. ARIA дополняет семантику, но поведения не добавляет.
    - label: "Добавить role и aria-атрибуты ко всем интерактивным элементам: чем больше ARIA, тем доступнее интерфейс"
      why: ARIA меняет только то, что объявляется скринридеру, но не добавляет фокус и клавиатуру. Лишняя или неверная ARIA часто хуже, чем никакой.
    - label: "Подключить axe в CI: если проверка зелёная, приложение доступно"
      why: "Автоматика ловит лишь часть проблем: контраст, alt, имена. Логичность порядка фокуса, ловушки и понятность объявлений проверяют вручную."
    - label: Расставить tabIndex на кликабельные элементы, чтобы всё стало доступно с клавиатуры
      why: tabIndex на div не даёт ни Enter/Space, ни роли, а tabIndex > 0 ломает естественный порядок фокуса.
  answer: 0
- id: accessibility-div-icon-button
  skill: a11y-semantic-html
  question: accessibility
  difficulty: 2
  prompt: Пользователь клавиатуры и скринридера не может закрыть панель. Найдите проблемные строки.
  explanation: 'div не фокусируется, не обрабатывает Enter/Space и не имеет роли. У generic-элемента aria-label запрещён, и скринридеры его игнорируют. Правильный вариант: `<button type="button" aria-label="Закрыть">`, внутри иконка с aria-hidden. Правило: действие — это button, навигация — a href.'
  type: find-bug
  language: tsx
  code: |-
    function Toolbar({ onSave, onClose }: Props) {
      return (
        <div className="toolbar">
          <button type="button" onClick={onSave}>Сохранить</button>
          <div
            className="icon-btn"
            aria-label="Закрыть"
            onClick={onClose}
          >
            <XIcon aria-hidden />
          </div>
        </div>
      );
    }
  bugLines:
    - 5
    - 7
  causes:
    - Кликабельный div без роли не попадает в Tab-порядок и не реагирует на Enter/Space, а aria-label на div без роли игнорируется
    - aria-hidden на XIcon скрывает от скринридера родительский элемент вместе с обработчиком
    - "Кнопке «Сохранить» нужен aria-label: одного текста внутри недостаточно для доступного имени"
    - type="button" мешает скринридеру распознать кнопку, его надо убрать
  answer: 0
- id: accessibility-modal-focus-recipe
  skill: a11y-focus-management
  question: accessibility
  difficulty: 2
  prompt: Расставьте шаги реализации доступной модалки по порядку.
  explanation: Фокус нужно запомнить до открытия, перенести внутрь, удерживать там и вернуть после закрытия. Иначе клавиатурный пользователь теряется на странице. Нативный `<dialog>` с showModal() даёт фокус, Escape и inert-фон из коробки. Сложные случаи удобнее решать headless-библиотекой.
  type: order
  kind: recipe
  steps:
    - При клике по триггеру, ещё до открытия, запомнить элемент, который открыл модалку (document.activeElement)
    - Отрендерить диалог с role="dialog", aria-modal и aria-labelledby на заголовок
    - "Перенести фокус внутрь диалога: на первый интерактивный элемент или заголовок"
    - Пока диалог открыт, удерживать Tab внутри (фон — inert) и закрывать по Escape
    - После закрытия вернуть фокус на запомненный элемент
- id: accessibility-custom-combobox
  skill: a11y-complex-widgets
  question: accessibility
  difficulty: 2
  prompt: Нужен комбобокс с автодополнением и асинхронной загрузкой опций в фирменном дизайне. Он должен полноценно работать с клавиатуры и со скринридером. Что выбрать?
  explanation: "У сложных виджетов (комбобокс, меню, табы, датапикер) десятки нюансов: aria-activedescendant, стрелки, Home/End, объявления, мобильные скринридеры. Headless-библиотеки уже решили эти задачи и не навязывают стили."
  type: choose-tool
  options:
    - label: "Headless-библиотека: React Aria ComboBox или Ariakit Combobox"
      why: "Лучший выбор: готовые роли, клавиатурная навигация и объявления для скринридеров протестированы, а стили полностью ваши."
    - label: Самописный комбобокс на div с role и aria-атрибутами
      why: Оправдан, только если библиотеки нельзя использовать. Паттерн ARIA для комбобокса сложный, и легко упустить клавиши, фокус или поддержку конкретных скринридеров.
    - label: Нативный <select>
      why: Максимально доступен и хорош для короткого фиксированного списка, но не поддерживает ввод с автодополнением и плохо стилизуется.
    - label: <input list> + <datalist>
      why: Годится для простых подсказок без особых требований к виду. Внешний вид списка и асинхронное поведение почти не контролируются и отличаются в разных браузерах.
  answer: 0

# error-boundaries: принято из черновика 2026-10-11
- id: error-boundaries-what-is-caught
  skill: error-boundary-scope
  question: error-boundaries
  difficulty: 2
  prompt: Какие ошибки перехватывает Error Boundary, а какие пролетают мимо него?
  explanation: "Boundary работает внутри цикла рендера React: если ошибка случилась при рендере или коммите, React знает, какое поддерево заменить на fallback. Обработчики событий и промисы выполняются позже, вне этого цикла. Для них нужен try/catch и state или showBoundary(error). Отклонённый промис, прочитанный через use(), попадает в boundary."
  type: quiz
  options:
    - label: Ловит ошибки рендера, жизненного цикла и эффектов потомков. Не ловит — в обработчиках, async-коде, SSR и в самом себе
      why: Верно. Ловятся только ошибки, возникшие, пока React рендерит или коммитит дерево. Код, вызванный позже (клик, setTimeout, then), выполняется вне этого процесса.
    - label: Ловит любые ошибки внутри своего поддерева, включая обработчики событий и отклонённые промисы
      why: Частое заблуждение. Обработчик и промис выполняются вне рендера, и React не может связать такую ошибку с поддеревом, поэтому fallback не появится.
    - label: Ловит ошибки только у дочерних компонентов-классов, функциональные компоненты нужно оборачивать отдельно
      why: Неверно. Сам boundary должен быть классом, но ловит он ошибки любых потомков, в том числе функциональных компонентов.
    - label: Ловит ошибки в обработчиках событий, но не в useEffect, потому что эффекты асинхронны
      why: Всё наоборот. Ошибку в эффекте React выполняет в рамках коммита и передаёт в boundary, а ошибку в обработчике — нет.
  answer: 0
- id: error-boundaries-async-handler-throw
  skill: error-boundary-scope
  question: error-boundaries
  difficulty: 2
  prompt: Автор ожидает, что при неудачном сохранении появится fallback. Но fallback не появляется. Найдите строку с проблемой.
  explanation: "throw внутри async-обработчика превращается в отклонённый промис вне рендера, и boundary его не видит. Ошибку нужно поймать самому: показать сообщение через state или передать её в boundary через showBoundary(error) из useErrorBoundary()."
  type: find-bug
  language: tsx
  code: |-
    function SaveButton({ data }: { data: Draft }) {
      const handleClick = async () => {
        const res = await fetch('/api/save', {
          method: 'POST',
          body: JSON.stringify(data),
        });
        if (!res.ok) throw new Error('Save failed');
      };
      return <button onClick={handleClick}>Save</button>;
    }

    <ErrorBoundary fallback={<p>Ошибка</p>}>
      <SaveButton data={draft} />
    </ErrorBoundary>;
  bugLines:
    - 7
  causes:
    - Ошибка выброшена в асинхронном обработчике события, вне рендера, — boundary такие ошибки не перехватывает
    - У ErrorBoundary нет пропа fallback, нужно передавать FallbackComponent
    - Перед проверкой res.ok нужно вызвать res.json(), иначе ошибка не сформируется
    - SaveButton не считается потомком boundary, потому что передан через children
  answer: 0
- id: error-boundaries-class-implementation
  skill: error-boundary-class-api
  question: error-boundaries
  difficulty: 2
  prompt: "Допишите классовый Error Boundary: переключение на fallback, логирование и обычный рендер потомков."
  explanation: Статический getDerivedStateFromError вызывается во время рендера и возвращает новый state для показа fallback. componentDidCatch вызывается в коммите и подходит для побочных эффектов вроде логирования. Хуков-аналогов этих методов нет, поэтому boundary пишут классом или берут react-error-boundary.
  type: fill-tokens
  language: tsx
  code: |-
    class Boundary extends Component<Props, State> {
      state: State = { hasError: false };
      static ___(error: Error) {
        return { hasError: true };
      }
      ___(error: Error, info: ErrorInfo) {
        logToSentry(error, info.componentStack);
      }
      render() {
        if (this.state.hasError) return this.props.fallback;
        return this.props.___;
      }
    }
  tokens:
    - getDerivedStateFromError
    - componentDidCatch
    - children
  decoys:
    - getDerivedStateFromProps
    - componentDidUpdate
    - onError
    - render
- id: error-boundaries-async-to-fallback
  skill: error-boundary-async-errors
  question: error-boundaries
  difficulty: 2
  prompt: Виджет внутри ErrorBoundary (react-error-boundary) загружает данные по кнопке «Обновить». При сетевой ошибке нужно показать тот же fallback с кнопкой «Повторить», что и при ошибках рендера. Что выбрать?
  explanation: "Boundary не видит асинхронные ошибки, но их можно передать в него вручную: поймать в catch и вызвать showBoundary(error). Тогда fallback, resetErrorBoundary и onError работают одинаково для ошибок рендера и сети. Глобальные обработчики подходят для логирования, а не для UI конкретного виджета."
  type: choose-tool
  options:
    - label: useErrorBoundary().showBoundary(error) в catch
      why: "Лучший вариант. Ошибка передаётся в ближайший boundary: показывается общий fallback, срабатывает onError, а кнопка «Повторить» сбрасывает состояние через resetErrorBoundary."
    - label: try/catch и локальный state error с инлайн-сообщением
      why: Подходит, если нужно мягкое сообщение рядом с кнопкой без замены всего виджета. Но тогда это отдельный UI, а не общий fallback.
    - label: window.addEventListener('unhandledrejection')
      why: Годится для глобального логирования необработанных промисов. Отрисовать fallback конкретного виджета через него нельзя.
    - label: Опция onUncaughtError в createRoot
      why: Нужна для централизованного логирования в React 19. Ошибки из обработчиков сюда не попадают, и запасной UI в нужном месте эта опция не показывает.
  answer: 0

# error-handling-strategy: принято из черновика 2026-10-11
- id: error-handling-strategy-layers-quiz
  skill: error-handling-architecture
  question: error-handling-strategy
  difficulty: 3
  prompt: Какой подход к обработке ошибок на уровне приложения правильный?
  explanation: "Единого места, где ловятся все ошибки, нет. Поэтому ошибки сначала классифицируют: бизнес, сеть, авторизация, рендер, чанк. Каждый тип перехватывают на своём уровне, а сбои отправляют в мониторинг с source maps, релизом и пользователем. Ожидаемые ошибки в мониторинг не идут."
  type: quiz
  options:
    - label: "Классифицировать ошибки и ловить каждый тип на своём уровне: границы, http-клиент, глобальные обработчики, мониторинг с контекстом"
      why: "Верно. Слои закрывают разные дыры: границы ловят рендер, клиент — 401 и повторы, глобальные обработчики — остальное, мониторинг показывает картину."
    - label: Один Error Boundary в корне плюс Sentry — этого хватит, он поймает все ошибки приложения
      why: Граница не ловит ошибки в обработчиках событий и асинхронном коде. К тому же падение одного виджета заменит fallback-ом весь экран.
    - label: Отправлять в мониторинг каждую ошибку, включая валидацию, чтобы ничего не упустить
      why: «Email занят» — ожидаемый сценарий, а не сбой. Такой шум прячет реальные проблемы и обесценивает алерты по росту ошибок.
    - label: Оборачивать каждый вызов API в компоненте в try/catch и показывать toast
      why: Логика дублируется по всему коду, и нет единой политики для 401, повторов и сетевых ошибок. Это задача http-клиента и библиотеки данных.
  answer: 0
- id: error-handling-strategy-chunk-load
  skill: chunk-load-error-recovery
  question: error-handling-strategy
  difficulty: 2
  prompt: После деплоя у пользователей с давно открытой вкладкой переход на lazy-маршрут падает с ошибкой загрузки чанка. Как обработать?
  explanation: После деплоя хеши файлов меняются, и старых чанков на сервере уже нет. Помогает только загрузка нового index.html. Ловите ошибку в границе маршрута (в Vite есть ещё событие `vite:preloadError`) и предлагайте перезагрузку. Флаг в sessionStorage защитит от цикла перезагрузок.
  type: choose-tool
  options:
    - label: Error Boundary маршрута распознаёт ошибку загрузки чанка и предлагает перезагрузить страницу
      why: Лучший вариант. Перезагрузка подтягивает новый манифест и актуальные чанки, а остальное приложение продолжает работать.
    - label: Повторять import() с экспоненциальным backoff
      why: Это помогает при временном сбое сети. Но удалённый после деплоя файл будет отдавать 404 при каждой попытке.
    - label: Показывать toast из глобального window.onerror
      why: Ошибка попадёт в лог, но пользователь останется на сломанном экране без способа восстановиться.
    - label: Отказаться от code splitting и собрать один бандл
      why: Проблема исчезнет, но вырастут размер загрузки и время старта. Оправдано разве что для маленьких приложений.
  answer: 0
- id: error-handling-strategy-event-handler
  skill: event-handler-errors
  question: error-handling-strategy
  difficulty: 2
  prompt: Автор ожидает, что при неудачном сохранении появится SaveError. Найдите строку, на которой это ожидание не оправдается.
  explanation: "Error Boundary ловит ошибки рендера, а не обработчиков событий и асинхронного кода. Здесь ошибка уйдёт в `unhandledrejection`, и пользователь ничего не увидит. Варианты исправления: try/catch с состоянием ошибки и отчётом в мониторинг, `showBoundary` из react-error-boundary или Action в `startTransition` — в React 19 такие ошибки доходят до границы."
  type: find-bug
  language: tsx
  code: |-
    function SaveButton() {
      const save = async () => {
        const res = await fetch('/api/save', {
          method: 'POST',
        });
        if (!res.ok) throw new Error('Save failed');
      };
      return (
        <ErrorBoundary fallback={<SaveError />}>
          <button onClick={save}>Сохранить</button>
        </ErrorBoundary>
      );
    }
  bugLines:
    - 6
  causes:
    - Error Boundary не ловит ошибки из обработчиков событий и async-кода — ошибка станет unhandled rejection
    - ErrorBoundary нельзя объявлять в том же компоненте, где находится кнопка
    - "Проверка res.ok лишняя: fetch сам отклоняет промис при HTTP-ошибке"
    - Бросать нужно Response, а не Error, иначе граница его не распознает
  answer: 0
- id: error-handling-strategy-query-client
  skill: api-error-policy
  question: error-handling-strategy
  difficulty: 2
  prompt: "Настройте QueryClient: toast только при неудачном фоновом обновлении и без повторов для 4xx."
  explanation: "`onError` в QueryCache срабатывает один раз на запрос, а не в каждом компоненте. Если данные уже есть, значит не удалось фоновое обновление: хватит toast. Если данных нет, ошибку покажет состояние запроса или граница. Функция `retry` не повторяет клиентские ошибки 4xx: повтор не исправит 404 или ошибку валидации."
  type: fill-tokens
  language: tsx
  code: |-
    const queryClient = new QueryClient({
      queryCache: new ___({
        onError: (error, query) => {
          if (query.state.___ !== undefined) {
            toast.error('Не удалось обновить данные');
          }
        },
      }),
      defaultOptions: {
        queries: {
          ___: (count, err) => !isClientError(err) && count < 3,
        },
      },
    });
  tokens:
    - QueryCache
    - data
    - retry
  decoys:
    - MutationCache
    - error
    - retryDelay
    - status

# security-advanced: принято из черновика 2026-10-11
- id: security-advanced-beyond-xss
  skill: react-threat-model
  question: security-advanced
  difficulty: 3
  prompt: "Коллега говорит: «React экранирует всё в JSX, значит фронтенд защищён». Что ответить?"
  explanation: "Автоэкранирование закрывает только часть XSS. Угрозы современного приложения шире: утечки секретов в бандл, незащищённые Server Functions и API, CSRF, open redirect, цепочка поставок, кликджекинг. Защита многоуровневая: CSP с nonce, заголовки, проверки на сервере, аудит зависимостей, минимальные привилегии."
  type: quiz
  options:
    - label: "Экранирование закрывает лишь часть XSS: остаются секреты в бандле, открытые Server Functions, CSRF, зависимости, open redirect"
      why: "Верно. Большинство этих угроз вообще не про рендер JSX, поэтому нужна защита на нескольких уровнях: сервер, заголовки, сборка, зависимости."
    - label: Достаточно добавить CSP — она закрывает все угрозы клиентского приложения
      why: CSP снижает ущерб от XSS и сторонних скриптов, но не защитит Server Function без авторизации, секрет в бандле или CSRF-запрос.
    - label: Server Functions не видны клиенту, поэтому достаточно защитить страницы, которые их вызывают
      why: Server Function — это публичный POST-эндпоинт. Его можно вызвать напрямую, минуя UI, поэтому проверки нужны внутри каждой функции.
    - label: Секреты в переменных окружения в безопасности, если не коммитить .env в репозиторий
      why: Переменные с префиксом VITE_ или NEXT_PUBLIC_ подставляются в JS-бандл при сборке, и их видит любой пользователь.
  answer: 0
- id: security-advanced-server-action-idor
  skill: server-functions-authz
  question: security-advanced
  difficulty: 2
  prompt: Server Function удаляет пост. Найдите уязвимость.
  explanation: "Аутентификация (кто ты) ≠ авторизация (можно ли тебе это). Любой залогиненный пользователь может отправить чужой postId и удалить чужой пост (IDOR). Исправление: `where: { id: postId, authorId: session.user.id }` или явная проверка владельца. Ещё стоит валидировать вход (например, zod): типы TS в рантайме не проверяются."
  type: find-bug
  language: tsx
