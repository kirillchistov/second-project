- id: render-vs-commit-tooltip-measure
  skill: layout-effect-measurement
  question: render-vs-commit
  difficulty: 2
  prompt: Тултип должен измерить свою высоту и, если не помещается снизу, показаться сверху. Пользователь не должен увидеть прыжок. Где измерять?
  explanation: "Нужен DOM после mutation, но до paint — это layout-фаза commit. useLayoutEffect видит вставленные узлы, а setState в нём применяется синхронно до отрисовки. Его стоит использовать только для измерений: он блокирует кадр."
