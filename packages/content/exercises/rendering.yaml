  explanation: Для React идентичность компонента — это позиция в дереве JSX, тип и key. Совпали все три — state сохраняется. Изменилось что-то одно — старое поддерево размонтируется вместе со всем состоянием. Поэтому key — штатный способ сбросить state, а Activity или CSS-скрытие — способы его сохранить.
