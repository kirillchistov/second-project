  explanation: "Render идёт сверху вниз: сначала родитель, потом ребёнок. Эффекты выполняются в commit снизу вверх: эффекты ребёнка срабатывают раньше эффектов родителя. Все layout-эффекты выполняются до paint, все пассивные — после. Поэтому родитель в своём эффекте может рассчитывать, что дети уже смонтированы."
