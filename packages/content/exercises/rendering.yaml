# lifecycle: принято из черновика 2026-10-11
- id: lifecycle-effect-mental-model
  skill: effect-as-synchronization
  question: lifecycle
  difficulty: 1
  prompt: Как правильно описать роль useEffect в жизненном цикле функционального компонента?
  explanation: Методов жизненного цикла в функциональных компонентах нет. Есть рендеры и эффекты, которые синхронизируют компонент с внешней системой. Эффект запускается после коммита, очищается перед повторным запуском и при размонтировании. Код должен выдерживать лишний цикл «запуск → очистка → запуск», который Strict Mode делает намеренно.
  type: quiz
  options:
    - label: "Это синхронизация с внешней системой: запуск после коммита, очистка и перезапуск при смене зависимостей, очистка при размонтировании"
      why: Верно. Эффект может запускаться и останавливаться много раз за жизнь компонента, поэтому думать о нём нужно как о подписке, а не как о разовом событии.
    - label: "useEffect(fn, []) — точный аналог componentDidMount: гарантированно выполнится ровно один раз за жизнь компонента"
      why: Неверно. В Strict Mode в разработке эффект выполнится дважды, с очисткой между запусками. Код, рассчитанный на один запуск, сломается.
    - label: Функция компонента вызывается один раз при монтировании, а обновления выполняются через эффекты
      why: "Неверно. Функция компонента вызывается при каждом рендере: при изменении state, props или контекста. Эффекты — лишь реакция на результат рендера."
    - label: Эффекты выполняются во время рендера, до обновления DOM, как componentWillMount
      why: "Неверно. Рендер должен быть чистым. Эффекты запускаются после коммита: useLayoutEffect — до отрисовки кадра, useEffect — обычно после неё."
  answer: 0
