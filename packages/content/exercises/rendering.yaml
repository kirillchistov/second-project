# render-vs-commit: принято из черновика 2026-10-11
- id: render-vs-commit-side-effects-quiz
  skill: render-commit-phases
  question: render-vs-commit
  difficulty: 2
  prompt: Почему побочные эффекты нельзя делать в теле компонента, а в useEffect и обработчиках событий — можно?
  explanation: "Render — это вычисление: React может его прервать, повторить или отбросить. Commit — момент, когда изменения точно применяются к DOM. Он синхронный и не прерывается. Правило: тело компонента — чистая функция от props и state, а всё внешнее делается в commit-фазе (эффекты) или в обработчиках."
  type: quiz
  options:
    - label: Рендер может прерваться, повториться или быть отброшен, а commit гарантированно применяет результат — эффекты безопасны только там
      why: "Верно. В конкурентном режиме рендер может выполниться несколько раз и не попасть на экран. Побочный эффект из такого рендера останется без пары: без отписки или с лишним запросом."
    - label: Рендер выполняется вне главного потока, поэтому из него нет доступа к DOM и сети
      why: Неверно. Рендер идёт в главном потоке. Его прерываемость — это кооперативная уступка браузеру между единицами работы, а не отдельный поток.
    - label: Эффекты в рендере просто медленнее, и React Compiler всё равно вынесет их в useEffect
      why: Неверно. Compiler мемоизирует чистые вычисления и не переносит побочные эффекты. Он, наоборот, рассчитывает на чистоту рендера.
    - label: Commit тоже прерываем, но React откатывает его эффекты, а эффекты рендера откатить не может
      why: "Неверно. Commit синхронный и не прерывается. Откатов эффектов в React нет: есть только cleanup перед следующим запуском или при размонтировании."
  answer: 0
- id: render-vs-commit-subscribe-in-render
  skill: render-purity-side-effects
  question: render-vs-commit
  difficulty: 2
  prompt: Компонент иногда продолжает получать сообщения из старых комнат. Найдите ошибку.
  explanation: Подписка создаётся при каждом вызове рендера. Если рендер прерван или отброшен, его эффект не выполнится, и отписки не будет. Подписки на внешние источники делают в useEffect с cleanup или через useSyncExternalStore.
  type: find-bug
  language: tsx
  code: |-
    function Chat({ roomId }: { roomId: string }) {
      const [msgs, setMsgs] = useState<Msg[]>([]);
      const off = chat.subscribe(roomId, (m) => {
        setMsgs((prev) => [...prev, m]);
      });
      useEffect(() => off, [off]);
      return <MessageList items={msgs} />;
    }
  bugLines:
    - 3
  causes:
    - "Подписка происходит в рендере: если рендер не дошёл до commit, эффект с отпиской для него не выполнится"
    - Функциональное обновление setMsgs вызывает бесконечный цикл рендеров
    - useEffect не может вернуть cleanup-функцию, сохранённую в переменную
    - MessageList нужно обернуть в memo, иначе сообщения дублируются
