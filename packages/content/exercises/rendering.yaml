- id: keys-no-id-in-data
  skill: list-keys
  question: keys
  difficulty: 2
  prompt: Редактируемый список пунктов чек-листа хранится как массив строк, id у пунктов нет. Пункты можно добавлять, удалять и перетаскивать. У каждой строки есть локальный флаг «редактируется». Какой key выбрать?
  explanation: Если в данных нет id, его нужно создать один раз в момент появления элемента (при добавлении или загрузке) и хранить вместе с данными. Генерировать ключ в рендере нельзя. Индекс подходит только для статичного списка, текст — только если он гарантированно уникален и не меняется.
  type: choose-tool
  options:
    - label: Хранить пункты как объекты и присваивать id через crypto.randomUUID() в обработчике добавления
      why: "Лучший вариант: id создаётся один раз и остаётся с пунктом, поэтому флаг «редактируется» не переезжает к соседу."
    - label: key={index}
      why: Подходит только для статичного списка. При удалении или перетаскивании флаг останется на позиции и окажется у другого пункта.
