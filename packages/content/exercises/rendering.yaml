- id: render-commit-timeline
  type: order
  kind: timeline
  skill: render-commit-phases
  question: render-vs-commit
  difficulty: 2
  prompt: Расставьте по порядку, что происходит после setState в обработчике клика.
  steps:
    - React вызывает функции компонентов (render)
    - Сравнивает новое дерево с предыдущим (reconciliation)
    - Применяет изменения к DOM (commit)
    - Выполняет useLayoutEffect
    - Браузер отрисовывает кадр (paint)
    - Выполняет useEffect
  explanation: >-
    Render чистый и может быть прерван, commit — синхронный. useLayoutEffect блокирует отрисовку,
    поэтому подходит для измерений DOM; useEffect обычно выполняется уже после paint.

- id: keys-quiz
  type: quiz
  skill: list-keys
  question: keys
  prompt: Что произойдёт, если в списке задач с локальным состоянием использовать key={index} и удалить первый элемент?
  options:
    - label: Состояние останется на старых позициях и окажется у других элементов, а удалится последний компонент
      why: Верно. Для React элемент с индексом 0 — всё тот же компонент, просто с новыми props; лишним стал последний.
    - label: React заметит удаление и аккуратно перенесёт состояние каждого элемента
      why: React не знает, какой элемент «тот самый», — он видит только ключи, а ключи 0, 1, 2 остались прежними.
    - label: Ничего — индекс уникален среди соседей, значит это корректный ключ
      why: Уникальности мало, ключ должен быть ещё и стабильным, то есть принадлежать данным, а не позиции.
    - label: React выбросит ошибку о дублирующихся ключах
      why: Дубликатов нет — индексы уникальны. Ошибки не будет, будет тихий баг.
  answer: 0
  explanation: >-
    Ключ должен быть стабильным и уникальным, обычно это id из данных. Индекс допустим только для статичного списка
    без сортировки, фильтрации и собственного состояния элементов.

# batching: принято из черновика 2026-10-11
- id: batching-updater-vs-value
  skill: state-updater-function
  question: batching
  difficulty: 2
  prompt: Почему при нескольких обновлениях подряд `setCount((c) => c + 1)` надёжнее, чем `setCount(count + 1)`?
  explanation: "С React 18 обновления батчатся везде: в обработчиках, промисах и таймаутах. React копит их в очередь и применяет за один рендер. Апдейтер получает результат предыдущего элемента очереди. Выражение `count + 1` считается из снимка рендера. Правило: если новое значение зависит от старого, используйте апдейтер."
  type: quiz
  options:
    - label: Апдейтер получает актуальное значение из очереди обновлений, а count — значение из снимка текущего рендера
      why: Верно. count — константа этого рендера. Сколько раз ни вызови setCount(count + 1), каждый вызов даст одно и то же число. Апдейтеры выполняются по цепочке.
    - label: setCount(count + 1) сразу запускает рендер, а апдейтер дожидается батчинга
      why: Неверно. Оба варианта ставят обновление в одну и ту же очередь и батчатся одинаково. Разница только в том, откуда берётся исходное значение.
    - label: Апдейтер отключает батчинг и применяет обновление синхронно
      why: Неверно. Синхронно применяет обновление flushSync. Апдейтер батчится как обычно, он просто вычисляет значение на основе предыдущего.
    - label: После setCount переменная count уже содержит новое значение, но апдейтер читает его быстрее
      why: "Неверно. count не меняется до следующего рендера: это const из замыкания. В этом и состоит проблема варианта со значением."
  answer: 0
- id: batching-mixed-updates-output
  skill: state-updater-function
  question: batching
  difficulty: 2
  prompt: Компонент смонтировали (без StrictMode), затем один раз нажали кнопку. Что будет в консоли?
  explanation: "Все три вызова попадают в один батч, поэтому рендер будет один. Очередь обрабатывается так: «заменить на 1» → «заменить на 1» → c => c + 1, то есть 1 + 1 = 2. Первые два вызова читают count = 0 из снимка, и только апдейтер берёт результат из очереди."
  type: predict-output
  language: tsx
  code: |-
    function Counter() {
      const [count, setCount] = useState(0);
      console.log('render', count);

      function handleClick() {
        setCount(count + 1);
        setCount(count + 1);
        setCount((c) => c + 1);
      }

      return <button onClick={handleClick}>+</button>;
    }
  options:
    - render 0 → render 2
    - render 0 → render 3
    - render 0 → render 1
    - render 0 → render 1 → render 1 → render 2
  answer: 0
- id: batching-interval-stale-closure
  skill: stale-closure-updater
  question: batching
  difficulty: 2
  prompt: Таймер показывает 1 и дальше не растёт. Найдите строку с ошибкой.
  explanation: "Эффект с [] запускается один раз, и колбэк интервала навсегда видит seconds = 0. Каждую секунду он вызывает setSeconds(1). Исправление — апдейтер `setSeconds((s) => s + 1)`: он берёт актуальное значение из очереди. Добавлять seconds в зависимости хуже, потому что интервал будет пересоздаваться каждую секунду."
  type: find-bug
  language: tsx
  code: |-
    function Timer() {
      const [seconds, setSeconds] = useState(0);

      useEffect(() => {
        const id = setInterval(() => {
          setSeconds(seconds + 1);
        }, 1000);
        return () => clearInterval(id);
      }, []);

      return <p>{seconds}</p>;
    }
  bugLines:
    - 6
  causes:
    - Колбэк интервала захватил seconds из первого рендера (stale closure) — нужен апдейтер s => s + 1
    - clearInterval в cleanup останавливает таймер сразу после первого тика
    - Интервалы нужно запускать в useLayoutEffect, иначе обновления теряются
    - Обновления из setInterval не батчатся, и React отбрасывает их
  answer: 0
- id: batching-scroll-after-add
  skill: flush-sync-usage
  question: batching
  difficulty: 3
  prompt: "Чат: по нажатию «Отправить» сообщение добавляется в список. Сразу в том же обработчике нужно прокрутить к новому DOM-элементу. При загрузке истории прокручивать не нужно. Что выбрать?"
  explanation: "Состояние обновляется не сразу: после setItems DOM ещё старый. flushSync заставляет React синхронно выполнить рендер и commit, и следующая строка уже видит новый элемент. Это редкий инструмент: он ломает батчинг и замедляет работу, поэтому применяйте его точечно, когда DOM нужен немедленно и именно из обработчика."
  type: choose-tool
  options:
    - label: flushSync(() => setItems(...)), затем scrollIntoView
      why: Лучший вариант. DOM обновляется синхронно прямо в обработчике, а прокрутка случается только при отправке, а не при любом изменении списка.
    - label: useLayoutEffect с зависимостью [items] и прокруткой
      why: Подходит, если прокручивать нужно при любом изменении списка. Здесь он сработает и на загрузку истории, и понадобится дополнительный флаг «это моя отправка».
    - label: setTimeout(scrollIntoView, 0) после setItems
      why: Часто срабатывает, но держится на внутреннем тайминге планировщика, а не на гарантии React. Это хрупкий хак.
    - label: Сразу после setItems прочитать lastElementChild
      why: "Не сработает: из-за батчинга DOM ещё не обновлён, и прокрутка уйдёт к предыдущему сообщению."
  answer: 0

# fiber: принято из черновика 2026-10-11
- id: fiber-why-it-appeared
  skill: fiber-architecture
  question: fiber
  difficulty: 3
  prompt: Зачем в React 16 появилась архитектура Fiber и чем она отличается от старого stack reconciler?
  explanation: Fiber — это про **прерываемость**, а не про скорость. Каждый компонент стал единицей работы. Дерево обходится циклом по ссылкам `child`/`sibling`/`return`, поэтому React может отдать поток браузеру, сменить приоритет или выбросить незавершённую работу. На этом стоят transitions, Suspense и выборочная гидрация.
  type: quiz
  options:
    - label: Рендер разбит на единицы работы, его можно прервать, приоритизировать и выбросить — в отличие от синхронной рекурсии
      why: Верно. Старый reconciler рекурсивно обходил всё дерево за один проход и блокировал поток. Fiber обходит дерево циклом и может уступать браузеру между узлами.
    - label: "Fiber ускоряет рендер: он сравнивает деревья за меньшее число операций"
      why: "Типичное заблуждение. Сырой объём работы почти не изменился. Выигрыш — в отзывчивости: срочный ввод не ждёт тяжёлый рендер."
    - label: Fiber ввёл виртуальный DOM, чтобы не трогать реальный DOM при каждом изменении
      why: Виртуальный DOM и diffing были в React с самого начала. Fiber переписал reconciler — способ, которым React обходит дерево и планирует работу.
    - label: Fiber переносит рендер компонентов в отдельный поток, чтобы не блокировать UI
      why: "Рендер по-прежнему идёт в главном потоке. Отзывчивость даёт time slicing: React работает порциями примерно по 5 мс и между ними отдаёт управление браузеру."
  answer: 0
- id: fiber-transition-interrupted
  skill: fiber-interruptible-render
  question: fiber
  difficulty: 3
  prompt: Идёт тяжёлый рендер внутри startTransition, и пользователь нажимает клавишу в поле ввода. Расставьте события по порядку.
  explanation: "Рендер строит `workInProgress`, не трогая экран, поэтому недостроенное дерево можно выбросить без следов. Срочное обновление (более приоритетный lane) проходит первым. В commit React применяет к DOM изменения, отмеченные во `flags`, и переключает указатель: `workInProgress` становится `current`. Отложенный transition затем рендерится заново."
  type: order
  kind: timeline
  steps:
    - React начинает строить workInProgress-дерево для transition, узел за узлом
    - Между единицами работы React отдаёт управление браузеру (time slicing)
    - Ввод создаёт срочное обновление с более приоритетным lane
    - React выбрасывает недостроенное workInProgress и рендерит срочное обновление
    - "Commit: новое дерево становится current, поле ввода обновлено на экране"
    - React заново рендерит отложенный transition и коммитит его
- id: fiber-side-effect-in-render
  skill: render-purity
  question: fiber
  difficulty: 2
  prompt: Аналитика показывает дубли события и события для результатов, которые пользователь так и не увидел. Найдите причину.
  explanation: В конкурентном React работу фазы render можно прервать, выбросить и повторить, поэтому тело компонента может выполниться несколько раз до commit, а может не дойти до него вовсе. Побочные эффекты из render — только в эффекты или обработчики. Здесь — `useEffect(() => track(...), [query])`.
  type: find-bug
  language: tsx
  code: |-
    function SearchResults({ query }: Props) {
      const results = useResults(query);
      analytics.track('results_shown', { query });
      return <List items={results} />;
    }
  bugLines:
    - 3
  causes:
    - "Побочный эффект в теле рендера: React может прервать, выбросить или повторить render, и событие уйдёт без commit на экран"
    - analytics.track асинхронный, без await события перемешиваются
    - Вызов track нужно обернуть в useMemo с зависимостью query, тогда он выполнится один раз
    - Хук useResults вызывается до track и меняет порядок хуков между рендерами
  answer: 0
- id: fiber-heavy-list-input-lag
  skill: deferred-value-for-heavy-render
  question: fiber
  difficulty: 2
  prompt: "Поле поиска фильтрует список, и рендер результатов занимает ~150 мс: ввод «залипает». Нужно, чтобы буквы появлялись сразу, а список обновлялся, как только успеет, без искусственной задержки. Что выбрать?"
  explanation: "Класс задачи: срочное обновление конкурирует с тяжёлым рендером. Решение — понизить приоритет тяжёлой части (`useDeferredValue` или `startTransition`). Fiber позволит прервать её рендер ради ввода. Список стоит обернуть в `memo`, иначе срочный рендер перерисует его со старым значением. Мемоизация вычислений и debounce лечат другие симптомы."
  type: choose-tool
  options:
    - label: useDeferredValue(query) для списка в memo, поле ввода — на обычном query
      why: Лучший вариант. memo пропускает список в срочном рендере, а фоновый рендер с новым значением прерывается нажатиями. Задержки нет на быстром устройстве.
    - label: Debounce ввода на 300 мс
      why: Подходит, чтобы реже слать запросы к серверу. Но задержка искусственная даже на быстром устройстве, а сам рендер, когда наступит, всё равно заблокирует поток.
    - label: useMemo вокруг фильтрации массива
      why: Помогает, если дорогое именно вычисление и его можно переиспользовать. Здесь дорог рендер списка, и при новом query мемо всё равно пересчитается.
    - label: flushSync при обновлении query
      why: "Обратный эффект: flushSync заставляет React синхронно закоммитить обновление без прерываний. Нужен для редких случаев, например чтобы прочитать DOM сразу после setState."
  answer: 0

# keys: принято из черновика 2026-10-11
- id: keys-random-key-in-render
  skill: list-keys
  question: keys
  difficulty: 1
  prompt: Пользователь печатает в любом поле, и после каждого символа поле теряет фокус. Найдите строку с ошибкой.
  explanation: "При каждом вводе родитель перерендеривается. `crypto.randomUUID()` в рендере даёт новый key, поэтому React считает каждый `li` новым элементом: старый DOM удаляется, создаётся новый, и фокус теряется. Ключ должен быть стабильным: здесь подходит `tag.id`."
  type: find-bug
  language: tsx
  code: |-
    function TagEditor({ tags, onRename }: Props) {
      return tags.map((tag) => (
        <li key={crypto.randomUUID()}>
          <input
            value={tag.label}
            onChange={(e) =>
              onRename(tag.id, e.target.value)
            }
          />
        </li>
      ));
    }
  bugLines:
    - 3
  causes:
    - Ключ генерируется заново на каждом рендере, поэтому React пересоздаёт `li` и `input`, и фокус теряется
    - Управляемый input теряет фокус, если value приходит из props. Нужен defaultValue
    - Ключ нужно ставить на `input`, а не на `li`, иначе React не сопоставит поля
    - Инлайн-функция в onChange пересоздаётся на каждом рендере, и из-за этого React перемонтирует input
  answer: 0
