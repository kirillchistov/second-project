  explanation: "Три режима React Router v7: declarative — только сопоставление URL и компонентов, data — loaders и actions через `createBrowserRouter`, framework — файловые роуты, SSR и типизация через Vite-плагин. Выбирайте минимальный режим, который закрывает задачу."
