- id: react-router-mode-migration
  skill: router-mode-choice
  question: react-router
  difficulty: 2
  prompt: Существующее SPA на `<BrowserRouter>` и `<Routes>`, данные грузятся в useEffect с водопадами. Нужно постепенно перенести загрузку в loaders и формы в actions, не меняя сборку и структуру файлов. Что выбрать?
  explanation: "Три режима React Router v7: declarative — только сопоставление URL и компонентов, data — loaders и actions через `createBrowserRouter`, framework — файловые роуты, SSR и типизация через Vite-плагин. Выбирайте минимальный режим, который закрывает задачу."
  type: choose-tool
  options:
    - label: "Data mode: createBrowserRouter + RouterProvider с loader и action у маршрутов"
      why: "Лучший вариант: даёт loaders, actions, errorElement и useNavigation. Переход идёт маршрут за маршрутом, без смены сборки и файловой структуры."
    - label: Остаться в declarative mode и вынести fetch в кастомные хуки
      why: Код станет чище, но загрузка по-прежнему стартует после рендера. Водопады и ручная обработка ошибок останутся. Подходит, если данных почти нет.
    - label: Framework mode с файловыми роутами и Vite-плагином
      why: Хорош для нового проекта или когда нужны SSR и типизация маршрутов. Здесь он требует перестроить сборку и структуру файлов, что противоречит условиям.
    - label: Переписать приложение на Next.js App Router
      why: Оправдано, если нужны серверные компоненты и SSR от фреймворка. Для постепенной миграции SPA это слишком дорогой шаг.
  answer: 0

# react-vs-others: принято из черновика 2026-10-11
- id: react-vs-others-update-model
  skill: framework-update-models
  question: react-vs-others
  difficulty: 2
  prompt: В чём главное архитектурное отличие React от Svelte и Solid?
  explanation: "Ключевое различие — гранулярность обновлений. React на уровне компонента: перерендер и reconciliation. Svelte и Solid на уровне узла: сигналы и компиляция без VDOM. Разница в скорости реальна, но в типичных приложениях архитектура влияет сильнее."
  type: quiz
  options:
    - label: React при смене состояния заново вызывает компонент и сравнивает деревья, а Svelte/Solid обновляют только DOM-узлы, подписанные на сигнал
      why: Верно. В Solid функция компонента выполняется один раз, затем сигнал обновляет конкретный узел. В React перерендер и reconciliation — базовая модель.
    - label: React использует Virtual DOM, поэтому он всегда заметно медленнее сигнальных фреймворков
      why: "Типичное заблуждение. В обычных приложениях разница меньше, чем от архитектурных решений: размещения состояния, разбиения на компоненты, работы с данными."
    - label: React компилирует компоненты на этапе сборки, а Svelte и Solid интерпретируют шаблоны в рантайме
      why: Наоборот. Компиляция — основа Svelte и Solid. React Compiler лишь автоматически добавляет мемоизацию, а модель перерендера остаётся прежней.
    - label: В Svelte и Solid нет компонентов, есть только шаблоны с реактивными переменными
      why: Компоненты есть везде. Отличается не наличие компонентов, а то, что происходит при изменении данных.
  answer: 0
- id: react-vs-others-rerender-child
  skill: react-rerender-model
