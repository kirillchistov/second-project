# choosing-framework: принято из черновика 2026-10-11
- id: choosing-framework-criteria-quiz
  skill: framework-choice-criteria
  question: choosing-framework
  difficulty: 2
  prompt: Команда спорит, брать ли Next.js для нового React-проекта. С чего правильнее начать выбор?
  explanation: Фреймворк выбирают под требования, а не по популярности. Сначала выясните, нужны ли SEO и быстрый первый контент, где грузятся данные, нужны ли RSC, где будет хостинг, что знает команда и насколько важна независимость от вендора. Только после этого сравнивайте Next.js, React Router v7, TanStack Start и Vite SPA.
  type: quiz
  options:
    - label: "С требований: SEO и первый контент, где грузятся данные, нужны ли RSC, хостинг, опыт команды, зависимость от вендора"
      why: Верно. Эти критерии отделяют случаи, где SSR и RSC окупаются, от случаев, где они только добавляют серверную инфраструктуру.
    - label: "С популярности: документация React рекомендует фреймворки, значит, Next.js подходит для любого проекта"
      why: Популярность не заменяет требования. Для админки за логином Next.js — лишний сервер, кэши и деплой, а Vite SPA проще и дешевле.
    - label: "С производительности: SSR всегда быстрее SPA, поэтому SSR-фреймворк выигрывает в любом случае"
      why: SSR ускоряет первый контент, но нагружает сервер и усложняет кэширование. В приложении за логином с долгими сессиями выигрыш обычно мал.
    - label: "С Server Components: без RSC приложение на React 19 быстро устареет"
      why: RSC — опциональная модель с новыми ограничениями. Клиентские SPA на React 19 полностью поддерживаются и остаются нормальным выбором.
  answer: 0
- id: choosing-framework-internal-admin
  skill: spa-vs-ssr-choice
  question: choosing-framework
  difficulty: 2
  prompt: "Внутренняя админка за логином: много таблиц и форм, SEO не нужен. Фронтенд раздаётся статикой с nginx, данные идут из готового REST API. Что выбрать?"
  explanation: "Если приложение за логином, SEO нет, а API уже существует, SSR почти ничего не даёт, но добавляет сервер, кэши и сложный деплой. Разумный стек здесь: Vite SPA, клиентский роутер и TanStack Query для серверного состояния. SSR-фреймворк нужен, когда важны SEO, первый контент или RSC."
  type: choose-tool
  options:
    - label: Vite SPA + React Router / TanStack Router + TanStack Query
      why: "Лучший выбор: сборка в статику ложится на nginx, сервер не нужен. Кэш, refetch и мутации берёт на себя TanStack Query."
    - label: Next.js App Router с Server Components
      why: Подходит для SEO-критичных сайтов и тяжёлой загрузки данных на сервере. Здесь это лишний Node-сервер, кэши фреймворка и новые ограничения RSC.
    - label: React Router v7 в режиме фреймворка с SSR
      why: Хорош, если нужен SSR на loaders/actions или идёт миграция с Remix. Для статичной админки серверный рендер не окупается.
    - label: Astro
      why: "Силён на преимущественно статичном контенте: блоги, документация, лендинги. Для насыщенного интерактивного приложения он не предназначен."
  answer: 0
- id: choosing-framework-decision-recipe
  skill: framework-choice-criteria
  question: choosing-framework
  difficulty: 3
  prompt: Соберите алгоритм выбора фреймворка для нового React-проекта.
  explanation: "Сначала требования и ограничения: они определяют, нужен ли сервер вообще. По ним составляют шорт-лист, затем сравнивают кандидатов по сложности, кэшам и зависимости от вендора. Прототип на целевом хостинге выявляет скрытые проблемы: кэш, ISR и изображения при self-hosted. Запись в ADR фиксирует критерии, чтобы через годы было понятно, когда и как мигрировать."
  type: order
  kind: recipe
  steps:
    - "Собрать требования и ограничения: SEO, первый контент, данные на сервере, RSC, хостинг, опыт команды"
    - По требованиям составить шорт-лист подходящих фреймворков
    - Сравнить кандидатов по сложности, отладке кэшей и зависимости от вендора
    - Проверить прототипом критичный сценарий с деплоем на целевой хостинг
    - Записать решение и критерии в ADR, оценив стоимость будущей миграции

# debugging: принято из черновика 2026-10-11
- id: debugging-dev-vs-prod-profile
  skill: production-profiling
  question: debugging
  difficulty: 2
  prompt: Profiler в dev-сборке показал, что рендер списка занимает 80 мс. Как понять, тормозит ли он у реальных пользователей?
  explanation: "Dev-сборка в разы медленнее production: в ней дополнительные проверки, предупреждения и двойные вызовы StrictMode. Выводы о скорости делают по production-сборке с профилированием: Profiler в DevTools, `<Profiler onRender>`, панель Performance. Dev-профиль годится, чтобы найти лишние рендеры, а не чтобы оценить их стоимость."
  type: quiz
  options:
    - label: "Собрать production-сборку с профилированием и замерить там: Profiler, `<Profiler onRender>` или панель Performance"
      why: Верно. Только такая сборка показывает время, близкое к реальному, и при этом сохраняет данные профилирования.
    - label: "Разделить время на два: в dev StrictMode рендерит дважды, остальное совпадает с production"
      why: Двойной рендер — лишь одна из причин. Dev добавляет проверки и предупреждения, поэтому разница не сводится к множителю 2.
    - label: "Доверять dev-цифрам: React одинаково быстр в любой сборке, отличаются только сообщения об ошибках"
      why: Неверно. Dev-сборка заметно медленнее, и её время нельзя переносить на production.
    - label: "Сразу обернуть элементы списка в memo: 80 мс — гарантированная проблема"
      why: Оптимизация без замера в реальных условиях может ничего не дать. Сначала нужна корректная метрика.
  answer: 0
- id: debugging-investigation-recipe
  skill: debugging-workflow
  question: debugging
  difficulty: 2
  prompt: Расставьте шаги типового поиска проблемы в React-приложении по порядку.
  explanation: Движение идёт от общего к частному. Сначала сужают проблему до компонента и действия. Потом смотрят его текущее состояние, затем время рендеров и причины, затем загрузку главного потока целиком. Точки останова ставят последними, чтобы проверить конкретную гипотезу, а не наугад.
  type: order
  kind: recipe
  steps:
    - "Воспроизвести проблему и сузить: какой компонент, какое действие"
    - В Components проверить текущие props, state, хуки и owner компонента
    - Записать взаимодействие в Profiler с «Record why each component rendered»
    - В Performance Chrome посмотреть треки Scheduler и Components и long tasks
    - Поставить точки останова или условный лог в обработчике или эффекте и проверить гипотезу
- id: debugging-stale-query-data
  skill: debugging-tool-choice
  question: debugging
  difficulty: 2
  prompt: Приложение на TanStack Query. После смены фильтра в Network видно запрос с верным параметром и корректный ответ, но список показывает старые данные. Чем искать причину?
  explanation: "Сеть исправна, значит, ошибка между ответом и UI — в слое данных. Для этого нужен инструмент самой библиотеки: TanStack Query Devtools показывают ключи, данные и статус каждого запроса. Частая находка — фильтр не входит в queryKey. Правило: сначала локализовать слой (сеть, кэш, рендер), потом брать инструмент этого слоя."
  type: choose-tool
  options:
    - label: TanStack Query Devtools
      why: "Лучший выбор: видно ключи кэша, данные и статус каждого запроса. Сразу понятно, в какую запись лёг ответ и какую читает компонент."
    - label: Profiler в React DevTools
      why: Показывает время рендеров и их причины. Он нужен для проблем производительности, а не для расследования, откуда компонент взял устаревшие данные.
    - label: Панель Performance в Chrome
      why: Нужна, когда интерфейс тормозит и надо найти long tasks в главном потоке. Логику кэша она не раскроет.
    - label: «Highlight updates when components render»
      why: Покажет, перерисовался ли список. Но не объяснит, почему в нём старые данные. Полезна для поиска лишних рендеров.
  answer: 0
- id: debugging-profiler-onrender
  skill: profiler-api
  question: debugging
  difficulty: 2
  prompt: Допишите код так, чтобы медленные рендеры ленты (дольше кадра) логировались прямо из приложения.
  explanation: "`<Profiler>` требует `id` и колбэк `onRender`. Колбэк получает id, фазу (mount или update) и `actualDuration` — время рендера поддерева в этом коммите. `baseDuration` — оценка рендера без мемоизации. В обычной production-сборке Profiler отключён, для замеров нужна профилирующая сборка."
  type: fill-tokens
  language: tsx
  code: |-
    import { Profiler } from 'react';

    function onRender(
      id: string,
      phase: string,
      actualDuration: number,
    ) {
      if (___ > 16) console.warn(id, phase);
    }

    <Profiler ___="Feed" ___={onRender}>
      <Feed />
    </Profiler>
  tokens:
    - actualDuration
    - id
    - onRender
  decoys:
    - baseDuration
    - name
    - onCommit

# forms: принято из черновика 2026-10-11
- id: forms-rhf-uncontrolled-quiz
  skill: forms-uncontrolled-performance
  question: forms
  difficulty: 2
  prompt: Почему для большой формы (30+ полей) React Hook Form обычно лучше, чем хранить все поля в одном `useState`?
  explanation: "RHF регистрирует поля как неконтролируемые и читает значения из DOM. Перерисовываются только те, кто подписан на изменившуюся часть formState. Один `useState` на всю форму перерисовывает её на каждый символ. Клиентская валидация в любом подходе нужна только для UX: сервер обязан проверять данные повторно."
  type: quiz
  options:
    - label: "Поля неконтролируемые: значения читаются через ref из DOM, и ввод символа не перерисовывает всю форму"
      why: Верно. `register` вешает ref и onChange без setState в родителе. Ре-рендер случается, только если компонент читает изменившуюся часть formState, например errors.
    - label: RHF батчит setState всех полей, поэтому рендеров столько же, но каждый дешевле
      why: Неверно. Выигрыш не в батчинге, а в том, что лишних рендеров формы почти нет. Батчинг в React 18+ и так автоматический.
    - label: "`useState` плохо работает с объектами, где больше десятка ключей, и теряет обновления"
      why: Неверно. Обновления не теряются. Проблема в том, что каждое изменение объекта перерисовывает весь компонент формы со всеми полями.
    - label: RHF сам валидирует данные на сервере, поэтому форма не ждёт ответа API
      why: Неверно. RHF работает только на клиенте. Серверную проверку нужно писать отдельно, и для неё можно переиспользовать ту же схему Zod.
  answer: 0
- id: forms-subscribe-progressive
  skill: forms-approach-choice
  question: forms
  difficulty: 2
  prompt: Next.js App Router, форма подписки с одним полем email. Она должна работать даже до загрузки JS, показывать ошибку от сервера и блокировать кнопку на время отправки. Что выбрать?
  explanation: Выбор зависит от уровня формы. Простая форма — `<form action>` + `useActionState`. Средняя — контролируемые поля в state. Сложная (массивы полей, зависимая валидация) — React Hook Form + Zod. Сервер валидирует данные в любом случае.
  type: choose-tool
  options:
    - label: "`<form action>` с Server Function и `useActionState`"
      why: Лучший вариант. Форма отправляется и без JS (прогрессивное улучшение), а ошибка и isPending доступны без библиотек.
    - label: React Hook Form + Zod
      why: Подходит для сложных форм с массивами полей и зависимой валидацией. Здесь это избыточно, и до гидрации handleSubmit не работает.
    - label: Контролируемый input в `useState` + fetch в onSubmit
      why: Годится для форм средней сложности с логикой на клиенте. Но до загрузки JS форма не работает, а pending и ошибки придётся вести вручную.
    - label: Глобальный стор (Zustand) для значения поля
      why: Нужен, если черновик формы должен жить между экранами. Для одного поля это лишний слой, и отправка без JS всё равно не появится.
  answer: 0
- id: forms-use-action-state-fill
  skill: forms-use-action-state
  question: forms
  difficulty: 2
  prompt: Допишите форму подписки. Серверная функция `subscribe(prevState, formData)` возвращает `{ error }`. Нужно показать ошибку и заблокировать кнопку на время отправки.
  explanation: "`useActionState` возвращает три значения: [state, formAction, isPending]. formAction передаётся в проп `action` формы, тогда React сам соберёт FormData. `useFormStatus` — альтернатива для дочерней кнопки, но вызывается без аргументов и только внутри формы."
  type: fill-tokens
  language: tsx
  code: |-
    function Subscribe() {
      const [state, formAction, isPending] =
        ___(subscribe, { error: null });
      return (
        <form ___={formAction}>
          <input name="email" type="email" />
          {state.error && <p role="alert">{state.error}</p>}
          <button disabled={___}>Подписаться</button>
        </form>
      );
    }
  tokens:
    - useActionState
    - action
    - isPending
  decoys:
    - useFormStatus
    - onSubmit
    - useOptimistic
    - state.pending
- id: forms-rhf-is-submitting-bug
  skill: forms-rhf-submit-state
  question: forms
  difficulty: 3
  prompt: Кнопка должна быть заблокирована, пока идёт запрос. Но кнопка не блокируется, и двойной клик отправляет форму дважды. Где ошибка?
  explanation: "`isSubmitting` остаётся true, пока не завершится промис, который вернул submit-обработчик. Этот обработчик ничего не возвращает, поэтому RHF считает отправку завершённой сразу. Нужно `async (data) => { await api.signUp(data); }` или `(data) => api.signUp(data)`."
  type: find-bug
  language: tsx
  code: |-
    function SignUp() {
      const { register, handleSubmit, formState } =
        useForm<FormValues>({ resolver: zodResolver(schema) });
      const onSubmit = (data: FormValues) => {
        api.signUp(data);
      };
      return (
        <form onSubmit={handleSubmit(onSubmit)}>
          <input {...register('email')} />
          <input type="password" {...register('password')} />
          <button disabled={formState.isSubmitting}>Go</button>
        </form>
      );
    }
  bugLines:
    - 4
    - 5
  causes:
    - Обработчик не возвращает промис запроса, поэтому RHF сразу сбрасывает isSubmitting в false
    - formState нужно деструктурировать, иначе RHF не подпишет компонент на isSubmitting
    - "isSubmitting работает только с опцией mode: 'onChange' в useForm"
    - handleSubmit нельзя передавать в onSubmit, его нужно вызывать в onClick кнопки
  answer: 0

# project-setup: принято из черновика 2026-10-11
- id: project-setup-cra-deprecated
  skill: cra-deprecation
  question: project-setup
  difficulty: 1
  prompt: Почему Create React App признан устаревшим и с чего команда React советует начинать новый проект?
  explanation: "В феврале 2025 CRA официально признан устаревшим: он медленный, не развивался и не решал роутинг, загрузку данных и code splitting. Сегодня начинают с фреймворка (Next.js, React Router, Expo) или с Vite для SPA. Правило: без фреймворка эти задачи придётся решать самому."
  type: quiz
  options:
    - label: CRA медленный, не развивался и не решал роутинг, загрузку данных и code splitting — берут фреймворк или Vite для SPA
      why: Верно. Поэтому команда React рекомендует фреймворк для full-stack задач и Vite, если нужен просто сборщик для SPA.
    - label: CRA не поддерживал TypeScript, поэтому для типизированных проектов пришлось искать замену
      why: Неверно. У CRA был шаблон --template typescript. Отказались от CRA из-за медленной работы и отсутствия развития, а не из-за TS.
    - label: React теперь требует серверный рендеринг, а клиентские SPA больше не поддерживаются
      why: "Неверно. SPA по-прежнему поддерживаются: Vite — стандарт для SPA, а фреймворки тоже умеют работать в режиме SPA."
    - label: "Главная проблема — eject: после него конфигурацию webpack нельзя было обновлять"
      why: "eject был неудобен, но причина отказа не в нём. Сейчас вопрос об eject просто неактуален: новые проекты на CRA не создают."
  answer: 0
- id: project-setup-internal-admin
  skill: spa-vs-framework-choice
  question: project-setup
  difficulty: 1
  prompt: Новая внутренняя админка за логином. SEO не нужно, бэкенд — отдельный REST API другой команды. Нужны быстрый dev-сервер и простой деплой статикой. С чего начать?
  explanation: "Если страницы за логином и не индексируются, SSR ничего не даёт: нужны только сервер и инфраструктура. Для такой SPA достаточно Vite. Фреймворк нужен, когда есть SEO, серверная загрузка данных, Server Components или API-роуты."
  type: choose-tool
  options:
    - label: Vite с шаблоном react-ts
      why: "Лучший выбор: мгновенный dev-сервер на ES-модулях, Fast Refresh, сборка со code splitting. Результат деплоится как статика."
    - label: Next.js с SSR
      why: Подошёл бы для публичных страниц с SEO или серверной загрузкой данных. За логином это лишний Node-сервер и лишняя сложность.
    - label: Create React App
      why: "Официально устарел с февраля 2025: медленный и не развивается. Для новых проектов его не берут."
    - label: Собственный конфиг webpack + Babel
      why: Оправдан только при очень специфичных требованиях к сборке. Иначе это время на настройку и поддержку того, что Vite даёт из коробки.
  answer: 0
- id: project-setup-seo-catalog
  skill: spa-vs-framework-choice
  question: project-setup
  difficulty: 2
  prompt: "Публичный каталог интернет-магазина: важны SEO и быстрый первый показ, данные берутся из БД на сервере, форме заявки нужен свой API-эндпоинт. Что выбрать?"
  explanation: SSR/SSG для SEO, загрузка данных на сервере и API-роуты — это задачи фреймворка. В SPA на Vite всё это пришлось бы собирать вручную. React Router в режиме фреймворка тоже подошёл бы. Главное — не голый сборщик.
  type: choose-tool
  options:
    - label: Next.js
      why: "Лучший выбор: SSR/SSG, Server Components, серверная загрузка данных, файловый роутинг и API-роуты есть из коробки."
    - label: SPA на Vite
      why: Хорош для приложений за логином. Здесь пришлось бы вручную настраивать SSR, серверные данные и отдельный бэкенд для формы.
    - label: Create React App + react-helmet
      why: "CRA устарел, а мета-теги из react-helmet не заменят серверный рендеринг: контент всё равно приходит в браузер только после загрузки JS."
    - label: Expo
