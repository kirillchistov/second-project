# bundling-tree-shaking: принято из черновика 2026-10-13
- id: bundling-cjs-no-tree-shaking
  skill: tree-shaking-conditions
  question: bundling-tree-shaking
  difficulty: 2
  prompt: Команда заменила `import _ from 'lodash'` на `import { debounce } from 'lodash'`, но размер бандла не изменился. Почему?
  explanation: "Tree-shaking опирается на статическую структуру ES-модулей: `import`/`export` известны до выполнения кода. В CommonJS экспорты — это обычный объект, который собирается в рантайме. Нужна ESM-сборка (`lodash-es`, `es-toolkit`), именованный импорт и отсутствие побочных эффектов при импорте."
  type: quiz
  options:
    - label: "lodash — CommonJS: `module.exports` собирается в рантайме, и бандлер не может статически доказать, что остальное не нужно"
      why: Верно. Анализ возможен только для статических `import`/`export`. Для CJS бандлер оставляет модуль целиком.
    - label: "Синтаксис импорта ничего не решает: именованный импорт сработал бы, только если бы ещё и импорт по умолчанию удалили из проекта"
      why: Дело не в синтаксисе. Для CJS именованный импорт — лишь interop поверх того же объекта `module.exports`, а он всё равно попадает в бандл целиком.
    - label: "Нужно добавить `sideEffects: false` в package.json приложения, тогда lodash вырежется"
      why: "`sideEffects` позволяет выбрасывать неиспользуемые ESM-модули целиком, но не делает CommonJS статически анализируемым."
    - label: Tree-shaking работает только для кода проекта, а node_modules бандлер не трогает
      why: "Неверно: ESM-зависимости (es-toolkit, lodash-es) отлично шейкаются. Главное — формат модулей, а не их расположение."
  answer: 0
