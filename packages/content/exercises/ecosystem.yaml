  explanation: "Правило выбора: при RSC и требовании нулевого рантайма нужен CSS, который собирается заранее. Если нужна ещё и типобезопасность в TS — zero-runtime CSS-in-JS. Если важнее скорость вёрстки — Tailwind. Если нужен минимум настройки — CSS Modules."
