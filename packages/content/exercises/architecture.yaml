  explanation: "Удалённый модуль может не загрузиться: его деплоят отдельно, он может лежать или отдавать ошибку. lazy делает импорт асинхронным. Suspense показывает спиннер на время загрузки. ErrorBoundary (например, из react-error-boundary) снаружи ловит ошибку импорта и рендерит fallback. Падение remote не должно ронять хост."
