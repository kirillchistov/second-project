# code-review: принято из черновика 2026-10-11
- id: code-review-focus-quiz
  skill: code-review-priorities
  question: code-review
  difficulty: 3
  prompt: На что в первую очередь должен смотреть человек при code review React-кода?
  explanation: "Ревью — проверка смысла: корректность, архитектура, производительность горячих путей, a11y, безопасность, типы и тесты. Всё, что можно проверить машиной (формат, простые правила, типы), уходит в Prettier, ESLint и TypeScript в CI, чтобы ревьюер не тратил на это внимание."
  type: quiz
  options:
    - label: "На смысл: корректность эффектов и состояния, архитектуру, горячие пути, доступность, безопасность и тесты"
      why: "Верно. Это то, что не поймает автоматика: лишний источник истины, гонка в эффекте, XSS через dangerouslySetInnerHTML, тест на реализацию."
    - label: "На соблюдение стайлгайда: именование, форматирование, порядок импортов — это основа качества кода"
      why: Стиль важен, но его должны решать Prettier и ESLint в CI. Споры о стиле на ревью — типичный подводный камень и трата времени команды.
    - label: "На покрытие: если coverage выше порога, логику можно подробно не читать"
      why: Высокий coverage не гарантирует, что тесты проверяют поведение и краевые случаи. Тесты на реализацию дают процент, но не уверенность.
    - label: "На производительность: каждое вычисление и колбэк должны быть обёрнуты в useMemo и useCallback"
      why: "Мемоизация «везде» — не цель ревью: смотрят на лишние рендеры именно на горячих путях, а React Compiler и так мемоизирует многое сам."
  answer: 0
- id: code-review-nested-component
  skill: nested-component-definition
  question: code-review
  difficulty: 2
  prompt: "На ревью: пользователи жалуются, что поле поиска теряет фокус после каждого символа. Найдите строку с причиной."
  explanation: "Компонент, объявленный внутри компонента, на каждом рендере — новая функция, то есть новый тип. React не может сопоставить его с прошлым, размонтирует старый input и монтирует новый — фокус и состояние теряются. Решение: вынести SearchInput наружу и передать value/onChange через props или вставить JSX напрямую."
  type: find-bug
  language: tsx
  code: |-
    function SearchPage() {
      const [query, setQuery] = useState('');
      const SearchInput = () => (
        <input
          value={query}
          onChange={(e) => setQuery(e.target.value)}
        />
      );
      return (
        <Layout search={<SearchInput />}>
          <Results query={query} />
        </Layout>
      );
    }
  bugLines:
    - 3
  causes:
    - "SearchInput объявлен внутри SearchPage: каждый рендер создаёт новый тип компонента, и React перемонтирует input"
    - Контролируемому input нужен defaultValue вместе с value, иначе React сбрасывает фокус
    - setQuery нельзя вызывать из вложенной стрелочной функции — замыкание устаревает и ломает ввод
    - JSX-элемент нельзя передавать в prop search — React клонирует его при каждом рендере Layout
  answer: 0
- id: code-review-style-automation
  skill: code-review-automation
  question: code-review
  difficulty: 2
  prompt: На каждом ревью в команде по полчаса спорят о кавычках, точках с запятой и порядке импортов. Как это решить?
  explanation: "Правило: всё, что можно проверить машиной, проверяет машина. Форматтер и линтер в pre-commit и CI снимают споры о стиле, а ревьюер тратит внимание на смысл: состояние, эффекты, архитектуру, безопасность."
  type: choose-tool
  options:
    - label: Prettier + ESLint (import order) в pre-commit и обязательной проверке CI
      why: "Лучший вариант: стиль применяется автоматически и единообразно, спорить не о чем, PR со сломанным стилем просто не пройдёт CI."
    - label: Подробный стайлгайд в вики и ссылки на него в комментариях
      why: Полезен для договорённостей, которые не автоматизировать (именование, структура модулей), но правила форматирования люди всё равно будут нарушать и обсуждать.
    - label: Помечать стилевые замечания как nit:, чтобы они не блокировали мерж
      why: "Разделение блокирующих и nit: — хорошая культура для вкусовых предложений, но время на написание и чтение таких комментариев никуда не девается."
    - label: Назначить одного ревьюера, отвечающего только за стиль
      why: Создаёт бутылочное горлышко и задержки ревью, а проверку, которую делает машина за секунды, перекладывает на человека.
  answer: 0
- id: code-review-process-recipe
  skill: code-review-process
  question: code-review
  difficulty: 2
  prompt: Соберите порядок действий при ревью PR с новой фичей.
  explanation: "Сначала понять цель и размер PR: если его не понять за ~15 минут, его просят разбить. Затем проверить, что автоматика зелёная, иначе вы ревьюите то, что машина отвергнет. Дальше идти от крупного к мелкому: если архитектура неверна, детали всё равно придётся переписывать. В конце оставить комментарии с «почему» и явным разделением блокирующих замечаний и nit:."
  type: order
  kind: recipe
  steps:
    - Прочитать описание и задачу, оценить размер — при необходимости попросить разбить PR
    - "Убедиться, что CI зелёный: линтер, типы, тесты"
    - "Оценить архитектуру: где живёт состояние, границы модулей, нет ли дублирования источников истины"
    - "Проверить детали: эффекты и зависимости, гонки, ключи, загрузку и ошибки, безопасность, тесты на поведение"
    - "Оставить комментарии с объяснением «почему», разделив блокирующие и nit:"

# component-patterns: принято из черновика 2026-10-11
- id: component-patterns-inversion-of-control
  skill: component-patterns-purpose
  question: component-patterns
  difficulty: 3
  prompt: Какую общую задачу решают compound components, control props, state reducer и headless hooks?
  explanation: "Все эти паттерны дают потребителю контроль над разметкой, состоянием или переходами, но не раздувают API пропсами-флагами. Правило выбора: разметка — compound или headless, значение — control props, логика переходов — state reducer."
  type: quiz
  options:
    - label: "Инверсия управления: потребитель получает контроль над разметкой, состоянием или переходами без новых флагов в props"
      why: Верно. Вместо `closeOnSelect`, `renderItem`, `hideIcon` и других флагов компонент отдаёт наружу нужную точку контроля, а свою логику оставляет в одном месте.
    - label: "Оптимизация производительности: меньше лишних ререндеров за счёт контекста и мемоизации"
      why: Это не их цель. Compound components на контексте могут даже добавить ререндеры потребителей. Производительность здесь — побочная тема.
    - label: Замена глобального стейт-менеджера для состояния UI-компонентов
      why: "Паттерны работают на уровне одного компонента: состояние табов или меню живёт внутри него. Глобальный store они не заменяют и не должны."
    - label: "Совместимость с SSR: логика уходит в хуки, и компонент рендерится на сервере без гидрации"
      why: SSR и гидрация тут ни при чём. Headless-хук тоже выполняется при гидрации, просто разметку пишет потребитель.
  answer: 0
- id: component-patterns-dropdown-custom-transitions
  skill: state-reducer-pattern
  question: component-patterns
  difficulty: 3
  prompt: Dropdown из дизайн-системы используется в 40 местах. В одном месте меню не должно закрываться при выборе пункта, в другом Escape должен только сбрасывать поиск. Флаги на каждый случай добавлять не хочется. Что выбрать?
  explanation: "Если просят «а можно, чтобы при X не происходило Y», нужно менять переходы состояния. State reducer отдаёт потребителю функцию `(state, action) => changes`: он правит только нужные переходы, остальное работает по умолчанию. Так сделано в Downshift."
  type: choose-tool
  options:
    - label: "State reducer: проп `stateReducer(state, action)`, который может переопределить изменения"
      why: Лучший выбор. Потребитель перехватывает конкретный action (выбор пункта, Escape) и меняет результат, а остальная логика компонента остаётся нетронутой.
    - label: "Control props: сделать `isOpen` контролируемым через `isOpen` и `onOpenChange`"
      why: Подходит, когда снаружи нужно просто открыть или закрыть меню. Для правки переходов каждому потребителю пришлось бы повторять логику клавиатуры и выбора.
    - label: "Headless hook: переписать Dropdown на `useDropdown` с prop getters"
      why: "Хорош, когда в каждом месте сильно разная разметка. Здесь проблема в поведении, а не в разметке: хук без state reducer не решит задачу, а миграция дорогая."
    - label: "Compound components: разбить на `<Dropdown.Trigger>` и `<Dropdown.Item>`"
      why: Даёт гибкость разметки и состава частей. Логика закрытия по-прежнему зашита внутри, так что просьбы о поведении не закрыты.
  answer: 0
- id: component-patterns-controllable-falsy-value
  skill: controlled-uncontrolled-props
  question: component-patterns
  difficulty: 2
  prompt: Родитель передаёт `value={0}` или `value=""`, но компонент игнорирует внешнее значение и живёт своим состоянием. Найдите ошибку.
  explanation: "Режим определяется по проверке на `undefined`, а не по истинности: `0`, `''` и `false` — валидные контролируемые значения. Режим вычисляется на каждом рендере. Если он сменится за время жизни компонента, стоит предупредить в dev, как это делает React для input."
  type: find-bug
  language: tsx
  code: |-
    function useControllableState<T>(
      controlled: T | undefined,
      defaultValue: T,
      onChange?: (v: T) => void,
    ) {
      const [inner, setInner] = useState(defaultValue);
      const isControlled = Boolean(controlled);
      const value = isControlled ? controlled! : inner;
      const setValue = (next: T) => {
        if (!isControlled) setInner(next);
        onChange?.(next);
      };
      return [value, setValue] as const;
    }
  bugLines:
    - 7
  causes:
    - "Проверка на истинность: при `0`, `''` или `false` компонент считает себя неконтролируемым — нужно `controlled !== undefined`"
    - В контролируемом режиме нужно тоже вызывать `setInner`, иначе значение не обновится
    - "`onChange` нужно вызывать только в неконтролируемом режиме, иначе родитель получит лишний вызов"
    - "`setValue` должен быть обёрнут в `useCallback`, иначе значение сбрасывается на каждом рендере"
  answer: 0
- id: component-patterns-compound-context
  skill: compound-components
  question: component-patterns
  difficulty: 2
  prompt: "Допишите основу compound components: `Tabs` делится состоянием с частями через контекст, а `useTabs` падает с понятной ошибкой вне `<Tabs>` (React 19)."
  explanation: Части compound-компонента получают неявное состояние из контекста. Default `null` и guard-хук превращают «Tab вне Tabs» в понятную ошибку вместо `undefined`. В React 19 сам контекст рендерится как провайдер, а `use` читает его, в том числе условно.
  type: fill-tokens
  language: tsx
  code: |-
    const TabsContext = createContext<TabsCtx | ___>(null);

    function Tabs({ children }: { children: ReactNode }) {
      const [value, setValue] = useState('a');
      const ctx = { value, setValue };
      return <TabsContext ___={ctx}>{children}</TabsContext>;
    }

    function useTabs() {
      const ctx = ___(TabsContext);
      if (!ctx) throw new Error('Tab outside <Tabs>');
      return ctx;
    }
  tokens:
    - "null"
    - value
    - use
  decoys:
    - undefined
    - Provider
    - useRef
    - children

# design-system: принято из черновика 2026-10-11
- id: design-system-architecture-quiz
  skill: design-system-architecture
  question: design-system
  difficulty: 3
  prompt: Команда начинает собственную библиотеку компонентов на React. Какая архитектура считается надёжной основой?
  explanation: Разделяйте ответственность по слоям. Токены задают визуальный язык и темы. Headless-библиотека отвечает за поведение и доступность. Ваши стили отвечают за внешний вид. Композиционный API (compound components, `asChild`, нативные props) позволяет комбинировать готовые части и не плодить флаги.
  type: quiz
  options:
    - label: Токены как CSS-переменные для тем, поведение и a11y из headless-библиотеки, свои стили и композиционный API
      why: "Верно. Каждый слой решает свою задачу: токены — визуальный язык, Radix или React Aria — фокус, клавиатуру и ARIA, стили и API остаются за командой."
    - label: Взять стилизованную библиотеку вроде MUI и переопределять её стили через тему
      why: Так быстро стартовать, но придётся бороться с чужими стилями и runtime CSS-in-JS, который плохо сочетается с RSC. Своего визуального языка по сути не будет.
    - label: Написать все компоненты с нуля, включая фокус-ловушки и навигацию с клавиатуры, чтобы не зависеть от чужого кода
      why: Доступные модалки, меню и комбобоксы — это месяцы работы над краевыми случаями. Чаще всего в итоге ломаются клавиатура и скринридеры.
    - label: Сделать по одному универсальному компоненту на сущность с набором boolean-props вроде isLarge, isRounded, withIcon
      why: Флаги дают комбинаторный взрыв и противоречивые сочетания. Лучше использовать явные варианты (variant, size) и композицию.
  answer: 0
- id: design-system-accessible-combobox
  skill: headless-components-choice
  question: design-system
  difficulty: 2
  prompt: "В дизайн-систему нужен комбобокс с автодополнением: навигация стрелками, ARIA для скринридеров, позиционирование списка у края экрана. Стили — строго по макетам и токенам. Что выбрать?"
  explanation: Сложное интерактивное поведение берите из headless-библиотеки, а внешний вид делайте сами. Так доступность и позиционирование достаются проверенными, а визуальный язык остаётся вашим.
  type: choose-tool
  options:
    - label: Headless-комбобокс (React Aria, Ariakit, Headless UI) + свои стили на токенах
      why: "Лучший вариант: фокус, клавиатура, ARIA и позиционирование уже решены, разметка и стили полностью ваши."
    - label: Свой компонент на div и useState с обработкой onKeyDown
      why: Подходит разве что для учебной задачи. Роли, aria-activedescendant, скринридеры и краевые случаи придётся проходить заново.
    - label: Готовый Autocomplete из стилизованной библиотеки (MUI)
      why: Хорош, если команда принимает чужой визуальный язык. Подгонять его под свои макеты дорого, а runtime-стили мешают RSC.
    - label: Нативный input с datalist
      why: Годится для простой подсказки без стилизации. Внешний вид списка почти не настраивается и отличается между браузерами.
  answer: 0
- id: design-system-aschild-slot
  skill: aschild-slot
  question: design-system
  difficulty: 3
  prompt: "Допишите упрощённый Slot и Button с `asChild`: при asChild кнопка отдаёт свои props дочернему элементу вместо рендера button."
  explanation: Slot не рендерит свой DOM-узел. Он клонирует единственного ребёнка и подмешивает ему props. Настоящий Slot из Radix ещё сливает className, style, обработчики и ref, а не просто перезаписывает их. Это даёт поведение и стили кнопки с разметкой ссылки роутера.
  type: fill-tokens
  language: tsx
  code: |-
    type SlotProps = React.HTMLAttributes<HTMLElement> & {
      children?: React.ReactNode;
    };

    function Slot({ children, ...props }: SlotProps) {
      if (!React.___(children)) return null;
      return React.___(children, props);
    }

    function Button({ asChild, ...props }: ButtonProps) {
      const Comp = asChild ? ___ : 'button';
      return <Comp className="btn" {...props} />;
    }
  tokens:
    - isValidElement
    - cloneElement
    - Slot
  decoys:
    - createElement
    - forwardRef
    - Fragment
    - "'a'"
- id: design-system-button-classname
  skill: component-props-forwarding
  question: design-system
  difficulty: 2
  prompt: Потребители пишут `<Button className="mt-4">`, но отступ не применяется. Найдите ошибку (React 19).
  explanation: "Компонент дизайн-системы должен расширять нативные props: className потребителя сливается с базовыми классами через cn или clsx, остальное прокидывается через spread. В React 19 ref — обычный prop, ComponentProps<'button'> его уже включает, и forwardRef не нужен."
  type: find-bug
  language: tsx
  code: |-
    type ButtonProps = React.ComponentProps<'button'> & {
      variant?: 'primary' | 'ghost';
    };
    export function Button({
      variant = 'primary', className, ...props
    }: ButtonProps) {
      return (
        <button
          {...props}
          className={`btn btn-${variant}`}
        />
      );
    }
  bugLines:
    - 10
  causes:
    - "className потребителя деструктурирован и выброшен — его нужно слить с базовыми классами: cn('btn', `btn-${variant}`, className)"
    - Без forwardRef компонент теряет ref, и стили не применяются
    - "{...props} должен стоять после className, чтобы потребитель мог переопределить классы"
    - variant нужно заменить на boolean-props isPrimary и isGhost
  answer: 0

# flux-unidirectional: принято из черновика 2026-10-11
- id: flux-vs-mvc-core-idea
  skill: unidirectional-data-flow
  question: flux-unidirectional
  difficulty: 2
  prompt: Какую главную проблему клиентского MVC с двусторонним связыванием решил Flux?
  explanation: "Flux ценен не скоростью, а **отслеживаемостью**: состояние меняется только в ответ на явные действия и в одном направлении. Поэтому изменения можно залогировать, воспроизвести и отладить. Та же идея есть в самом React: state → UI, props вниз, события вверх."
  type: quiz
  options:
    - label: Изменения шли каскадом в обе стороны, и было трудно понять, кто и почему поменял данные. Flux меняет состояние только через действия
      why: Верно. Цикл Action → Dispatcher → Store → View делает каждое изменение явным, поэтому его можно отследить, залогировать и воспроизвести.
    - label: "Однонаправленный поток быстрее: он сокращает число операций с DOM"
      why: Производительность не была целью Flux. Число операций с DOM сокращает reconciliation в React, а архитектура данных на это не влияет.
    - label: В MVC не было общего состояния, а Flux ввёл единый глобальный стор
      why: Модели в MVC и были общим состоянием. Единый стор появился в Redux, а в оригинальном Flux сторов несколько.
    - label: Однонаправленный поток требует глобального стора вроде Redux, без него React-приложение двунаправленное
      why: "Типичное заблуждение. React однонаправлен и без Redux: props идут вниз, события — вверх, а useState меняется только через setState."
  answer: 0
- id: flux-mutating-props-bug
  skill: props-down-events-up
  question: flux-unidirectional
  difficulty: 2
  prompt: Галочка не переключается, хотя onChange срабатывает. Найдите строку, которая нарушает однонаправленный поток данных.
  explanation: Props принадлежат родителю и доступны только для чтения. Мутация объекта не вызывает рендер, поэтому React возвращает checkbox к последнему отрендеренному значению. Правильно поднять событие вверх, например через `onToggle(todo.id)`. Тогда владелец сам изменит своё состояние, и новые props придут вниз.
  type: find-bug
  language: tsx
  code: |-
    function TodoItem({ todo }: { todo: Todo }) {
      return (
        <label>
          <input
            type="checkbox"
            checked={todo.done}
            onChange={() => {
              todo.done = !todo.done;
            }}
          />
          {todo.title}
        </label>
      );
    }
  bugLines:
    - 8
  causes:
    - "Компонент мутирует props: рендер не запускается, а данные должен менять владелец через колбэк вроде onToggle"
    - Для checkbox нужно использовать onClick, а не onChange
    - Вместо checked нужно использовать defaultChecked, тогда изменение сохранится
    - Без htmlFor у label клик по checkbox не доходит до обработчика
  answer: 0
