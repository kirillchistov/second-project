  prompt: В чём главная ценность feature flag по сравнению с выпуском функции обычным деплоем?
  explanation: Флаг отделяет деплой (код в проде) от релиза (функция включена). Отсюда постепенная выкатка, мгновенное выключение без отката, A/B-тесты и trunk-based разработка. Цена — каждый живой флаг удваивает число путей в коде и тестах, поэтому временные флаги удаляют.
  type: quiz
  options:
    - label: Код уже в продакшене, а включение функции, её раскатка по сегментам и выключение происходят без нового деплоя
      why: "Верно. Деплой и релиз становятся независимыми: можно включить 5% пользователей или выключить функцию за секунды."
    - label: "Можно меньше тестировать новую ветку: ошибки увидит лишь малый процент пользователей"
      why: Раскатка уменьшает радиус поражения, но не заменяет тесты. Обе ветки флага нужно тестировать, пока флаг жив.
    - label: Флаги можно оставлять в коде навсегда — так любую функцию всегда можно выключить
      why: Навсегда остаются только ops- и permission-флаги. Release-флаги после 100% удаляют, иначе комбинации путей растут.
    - label: Флаг скрывает код будущей функции, поэтому секретные фичи безопасно держать в бандле
      why: Код в клиентском бандле видит любой, кто откроет DevTools. Флаг управляет показом, а не секретностью.
