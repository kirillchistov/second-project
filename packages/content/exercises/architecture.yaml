  prompt: Расставьте этапы ответа на system design «автокомплит» в правильном порядке.
  explanation: "Каждый шаг опирается на предыдущий. API задают требования, поток данных реализует API, состояния UI вытекают из потока данных. Доступность — отдельный обязательный этап, а не «если останется время»: для combobox это главная сложность."
