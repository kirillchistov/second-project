  explanation: "Флаг, вычисленный на клиенте после загрузки, вызывает мигание и расхождение с SSR. Правило: значения флагов вычисляются на сервере до рендера и приходят готовыми, без правил раскатки в бандле. Если сервис флагов недоступен, берётся безопасное значение по умолчанию — выключено."
