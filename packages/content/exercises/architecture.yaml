# project-structure: принято из черновика 2026-10-11
- id: project-structure-by-feature-quiz
  skill: feature-based-structure
  question: project-structure
  difficulty: 2
  prompt: Почему в растущем React-проекте код группируют по фичам, а не по типам файлов (`components/`, `hooks/`, `utils/`)?
  explanation: "Главный критерий — colocation: код, который меняется вместе, лежит рядом. Фича с публичным API (`index.ts`) — это граница: снаружи видно только то, что экспортировано. Направление зависимостей: pages → features → entities → shared."
  type: quiz
  options:
    - label: "Код, который меняется вместе, лежит рядом: правка фичи затрагивает одну папку, а у фичи есть явная граница и публичный API"
      why: Верно. При группировке по типам одна задача размазана по пяти директориям, а связи между файлами неочевидны.
    - label: "Так быстрее сборка: бандлер лучше делает tree-shaking, когда файлы одной фичи лежат в одной папке"
      why: Бандлер смотрит на граф импортов, а не на папки. Структура влияет на сборку косвенно, например через barrel-файлы, но цель у неё другая.
    - label: React требует, чтобы кастомный хук лежал в той же папке, что и компонент, который его вызывает
      why: "Такого требования нет: React не знает о файловой структуре. Хуки можно импортировать откуда угодно."
    - label: "Так проще переиспользовать: любой файл любой фичи можно импортировать напрямую из другой фичи"
      why: "Наоборот: внутренности фичи закрыты, а наружу выходит только публичный API. Общий код выносят в `shared`."
  answer: 0
- id: project-structure-upward-import
  skill: layer-dependency-direction
  question: project-structure
  difficulty: 2
  prompt: Найдите строку, которая нарушает архитектуру слоёв (pages → features → entities → shared).
  explanation: "Сущность `product` импортирует фичу `cart`, то есть нижний слой зависит от верхнего. Это ведёт к циклам, и карточку уже нельзя переиспользовать без корзины. Решение: карточка принимает слот (`actions?: ReactNode`), а `AddToCart` в неё подставляет страница или виджет."
  type: find-bug
  language: tsx
  code: |-
    // entities/product/ui/ProductCard.tsx
    import { Card } from '@/shared/ui';
    import { formatPrice } from '@/shared/lib';
    import { AddToCart } from '@/features/cart';
    import type { Product } from '../model/types';
    type Props = { product: Product };
    export function ProductCard({ product }: Props) {
      return (
        <Card title={product.name}>
          {formatPrice(product.price)}
          <AddToCart productId={product.id} />
        </Card>
      );
    }
  bugLines:
    - 4
  causes:
    - "Сущность (entities) импортирует фичу (features): нижний слой зависит от верхнего"
    - Относительный импорт `../model/types` внутри слайса запрещён, нужен алиас `@/`
    - Импорт из `@/shared/ui` без указания файла — это запрещённый глубокий импорт
    - "`import type` нельзя использовать для типов из соседнего сегмента"
  answer: 0
- id: project-structure-mvp-choice
  skill: structure-scaling
  question: project-structure
  difficulty: 2
  prompt: "MVP: 8 экранов, 2 разработчика, через три месяца продукт могут закрыть или переписать. С какой структуры начать?"
  explanation: "Структура растёт вместе с проектом. Пока фич мало, плоские папки по типам не мешают. Слои, публичные API и линтер границ окупаются, когда растут команда и число фич, и вводить их лучше постепенно: по одной фиче."
  type: choose-tool
  options:
    - label: "Плоская структура: `components/`, `pages/`, `hooks/`, `lib/` и алиас `@/`"
      why: "Лучший выбор для маленького проекта: ноль накладных расходов, а когда фичи начнут разрастаться, их можно выделить по одной."
    - label: Полный Feature-Sliced Design со всеми слоями и проверкой steiger
      why: Подходит для долгоживущего проекта с несколькими командами. На MVP из 8 экранов это преждевременное дробление и лишние церемонии.
    - label: Монорепо с отдельным пакетом на каждую фичу
      why: Оправдано, когда фичи делят между командами или приложениями. Здесь это сложная сборка и версионирование без выгоды.
    - label: Все компоненты в одном каталоге без подпапок и алиасов
      why: "Работает разве что для прототипа на пару дней: без страниц, хуков и утилит по отдельности навигация быстро превращается в свалку."
  answer: 0
- id: project-structure-extract-feature-recipe
  skill: feature-extraction-refactor
  question: project-structure
  difficulty: 2
  prompt: Проект вырос, файлы корзины разбросаны по `components/`, `hooks/`, `utils/`. Соберите алгоритм выделения фичи `cart`.
  explanation: Мигрируйте по одной фиче, а не всё разом. Сначала соберите код рядом, затем закройте его публичным API и переведите потребителей на него. В конце закрепите границу линтером (eslint-plugin-boundaries или steiger), иначе глубокие импорты вернутся.
  type: order
  kind: recipe
  steps:
    - Найти все файлы корзины в `components/`, `hooks/`, `utils/` и их потребителей
    - Перенести их в `features/cart/` по сегментам ui/model/api вместе с тестами
    - "Описать публичный API в `features/cart/index.ts`: экспортировать только нужное снаружи"
    - Переписать внешние импорты на `@/features/cart` вместо путей к внутренним файлам
    - Включить в CI правило линтера против глубоких импортов и импортов вверх по слоям

# prop-drilling: принято из черновика 2026-10-11
- id: prop-drilling-definition-quiz
  skill: prop-drilling-solutions
  question: prop-drilling
  difficulty: 2
  prompt: Что такое prop drilling и с чего обычно стоит начинать борьбу с ним?
  explanation: "Суть drilling — транзитные компоненты, которые лишь пробрасывают чужие данные. Решения идут по возрастанию тяжести: композиция (children, слоты), затем Context, внешний стор, URL. Серверные данные берут из кэша TanStack Query. Явная передача на 2–3 уровня — норма."
  type: quiz
  options:
    - label: "Это передача данных через компоненты, которым они не нужны. Сначала стоит попробовать композицию: children и слоты"
      why: Верно. Если передать готовый элемент, промежуточный Layout перестаёт знать о user. Зависимости остаются явными, а новых механизмов не появляется.
    - label: Это любая передача props глубже одного уровня, и её стоит сразу выносить в Context
      why: "Передать props на 2–3 уровня нормально: это явно и просто. Ранний уход в Context прячет зависимости, а такие связи сложнее отследить и протестировать."
    - label: "Это проблема производительности: каждый проброшенный prop вызывает лишний рендер, и лечится она через React.memo"
      why: Главная беда drilling — связанность и шум в коде, а не скорость. React.memo не уберёт транзитные props, промежуточные компоненты всё равно будут о них знать.
    - label: Это подъём данных от ребёнка к родителю через цепочку колбэков, и решается он глобальным стором
      why: Подъём состояния — другая техника. Drilling — передача вниз через лишние уровни, и стор для неё скорее крайняя мера, чем первое решение.
  answer: 0
- id: prop-drilling-slot-composition
  skill: composition-slots
  question: prop-drilling
  difficulty: 2
  prompt: Допишите Layout со слотами так, чтобы он не знал о user, а UserMenu и Feed получали user напрямую.
  explanation: "Slot-паттерн: компонент принимает готовые элементы (ReactNode) в именованных props и в children, а сам только расставляет их по местам. Данные передаются там, где элемент создаётся, поэтому промежуточный уровень от них не зависит."
  type: fill-tokens
  language: tsx
  code: |-
    function Layout(props: {
      sidebar: ReactNode;
      children: ReactNode;
    }) {
      return (
        <div className="layout">
          <aside>{props.___}</aside>
          <main>{props.___}</main>
        </div>
      );
    }
    <Layout ___={<UserMenu user={user} />}>
      <Feed user={user} />
    </Layout>
  tokens:
    - sidebar
    - children
    - sidebar
  decoys:
    - user
    - slot
    - render
    - Sidebar
- id: prop-drilling-children-no-rerender
  skill: composition-rerender-bailout
  question: prop-drilling
  difficulty: 3
  prompt: StrictMode и React Compiler выключены. Приложение смонтировали, затем один раз кликнули по тексту feed. Что окажется в консоли?
  explanation: "Элемент <Feed /> создаётся в рендере App и приходит в Layout через children. Когда меняется состояние Layout, App не перерендеривается, и children остаётся тем же объектом. React видит неизменный элемент и пропускает Feed. Так композиция помогает с производительностью: состояние меняется, а переданные извне части не рендерятся заново."
  type: predict-output
  language: tsx
  code: |-
    function Feed() {
      console.log('Feed');
      return <p>feed</p>;
    }
    function Layout({ children }: PropsWithChildren) {
      const [open, setOpen] = useState(false);
      console.log('Layout');
      const toggle = () => setOpen(!open);
      return <div onClick={toggle}>{children}</div>;
    }
    function App() {
      console.log('App');
      return <Layout><Feed /></Layout>;
    }
  options:
    - App → Layout → Feed → Layout
    - App → Layout → Feed → Layout → Feed
    - App → Layout → Feed → App → Layout → Feed
    - App → Layout → Feed → Feed
  answer: 0
- id: prop-drilling-catalog-filters
  skill: url-state-choice
  question: prop-drilling
  difficulty: 2
  prompt: Фильтры каталога (категория, цена, сортировка) нужны панели фильтров, списку товаров и счётчику в шапке на разной глубине. Фильтры должны переживать перезагрузку, а ссылку можно отправить коллеге. Что выбрать?
  explanation: Сначала определите, кому принадлежит состояние. Фильтры, выбор и пагинация, которыми делятся ссылкой, хранят в URL. Редко меняющиеся глобальные данные кладут в Context, часто меняющиеся — в стор с селекторами, серверные данные — в кэш TanStack Query.
  type: choose-tool
  options:
    - label: Search params в URL (useSearchParams)
      why: "Лучший выбор. URL сам по себе глобален: любой компонент читает фильтры без пробрасывания, состояние переживает перезагрузку, а ссылкой можно поделиться."
    - label: Context с useState в корне страницы
      why: Избавит от drilling, но после перезагрузки фильтры потеряются, а поделиться ссылкой не выйдет. Context хорош для темы, локали и текущего пользователя.
    - label: Zustand-стор с селекторами
      why: Подходит для часто меняющегося клиентского состояния, например редактора или корзины. Без отдельной синхронизации с URL ни перезагрузку, ни ссылку стор не переживёт.
    - label: TanStack Query
      why: Нужен для серверных данных. Сами товары можно грузить через useQuery с фильтрами в ключе, но хранить фильтры как источник истины в нём неуместно.
  answer: 0

# system-design-autocomplete: принято из черновика 2026-10-11
- id: system-design-autocomplete-first-step
  skill: frontend-system-design-structure
  question: system-design-autocomplete
  difficulty: 2
  prompt: "Интервьюер просит: «Спроектируйте компонент автокомплита». С чего лучше начать ответ?"
  explanation: "В frontend system design оценивают ход рассуждений: требования → API → поток данных → состояния UI → доступность → производительность → краевые случаи и тесты. Уточняющие вопросы задают рамки, и все дальнейшие компромиссы объясняются через них."
  type: quiz
  options:
    - label: "Задать уточняющие вопросы и зафиксировать требования: источник данных, минимум символов, задержка, клавиатура, мобильные, нагрузка"
      why: "Верно. Требования определяют всё остальное: нужен ли кэш, debounce, виртуализация, какой бюджет по задержке. Это и показывает уровень senior."
    - label: Сразу написать хук с debounce и fetch — так видно практический навык
      why: "Это главный подводный камень: код без требований может решать не ту задачу, а гонки, кэш и доступность всплывут слишком поздно."
    - label: Выбрать готовую библиотеку (Downshift, React Aria) и объяснить, почему она
      why: Библиотека — нормальное решение, но выбирать её стоит после требований. Иначе неясно, какие возможности и ограничения важны.
    - label: "Начать с оптимизаций: виртуализация списка и кэш по префиксам"
      why: "Преждевременно: без требований неизвестно, будет ли список длинным и окупится ли сложный кэш. Оптимизации обсуждают ближе к концу."
  answer: 0
- id: system-design-autocomplete-answer-plan
