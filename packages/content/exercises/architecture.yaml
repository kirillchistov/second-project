# offline-first-sync: принято из черновика 2026-10-13
- id: offline-first-sync-core-idea
  skill: offline-first-architecture
  question: offline-first-sync
  difficulty: 2
  prompt: Что отличает настоящее offline-first приложение от приложения, которое просто «показывает кэш без сети»?
  explanation: "В offline-first UI читает и пишет только в локальную базу (IndexedDB/SQLite). Сеть нужна лишь синхронизации: очередь операций с opId уходит на сервер, чужие изменения приходят по курсору. Кэш ответов и persist запросов дают офлайн-чтение, но не офлайн-запись с конфликтами."
  type: quiz
  options:
    - label: "Локальная БД — источник истины для UI: чтение и запись идут в неё, изменения копятся в очереди и синхронизируются в фоне"
      why: "Верно. Сеть убрана с критического пути: UI мгновенный, а синхронизация отдельно решает идемпотентность и конфликты."
    - label: Service Worker кэширует ответы API, и без сети приложение показывает последние полученные данные
      why: Это офлайн-чтение. SW нужен для оболочки и ассетов, но не даёт локальных изменений, очереди и разрешения конфликтов.
    - label: Кэш TanStack Query сохраняется между сессиями, поэтому данные доступны сразу после запуска
      why: Persist кэша — офлайн-чтение для простых случаев. Записи офлайн требуют своей очереди операций, id и слияния.
    - label: Сервер остаётся источником истины, а клиент повторяет упавшие запросы с экспоненциальной задержкой
      why: "Это online-first с ретраями: UI ждёт сети, изменения теряются при перезагрузке, а повтор без opId может задублировать операцию."
  answer: 0
- id: offline-first-sync-idempotent-opid
  skill: sync-idempotency
  question: offline-first-sync
  difficulty: 3
  prompt: Ответ сервера иногда теряется по сети, и sync() повторяется. После этого у пользователей появляются задвоенные операции. Найдите ошибку.
  explanation: opId должен создаваться один раз — в момент записи операции в outbox, в той же транзакции, что и локальное изменение. Тогда повтор отправки несёт тот же opId, и сервер распознаёт дубликат. Новый UUID при каждой отправке делает каждый ретрай «новой» операцией.
  type: find-bug
  language: ts
  code: |-
    async function sync() {
      const ops = await db.outbox.orderBy('seq').toArray();
      const withIds = ops.map((op) =>
        ({ ...op, opId: crypto.randomUUID() }));
      const since = await meta.get('cursor');
      const res = await api.sync({ ops: withIds, since });
      await db.transaction('rw', db.tasks, db.outbox, async () => {
        await db.outbox.bulkDelete(res.applied);
        for (const c of res.changes) await mergeTask(c);
        await meta.set('cursor', res.cursor);
      });
    }
  bugLines:
    - 3
    - 4
  causes:
    - "opId генерируется при каждой отправке: ретрай после потерянного ответа выглядит для сервера как новая операция"
    - Outbox нельзя сортировать по seq — сервер сам упорядочит операции
    - Курсор нужно сохранять до отправки операций, иначе изменения придут повторно
    - Удаление из outbox и слияние нельзя выполнять в одной транзакции
  answer: 0
- id: offline-first-sync-conflict-strategy
  skill: sync-conflict-resolution
  question: offline-first-sync
  difficulty: 3
  prompt: "CRM: два менеджера офлайн правят одну карточку клиента — один телефон, другой адрес. После синхронизации нельзя терять ни одну правку. Совместного редактирования текста нет. Как разрешать конфликты?"
  explanation: "Стратегия зависит от данных: формы и записи — слияние по полям с версией сущности; совместный текст — CRDT; LWW — только когда потеря правки допустима. Время устройства для порядка не используйте — берите версии или серверный порядок."
  type: choose-tool
  options:
    - label: Слияние по полям с версией сущности
      why: "Лучший выбор: правки разных полей объединяются, а конфликт на одном поле по версии виден явно и показывается пользователю."
    - label: Last-write-wins по updatedAt с устройства
      why: Годится, когда потеря правки не критична. Здесь перетрёт телефон или адрес целиком, а часы устройства ещё и бывают неверными.
    - label: CRDT (Yjs, Automerge)
      why: Нужен для совместного редактирования текста и сложных структур. Для полей формы — лишняя сложность, хранение и метаданные.
    - label: Пессимистичная блокировка карточки на сервере
      why: Работает в онлайн-системах. Офлайн взять блокировку невозможно — это противоречит самой идее offline-first.
  answer: 0
