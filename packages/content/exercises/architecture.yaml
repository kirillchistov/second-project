  explanation: Медленный CI в монорепо лечат тем, что не делают лишнюю работу. Оркестратор пропускает задачи с неизменёнными входами, remote cache делит результаты между машинами, а фильтр affected запускает только изменённые пакеты и их зависимых. Железо и параллелизм стоит добавлять уже поверх этого.
