    type Props = {
      query: string;
      onQueryChange: (q: string) => void;
    };

    function SearchBox({ query, onQueryChange }: Props) {
      return (
        <input
          value={___}
          onChange={(e) => ___(e.target.___)}
        />
      );
    }
  tokens:
    - query
    - onQueryChange
    - value
  decoys:
    - setQuery
    - defaultValue
    - checked
- id: flux-redux-dispatch-cycle
  skill: flux-action-cycle
  question: flux-unidirectional
  difficulty: 2
  prompt: Расставьте по порядку, что происходит в приложении на Redux после клика «Добавить задачу».
  explanation: "Это цикл Flux в упрощении Redux: действие → чистый редьюсер → новое состояние → подписчики → UI → новое событие. Состояние меняется только в одном месте и только в ответ на действие. Поэтому работают лог действий и time-travel в DevTools."
  type: order
  kind: timeline
  steps:
    - "Обработчик клика вызывает dispatch({ type: 'todos/added', payload })"
    - Стор передаёт текущее состояние и действие в редьюсер
    - Редьюсер возвращает новый объект состояния, не мутируя старый
    - Стор уведомляет подписчиков, useSelector сравнивает выбранные значения
    - Компоненты, чьи данные изменились, перерисовываются и ждут следующего события

# hoc-render-props-hooks: принято из черновика 2026-10-11
- id: hoc-render-props-hooks-quiz
  skill: logic-reuse-patterns
  question: hoc-render-props-hooks
  difficulty: 2
  prompt: Почему в современном React логику переиспользуют в основном через хуки, а не через HOC и render props?
  explanation: "Все три паттерна решают одну задачу: как переиспользовать логику. Хуки делают это без лишних узлов в дереве и с явным источником каждого значения. HOC оставляют для сквозной обёртки целого компонента: доступ, error boundary, аналитика. Render props — там, где разметку нужно отдать пользователю."
  type: quiz
  options:
    - label: "Хук не добавляет компонентов в дерево: видно, откуда взялось значение, нет коллизий props и вложенности обёрток"
      why: Верно. Хук — это вызов функции внутри компонента. Значение явно приходит в переменную, типизируется как обычная функция и не порождает wrapper hell.
    - label: HOC и render props вызывают лишние ре-рендеры, поэтому React объявил их устаревшими
      why: "Паттерны не объявлены устаревшими: это обычные компоненты и функции. Хуки вытеснили их ради простоты и явности, а не из-за производительности."
    - label: HOC и render props не работают с функциональными компонентами, только с классовыми
      why: Оба паттерна прекрасно работают с функциональными компонентами. Например, HOC withAuth может сам вызывать хук внутри обёртки.
    - label: Хуки заменили только render props, а получать данные по-прежнему принято через HOC вроде connect
      why: connect тоже вытеснен хуками (useSelector, useDispatch). HOC остался нишевым инструментом для обёрток на уровне компонента.
  answer: 0
- id: hoc-render-props-hooks-hoc-in-render
  skill: hoc-in-render
  question: hoc-render-props-hooks
  difficulty: 2
  prompt: Каждый раз, когда Page перерисовывается (например, родитель передал новый id), поля Form очищаются, а лог 'mount' пишется снова. Найдите причину.
  explanation: Вызов withLogger(Form) в теле Page на каждом рендере создаёт новую функцию-компонент. React видит новый тип, размонтирует старое поддерево и монтирует его заново. Поэтому состояние Form теряется, а эффект срабатывает повторно. HOC применяют один раз, на уровне модуля.
  type: find-bug
  language: tsx
  code: |-
    function withLogger<P extends object>(
      C: React.ComponentType<P>
    ) {
      return (props: P) => {
        useEffect(() => log('mount'), []);
        return <C {...props} />;
      };
    }

    function Page({ id }: { id: string }) {
      const LoggedForm = withLogger(Form);
      return <LoggedForm id={id} />;
    }
  bugLines:
    - 11
  causes:
    - "HOC вызывается внутри рендера: каждый раз получается новый тип компонента, поэтому Form перемонтируется и теряет состояние"
    - useEffect с пустым массивом внутри HOC нарушает правила хуков
    - Анонимная стрелка вместо именованной функции ломает сравнение деревьев
    - Обобщённый P без явного указания типа не даёт пробросить id в Form
  answer: 0
- id: hoc-render-props-hooks-typed-hoc
  skill: hoc-typing
  question: hoc-render-props-hooks
  difficulty: 2
  prompt: "Допишите типизированный HOC: он принимает любой компонент и прозрачно пробрасывает его props."
  explanation: P extends object ограничивает props объектом. React.ComponentType<P> принимает и функциональные, и классовые компоненты с такими props. Обёртка должна передать все props дальше, иначе обёрнутый компонент их потеряет. ReactNode и ReactElement описывают результат рендера, а не сам компонент.
  type: fill-tokens
  language: tsx
  code: |-
    function withAuth<P extends ___>(
      Component: React.___<P>
    ) {
      return function Protected(props: P) {
        const user = useUser();
        if (!user) return <Navigate to="/login" />;
        return <Component {...___} />;
      };
    }
  tokens:
    - object
    - ComponentType
    - props
  decoys:
    - ReactNode
    - ReactElement
    - user
    - children
- id: hoc-render-props-hooks-choose-reuse
  skill: logic-reuse-choice
  question: hoc-render-props-hooks
  difficulty: 2
  prompt: Виджету дашборда нужны позиция мыши, размер окна и текущий пользователь. Координаты используются в useEffect и вычислениях до JSX. Как переиспользовать эту логику?
  explanation: Если значения нужны в логике компонента, а не только в разметке, выбирайте кастомный хук. Несколько источников комбинируются простыми вызовами без вложенности. Render props полезны, когда разметку отдают пользователю (headless-библиотеки), HOC — для обёртки целого компонента.
  type: choose-tool
  options:
    - label: "Кастомные хуки: useMousePosition, useWindowSize, useUser"
      why: "Лучший выбор: значения сразу доступны в теле компонента, эффектах и вычислениях, хуки свободно комбинируются и легко типизируются."
    - label: "Render props: <MouseTracker render={...} />"
      why: Значения доступны только внутри колбэка в JSX. Три источника дали бы вложенные колбэки. Уместно, когда библиотека отдаёт разметку пользователю.
    - label: "HOC: withMouse(withWindowSize(withUser(Widget)))"
      why: Получится обёртка в обёртке, возможны коллизии props и неясно, кто какой prop добавил. Подходит для сквозных задач вроде проверки доступа.
    - label: React Context с координатами мыши на всё приложение
      why: Context передаёт значение вглубь, но частые обновления позиции перерисуют всех потребителей. Хорош для редко меняющихся данных вроде темы.
  answer: 0

# large-scale-architecture: принято из черновика 2026-10-11
- id: large-scale-architecture-goal
  skill: frontend-architecture-goals
  question: large-scale-architecture
  difficulty: 3
  prompt: Какая главная цель архитектуры большого фронтенд-приложения?
  explanation: "Архитектура — это про независимость изменений: домены с публичным API, направление зависимостей, разделение типов состояния и единые слои. Правила фиксируются в ADR и проверяются в CI. Конкретный стек вторичен и зависит от контекста: размера команды, частоты релизов, SEO."
  type: quiz
  options:
    - label: "Чтобы команды могли менять код независимо и предсказуемо: границы модулей, контракты и их проверка инструментами"
      why: Верно. Всё остальное — монорепо, слой данных, дизайн-система — лишь средства, которые служат этой цели.
    - label: Взять масштабируемый стек — микрофронтенды, RSC, монорепо — чтобы приложение выдержало рост
      why: Это перечисление модных слов. Микрофронтенды для одной команды — преждевременная сложность. Инструмент выбирают под контекст.
    - label: Максимально переиспользовать код, складывая общее в пакет common или utils
      why: "Это типичная ловушка: от такого пакета зависит всё, а владельца у него нет. Сцепленность растёт, независимость пропадает."
    - label: Один раз в начале утвердить структуру папок и договорённости, чтобы потом не тратить время на рефакторинг
      why: Договорённости без проверки инструментами со временем размываются. К тому же архитектура должна развиваться, а решения фиксируются в ADR.
  answer: 0
- id: large-scale-architecture-repo-layout
  skill: monorepo-vs-microfrontends
  question: large-scale-architecture
  difficulty: 2
  prompt: Одна команда из 6 человек ведёт Next.js-приложение и админку. У них общие UI-компоненты, API-клиент и конфиги линтера, релизы выходят вместе. Как организовать код?
  explanation: "Монорепо оправдано, когда у нескольких приложений есть общий код и общий цикл релизов: изменение в `ui` сразу проверяется во всех потребителях. Микрофронтенды решают другую задачу — независимые деплои многих команд — и стоят дорого."
  type: choose-tool
  options:
    - label: "Монорепозиторий: pnpm workspaces + Turborepo, пакеты ui, api-client, eslint-config"
      why: Лучший вариант. Общий код без публикации версий, атомарные изменения сразу во всех приложениях, кэш сборок и запуск только затронутого.
    - label: Микрофронтенды на Module Federation
      why: "Подходят, когда много команд должны деплоиться независимо. Для одной команды это лишняя сложность: рантайм-интеграция, версии, общий стейт."
    - label: Отдельные репозитории и публикация общих пакетов в приватный npm
      why: Уместно, если пакеты нужны внешним потребителям или команды независимы. Здесь каждое изменение ui превратится в цикл «публикация → обновление версий».
    - label: Скопировать общие компоненты в оба приложения в папку common
      why: Терпимо только для пары файлов. Копии быстро расходятся, а исправления приходится делать дважды.
  answer: 0
- id: large-scale-architecture-deep-import
  skill: module-boundaries
  question: large-scale-architecture
  difficulty: 2
  prompt: В проекте домены лежат в `features/*`, и каждый открывает публичный API через свой index.ts. Слой `shared` — нижний. Какая строка нарушает архитектурные правила?
  explanation: "Импортировать можно только публичный API домена (`@/features/cart`). Глубокий импорт привязывает checkout к внутренней структуре cart: стоит переименовать файл — и сломается чужой код. Такие импорты ловит линтер (eslint-plugin-boundaries, no-restricted-imports), а не ревью."
  type: find-bug
  language: tsx
  code: |-
    // features/checkout/ui/CheckoutButton.tsx
    import { Button } from '@acme/ui';
    import { useCart } from '@/features/cart';
    import { calcTotal } from '@/features/cart/lib';
    import { formatPrice } from '@/shared/format';

    export function CheckoutButton() {
      const { items } = useCart();
      const total = calcTotal(items);
      return (
        <Button>Оплатить {formatPrice(total)}</Button>
      );
    }
  bugLines:
    - 4
  causes:
    - Импорт внутренностей домена cart в обход его публичного API
    - Фича не должна импортировать из shared — зависимости нарушают направление
    - Приложение не может напрямую импортировать пакет дизайн-системы @acme/ui
    - Хук другого домена нельзя вызывать внутри компонента checkout
  answer: 0
- id: large-scale-architecture-boundaries-rollout
  skill: module-boundaries
  question: large-scale-architecture
  difficulty: 3
  prompt: Соберите алгоритм внедрения границ модулей в существующее большое приложение.
  explanation: Сначала правила и публичные API, затем измерение нарушений в мягком режиме, потом исправления, и только после этого жёсткая проверка в CI. Если сразу включить error, сборка встанет. Если остановиться на договорённостях, границы снова размоются.
  type: order
  kind: recipe
  steps:
    - Описать домены и разрешённые направления зависимостей, зафиксировать решение в ADR
    - Выделить публичный API каждого домена — index.ts с явными экспортами
    - Включить правило границ в линтере в режиме warn и собрать список нарушений
    - "Исправить нарушения: перевести импорты на публичный API, общее вынести в пакет с владельцем"
    - Перевести правило в error и проверять его в CI на каждом PR

# legacy-migration: принято из черновика 2026-10-11
- id: legacy-migration-strategy-quiz
  skill: legacy-migration-strategy
  question: legacy-migration
  difficulty: 2
  prompt: Команда мигрирует большое приложение с React 16 на React 19. Какая стратегия надёжнее всего?
  explanation: Миграцию ведут маленькими шагами с измерениями. Сначала ставят последнюю минорную версию ветки и добиваются нуля предупреждений, затем переходят на следующую мажорную версию с codemods. Версия 18.3 заранее предупреждает о том, что удалено в 19. Классы React 19 поддерживает, поэтому переписывают постепенно только то, что активно меняется.
  type: quiz
  options:
    - label: Идти по мажорным версиям (16 → 17 → 18.3 → 19), убирая предупреждения и запуская codemods; классы переписывать при касании
      why: Верно. Каждый шаг маленький и проверяемый, предупреждения 18.3 заранее показывают, что сломается в 19. Фичи при этом не замораживаются.
    - label: Сначала переписать все классы на хуки, потому что React 19 перестал поддерживать классовые компоненты
      why: Классы в React 19 работают. Удалены только legacy-API вроде строковых refs, legacy context и findDOMNode. Массовое переписывание — тот же «большой взрыв».
    - label: "Сразу поставить React 19 и прогнать codemod migration-recipe: он исправит всё, что нужно"
      why: Codemods покрывают только типовые замены. Без промежуточной 18.3 вы не увидите предупреждений об устаревших API и получите много поломок разом.
    - label: Заморозить фичи и в отдельной ветке переписать приложение на актуальный стек, а потом переключиться
      why: "Это классический «большой взрыв»: долгая ветка расходится с main, бизнес месяцами ждёт фичи, а риск выкатить всё одним релизом огромен."
  answer: 0
- id: legacy-migration-plan-recipe
  skill: legacy-migration-plan
  question: legacy-migration
  difficulty: 2
  prompt: Расставьте шаги миграции legacy-приложения с React 16 до React 19 по порядку.
  explanation: Сначала нужно понять масштаб и подготовить страховку, и только потом менять версии. Версия 18.3 — это 18 с предупреждениями о том, что удалено в 19. Поэтому её «зелёное» состояние — пропуск к шагу на 19. Без e2e-тестов и мониторинга регрессии найдут пользователи.
  type: order
