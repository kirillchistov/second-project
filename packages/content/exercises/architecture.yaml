      why: Workspaces связывают пакеты локально, поэтому публиковать их не нужно. Changesets нужны только для пакетов, которые уходят наружу.
    - label: Главное — все приложения релизятся вместе одним деплоем, версии не расходятся
      why: Деплой приложений остаётся независимым. Общими становятся код и версии зависимостей, а не релизный цикл.
