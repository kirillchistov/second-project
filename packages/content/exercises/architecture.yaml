  explanation: Монорепо ценен тем, что изменение в библиотеке и во всех её потребителях проходит одним PR и проверяется вместе, без публикации пакетов. Сам по себе он ничего не ускоряет. Без workspaces, кэша задач, границ и запуска «только затронутого» он быстро становится медленным и запутанным.
  type: quiz
  options:
    - label: Атомарные изменения в библиотеке и её потребителях, единые версии; цена — workspaces, кэш задач, границы и affected в CI
      why: Верно. Связанные пакеты меняются согласованно, но без инфраструктуры CI и связность растут вместе с репозиторием.
