  explanation: "В React нет двустороннего связывания: пара `value` + `onChange` лишь имитирует его. Значение приходит вниз через props, а ввод пользователя уходит вверх событием. Владелец состояния решает, принять ли изменение, поэтому поток остаётся однонаправленным."
