  skill: sync-algorithm
  question: offline-first-sync
  difficulty: 2
  prompt: Расставьте шаги одного цикла синхронизации offline-first клиента по порядку.
  explanation: "Сначала отправляем своё, затем применяем чужое. Удаление подтверждённых операций, слияние и новый курсор — в одной локальной транзакции: если она упадёт, следующий sync безопасно повторит всё благодаря идемпотентным opId и старому курсору."
  type: order
  kind: recipe
  steps:
    - "Срабатывает триггер: событие online, фокус вкладки или старт приложения"
    - Прочитать операции из outbox в порядке seq
    - Отправить операции с их opId и последний сохранённый курсор since
    - Сервер идемпотентно применяет операции и возвращает applied, changes и новый курсор
    - В локальной транзакции удалить подтверждённые операции и смёрджить чужие изменения
    - В той же транзакции, последним, сохранить новый курсор

# system-design-chat: принято из черновика 2026-10-13
- id: system-design-chat-client-id
  skill: chat-reliable-send
  question: system-design-chat
  difficulty: 2
  prompt: Зачем каждому исходящему сообщению чата клиентский id (`clientId`), если сервер всё равно присвоит ему свой `id` и `seq`?
  explanation: "clientId появляется до ответа сервера, поэтому он склеивает оптимистичную запись, ack, повторную отправку и эхо из `message.new` или `sync` в одно сообщение. Порядок задаёт серверный `seq`, а доступ проверяет сервер. Правило: клиентский id — для идемпотентности и дедупликации, серверный номер — для порядка."
  type: quiz
  options:
    - label: По нему ack связывается с оптимистичным сообщением, а повтор или эхо через сокет не создают дубликат
      why: Верно. Серверного id ещё нет, когда сообщение уже на экране. Только clientId позволяет обновить ту же запись и сделать повторную отправку идемпотентной.
    - label: "Он нужен для сортировки: UUID монотонно растёт, поэтому порядок сообщений будет верным"
      why: crypto.randomUUID() случаен и порядка не задаёт. К тому же часы клиентов расходятся. Сортируют по серверному seq или серверному времени.
    - label: "Тогда серверный id можно не хранить на клиенте: clientId его полностью заменяет"
      why: Серверные id и seq нужны для синхронизации по курсору, ссылок, правок и удаления. clientId связывает отправку с подтверждением и убирает дубли.
    - label: "Он защищает от подделки: сервер по clientId проверяет, что сообщение отправил владелец"
      why: clientId генерирует сам клиент, он ничего не доказывает. Права проверяются по аутентифицированному соединению и доступу к чату на сервере.
  answer: 0
- id: system-design-chat-reconnect-recipe
  skill: chat-reconnect-sync
  question: system-design-chat
  difficulty: 3
  prompt: Расставьте шаги восстановления чата после обрыва соединения так, чтобы ничего не потерять и не задублировать.
  explanation: Обрыв обнаруживается по heartbeat. Переподключение идёт с backoff и джиттером, чтобы клиенты не ударили по серверу разом. Затем аутентификация и sync с курсора lastSeq. Пропущенное вливается с дедупликацией по id/clientId и сортировкой по seq. Только после этого видно, какие сообщения из очереди сервер уже получил. Остальные отправляются повторно с прежними clientId, поэтому повтор идемпотентен.
  type: order
  kind: recipe
  steps:
    - Heartbeat не получил ответ за таймаут — считаем соединение разорванным
    - Переподключаемся с экспоненциальной задержкой и джиттером
    - Аутентифицируем новое соединение
    - Запрашиваем sync с последнего известного seq
    - "Вливаем пропущенное: дедупликация по id/clientId, сортировка по seq"
    - Повторно отправляем из очереди только то, чего не было в sync, с прежними clientId
- id: system-design-chat-sticky-scroll
  skill: chat-scroll-anchoring
  question: system-design-chat
  difficulty: 2
  prompt: Пользователь листает историю вверх, приходит новое сообщение, и список резко прыгает вниз. Найдите строку с ошибкой.
  explanation: "Эффект прокручивает вниз при любом изменении messages и игнорирует флаг atBottom. Прилипать к низу нужно, только если пользователь уже внизу: `if (atBottom.current) el.scrollTop = el.scrollHeight;`. Иначе лучше показать плашку «новые сообщения». useLayoutEffect здесь уместен: прокрутка происходит до paint, без мигания. ref подходит для флага, потому что он читается внутри эффекта."
  type: find-bug
  language: tsx
  code: |-
    function MessageList({ messages }: Props) {
      const ref = useRef<HTMLDivElement>(null);
      const atBottom = useRef(true);
      const onScroll = () => {
        atBottom.current = isNearBottom(ref.current!);
      };
      useLayoutEffect(() => {
        const el = ref.current!;
        el.scrollTop = el.scrollHeight;
      }, [messages]);
      return (
        <div ref={ref} onScroll={onScroll}>{messages.map(m => <Row key={m.clientId} m={m} />)}</div>
      );
    }
  bugLines:
    - 9
  causes:
    - Прокрутка вниз выполняется всегда, без проверки atBottom.current
    - useLayoutEffect нужно заменить на useEffect, иначе прокрутка срабатывает слишком рано
    - atBottom должен быть состоянием (useState), иначе эффект не видит его актуальное значение
    - В зависимостях нужен messages.length вместо messages
  answer: 0
- id: system-design-chat-transport-choice
  skill: chat-transport-choice
  question: system-design-chat
  difficulty: 3
  prompt: "Виджет чата поддержки на сайте. Трафик в основном входящий: ответы оператора, «печатает…», статусы. Пользователь пишет редко. У части клиентов корпоративные прокси рвут WebSocket, а бэкенд — обычный HTTP за балансировщиком. Какой транспорт выбрать?"
  explanation: Выбор транспорта зависит от направления трафика и инфраструктуры. Если поток в основном от сервера к клиенту и важна совместимость с HTTP, подходит SSE + POST. Если нужен частый двусторонний обмен с низкой задержкой, подходит WebSocket. Long polling остаётся запасным вариантом.
  type: choose-tool
  options:
    - label: SSE для входящих событий + обычный POST для отправки
      why: "Лучший выбор. Поток идёт от сервера, SSE — обычный HTTP: проходит через прокси и балансировщики, умеет автопереподключение и Last-Event-ID для догрузки."
    - label: WebSocket
      why: Подойдёт для активного двустороннего чата с частой отправкой и низкой задержкой. Здесь прокси рвут соединение, а двусторонность почти не нужна.
    - label: Long polling
      why: Запасной вариант, когда не работают даже SSE. Он даёт лишние запросы и задержку на каждом цикле, поэтому его держат как fallback, а не как основу.
    - label: Опрос API раз в 5 секунд
      why: Годится для редко меняющихся данных вроде счётчика непрочитанных. Для чата это задержка до 5 секунд и постоянная нагрузка впустую.
  answer: 0

# system-design-news-feed: принято из черновика 2026-10-13
- id: news-feed-cursor-vs-offset
  skill: feed-cursor-pagination
  question: system-design-news-feed
  difficulty: 2
  prompt: Почему для ленты новостей с бесконечной прокруткой обычно выбирают cursor-пагинацию, а не `?page=N` / offset?
  explanation: "Лента — живой список: новые посты постоянно появляются сверху. Offset считает позицию от начала, поэтому при вставках страницы съезжают. Курсор указывает на конкретный элемент, и «следующие 20 после него» не зависят от того, что добавилось выше. Цена — нельзя прыгнуть на произвольную страницу, но ленте это и не нужно."
  type: quiz
  options:
    - label: "Новые посты сверху сдвигают offset: следующая страница повторит показанные посты или пропустит часть. Курсор привязан к последнему элементу"
      why: Верно. Курсор (id или метка времени последнего поста) стабилен при вставках, поэтому дубликатов и пропусков нет.
    - label: Offset работает медленнее на больших таблицах, а в остальном они равноценны
      why: "Производительность БД — побочный плюс. Главная проблема offset в ленте — некорректные данные: дубли и пропуски при вставках."
    - label: Курсор позволяет перейти сразу на любую страницу ленты
      why: "Наоборот: прыжок на N-ю страницу — сильная сторона offset. Курсор позволяет двигаться только последовательно."
    - label: useInfiniteQuery умеет работать только с курсорами, номера страниц он не поддерживает
      why: "pageParam может быть чем угодно: числом, строкой, объектом. Выбор курсора диктует модель данных, а не библиотека."
  answer: 0
- id: news-feed-infinite-query-cursor
  skill: feed-infinite-query
  question: system-design-news-feed
  difficulty: 2
  prompt: API отвечает `{ items, nextCursor }`, а на последней странице nextCursor равен null. Допишите ленту на TanStack Query v5.
  explanation: "В v5 initialPageParam обязателен: это курсор первого запроса. getNextPageParam берёт курсор из последней страницы, а null или undefined означает, что hasNextPage = false. pages — массив страниц, поэтому нужен flatMap. Проверка isFetchingNextPage не даёт сентинелу запустить дублирующую подгрузку."
  type: fill-tokens
  language: tsx
  code: |-
    const q = useInfiniteQuery({
      queryKey: ['feed'],
      queryFn: ({ pageParam }) =>
        api.feed({ cursor: pageParam, limit: 20 }),
      ___: null as string | null,
      getNextPageParam: (last) => last.___,
    });
    const posts =
      q.data?.pages.___((p) => p.items) ?? [];
    const loadMore = () => {
      if (q.hasNextPage && !q.___) q.fetchNextPage();
    };
  tokens:
    - initialPageParam
    - nextCursor
    - flatMap
    - isFetchingNextPage
  decoys:
    - pageParams
    - nextPage
    - map
    - isPending
- id: news-feed-long-list-perf
  skill: list-virtualization
  question: system-design-news-feed
  difficulty: 2
  prompt: Пользователь долистал ленту до 2000 постов с картинками. Прокрутка дёргается, память вкладки растёт, в DOM десятки тысяч узлов. Что поможет в первую очередь?
  explanation: Корень проблемы — размер DOM и число живых изображений. Виртуализация держит в DOM только видимое окно плюс запас, и стоимость прокрутки перестаёт зависеть от длины ленты. memo, lazy-картинки и transitions — полезные дополнения, но их недостаточно.
  type: choose-tool
  options:
    - label: Виртуализация списка (@tanstack/react-virtual)
      why: Рендерит только видимые карточки, поэтому DOM и память не растут с длиной ленты. Для переменной высоты нужны estimateSize и замер элементов.
    - label: Обернуть PostCard в React.memo
      why: Помогает, если карточки лишний раз перерисовываются при изменениях родителя. Но 2000 смонтированных карточек и их узлы в DOM никуда не денутся.
    - label: loading="lazy" на всех изображениях
      why: Откладывает загрузку картинок до приближения к экрану — полезно для сети. Но уже загруженные картинки и все DOM-узлы остаются.
    - label: Обновлять список через startTransition
      why: Подходит, чтобы тяжёлый рендер не блокировал ввод. Размер DOM и стоимость прокрутки transition не уменьшает.
  answer: 0
- id: news-feed-optimistic-like-recipe
  skill: optimistic-updates-rollback
  question: system-design-news-feed
  difficulty: 3
  prompt: Расставьте шаги оптимистичного лайка поста в ленте через useMutation и кэш TanStack Query v5.
  explanation: "Сначала нужно отменить запросы: иначе фоновый refetch перезапишет оптимистичное значение старыми данными. Снимок кэша — точка отката. После ответа сервера, успешного или нет, инвалидация сверяет кэш с сервером. Повторные нажатия дедуплицируют отдельно, например блокируют лайк, пока мутация в процессе."
  type: order
  kind: recipe
  steps:
    - "В onMutate отменить текущие запросы ленты: cancelQueries({ queryKey: ['feed'] })"
    - "Сохранить снимок кэша: getQueryData(['feed'])"
    - Оптимистично обновить пост во всех страницах через setQueryData
    - Вернуть снимок из onMutate как context
    - В onError восстановить снимок из context
    - "В onSettled вызвать invalidateQueries({ queryKey: ['feed'] }), чтобы сверить данные с сервером"
