# use-layout-effect: принято из черновика 2026-10-11
- id: use-layout-effect-vs-use-effect
  skill: layout-effect-timing
  question: use-layout-effect
  difficulty: 2
  prompt: Чем useLayoutEffect отличается от useEffect и когда его стоит выбирать?
  explanation: "Порядок: render → commit (DOM обновлён) → useLayoutEffect → paint → useEffect. Layout-эффект блокирует кадр, поэтому по умолчанию берите useEffect. useLayoutEffect нужен, только если измерение DOM и правка позиции иначе дают видимое мерцание."
  type: quiz
  options:
    - label: useLayoutEffect выполняется синхронно после обновления DOM, но до отрисовки кадра. Он нужен для измерений без мерцания
      why: Верно. Браузер не нарисует кадр, пока layout-эффект не завершится, поэтому поправленная позиция попадёт уже в первый кадр.
    - label: useLayoutEffect выполняется до обновления DOM, поэтому в нём можно подготовить разметку заранее
      why: Неверно. Когда запускается layout-эффект, DOM уже обновлён, иначе в нём нечего было бы измерять. До мутаций DOM работает только useInsertionEffect.
    - label: useLayoutEffect — более быстрая версия useEffect, в него выгодно переносить загрузку данных
      why: Это заблуждение. Запрос от этого не ускорится, а синхронная работа в эффекте задержит отрисовку кадра.
    - label: "Разница только в SSR: useLayoutEffect работает на сервере, а useEffect — только в браузере"
      why: "Наоборот: на сервере не выполняется ни один из них. Раньше useLayoutEffect при SSR выдавал предупреждение именно потому, что на сервере он не запускается."
  answer: 0
