  explanation: "Правило: если значение влияет на то, что синхронизирует эффект (`roomId`), — это зависимость. Если значение только читается в реакции на событие (`muted`), — это логика события, ей место в `useEffectEvent`. Отключать `exhaustive-deps` вместо этого — путь к stale closure."
