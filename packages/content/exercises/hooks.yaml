    - label: "Синхронизировать компонент с внешней системой: сетью, подпиской, таймером, DOM-API, сторонним виджетом"
      why: Верно. Эффект запускается после коммита, повторяется при смене зависимостей, а cleanup «откатывает» синхронизацию перед следующим запуском и при размонтировании.
    - label: Вычислять производные данные из props и state, чтобы не пересчитывать их на каждом рендере
