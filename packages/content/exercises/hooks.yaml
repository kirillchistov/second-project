  prompt: "Таймер: `useEffect` с `[]` запускает `setInterval(() => setCount(count + 1), 1000)`. Почему счётчик навсегда застывает на 1?"
  explanation: "Каждый рендер — отдельный вызов функции со своими константами. Колбэк из первого рендера видит только его значения. Это обычные замыкания JS. Лечится так: апдейтер `setCount(c => c + 1)`, если нужно прошлое состояние; `useEffectEvent`, если нужно читать свежие props/state без перезапуска эффекта."
  type: quiz
  options:
    - label: Колбэк интервала создан в первом рендере и замкнул count = 0, поэтому каждую секунду вызывает setCount(0 + 1)
      why: Верно. Интервал тикает, но аргумент всегда 1. React видит то же значение и не меняет экран, хотя setCount вызывается каждую секунду.
    - label: Эффект с [] выполняется один раз, значит и setInterval срабатывает только один раз
      why: Эффект действительно запускается один раз, но созданный им интервал тикает каждую секунду. Проблема не в числе вызовов, а в значении count, которое видит колбэк.
    - label: count обновляется асинхронно, и интервал успевает прочитать значение до того, как React его обновит
      why: "count не «обновляется»: это константа конкретного рендера. Новый рендер создаёт новую константу, а старое замыкание продолжает видеть свою."
    - label: React батчит обновления из setInterval и отбрасывает все, кроме первого
      why: Батчинг объединяет обновления внутри одного тика. Здесь тики разные, и каждое обновление обрабатывается. Просто значение всегда одно и то же — 1.
  answer: 0
