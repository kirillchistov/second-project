# use-state: принято из черновика 2026-10-11
- id: use-state-snapshot-quiz
  skill: state-snapshot
  question: use-state
  difficulty: 1
  prompt: Почему `console.log(count)` сразу после `setCount(count + 1)` выводит старое значение?
  explanation: "Каждый рендер — снимок: `count` в нём константа. `setCount` ставит обновление в очередь и планирует новый рендер, где `useState` вернёт новое значение. Чтобы считать от актуального состояния, передают апдейтер `setCount(c => c + 1)`. Чтобы использовать новое значение сразу, сохраняют его в локальную переменную."
  type: quiz
  options:
    - label: "`setCount` не меняет переменную текущего рендера: он ставит обновление в очередь, а новое значение увидит следующий рендер"
      why: Верно. `count` — константа в замыкании этого рендера. Новое значение React отдаст при следующем вызове компонента.
    - label: "setState работает как промис: если написать `await setCount(...)`, следующая строка увидит новое значение"
      why: "`setCount` возвращает undefined, ждать нечего. Даже после await переменная `count` в замыкании остаётся прежней константой."
    - label: "Виноват батчинг: если обернуть вызов во `flushSync`, `count` обновится прямо в обработчике"
      why: "`flushSync` синхронно применит рендер и DOM, но локальная `count` в текущем замыкании всё равно останется старой: это значение прошлого снимка."
    - label: Деструктуризация копирует значение; если читать `state[0]` из массива, значение будет свежим
      why: Массив, который вернул `useState`, — тоже снимок текущего рендера. Ни одно чтение не даст значение из будущего рендера.
  answer: 0
- id: use-state-mixed-updates-output
  skill: state-snapshot
  question: use-state
  difficulty: 2
  prompt: Кнопку нажали один раз. Что будет в консоли и что отобразится на кнопке?
  explanation: Очередь обновлений обрабатывается по порядку. Значение `n + 5` = 5 заменяет состояние, затем апдейтер получает 5 и возвращает 6. Лог показывает снимок текущего рендера, то есть 0. Апдейтер работает с результатом предыдущих обновлений в очереди, а значение — с замыканием.
  type: predict-output
  language: tsx
  code: |-
    function Counter() {
      const [n, setN] = useState(0);

      function handleClick() {
        setN(n + 5);
        setN((c) => c + 1);
        console.log('click', n);
      }

      return <button onClick={handleClick}>{n}</button>;
    }
  options:
    - click 0, на кнопке 6
    - click 6, на кнопке 6
    - click 0, на кнопке 1
    - click 0, на кнопке 5
  answer: 0
- id: use-state-mutation-no-rerender
  skill: state-immutable-updates
  question: use-state
  difficulty: 1
  prompt: После вызова addTodo список на экране не обновляется. Найдите ошибку.
  explanation: "`push` мутирует тот же массив, и в `setTodos` уходит та же ссылка. `Object.is(old, new)` возвращает true, поэтому React пропускает рендер. Правило: состояние не мутируют, а создают новый объект или массив: `setTodos(prev => [...prev, todo])`."
  type: find-bug
  language: tsx
  code: |-
    function TodoList() {
      const [todos, setTodos] = useState<Todo[]>([]);

      function addTodo(text: string) {
        todos.push({ id: crypto.randomUUID(), text });
        setTodos(todos);
      }

      return <List items={todos} onAdd={addTodo} />;
    }
  bugLines:
    - 5
    - 6
  causes:
    - Массив мутируется и передаётся та же ссылка — `Object.is` считает состояние неизменным, и рендера нет
    - "`setTodos` асинхронный, и без `await` обновление теряется"
    - "Массив в `useState` нужно инициализировать лениво: `useState(() => [])`"
    - "`crypto.randomUUID()` нельзя вызывать внутри обработчика событий"
  answer: 0
- id: use-state-lazy-init-merge
  skill: state-object-updates
  question: use-state
  difficulty: 2
  prompt: Черновик формы должен читаться из localStorage только при первом рендере. Каждое поле должно обновляться, не теряя остальные. Заполните пропуски.
  explanation: Если передать `loadDraft` без вызова, React вызовет функцию только при первом рендере. Вариант `loadDraft()` выполнялся бы на каждом рендере. Сеттер хука заменяет объект целиком, поэтому остальные поля копируют через `...prev`, а изменяемое поле задают вычисляемым ключом `[name]`.
  type: fill-tokens
  language: tsx
  code: |-
    function DraftForm() {
      const [form, setForm] = useState(___);

      function handleChange(e: React.ChangeEvent<HTMLInputElement>) {
        const { name, value } = e.target;
        setForm((prev) => ({ ___prev, [___]: value }));
      }
      // ...
    }
  tokens:
    - loadDraft
    - ...
    - name
  decoys:
    - loadDraft()
    - "'name'"
    - form

# you-might-not-need-an-effect: принято из черновика 2026-10-11
- id: effect-necessity-quiz
  skill: effect-necessity
  question: you-might-not-need-an-effect
  difficulty: 2
  prompt: Как решить, должен ли кусок кода жить в useEffect или в другом месте?
  explanation: "Эффект нужен только для синхронизации с внешней системой: подписки, DOM-виджеты, сеть, аналитика «при показе». Производные данные считаются в рендере. Реакции на действия пользователя пишутся в обработчике. Новое значение state вычисляется прямо в обработчике."
  type: quiz
  options:
    - label: "Спросить, почему код должен выполниться: из-за действия пользователя — обработчик, из-за показа и синхронизации с внешним — эффект"
      why: "Верно. Причина запуска определяет место: событие связано с конкретным действием, а эффект — с фактом, что компонент сейчас на экране."
    - label: Если код зависит от props или state — нужен эффект, иначе он не узнает об их изменениях
      why: Компонент и так перерендеривается при смене props и state. Производные данные считаются прямо в рендере, при необходимости через useMemo.
    - label: Если в коде есть побочное действие (запрос, уведомление) — всегда эффект, ведь рендер должен быть чистым
      why: Обработчики событий не обязаны быть чистыми. Побочное действие, вызванное кликом или отправкой формы, пишется в обработчике.
    - label: Если код должен выполниться после обновления state — нужен эффект, иначе в обработчике state ещё старый
      why: Следующее значение можно вычислить в обработчике (const next = …) и использовать сразу. Эффект лишь добавит рендер со старым значением.
  answer: 0
- id: effect-notification-on-mount
  skill: effect-vs-event-handler
  question: you-might-not-need-an-effect
  difficulty: 2
  prompt: "Жалоба: уведомление «в корзине» появляется при каждом открытии страницы товара, который уже лежит в корзине. Где ошибка?"
  explanation: Уведомление должно появиться, потому что пользователь нажал «Купить». Это событие, а не синхронизация. Эффект же срабатывает при каждом показе страницы, если товар уже в корзине. Решение — вызвать showNotification в handleBuy рядом с addToCart.
  type: find-bug
  language: tsx
  code: |-
    function ProductPage({ product, addToCart }: Props) {
      useEffect(() => {
        if (product.isInCart) {
          showNotification(`${product.name} в корзине`);
        }
      }, [product]);

      function handleBuy() {
        addToCart(product);
      }

      return <button onClick={handleBuy}>Купить</button>;
    }
  bugLines:
    - 2
    - 3
  causes:
    - Уведомление привязано к состоянию isInCart, а не к событию покупки, поэтому эффект срабатывает при каждом показе страницы
    - В зависимостях нужен product.isInCart вместо product, тогда лишних уведомлений не будет
    - showNotification меняет UI, поэтому его нужно вызывать в useLayoutEffect
    - addToCart мутирует product, и эффект видит устаревший объект
  answer: 0
- id: effect-reset-draft-on-post-change
  skill: reset-state-with-key
  question: you-might-not-need-an-effect
  difficulty: 2
  prompt: "Компонент Comments со своей формой: черновик, раскрытые ветки, состояние у вложенных компонентов. При переходе на другой пост всё это должно очищаться. Как сделать?"
  explanation: "Состояние в React привязано к позиции и ключу. Новый key означает новый экземпляр: всё дерево состояния сбрасывается без лишнего рендера со старыми данными. Сброс через эффект — классический анти-паттерн: сначала мелькает старый черновик, и легко забыть часть состояния."
  type: choose-tool
  options:
    - label: Рендерить <Comments key={postId} postId={postId} />
      why: "Лучший вариант: смена key пересоздаёт компонент и всех потомков, сбрасывая всё состояние сразу и без промежуточного рендера."
    - label: useEffect с [postId], который вызывает setDraft('') и другие сеттеры
      why: Один рендер пройдёт со старым черновиком, будет мерцание. Каждый state придётся сбрасывать вручную, а state вложенных компонентов отсюда не достать.
    - label: Хранить prevPostId в state и сбрасывать часть state прямо во время рендера
      why: Допустимо, когда нужно сбросить или поправить лишь часть состояния, а остальное сохранить. Для полного сброса это сложнее и хрупче, чем key.
    - label: Поднять черновики в родителя и хранить Map по postId
      why: Подходит, если черновик каждого поста нужно сохранять при переключении. Здесь нужен именно сброс, так что это лишняя сложность.
  answer: 0
