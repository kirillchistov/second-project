      useLayoutEffect(() => console.log('app layout'));
      console.log('app render');
      return <Child />;
    }
  options:
    - app render → child layout → app layout → child effect → app effect
    - app render → app layout → child layout → app effect → child effect
    - app render → child effect → child layout → app effect → app layout
    - app render → child layout → child effect → app layout → app effect
  answer: 0
- id: use-layout-effect-tooltip-flicker
  skill: layout-effect-measure-dom
  question: use-layout-effect
  difficulty: 2
  prompt: Тултип при появлении на мгновение мелькает в неправильном месте, а потом «прыгает» на нужное. Найдите причину.
  explanation: "useEffect обычно выполняется после paint. Поэтому первый кадр рисуется с top = 0, а после setTop тултип перерисовывается уже на новом месте. Если нужно измерить DOM и сразу поправить позицию, используйте useLayoutEffect: тогда исправленная позиция попадёт в тот же кадр."
  type: find-bug
  language: tsx
  code: |-
    function Tooltip({ anchor, children }: Props) {
      const ref = useRef<HTMLDivElement>(null);
      const [top, setTop] = useState(0);

      useEffect(() => {
        const h = ref.current!.offsetHeight;
        setTop(anchor.top - h);
      }, [anchor.top]);

      return <div ref={ref} style={{ position: 'absolute', top }}>{children}</div>;
    }
  bugLines:
    - 5
  causes:
    - "Измерение выполняется в useEffect, то есть после отрисовки: первый кадр показывает top = 0, а затем позиция меняется"
