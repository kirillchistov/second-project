      why: Верно. Порядок выполнения кода на сервере и клиенте может отличаться, а путь в дереве совпадает. Поэтому разметка совпадает и гидрация проходит без ошибок.
    - label: Он быстрее `Math.random()`, поэтому меньше нагружает рендер
      why: Производительность тут ни при чём. `Math.random()` плох тем, что на сервере и клиенте даст разные значения, а на каждом рендере — новое.
    - label: Он генерирует стабильные ключи для элементов списка
      why: Это типичное заблуждение. Ключи должны выводиться из данных, например `item.id`. К тому же хук нельзя вызывать внутри `map`.
    - label: Он гарантирует уникальность id во всём документе, включая разметку вне React
      why: "React не знает про чужую разметку: захардкоженный `id` в HTML-шаблоне может совпасть. Уникальность гарантируется только среди id, выданных `useId` одного React-корня."
