# Упражнения по хукам. Формат и правила проверки — packages/content/src/exercises.ts

- id: effect-cleanup-order
  type: predict-output
  skill: effect-lifecycle
  question: use-effect-basics
  difficulty: 2
  prompt: Компонент смонтировали (без StrictMode), затем один раз нажали кнопку. Что будет в консоли?
  code: |
    function Counter() {
      const [n, setN] = useState(0);
      console.log('render', n);

      useEffect(() => {
        console.log('effect', n);
        return () => console.log('cleanup', n);
      }, [n]);

      return <button onClick={() => setN(n + 1)}>+</button>;
    }
  options:
    - render 0 → effect 0 → render 1 → cleanup 0 → effect 1
    - render 0 → effect 0 → render 1 → cleanup 1 → effect 1
    - render 0 → effect 0 → cleanup 0 → render 1 → effect 1
    - render 0 → effect 0 → render 1 → effect 1
  answer: 0
  explanation: >-
    Сначала новый рендер, затем перед новым эффектом React вызывает cleanup предыдущего.
    Cleanup — замыкание прошлого рендера, поэтому видит n = 0, а не 1.

- id: hook-after-early-return
  type: find-bug
  skill: rules-of-hooks
  question: rules-of-hooks
  prompt: Найдите строку, из-за которой компонент сломается, когда user появится после первого рендера.
  code: |
    function Profile({ user }: { user?: User }) {
      if (!user) return null;
      const [tab, setTab] = useState('info');
      return <Tabs value={tab} onChange={setTab} />;
    }
  bugLines: [2, 3]
  causes:
    - Хук вызывается после раннего return — число и порядок хуков меняются между рендерами
    - useState нельзя инициализировать строкой
    - setTab нельзя передавать дочернему компоненту
    - Компонент не может возвращать null
  answer: 0
  explanation: >-
    React сопоставляет состояние хуков по порядку вызова. На первом рендере useState не вызывается,
    на следующем — вызывается, и React падает с ошибкой «Rendered more hooks than during the previous render».
    Решение — все хуки до любых условий.

- id: abort-stale-request
  type: fill-tokens
  skill: effect-race-conditions
  question: effect-race-conditions
  difficulty: 2
  prompt: Допишите эффект так, чтобы ответ устаревшего запроса не перезаписал данные нового userId.
  code: |
    useEffect(() => {
      const controller = new ___();
      fetch(`/api/users/${userId}`, { signal: controller.___ })
        .then((r) => r.json())
        .then(setUser)
        .catch((e) => { if (e.name !== 'AbortError') setError(e); });
      return () => controller.___();
    }, [___]);
  tokens: [AbortController, signal, abort, userId]
  decoys: [AbortSignal, cancel, user, controller]
  explanation: >-
    При смене userId React вызывает cleanup прошлого эффекта: abort() отменяет старый запрос,
    его промис отклоняется с AbortError, и setUser с устаревшими данными не случится.

- id: build-use-debounced-value
  type: parsons
  skill: custom-hooks-timers
  question: custom-hooks
  difficulty: 2
  prompt: Соберите хук, который возвращает значение только после паузы в delay мс.
  lines:
    - 'function useDebouncedValue<T>(value: T, delay: number): T {'
    - '  const [debounced, setDebounced] = useState(value);'
    - '  useEffect(() => {'
    - '    const id = setTimeout(() => setDebounced(value), delay);'
    - '    return () => clearTimeout(id);'
    - '  }, [value, delay]);'
    - '  return debounced;'
    - '}'
  distractors:
    - '  }, []);'
    - '    clearTimeout(id);'
  explanation: >-
    Каждое изменение value перезапускает эффект, а cleanup отменяет прошлый таймер — значение обновится,
    только когда ввод стихнет. С пустым массивом зависимостей хук навсегда запомнил бы первое value.

- id: rules-of-hooks-quiz
  type: quiz
  skill: rules-of-hooks
  question: rules-of-hooks
  prompt: Почему хуки нельзя вызывать внутри условий и циклов?
  options:
    - label: React сопоставляет состояние хуков по порядку вызова — если порядок меняется, состояние «съезжает» к другому хуку
      why: Верно. Состояние хуков хранится списком в Fiber-узле компонента, и единственный способ найти «свой» элемент — номер вызова.
    - label: Условия внутри компонента делают рендер нечистым
      why: Условие само по себе не нарушает чистоту — компонент может по-разному рендерить JSX. Проблема именно в меняющемся числе вызовов хуков.
    - label: Так требует линтер, а сам React работал бы и без этого правила
      why: Наоборот — линтер лишь ловит нарушение заранее. React действительно ломается и падает с ошибкой «Rendered more hooks than during the previous render».
    - label: Хуки вызываются асинхронно, и внутри условия React не успевает их зарегистрировать
      why: Хуки вызываются синхронно во время рендера. Асинхронность тут ни при чём.
  answer: 0
  explanation: >-
    Правило вытекает из устройства: React хранит хуки компонента по порядку вызова. Исключение — хук use из React 19:
    он не хранит состояние в этом списке, поэтому его можно вызывать условно.

# custom-hooks: принято из черновика 2026-10-11
- id: custom-hooks-state-isolation
  skill: custom-hooks-state-isolation
  question: custom-hooks
  difficulty: 1
  prompt: Хедер и сайдбар вызывают один и тот же кастомный хук `useToggle()`. В хедере переключили значение. Что произойдёт в сайдбаре?
  explanation: Кастомный хук — обычная функция. Внутри неё хуки привязаны к компоненту, который её вызвал. Поэтому хуки делятся логикой, а не состоянием. Если нужно общее состояние, его поднимают в общего родителя, Context или внешний стор, а хук остаётся удобной обёрткой над ним.
  type: quiz
  options:
    - label: "Ничего: каждый вызов хука получает своё независимое состояние, общим остаётся только код логики"
      why: Верно. useState внутри хука принадлежит Fiber-узлу вызвавшего компонента, поэтому хедер и сайдбар хранят по своей копии.
    - label: Сайдбар тоже переключится, потому что оба компонента используют один хук
      why: "Это главное заблуждение. Хук не синглтон: каждый вызов создаёт своё состояние. Для общего состояния нужен Context или стор."
    - label: Сайдбар переключится, только если хук объявлен в отдельном модуле и экспортирован
      why: Место объявления функции ни на что не влияет. Состояние создаётся при вызове useState внутри конкретного компонента.
    - label: "React выдаст предупреждение: один хук нельзя вызывать в двух компонентах одновременно"
      why: "Никаких ограничений нет: переиспользование в разных компонентах — смысл кастомных хуков."
  answer: 0
- id: custom-hooks-unstable-refetch
  skill: custom-hooks-stable-api
  question: custom-hooks
  difficulty: 2
  prompt: После монтирования Profile запросы к API идут бесконечно. Найдите строки, где причина.
  explanation: "refetch создаётся заново на каждом рендере. Цикл такой: эффект вызывает refetch → setUser → рендер → новый refetch → эффект снова срабатывает. Исправление — `useCallback(() => ..., [id])`. Функции и объекты, которые возвращает хук, должны быть стабильными: потребители кладут их в зависимости. React Compiler мемоизирует это сам, но API лучше делать стабильным явно."
  type: find-bug
  language: tsx
  code: |-
    function useUser(id: string) {
      const [user, setUser] = useState<User | null>(null);
      const refetch = () =>
        fetchUser(id).then(setUser);
      return { user, refetch };
    }

    function Profile({ id }: { id: string }) {
      const { user, refetch } = useUser(id);
      useEffect(() => {
        refetch();
      }, [refetch]);
      return <Card user={user} />;
    }
  bugLines:
    - 3
    - 4
  causes:
    - "refetch — новая функция на каждом рендере: эффект с [refetch] перезапускается после каждого setUser"
    - setUser нельзя передавать в then — нужно обернуть в стрелочную функцию
    - Кастомный хук не может возвращать объект, только кортеж, как useState
    - Хук обязан сам вызывать fetchUser в своём useEffect, иначе запрос не выполнится
  answer: 0
- id: custom-hooks-online-status
  skill: custom-hooks-external-store
  question: custom-hooks
  difficulty: 2
  prompt: Допишите хук, который подписывается на статус сети браузера и корректно отписывается.
  explanation: Для подписки на внешний источник (события браузера, сторонний стор) подходит useSyncExternalStore, а не useEffect с useState. Он не даёт рассинхрона при конкурентном рендере. subscribe вынесен из компонента, поэтому он стабилен и React не переподписывается на каждом рендере. Третий аргумент — снапшот для SSR.
  type: fill-tokens
  language: tsx
  code: |-
    function subscribe(cb: () => void) {
      window.addEventListener('online', cb);
      window.addEventListener('offline', cb);
      return () => {
        window.___('online', cb);
        window.removeEventListener('offline', cb);
      };
    }

    export function useOnlineStatus() {
      return ___(subscribe,
        () => navigator.___, () => true);
    }
  tokens:
    - removeEventListener
    - useSyncExternalStore
    - onLine
  decoys:
    - dispatchEvent
    - useEffect
    - online
    - isOnline
- id: custom-hooks-reuse-media-query
  skill: logic-reuse-choice
  question: custom-hooks
  difficulty: 2
  prompt: "В пяти разных компонентах нужно знать, совпадает ли `(max-width: 768px)`, и перерисовываться при ресайзе. Компоненты в разных частях дерева. Как переиспользовать логику?"
  explanation: "Логику с состоянием и подписками переиспользуют через кастомный хук. HOC и render props остались из эпохи до хуков и усложняют дерево. Context нужен, когда значение надо переопределять для поддерева или менять из разных мест. Для подписки на браузерное API достаточно хука: каждый компонент вызывает его там, где нужно."
  type: choose-tool
  options:
    - label: Кастомный хук useMediaQuery(query) на useSyncExternalStore с matchMedia
      why: "Лучший выбор: логика в одном месте, каждый компонент вызывает хук там, где он нужен, без обёрток в дереве и с корректной подпиской."
    - label: HOC withMediaQuery, который пробрасывает isMobile в props
      why: "Работает, но это подход до React 16.8: лишние обёртки, неявные props, возможные коллизии имён. Уместен разве что в старой кодовой базе с классами."
    - label: Компонент <MediaQuery> с render props
      why: Тоже рабочий, но даёт вложенность JSX и не позволяет использовать значение в логике до return. Сейчас его выбирают в основном для совместимости с библиотеками.
    - label: Context с провайдером в корне, который слушает matchMedia
      why: Оправдан, если значение нужно переопределять для поддерева, например в тестах. Для простой подписки это лишний провайдер и связность, которых хук не требует.
  answer: 0

# effect-race-conditions: принято из черновика 2026-10-11
- id: effect-race-conditions-why-stale
  skill: effect-race-conditions
  question: effect-race-conditions
  difficulty: 2
  prompt: Эффект грузит профиль по userId без cleanup. Пользователь быстро переключил A → B, а на экране остался профиль A. Почему?
  explanation: "Порядок ответов сети не гарантирован, а каждый `.then(setUser)` срабатывает независимо. Побеждает тот, кто пришёл последним, а не тот, кто актуален. Правило: в cleanup отменяйте запрос (`AbortController`) или игнорируйте его результат флагом. В проекте это делают TanStack Query, SWR и загрузчики роутера."
  type: quiz
  options:
    - label: "Ответ для A пришёл позже ответа для B, и его setUser перезаписал актуальные данные: эффект A никто не отменил"
      why: Верно. Запросы живут независимо от рендеров. Без cleanup результат устаревшего запроса всё равно попадёт в состояние, если придёт последним.
    - label: React запускает эффекты для A и B параллельно и применяет только результат первого эффекта
      why: Эффекты выполняются по очереди после коммитов. Решающим оказывается порядок ответов сети, а не порядок запуска эффектов.
    - label: setUser асинхронный и батчится, поэтому React применяет первое значение и отбрасывает второе
      why: "Батчинг объединяет обновления, но применяет их по порядку: последнее значение побеждает. Проблема в том, что последним пришёл старый ответ."
    - label: Браузер закешировал ответ для A и вернул его на запрос B
      why: URL у запросов разный, поэтому HTTP-кэш не подменит ответ. Это заблуждение уводит от настоящей причины — отсутствия отмены в cleanup.
  answer: 0
- id: effect-race-async-callback
  skill: effect-race-conditions
  question: effect-race-conditions
  difficulty: 2
  prompt: Автор хотел отменять старый запрос при смене userId, но гонка осталась. Найдите строку с ошибкой.
  explanation: "Async-функция всегда возвращает промис, поэтому React не получает cleanup, а `abort()` не вызывается. Правильно: синхронный эффект, а внутри — async-функция, которую сразу вызывают. Cleanup возвращается синхронно. После исправления не забудьте `catch` с проверкой `AbortError`: иначе каждая отмена покажет ложную ошибку."
  type: find-bug
  language: tsx
  code: |-
    function UserCard({ userId }: { userId: string }) {
      const [user, setUser] = useState<User | null>(null);

      useEffect(async () => {
        const controller = new AbortController();
        const r = await fetch(`/api/users/${userId}`, {
          signal: controller.signal,
        });
        setUser(await r.json());
        return () => controller.abort();
      }, [userId]);

      return <Card user={user} />;
    }
  bugLines:
    - 4
  causes:
    - "Колбэк эффекта объявлен как async: он возвращает промис, а не cleanup, поэтому abort() никогда не вызовется"
    - AbortController нужно хранить в useRef, иначе он пересоздаётся на каждом рендере
    - await внутри эффекта блокирует рендер до ответа сервера
    - fetch нужно обернуть в useCallback, иначе запросы дублируются
  answer: 0
- id: effect-race-ignore-flag
  skill: effect-race-conditions
  question: effect-race-conditions
  difficulty: 2
  prompt: Функцию fetchUser нельзя отменить. Соберите эффект, который игнорирует ответ устаревшего запроса с помощью флага.
  explanation: Каждый запуск эффекта получает свой `ignore` в замыкании. При смене userId cleanup прошлого запуска ставит `ignore = true`, и поздний ответ уже не попадёт в состояние. Флаг не отменяет сам запрос, сеть всё равно тратится. Поэтому, если API принимает `signal`, лучше `AbortController`.
  type: parsons
  language: tsx
  lines:
    - useEffect(() => {
    - "  let ignore = false;"
    - "  fetchUser(userId).then((data) => {"
    - "    if (!ignore) setUser(data);"
    - "  });"
    - "  return () => {"
    - "    ignore = true;"
    - "  };"
    - "}, [userId]);"
  distractors:
    - "    ignore = false;"
    - "}, []);"
- id: effect-race-waterfall-fix
  skill: data-fetching-waterfalls
  question: effect-race-conditions
  difficulty: 2
  prompt: Приложение на React Router, маршрут /users/:id. ProfilePage грузит пользователя в useEffect, а потом рендерит Posts, который грузит посты в своём useEffect. Обоим запросам нужен только id из URL. В Network запросы идут строго друг за другом. Как это исправить?
  explanation: "Это водопад: ребёнок начинает загрузку только после того, как родитель загрузил данные и отрендерил его. Лечится тем, что загрузку запускают раньше рендера: loaders, prefetch, Server Components. AbortController решает другую проблему — гонки, а не последовательность запросов."
  type: choose-tool
  options:
    - label: Loader маршрута, который запускает оба запроса параллельно до рендера
      why: "Лучший вариант: оба запроса зависят только от id из URL, поэтому loader стартует их сразу при навигации, не дожидаясь рендера."
    - label: Добавить AbortController в эффекты обоих компонентов
      why: Это защищает от гонок при быстрой смене id, но Posts всё равно монтируется после загрузки пользователя, так что водопад останется.
    - label: Обернуть Posts в Suspense
      why: Suspense показывает fallback, пока данные грузятся, но не начинает загрузку раньше. Если Posts грузит данные в эффекте, Suspense вообще ни на что не влияет.
    - label: Перенести загрузку в useLayoutEffect
      why: Эффект сработает чуть раньше paint, но всё равно после рендера. Posts по-прежнему ждёт данных родителя, к тому же блокируется отрисовка.
  answer: 0

# rules-of-hooks: принято из черновика 2026-10-11
- id: rules-of-hooks-hook-in-handler
  skill: rules-of-hooks
  question: rules-of-hooks
  difficulty: 1
  prompt: Найдите строку, которая нарушает правила хуков.
  explanation: "Хуки вызываются только во время рендера, на верхнем уровне компонента. Обработчик срабатывает позже, вне рендера, и React не знает, к какому компоненту относится вызов. Решение: вызвать `useContext(AuthContext)` рядом с useState, а в обработчике использовать уже полученный token. То же правило действует для useEffect, useMemo и колбэков."
  type: find-bug
  language: tsx
  code: |-
    function LikeButton({ postId }: Props) {
      const [liked, setLiked] = useState(false);

      async function handleClick() {
        const { token } = useContext(AuthContext);
        await likePost(postId, token);
        setLiked(true);
      }

      return (
        <button onClick={handleClick}>{liked ? '♥' : '♡'}</button>
      );
    }
  bugLines:
    - 5
  causes:
    - useContext вызывается в обработчике события, а не на верхнем уровне компонента во время рендера
    - useState нужно объявлять после всех функций-обработчиков
    - Обработчик события не может быть async-функцией
    - "setLiked после await не сработает: обновление вне батча теряется"
  answer: 0
- id: rules-of-hooks-extract-list-item
