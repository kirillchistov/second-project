    - После `click()` нужно добавить `waitForTimeout(1000)`, иначе Playwright не успевает нажать кнопку
    - "`getByRole('status')` не находит элементы с `role=\"status\"`, нужен селектор по CSS-классу"
    - "`page.goto` нужно вызывать без `await`, иначе тест ждёт полной загрузки и падает по таймауту"
  answer: 0
