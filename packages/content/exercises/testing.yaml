- id: testing-hooks-query-error-timeout
  skill: testing-hooks-query-client
  question: testing-hooks
  difficulty: 2
  prompt: Тест проверяет, что useUser на TanStack Query отдаёт isError при ответе 500 от MSW. Тест висит и падает по таймауту. Как исправить?
  explanation: "TanStack Query по умолчанию повторяет упавшие запросы с задержкой, и waitFor не дожидается ошибки. Правило: в тестах — свежий QueryClient на каждый тест с `retry: false`, переданный через `wrapper`. Так нет повторов и общего кэша между тестами."
  type: choose-tool
  options:
    - label: "Создавать в каждом тесте new QueryClient с retry: false и передавать его через wrapper"
      why: "Лучший вариант: ошибка приходит сразу, а свежий клиент не делит кэш с другими тестами."
    - label: Увеличить timeout у waitFor и у теста до 10 секунд
      why: "Тест станет медленным и хрупким: он зависит от числа повторов и их задержек. Годится только как временная заплатка."
    - label: Включить vi.useFakeTimers() и промотать задержки между повторами
      why: Уместно, когда тестируют саму логику повторов. Для проверки состояния ошибки это лишняя сложность и риск зависнуть на промисах.
    - label: "Замокать useQuery через vi.mock и вернуть { isError: true }"
      why: "Тогда тест проверяет мок, а не хук: ключ запроса, queryFn и обработка ответа не участвуют. Подходит, только если тестируется компонент поверх хука."
