          new HttpResponse(null, { status: 500 })),
      );
      render(<TodoList />, { wrapper: Providers });
      expect(await screen.___('alert')).toBeVisible();
    });
  tokens:
    - error
    - resetHandlers
    - use
    - findByRole
  decoys:
    - warn
    - getByRole
    - listen
    - reset

# testing-hooks: принято из черновика 2026-10-13
- id: testing-hooks-strategy-quiz
  skill: testing-hooks-strategy
  question: testing-hooks
  difficulty: 2
  prompt: Когда собственный хук стоит тестировать отдельно через `renderHook`, а когда — через компонент, который его использует?
  explanation: Тест должен проверять публичный контракт. У хука одного компонента контракт — поведение этого компонента, а сам хук — деталь реализации. У переиспользуемого хука его аргументы и возвращаемое значение и есть API, поэтому его тестируют отдельно через `renderHook`.
  type: quiz
  options:
    - label: Хук одного компонента — через этот компонент, переиспользуемый — отдельно через renderHook
      why: "Верно. Контракт переиспользуемого хука — его API, а хук одного компонента — деталь реализации: тест через UI переживёт рефакторинг."
    - label: "Всегда через renderHook: тест изолированнее и быстрее, а компонентные тесты дублируют проверки"
      why: "Изоляция ради изоляции привязывает тест к реализации: вынесли логику обратно в компонент — тест сломался, хотя поведение то же."
    - label: "Всегда через компонент: renderHook устарел и удалён в современных версиях Testing Library"
      why: "renderHook не удалён: он переехал из @testing-library/react-hooks в @testing-library/react и поддерживается."
    - label: "Через renderHook только хуки без состояния: useState и useEffect вне настоящего компонента не работают"
      why: renderHook как раз рендерит хук внутри тестового компонента, поэтому состояние, эффекты и контексты работают.
  answer: 0
- id: testing-hooks-stale-result-current
  skill: testing-hooks-result-current
  question: testing-hooks
  difficulty: 2
  prompt: "Хук useCounter работает правильно, но тест падает: ожидалось 1, получено 0. Найдите строку с ошибкой."
  explanation: "`result.current` — ссылка, которую renderHook обновляет после каждого рендера. Деструктуризация копирует значения первого рендера, и `count` навсегда остаётся 0. Правило: после каждого `act` читайте `result.current.count` заново."
  type: find-bug
  language: tsx
  code: |-
    test('increment увеличивает count', () => {
      const { result } = renderHook(() => useCounter(0));
      const { count, increment } = result.current;
      act(() => increment());
      expect(count).toBe(1);
    });
  bugLines:
    - 3
  causes:
    - Деструктуризация зафиксировала count первого рендера — после act нужно читать result.current.count
    - Синхронный act не применяет обновление — нужен await act(async () => increment())
    - Сам вызов renderHook нужно обернуть в act, иначе хук не отрендерится
    - При деструктуризации increment теряет this и не меняет состояние
  answer: 0
- id: testing-hooks-debounce-fake-timers
  skill: testing-hooks-timers
  question: testing-hooks
  difficulty: 2
  prompt: "Допишите тест debounce-хука: сменить аргумент и промотать время фейковыми таймерами."
  explanation: "Аргументы хука передают через `initialProps`, а новые значения — через `rerender`. Время двигают `vi.advanceTimersByTime`, обёрнутым в `act`: срабатывает setState, и React должен применить обновление. Не забудьте вернуть `vi.useRealTimers()` в afterEach."
  type: fill-tokens
