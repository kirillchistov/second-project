# Черновик упражнений: «Как передать данные от ребёнка к родителю и между соседями?» (lifting-state-up)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only lifting-state-up

- id: lifting-state-up-quiz
  skill: lifting-state-up
  question: lifting-state-up
  difficulty: 1
  prompt: Как в React передать данные от ребёнка к родителю и сделать общее состояние для двух соседних компонентов?
  explanation: "Данные идут сверху вниз, а события — снизу вверх через колбэки. Общее состояние живёт у ближайшего общего предка, у него единственный источник правды. Не поднимайте его выше, чем нужно: изменение перерисует всё поддерево предка."
  type: quiz
  options:
    - label: Родитель хранит state и передаёт ребёнку колбэк; общее для соседей состояние поднимают к ближайшему общему предку
      why: Верно. Ребёнок сообщает о событии через колбэк, а предок передаёт вниз значение и функцию изменения. Так у состояния остаётся один владелец.
    - label: Ребёнок записывает новое значение прямо в объект props, и родитель его увидит
      why: Props доступны только для чтения. Мутация не вызовет ререндер родителя и нарушает однонаправленный поток данных.
    - label: Каждый сосед держит свою копию state, а useEffect синхронизирует копии между собой
      why: "Это антипаттерн: появляются лишние рендеры, копии могут рассинхронизироваться, а данные приходится дублировать. Хватит одного источника правды у общего предка."
    - label: Родитель через ref и useImperativeHandle читает state ребёнка, когда он нужен
      why: Это обходной путь для императивных действий вроде focus() или scroll. Чтение через ref не вызывает ререндер, поэтому соседи не узнают об изменении.
  answer: 0

- id: lifting-state-up-duplicated-state
  skill: single-source-of-truth
  question: lifting-state-up
  difficulty: 2
  prompt: Кнопка Reset очищает query, и список показывает все товары, но в поле ввода остаётся старый текст. Найдите причину.
  explanation: "У Filters своя копия состояния, которая синхронизируется с родителем эффектом. Поток идёт только вверх, поэтому сброс у родителя до инпута не доходит. Решение — сделать Filters контролируемым: принимать value и onChange от родителя без собственного useState и эффекта."
  type: find-bug
  language: tsx
  code: |-
    function Filters({ onChange }: FiltersProps) {
      const [value, setValue] = useState('');
      useEffect(() => onChange(value), [value]);
      return <input value={value}
        onChange={(e) => setValue(e.target.value)} />;
    }
    function ProductPage() {
      const [query, setQuery] = useState('');
      return <>
        <button onClick={() => setQuery('')}>Reset</button>
        <Filters onChange={setQuery} />
        <ProductList query={query} />
      </>;
    }
  bugLines:
    - 2
    - 3
  causes:
    - "Состояние продублировано: Filters держит свою копию и лишь шлёт её вверх эффектом, поэтому сброс query у родителя не доходит до инпута"
    - В зависимостях эффекта нет onChange, поэтому он вызывает устаревший колбэк
    - Функцию setQuery нельзя передавать в дочерний компонент как prop
    - Фрагмент <> нельзя возвращать без круглых скобок вокруг JSX
  answer: 0

