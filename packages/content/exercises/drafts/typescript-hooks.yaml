# Черновик упражнений: «Как типизировать хуки и описывать состояние через discriminated unions?» (typescript-hooks)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only typescript-hooks

- id: typescript-hooks-union-vs-flags
  skill: discriminated-union-state
  question: typescript-hooks
  difficulty: 2
  prompt: "Почему асинхронное состояние лучше описать discriminated union по полю status, а не тремя useState: isLoading, error, data?"
  explanation: "Независимые флаги допускают 2×2×2 комбинаций, и многие из них бессмысленны. Union по status оставляет только допустимые состояния, а сужение типа даёт доступ к data или error только в нужной ветке. Правило: «невозможные состояния — непредставимые»."
  type: quiz
  options:
    - label: Невозможные комбинации (loading и error одновременно) становятся непредставимыми, а поля доступны только в своей ветке
      why: "Верно. Каждая ветка union несёт только свои поля, и после проверки status TypeScript сужает тип: state.data есть лишь при status === 'success'."
    - label: Один useState вместо трёх заметно уменьшает число ререндеров
      why: React 18+ батчит обновления в обработчиках и промисах, так что три setState обычно дают один рендер. Выигрыш union — в типобезопасности, а не в производительности.
    - label: TypeScript не умеет выводить тип для useState(null), поэтому флаги типизировать нельзя
      why: "Можно: useState<string | null>(null). Проблема флагов не в выводе типов, а в том, что тип разрешает противоречивые комбинации."
    - label: Union можно хранить только в useReducer, и это делает переходы между состояниями явными
      why: Union прекрасно хранится и в useState<State>. useReducer полезен для сложных переходов, но к сути discriminated union он не обязателен.
  answer: 0

- id: typescript-hooks-exhaustive-switch
  skill: ts-exhaustive-check
  question: typescript-hooks
  difficulty: 2
  prompt: Допишите компонент так, чтобы при добавлении нового status без своей ветки возникала ошибка компиляции.
  explanation: switch по дискриминанту status сужает тип в каждом case, поэтому state.data доступно только в 'success'. В default остаётся то, что не обработано; если обработано всё — это never. Новый статус без case не присвоится never, и компилятор укажет на пропуск.
  type: fill-tokens
  language: tsx
  code: |-
    type State =
      | { status: 'loading' }
      | { status: 'success'; data: User[] }
      | { status: 'error'; error: string };

    function View({ state }: { state: State }) {
      switch (state.___) {
        case 'loading': return <Spinner />;
        case 'success': return <List data={state.___} />;
        case 'error': return <p>{state.error}</p>;
        default: { const n: ___ = state; return n; }
      }
    }
  tokens:
    - status
    - data
    - never
  decoys:
    - type
    - error
    - unknown
    - any

- id: typescript-hooks-tuple-as-const
  skill: ts-tuple-as-const
  question: typescript-hooks
  difficulty: 2
  prompt: TypeScript ругается на onClick={toggle} в Menu. Найдите строку с причиной.
  explanation: Литерал [on, toggle] без подсказки выводится как массив (boolean | (() => void))[], и при деструктуризации каждый элемент получает объединённый тип. `return [on, toggle] as const` даёт кортеж readonly [boolean, () => void]. Альтернатива — явный тип возврата хука.
  type: find-bug
  language: tsx
  code: |-
    function useToggle(initial = false) {
      const [on, setOn] = useState(initial);
      const toggle = useCallback(
        () => setOn((v) => !v),
        []
      );
      return [on, toggle];
    }

    function Menu() {
      const [open, toggle] = useToggle();
      return <button onClick={toggle}>Menu</button>;
    }
  bugLines:
    - 7
  causes:
    - Без as const возвращается массив объединённых типов, и toggle имеет тип boolean | (() => void)
    - useCallback с пустыми зависимостями возвращает устаревший toggle
    - useState(initial) выводит тип literal false, поэтому setOn не принимает true
    - Кастомный хук обязан возвращать объект, а не массив
  answer: 0

# исправлено ревьюером:
# В explanation неточность: без проверки useContext вернёт null (дефолт контекста), а не undefined. Фраза «вместо тихого undefined» вводит в заблуждение.
- id: typescript-hooks-typed-context
  skill: ts-typed-context
  question: typescript-hooks
  difficulty: 2
  prompt: Соберите типизированный контекст без значения по умолчанию и хук, который возвращает гарантированно непустое значение.
  explanation: "createContext<AuthValue | null>(null) честно отражает, что вне провайдера значения нет. Проверка на null в useAuth сужает тип до AuthValue и даёт понятную ошибку, а не тихий null, который упадёт позже. Проверка на undefined не сработала бы: дефолт — null, тип не сузится, и return ctx не скомпилируется."
  type: parsons
  language: tsx
  lines:
    - "type AuthValue = { user: User; logout: () => void };"
    - const AuthContext = createContext<AuthValue | null>(null);
    - "function useAuth(): AuthValue {"
    - "  const ctx = useContext(AuthContext);"
    - "  if (!ctx) throw new Error('useAuth outside AuthProvider');"
    - "  return ctx;"
    - "}"
  distractors:
    - const AuthContext = createContext<AuthValue>(null);
    - "  if (ctx === undefined) throw new Error('No provider');"
