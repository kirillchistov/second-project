# Черновик упражнений: «Как React-приложение влияет на Core Web Vitals (LCP, INP, CLS)?» (web-vitals)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only web-vitals

- id: web-vitals-react-causes-quiz
  skill: web-vitals-causes
  question: web-vitals
  difficulty: 2
  prompt: Какое утверждение о том, как React-приложение влияет на Core Web Vitals, верно?
  explanation: "Каждая метрика ломается по своей причине. LCP — когда главный контент поздно попадает на экран. INP — когда главный поток занят в момент взаимодействия. CLS — когда контент появляется без зарезервированного места. Поэтому сначала определите метрику, потом выбирайте технику: SSR, startTransition и memo лечат разные вещи."
  type: quiz
  options:
    - label: LCP страдает от CSR и поздней загрузки главного контента, INP — от долгих задач в главном потоке, CLS — от контента без места
      why: Верно. LCP — это то, когда виден главный контент. INP — насколько занят поток при взаимодействии. CLS — насколько сдвигается вёрстка.
    - label: "SSR закрывает все три метрики: HTML приходит готовым, поэтому и INP, и CLS будут в порядке"
      why: SSR помогает LCP, но гидрация — это долгая задача, и она может ухудшить INP. Картинки без размеров и баннеры дают CLS и при SSR.
    - label: Виртуальный DOM батчит изменения, поэтому React не может испортить INP — только LCP
      why: Батчинг не делает рендер дешёвым. Тяжёлый рендер или синхронный обработчик всё равно блокируют главный поток и задерживают следующий кадр.
    - label: CLS в основном вызывают лишние ререндеры, поэтому memo и React Compiler снижают сдвиги
      why: Ререндер без изменения геометрии ничего не сдвигает. CLS дают появляющиеся элементы без размеров, а memo влияет скорее на INP.
  answer: 0

- id: web-vitals-lcp-lazy-hero
  skill: lcp-image-priority
  question: web-vitals
  difficulty: 2
  prompt: Hero-картинка на первом экране — LCP-элемент страницы. Найдите строку, из-за которой LCP вырос.
  explanation: '`loading="lazy"` откладывает загрузку: браузер ждёт раскладки, чтобы понять, видна ли картинка, поэтому LCP-изображение начинает грузиться позже. Для картинки первого экрана уберите lazy, добавьте `fetchPriority="high"` и при необходимости `preload`. Lazy оставьте для того, что ниже видимой области.'
  type: find-bug
  language: tsx
  code: |-
    function Hero({ product }: { product: Product }) {
      return (
        <section className="hero">
          <img
            src={product.coverUrl}
            alt={product.title}
            width={1200}
            height={600}
            loading="lazy"
          />
          <h1>{product.title}</h1>
        </section>
      );
    }
  bugLines:
    - 9
  causes:
    - '`loading="lazy"` откладывает загрузку LCP-изображения, а оно должно грузиться как можно раньше с высоким приоритетом'
    - Явные width и height мешают браузеру масштабировать картинку и увеличивают LCP
    - Заголовок h1 стоит после img, поэтому браузер считает LCP-элементом текст
    - Атрибут alt заставляет браузер ждать декодирования изображения перед отрисовкой
  answer: 0

- id: web-vitals-inp-heavy-compute
  skill: inp-long-tasks
  question: web-vitals
  difficulty: 3
  prompt: "По клику «Построить отчёт» синхронно агрегируются 200 тыс. строк: около 600 мс чистого JS. Рендер результата дешёвый, INP в поле — 700 мс. Что выбрать?"
  explanation: "Сначала выясните, на что уходит время. Если это рендер React — помогут startTransition, memo, перенос state ниже и виртуализация. Если это одно долгое вычисление вне React, его нужно убрать из главного потока: Web Worker или разбиение на куски через `scheduler.yield()`."
  type: choose-tool
  options:
    - label: Вынести агрегацию в Web Worker
      why: "Лучший вариант: 600 мс JS уходят из главного потока, клик сразу получает отклик (спиннер), а результат приходит через postMessage."
    - label: Обернуть setState результата в startTransition
      why: Transition делает прерываемым рендер React, а не синхронное вычисление. Агрегация всё равно займёт поток на 600 мс. Подошёл бы, если бы дорогим был рендер.
    - label: Обернуть агрегацию в useMemo
      why: useMemo не пересчитывает при тех же входных данных, но первое вычисление по клику всё равно блокирует поток. Полезен, когда расчёт повторяется при ререндерах.
    - label: Виртуализировать таблицу отчёта
      why: Помогает, когда дорого рисовать тысячи DOM-узлов. Здесь рендер дешёвый, а время уходит на JS-вычисление.
  answer: 0

- id: web-vitals-find-bad-inp-recipe
  skill: inp-investigation
  question: web-vitals
  difficulty: 3
  prompt: В Search Console INP «плохой», а Lighthouse на ноутбуке показывает 98. Расставьте шаги поиска и исправления проблемного взаимодействия.
  explanation: Google оценивает страницу по полевым данным на 75-м перцентиле. Поэтому начинать нужно с RUM, а не с Lighthouse на мощной машине. Attribution подскажет элемент и долгую фазу; воспроизводить нужно на слабом CPU. Подтверждает фикс тоже поле, а не лабораторный замер.
  type: order
  kind: recipe
  steps:
    - "Собрать полевые данные через web-vitals/attribution: значение INP, interactionTarget и длительность фаз"
    - Сгруппировать по элементу и типу взаимодействия, найти худшие на 75-м перцентиле
    - Воспроизвести на бюджетном устройстве или с CPU throttling в DevTools
    - "Записать Performance-профиль и найти долгую фазу: input delay, обработка или presentation"
    - Применить фикс под эту фазу и подтвердить улучшение по полевым данным после релиза
