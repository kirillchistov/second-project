# Черновик упражнений: «Какие типичные анти-паттерны с useEffect?» (you-might-not-need-an-effect)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only you-might-not-need-an-effect

- id: effect-necessity-quiz
  skill: effect-necessity
  question: you-might-not-need-an-effect
  difficulty: 2
  prompt: Как решить, должен ли кусок кода жить в useEffect или в другом месте?
  explanation: "Эффект нужен только для синхронизации с внешней системой: подписки, DOM-виджеты, сеть, аналитика «при показе». Производные данные считаются в рендере. Реакции на действия пользователя пишутся в обработчике. Новое значение state вычисляется прямо в обработчике."
  type: quiz
  options:
    - label: "Спросить, почему код должен выполниться: из-за действия пользователя — обработчик, из-за показа и синхронизации с внешним — эффект"
      why: "Верно. Причина запуска определяет место: событие связано с конкретным действием, а эффект — с фактом, что компонент сейчас на экране."
    - label: Если код зависит от props или state — нужен эффект, иначе он не узнает об их изменениях
      why: Компонент и так перерендеривается при смене props и state. Производные данные считаются прямо в рендере, при необходимости через useMemo.
    - label: Если в коде есть побочное действие (запрос, уведомление) — всегда эффект, ведь рендер должен быть чистым
      why: Обработчики событий не обязаны быть чистыми. Побочное действие, вызванное кликом или отправкой формы, пишется в обработчике.
    - label: Если код должен выполниться после обновления state — нужен эффект, иначе в обработчике state ещё старый
      why: Следующее значение можно вычислить в обработчике (const next = …) и использовать сразу. Эффект лишь добавит рендер со старым значением.
  answer: 0

- id: effect-notification-on-mount
  skill: effect-vs-event-handler
  question: you-might-not-need-an-effect
  difficulty: 2
  prompt: "Жалоба: уведомление «в корзине» появляется при каждом открытии страницы товара, который уже лежит в корзине. Где ошибка?"
  explanation: Уведомление должно появиться, потому что пользователь нажал «Купить». Это событие, а не синхронизация. Эффект же срабатывает при каждом показе страницы, если товар уже в корзине. Решение — вызвать showNotification в handleBuy рядом с addToCart.
  type: find-bug
  language: tsx
  code: |-
    function ProductPage({ product, addToCart }: Props) {
      useEffect(() => {
        if (product.isInCart) {
          showNotification(`${product.name} в корзине`);
        }
      }, [product]);

      function handleBuy() {
        addToCart(product);
      }

      return <button onClick={handleBuy}>Купить</button>;
    }
  bugLines:
    - 2
    - 3
  causes:
    - Уведомление привязано к состоянию isInCart, а не к событию покупки, поэтому эффект срабатывает при каждом показе страницы
    - В зависимостях нужен product.isInCart вместо product, тогда лишних уведомлений не будет
    - showNotification меняет UI, поэтому его нужно вызывать в useLayoutEffect
    - addToCart мутирует product, и эффект видит устаревший объект
  answer: 0

- id: effect-reset-draft-on-post-change
  skill: reset-state-with-key
  question: you-might-not-need-an-effect
  difficulty: 2
  prompt: "Компонент Comments со своей формой: черновик, раскрытые ветки, состояние у вложенных компонентов. При переходе на другой пост всё это должно очищаться. Как сделать?"
  explanation: "Состояние в React привязано к позиции и ключу. Новый key означает новый экземпляр: всё дерево состояния сбрасывается без лишнего рендера со старыми данными. Сброс через эффект — классический анти-паттерн: сначала мелькает старый черновик, и легко забыть часть состояния."
  type: choose-tool
  options:
    - label: Рендерить <Comments key={postId} postId={postId} />
      why: "Лучший вариант: смена key пересоздаёт компонент и всех потомков, сбрасывая всё состояние сразу и без промежуточного рендера."
    - label: useEffect с [postId], который вызывает setDraft('') и другие сеттеры
      why: Один рендер пройдёт со старым черновиком, будет мерцание. Каждый state придётся сбрасывать вручную, а state вложенных компонентов отсюда не достать.
    - label: Хранить prevPostId в state и сбрасывать часть state прямо во время рендера
      why: Допустимо, когда нужно сбросить или поправить лишь часть состояния, а остальное сохранить. Для полного сброса это сложнее и хрупче, чем key.
    - label: Поднять черновики в родителя и хранить Map по postId
      why: Подходит, если черновик каждого поста нужно сохранять при переключении. Здесь нужен именно сброс, так что это лишняя сложность.
  answer: 0

- id: effect-notify-parent-in-handler
  skill: notify-parent-in-handler
  question: you-might-not-need-an-effect
  difficulty: 1
  prompt: Допишите переключатель так, чтобы родитель узнавал о новом значении без useEffect.
  explanation: Следующее значение вычисляется один раз и сразу уходит и в свой state, и родителю. Оба обновления попадают в один батч. Если звать onChange из эффекта по isOn, родитель обновится на рендер позже, а onChange лишний раз сработает при монтировании.
  type: fill-tokens
  language: tsx
  code: |-
    function Toggle({ onChange }: ToggleProps) {
      const [isOn, setIsOn] = useState(false);
      function handleClick() {
        const ___ = !isOn;
        setIsOn(next);
        ___(next);
      }

      return (
        <button onClick={___}>
          {isOn ? 'On' : 'Off'}
        </button>
      );
    }
  tokens:
    - next
    - onChange
    - handleClick
  decoys:
    - useEffect
    - setIsOn
    - isOn
    - prev
