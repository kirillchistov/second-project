# Черновик упражнений: «Чем отличаются контролируемые и неконтролируемые компоненты?» (controlled-vs-uncontrolled)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only controlled-vs-uncontrolled

- id: controlled-vs-uncontrolled-quiz
  skill: controlled-vs-uncontrolled
  question: controlled-vs-uncontrolled
  difficulty: 1
  prompt: Чем по сути контролируемый input отличается от неконтролируемого?
  explanation: "Главный вопрос — кто хранит значение. Если состояние в React (`value` + `onChange`), поле контролируемое. Если его хранит DOM, а React читает при необходимости (ref, FormData, form action), — неконтролируемое. То же различие применимо к своим компонентам: props против внутреннего state."
  type: quiz
  options:
    - label: "Источник истины: у контролируемого значение в React state (value + onChange), у неконтролируемого — в DOM, читаем через ref/FormData"
      why: "Верно. Отсюда и выбор: контролируемый нужен, когда UI реагирует на каждый ввод, а неконтролируемый подходит, когда значение нужно только при отправке."
    - label: У контролируемого есть onChange, а у неконтролируемого обработчиков событий быть не может
      why: "Неконтролируемому полю можно повесить onChange, например для аналитики. Решает наличие `value`: именно он заставляет DOM показывать значение из React."
    - label: Неконтролируемые поля — устаревший подход, в React 19 рекомендуется всегда использовать контролируемые
      why: 'Наоборот: form actions в React 19 делают неконтролируемые формы удобными, а `<input type="file">` вообще бывает только неконтролируемым.'
    - label: "Контролируемые быстрее: React сам оптимизирует обновление DOM, а неконтролируемые обходят его"
      why: Контролируемое поле перерисовывает компонент на каждый символ. Поэтому React Hook Form ради скорости по умолчанию использует неконтролируемые поля.
  answer: 0

- id: controlled-vs-uncontrolled-undefined-init
  skill: controlled-input-pitfalls
  question: controlled-vs-uncontrolled
  difficulty: 2
  prompt: Сначала React ничего не пишет в консоль, но после первого символа в поле появляется предупреждение. Найдите строку, которая его вызывает.
  explanation: "На первом рендере `value={undefined}`, и React считает поле неконтролируемым. После ввода приходит строка, и поле становится контролируемым — React предупреждает о смене режима. Правило: инициализируйте контролируемое поле пустой строкой, `useState('')`."
  type: find-bug
  language: tsx
  code: |-
    function NameField() {
      const [name, setName] = useState<string>();
      return (
        <input
          value={name}
          onChange={(e) => setName(e.target.value)}
        />
      );
    }
  bugLines:
    - 2
  causes:
    - "Начальное значение undefined: поле стартует неконтролируемым и после ввода становится контролируемым"
    - Нужно читать e.currentTarget.value, а e.target.value возвращает устаревшее значение
    - Обработчик onChange нужно обернуть в useCallback, иначе input пересоздаётся
    - Дженерик <string> запрещает хранить в state значение из input
  answer: 0

- id: controlled-vs-uncontrolled-dual-mode
  skill: dual-mode-component
  question: controlled-vs-uncontrolled
  difficulty: 2
  prompt: "Допишите Toggle: если передан `on`, он контролируемый, иначе хранит состояние сам, начиная с `defaultOn`."
  explanation: "Паттерн двух режимов: внутренний state инициализируется из `defaultX`. Компонент считается контролируемым, если `x !== undefined`, и тогда значение берётся из props. Внутренний state обновляется только в неконтролируемом режиме, а onChange вызывается всегда."
  type: fill-tokens
  language: tsx
  code: |-
    function Toggle({ on, defaultOn = false, onChange }: Props) {
      const [inner, setInner] = useState(___);
      const isControlled = on !== ___;
      const value = isControlled ? ___ : inner;
      const toggle = () => {
        if (!___) setInner(!value);
        onChange?.(!value);
      };
      return <button aria-pressed={value} onClick={toggle} />;
    }
  tokens:
    - defaultOn
    - undefined
    - on
    - isControlled
  decoys:
    - "null"
    - inner
    - onChange
    - value

# исправлено ревьюером:
# Пояснение к варианту с React.memo неточно: value — строка и «пересоздаваться» не может. memo с useCallback частично помог бы, но родитель с 60 полями в state всё равно перерисовывается на каждый символ. Формулировку стоит уточнить.
- id: controlled-vs-uncontrolled-large-form
  skill: form-approach-choice
  question: controlled-vs-uncontrolled
  difficulty: 2
  prompt: Анкета на 60 полей. Сейчас каждое поле в useState родителя, и при вводе вся форма перерисовывается, печать лагает. Валидация нужна на blur и при отправке. Что выбрать?
  explanation: Чем больше полей и чем реже нужна реакция на каждый символ, тем выгоднее неконтролируемые поля. React Hook Form даёт их вместе с валидацией. Контролируемые поля оставляйте для масок, зависимых полей и живой валидации.
  type: choose-tool
  options:
    - label: React Hook Form с неконтролируемыми полями через register
      why: Значения живут в DOM, и ввод не перерисовывает всю форму. Валидация на blur и submit, ошибки и схемы (zod) есть из коробки.
    - label: Один useReducer со всеми полями вместо 60 useState
      why: Код станет аккуратнее, но state по-прежнему в родителе, и каждый символ перерисует всю форму. Хорош для сложных переходов состояния, но не для скорости.
    - label: Form action + FormData без отдельной библиотеки
      why: "Отлично для простых форм: значение читается при отправке. Но валидацию на blur, ошибки по полям и dirty-состояние придётся писать вручную."
    - label: Обернуть каждое поле в React.memo
      why: Без стабильных колбэков memo не сработает, а родитель со всем state всё равно перерисуется на каждый символ. Это лечение симптома.
  answer: 0
