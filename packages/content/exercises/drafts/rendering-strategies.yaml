# Черновик упражнений: «Чем отличаются CSR, SSR, SSG и ISR?» (rendering-strategies)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only rendering-strategies

- id: rendering-strategies-core-difference
  skill: rendering-strategies-concept
  question: rendering-strategies
  difficulty: 2
  prompt: В чём главное различие между CSR, SSR, SSG и ISR?
  explanation: "Ключевой вопрос — где и когда появляется HTML: в браузере (CSR), на каждый запрос (SSR), при сборке (SSG) или при сборке с фоновой перегенерацией (ISR). От ответа зависят свежесть данных, SEO, TTFB и нагрузка на сервер. Интерактивность во всех случаях даёт JS на клиенте."
  type: quiz
  options:
    - label: "В том, где и когда генерируется HTML: в браузере, на каждый запрос, при сборке или при сборке с фоновым обновлением"
      why: Верно. Это и определяет компромисс между свежестью данных, скоростью первого контента, SEO и стоимостью инфраструктуры.
    - label: "В том, работает ли React на клиенте: при SSR и SSG страница остаётся статичной и не выполняет JS"
      why: "Неверно. SSR- и SSG-страницы гидрируются: React на клиенте навешивает обработчики и делает их интерактивными."
    - label: ISR — это SSR, где ответ кешируется в браузере пользователя на заданное время
      why: Неверно. ISR перегенерирует статическую страницу на сервере в фоне (по таймеру или событию) и раздаёт её всем, а не кеширует у одного пользователя.
    - label: SSG подходит только для страниц без данных, а любые данные из API требуют SSR
      why: Неверно. SSG загружает данные при сборке и встраивает их в HTML. Проблема лишь в том, что до пересборки они устаревают.
  answer: 0

- id: rendering-strategies-catalog-choice
  skill: rendering-strategy-choice
  question: rendering-strategies
  difficulty: 2
  prompt: "Каталог интернет-магазина: 50 000 страниц товаров, важны SEO и скорость. Цены меняются пару раз в день, админка может отправить вебхук при изменении товара. Какую стратегию выбрать?"
  explanation: "Правило: данные меняются редко, а SEO важен — статика. Если страниц много и обновлять их нужно без полной пересборки, подойдёт ISR с on-demand ревалидацией. SSR нужен, когда данные персональные или меняются почти на каждый запрос. CSR — когда SEO не важен."
  type: choose-tool
  options:
    - label: ISR с ревалидацией по вебхуку
      why: Страницы отдаются как статика с CDN, а изменённый товар перегенерируется точечно по событию. Так получается скорость SSG и достаточная свежесть.
    - label: SSG с пересборкой при каждом изменении
      why: Хорошо для небольших сайтов с редкими правками. При 50 000 страниц каждая правка цены запускает долгую полную сборку.
    - label: SSR на каждый запрос
      why: Подходит для персональных или очень часто меняющихся данных. Здесь каждый запрос нагружает сервер и БД, а TTFB зависит от скорости данных.
    - label: CSR-приложение на Vite
      why: "Разумно для внутренних приложений за логином. Для каталога плохо: пустой HTML до загрузки JS вредит SEO и времени до первого контента."
  answer: 0

- id: rendering-strategies-localstorage-mismatch
  skill: hydration-mismatch
  question: rendering-strategies
  difficulty: 3
  prompt: Компонент рендерится через SSR. У пользователя с сохранённой тёмной темой в консоли появляется ошибка гидрации. Найдите причину.
  explanation: На сервере window нет, поэтому рендерится 'light'. При гидрации на клиенте initializer возвращает 'dark', и первый клиентский рендер не совпадает с HTML. Первый рендер должен совпадать с серверным. Читайте localStorage в useEffect, через useSyncExternalStore с getServerSnapshot или передавайте тему через cookie.
  type: find-bug
  language: tsx
  code: |-
    'use client';
    import { useState } from 'react';

    export function ThemeToggle() {
      const [theme, setTheme] = useState(() =>
        typeof window !== 'undefined'
          ? localStorage.getItem('theme') ?? 'light'
          : 'light'
      );
      const next = theme === 'dark' ? 'light' : 'dark';
      return (
        <button onClick={() => setTheme(next)}>{theme}</button>
      );
    }
  bugLines:
    - 6
    - 7
  causes:
    - "Начальное состояние на сервере и на клиенте разное: первый клиентский рендер не совпадает с серверным HTML"
    - localStorage вызовет ReferenceError на сервере, потому что компонент обращается к нему при рендере
    - Ленивый инициализатор useState нельзя использовать в компонентах с 'use client'
    - Компоненты с 'use client' не рендерятся на сервере, поэтому HTML для них пустой
  answer: 0

# исправлено ревьюером:
# Шаг 6 связывает интерактивность с выполнением эффектов. Страница становится интерактивной, когда гидрация навесила обработчики, а эффекты лишь запускаются после коммита. Это закрепляет заблуждение и противоречит explanation.
- id: rendering-strategies-ssr-hydration-timeline
  skill: hydration-lifecycle
  question: rendering-strategies
  difficulty: 2
  prompt: Расставьте по порядку, что происходит при открытии SSR-страницы.
  explanation: "При SSR контент виден раньше, чем загрузится JS. Интерактивным он становится только после гидрации: React строит дерево, сверяет его с готовой разметкой и навешивает обработчики. Эффекты запускаются уже после коммита гидрации. Разрыв между «увидел» и «смог кликнуть» зависит от размера бандла и стоимости гидрации."
  type: order
  kind: timeline
  steps:
    - Сервер получает запрос и загружает данные
    - Сервер рендерит компоненты в HTML и отправляет ответ
    - "Браузер отображает HTML: контент виден, но не интерактивен"
    - Загружается и выполняется JS-бандл
    - "React гидрирует: строит дерево, сверяет с разметкой, навешивает обработчики — страница становится интерактивной"
    - После коммита гидрации запускаются эффекты (useEffect) компонентов
