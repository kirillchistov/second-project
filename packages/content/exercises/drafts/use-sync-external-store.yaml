# Черновик упражнений: «Что такое useSyncExternalStore и проблема tearing?» (use-sync-external-store)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only use-sync-external-store

- id: use-sync-external-store-tearing-quiz
  skill: external-store-tearing
  question: use-sync-external-store
  difficulty: 3
  prompt: Что такое tearing и как useSyncExternalStore его предотвращает?
  explanation: "Tearing возможен только при конкурентном рендеринге: рендер прерывается, а внешний стор тем временем меняется. useSyncExternalStore сверяет снимок перед commit и при расхождении рендерит синхронно. Цена согласованности в том, что обновления внешних сторов не могут быть неблокирующими transition."
  type: quiz
  options:
    - label: Компоненты в одном прерванном рендере читают разные версии внешнего стора; хук сверяет снимок и при изменении рендерит синхронно
      why: Верно. React сравнивает getSnapshot до и после прерывания. Если стор изменился, он перерендеривает дерево синхронно, и UI показывает одну версию данных.
    - label: Мерцание, когда DOM обновился раньше paint; хук работает как useLayoutEffect и подписывается до отрисовки
      why: Это путаница с layout-эффектами. Tearing — это рассогласование данных между компонентами в одном рендере, а не мерцание кадра.
    - label: Утечка подписки после размонтирования; хук сам вызывает отписку, которую забывают в useEffect
      why: Отписку хук действительно вызывает, но это побочный бонус. Tearing не связан с утечками, он про разные версии данных в одном рендере.
    - label: Блокировка ввода частыми обновлениями стора; хук переводит их в transition, чтобы рендер прерывался
      why: "Всё наоборот: обновления внешних сторов нельзя сделать transition. Если стор меняется во время transition, React откатывается к синхронному рендеру."
  answer: 0

# вычитка: вариант про bind заменён — без кода createStore он мог оказаться верным
- id: use-sync-external-store-unstable-snapshot
  skill: external-store-snapshot-stability
  question: use-sync-external-store
  difficulty: 2
  prompt: После монтирования ActiveList React зацикливается на рендерах. Найдите строку с ошибкой.
  explanation: "React сравнивает снимки через Object.is. `filter` при каждом вызове создаёт новый массив, поэтому React считает, что стор изменился, и рендерит снова и снова (предупреждение «The result of getSnapshot should be cached»). Правило: getSnapshot возвращает данные стора как есть, а производные значения считаются в useMemo или в селекторе с кэшем по ссылке."
  type: find-bug
  language: tsx
  code: |-
    const todoStore = createStore<Todo[]>([]);

    function useActiveTodos() {
      return useSyncExternalStore(
        todoStore.subscribe,
        () => todoStore.get().filter((t) => !t.done),
      );
    }

    function ActiveList() {
      const todos = useActiveTodos();
      return <List items={todos} />;
    }
  bugLines:
    - 6
  causes:
    - "getSnapshot каждый раз возвращает новый массив: Object.is видит «изменение», и рендеры зацикливаются"
    - "Не передан getServerSnapshot: без третьего аргумента хук падает и на клиенте"
    - useSyncExternalStore нельзя вызывать из кастомного хука — только прямо в компоненте
    - subscribe пересоздаётся на каждом рендере, поэтому React переподписывается бесконечно
  answer: 0

- id: use-sync-external-store-window-width
  skill: external-store-subscribe
  question: use-sync-external-store
  difficulty: 2
  prompt: Допишите хук, который подписывается на ширину окна без tearing и корректно работает при SSR.
  explanation: subscribe объявлен вне компонента, поэтому ссылка на него стабильна и React не переподписывается на каждом рендере. Функция обязана вернуть отписку. `innerWidth` — примитив, так что снимок стабилен сам по себе. Третий аргумент — значение для сервера и гидрации, где window нет.
  type: fill-tokens
  language: tsx
  code: |-
    function subscribe(cb: () => void) {
      window.addEventListener('resize', cb);
      return () => window.___('resize', cb);
    }

    function useWindowWidth() {
      return ___(
        ___,
        () => window.innerWidth,
        () => 1024,
      );
    }
  tokens:
    - removeEventListener
    - useSyncExternalStore
    - subscribe
  decoys:
    - useEffect
    - dispatchEvent
    - useState
    - cb

- id: use-sync-external-store-price-feed
  skill: external-store-integration-choice
  question: use-sync-external-store
  difficulty: 3
  prompt: Класс PriceFeed вне React держит котировки из WebSocket и шлёт событие при изменении. Цену показывают несколько компонентов, в приложении есть startTransition и SSR. Все компоненты должны показывать одну версию данных. Что выбрать?
  explanation: Внешний мутабельный источник плюс конкурентный рендеринг — это задача для useSyncExternalStore. Нужны стабильный subscribe и снимок, который меняет ссылку только при изменении данных. Так устроены Redux и Zustand. Самодельные подписки через эффекты не дают React способа проверить согласованность.
  type: choose-tool
  options:
    - label: "useSyncExternalStore: subscribe к событиям PriceFeed, getSnapshot отдаёт неизменяемый снимок"
      why: Лучший вариант. React сверяет снимок и при изменении во время рендера перерисовывает синхронно, поэтому tearing невозможен. getServerSnapshot закрывает SSR.
    - label: "useEffect + useState в каждом компоненте: подписаться и класть цену в state"
      why: Возможен tearing, и можно пропустить событие между рендером и подпиской. Первый кадр показывает устаревшее значение. Годится разве что для редких некритичных данных.
    - label: Положить экземпляр PriceFeed в React Context
      why: Context передаёт ссылку на объект, а мутации внутри него ререндер не вызывают. Подходит для внедрения зависимости, но не для подписки на изменения.
    - label: Хранить цену в useRef и вызывать forceUpdate через useReducer на событие
      why: Чтение мутабельного ref в рендере даёт тот же tearing, и SSR не поддерживается. Это хак времён до появления официального API.
  answer: 0
