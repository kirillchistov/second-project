# Черновик упражнений: «Как системно улучшать производительность React-приложения?» (performance-methodology)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only performance-methodology

- id: performance-methodology-first-step
  skill: perf-measure-first
  question: performance-methodology
  difficulty: 2
  prompt: Пользователи жалуются, что дашборд «тормозит». С чего системно начать работу над производительностью?
  explanation: "Главное правило: сначала измерить, потом оптимизировать. Нужны метрика, условия воспроизведения (production, throttling) и профиль. Только он покажет категорию проблемы: бандл, рендеры, тяжёлые вычисления, списки, сеть. Под эту категорию и выбирается инструмент."
  type: quiz
  options:
    - label: Выбрать метрику (INP, LCP), по RUM понять, где и у кого медленно, воспроизвести на production-сборке с CPU throttling и профилировать
      why: Верно. Без метрики и профиля непонятно, что чинить и помог ли фикс. Полевые данные показывают реальную проблему, а throttling воспроизводит её на слабом устройстве.
    - label: Обернуть тяжёлые компоненты в memo и useCallback, затем проверить, стало ли быстрее на ощупь
      why: Это оптимизация на глаз. Лишние рендеры — лишь одна категория проблем и часто не главная. Бандл или водопад запросов мемоизация не исправит.
    - label: Открыть React Profiler в dev-режиме на своём мощном ноутбуке и ускорить самые долгие компоненты
      why: Dev-режим со StrictMode и отладочными проверками искажает картину. Мощная машина может вообще не воспроизвести проблему пользователей.
    - label: "Включить React Compiler: автоматическая мемоизация закрывает основные проблемы производительности"
      why: Компилятор убирает лишние рендеры. Размер бандла, длинные списки, сеть и тяжёлые вычисления от этого не меняются.
  answer: 0

- id: performance-methodology-heavy-chart-lib
  skill: perf-bundle-splitting
  question: performance-methodology
  difficulty: 2
  prompt: "rollup-plugin-visualizer показал: библиотека графиков на 300 КБ попадает в главный чанк, хотя графики есть только на странице отчётов. LCP и TTI на главной плохие. Что сделать?"
  explanation: Сначала определите категорию проблемы. «Большой бандл» лечится разделением кода, удалением лишнего и заменой тяжёлых библиотек. Инструменты против рендеров и вычислений не уменьшают объём JS, который нужно скачать и распарсить.
  type: choose-tool
  options:
    - label: "Code splitting: страница отчётов через React.lazy и динамический import()"
      why: Верно. Библиотека уйдёт в отдельный чанк и загрузится только при переходе на отчёты, а главный бандл станет легче.
    - label: React.memo для компонентов графиков
      why: memo сокращает повторные рендеры при тех же props. На размер бандла он не влияет и нужен, когда профайлер показывает лишние рендеры.
    - label: useTransition при переходе на страницу отчётов
      why: Делает тяжёлое обновление прерываемым, и интерфейс остаётся отзывчивым. Код при этом остаётся в главном чанке.
    - label: Перенести расчёт данных для графиков в Web Worker
      why: Полезно, когда долгие вычисления блокируют main thread. Скачивать и парсить библиотеку всё равно придётся на главной.
  answer: 0

- id: performance-methodology-lcp-hero-image
  skill: perf-lcp-media
  question: performance-methodology
  difficulty: 2
  prompt: По RUM и Lighthouse LCP-элемент — hero-картинка. Она есть в HTML с сервера и уже в AVIF нужного размера, но в waterfall стартует поздно, после скриптов. Что поможет?
  explanation: 'Проблема LCP с картинкой — это поздний старт загрузки, а не JS. Браузеру нужно сообщить, что ресурс критичен: fetchpriority="high", при необходимости preload. lazy подходит только для картинок ниже первого экрана.'
  type: choose-tool
  options:
    - label: Добавить картинке fetchpriority="high" и убедиться, что на ней нет loading="lazy"
      why: Верно. Браузер поднимет приоритет загрузки LCP-ресурса, и картинка начнёт грузиться раньше остальных ресурсов.
    - label: Добавить loading="lazy", чтобы картинка не мешала загрузке скриптов
      why: "Ухудшит LCP: загрузка картинки в первом экране отложится. lazy нужен для изображений ниже первого экрана."
    - label: Разбить JS-бандл через React.lazy
      why: Полезно, если узкое место — объём JS. Здесь картинка уже в серверном HTML, и мешает её низкий приоритет, а не код.
    - label: "Включить content-visibility: auto для блока с картинкой"
      why: Экономит рендеринг длинного контента за пределами экрана. Hero находится в первом экране, и на приоритет загрузки это не влияет.
  answer: 0

- id: performance-methodology-rum-web-vitals
  skill: perf-rum-web-vitals
  question: performance-methodology
  difficulty: 3
  prompt: "Допишите сбор полевых метрик: нужна разбивка причин плохого INP, а отправка не должна теряться при закрытии вкладки."
  explanation: "Сборка web-vitals/attribution добавляет в метрику поле attribution. Для INP это целевой элемент и фазы задержки: input delay, processing, presentation. По ним видно, что чинить. sendBeacon надёжно доставляет данные при уходе со страницы, а INP часто репортится именно тогда."
  type: fill-tokens
  language: ts
  code: |-
    import { onINP, onLCP } from 'web-vitals/___';
    import type { Metric } from 'web-vitals';

    function send(metric: Metric) {
      const body = JSON.stringify(metric);
      navigator.___('/rum', body);
    }

    onINP(send);
    onLCP(send);
  tokens:
    - attribution
    - sendBeacon
  decoys:
    - debug
    - fetch
    - postMessage
