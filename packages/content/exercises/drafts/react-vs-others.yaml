# Черновик упражнений: «Чем React отличается от Angular, Vue, Svelte и Solid?» (react-vs-others)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only react-vs-others

- id: react-vs-others-update-model
  skill: framework-update-models
  question: react-vs-others
  difficulty: 2
  prompt: В чём главное архитектурное отличие React от Svelte и Solid?
  explanation: "Ключевое различие — гранулярность обновлений. React на уровне компонента: перерендер и reconciliation. Svelte и Solid на уровне узла: сигналы и компиляция без VDOM. Разница в скорости реальна, но в типичных приложениях архитектура влияет сильнее."
  type: quiz
  options:
    - label: React при смене состояния заново вызывает компонент и сравнивает деревья, а Svelte/Solid обновляют только DOM-узлы, подписанные на сигнал
      why: Верно. В Solid функция компонента выполняется один раз, затем сигнал обновляет конкретный узел. В React перерендер и reconciliation — базовая модель.
    - label: React использует Virtual DOM, поэтому он всегда заметно медленнее сигнальных фреймворков
      why: "Типичное заблуждение. В обычных приложениях разница меньше, чем от архитектурных решений: размещения состояния, разбиения на компоненты, работы с данными."
    - label: React компилирует компоненты на этапе сборки, а Svelte и Solid интерпретируют шаблоны в рантайме
      why: Наоборот. Компиляция — основа Svelte и Solid. React Compiler лишь автоматически добавляет мемоизацию, а модель перерендера остаётся прежней.
    - label: В Svelte и Solid нет компонентов, есть только шаблоны с реактивными переменными
      why: Компоненты есть везде. Отличается не наличие компонентов, а то, что происходит при изменении данных.
  answer: 0

- id: react-vs-others-rerender-child
  skill: react-rerender-model
  question: react-vs-others
  difficulty: 2
  prompt: StrictMode и React Compiler не используются. Компонент смонтировали и один раз нажали кнопку. Что будет в консоли?
  explanation: "В React setState перезапускает Parent, а вместе с ним и всех его детей, даже без props. Затем reconciliation выясняет, что DOM Child не изменился. В Solid аналог выведет только «Parent 0» и «Child»: функции выполняются один раз, сигнал обновит лишь текст кнопки."
  type: predict-output
  language: tsx
  code: |-
    function Child() {
      console.log('Child');
      return <p>static</p>;
    }

    function Parent() {
      const [n, setN] = useState(0);
      console.log('Parent', n);
      return (<>
        <button onClick={() => setN(n + 1)}>{n}</button>
        <Child />
      </>);
    }
  options:
    - Parent 0 → Child → Parent 1 → Child
    - Parent 0 → Child → Parent 1
    - Parent 0 → Child
    - Parent 0 → Child → Child
  answer: 0

# исправлено ревьюером:
# Пояснения (why) у вариантов Angular и SvelteKit длиннее 140 символов — сокращены.
- id: react-vs-others-web-plus-mobile
  skill: framework-choice
  question: react-vs-others
  difficulty: 2
  prompt: "Новый продукт: веб-кабинет, нативные приложения iOS/Android с общей логикой, SEO для публичных страниц. Команду будут быстро расширять. Что выбрать?"
  explanation: "Выбирают под контекст, а не по принципу «какой лучше». Здесь решают жёсткие требования: нативный мобильный клиент с общей логикой, SSR и рынок найма. Всё это лучше всего закрывает связка React + Next.js + React Native."
  type: choose-tool
  options:
    - label: React + Next.js для веба и React Native для мобильных
      why: Общие знания, хуки и часть логики между вебом и мобильными, SSR/RSC для SEO, крупнейший рынок специалистов для быстрого найма.
    - label: Angular
      why: Хорош для энтерпрайза со строгими конвенциями и «всё в коробке», но столь же зрелой нативной мобильной связки нет.
    - label: Vue + Nuxt
      why: Отличный SSR и мягкий порог входа, уместен для чистого веба. Мобильная история и рынок найма слабее, чем у React.
    - label: SvelteKit
      why: Хорош для лёгких сайтов с минимальным бандлом, но экосистема меньше и аналога React Native нет.
  answer: 0

