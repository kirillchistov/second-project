# Порядок не бесспорен: оценку команды и отсечение по жёстким требованиям можно переставить местами — оба шага зависят только от сбора требований.
# Переформулированы шаги так, чтобы каждый явно опирался на результат предыдущего.
- id: react-vs-others-stack-selection
  skill: tech-stack-selection
  question: react-vs-others
  difficulty: 3
  prompt: Соберите алгоритм выбора фронтенд-фреймворка для нового проекта.
  explanation: Сначала требования, по ним отсекаются неподходящие кандидаты. Оставшихся сравнивают по команде и рынку, финалистов проверяют прототипом с замерами. Решение фиксируют вместе с компромиссами. Аргумент «сигналы быстрее» без прототипа на реальном сценарии ничего не доказывает.
  type: order
  kind: recipe
  steps:
    - "Собрать требования: SEO/SSR, мобильные платформы, нагрузку UI, срок поддержки"
    - Отсечь кандидатов, не закрывающих жёсткие требования (например, нативный мобильный клиент)
    - Сравнить оставшихся по опыту команды и доступности специалистов, выбрать 1–2 финалистов
    - Сделать прототип критичного сценария на финалистах и замерить метрики
    - Зафиксировать решение и принятые компромиссы в ADR
