# Черновик упражнений: «Какие продвинутые паттерны компонентов вы знаете?» (component-patterns)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only component-patterns

- id: component-patterns-inversion-of-control
  skill: component-patterns-purpose
  question: component-patterns
  difficulty: 3
  prompt: Какую общую задачу решают compound components, control props, state reducer и headless hooks?
  explanation: "Все эти паттерны дают потребителю контроль над разметкой, состоянием или переходами, но не раздувают API пропсами-флагами. Правило выбора: разметка — compound или headless, значение — control props, логика переходов — state reducer."
  type: quiz
  options:
    - label: "Инверсия управления: потребитель получает контроль над разметкой, состоянием или переходами без новых флагов в props"
      why: Верно. Вместо `closeOnSelect`, `renderItem`, `hideIcon` и других флагов компонент отдаёт наружу нужную точку контроля, а свою логику оставляет в одном месте.
    - label: "Оптимизация производительности: меньше лишних ререндеров за счёт контекста и мемоизации"
      why: Это не их цель. Compound components на контексте могут даже добавить ререндеры потребителей. Производительность здесь — побочная тема.
    - label: Замена глобального стейт-менеджера для состояния UI-компонентов
      why: "Паттерны работают на уровне одного компонента: состояние табов или меню живёт внутри него. Глобальный store они не заменяют и не должны."
    - label: "Совместимость с SSR: логика уходит в хуки, и компонент рендерится на сервере без гидрации"
      why: SSR и гидрация тут ни при чём. Headless-хук тоже выполняется при гидрации, просто разметку пишет потребитель.
  answer: 0

- id: component-patterns-dropdown-custom-transitions
  skill: state-reducer-pattern
  question: component-patterns
  difficulty: 3
  prompt: Dropdown из дизайн-системы используется в 40 местах. В одном месте меню не должно закрываться при выборе пункта, в другом Escape должен только сбрасывать поиск. Флаги на каждый случай добавлять не хочется. Что выбрать?
  explanation: "Если просят «а можно, чтобы при X не происходило Y», нужно менять переходы состояния. State reducer отдаёт потребителю функцию `(state, action) => changes`: он правит только нужные переходы, остальное работает по умолчанию. Так сделано в Downshift."
  type: choose-tool
  options:
    - label: "State reducer: проп `stateReducer(state, action)`, который может переопределить изменения"
      why: Лучший выбор. Потребитель перехватывает конкретный action (выбор пункта, Escape) и меняет результат, а остальная логика компонента остаётся нетронутой.
    - label: "Control props: сделать `isOpen` контролируемым через `isOpen` и `onOpenChange`"
      why: Подходит, когда снаружи нужно просто открыть или закрыть меню. Для правки переходов каждому потребителю пришлось бы повторять логику клавиатуры и выбора.
    - label: "Headless hook: переписать Dropdown на `useDropdown` с prop getters"
      why: "Хорош, когда в каждом месте сильно разная разметка. Здесь проблема в поведении, а не в разметке: хук без state reducer не решит задачу, а миграция дорогая."
    - label: "Compound components: разбить на `<Dropdown.Trigger>` и `<Dropdown.Item>`"
      why: Даёт гибкость разметки и состава частей. Логика закрытия по-прежнему зашита внутри, так что просьбы о поведении не закрыты.
  answer: 0

- id: component-patterns-controllable-falsy-value
  skill: controlled-uncontrolled-props
  question: component-patterns
  difficulty: 2
  prompt: Родитель передаёт `value={0}` или `value=""`, но компонент игнорирует внешнее значение и живёт своим состоянием. Найдите ошибку.
  explanation: "Режим определяется по проверке на `undefined`, а не по истинности: `0`, `''` и `false` — валидные контролируемые значения. Режим вычисляется на каждом рендере. Если он сменится за время жизни компонента, стоит предупредить в dev, как это делает React для input."
  type: find-bug
  language: tsx
  code: |-
    function useControllableState<T>(
      controlled: T | undefined,
      defaultValue: T,
      onChange?: (v: T) => void,
    ) {
      const [inner, setInner] = useState(defaultValue);
      const isControlled = Boolean(controlled);
      const value = isControlled ? controlled! : inner;
      const setValue = (next: T) => {
        if (!isControlled) setInner(next);
        onChange?.(next);
      };
      return [value, setValue] as const;
    }
  bugLines:
    - 7
  causes:
    - "Проверка на истинность: при `0`, `''` или `false` компонент считает себя неконтролируемым — нужно `controlled !== undefined`"
    - В контролируемом режиме нужно тоже вызывать `setInner`, иначе значение не обновится
    - "`onChange` нужно вызывать только в неконтролируемом режиме, иначе родитель получит лишний вызов"
    - "`setValue` должен быть обёрнут в `useCallback`, иначе значение сбрасывается на каждом рендере"
  answer: 0

- id: component-patterns-compound-context
  skill: compound-components
  question: component-patterns
  difficulty: 2
  prompt: "Допишите основу compound components: `Tabs` делится состоянием с частями через контекст, а `useTabs` падает с понятной ошибкой вне `<Tabs>` (React 19)."
  explanation: Части compound-компонента получают неявное состояние из контекста. Default `null` и guard-хук превращают «Tab вне Tabs» в понятную ошибку вместо `undefined`. В React 19 сам контекст рендерится как провайдер, а `use` читает его, в том числе условно.
  type: fill-tokens
  language: tsx
  code: |-
    const TabsContext = createContext<TabsCtx | ___>(null);

    function Tabs({ children }: { children: ReactNode }) {
      const [value, setValue] = useState('a');
      const ctx = { value, setValue };
      return <TabsContext ___={ctx}>{children}</TabsContext>;
    }

    function useTabs() {
      const ctx = ___(TabsContext);
      if (!ctx) throw new Error('Tab outside <Tabs>');
      return ctx;
    }
  tokens:
    - "null"
    - value
    - use
  decoys:
    - undefined
    - Provider
    - useRef
    - children
