# Черновик упражнений: «Как работают useTransition и startTransition?» (use-transition)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only use-transition

- id: use-transition-core-idea
  skill: transition-semantics
  question: use-transition
  difficulty: 2
  prompt: Что на самом деле делает startTransition с обновлением состояния?
  explanation: "Transition — про приоритет, а не про скорость. Колбэк вызывается сразу, а получившийся рендер становится несрочным: его можно прервать ради ввода. Пока он не готов, на экране остаётся старый UI, а `isPending` позволяет показать индикатор."
  type: quiz
  options:
    - label: "Помечает обновление несрочным: рендер прерываемый, ввод идёт первым, а видимый контент не заменяется Suspense-fallback"
      why: Верно. Срочные обновления прерывают фоновый рендер. Уже показанный UI остаётся на экране до готовности нового, без отката к спиннеру.
    - label: Откладывает вызов колбэка до простоя браузера, как requestIdleCallback
      why: Колбэк выполняется сразу и синхронно. Откладывается не вызов функции, а рендер, вызванный setState внутри неё.
    - label: Ускоряет тяжёлый рендер, распределяя работу по нескольким потокам
      why: "Рендер идёт в том же потоке и быстрее не становится. Он становится неблокирующим: React уступает место срочной работе."
    - label: "Дебаунсит обновления: через паузу применяется только последнее из серии"
      why: Таймера и фиксированной задержки нет. React начинает рендер сразу и бросает устаревший, только если пришло новое обновление.
  answer: 0

- id: use-transition-controlled-input
  skill: transition-urgent-input
  question: use-transition
  difficulty: 2
  prompt: Фильтрация большого списка тормозила ввод, и её обернули в transition. Теперь инпут ведёт себя странно. Где ошибка?
  explanation: "Значение текстового инпута должно обновляться срочно. Правильно разделить состояние: `query` для инпута меняется обычным setState, а второе состояние для фильтра обновляется в transition. Другой вариант — передать в фильтр `useDeferredValue(query)`."
  type: find-bug
  language: tsx
  code: |-
    function Search({ items }: Props) {
      const [query, setQuery] = useState('');
      const [, startTransition] = useTransition();
      function onChange(e: ChangeEvent<HTMLInputElement>) {
        startTransition(() => setQuery(e.target.value));
      }
      const visible = filterHeavy(items, query);
      return (
        <>
          <input value={query} onChange={onChange} />
          <List items={visible} />
        </>
      );
    }
  bugLines:
    - 5
  causes:
    - "Состояние контролируемого инпута обновляется в transition: ввод стал несрочным и прерываемым, хотя должен применяться сразу"
    - e.target читается внутри колбэка, когда событие уже очищено React
    - Из useTransition нельзя брать только startTransition, пропуская isPending
    - filterHeavy нужно вызывать в useEffect, иначе transition не сработает
  answer: 0

- id: use-transition-async-action
  skill: async-transition-actions
  question: use-transition
  difficulty: 3
  prompt: "Допишите Action: кнопка блокируется на время запроса, а обновления после ответа остаются частью transition."
  explanation: В React 19 startTransition принимает async-функцию, и `isPending` держится до её завершения. Обновления состояния после `await` пока не попадают в transition автоматически, поэтому их снова оборачивают в `startTransition`.
  type: fill-tokens
  language: tsx
  code: |-
    function NameForm({ name }: { name: string }) {
      const [error, setError] = useState<string | null>(null);
      const [isPending, startTransition] = ___();
      function submit() {
        startTransition(___ () => {
          const err = await updateName(name);
          ___(() => {
            if (err) setError(err);
            else navigate('/profile');
          });
        });
      }
      return <button onClick={submit} disabled={___}>Save</button>;
    }
  tokens:
    - useTransition
    - async
    - startTransition
    - isPending
  decoys:
    - useDeferredValue
    - useActionState
    - setTimeout
    - await

- id: use-transition-vs-deferred-value
  skill: deferred-value-for-heavy-render
  question: use-transition
  difficulty: 2
  prompt: Компонент Results получает query пропсом от родителя из сторонней библиотеки и рендерит 5000 строк. Ввод тормозит, доступа к сеттеру query нет. Что выбрать?
  explanation: useTransition оборачивает место, где вызывается setState. useDeferredValue работает со значением, когда сеттер недоступен. Оба дают прерываемый фоновый рендер без фиксированной задержки, в отличие от debounce.
  type: choose-tool
  options:
    - label: useDeferredValue(query) + memo для списка
      why: "Лучший вариант: сеттера нет, есть только значение. Список рендерится с отложенной копией query, а этот рендер прерывается новым вводом."
    - label: useTransition вокруг setQuery
      why: Подошёл бы, если бы setQuery был в вашем коде. Здесь обновление создаёт чужой родитель, обернуть его нельзя.
    - label: Debounce query на 300 мс
      why: Уместен, чтобы реже слать запросы на сервер. Для рендера он даёт фиксированную задержку, а когда срабатывает, рендер всё равно блокирует поток.
    - label: Только React.memo для Results
      why: memo помогает, если пропсы не меняются. Здесь query меняется на каждый символ, и тяжёлый рендер остаётся синхронным.
  answer: 0
