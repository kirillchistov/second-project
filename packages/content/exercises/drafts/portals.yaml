# Черновик упражнений: «Что такое порталы и как в них работают события?» (portals)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only portals

- id: portals-events-context-quiz
  skill: portal-event-bubbling
  question: portals
  difficulty: 2
  prompt: Модалка рендерится через `createPortal(..., document.body)` внутри `<Page>`. Как внутри неё работают события и контекст?
  explanation: "Портал меняет только место в DOM, а в React-дереве компонент остаётся там, где написан в JSX. Поэтому контекст, всплытие синтетических событий и порядок рендера идут по React-дереву. Отсюда типичные сюрпризы: клик в модалке доходит до onClick родителя, а проверка «клик снаружи» через DOM ошибается."
  type: quiz
  options:
    - label: "Оба работают по React-дереву: события всплывают до родителей в JSX, контекст провайдеров выше доступен"
      why: Верно. Портал меняет только DOM-узел-контейнер, а в React-дереве позиция компонента сохраняется.
    - label: "События всплывают по DOM: до body и document, поэтому onClick родительского компонента не сработает"
      why: Так ведут себя нативные addEventListener. Синтетические события React всплывают по дереву компонентов, поэтому onClick родителя сработает.
    - label: "Контекст теряется: портал — отдельный корень, провайдеры нужно оборачивать заново"
      why: Так ведёт себя отдельный createRoot. Портал остаётся частью того же дерева, и тема, роутер и стор доступны без настройки.
    - label: "Контекст доступен, но портал изолирует события: из него они никуда не всплывают"
      why: "Изоляции нет: событие из портала всплывает к React-предкам. Остановить всплытие можно только явно, через e.stopPropagation()."
  answer: 0

- id: portals-click-bubbles-to-parent
  skill: portal-event-bubbling
  question: portals
  difficulty: 2
  prompt: Кнопка рендерится порталом в document.body. По ней кликнули один раз. Что будет в консоли?
  explanation: Сначала срабатывает обработчик кнопки, затем событие всплывает по React-дереву к div-родителю, хотя в DOM кнопка лежит в body, а не внутри этого div. Если такое всплытие не нужно, вызовите e.stopPropagation() в портале.
  type: predict-output
  language: tsx
  code: |-
    function App() {
      return (
        <div onClick={() => console.log('parent')}>
          {createPortal(
            <button onClick={() => console.log('button')}>
              Open
            </button>,
            document.body,
          )}
        </div>
      );
    }
  options:
    - button → parent
    - button
    - parent → button
    - "Ничего: кнопка вне div в DOM"
  answer: 0

- id: portals-click-outside-nested
  skill: portal-click-outside
  question: portals
  difficulty: 3
  prompt: Внутри модалки есть Select, который рендерит выпадающий список своим порталом в body. Клик по пункту списка закрывает модалку. Найдите строку с ошибкой.
  explanation: "Список Select в DOM лежит в body, а не внутри ref, поэтому `contains()` считает клик внешним. Для вложенных порталов опирайтесь на React-дерево: например, onMouseDownCapture на корне модалки ставит флаг «клик внутри», а он всплывёт и из вложенного портала. Другой путь — headless-библиотека, где это уже решено."
  type: find-bug
  language: tsx
  code: |-
    function Modal({ onClose, children }: Props) {
      const ref = useRef<HTMLDivElement>(null);
      useEffect(() => {
        const onDown = (e: MouseEvent) => {
          const t = e.target as Node;
          if (!ref.current?.contains(t)) onClose();
        };
        document.addEventListener('mousedown', onDown);
        return () =>
          document.removeEventListener('mousedown', onDown);
      }, [onClose]);
      const box = <div ref={ref}>{children}</div>;
      return createPortal(box, document.body);
    }
  bugLines:
    - 6
  causes:
    - "Проверка по DOM через contains() не видит вложенный портал: его узлы лежат в body вне ref, хотя в React-дереве они внутри модалки"
    - Нужно слушать click, а не mousedown, — иначе событие приходит раньше, чем выбирается пункт
    - onClose в зависимостях пересоздаёт подписку, и на время рендера модалка «теряет» обработчик
    - e.target нельзя приводить к Node — у MouseEvent там всегда HTMLElement, и contains() возвращает false
  answer: 0

- id: portals-accessible-confirm-dialog
  skill: accessible-modal-choice
  question: portals
  difficulty: 2
  prompt: "Нужна простая модалка подтверждения без новых зависимостей. Требования: окно поверх любых overflow и z-index, фокус не уходит на страницу, закрытие по Escape. Что выбрать?"
  explanation: Нативный `<dialog>` с `showModal()` выводит окно в top layer, делает остальную страницу inert и обрабатывает Escape. Это закрывает большую часть требований к доступности без кода. Портал решает только проблему вёрстки, а фокус и клавиатуру с ним придётся делать самому.
  type: choose-tool
  options:
    - label: Нативный <dialog> и showModal()
      why: "Лучший выбор здесь: top layer без порталов и z-index, страница становится inert, Escape и aria-modal-семантика есть из коробки."
    - label: createPortal в body и div с role="dialog"
      why: Решает обрезку и перекрытие, но focus trap, Escape и возврат фокуса придётся писать вручную. Оправдан, если нужна полная кастомизация.
    - label: Radix Dialog или React Aria
      why: Отличный вариант для дизайн-системы и сложных сценариев вроде вложенных слоёв. Но по условию новые зависимости не нужны.
    - label: "position: fixed и z-index: 9999 прямо в компоненте"
      why: Не спасает от stacking context и transform у предков и не решает фокус и Escape. Годится разве что для прототипа.
  answer: 0
