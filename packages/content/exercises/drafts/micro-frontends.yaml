# Черновик упражнений: «Когда оправданы микрофронтенды и как их реализовать?» (micro-frontends)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only micro-frontends

- id: micro-frontends-when-justified
  skill: micro-frontends-tradeoffs
  question: micro-frontends
  difficulty: 3
  prompt: Когда переход на микрофронтенды действительно оправдан?
  explanation: "Микрофронтенды решают организационную проблему: много команд, которым мешают общий релизный цикл и общий код. Платите вы инфраструктурой, дублированием зависимостей, согласованием версий и UX. Если команд одна-две, модульный монолит почти всегда дешевле и быстрее."
  type: quiz
  options:
    - label: Когда много команд владеют разными частями продукта и им нужны независимые релизы
      why: "Верно. Главная ценность — автономия команд: каждая деплоит свою часть в своём ритме и не блокирует остальных."
    - label: Когда приложение стало медленным и его нужно ускорить за счёт разбиения
      why: "Микрофронтенды обычно ухудшают производительность: лишние загрузки, дубли зависимостей. Ускорение даёт code splitting внутри монолита."
    - label: Когда небольшой команде нужно упростить разросшуюся кодовую базу
      why: Для одной-двух команд это лишняя инфраструктурная сложность. Порядок в коде наводит модульный монолит с чёткими границами модулей.
    - label: Когда хочется писать разные части на разных фреймворках
      why: Это возможно (например, через Web Components), но не цель. Зоопарк фреймворков бьёт по размеру бандла и единству UX.
  answer: 0

- id: micro-frontends-integration-choice
  skill: micro-frontends-integration
  question: micro-frontends
  difficulty: 3
  prompt: Маркетплейс, 6 команд на React. Команда checkout хочет деплоить корзину независимо, а переход каталог → корзина должен быть без перезагрузки страницы и с общим React. Как интегрировать?
  explanation: Выбор зависит от условий. Нужны независимый деплой и SPA-переходы с общими зависимостями — Module Federation. Если перезагрузка допустима — маршрутизация по путям. Если деплой можно связать с хостом — npm-пакеты. Нужна полная изоляция — iframe.
  type: choose-tool
  options:
    - label: Module Federation с react и react-dom как shared singleton
      why: "Лучший вариант: remote загружается в рантайме и деплоится отдельно, React на странице один, переходы остаются внутри SPA."
    - label: Публиковать checkout как npm-пакет и собирать вместе с хостом
      why: Самый простой путь, но каждый релиз checkout требует пересборки и деплоя хоста. Подойдёт, когда независимый деплой не нужен.
    - label: "Разные приложения на разных путях: /catalog и /checkout"
      why: Даёт максимальную изоляцию, но каждый переход — полная перезагрузка страницы. Хорошо, когда разделы слабо связаны.
    - label: Встроить checkout через iframe
      why: Полная изоляция стилей и JS, но общение идёт через postMessage, а с a11y, высотой и навигацией много проблем. Уместно для сторонних виджетов.
  answer: 0

- id: micro-frontends-duplicate-react
  skill: module-federation-shared-deps
  question: micro-frontends
  difficulty: 3
  prompt: Хост и checkout написаны на React 19. После подключения remote появилась ошибка «Invalid hook call», а контекст темы хоста внутри checkout не виден. Где ошибка в конфиге хоста?
  explanation: "react и react-dom не объявлены в shared, поэтому remote подтягивает собственный экземпляр React. Хуки из checkout обращаются к «чужому» React, и контекст между экземплярами не передаётся. Правило: react и react-dom объявляются shared с singleton: true и у хоста, и у remote, а версии согласуются."
  type: find-bug
  language: ts
  code: |-
    federation({
      name: 'host',
      remotes: {
        checkout:
          'https://checkout.example.com/remoteEntry.js',
      },
      shared: {
        'date-fns': {},
      },
    });
  bugLines:
    - 7
    - 8
  causes:
    - react и react-dom не объявлены shared singleton — remote загружает свой экземпляр React
    - remoteEntry.js должен лежать на том же домене, что и хост
    - date-fns нельзя делать общей зависимостью — это и ломает хуки
    - name хоста должен совпадать с ключом checkout в remotes
  answer: 0

# исправлено ревьюером:
# Закрывающие теги </Suspense> и </ErrorBoundary> остались в коде и выдают ответы для обоих JSX-пропусков. Задание сводится к копированию имён. Закрывающие теги тоже нужно сделать пропусками.
- id: micro-frontends-remote-fallback
  skill: micro-frontends-resilience
  question: micro-frontends
  difficulty: 2
  prompt: "Допишите слот для удалённого модуля: пока он грузится, показывается спиннер, а если remote недоступен — заглушка вместо белого экрана."
  explanation: "Удалённый модуль может не загрузиться: его деплоят отдельно, он может лежать или отдавать ошибку. lazy делает импорт асинхронным. Suspense показывает спиннер на время загрузки. ErrorBoundary (например, из react-error-boundary) снаружи ловит ошибку импорта и рендерит fallback. Падение remote не должно ронять хост."
  type: fill-tokens
  language: tsx
  code: |-
    const Checkout = ___(() => import('checkout/App'));

    export function CheckoutSlot() {
      return (
        <___ fallback={<CheckoutUnavailable />}>
          <___ fallback={<Spinner />}>
            <Checkout />
          </___>
        </___>
      );
    }
  tokens:
    - lazy
    - ErrorBoundary
    - Suspense
    - Suspense
    - ErrorBoundary
  decoys:
    - Activity
    - StrictMode
    - memo
    - use
