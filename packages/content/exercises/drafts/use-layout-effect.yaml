# Черновик упражнений: «Чем useLayoutEffect отличается от useEffect?» (use-layout-effect)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only use-layout-effect

- id: use-layout-effect-vs-use-effect
  skill: layout-effect-timing
  question: use-layout-effect
  difficulty: 2
  prompt: Чем useLayoutEffect отличается от useEffect и когда его стоит выбирать?
  explanation: "Порядок: render → commit (DOM обновлён) → useLayoutEffect → paint → useEffect. Layout-эффект блокирует кадр, поэтому по умолчанию берите useEffect. useLayoutEffect нужен, только если измерение DOM и правка позиции иначе дают видимое мерцание."
  type: quiz
  options:
    - label: useLayoutEffect выполняется синхронно после обновления DOM, но до отрисовки кадра. Он нужен для измерений без мерцания
      why: Верно. Браузер не нарисует кадр, пока layout-эффект не завершится, поэтому поправленная позиция попадёт уже в первый кадр.
    - label: useLayoutEffect выполняется до обновления DOM, поэтому в нём можно подготовить разметку заранее
      why: Неверно. Когда запускается layout-эффект, DOM уже обновлён, иначе в нём нечего было бы измерять. До мутаций DOM работает только useInsertionEffect.
    - label: useLayoutEffect — более быстрая версия useEffect, в него выгодно переносить загрузку данных
      why: Это заблуждение. Запрос от этого не ускорится, а синхронная работа в эффекте задержит отрисовку кадра.
    - label: "Разница только в SSR: useLayoutEffect работает на сервере, а useEffect — только в браузере"
      why: "Наоборот: на сервере не выполняется ни один из них. Раньше useLayoutEffect при SSR выдавал предупреждение именно потому, что на сервере он не запускается."
  answer: 0

- id: use-layout-effect-mount-order
  skill: effect-execution-order
  question: use-layout-effect
  difficulty: 2
  prompt: App монтируется впервые, StrictMode нет. Что будет в консоли?
  explanation: "Сначала выполняется render. Затем после commit React запускает layout-эффекты всего дерева: сначала дочерние, потом родительские. Только после этого идут обычные эффекты, в том же порядке от детей к родителю. Порядок вызова хуков внутри компонента не меняет того, что все layout-эффекты выполняются раньше всех useEffect."
  type: predict-output
  language: tsx
  code: |-
    function Child() {
      useEffect(() => console.log('child effect'));
      useLayoutEffect(() => console.log('child layout'));
      return null;
    }

    function App() {
      useEffect(() => console.log('app effect'));
      useLayoutEffect(() => console.log('app layout'));
      console.log('app render');
      return <Child />;
    }
  options:
    - app render → child layout → app layout → child effect → app effect
    - app render → app layout → child layout → app effect → child effect
    - app render → child effect → child layout → app effect → app layout
    - app render → child layout → child effect → app layout → app effect
  answer: 0

# исправлено ревьюером:
# В style нет position: 'absolute' (или relative/fixed), поэтому свойство top на статическом div ни на что не влияет. Описанное мерцание в таком коде не воспроизводится. Добавлено position: 'absolute', как в примере из ответа; нумерация строк не меняется.
- id: use-layout-effect-tooltip-flicker
  skill: layout-effect-measure-dom
  question: use-layout-effect
  difficulty: 2
  prompt: Тултип при появлении на мгновение мелькает в неправильном месте, а потом «прыгает» на нужное. Найдите причину.
  explanation: "useEffect обычно выполняется после paint. Поэтому первый кадр рисуется с top = 0, а после setTop тултип перерисовывается уже на новом месте. Если нужно измерить DOM и сразу поправить позицию, используйте useLayoutEffect: тогда исправленная позиция попадёт в тот же кадр."
  type: find-bug
  language: tsx
  code: |-
    function Tooltip({ anchor, children }: Props) {
      const ref = useRef<HTMLDivElement>(null);
      const [top, setTop] = useState(0);

      useEffect(() => {
        const h = ref.current!.offsetHeight;
        setTop(anchor.top - h);
      }, [anchor.top]);

      return <div ref={ref} style={{ position: 'absolute', top }}>{children}</div>;
    }
  bugLines:
    - 5
  causes:
    - "Измерение выполняется в useEffect, то есть после отрисовки: первый кадр показывает top = 0, а затем позиция меняется"
    - В useEffect ref.current ещё не привязан к DOM, поэтому offsetHeight равен 0
    - setTop внутри эффекта вызывает бесконечный цикл рендеров
    - В зависимостях не хватает ref, поэтому эффект не видит актуальный элемент
  answer: 0

- id: use-layout-effect-not-for-side-work
  skill: effect-hook-choice
  question: use-layout-effect
  difficulty: 2
  prompt: При открытии экрана нужно отправить событие аналитики и подписаться на resize окна. На вёрстку это не влияет. Коллега предлагает useLayoutEffect, «чтобы сработало раньше». Что выбрать?
  explanation: По умолчанию берите useEffect. useLayoutEffect нужен только для измерений DOM, без которых в кадре видно мерцание. useInsertionEffect предназначен для CSS-in-JS библиотек. Побочные эффекты в теле рендера ломают чистоту компонента.
  type: choose-tool
  options:
    - label: useEffect
      why: "Лучший выбор: работа не связана с вёрсткой, поэтому её можно выполнить после отрисовки, не блокируя кадр. Cleanup снимет подписку на resize."
    - label: useLayoutEffect
      why: Подошёл бы, если бы нужно было измерить DOM и поправить его до отрисовки. Здесь он лишь задержит кадр, а аналитика от этого не станет полезнее.
    - label: useInsertionEffect
      why: Нужен авторам CSS-in-JS библиотек, чтобы вставлять стили до layout-эффектов. Для подписок и аналитики он не предназначен, и ref в нём ещё недоступны.
    - label: Вызвать прямо в теле компонента
      why: "Рендер должен быть чистым: он может выполниться несколько раз или быть прерван. Тогда событие отправится повторно, а подписки начнут утекать."
  answer: 0
