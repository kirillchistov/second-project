# Черновик упражнений: «Что такое Actions в React 19: useActionState и useFormStatus?» (actions)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only actions

- id: actions-vs-onsubmit-quiz
  skill: react-actions-concept
  question: actions
  difficulty: 2
  prompt: Чем Action в React 19 (`<form action={fn}>`, `useActionState`) отличается от ручного onSubmit с fetch?
  explanation: "Action — это async-функция, запущенная в transition. Поэтому React сам отслеживает pending, пробрасывает ошибки в Error Boundary, ставит отправки в очередь и после успеха сбрасывает неконтролируемые поля. Правило: всё, что раньше писали через isLoading и try/finally, теперь даёт сам React."
  type: quiz
  options:
    - label: "Action — async-функция в transition: React сам ведёт pending, ошибки, очередь отправок и сбрасывает неконтролируемые поля"
      why: Верно. Transition даёт pending-состояние и обработку ошибок через Error Boundary, а последовательные вызовы выполняются по порядку без гонок.
    - label: "Это сахар над onSubmit: React вызывает preventDefault и передаёт FormData, а pending и ошибки по-прежнему ведутся вручную"
      why: FormData и отмена перезагрузки — лишь часть. Главное в том, что функция запускается в transition, и состояние ожидания React ведёт сам.
    - label: Actions работают только с серверными функциями 'use server', для клиентской логики нужен onSubmit
      why: В action можно передать и обычную клиентскую async-функцию. Серверные функции добавляют прогрессивное улучшение, но не обязательны.
    - label: useActionState делает поля контролируемыми и сохраняет введённые значения после отправки
      why: Это типичный подводный камень. Поля остаются неконтролируемыми и сбрасываются после action, а нужные значения надо вернуть в state.
  answer: 0

- id: actions-form-status-same-component
  skill: use-form-status-scope
  question: actions
  difficulty: 2
  prompt: Кнопка никогда не блокируется во время отправки. Найдите строку с ошибкой.
  explanation: "`useFormStatus` возвращает статус ближайшей **родительской** `<form>`. Здесь форму рендерит тот же компонент, поэтому родительской формы нет и pending всегда false. Исправить можно двумя способами: вынести кнопку в дочерний SubmitButton или взять isPending третьим элементом из useActionState."
  type: find-bug
  language: tsx
  code: |-
    function NameForm() {
      const [state, formAction] = useActionState(
        updateName, { error: null }
      );
      const { pending } = useFormStatus();
      return (
        <form action={formAction}>
          <input name="name" />
          <button disabled={pending}>Save</button>
          {state.error && <p>{state.error}</p>}
        </form>
      );
    }
  bugLines:
    - 5
  causes:
    - "useFormStatus вызван в компоненте, который сам рендерит form: родительской формы нет, и pending всегда false"
    - useActionState нужно вызывать внутри дочернего компонента формы, иначе action не запустится
    - В action формы нельзя передавать функцию из useActionState, только исходную async-функцию
    - У кнопки нет type="submit", поэтому форма не отправляется и pending не меняется
  answer: 0

- id: actions-use-action-state-wiring
  skill: use-action-state-api
  question: actions
  difficulty: 2
  prompt: "Допишите форму: action читает поле из FormData, а форма получает результат и флаг ожидания через хук."
  explanation: "Функция для useActionState получает (prevState, formData) и возвращает новый state. Хук отдаёт кортеж [state, formAction, isPending], а formAction передаётся в проп `action` у form. useFormStatus не подходит: он нужен в потомке формы и не хранит результат."
  type: fill-tokens
  language: tsx
  code: |-
    async function addTodo(prev: State, data: FormData) {
      const title = String(data.___('title'));
      return api.addTodo(title);
    }
    function TodoForm() {
      const [state, formAction, isPending] =
        ___(addTodo, { error: null });
      return (
        <form ___={formAction}>
          <input name="title" />
          <button disabled={isPending}>Add</button>
        </form>
      );
    }
  tokens:
    - get
    - useActionState
    - action
  decoys:
    - value
    - useFormStatus
    - onSubmit
    - useTransition

- id: actions-progressive-form-choice
  skill: form-actions-choice
  question: actions
  difficulty: 3
  prompt: Next.js App Router, форма отзыва. Она должна отправляться ещё до загрузки JS, а ошибку серверной валидации нужно показать под полем. Клиентской валидации почти нет. Что выбрать?
  explanation: "Если важны прогрессивное улучшение и результат с сервера, берите серверную функцию с useActionState: форма работает как обычный HTML-POST, а state приносит ошибку. Для тяжёлой клиентской валидации лучше React Hook Form, а useFormStatus лишь дополняет этот выбор и показывает pending в кнопке."
  type: choose-tool
  options:
    - label: Серверная функция ('use server') + useActionState
      why: "Лучший выбор: <form action> работает до гидрации, state возвращает ошибку валидации, isPending даётся из коробки. Можно передать permalink."
    - label: onSubmit + useState + fetch к API-роуту
      why: Подойдёт, если нужен полный ручной контроль. Но без JS форма не работает, а pending, ошибки и гонки придётся вести самому.
    - label: React Hook Form
      why: Хорош при сложной клиентской валидации и зависимых полях. Но он требует JS, поэтому прогрессивного улучшения не даст.
    - label: Только useFormStatus в кнопке отправки
      why: Даёт лишь pending родительской формы в потомке. Результата действия и ошибок сервера у него нет, это дополнение к useActionState.
  answer: 0
