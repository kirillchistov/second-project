# Черновик упражнений: «Когда хранить состояние в URL?» (url-state)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only url-state

- id: url-state-what-to-store
  skill: url-state-choice
  question: url-state
  difficulty: 2
  prompt: Какое состояние экрана стоит хранить в URL?
  explanation: "Критерий простой: захочет ли пользователь поделиться этим состоянием или вернуться к нему через «Назад» или перезагрузку. Тогда это URL, и он же единственный источник истины. Временные UI-флаги, секреты и большие объёмы данных в адрес не кладут."
  type: quiz
  options:
    - label: "То, чем пользователь захочет поделиться или к чему вернуться: фильтры, сортировка, поиск, страница, открытая вкладка"
      why: Верно. Ссылка воспроизводит экран, работают «Назад/Вперёд», состояние переживает перезагрузку, и его не нужно дублировать в сторе.
    - label: Всё состояние страницы, чтобы ничего не терялось при перезагрузке
      why: Hover, открытый тултип или черновик модалки только засорят адрес и историю. Большие объёмы упрутся в длину URL. Для сохранения при перезагрузке есть localStorage.
    - label: Только параметры, которые уходят на сервер в запросе, а UI-состояние вроде вкладки — в глобальный стор
      why: Открытая вкладка или выбранный элемент тоже часть «экрана, которым делятся». Критерий — шаринг и навигация, а не то, уходит ли параметр на сервер.
    - label: Данные пользователя и токен, чтобы по ссылке сразу открывался тот же экран
      why: Секреты и персональные данные в URL утекают в историю браузера, логи серверов и Referer. Их в адрес не кладут никогда.
  answer: 0

- id: url-state-duplicated-source
  skill: url-state-single-source
  question: url-state
  difficulty: 2
  prompt: На странице поиска есть ссылки «Популярные запросы» (<Link to="?q=laptop">). После клика URL меняется, а поле поиска и результаты остаются старыми. Найдите строку с причиной.
  explanation: "Строка поиска хранится дважды: в URL и в useState. Начальное значение useState читается только на первом рендере, поэтому навигация, которая не размонтирует компонент, его не обновит. Правило: читайте значение прямо из params на каждом рендере, а меняйте только через setParams."
  type: find-bug
  language: tsx
  code: |-
    function Search() {
      const [params, setParams] = useSearchParams();
      const [q, setQ] = useState(params.get('q') ?? '');
      const { data } = useQuery({
        queryKey: ['products', q],
        queryFn: () => fetchProducts(q),
      });

      function onChange(value: string) {
        setQ(value);
        setParams({ q: value }, { replace: true });
      }
      return <SearchView q={q} items={data} onChange={onChange} />;
    }
  bugLines:
    - 3
  causes:
    - "q копируется из URL в useState: два источника истины, и при навигации без размонтирования локальное состояние не обновляется"
    - "replace: true не даёт React Router обновить search params при клике по Link"
    - queryKey должен содержать весь объект params, иначе запрос не перезапустится
    - setParams нужно вызывать с функцией (prev) => ..., иначе обновление теряется
  answer: 0

- id: url-state-update-filter
  skill: url-state-search-params
  question: url-state
  difficulty: 2
  prompt: Допишите обновление фильтра. Остальные параметры должны сохраниться, пагинация сбрасывается, а история браузера не засоряется.
  explanation: "Копия prev через new URLSearchParams сохраняет остальные параметры. Удаление page возвращает на первую страницу, ведь старый номер для нового фильтра бессмыслен. replace: true заменяет текущую запись истории вместо добавления новой. Это важно для частых изменений вроде ввода в поиск."
  type: fill-tokens
  language: tsx
  code: |-
    const [params, setParams] = useSearchParams();
    const sort = params.___('sort') ?? 'popular';

    function update(key: string, value: string) {
      setParams((prev) => {
        const next = new ___(prev);
        next.set(key, value);
        next.___('page');
        return next;
      }, { ___: true });
    }
  tokens:
    - get
    - URLSearchParams
    - delete
    - replace
  decoys:
    - getAll
    - URL
    - remove
    - push

- id: url-state-catalog-filters
  skill: url-state-choice
  question: url-state
  difficulty: 1
  prompt: "Каталог товаров: категория, сортировка и номер страницы. Менеджеры пересылают друг другу ссылки на подборки, а «Назад» должна возвращать предыдущий фильтр. Где хранить это состояние?"
  explanation: Шаринг ссылкой и «Назад/Вперёд» — главные признаки URL-состояния. Параметры нужно валидировать как пользовательский ввод (Zod, nuqs, типизированные search в TanStack Router). Затем их можно положить в queryKey, чтобы кэш запросов следовал за адресом.
  type: choose-tool
  options:
    - label: Search params в URL
      why: "Лучший выбор: ссылка воспроизводит подборку, история браузера работает сама, состояние переживает перезагрузку, а значения естественно ложатся в queryKey."
    - label: Zustand-стор
      why: Подходит для клиентского состояния, которое нужно многим компонентам, но не шарится ссылкой. Здесь пришлось бы вручную синхронизировать стор с URL и историей.
    - label: useState в компоненте каталога
      why: Хватит для временного локального состояния вроде открытого дропдауна. Фильтры потеряются при перезагрузке, ими нельзя поделиться, «Назад» их не вернёт.
    - label: localStorage
      why: Уместен для персональных настроек «запомнить между сессиями» (тема, плотность таблицы). Он не передаётся ссылкой и не связан с историей навигации.
  answer: 0
