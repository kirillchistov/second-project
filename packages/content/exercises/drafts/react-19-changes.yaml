- id: react-19-migration-recipe
  skill: react-19-migration
  question: react-19-changes
  difficulty: 2
  prompt: Расставьте шаги миграции проекта с React 18 на React 19 по порядку.
  explanation: "React 18.3 — тот же 18, но с предупреждениями обо всех API, удалённых в 19: так видно объём работы до обновления. После перехода на 19 codemods берут на себя механическую часть (ReactDOM.render, строковые refs, типы), остальное правят вручную. Последним шагом новые типы ловят, например, ref-колбэки с неявным return."
  type: order
  kind: recipe
  steps:
    - Обновиться до React 18.3 и собрать предупреждения об устаревших API
    - Обновить react, react-dom и @types/react до 19
    - "Запустить codemods (react/19/migration-recipe, types-react-codemod) и вручную устранить оставшееся: legacy context, defaultProps у функций, строковые refs"
    - Исправить ошибки TypeScript (например, ref-колбэки с неявным return) и прогнать тесты
