# Черновик упражнений: «Зачем нужен TanStack Query и чем серверное состояние отличается от клиентского?» (tanstack-query)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only tanstack-query

- id: tanstack-query-server-vs-client-state
  skill: server-state-choice
  question: tanstack-query
  difficulty: 2
  prompt: Чем серверное состояние отличается от клиентского и зачем для него отдельный инструмент вроде TanStack Query?
  explanation: Серверное состояние — асинхронная копия чужих данных, которая устаревает. Нужны кэш по ключу, дедупликация, фоновое обновление, повторы и инвалидация после мутаций. Когда эти данные уходят в TanStack Query, глобального клиентского состояния обычно остаётся мало.
  type: quiz
  options:
    - label: "Серверное — копия чужих данных: асинхронна, может устареть, нужна многим. Ей нужны кэш, дедупликация, фоновое обновление"
      why: Верно. Отсюда и набор задач — кэш по ключу, stale-while-revalidate, повторы, инвалидация. Писать это руками в useEffect долго и с багами.
    - label: Серверное состояние — то, что хранится глобально, а клиентское — локально в компоненте
      why: "Глобальность ни при чём: тема или открытый сайдбар могут быть глобальными, но остаются клиентскими. Важно, кому принадлежат данные и могут ли они устареть."
    - label: TanStack Query — это глобальный стор вроде Redux, просто с меньшим количеством бойлерплейта
      why: Это не стор для произвольного стейта, а кэш асинхронных данных. Класть туда состояние модалки или текста в поле — не по назначению.
    - label: "Разницы нет: TanStack Query нужен только для того, чтобы не писать isLoading и error вручную"
      why: Флаги загрузки — мелочь. Главное — общий кэш, дедупликация, отмена, обновление при фокусе и восстановлении сети, инвалидация после мутаций.
  answer: 0

- id: tanstack-query-key-missing-param
  skill: query-keys
  question: tanstack-query
  difficulty: 2
  prompt: При переключении страницы список не меняется, а на разных страницах иногда видны одни и те же задачи. Найдите ошибку.
  explanation: "Ключ — адрес записи в кэше и сигнал для перезапроса. Если page не входит в ключ, все страницы пишут в одну запись, а смена page не запускает новый запрос. Правило: в queryKey должны попадать все параметры, от которых зависит queryFn."
  type: find-bug
  language: tsx
  code: |-
    function useTodos(filter: Filter, page: number) {
      return useQuery({
        queryKey: ['todos', filter],
        queryFn: ({ signal }) =>
          api.getTodos(filter, page, { signal }),
        staleTime: 30_000,
      });
    }
  bugLines:
    - 3
  causes:
    - queryKey не включает page — все страницы делят одну запись кэша, и смена page не вызывает перезапрос
    - staleTime в 30 секунд запрещает перезапрос при смене любых аргументов хука
    - signal нельзя передавать в api-функцию — запрос отменяется сразу после старта
    - queryFn должна быть объявлена через async, иначе useQuery не дождётся промиса
  answer: 0

- id: tanstack-query-mutation-invalidate
  skill: mutation-invalidation
  question: tanstack-query
  difficulty: 2
  prompt: Допишите мутацию так, чтобы после добавления задачи все списки задач (с любым фильтром) обновились.
  explanation: useQueryClient даёт доступ к кэшу, invalidateQueries помечает записи устаревшими и перезапрашивает активные. Ключ ['todos'] работает как префикс и задевает ['todos', filter] для всех фильтров. Не копируйте данные в useState — инвалидация до них не дотянется.
  type: fill-tokens
  language: tsx
  code: |-
    function useAddTodo() {
      const queryClient = ___();
      return useMutation({
        mutationFn: api.addTodo,
        onSuccess: () =>
          queryClient.___({
            queryKey: [___],
          }),
      });
    }
  tokens:
    - useQueryClient
    - invalidateQueries
    - "'todos'"
  decoys:
    - useQuery
    - setQueryData
    - "'addTodo'"
    - useMutation

- id: tanstack-query-rarely-changing-data
  skill: stale-time-vs-gc-time
  question: tanstack-query
  difficulty: 3
  prompt: Справочник стран меняется раз в месяц. Он уже в кэше TanStack Query, но при каждом монтировании селекта уходит новый запрос. Что настроить?
  explanation: "staleTime отвечает, сколько данные считаются свежими: пока они свежие, монтирование и фокус не вызывают перезапрос. gcTime — сколько неиспользуемая запись живёт в кэше до удаления. Перезапросы убирает именно staleTime."
  type: choose-tool
  options:
    - label: Увеличить staleTime (вплоть до Infinity) для этого запроса
      why: "Лучший выбор: пока данные свежие, новые подписчики берут их из кэша без запроса. По умолчанию staleTime = 0, поэтому каждый mount запускает фоновый refetch."
    - label: Увеличить gcTime до Infinity
      why: gcTime лишь продлевает жизнь неактивной записи в кэше. Данные останутся, но будут stale, и при монтировании запрос всё равно уйдёт. Полезно вместе со staleTime.
    - label: Отключить refetchOnWindowFocus
      why: Уберёт только перезапросы при возврате на вкладку. Перезапрос при монтировании останется — за него отвечает свежесть данных.
    - label: Один раз загрузить список и положить его в React Context
      why: "Дублирует кэш вручную: теряются дедупликация, повторы и инвалидация. Уместно для клиентских значений, а не для серверных данных."
  answer: 0
