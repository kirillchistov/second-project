# Черновик упражнений: «Как работать с real-time данными (WebSocket, SSE) в React?» (realtime)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only realtime

- id: realtime-architecture-quiz
  skill: realtime-architecture
  question: realtime
  difficulty: 2
  prompt: Как правильно организовать real-time данные (WebSocket, SSE) в React-приложении?
  explanation: "Соединение — внешняя система, поэтому оно живёт вне компонентов. Компоненты только подписываются и отписываются в cleanup. Входящие события обновляют кэш серверного состояния (`setQueryData` или инвалидация). Обязательная обвязка: backoff при переподключении, догрузка пропущенного, ограничение частоты обновлений UI."
  type: quiz
  options:
    - label: Одно соединение в модуле-клиенте или провайдере, компоненты подписываются в эффекте, события обновляют кэш серверного состояния
      why: Верно. Одно соединение на приложение, отписка в cleanup, единый источник правды в кэше (TanStack Query или внешний стор), а не разрозненные useState.
    - label: Открывать WebSocket в useEffect каждого компонента, которому нужны данные, — соединение живёт ровно столько, сколько компонент
      why: N компонентов дадут N соединений, дублирующиеся сообщения и лишнюю нагрузку на сервер. Компонент должен подписываться на общий клиент, а не владеть соединением.
    - label: Класть каждое сообщение в useState корневого компонента и раздавать данные вниз через Context
      why: При частых сообщениях каждое изменение перерисует всех потребителей контекста. К тому же данные разойдутся с кэшем запросов, который грузил начальный снимок.
    - label: "Хватит useQuery с refetchInterval: 1000 — частый polling и есть real-time, сокеты не нужны"
      why: Polling годится для редко меняющихся данных, где задержка допустима. Но это задержка до интервала и пустые запросы, а не push-обновления.
  answer: 0

- id: realtime-transport-sse
  skill: realtime-transport-choice
  question: realtime
  difficulty: 2
  prompt: Лента уведомлений и статусы CI-сборок. Данные идут только от сервера к клиенту, всё должно работать через корпоративные HTTP-прокси, а переподключение хочется без своего кода. Что выбрать?
  explanation: "SSE выбирают, когда поток однонаправленный (сервер → клиент). WebSocket нужен, когда клиент тоже часто шлёт сообщения: чат, игры, совместные курсоры. CRDT (Yjs, Automerge) работает поверх транспорта и нужен для слияния конкурентных правок. Polling подходит, когда допустима задержка."
  type: choose-tool
  options:
    - label: Server-Sent Events (EventSource)
      why: Однонаправленный поток по обычному HTTP. Браузер сам переподключается и передаёт Last-Event-ID, чтобы сервер дослал пропущенное.
    - label: WebSocket
      why: "Нужен для двустороннего обмена с низкой задержкой (чат, игры). Здесь он избыточен: переподключение и backoff придётся писать самому, а прокси иногда режут upgrade."
    - label: Yjs (CRDT) поверх WebSocket
      why: Решает слияние конкурентных правок при совместном редактировании документа. Для потока уведомлений конфликтов нет.
    - label: TanStack Query с refetchInterval
      why: Подходит, если задержка в десятки секунд не важна и событий мало. Для мгновенных уведомлений это лишние запросы и задержка до интервала.
  answer: 0

- id: realtime-connection-per-component
  skill: realtime-shared-connection
  question: realtime
  difficulty: 2
  prompt: OrderBadge рендерится в таблице на 200 строк. Найдите строку с архитектурной ошибкой.
  explanation: "Каждый экземпляр открывает собственное соединение: 200 бейджей — 200 WebSocket, и каждый получает весь поток заказов. Соединение должно быть одно — в модуле-клиенте. Компонент подписывается через `realtime.subscribe` и отписывается в cleanup, а данные лучше брать из общего кэша."
  type: find-bug
  language: tsx
  code: |-
    function OrderBadge({ id }: { id: string }) {
      const [order, setOrder] = useState<Order>();
      useEffect(() => {
        const ws = new WebSocket(ORDERS_URL);
        ws.onmessage = (e) => {
          const ev: OrderEvent = JSON.parse(e.data);
          if (ev.order.id === id) setOrder(ev.order);
        };
        return () => ws.close();
      }, [id]);
      return <span>{order?.status}</span>;
    }
  bugLines:
    - 4
  causes:
    - Каждый экземпляр компонента открывает своё соединение — вместо подписки на общий клиент получается 200 WebSocket
    - ws.close() в cleanup закрывает соединение до того, как придут сообщения
    - id в зависимостях эффекта вызывает бесконечный цикл переподключений
    - setState внутри onmessage запрещён, потому что вызывается вне рендера React
  answer: 0

# исправлено ревьюером:
# Порядок шагов 2 и 3 спорный: буферизацию логично включать до переподписки, иначе первые живые события могут прийти до буфера. Объединил переподписку и буферизацию в один шаг, счётчик попыток вынес отдельно.
- id: realtime-reconnect-resync-recipe
  skill: realtime-reconnect-resync
  question: realtime
  difficulty: 3
  prompt: Соберите алгоритм переподключения, при котором не теряются и не дублируются события.
  explanation: Буферизацию включают вместе с переподпиской, до догрузки. Иначе событие, пришедшее во время resync, потеряется или применится раньше снимка. Версия или id события решает и гонку «начальная загрузка vs события», и проблему дубликатов. Backoff с потолком не даёт тысячам клиентов одновременно атаковать упавший сервер.
  type: order
  kind: recipe
  steps:
    - На onclose запланировать переподключение с экспоненциальной задержкой и потолком
    - На onopen сбросить счётчик попыток
    - Включить буферизацию живых событий и переподписаться на каналы
    - Догрузить пропущенное с последнего полученного id или инвалидировать запросы и перезагрузить снимок
    - Применить буфер поверх, отбрасывая события с версией не новее уже применённой
