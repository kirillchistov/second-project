# Черновик упражнений: «Что такое Virtual DOM и reconciliation?» (virtual-dom)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only virtual-dom

- id: virtual-dom-purpose-quiz
  skill: virtual-dom-purpose
  question: virtual-dom
  difficulty: 1
  prompt: Зачем React нужны Virtual DOM и reconciliation, если ручная точечная работа с DOM может быть быстрее?
  explanation: "Главная ценность — декларативность: вы описываете UI для текущего состояния, а React сравнивает деревья эвристиками за O(n) и меняет только нужное. Помните: рендер ≠ обновление DOM. Если результат рендера не изменился, DOM не трогается."
  type: quiz
  options:
    - label: "Чтобы писать UI декларативно: вы описываете результат, а React сам вычисляет разницу и применяет достаточно эффективные изменения к DOM"
      why: "Верно. VDOM — компромисс: не самый быстрый путь, но он избавляет от ручной синхронизации DOM с состоянием и при этом остаётся достаточно быстрым."
    - label: Virtual DOM всегда быстрее прямой работы с DOM, потому что операции над JS-объектами дешевле
      why: Это миф. Сравнение деревьев — дополнительная работа поверх изменений DOM. Точечный ручной код может быть быстрее. Svelte и Solid обходятся без VDOM.
    - label: Reconciliation полностью сравнивает два дерева и гарантирует минимально возможный набор изменений DOM
      why: Полное сравнение стоит O(n³). React использует эвристики (тип элемента, key) и получает O(n), поэтому минимальный diff не гарантирован.
    - label: Virtual DOM — копия браузерного DOM, из которой React читает размеры элементов без reflow
      why: VDOM — это описание UI из React-элементов, а не копия DOM с layout. Размеры по-прежнему измеряют в реальном DOM, например в useLayoutEffect.
  answer: 0

- id: virtual-dom-wrapper-type-change
  skill: reconciliation-type-heuristic
  question: virtual-dom
  difficulty: 2
  prompt: Counter — кнопка с локальным useState(0), которая показывает своё значение. Пользователь трижды нажал на Counter (на нём 3), затем нажал toggle. Что покажет Counter?
  explanation: "Позиция Counter в дереве осталась прежней, но его родитель сменил тип с div на section. По эвристике элементы разных типов дают разные поддеревья: старое удаляется целиком вместе с состоянием Counter, новое монтируется с нуля."
  type: predict-output
  language: tsx
  code: |-
    function App() {
      const [fancy, setFancy] = useState(false);
      return (
        <>
          {fancy ? (
            <section><Counter /></section>
          ) : (
            <div><Counter /></div>
          )}
          <button onClick={() => setFancy(!fancy)}>
            toggle
          </button>
        </>
      );
    }
  options:
    - 0 — поддерево перемонтировано, состояние сброшено
    - 3 — Counter того же типа, состояние сохранилось
    - 3, но DOM-узел кнопки Counter создан заново
    - "Ошибка: у Counter в условном рендере нет key"
  answer: 0

- id: virtual-dom-reset-form-by-key
  skill: reset-state-with-key
  question: virtual-dom
  difficulty: 2
  prompt: EditProfile хранит поля формы в useState(user.name) и т.д. При выборе другого пользователя в списке форма показывает данные прошлого. Нужно полностью сбрасывать форму при смене пользователя. Что выбрать?
  explanation: "key — часть идентичности элемента при reconciliation. Если key изменился, React считает элемент другим: размонтирует старый экземпляр и монтирует новый с чистым состоянием. Это штатный способ сбросить всё поддерево без синхронизирующих эффектов."
  type: choose-tool
  options:
    - label: <EditProfile key={user.id} user={user} />
      why: "Лучший вариант: новый key — новый экземпляр компонента, всё состояние формы и дочерних компонентов сбрасывается автоматически."
    - label: useEffect по [user.id], который вызывает setName(user.name) и так для каждого поля
      why: Лишний рендер со старыми данными, легко забыть поле или состояние в детях. Эффект оправдан, если нужно синхронизироваться с внешней системой.
    - label: Хранить prevUserId в state и сбрасывать поля прямо во время рендера при его смене
      why: Документированный паттерн для сброса части состояния при смене props. Для полного сброса он громоздкий, key проще.
    - label: Поднять состояние формы в родителя или контекст
      why: Имеет смысл, если нужно хранить черновики по каждому пользователю. Сбросить состояние это не помогает, а перерисовок становится больше.
  answer: 0
