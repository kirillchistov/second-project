# Черновик упражнений: «Что такое фрагменты и зачем они нужны?» (fragments)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only fragments

- id: fragments-purpose-quiz
  skill: fragments-purpose
  question: fragments
  difficulty: 1
  prompt: Что такое фрагмент в React и зачем он нужен?
  explanation: Фрагмент группирует элементы только в дереве React, в DOM от него ничего не остаётся. Для групп внутри `<table>`, `<ul>`, `<dl>` и flex/grid-контейнеров это лучше лишнего `<div>`. Если нужен `key`, используйте `<Fragment key>`. Массив элементов тоже допустим, но каждому элементу нужен свой key, и выглядит это шумнее.
  type: quiz
  options:
    - label: Способ вернуть несколько элементов без лишнего DOM-узла, чтобы не ломать разметку таблиц, списков и flex/grid
      why: "Верно. Фрагмент существует только в дереве React: его дети попадают в DOM напрямую, как потомки родителя."
    - label: "Невидимая обёртка: React рендерит её как элемент с display: contents"
      why: "Неверно. Фрагмент не создаёт в DOM вообще ничего, ни элемента, ни стилей. display: contents — CSS-приём для настоящих элементов."
    - label: "Механизм оптимизации: дети фрагмента не перерисовываются, пока не изменятся их props"
      why: Неверно. Фрагмент не мемоизирует детей и не влияет на ре-рендеры. За это отвечают memo и React Compiler.
    - label: "`<>` и `<Fragment>` полностью эквивалентны, разница только в том, нужен ли импорт"
      why: Неверно. У `<>` нельзя указать key, поэтому в списках нужна полная форма `<Fragment key={...}>`.
  answer: 0

- id: fragments-short-syntax-in-map
  skill: fragment-keys
  question: fragments
  difficulty: 1
  prompt: React выводит в консоль предупреждение про key. Найдите строку с ошибкой.
  explanation: "Каждый элемент, который возвращает map, должен иметь key. Здесь этот элемент — фрагмент `<>`, а короткий синтаксис не принимает атрибуты. Нужно заменить его на `<Fragment key={item.id}>`: разметка останется без обёртки, а ключ появится."
  type: find-bug
  language: tsx
  code: |-
    function Glossary({ items }: Props) {
      return (
        <dl>
          {items.map((item) => (
            <>
              <dt>{item.term}</dt>
              <dd>{item.text}</dd>
            </>
          ))}
        </dl>
      );
    }
  bugLines:
    - 5
  causes:
    - Элемент списка — фрагмент `<>`, у которого нельзя указать key, поэтому элементы map остаются без ключей
    - Пары `<dt>`/`<dd>` нужно обернуть в `<div>`, иначе React не сможет их сопоставить
    - Из колбэка map нельзя возвращать фрагмент, только один DOM-элемент
    - Внутри `<dl>` React запрещает фрагменты и рендерит их как `<span>`
  answer: 0

- id: fragments-keyed-fragment-fill
  skill: fragment-keys
  question: fragments
  difficulty: 1
  prompt: Допишите код, чтобы пары dt/dd рендерились без обёртки и с корректным ключом.
  explanation: "Чтобы указать key, нужна полная форма `Fragment`, импортированная из react. Ключ берётся из данных (`item.id`), а не из индекса: он должен быть стабильным при сортировке и удалении."
  type: fill-tokens
  language: tsx
  code: |-
    import { ___ } from 'react';

    function Glossary({ items }: Props) {
      return (
        <dl>
          {items.map((item) => (
            <Fragment ___={___}>
              <dt>{item.term}</dt>
              <dd>{item.text}</dd>
            </Fragment>
          ))}
        </dl>
      );
    }
  tokens:
    - Fragment
    - key
    - item.id
  decoys:
    - Children
    - id
    - index
    - ref

- id: fragments-table-cells-choice
  skill: fragments-vs-wrapper
  question: fragments
  difficulty: 2
  prompt: "Компонент `<UserCells user={u} />` используется внутри `<tr>` и должен отрендерить три `<td>`: имя, email, роль. Списка здесь нет. Как вернуть ячейки?"
  explanation: "Правило: несколько элементов без обёртки — `<>`. Если группа — элемент списка, используйте `<Fragment key>`. Массив оставьте для случаев, когда элементы строятся программно. `<div>` подходит, только если обёртка действительно нужна разметке или стилям."
  type: choose-tool
  options:
    - label: Короткий фрагмент `<>...</>`
      why: "Лучший вариант: `<td>` станут прямыми потомками `<tr>`, разметка останется валидной. key не нужен, импорт тоже."
    - label: Обернуть ячейки в `<div>`
      why: "`<div>` внутри `<tr>` — невалидный HTML: браузер перестроит таблицу, а при SSR будет ошибка гидрации. Обёртка уместна, только когда её требует разметка или стили."
    - label: Вернуть массив `[<td key="name">…, …]`
      why: Работает, но каждому элементу нужен ручной key, а JSX превращается в шумный массив. Это оправдано, когда элементы генерируются программно.
    - label: '`<Fragment key="cells">...</Fragment>`'
      why: "Тоже сработает, но key здесь бесполезен: группа не является элементом списка. Полная форма нужна внутри map."
  answer: 0
