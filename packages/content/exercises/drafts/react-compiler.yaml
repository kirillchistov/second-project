# Черновик упражнений: «Что такое React Compiler и нужны ли теперь useMemo и useCallback?» (react-compiler)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only react-compiler

- id: react-compiler-manual-memo-quiz
  skill: react-compiler-memoization
  question: react-compiler
  difficulty: 3
  prompt: В проекте на React 19 включили React Compiler. Нужны ли теперь в новом коде useMemo, useCallback и memo?
  explanation: "Компилятор на этапе сборки кэширует значения, функции и JSX с точностью до отдельных выражений, даже в условных ветках. Поэтому ручная мемоизация в новом коде обычно лишняя. Она остаётся «ручкой» для точного контроля, например для стабильной зависимости эффекта. Сами вычисления компилятор не ускоряет: он только не повторяет их без нужды."
  type: quiz
  options:
    - label: "В большинстве случаев нет: компилятор сам мемоизирует. Ручные хуки остаются для точного контроля, например зависимостей эффектов"
      why: Верно. Компилятор кэширует по входам каждого выражения, а useMemo/useCallback пригодятся, когда стабильность значения нужно гарантировать явно.
    - label: "Нет, и пользоваться ими нельзя: с компилятором useMemo и useCallback устарели и выдают предупреждение"
      why: Хуки никуда не делись и совместимы с компилятором. Обычно они просто избыточны, но иногда нужны для явного контроля.
    - label: "Да: компилятор оборачивает в memo только компоненты, а значения и колбэки внутри по-прежнему мемоизируют вручную"
      why: "Наоборот: компилятор мемоизирует именно значения, функции и JSX внутри компонентов и хуков, вплоть до отдельных выражений."
    - label: "Нет: компилятор оптимизирует сами вычисления, и даже тяжёлые операции становятся дешёвыми"
      why: Компилятор лишь пропускает повторные вычисления при тех же входах. Медленный алгоритм при новых входах останется медленным.
  answer: 0

- id: react-compiler-props-mutation
  skill: rules-of-react-purity
  question: react-compiler
  difficulty: 2
  prompt: После включения React Compiler линтер сообщает о нарушении в этом компоненте. Найдите строку, нарушающую Rules of React.
  explanation: "`sort` сортирует массив на месте, то есть мутирует props во время рендера. Компилятор считает props иммутабельными: такой компонент он пропустит, а код, работавший благодаря мутации, после компиляции может вести себя иначе. Исправление — `items.toSorted(...)` или `[...items].sort(...)`."
  type: find-bug
  language: tsx
  code: |-
    function PriceList({ items, currency }: Props) {
      const sorted = items.sort((a, b) => a.price - b.price);
      const label = formatCurrency(currency);
      return (
        <ul>
          {sorted.map((i) => (
            <li key={i.id}>{i.price} {label}</li>
          ))}
        </ul>
      );
    }
  bugLines:
    - 2
  causes:
    - "`sort` мутирует массив из props во время рендера, а компилятор полагается на иммутабельность props"
    - formatCurrency вызывается без useMemo, и компилятор не сможет его закэшировать
    - Колбэк сортировки создаётся заново на каждом рендере, и его нужно обернуть в useCallback
    - "Нельзя использовать key={i.id}: компилятор требует ключи-индексы"
  answer: 0

- id: react-compiler-adoption-recipe
  skill: react-compiler-adoption
  question: react-compiler
  difficulty: 3
  prompt: Расставьте шаги внедрения React Compiler в большой существующий проект.
  explanation: Компилятор пропускает код, нарушающий Rules of React. Поэтому сначала нужен линтер с правилами компилятора, потом исправления, затем постепенное включение с проверкой поведения и профилем. Отдельный проблемный компонент можно временно исключить директивой `'use no memo'`.
  type: order
  kind: recipe
  steps:
    - Включить eslint-plugin-react-hooks с правилами компилятора
    - "Исправить нарушения Rules of React: мутации в рендере, нечистые компоненты"
    - "Включить компилятор частично: по директориям или через директиву 'use memo'"
    - Прогнать тесты и сравнить профили до и после
    - Расширить охват, проблемные компоненты временно пометить 'use no memo'

# исправлено ревьюером:
# В «why» для варианта с useMemo/memo неточность: memo на строках может давать попадания для неизменившихся элементов. Проблема в том, что при новом query тысячи строк всё равно рендерятся и монтируются, а не в том, что кэш всегда промахивается.
# Корявая формулировка в «why» правильного варианта («работу сокращает само уменьшение…»).
- id: react-compiler-slow-render-choice
  skill: react-compiler-limits
  question: react-compiler
  difficulty: 2
  prompt: "React Compiler включён, но поиск по таблице из 20 000 строк тормозит при вводе. Профайлер показывает: основное время уходит на рендер тысяч строк, а видно на экране около 30. Что выбрать?"
  explanation: Компилятор избегает повторной работы при тех же входах, но при новом query отфильтрованный список честно рендерится заново. Если узкое место — объём работы, его нужно уменьшить, а не мемоизировать. Виртуализация рендерит только видимые строки.
  type: choose-tool
  options:
    - label: Виртуализация списка (например, TanStack Virtual)
      why: "Лучший вариант: число рендеримых строк сокращается с тысяч до нескольких десятков видимых."
    - label: Обернуть фильтрацию в useMemo, а строки — в memo
      why: Компилятор уже мемоизирует это сам. При новом query список пересчитывается, и тысячи строк всё равно рендерятся и монтируются.
    - label: useDeferredValue для query
      why: Сохранит отзывчивость инпута, если рендер умеренно тяжёлый. Но тысячи строк всё равно отрендерятся — это хорошее дополнение к виртуализации.
    - label: Пометить таблицу директивой 'use no memo'
      why: Директива отключает компилятор для компонента. Это нужно, когда компиляция ломает поведение, но не ускорит рендер.
  answer: 0
