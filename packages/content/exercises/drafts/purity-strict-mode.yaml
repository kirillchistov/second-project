# Черновик упражнений: «Что значит «рендер должен быть чистым» и что делает StrictMode?» (purity-strict-mode)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only purity-strict-mode

- id: purity-render-meaning-quiz
  skill: render-purity
  question: purity-strict-mode
  difficulty: 1
  prompt: Что означает требование «рендер должен быть чистым»?
  explanation: Компонент — функция от props, state и контекста. React может вызвать рендер несколько раз, прервать его или выбросить результат, а React Compiler мемоизирует, полагаясь на чистоту. Эффекты — в обработчиках и useEffect. StrictMode в dev вызывает рендер дважды, чтобы выявить нарушения.
  type: quiz
  options:
    - label: При тех же props, state и контексте компонент возвращает тот же JSX и ничего не меняет снаружи во время рендера
      why: Верно. Результат зависит только от входов, а запросы, мутации внешних данных и работа с DOM происходят вне рендера.
    - label: Компонент не должен иметь своего state и хуков — только props, как у чистой функции
      why: State и контекст — такие же входы рендера, как props. Чистота не запрещает хуки, она запрещает побочные эффекты.
    - label: Во время рендера нельзя создавать и изменять никакие переменные и массивы
      why: "Локальные мутации допустимы: заполнить массив, созданный в этом же рендере, можно. Нельзя менять то, что существовало до рендера."
    - label: Побочные эффекты запрещены во всём компоненте, включая обработчики событий и useEffect
      why: "Наоборот: обработчики и эффекты — правильное место для запросов, подписок и записи в storage. Чистым должно быть только тело рендера."
  answer: 0

- id: purity-sort-mutates-props
  skill: render-purity
  question: purity-strict-mode
  difficulty: 2
  prompt: Родитель передаёт users и сам рендерит его в исходном порядке. После появления TopUsers порядок у родителя «сам» поменялся. Где ошибка?
  explanation: "Array.prototype.sort сортирует на месте: рендер мутирует массив из props, то есть чужие данные. Исправление — копия: users.toSorted(...) или [...users].sort(...). Правило: в рендере менять можно только то, что создано в этом же рендере."
  type: find-bug
  language: tsx
  code: |-
    function TopUsers({ users }: { users: User[] }) {
      const top = users.sort((a, b) => b.score - a.score);
      return (
        <ol>
          {top.slice(0, 3).map((u) => (
            <li key={u.id}>{u.name}</li>
          ))}
        </ol>
      );
    }
  bugLines:
    - 2
  causes:
    - sort сортирует массив на месте — рендер мутирует props, и порядок меняется у родителя
    - slice(0, 3) удаляет элементы из исходного массива
    - key={u.id} нужно заменить на индекс, иначе порядок собьётся
    - sort асинхронный, поэтому top на момент map ещё не отсортирован
  answer: 0

- id: purity-strict-mode-effect-double
  skill: strict-mode-double-invoke
  question: purity-strict-mode
  difficulty: 2
  prompt: Dev-сборка, компонент смонтировали один раз внутри StrictMode. Что будет в консоли, считая приглушённые логи?
  explanation: "В dev StrictMode вызывает функцию компонента дважды, а после коммита прогоняет лишний цикл эффекта: setup → cleanup → setup. Если без cleanup что-то ломается (двойное подключение), это баг, а не вина StrictMode. В production ничего не дублируется."
  type: predict-output
  language: tsx
  code: |-
    function Chat() {
      console.log('render');
      useEffect(() => {
        console.log('connect');
        return () => console.log('disconnect');
      }, []);
      return <p>Chat</p>;
    }

    root.render(
      <StrictMode><Chat /></StrictMode>
    );
  options:
    - render → render → connect → disconnect → connect
    - render → connect
    - render → connect → render → disconnect → connect
    - render → render → connect → connect
  answer: 0

- id: purity-move-storage-to-effect
  skill: render-side-effects
  question: purity-strict-mode
  difficulty: 1
  prompt: Запись в localStorage вынесли из тела рендера. Допишите, чтобы она выполнялась после коммита при каждой смене темы.
  explanation: "localStorage.setItem — побочный эффект, в рендере ему не место: рендер может повториться или быть отброшен. useEffect запускается после коммита, а зависимость theme перезапускает его только при смене темы. useMemo для эффектов не подходит — это кэш вычислений."
  type: fill-tokens
  language: tsx
  code: |-
    function ThemeToggle() {
      const [theme, setTheme] = useState('light');
      ___(() => {
        localStorage.setItem('theme', theme);
      }, [___]);
      const next = theme === 'light' ? 'dark' : 'light';
      return (
        <button onClick={() => setTheme(next)}>
          {theme}
        </button>
      );
    }
  tokens:
    - useEffect
    - theme
  decoys:
    - useMemo
    - setTheme
    - next
    - useState
