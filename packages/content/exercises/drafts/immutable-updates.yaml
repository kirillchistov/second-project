# Черновик упражнений: «Как правильно обновлять объекты и массивы в state?» (immutable-updates)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only immutable-updates

- id: immutable-updates-why-quiz
  skill: state-reference-equality
  question: immutable-updates
  difficulty: 1
  prompt: Почему объекты и массивы в state нужно обновлять иммутабельно, а не мутировать?
  explanation: "React не следит за содержимым объектов — он сравнивает ссылки. Новая ссылка означает «изменилось». Отсюда правило: каждый изменённый уровень — новый объект или массив, неизменённые ветки переиспользуются по ссылке."
  type: quiz
  options:
    - label: "React сравнивает старый и новый state через Object.is: мутированный объект — та же ссылка, и изменение не замечается"
      why: Верно. Сравнение по ссылке — дешёвое и надёжное. На нём же основаны memo, useMemo, зависимости эффектов и React Compiler, поэтому мутация ломает и их.
    - label: React глубоко сравнивает state, а мутация портит сохранённую копию, с которой идёт сравнение
      why: Глубокого сравнения нет — это было бы дорого. React не хранит копию state, а сравнивает только ссылки.
    - label: Мутировать можно, если после этого вызвать setState с тем же объектом — это сигнал перерендерить
      why: Типичное заблуждение. setState с той же ссылкой React воспринимает как «ничего не изменилось» и может пропустить обновление.
    - label: Мутация работает, но в StrictMode выдаёт предупреждение, поэтому её избегают из-за линтера
      why: "Проблема не в предупреждениях: мутация реально не вызывает ререндер, а двойной вызов функций в StrictMode может её ещё и повторить."
  answer: 0

- id: immutable-updates-sort-mutation
  skill: immutable-array-methods
  question: immutable-updates
  difficulty: 1
  prompt: По клику на Sort список не перерисовывается. Найдите строку с ошибкой.
  explanation: "sort() сортирует массив на месте и возвращает ту же ссылку. Object.is(old, new) === true — React пропускает обновление. Заодно мутируется initial из props. Решение: xs.toSorted(...) или [...xs].sort(...). То же с reverse, splice, push."
  type: find-bug
  language: tsx
  code: |-
    function PriceList({ initial }: Props) {
      const [items, setItems] = useState(initial);

      function sortByPrice() {
        setItems(items.sort((a, b) => a.price - b.price));
      }

      return (
        <>
          <button onClick={sortByPrice}>Sort</button>
          <List items={items} />
        </>
      );
    }
  bugLines:
    - 5
  causes:
    - sort() мутирует массив и возвращает ту же ссылку — React видит прежний state и не перерендеривает
    - Нужна функциональная форма setItems((xs) => ...), без неё обновление теряется
    - useState(initial) нельзя инициализировать значением из props
    - Компаратор должен возвращать boolean, а не число
  answer: 0

- id: immutable-updates-array-ops
  skill: immutable-array-methods
  question: immutable-updates
  difficulty: 1
  prompt: Допишите удаление, переключение и сортировку задач без мутации массива.
  explanation: Удалить — filter, изменить элемент — map с копией изменённого объекта, отсортировать — toSorted (ES2023). sort и splice мутируют исходный массив, forEach ничего не возвращает.
  type: fill-tokens
  language: tsx
  code: |-
    const remove = (id: string) =>
      setTodos((xs) => xs.___((x) => x.id !== id));

    const toggle = (id: string) =>
      setTodos((xs) =>
        xs.___((x) =>
          x.id === id ? { ...x, done: !x.done } : x,
        ),
      );

    const sortByTitle = () =>
      setTodos((xs) =>
        xs.___((a, b) => a.title.localeCompare(b.title)),
      );
  tokens:
    - filter
    - map
    - toSorted
  decoys:
    - splice
    - forEach
    - sort
    - toSpliced

- id: immutable-updates-deep-nested-config
  skill: nested-state-strategy
  question: immutable-updates
  difficulty: 2
  prompt: "Редактор конфигурации: объект с API глубиной 4–5 уровней, формат менять нельзя — его же отправляют обратно. Десяток обработчиков правят поля в глубине. Что выбрать?"
  explanation: "Ручной спред верен, но на глубине 4+ многословен и легко забыть уровень. Immer даёт «мутирующий» синтаксис и структурное разделение: новые ссылки только у изменённых веток. Если структуру можно менять — сначала подумайте о плоском state."
  type: choose-tool
  options:
    - label: "Immer: useImmer или produce"
      why: "Лучший выбор: код читается как мутация, а результат — новый объект, где неизменённые ветки сохраняют ссылки, и memo продолжает работать."
    - label: Ручной спред на каждом уровне
      why: Подходит для 1–2 уровней. На глубине 4–5 в десятке обработчиков — громоздко, и пропущенный уровень даст тихую мутацию.
    - label: structuredClone, затем мутировать копию
      why: "Корректно, но копирует всё дерево: все ссылки новые, memo и зависимости эффектов срабатывают впустую. Годится для редких разовых операций."
    - label: Нормализовать в плоские словари по id
      why: Отлично, когда сущности повторяются или формат свой. Здесь формат навязан API — пришлось бы писать преобразование туда и обратно.
  answer: 0
