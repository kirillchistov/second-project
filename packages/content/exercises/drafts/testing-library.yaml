- id: testing-library-form-submit-fill
  skill: testing-user-event-flow
  question: testing-library
  difficulty: 2
  prompt: Допишите тест формы подписки. Текст «Спасибо» появляется только после асинхронной отправки.
  explanation: "userEvent.setup() создаёт сессию и воспроизводит реальную цепочку событий: focus, keydown, input и т. д. fireEvent этого не делает. Поле уже на экране, поэтому его ищем синхронно через getByRole по роли и доступному имени. Асинхронно появляющийся текст ждём через await findBy…: getBy упал бы сразу."
  type: fill-tokens
  language: tsx
  code: |-
    test('отправляет email', async () => {
      const user = userEvent.___();
      const onSubmit = vi.fn();
      render(<SubscribeForm onSubmit={onSubmit} />);
      const field = screen.___('textbox', {
        name: /email/i,
      });
      await user.type(field, 'a@b.c');
      await user.click(
        screen.getByRole('button', { name: /подп/i })
      );
      expect(onSubmit).toHaveBeenCalledWith('a@b.c');
      expect(await screen.___(/спасибо/i)).toBeVisible();
    });
  tokens:
    - setup
    - getByRole
    - findByText
  decoys:
    - getByText
    - findByRole
    - waitFor
    - init
