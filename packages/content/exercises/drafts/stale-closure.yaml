# Черновик упражнений: «Что не так с этим кодом? (stale closure в интервале)» (stale-closure)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only stale-closure

- id: stale-closure-interval-quiz
  skill: stale-closure
  question: stale-closure
  difficulty: 2
  prompt: "Таймер: `useEffect` с `[]` запускает `setInterval(() => setCount(count + 1), 1000)`. Почему счётчик навсегда застывает на 1?"
  explanation: "Каждый рендер — отдельный вызов функции со своими константами. Колбэк из первого рендера видит только его значения. Это обычные замыкания JS. Лечится так: апдейтер `setCount(c => c + 1)`, если нужно прошлое состояние; `useEffectEvent`, если нужно читать свежие props/state без перезапуска эффекта."
  type: quiz
  options:
    - label: Колбэк интервала создан в первом рендере и замкнул count = 0, поэтому каждую секунду вызывает setCount(0 + 1)
      why: Верно. Интервал тикает, но аргумент всегда 1. React видит то же значение и не меняет экран, хотя setCount вызывается каждую секунду.
    - label: Эффект с [] выполняется один раз, значит и setInterval срабатывает только один раз
      why: Эффект действительно запускается один раз, но созданный им интервал тикает каждую секунду. Проблема не в числе вызовов, а в значении count, которое видит колбэк.
    - label: count обновляется асинхронно, и интервал успевает прочитать значение до того, как React его обновит
      why: "count не «обновляется»: это константа конкретного рендера. Новый рендер создаёт новую константу, а старое замыкание продолжает видеть свою."
    - label: React батчит обновления из setInterval и отбрасывает все, кроме первого
      why: Батчинг объединяет обновления внутри одного тика. Здесь тики разные, и каждое обновление обрабатывается. Просто значение всегда одно и то же — 1.
  answer: 0

# исправлено ревьюером:
# Последняя фраза объяснения («Подписки и WebSocket — то же место для этого бага») звучит коряво и непонятно. Переформулирована, остальное без изменений.
- id: stale-closure-keydown-listener
  skill: stale-closure
  question: stale-closure
  difficulty: 2
  prompt: Пользователь вводит текст и жмёт Enter, но `search` всегда получает пустую строку. Найдите ошибку.
  explanation: "`onKey` создаётся в первом рендере и навсегда видит `query = ''`. Из-за `[]` эффект не пересоздаёт слушатель. Исправить можно двумя способами. Первый — обернуть обработчик в `useEffectEvent`: подписка остаётся одна, а значение всегда свежее. Второй — добавить `query` в зависимости, но тогда слушатель будет переподписываться на каждый символ. Тот же баг часто встречается в подписках и обработчиках WebSocket."
  type: find-bug
  language: tsx
  code: |-
    function Search() {
      const [query, setQuery] = useState('');
      useEffect(() => {
        const onKey = (e: KeyboardEvent) => {
          if (e.key === 'Enter') search(query);
        };
        window.addEventListener('keydown', onKey);
        return () =>
          window.removeEventListener('keydown', onKey);
      }, []);
      return <input value={query}
        onChange={(e) => setQuery(e.target.value)} />;
    }
  bugLines:
    - 5
    - 10
  causes:
    - onKey замкнул query из первого рендера, а пустой массив зависимостей не даёт пересоздать слушатель — search всегда получает ''
    - removeEventListener получает другую функцию, поэтому слушатели копятся и срабатывает самый первый
    - setQuery асинхронный, поэтому в момент нажатия Enter query ещё не успел обновиться
    - Слушатель на window не получает keydown, пока фокус находится внутри input
  answer: 0

- id: stale-closure-use-effect-event-timer
  skill: use-effect-event
  question: stale-closure
  difficulty: 2
  prompt: "Допишите таймер (React 19.2): он прибавляет актуальный `step` и не перезапускает интервал при смене `step`."
  explanation: "`useEffectEvent` возвращает функцию, которая при вызове всегда видит свежие props и state. Её не указывают в зависимостях. Поэтому эффект с `[]` создаёт интервал один раз, а апдейтер `c => c + step` берёт и прошлое состояние, и актуальный шаг. С `[step]` интервал пересоздавался бы при каждой смене шага и сбивался."
  type: fill-tokens
  language: tsx
  code: |-
    function Timer({ step }: { step: number }) {
      const [count, setCount] = useState(0);
      const onTick = ___(() => {
        setCount((c) => c + ___);
      });
      useEffect(() => {
        const id = setInterval(___, 1000);
        return () => clearInterval(id);
      }, ___);
      return <p>{count}</p>;
    }
  tokens:
    - useEffectEvent
    - step
    - onTick
    - "[]"
  decoys:
    - useCallback
    - count
    - "[step]"
    - "[onTick]"

- id: stale-closure-websocket-latest-value
  skill: effect-latest-values-choice
  question: stale-closure
  difficulty: 3
  prompt: "Чат (React 19.2): эффект подключается к WebSocket по `roomId`. В обработчике сообщения нужно играть звук, если не включён `muted`. Переключение `muted` не должно переподключать сокет. Что выбрать?"
  explanation: "Правило: если значение влияет на то, что синхронизирует эффект (`roomId`), — это зависимость. Если значение только читается в реакции на событие (`muted`), — это логика события, ей место в `useEffectEvent`. Отключать `exhaustive-deps` вместо этого — путь к stale closure."
  type: choose-tool
  options:
    - label: Обернуть onMessage в useEffectEvent, а в зависимостях эффекта оставить только roomId
      why: Лучший вариант. Обработчик всегда видит свежий muted, а сокет переподключается только при смене roomId. Так в 19.2 и разделяют «реактивную» и «событийную» логику.
    - label: Добавить muted в массив зависимостей эффекта
      why: Замыкание станет свежим, но каждое переключение звука будет рвать и заново открывать соединение. Подходит, только если изменение значения действительно должно перезапускать синхронизацию.
    - label: Использовать функциональный апдейтер setState внутри обработчика
      why: Апдейтер помогает, когда новое состояние считается из предыдущего, как в счётчике. Прочитать через него актуальный проп muted нельзя.
    - label: Хранить muted в useRef и синхронизировать ref в отдельном эффекте
      why: "Рабочий паттерн до React 19.2 и для колбэков сторонних библиотек. Но это ручная работа: легко забыть синхронизацию или прочитать ref во время рендера. В 19.2 то же декларативно делает useEffectEvent."
  answer: 0
