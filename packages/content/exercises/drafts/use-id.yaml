# Черновик упражнений: «Зачем нужен useId?» (use-id)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only use-id

- id: use-id-why-quiz
  skill: use-id-purpose
  question: use-id
  difficulty: 2
  prompt: Зачем нужен `useId`, если можно сгенерировать id через `Math.random()` или глобальный счётчик?
  explanation: "`useId` даёт id, уникальный в пределах приложения и совпадающий на сервере и клиенте: он выводится из пути компонента в дереве. Главное применение — связи доступности: `htmlFor`/`id`, `aria-describedby`, `aria-labelledby`. Для ключей списков он не нужен."
  type: quiz
  options:
    - label: Он строит id из положения компонента в дереве, поэтому id совпадает при SSR и гидрации и уникален для каждого экземпляра
      why: Верно. Порядок выполнения кода на сервере и клиенте может отличаться, а путь в дереве совпадает. Поэтому разметка совпадает и гидрация проходит без ошибок.
    - label: Он быстрее `Math.random()`, поэтому меньше нагружает рендер
      why: Производительность тут ни при чём. `Math.random()` плох тем, что на сервере и клиенте даст разные значения, а на каждом рендере — новое.
    - label: Он генерирует стабильные ключи для элементов списка
      why: Это типичное заблуждение. Ключи должны выводиться из данных, например `item.id`. К тому же хук нельзя вызывать внутри `map`.
    - label: Он гарантирует уникальность id во всём документе, включая разметку вне React
      why: "React не знает про чужую разметку: захардкоженный `id` в HTML-шаблоне может совпасть. Уникальность гарантируется только среди id, выданных `useId` одного React-корня."
  answer: 0

- id: use-id-global-counter-hydration
  skill: use-id-ssr-stability
  question: use-id
  difficulty: 2
  prompt: Страница рендерится на сервере. После загрузки в консоли появляется ошибка гидрации о несовпадении атрибутов `id`. Найдите причину.
  explanation: "Переменная модуля на сервере живёт между запросами и продолжает расти. На клиенте она стартует с нуля и зависит от порядка рендера, поэтому id расходятся. Решение — `const id = useId();`: id выводится из пути в дереве и совпадает на сервере и клиенте."
  type: find-bug
  language: tsx
  code: |-
    let nextId = 0;

    function EmailField() {
      const id = `email-${nextId++}`;
      return (
        <>
          <label htmlFor={id}>Email</label>
          <input id={id} type="email" />
        </>
      );
    }
  bugLines:
    - 1
    - 4
  causes:
    - "Глобальный счётчик даёт на сервере и клиенте разные значения: он зависит от числа запросов и порядка рендера"
    - В JSX нужно писать `for`, а не `htmlFor`, иначе атрибут не попадёт в HTML
    - Фрагмент `<>` нельзя гидрировать, нужна обёртка `div`
    - Шаблонная строка в `id` вычисляется только на клиенте
  answer: 0

- id: use-id-aria-describedby
  skill: use-id-a11y-linking
  question: use-id
  difficulty: 1
  prompt: Допишите поле так, чтобы `label` был связан с input, а подсказка зачитывалась скринридером как описание поля. Компонент может встречаться на странице несколько раз.
  explanation: Один вызов `useId` на компонент, производные id получаются суффиксами (`${id}-hint`). `htmlFor` связывает label с полем, `aria-describedby` добавляет описание. `aria-labelledby` заменил бы имя поля, а это другая роль.
  type: fill-tokens
  language: tsx
  code: |-
    function NewsletterField() {
      const id = ___();
      const hintId = `${id}-hint`;
      return (
        <>
          <label ___={id}>Email</label>
          <input id={id} ___={hintId} />
          <p id={hintId}>Без спама</p>
        </>
      );
    }
  tokens:
    - useId
    - htmlFor
    - aria-describedby
  decoys:
    - useRef
    - for
    - aria-labelledby
    - useMemo

- id: use-id-not-for-list-keys
  skill: use-id-vs-keys
  question: use-id
  difficulty: 2
  prompt: Рендерите список комментариев из API. Комментарии можно удалять и сортировать, у каждого есть локальное состояние «развёрнут». Что взять в качестве `key`?
  explanation: "`key` описывает идентичность данных, поэтому его берут из данных. `useId` решает другую задачу: уникальные id для DOM-атрибутов внутри компонента. Если id из данных нет, его генерируют один раз при получении данных, а не во время рендера."
  type: choose-tool
  options:
    - label: "`comment.id` из данных"
      why: "Лучший выбор: ключ стабилен между рендерами и привязан к сущности. Состояние «развёрнут» не съедет при сортировке и удалении."
    - label: "`useId()` для каждого элемента"
      why: Хук нельзя вызвать внутри `map`. Даже в дочернем компоненте его id появится уже после выбора ключа, и идентичность данных он не описывает. Он нужен для `htmlFor` и `aria-*`.
    - label: Индекс элемента в массиве
      why: Годится только для статичного списка без сортировки, удаления и локального состояния. Здесь при удалении состояние уедет к соседу.
    - label: "`crypto.randomUUID()` прямо в JSX"
      why: "На каждом рендере ключ новый: React размонтирует и пересоздаёт все элементы, и состояние теряется. Уместно только один раз при создании записи."
  answer: 0
