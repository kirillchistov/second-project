- id: preserve-reset-state-position-predict
  skill: state-position-identity
  question: preserve-reset-state
  difficulty: 3
  prompt: Counter — обычный компонент с useState(0) и кнопкой, которая показывает и увеличивает счётчик. Каждый из двух Counter нажали 3 раза, затем нажали «wide». Что покажут счётчики (сверху вниз)?
  explanation: "Первый Counter остаётся на той же позиции: false от {wide && ...} тоже занимает место, а Banner появляется в своём слоте. Поэтому его state сохранится. На месте второго Counter появился section — это другой тип, поэтому поддерево перемонтируется и счётчик вернётся к 0."
  type: predict-output
  language: tsx
  code: |-
    function App() {
      const [wide, setWide] = useState(false);
      return (
        <>
          {wide && <Banner />}
          <Counter />
          {wide ? <section><Counter /></section> : <Counter />}
          <button onClick={() => setWide(true)}>wide</button>
        </>
      );
    }
  options:
    - 3 и 0
    - 3 и 3
    - 0 и 0
    - 0 и 3
  answer: 0

# исправлено ревьюером:
# Сохранение прокрутки при display: none (а Activity скрывает именно так) не гарантировано браузером. Требование «прокрутка» делает ответ спорным, поэтому оно заменено на неконтролируемое поле.
- id: preserve-reset-state-hidden-tab
  skill: preserve-hidden-state
  question: preserve-reset-state
  difficulty: 2
  prompt: Вкладки в React 19.2. Во вкладке «Черновик» есть несохранённый текст в неконтролируемом поле и подписка на WebSocket. При переключении текст и state должны сохраниться, а подписка в скрытой вкладке — не работать. Что выбрать?
  explanation: "Сохранить state скрытого UI можно тремя путями: не размонтировать его (Activity или CSS), поднять state выше или хранить его вне React. Сбросить state — сменить key или тип. Activity в режиме hidden сохраняет state и DOM, но очищает эффекты и запускает их снова при показе."
  type: choose-tool
  options:
    - label: "<Activity mode={active ? 'visible' : 'hidden'}>"
      why: Лучший выбор. State и DOM сохраняются, эффекты скрытой вкладки очищаются и снова запускаются при показе.
    - label: "Всегда рендерить вкладку и скрывать её через display: none"
      why: State сохранится, но эффекты продолжат работать, и подписка останется активной. Подходит, когда эффектов нет.
    - label: Поднять весь state вкладки в родителя
      why: Сработает для явного state, но значение неконтролируемого поля потеряется при размонтировании. Хорошо, когда state нужен родителю.
    - label: Условный рендер {active && <Draft />}
      why: При скрытии компонент размонтируется, и черновик пропадёт. Подходит, когда как раз нужно начинать с чистого состояния.
  answer: 0
