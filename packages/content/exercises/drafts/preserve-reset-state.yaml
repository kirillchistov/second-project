# Черновик упражнений: «Как React сохраняет и сбрасывает состояние компонента?» (preserve-reset-state)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only preserve-reset-state

- id: preserve-reset-state-position-quiz
  skill: state-position-identity
  question: preserve-reset-state
  difficulty: 2
  prompt: От чего зависит, сохранит ли React состояние компонента после очередного рендера родителя?
  explanation: Для React идентичность компонента — это позиция в дереве JSX, тип и key. Совпали все три — state сохраняется. Изменилось что-то одно — старое поддерево размонтируется вместе со всем состоянием. Поэтому key — штатный способ сбросить state, а Activity или CSS-скрытие — способы его сохранить.
  type: quiz
  options:
    - label: "От позиции в дереве рендера, типа компонента и key: если всё совпадает, state сохраняется, иначе поддерево монтируется заново"
      why: Верно. React сравнивает элементы на одной позиции по типу и key. Смена любого из них означает для него новый компонент.
    - label: "От того, изменились ли props: новые props сбрасывают state, чтобы он не рассинхронизировался"
      why: Неверно. Props можно менять сколько угодно, state при этом живёт. Классический баг — useState(props.x) не обновляется при смене x.
    - label: "От положения в реальном DOM: пока DOM-узел на месте, React сохраняет связанный с ним state"
      why: Важен не DOM, а дерево элементов JSX. Даже false в {cond && <A />} занимает позицию, хотя DOM-узла не создаёт.
    - label: State хранится в замыкании функции компонента, поэтому живёт, пока эта функция существует
      why: State хранится в Fiber-узле дерева, а не в замыкании. Функция вызывается заново на каждом рендере.
  answer: 0

