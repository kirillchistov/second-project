# Черновик упражнений: «Как React обрабатывает события?» (events)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only events

- id: events-delegation-quiz
  skill: react-event-system
  question: events
  difficulty: 1
  prompt: Как React обрабатывает события вроде onClick?
  explanation: "React делегирует события: один слушатель на каждый тип события висит на root-контейнере. React сам проходит по дереву компонентов и вызывает ваши обработчики с SyntheticEvent. Поэтому всплытие идёт по дереву React (важно для порталов), а с React 17 несколько React-приложений на странице не мешают друг другу."
  type: quiz
  options:
    - label: Вешает по слушателю на каждый тип события на root-контейнер и передаёт обработчикам SyntheticEvent — обёртку над нативным событием
      why: "Верно. Это делегирование: React ловит событие на корне, находит компоненты по пути и вызывает их обработчики с кроссбраузерной обёрткой."
    - label: Вызывает addEventListener на каждом DOM-элементе с onClick и передаёт в обработчик нативное событие
      why: "Это модель «как в ванильном JS». React так не делает: слушатели на каждом элементе дороже, а в обработчик приходит SyntheticEvent, а не нативное событие."
    - label: Вешает слушатели на document и переиспользует объекты событий, поэтому для async-доступа нужен e.persist()
      why: Так было до React 17. Теперь слушатели висят на root, event pooling удалён, и e.persist() ничего не делает.
    - label: Событие всплывает по DOM-дереву, а React лишь переименовывает обработчики в camelCase
      why: "Всплытие идёт по дереву React-компонентов. Это видно на порталах: клик в модалке, лежащей в body, получит React-родитель портала."
  answer: 0

- id: events-handler-called-on-render
  skill: event-handler-passing
  question: events
  difficulty: 1
  prompt: Сразу после рендера список задач очищается сам, без кликов. Найдите строку с ошибкой.
  explanation: "`onClick={remove(t.id)}` вызывает remove прямо во время рендера, и в onClick попадает её результат. Обработчик должен быть функцией: `onClick={() => remove(t.id)}`. Если remove меняет состояние, вызов при рендере ещё и грозит ошибкой «Too many re-renders»."
  type: find-bug
  language: tsx
  code: |-
    function TodoList({ todos, remove }: Props) {
      return (
        <ul>
          {todos.map((t) => (
            <li key={t.id}>
              {t.title}
              <button onClick={remove(t.id)}>×</button>
            </li>
          ))}
        </ul>
      );
    }
  bugLines:
    - 7
  causes:
    - В onClick передан вызов remove(t.id), а не функция — remove срабатывает при рендере для каждой задачи
    - Внутри map нельзя навешивать обработчики, их нужно вынести в useCallback
    - key={t.id} пересоздаёт кнопки, и React сам кликает по ним при монтировании
    - Обработчик удаления надо передавать через onClickCapture, иначе событие не дойдёт до кнопки
  answer: 0

- id: events-portal-bubbling-order
  skill: event-propagation-portals
  question: events
  difficulty: 2
  prompt: Кнопка рендерится через портал в document.body. Пользователь кликает по ней. Что будет в консоли?
  explanation: Порядок событий React следует дереву компонентов, а не DOM. Сначала фаза перехвата идёт сверху вниз (onClickCapture у div), затем срабатывает обработчик цели (button), потом всплытие к родителю (div onClick). Положение портала в DOM на это не влияет. Чтобы клик не дошёл до родителя, вызовите e.stopPropagation() в обработчике внутри портала.
  type: predict-output
  language: tsx
  code: |-
    function App() {
      return (
        <div
          onClickCapture={() => console.log('capture')}
          onClick={() => console.log('parent')}
        >
          {createPortal(
            <button onClick={() => console.log('button')}>
              OK
            </button>,
            document.body
          )}
        </div>
      );
    }
  options:
    - capture → button → parent
    - button
    - button → parent
    - capture → parent → button
  answer: 0

- id: events-form-submit-handler
  skill: form-submit-handling
  question: events
  difficulty: 1
  prompt: Допишите форму так, чтобы страница не перезагружалась, а значение поля q ушло в onSearch.
  explanation: "Отправку формы ловим через onSubmit на form: так сработают и клик по кнопке, и Enter. Перезагрузку отменяет только e.preventDefault(), return false в React не работает. currentTarget — это элемент, на котором висит обработчик, и TS типизирует его как HTMLFormElement. Тип e.target — просто EventTarget."
  type: fill-tokens
  language: tsx
  code: |-
    function SearchForm({ onSearch }: Props) {
      function handleSubmit(e: FormEvent<HTMLFormElement>) {
        e.___();
        const data = new FormData(e.___);
        onSearch(String(data.get('q')));
      }
      return (
        <form ___={handleSubmit}>
          <input name="q" />
          <button>Найти</button>
        </form>
      );
    }
  tokens:
    - preventDefault
    - currentTarget
    - onSubmit
  decoys:
    - stopPropagation
    - target
    - onClick
    - onChange
