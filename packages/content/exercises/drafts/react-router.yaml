# Черновик упражнений: «Как устроен роутинг в React Router v7?» (react-router)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only react-router

- id: react-router-loader-vs-effect
  skill: router-loaders-vs-effect
  question: react-router
  difficulty: 2
  prompt: Чем загрузка данных в `loader` маршрута React Router v7 лучше загрузки в `useEffect` компонента?
  explanation: Loader привязан к навигации, а не к рендеру. Router знает все совпавшие маршруты и запускает их loaders параллельно ещё до рендера. Он сам отменяет устаревшие запросы, направляет ошибки в `errorElement` и перезагружает данные после action. Кэша как в TanStack Query у него нет.
  type: quiz
  options:
    - label: Загрузка стартует при навигации, параллельно для всех вложенных маршрутов и до рендера — без водопада, с отменой и errorElement
      why: Верно. С useEffect дочерний компонент начинает загрузку только после того, как родитель загрузил данные и отрендерил его. Получается водопад запросов.
    - label: Loader кэширует ответы между навигациями, поэтому при возврате на страницу запрос не повторяется
      why: "Неверно. React Router не кеширует данные как TanStack Query: при повторной навигации и после action loaders вызываются снова. Кэш делают отдельно."
    - label: Loader всегда выполняется на сервере, поэтому код загрузки не попадает в клиентский бандл
      why: Неверно. В data mode с `createBrowserRouter` loaders работают в браузере. Серверные loaders есть в framework mode с SSR.
    - label: В useEffect нельзя отменить запрос, а в loader можно
      why: "Неверно. В useEffect запрос отменяется через AbortController в cleanup. Главная проблема эффекта в другом: загрузка стартует только после рендера."
  answer: 0

- id: react-router-nested-loader-outlet
  skill: router-nested-routes-loaders
  question: react-router
  difficulty: 2
  prompt: "Допишите конфиг: данные проекта должны грузиться при навигации, запрос отменяться при уходе со страницы, а `<Project />` рендериться внутри layout."
  explanation: "`loader` запускается при навигации до рендера. `request.signal` прерывается, если пользователь ушёл со страницы, и устаревший запрос отменяется. Дочерний маршрут рендерится в `<Outlet />` родителя: без него layout покажется, а дочерняя страница нет."
  type: fill-tokens
  language: tsx
  code: |-
    const router = createBrowserRouter([{
      path: '/',
      element: <RootLayout />,
      children: [{
        path: 'projects/:id',
        ___: ({ params, request }) => api.getProject(
          params.id!, { signal: request.___ }),
        element: <Project />,
      }],
    }]);

    function RootLayout() {
      return <main><Nav /><___ /></main>;
    }
  tokens:
    - loader
    - signal
    - Outlet
  decoys:
    - action
    - abort
    - Children
    - useLoaderData

- id: react-router-redirect-in-loader
  skill: router-protected-routes
  question: react-router
  difficulty: 2
  prompt: Loader должен пускать на /admin только авторизованных пользователей. Найдите ошибку.
  explanation: Loader — обычная функция, которую router вызывает вне рендера, поэтому хуки в ней недоступны. Перенаправление делают через `throw redirect('/login')` или `return redirect('/login')`. `useNavigate` и `<Navigate>` подходят для защиты в компоненте-обёртке.
  type: find-bug
  language: tsx
  code: |-
    async function requireUser() {
      const user = await getCurrentUser();
      if (!user) {
        const navigate = useNavigate();
        navigate('/login');
      }
      return user;
    }

    const routes = [
      { path: '/admin', loader: requireUser,
        element: <Admin /> },
    ];
  bugLines:
    - 4
    - 5
  causes:
    - "Loader — не компонент: хук useNavigate в нём вызвать нельзя, нужно выбросить или вернуть redirect('/login')"
    - Loader не может быть async — router ожидает синхронное значение
    - "navigate нужно вызывать с { replace: true }, иначе редирект не сработает"
    - Loader обязан возвращать Response, а не объект пользователя
  answer: 0

- id: react-router-mode-migration
  skill: router-mode-choice
  question: react-router
  difficulty: 2
  prompt: Существующее SPA на `<BrowserRouter>` и `<Routes>`, данные грузятся в useEffect с водопадами. Нужно постепенно перенести загрузку в loaders и формы в actions, не меняя сборку и структуру файлов. Что выбрать?
  explanation: "Три режима React Router v7: declarative — только сопоставление URL и компонентов, data — loaders и actions через `createBrowserRouter`, framework — файловые роуты, SSR и типизация через Vite-плагин. Выбирайте минимальный режим, который закрывает задачу."
  type: choose-tool
  options:
    - label: "Data mode: createBrowserRouter + RouterProvider с loader и action у маршрутов"
      why: "Лучший вариант: даёт loaders, actions, errorElement и useNavigation. Переход идёт маршрут за маршрутом, без смены сборки и файловой структуры."
    - label: Остаться в declarative mode и вынести fetch в кастомные хуки
      why: Код станет чище, но загрузка по-прежнему стартует после рендера. Водопады и ручная обработка ошибок останутся. Подходит, если данных почти нет.
    - label: Framework mode с файловыми роутами и Vite-плагином
      why: Хорош для нового проекта или когда нужны SSR и типизация маршрутов. Здесь он требует перестроить сборку и структуру файлов, что противоречит условиям.
    - label: Переписать приложение на Next.js App Router
      why: Оправдано, если нужны серверные компоненты и SSR от фреймворка. Для постепенной миграции SPA это слишком дорогой шаг.
  answer: 0
