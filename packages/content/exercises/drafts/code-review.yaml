# Черновик упражнений: «На что вы смотрите при code review React-кода?» (code-review)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only code-review

- id: code-review-focus-quiz
  skill: code-review-priorities
  question: code-review
  difficulty: 3
  prompt: На что в первую очередь должен смотреть человек при code review React-кода?
  explanation: "Ревью — проверка смысла: корректность, архитектура, производительность горячих путей, a11y, безопасность, типы и тесты. Всё, что можно проверить машиной (формат, простые правила, типы), уходит в Prettier, ESLint и TypeScript в CI, чтобы ревьюер не тратил на это внимание."
  type: quiz
  options:
    - label: "На смысл: корректность эффектов и состояния, архитектуру, горячие пути, доступность, безопасность и тесты"
      why: "Верно. Это то, что не поймает автоматика: лишний источник истины, гонка в эффекте, XSS через dangerouslySetInnerHTML, тест на реализацию."
    - label: "На соблюдение стайлгайда: именование, форматирование, порядок импортов — это основа качества кода"
      why: Стиль важен, но его должны решать Prettier и ESLint в CI. Споры о стиле на ревью — типичный подводный камень и трата времени команды.
    - label: "На покрытие: если coverage выше порога, логику можно подробно не читать"
      why: Высокий coverage не гарантирует, что тесты проверяют поведение и краевые случаи. Тесты на реализацию дают процент, но не уверенность.
    - label: "На производительность: каждое вычисление и колбэк должны быть обёрнуты в useMemo и useCallback"
      why: "Мемоизация «везде» — не цель ревью: смотрят на лишние рендеры именно на горячих путях, а React Compiler и так мемоизирует многое сам."
  answer: 0

- id: code-review-nested-component
  skill: nested-component-definition
  question: code-review
  difficulty: 2
  prompt: "На ревью: пользователи жалуются, что поле поиска теряет фокус после каждого символа. Найдите строку с причиной."
  explanation: "Компонент, объявленный внутри компонента, на каждом рендере — новая функция, то есть новый тип. React не может сопоставить его с прошлым, размонтирует старый input и монтирует новый — фокус и состояние теряются. Решение: вынести SearchInput наружу и передать value/onChange через props или вставить JSX напрямую."
  type: find-bug
  language: tsx
  code: |-
    function SearchPage() {
      const [query, setQuery] = useState('');
      const SearchInput = () => (
        <input
          value={query}
          onChange={(e) => setQuery(e.target.value)}
        />
      );
      return (
        <Layout search={<SearchInput />}>
          <Results query={query} />
        </Layout>
      );
    }
  bugLines:
    - 3
  causes:
    - "SearchInput объявлен внутри SearchPage: каждый рендер создаёт новый тип компонента, и React перемонтирует input"
    - Контролируемому input нужен defaultValue вместе с value, иначе React сбрасывает фокус
    - setQuery нельзя вызывать из вложенной стрелочной функции — замыкание устаревает и ломает ввод
    - JSX-элемент нельзя передавать в prop search — React клонирует его при каждом рендере Layout
  answer: 0

- id: code-review-style-automation
  skill: code-review-automation
  question: code-review
  difficulty: 2
  prompt: На каждом ревью в команде по полчаса спорят о кавычках, точках с запятой и порядке импортов. Как это решить?
  explanation: "Правило: всё, что можно проверить машиной, проверяет машина. Форматтер и линтер в pre-commit и CI снимают споры о стиле, а ревьюер тратит внимание на смысл: состояние, эффекты, архитектуру, безопасность."
  type: choose-tool
  options:
    - label: Prettier + ESLint (import order) в pre-commit и обязательной проверке CI
      why: "Лучший вариант: стиль применяется автоматически и единообразно, спорить не о чем, PR со сломанным стилем просто не пройдёт CI."
    - label: Подробный стайлгайд в вики и ссылки на него в комментариях
      why: Полезен для договорённостей, которые не автоматизировать (именование, структура модулей), но правила форматирования люди всё равно будут нарушать и обсуждать.
    - label: Помечать стилевые замечания как nit:, чтобы они не блокировали мерж
      why: "Разделение блокирующих и nit: — хорошая культура для вкусовых предложений, но время на написание и чтение таких комментариев никуда не девается."
    - label: Назначить одного ревьюера, отвечающего только за стиль
      why: Создаёт бутылочное горлышко и задержки ревью, а проверку, которую делает машина за секунды, перекладывает на человека.
  answer: 0

# исправлено ревьюером:
# Порядок шагов «корректность» и «тесты» спорный: их часто проверяют параллельно или в обратном порядке. Для order нужна бесспорная последовательность, поэтому шаги объединены в одну проверку деталей.
# Не обосновано, почему архитектуру оценивают раньше деталей. В explanation добавлено объяснение.
- id: code-review-process-recipe
  skill: code-review-process
  question: code-review
  difficulty: 2
  prompt: Соберите порядок действий при ревью PR с новой фичей.
  explanation: "Сначала понять цель и размер PR: если его не понять за ~15 минут, его просят разбить. Затем проверить, что автоматика зелёная, иначе вы ревьюите то, что машина отвергнет. Дальше идти от крупного к мелкому: если архитектура неверна, детали всё равно придётся переписывать. В конце оставить комментарии с «почему» и явным разделением блокирующих замечаний и nit:."
  type: order
  kind: recipe
  steps:
    - Прочитать описание и задачу, оценить размер — при необходимости попросить разбить PR
    - "Убедиться, что CI зелёный: линтер, типы, тесты"
    - "Оценить архитектуру: где живёт состояние, границы модулей, нет ли дублирования источников истины"
    - "Проверить детали: эффекты и зависимости, гонки, ключи, загрузку и ошибки, безопасность, тесты на поведение"
    - "Оставить комментарии с объяснением «почему», разделив блокирующие и nit:"
