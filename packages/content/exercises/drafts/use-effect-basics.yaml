# Черновик упражнений: «Что такое useEffect и когда он действительно нужен?» (use-effect-basics)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only use-effect-basics

- id: use-effect-purpose-quiz
  skill: effect-purpose
  question: use-effect-basics
  difficulty: 1
  prompt: Для какой задачи `useEffect` — действительно подходящий инструмент?
  explanation: "Главный вопрос перед эффектом: «с какой внешней системой я синхронизируюсь?» Если ответа нет, эффект, скорее всего, не нужен. Данные для рендера считают в теле компонента, реакции на действия пишут в обработчиках, а состояние сбрасывают через `key`."
  type: quiz
  options:
    - label: "Синхронизировать компонент с внешней системой: сетью, подпиской, таймером, DOM-API, сторонним виджетом"
      why: Верно. Эффект запускается после коммита, повторяется при смене зависимостей, а cleanup «откатывает» синхронизацию перед следующим запуском и при размонтировании.
    - label: Вычислять производные данные из props и state, чтобы не пересчитывать их на каждом рендере
      why: Эффект с setState даёт лишний рендер и кадр с устаревшими данными. Считайте прямо в рендере, а если это дорого — используйте useMemo или React Compiler.
    - label: Реагировать на действия пользователя, например отправлять форму после клика
      why: Действие уже произошло в конкретном событии, поэтому его место — обработчик. Через эффект с флагом логика размазывается, а при повторном рендере возможны лишние запуски.
    - label: Выполнить код до отрисовки, чтобы пользователь не увидел промежуточное состояние
      why: "Это задача useLayoutEffect: он блокирует paint. useEffect обычно срабатывает уже после отрисовки кадра."
  answer: 0

- id: use-effect-deps-variants
  skill: effect-dependencies
  question: use-effect-basics
  difficulty: 1
  prompt: Компонент смонтировали (без StrictMode), затем один раз нажали кнопку. Что будет в консоли?
  explanation: Без массива зависимостей эффект запускается после каждого рендера. С `[]` — только после монтирования. С `[n]` — после монтирования и при каждом изменении n (сравнение через Object.is). Эффекты выполняются в порядке объявления.
  type: predict-output
  language: tsx
  code: |-
    function App() {
      const [n, setN] = useState(0);

      useEffect(() => { console.log('A'); });
      useEffect(() => { console.log('B'); }, []);
      useEffect(() => { console.log('C', n); }, [n]);

      return (
        <button onClick={() => setN(n + 1)}>+</button>
      );
    }
  options:
    - A → B → C 0 → A → C 1
    - A → B → C 0 → A → B → C 1
    - A → B → C 0 → C 1
    - A → B → C 0 → A
  answer: 0

# исправлено ревьюером:
# В explanation рекомендован массив `[serverUrl, roomId]`. В коде serverUrl не объявлен в компоненте, то есть это внешняя константа модуля. Такие значения не являются реактивными зависимостями, и линтер exhaustive-deps предупредит, что их указывать не нужно. Корректная рекомендация — `[roomId]`.
- id: use-effect-object-dependency
  skill: effect-dependencies
  question: use-effect-basics
  difficulty: 2
  prompt: Чат переподключается при каждом нажатии клавиши в поле ввода. Найдите причину.
  explanation: Объект `options` создаётся заново на каждом рендере. Для Object.is это всегда новая зависимость, поэтому каждый ввод вызывает cleanup и новое подключение. Решение — создать объект внутри эффекта и зависеть от примитива `[roomId]`. serverUrl — константа модуля, и в зависимостях она не нужна.
  type: find-bug
  language: tsx
  code: |-
    function ChatRoom({ roomId }: { roomId: string }) {
      const [text, setText] = useState('');
      const options = { serverUrl, roomId };

      useEffect(() => {
        const conn = createConnection(options);
        conn.connect();
        return () => conn.disconnect();
      }, [options]);
      return (
        <input value={text}
          onChange={(e) => setText(e.target.value)} />
      );
    }
  bugLines:
    - 3
    - 9
  causes:
    - Объект options создаётся в каждом рендере — новая ссылка в зависимостях перезапускает эффект
    - Cleanup должен вызывать connect, а не disconnect
    - Контролируемый input нельзя использовать в компоненте с эффектом
    - Эффекту нужен пустой массив зависимостей, иначе он не сработает при монтировании
  answer: 0

- id: use-effect-reset-state-choice
  skill: reset-state-with-key
  question: use-effect-basics
  difficulty: 2
  prompt: ProfilePage({ userId }) хранит в useState черновик комментария и несколько полей формы. При переходе к другому пользователю всё это нужно сбросить. Что выбрать?
  explanation: "Сбрасывать состояние при смене props через эффект — антипаттерн: появляются лишний рендер и кадр со старыми данными. Правило: «другая сущность — другой экземпляр компонента», то есть `key`."
  type: choose-tool
  options:
    - label: Передать key={userId} компоненту с формой
      why: "Лучший вариант. Новый key — новый экземпляр: React размонтирует старый и создаст новый со свежим state, без лишнего рендера и ручного сброса каждого поля."
    - label: useEffect, который при смене userId вызывает setDraft('') и сбрасывает поля
      why: Сначала отрисуется кадр со старым черновиком, потом пройдёт лишний рендер, а каждое новое поле придётся сбрасывать вручную. Эффекты нужны для синхронизации с внешней системой.
    - label: Хранить черновик в useRef и очищать его вручную
      why: "Ref не вызывает рендер, поэтому UI разойдётся с данными. Ref подходит для значений, не влияющих на вывод: id таймера, DOM-узел."
    - label: Хранить prevUserId в state и сбрасывать поля прямо во время рендера
      why: Допустимый приём, когда нужно сбросить лишь часть состояния. Для полного сброса он громоздкий, и key проще.
  answer: 0
