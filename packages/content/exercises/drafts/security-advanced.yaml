# Черновик упражнений: «Какие угрозы безопасности актуальны для современного React-приложения?» (security-advanced)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only security-advanced

- id: security-advanced-beyond-xss
  skill: react-threat-model
  question: security-advanced
  difficulty: 3
  prompt: "Коллега говорит: «React экранирует всё в JSX, значит фронтенд защищён». Что ответить?"
  explanation: "Автоэкранирование закрывает только часть XSS. Угрозы современного приложения шире: утечки секретов в бандл, незащищённые Server Functions и API, CSRF, open redirect, цепочка поставок, кликджекинг. Защита многоуровневая: CSP с nonce, заголовки, проверки на сервере, аудит зависимостей, минимальные привилегии."
  type: quiz
  options:
    - label: "Экранирование закрывает лишь часть XSS: остаются секреты в бандле, открытые Server Functions, CSRF, зависимости, open redirect"
      why: "Верно. Большинство этих угроз вообще не про рендер JSX, поэтому нужна защита на нескольких уровнях: сервер, заголовки, сборка, зависимости."
    - label: Достаточно добавить CSP — она закрывает все угрозы клиентского приложения
      why: CSP снижает ущерб от XSS и сторонних скриптов, но не защитит Server Function без авторизации, секрет в бандле или CSRF-запрос.
    - label: Server Functions не видны клиенту, поэтому достаточно защитить страницы, которые их вызывают
      why: Server Function — это публичный POST-эндпоинт. Его можно вызвать напрямую, минуя UI, поэтому проверки нужны внутри каждой функции.
    - label: Секреты в переменных окружения в безопасности, если не коммитить .env в репозиторий
      why: Переменные с префиксом VITE_ или NEXT_PUBLIC_ подставляются в JS-бандл при сборке, и их видит любой пользователь.
  answer: 0

- id: security-advanced-server-action-idor
  skill: server-functions-authz
  question: security-advanced
  difficulty: 2
  prompt: Server Function удаляет пост. Найдите уязвимость.
  explanation: "Аутентификация (кто ты) ≠ авторизация (можно ли тебе это). Любой залогиненный пользователь может отправить чужой postId и удалить чужой пост (IDOR). Исправление: `where: { id: postId, authorId: session.user.id }` или явная проверка владельца. Ещё стоит валидировать вход (например, zod): типы TS в рантайме не проверяются."
  type: find-bug
  language: tsx
  code: |-
    'use server';

    export async function deletePost(postId: string) {
      const session = await auth();
      if (!session) throw new Error('Unauthorized');
      await db.post.delete({
        where: { id: postId },
      });
      revalidatePath('/posts');
    }
  bugLines:
    - 6
    - 7
  causes:
    - "Нет авторизации: проверяется только факт входа, но не то, что пост принадлежит пользователю"
    - "'use server' скрывает функцию от клиента, поэтому проверка сессии вообще избыточна"
    - revalidatePath нужно вызывать до удаления, иначе кэш устареет
    - postId должен иметь тип number, иначе удаление не сработает
  answer: 0

- id: security-advanced-csp-nonce
  skill: csp-headers
  question: security-advanced
  difficulty: 3
  prompt: "Допишите CSP в middleware: скрипты только с nonce (и подгруженные ими), без unsafe-inline, плюс защита от кликджекинга."
  explanation: "`'nonce-…'` разрешает только скрипты с этим одноразовым атрибутом, а `'strict-dynamic'` передаёт доверие скриптам, которые они загрузят. Nonce генерируется заново на каждый запрос. `frame-ancestors 'none'` запрещает встраивать страницу во фрейм — это защита от кликджекинга (`frame-src` управляет фреймами внутри страницы)."
  type: fill-tokens
  language: ts
  code: |-
    const nonce = btoa(crypto.randomUUID());
    const csp = [
      `script-src 'nonce-${___}' '___'`,
      `object-src 'none'`,
      `base-uri 'none'`,
      `___ 'none'`,
    ].join('; ');
    res.headers.set('Content-Security-Policy', csp);
  tokens:
    - nonce
    - strict-dynamic
    - frame-ancestors
  decoys:
    - unsafe-inline
    - unsafe-eval
    - frame-src
    - csp

# исправлено ревьюером:
# Сценарий — SPA на Vite с отдельным бэкендом. Пакет `server-only` работает только в бандлерах с условием react-server (Next.js/RSC). В обычном Node-сервере его импорт выбросит ошибку, поэтому совет нужно ограничить Next.js или убрать из варианта.
- id: security-advanced-secret-in-bundle
  skill: client-secrets-leak
  question: security-advanced
  difficulty: 2
  prompt: В SPA на Vite секретный ключ платёжного API лежит в VITE_PAYMENT_KEY, и браузер напрямую вызывает провайдера. Как исправить?
  explanation: Всё, что попало в клиентский бандл или в браузер, публично. Секрет должен жить только на сервере, в переменной без публичного префикса. Клиент обращается к своему эндпоинту, а тот проверяет сессию и права. В Next.js модуль с ключом стоит дополнительно пометить `import 'server-only'`. После утечки ключ обязательно нужно перевыпустить.
  type: choose-tool
  options:
    - label: Перенести вызов провайдера на сервер (API-роут или Server Function), ключ хранить в env без публичного префикса
      why: Верно. Ключ не покидает сервер, эндпоинт проверяет сессию и права, к нему можно добавить rate limiting.
    - label: Обфусцировать ключ в бандле (base64, разбиение на части)
      why: "Обфускация не даёт секретности: ключ восстанавливается за минуту через DevTools или по сетевым запросам."
    - label: Отдавать ключ с сервера после логина и держать его только в памяти
      why: Ключ всё равно окажется у любого залогиненного пользователя. Подход годится только для короткоживущих токенов с узкими правами, которые выдаёт провайдер.
    - label: Ограничить ключ по домену или Referer в кабинете провайдера
      why: Подходит для публичных ключей (publishable key, карты). Referer легко подделать вне браузера, поэтому секретный ключ так не защитить.
  answer: 0
