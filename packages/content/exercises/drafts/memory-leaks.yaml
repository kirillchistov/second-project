# Черновик упражнений: «Откуда берутся утечки памяти в React-приложениях и как их искать?» (memory-leaks)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only memory-leaks

- id: memory-leaks-root-cause
  skill: memory-leak-sources
  question: memory-leaks
  difficulty: 2
  prompt: Почему компонент, уже ушедший из дерева, может продолжать занимать память?
  explanation: "GC собирает только то, до чего нельзя дотянуться от корней. Утечка — это всегда **лишняя ссылка** от долгоживущего объекта: window, сокета, таймера, observer, глобального кэша, сторонней библиотеки. Поэтому каждый эффект, который что-то регистрирует снаружи, должен возвращать cleanup, а кэши — иметь лимит."
  type: quiz
  options:
    - label: Долгоживущий объект (window, сокет, таймер, глобальный кэш) хранит ссылку на колбэк или данные компонента, и GC не может их собрать
      why: Верно. Колбэк замыкает state, props и refs компонента. Пока на колбэк ссылается живой объект, вся эта цепочка достижима и не собирается.
    - label: React не освобождает память компонента, пока не произойдёт следующий ререндер корня
      why: "React отбрасывает Fiber-узлы при коммите размонтирования, а память освобождает GC. Ререндер корня тут ни при чём: держит память внешняя ссылка."
    - label: Утечку вызывает setState после размонтирования — об этом и предупреждал React
      why: Сам setState на размонтированном компоненте безвреден. Предупреждение убрали в React 18 как чаще ложное. Течёт подписка, которая этот setState вызывает.
    - label: Замыкания в JS удерживают память навсегда, поэтому стрелочные функции в JSX надо выносить
      why: Замыкание собирается вместе с функцией, когда на неё не осталось ссылок. Inline-функции в JSX не текут, если их не регистрирует внешний объект.
  answer: 0

- id: memory-leaks-listener-identity
  skill: effect-cleanup-subscriptions
  question: memory-leaks
  difficulty: 2
  prompt: После каждого монтирования и размонтирования хука в window остаётся слушатель. Найдите ошибку.
  explanation: removeEventListener удаляет слушатель, только если ему передали **ту же ссылку** на функцию. Две одинаковые стрелочные функции — это разные объекты. Нужно сохранить обработчик в переменную (`const onResize = ...`) и передать её и в add, и в remove.
  type: find-bug
  language: tsx
  code: |-
    function useWindowWidth() {
      const [width, setWidth] = useState(0);
      useEffect(() => {
        window.addEventListener('resize', () =>
          setWidth(window.innerWidth)
        );
        return () => {
          window.removeEventListener('resize', () =>
            setWidth(window.innerWidth)
          );
        };
      }, []);
      return width;
    }
  bugLines:
    - 8
    - 9
  causes:
    - "Пустой массив зависимостей: эффект должен зависеть от width"
    - В remove передаётся новая функция, а не та, что была добавлена, поэтому слушатель не снимается
    - Cleanup нельзя возвращать из эффекта с пустыми зависимостями
    - setWidth нельзя вызывать внутри обработчика событий window
  answer: 1

- id: memory-leaks-heap-snapshot-recipe
  skill: memory-leak-investigation
  question: memory-leaks
  difficulty: 3
  prompt: "Подозрение: память растёт при каждом открытии и закрытии модалки. Соберите алгоритм поиска утечки."
  explanation: "Сценарий повторяют несколько раз: разовые аллокации (ленивые модули, кэши) тогда не маскируют рост. Comparison показывает, каких объектов стало больше, а Retainers — **кто их держит**. Именно эта цепочка ведёт к забытой подписке или ref. После фикса замер повторяют."
  type: order
  kind: recipe
  steps:
    - Сделать базовый heap snapshot во вкладке Memory
    - "Несколько раз повторить сценарий: открыть и закрыть модалку"
    - Сделать второй heap snapshot
    - В режиме Comparison отфильтровать по «Detached» и найти классы, число которых растёт
    - Открыть Retainers и найти цепочку ссылок, удерживающую объект
    - Исправить источник (cleanup, лимит кэша) и повторить замер

- id: memory-leaks-find-retainer
  skill: memory-leak-investigation
  question: memory-leaks
  difficulty: 2
  prompt: Известно, что после закрытия модалки с графиком DOM-узлы не освобождаются. Нужно выяснить, какой объект держит отсоединённый canvas. Что использовать?
  explanation: Каждый инструмент отвечает на свой вопрос. Performance monitor показывает, есть ли рост. Strict Mode подсказывает, где нет cleanup. Heap snapshot с Retainers отвечает, **кто держит** объект. Когда факт утечки известен, нужен именно он.
  type: choose-tool
  options:
    - label: "Heap snapshots в Memory: Comparison, фильтр «Detached» и просмотр Retainers"
      why: "Лучший выбор. Snapshot показывает отсоединённые узлы, а Retainers — цепочку ссылок до них: например, экземпляр Chart без destroy() или ref в стороннем коде."
    - label: Performance monitor (JS heap size и DOM nodes)
      why: "Хорош на первом шаге: подтверждает, что память и число узлов растут со временем. Но не показывает, какой объект держит ссылку."
    - label: React DevTools Profiler
      why: Измеряет рендеры и коммиты, а не память. Подходит, если интерфейс тормозит из-за лишних ререндеров.
    - label: Включить Strict Mode и посмотреть на двойной mount
      why: "В dev быстро выявляет эффекты без cleanup: дубли подписок становятся заметны. Но цепочку удержания конкретного canvas он не покажет."
  answer: 0
