# Черновик упражнений: «Что делает useDeferredValue и чем он отличается от debounce?» (use-deferred-value)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only use-deferred-value

# исправлено ревьюером:
# Верный вариант длиннее 140 символов (около 143) и заметно длиннее остальных, что подсказывает ответ. Сократил его.
- id: use-deferred-value-vs-debounce-quiz
  skill: deferred-value-vs-debounce
  question: use-deferred-value
  difficulty: 3
  prompt: Что делает `useDeferredValue` и чем он принципиально отличается от debounce?
  explanation: "`useDeferredValue` управляет приоритетом рендера, а не временем. React рендерит срочное обновление со старым значением, затем в фоне с новым и прерывает фоновый рендер при новом вводе. Задержки нет: отставание зависит от скорости устройства. Сократить запросы к API так нельзя — для этого нужен debounce."
  type: quiz
  options:
    - label: "Отдаёт отстающую копию: срочный рендер со старым значением, затем прерываемый фоновый с новым, без фиксированной задержки"
      why: Верно. На быстром устройстве значение догоняет почти сразу, на медленном отстаёт, а ввод не блокируется.
    - label: "Это встроенный debounce: значение обновляется через фиксированную паузу после последнего изменения"
      why: Таймера нет. React начинает фоновый рендер сразу после срочного, а не после паузы во вводе.
    - label: "Сокращает число запросов к API: отложенное значение меняется реже, чем исходное"
      why: На быстром устройстве отложенное значение обновляется почти на каждый символ. Если нужно меньше запросов, используйте debounce.
    - label: Тяжёлый потомок не рендерится, пока ввод не стихнет, даже без memo
      why: Без memo потомок перерисуется в срочном проходе со старым значением, потому что перерисовывается родитель. Выигрыша не будет.
  answer: 0

# вычитка: дописано тело SlowList — код обрывался на открывающей скобке
- id: use-deferred-value-missing-memo
  skill: deferred-value-memo
  question: use-deferred-value
  difficulty: 2
  prompt: Проект без React Compiler. Ввод всё равно лагает, хотя список получает отложенное значение. Найдите строку с причиной.
  explanation: При каждом нажатии Search перерисовывается срочно, и вместе с ним SlowList — пусть со старым deferred, но вся тяжёлая работа выполняется. `memo(SlowList)` пропустит срочный проход, потому что props не изменились, и тяжёлым останется только прерываемый фоновый рендер. React Compiler мемоизирует такое автоматически.
  type: find-bug
  language: tsx
  code: |-
    function Search() {
      const [query, setQuery] = useState('');
      const deferred = useDeferredValue(query);
      const onChange = (e: ChangeEvent<HTMLInputElement>) =>
        setQuery(e.target.value);
      return (
        <>
          <input value={query} onChange={onChange} />
          <SlowList query={deferred} />
        </>
      );
    }

    function SlowList({ query }: { query: string }) {
      return <ul>{renderThousandsOfRows(query)}</ul>;
    }
  bugLines:
    - 14
  causes:
    - SlowList не обёрнут в memo и тяжело рендерится в каждом срочном проходе со старым значением
    - useDeferredValue нужно передать задержку в мс вторым аргументом, иначе откладывания нет
    - В input нужно передавать deferred вместо query, иначе срочный рендер не отложится
    - Вызов setQuery нужно обернуть в setTimeout, чтобы useDeferredValue заработал
  answer: 0

- id: use-deferred-value-external-prop
  skill: deferred-value-for-heavy-render
  question: use-deferred-value
  difficulty: 3
  prompt: Компонент `Chart` получает `filter` через props из сторонней формы, её код менять нельзя. Тяжёлый рендер графика тормозит ввод в форме. Запросов к API нет. Что выбрать?
  explanation: "Правило: контролируете вызов `setState` — берите `useTransition`. Значение пришло извне (props, сторонний хук) — `useDeferredValue` + `memo`. Нужно реже ходить в сеть — debounce. `useMemo` не делает рендер прерываемым."
  type: choose-tool
  options:
    - label: useDeferredValue(filter) + memo на тяжёлом графике
      why: Значение приходит извне, обновление не обернуть. Отложенная копия даёт прерываемый фоновый рендер, ввод остаётся отзывчивым.
    - label: useTransition вокруг обновления filter
      why: Подошёл бы, если бы setState был в нашем коде. Здесь он внутри сторонней формы, обернуть его в startTransition нельзя.
    - label: Debounce filter на 300 мс
      why: Уместен для сокращения запросов к API. Для рендера это фиксированная задержка даже на быстром устройстве, а сам тяжёлый рендер всё равно блокирует поток.
    - label: useMemo для вычисления данных графика
      why: Помогает, только если тяжёлое вычисление повторяется с теми же входами. При новом filter расчёт всё равно синхронный и блокирует ввод.
  answer: 0

- id: use-deferred-value-render-timeline
  skill: deferred-value-rendering
  question: use-deferred-value
  difficulty: 3
  prompt: Search с `useDeferredValue` и memo-списком. Пользователь ввёл «a», а пока шёл фоновый рендер — ещё «b». Расставьте события по порядку.
  explanation: "Срочный проход всегда идёт первым и использует старое отложенное значение — поэтому ввод мгновенный. Фоновый рендер прерываем: новый ввод отбрасывает незавершённую работу. На экран попадает только актуальное отложенное значение «ab», промежуточное «a» может так и не закоммититься."
  type: order
  kind: timeline
  steps:
    - "Срочный рендер: query = 'a', deferredQuery остаётся ''"
    - "Коммит: в input видно 'a', memo-список не перерисовался"
    - Начинается фоновый рендер с deferredQuery = 'a'
    - Ввод 'b' прерывает фоновый рендер, его результат отброшен
    - Срочный рендер и коммит с query = 'ab'
    - Фоновый рендер и коммит с deferredQuery = 'ab'
