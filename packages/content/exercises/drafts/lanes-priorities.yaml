# Черновик упражнений: «Как React приоритизирует обновления (lanes)?» (lanes-priorities)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only lanes-priorities

- id: lanes-priorities-why
  skill: update-priorities
  question: lanes-priorities
  difficulty: 3
  prompt: Зачем React присваивает каждому обновлению приоритет (lane) и что это даёт на практике?
  explanation: "Главная идея lanes: срочный ввод не должен ждать тяжёлый рендер. Высокоприоритетные lanes обрабатываются первыми, transition-рендер прерываемый. Защита от starvation: если lane слишком долго откладывается, он помечается просроченным и выполняется синхронно."
  type: quiz
  options:
    - label: Срочные обновления (ввод, клик) обрабатываются первыми, а низкоприоритетный рендер можно прервать и потом начать заново
      why: Верно. Планировщик берёт самые приоритетные lanes, прерывает transition-рендер ради срочного обновления и затем повторяет его с актуальными данными.
    - label: Приоритет задаёт лишь порядок коммитов в DOM, а каждый начатый рендер всегда доводится до конца
      why: "Неверно. Конкурентный рендер в transition lane прерываемый: незавершённую работу React отбрасывает и начинает заново."
    - label: Transition-обновления рендерятся параллельно в отдельном потоке, поэтому не блокируют ввод
      why: "Неверно. Рендер идёт в основном потоке, просто нарезан на кусочки: примерно каждые 5 мс Scheduler отдаёт управление браузеру."
    - label: Низкоприоритетные обновления откладываются бесконечно, пока есть хотя бы одно срочное
      why: "Неверно. Есть защита от starvation: просроченный lane выполняется синхронно, чтобы обновление не голодало вечно."
  answer: 0

- id: lanes-controlled-input-transition
  skill: transition-urgent-split
  question: lanes-priorities
  difficulty: 2
  prompt: При быстром наборе текст в поле отстаёт и «догоняет» рывками. Найдите строку с ошибкой.
  explanation: "Значение контролируемого инпута — срочное обновление, оно должно идти в SyncLane. Через startTransition оно попадает в прерываемый lane, и value отстаёт от ввода. Правило: setQuery вызывать синхронно, а в transition (или через useDeferredValue) отправлять только тяжёлую часть — фильтрацию результатов."
  type: find-bug
  language: tsx
  code: |-
    function SearchPage() {
      const [query, setQuery] = useState('');
      const [, startTransition] = useTransition();
      function update(value: string) {
        startTransition(() => setQuery(value));
      }
      return (
        <div>
          <input value={query}
            onChange={(e) => update(e.target.value)} />
          <Results query={query} />
        </div>
      );
    }
  bugLines:
    - 5
  causes:
    - "Состояние контролируемого инпута обновляется в transition lane: рендер прерывается, и value отстаёт от ввода"
    - useTransition нельзя использовать, не забрав из него isPending
    - startTransition можно вызывать только прямо в JSX-обработчике, а не во вложенной функции
    - Results не обёрнут в memo, поэтому transition не может прервать его рендер
  answer: 0

- id: lanes-interrupt-transition-timeline
  skill: update-priorities
  question: lanes-priorities
  difficulty: 3
  prompt: Идёт тяжёлый рендер из startTransition, и пользователь вводит символ. Расставьте события по порядку.
  explanation: Transition-рендер нарезан на части, и между ними Scheduler отдаёт управление браузеру, поэтому событие ввода успевает обработаться. Срочный lane важнее, поэтому незавершённый transition-рендер отбрасывается. После коммита ввода React заново рендерит transition, уже с последними данными.
  type: order
  kind: timeline
  steps:
    - setResults внутри startTransition получает transition lane
    - React начинает прерываемый рендер и примерно каждые 5 мс отдаёт управление браузеру
    - "Браузер обрабатывает ввод: setQuery получает срочный SyncLane"
    - React отбрасывает незавершённый transition-рендер
    - "Срочное обновление рендерится и коммитится: поле сразу показывает символ"
    - Transition-рендер начинается заново с актуальными данными

# исправлено ревьюером:
# Правильный вариант неполон. Если фильтровать по deferredQuery прямо в рендере без memo или useMemo, срочный рендер с новым query снова выполнит тяжёлую фильтрацию, и ввод продолжит лагать. useDeferredValue работает только в паре с мемоизированным списком.
# Пояснение к useMemo вводит в заблуждение: useMemo по deferredQuery как раз является частью правильного решения. Сам по себе, по query, он не делает рендер прерываемым.
- id: lanes-deferred-heavy-list
  skill: deferred-value-for-heavy-render
  question: lanes-priorities
  difficulty: 2
  prompt: Компонент получает query через props от чужого инпута, доступа к setQuery нет. По query синхронно фильтруется огромный локальный список, и на слабых устройствах лагает ввод. Запросов к серверу нет. Что выбрать?
  explanation: Если тяжёлая работа локальная, а setter недоступен, подходит useDeferredValue. Срочный рендер проходит со старым значением и пропускает мемоизированный список. Затем React рендерит список по новому значению в низкоприоритетном lane и прерывает этот рендер ради ввода. Без memo или useMemo выигрыша не будет. Debounce нужен, когда надо сократить само число операций, например запросов к API.
  type: choose-tool
  options:
    - label: useDeferredValue(query) и список в memo-компоненте (или useMemo), который зависит от отложенного значения
      why: "Лучший вариант: срочный рендер пропускает мемоизированный список, а новый список рендерится в прерываемом lane без фиксированной задержки."
    - label: Debounce query на 300 мс
      why: Задержка будет фиксированной даже на быстрых устройствах, а итоговый рендер всё равно блокирующий. Debounce уместен, чтобы реже слать запросы к API.
    - label: Обернуть setQuery в startTransition
      why: Setter недоступен. А если бы был, controlled input в transition стал бы «ленивым». startTransition хорош, когда вы сами владеете тяжёлым setState.
    - label: Только useMemo для результата фильтрации по query
      why: query меняется на каждый символ, поэтому фильтрация всё равно пересчитывается синхронно. Сам по себе useMemo не делает рендер прерываемым.
  answer: 0
