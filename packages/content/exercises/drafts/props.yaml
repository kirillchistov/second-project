# Черновик упражнений: «Что такое props и почему их нельзя менять?» (props)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only props

- id: props-readonly-why
  skill: props-immutability
  question: props
  difficulty: 1
  prompt: Почему компонент не должен менять полученные props?
  explanation: Props — входные данные от родителя, компонент — чистая функция от них. React не отслеживает мутации и сравнивает значения по ссылке, поэтому мутация ломает мемоизацию и делает UI непредсказуемым. Если данные должны меняться, нужен state у владельца данных, который передаст новые props.
  type: quiz
  options:
    - label: "Props принадлежат родителю: компонент — чистая функция от них, а менять данные должен владелец state"
      why: Верно. Мутация объекта родителя не вызывает рендер и ломает сравнение по ссылке (memo, зависимости эффектов). Поэтому изменение идёт через state и новые props.
    - label: React глубоко замораживает props, поэтому мутировать их технически невозможно
      why: В dev-режиме замораживается только сам объект props, и то неглубоко. Вложенные объекты и массивы мутируются без ошибок — и тихо ломают поведение.
    - label: Мутация props сразу запускает повторный рендер ребёнка, и получается бесконечный цикл
      why: "React вообще не следит за мутациями: рендер запускают только setState, смена контекста или рендер родителя. Мутация чаще приводит к тому, что UI не обновится."
    - label: Менять props можно, но только внутри useEffect, после того как рендер завершён
      why: "Правило не зависит от места: в эффекте мутация так же портит данные родителя. Чтобы изменить значение, вызывают колбэк из props или setState."
  answer: 0

- id: props-sort-mutation
  skill: props-immutability
  question: props
  difficulty: 2
  prompt: После рендера SortedList в другом месте страницы порядок items «сам» поменялся. Найдите строку с ошибкой.
  explanation: "Array.prototype.sort сортирует на месте и мутирует массив родителя. Ссылка не меняется, поэтому memo и зависимости эффектов не видят изменений, а другие потребители получают переставленные данные. Правило: из props только читаем — `items.toSorted(...)` или `[...items].sort(...)`."
  type: find-bug
  language: tsx
  code: |-
    function SortedList({ items }: { items: Item[] }) {
      const sorted = items.sort((a, b) =>
        a.title.localeCompare(b.title)
      );
      return (
        <ul>
          {sorted.map((i) => (
            <li key={i.id}>{i.title}</li>
          ))}
        </ul>
      );
    }
  bugLines:
    - 2
  causes:
    - sort сортирует массив на месте и мутирует items, принадлежащий родителю
    - Сортировку нужно обязательно обернуть в useMemo, иначе React выдаст ошибку
    - key={i.id} нестабилен после сортировки, нужно использовать индекс
    - localeCompare нельзя вызывать во время рендера — он зависит от локали браузера
  answer: 0

- id: props-callback-lift-state
  skill: props-callbacks-up
  question: props
  difficulty: 1
  prompt: "Допишите код: Toggle не хранит своё состояние, а сообщает родителю о нажатии через prop-колбэк."
  explanation: Данные идут вниз через props, события — вверх через функции в props. Ребёнок вызывает onToggle, родитель меняет state через setOn и передаёт новое on. Так у значения один владелец, и ребёнок остаётся чистой функцией от props.
  type: fill-tokens
  language: tsx
  code: |-
    type Props = { on: boolean; onToggle: (v: boolean) => void };

    function Toggle({ on, onToggle }: Props) {
      return (
        <button onClick={() => ___(!on)}>
          {on ? 'ON' : 'OFF'}
        </button>
      );
    }

    function Settings() {
      const [on, setOn] = ___(false);
      return <Toggle on={on} onToggle={___} />;
    }
  tokens:
    - onToggle
    - useState
    - setOn
  decoys:
    - useRef
    - setState
    - on

# исправлено ревьюером:
# В why для варианта с useEffect эффект подаётся как запасной путь, когда key не подходит. Документация React в этом случае рекомендует корректировать state прямо во время рендера, а эффект для синхронизации — антипаттерн.
- id: props-reset-copied-state
  skill: reset-state-with-key
  question: props
  difficulty: 2
  prompt: Форма EditName получает name выбранного пользователя, и поле можно править локально. При выборе другого пользователя поле должно сброситься на его имя. Как лучше?
  explanation: "`useState(prop)` берёт значение только при монтировании — это частый баг «скопировали props в state». Если локальный черновик нужно сбрасывать при смене сущности, проще всего пересоздать компонент через key. Если черновик не нужен — сделайте поле контролируемым родителем."
  type: choose-tool
  options:
    - label: <EditName key={user.id} name={user.name} /> — сброс через key
      why: "Лучший вариант: новый key — новый экземпляр, state заново инициализируется из props. Нет лишнего рендера со старым значением и кода синхронизации."
    - label: useEffect(() => setValue(name), [name]) внутри EditName
      why: Работает, но сначала отрисуется старое значение, а затем пройдёт ещё один рендер. Синхронизация через эффект — антипаттерн; если key не подходит, state корректируют во время рендера.
    - label: Оставить useState(name) — React обновит state при новом prop
      why: "Не обновит: начальное значение useState читается лишь при монтировании. Это и есть исходный баг."
    - label: Записать новое имя прямо в props.name из обработчика
      why: "Props только для чтения: мутация не вызовет рендер и испортит данные родителя. Чтобы поменять значение, нужен колбэк, и тогда state меняет родитель."
  answer: 0
