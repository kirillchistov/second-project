# Черновик упражнений: «Как выстроить стратегию тестирования фронтенда?» (testing-strategy)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only testing-strategy

- id: testing-strategy-trophy-quiz
  skill: testing-trophy-balance
  question: testing-strategy
  difficulty: 2
  prompt: Как распределить усилия по тестированию фронтенда, чтобы получить максимум уверенности в релизе при разумной цене поддержки?
  explanation: "«Тестовый трофей»: фундамент — статический анализ, основная масса — интеграционные тесты поведения, unit — для чистой логики, e2e — для немногих критичных путей. Метрика — уверенность в релизе, а не процент покрытия."
  type: quiz
  options:
    - label: Основа — TS и ESLint, основная масса — интеграционные тесты фич (Testing Library + MSW), unit для чистой логики, e2e для критичных путей
      why: Верно. Интеграционные тесты проверяют поведение как пользователь и почти не ломаются при рефакторинге. E2E дороги, поэтому их оставляют для регистрации, оплаты и подобных путей.
    - label: "Классическая пирамида: максимум unit-тестов на каждый компонент и хук с моками дочерних, цель — 100% покрытия"
      why: Такие тесты привязаны к деталям реализации и ломаются при каждом рефакторинге. Покрытие растёт, а уверенность в том, что фича работает целиком, — нет.
    - label: "Покрыть все сценарии e2e на Playwright: они ближе всего к пользователю, значит дают больше всего уверенности"
      why: E2E медленные и чаще бывают нестабильными. Сотни таких тестов тормозят PR и приучают команду игнорировать красные прогоны.
    - label: Хватит TypeScript strict и линтера, а тесты фронтенду нужны только для сложных утилит
      why: "Статический анализ ловит ошибки типов и нарушения правил хуков, но не проверяет поведение: что форма отправляется и ошибка API показывается."
  answer: 0

# исправлено ревьюером:
# vi.mock подменяет модули, а не глобальный fetch: для fetch применяют vi.spyOn(globalThis, 'fetch') или vi.stubGlobal. Формулировку дистрактора исправил, чтобы он не учил неточному API.
- id: testing-strategy-catalog-filter-layer
  skill: testing-layer-choice
  question: testing-strategy
  difficulty: 2
  prompt: "Каталог: выбор категории делает запрос к API, и список должен обновиться. При ответе 500 нужно показать ошибку и кнопку «Повторить». Тест запускается на каждом PR и должен быть быстрым. Что выбрать?"
  explanation: "Поведение фичи вместе с сетью — это класс задач для интеграционного теста: MSW подменяет API на сетевом уровне, Testing Library взаимодействует с UI как пользователь. E2E оставляют для критичных сквозных путей, unit — для чистой логики."
  type: choose-tool
  options:
    - label: "Интеграционный тест страницы: Testing Library + MSW в Vitest"
      why: "Лучший выбор: проверяется поведение целиком, ответы 200 и 500 легко задать хендлерами MSW. Тест быстрый, детерминированный и не зависит от стенда."
    - label: E2E-тест в Playwright на стенде с реальным бэкендом
      why: Подходит для критичного пути вроде оплаты. Здесь он медленнее, к тому же получить стабильный ответ 500 от реального API сложно.
    - label: Unit-тест хука фильтра с замоканным fetch (vi.spyOn)
      why: Годится для чистой логики, например построения query-параметров. Но такой тест не проверит, что пользователь увидит список, ошибку и кнопку.
    - label: Скриншот-тест в Storybook + Chromatic
      why: Ловит регрессии вёрстки в дизайн-системе. Логику запроса, обновление списка и повтор после ошибки он не проверяет.
  answer: 0

- id: testing-strategy-playwright-flaky-wait
  skill: playwright-web-first-assertions
  question: testing-strategy
  difficulty: 2
  prompt: Тест иногда падает в CI, хотя локально проходит. Найдите причину нестабильности.
  explanation: "isVisible() проверяет состояние один раз и не ждёт, а фиксированная пауза — это лотерея. Если сервер ответит позже 1 с, тест упадёт. Правило: вместо пауз используйте web-first assertions, например await expect(locator).toBeVisible(). Они повторяют проверку до таймаута."
  type: find-bug
  language: ts
  code: |-
    test('итог заказа', async ({ page }) => {
      await page.goto('/cart');
      await page
        .getByRole('button', { name: 'Оформить' })
        .click();
      await page.waitForTimeout(1000);
      const heading = page.getByRole('heading', {
        name: 'Заказ оформлен',
      });
      expect(await heading.isVisible()).toBe(true);
    });
  bugLines:
    - 6
    - 10
  causes:
    - "Фиксированная пауза и разовая проверка isVisible(): при медленном ответе тест упадёт. Нужно await expect(heading).toBeVisible() с автоожиданием"
    - click() не ждёт появления кнопки, поэтому перед ним нужен page.waitForSelector
    - getByRole не умеет искать заголовки по name, поэтому локатор иногда ничего не находит
    - "page.goto нужно вызывать с { waitUntil: 'networkidle' }, иначе клик срабатывает до загрузки JS"
  answer: 0

# исправлено ревьюером:
# Порядок шагов 2 и 3 спорный: trace упавшего прогона из CI доступен сразу, и его логично изучить ещё до локального воспроизведения. Шаг 3 переформулирован: теперь он явно опирается на воспроизведённое падение.
# Первая фраза explanation про ретраи уводит от сути порядка. Explanation перестроен.
- id: testing-strategy-flaky-test-recipe
  skill: flaky-test-investigation
  question: testing-strategy
  difficulty: 3
  prompt: В CI появился нестабильный e2e-тест. Расставьте шаги разбора по порядку.
  explanation: "Флак сначала замечают по отчёту: ретраи допустимы, только если попадают в отчёт. Затем его воспроизводят многократными прогонами с включённым trace и по trace находят причину. Типичные причины — фиксированные паузы, общие тестовые данные, зависимость от порядка тестов. После исправления тест возвращают в обязательный набор только после стабильных повторных прогонов."
  type: order
  kind: recipe
  steps:
    - "Заметить флак по отчёту: тест прошёл только после ретрая"
    - Воспроизвести падение, прогнав тест многократно (--repeat-each, --trace on) в условиях, близких к CI
    - "Изучить trace воспроизведённого падения: шаги, сеть, DOM в момент ошибки"
    - "Устранить причину: заменить паузы на автоожидающие проверки, изолировать тестовые данные"
    - Снова прогнать тест многократно и вернуть его в обязательный набор
