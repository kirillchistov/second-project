# Черновик упражнений: «Зачем нужен key и почему индекс — плохой ключ?» (keys)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only keys

- id: keys-random-key-in-render
  skill: list-keys
  question: keys
  difficulty: 1
  prompt: Пользователь печатает в любом поле, и после каждого символа поле теряет фокус. Найдите строку с ошибкой.
  explanation: "При каждом вводе родитель перерендеривается. `crypto.randomUUID()` в рендере даёт новый key, поэтому React считает каждый `li` новым элементом: старый DOM удаляется, создаётся новый, и фокус теряется. Ключ должен быть стабильным: здесь подходит `tag.id`."
  type: find-bug
  language: tsx
  code: |-
    function TagEditor({ tags, onRename }: Props) {
      return tags.map((tag) => (
        <li key={crypto.randomUUID()}>
          <input
            value={tag.label}
            onChange={(e) =>
              onRename(tag.id, e.target.value)
            }
          />
        </li>
      ));
    }
  bugLines:
    - 3
  causes:
    - Ключ генерируется заново на каждом рендере, поэтому React пересоздаёт `li` и `input`, и фокус теряется
    - Управляемый input теряет фокус, если value приходит из props. Нужен defaultValue
    - Ключ нужно ставить на `input`, а не на `li`, иначе React не сопоставит поля
    - Инлайн-функция в onChange пересоздаётся на каждом рендере, и из-за этого React перемонтирует input
  answer: 0

# исправлено ревьюером:
# Код занимает 15 строк при лимите 14. Убрана пустая строка между компонентами.
# Логика и ответ верны. Варианты переведены в формат {label, why} с пояснениями.
- id: keys-reset-state-by-key
  skill: reset-state-with-key
  question: keys
  difficulty: 2
  prompt: Приложение отрендерили (без StrictMode), затем один раз нажали next. Что будет на экране в двух абзацах?
  explanation: Начальное значение useState читается только при монтировании. Первый Note остаётся тем же компонентом на той же позиции и сохраняет «note 1». У второго Note сменился key, поэтому React размонтирует его и создаёт заново со свежим состоянием. Так состояние сбрасывают без эффекта.
  type: predict-output
  language: tsx
  code: |-
    function Note({ id }: { id: number }) {
      const [text] = useState(`note ${id}`);
      return <p>{text}</p>;
    }
    function App() {
      const [id, setId] = useState(1);
      return (
        <>
          <Note id={id} />
          <Note key={id} id={id} />
          <button onClick={() => setId(2)}>next</button>
        </>
      );
    }
  options:
    - note 1, note 2
    - note 2, note 2
    - note 1, note 1
    - note 2, note 1
  answer: 0

# исправлено ревьюером:
# Пояснение (why) к верному варианту длиннее 140 символов. Текст сокращён без потери смысла.
- id: keys-no-id-in-data
  skill: list-keys
  question: keys
  difficulty: 2
  prompt: Редактируемый список пунктов чек-листа хранится как массив строк, id у пунктов нет. Пункты можно добавлять, удалять и перетаскивать. У каждой строки есть локальный флаг «редактируется». Какой key выбрать?
  explanation: Если в данных нет id, его нужно создать один раз в момент появления элемента (при добавлении или загрузке) и хранить вместе с данными. Генерировать ключ в рендере нельзя. Индекс подходит только для статичного списка, текст — только если он гарантированно уникален и не меняется.
  type: choose-tool
  options:
    - label: Хранить пункты как объекты и присваивать id через crypto.randomUUID() в обработчике добавления
      why: "Лучший вариант: id создаётся один раз и остаётся с пунктом, поэтому флаг «редактируется» не переезжает к соседу."
    - label: key={index}
      why: Подходит только для статичного списка. При удалении или перетаскивании флаг останется на позиции и окажется у другого пункта.
    - label: key={text} — текст пункта
      why: Годится, если текст уникален и неизменен. Здесь он редактируется (строка пересоздаётся) и может повторяться (дубли ключей).
    - label: key={crypto.randomUUID()} прямо в map
      why: "Не подходит никогда: на каждом рендере ключ новый, все строки пересоздаются, состояние и фокус теряются."
  answer: 0
