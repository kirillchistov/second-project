# Черновик упражнений: «Как организовать аутентификацию в SPA?» (spa-auth)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only spa-auth

- id: spa-auth-client-checks-ux-only
  skill: spa-auth-server-authorization
  question: spa-auth
  difficulty: 2
  prompt: В админке кнопка «Удалить пользователя» скрыта от обычных ролей, а маршрут /admin обёрнут в RequireAuth с проверкой роли. Этого достаточно для защиты?
  explanation: "Клиентский код целиком у пользователя: его можно изменить, а API — вызвать напрямую через curl. Поэтому RequireAuth, скрытые кнопки и роли в UI нужны только для удобства. Право на каждое действие проверяет сервер по сессии или токену при каждом запросе."
  type: quiz
  options:
    - label: "Нет: проверки на клиенте — только UX, сервер обязан проверять права на каждый запрос к API"
      why: Верно. Запрос DELETE можно отправить в обход интерфейса, поэтому решение о доступе принимает только сервер.
    - label: "Да, если роль хранится в httpOnly cookie: JS её не прочитает и не подменит"
      why: httpOnly защищает cookie от чтения при XSS, но не от прямых запросов к API. Для них проверка на клиенте просто не выполняется.
    - label: Да, если сборка минифицирована и роли не видны в исходниках
      why: Минификация не защищает. Код всё равно можно прочитать и изменить в DevTools, а API доступен напрямую.
    - label: Нужно дополнительно проверять роль в loader маршрута — тогда клиентская защита станет полной
      why: Loader тоже выполняется в браузере пользователя. Он улучшает UX, например убирает мерцание, но не заменяет проверку на сервере.
  answer: 0

- id: spa-auth-require-auth-flicker
  skill: spa-auth-protected-routes
  question: spa-auth
  difficulty: 2
  prompt: Залогиненного пользователя после перезагрузки на защищённой странице выкидывает на /login. Найдите причину.
  explanation: "Пока запрос /me в полёте, user ещё undefined, и обёртка сразу делает редирект. Правило: у защищённого маршрута три состояния — загрузка, гость, пользователь. Сначала `if (isLoading) return <Spinner />`, и только потом проверка !user."
  type: find-bug
  language: tsx
  code: |-
    function RequireAuth({ children }: Props) {
      const { user, isLoading } = useCurrentUser();
      const location = useLocation();

      if (!user) {
        return (
          <Navigate to="/login" replace
            state={{ from: location }} />
        );
      }
      return children;
    }
  bugLines:
    - 5
  causes:
    - "Нет проверки isLoading: пока запрос текущего пользователя не завершён, user пуст, и срабатывает редирект"
    - replace в Navigate стирает историю, поэтому сессия теряется
    - "Передавать location в state нельзя: объект не сериализуется"
    - children нужно обернуть во фрагмент, иначе компонент не отрендерится
  answer: 0

# исправлено ревьюером:
# Refresh-запрос идёт на относительный URL '/api/auth/refresh', то есть на origin самого SPA, хотя по условию API живёт на другом поддомене. Для same-origin запроса приманка 'same-origin' тоже отправит cookie, поэтому третий пропуск неоднозначен. Исправлено: refresh-эндпоинт указан абсолютным URL на поддомене API.
- id: spa-auth-single-refresh-interceptor
  skill: spa-auth-token-refresh
  question: spa-auth
  difficulty: 3
  prompt: "API на другом поддомене, сессия в cookie. Допишите обёртку над fetch: при истёкшем токене все параллельные запросы должны дождаться одного refresh и повторить запрос."
  explanation: "Общий промис и `??=` дают ровно один refresh на всю пачку упавших запросов. `finally` сбрасывает промис при любом исходе, чтобы следующий 401 запустил новый refresh. `credentials: 'include'` нужен, чтобы cookie ушла на другой origin."
  type: fill-tokens
  language: tsx
  code: |-
    let refreshing: Promise<void> | null = null;
    async function request(url: string, init?: RequestInit) {
      const opts: RequestInit = { ...init, credentials: 'include' };
      let res = await fetch(url, opts);
      if (res.status === ___) {
        refreshing ___ fetch('https://api.example.com/auth/refresh', {
          method: 'POST', credentials: '___',
        }).then(() => undefined)
          .___(() => { refreshing = null; });
        await refreshing;
        res = await fetch(url, opts);
      }
      return res;
    }
  tokens:
    - "401"
    - ??=
    - include
    - finally
  decoys:
    - "403"
    - =
    - same-origin
    - catch

- id: spa-auth-refresh-token-storage
  skill: spa-token-storage
  question: spa-auth
  difficulty: 2
  prompt: "SPA с долгой сессией: пользователь не должен перелогиниваться после перезагрузки вкладки, а при XSS refresh-токен не должен утечь. Где хранить refresh-токен?"
  explanation: "Схема по умолчанию: refresh-токен или сессия — в httpOnly Secure SameSite cookie, короткий access-токен — в памяти JS. Цена такого выбора — защита от CSRF: помогают SameSite и CSRF-токен. Для OAuth добавьте PKCE или BFF."
  type: choose-tool
  options:
    - label: httpOnly Secure SameSite cookie
      why: "Лучший выбор. JS не может прочитать cookie, поэтому XSS её не украдёт, а после перезагрузки она сохраняется. Нужна защита от CSRF: SameSite и CSRF-токен."
    - label: localStorage
      why: Переживает перезагрузку и прост в использовании, но любой внедрённый скрипт прочитает токен. Допустим лишь при низких требованиях к безопасности.
    - label: Переменная в памяти (замыкание или стор)
      why: Хорошее место для короткого access-токена, но после перезагрузки он пропадает. Без cookie-сессии пользователю придётся логиниться заново.
    - label: sessionStorage
      why: Живёт только в пределах вкладки и так же доступен JS при XSS. Безопасности не добавляет, а новые вкладки остаются без сессии.
  answer: 0
