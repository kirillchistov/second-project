# Черновик упражнений: «Какую проблему решает useEffectEvent?» (use-effect-event)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only use-effect-event

# исправлено ревьюером:
# В «why» четвёртого варианта фраза «обычный обработчик и без эффекта» построена неграмотно и непонятна по смыслу.
- id: use-effect-event-purpose
  skill: effect-event-reactive-split
  question: use-effect-event
  difficulty: 3
  prompt: Какую проблему решает useEffectEvent?
  explanation: "Эффект перезапускается от реактивных значений (roomId), а событие эффекта лишь читает свежие (theme) и в зависимости не входит. Это разделение логики, а не обход линтера. До React 19.2 то же делали через useRef с «latest value»: ref обновляли в эффекте и читали ref.current."
  type: quiz
  options:
    - label: Позволяет эффекту читать актуальные props и state, не делая их зависимостями, чтобы он не перезапускался от их изменений
      why: "Верно. Функция-событие всегда видит последние значения, но не реактивна: эффект синхронизируется только с тем, что реально требует переподключения."
    - label: Делает ссылку на колбэк стабильной, чтобы безопасно передавать его в дочерние компоненты, как useCallback без зависимостей
      why: Событие эффекта нельзя передавать в другие компоненты и хуки. Для стабильного колбэка в props нужен useCallback (или React Compiler).
    - label: Разрешает убрать из массива зависимостей любое значение, чтобы линтер перестал ругаться
      why: Это не обход линтера. Если обернуть реактивную логику, эффект перестанет реагировать на реальные изменения. Сначала проверьте, нужна ли зависимость вообще.
    - label: Переносит логику эффекта в обработчик событий, чтобы она запускалась по действию пользователя, а не после рендера
      why: Событие эффекта вызывается только из эффектов, а не из обработчиков. Для логики «по клику» достаточно обычного обработчика, эффект там не нужен.
  answer: 0

- id: use-effect-event-chat-room
  skill: effect-event-reactive-split
  question: use-effect-event
  difficulty: 2
  prompt: "Допишите код: чат переподключается при смене roomId, а уведомление показывается с актуальной theme без переподключения при смене темы."
  explanation: "theme читается внутри события эффекта, поэтому в зависимостях только roomId. Само событие в массив зависимостей не добавляют: оно не реактивно, и линтер это знает. С useCallback пришлось бы указать theme — и смена темы снова переподключала бы чат."
  type: fill-tokens
  language: tsx
  code: |-
    function ChatRoom({ roomId, theme }: Props) {
      const onConnected = ___(() => {
        showNotification('Подключено!', theme);
      });
      useEffect(() => {
        const conn = createConnection(roomId);
        conn.on('connected', () => ___());
        conn.connect();
        return () => conn.disconnect();
      }, [___]);
    }
  tokens:
    - useEffectEvent
    - onConnected
    - roomId
  decoys:
    - useCallback
    - theme
    - useRef

- id: use-effect-event-wraps-everything
  skill: effect-event-misuse
  question: use-effect-event
  difficulty: 3
  prompt: Пользователь переходит в другую комнату, но чат остаётся подключён к старой. Найдите ошибку.
  explanation: "roomId — реактивное значение, от него зависит, к чему подключаться. Его спрятали в событие эффекта и опустошили зависимости, поэтому эффект отработал один раз. Правило: в useEffectEvent — только то, что нужно прочитать, а не то, с чем надо синхронизироваться. Исправление: createConnection(roomId) в эффекте и [roomId] в зависимостях."
  type: find-bug
  language: tsx
  code: |-
    function ChatRoom({ roomId, theme }: Props) {
      const connect = useEffectEvent(() => {
        const conn = createConnection(roomId);
        conn.on('connected', () => {
          showNotification('Подключено!', theme);
        });
        conn.connect();
        return conn;
      });
      useEffect(() => {
        const conn = connect();
        return () => conn.disconnect();
      }, []);
    }
  bugLines:
    - 3
    - 13
  causes:
    - Реактивный roomId читается внутри события эффекта, а зависимости пусты — эффект не перезапускается при смене комнаты
    - Событие эффекта нельзя вызывать внутри useEffect, только в обработчиках
    - connect нужно добавить в массив зависимостей, иначе эффект видит устаревшую функцию
    - Функция из useEffectEvent не может возвращать значение, поэтому cleanup не работает
  answer: 0

# исправлено ревьюером:
# Объяснение варианта с eslint-disable фактически неверно. При зависимостях [url] эффект перезапускается со свежим замыканием, поэтому видит cartCount рендера, в котором сменился url. Устаревшего значения «первого рендера» здесь не будет. Реальный вред в другом: линтер перестаёт ловить пропущенные зависимости при будущих правках, а нереактивное чтение остаётся неявным.
- id: use-effect-event-analytics-visit
  skill: effect-event-reactive-split
  question: use-effect-event
  difficulty: 2
  prompt: Нужно логировать визит при каждой смене url и передавать в лог текущее число товаров в корзине. Изменение корзины не должно создавать новый визит. React 19.2. Что выбрать?
  explanation: "Задача типовая: эффект должен реагировать на url, но лишь читать cartCount. useEffectEvent — штатный способ это разделить: logVisit читает cartCount, а в зависимостях только [url]. До 19.2 использовали ref с последним значением. Подавление линтера опасно: оно скрывает и настоящие пропущенные зависимости."
  type: choose-tool
  options:
    - label: useEffectEvent для логирования, в зависимостях эффекта только url
      why: Событие эффекта видит актуальный cartCount, но не реактивно — визит логируется только при смене url.
    - label: Добавить cartCount в зависимости эффекта
      why: Честно для линтера, но каждое изменение корзины даст лишний визит. Подходит, если эффект действительно должен реагировать на это значение.
    - label: useRef с последним cartCount, обновляемым в эффекте
      why: Рабочий паттерн до React 19.2. Сейчас это больше ручного кода с тем же смыслом — уместно, если версия React старше.
    - label: eslint-disable для строки с зависимостями
      why: Сегодня может работать, но нереактивное чтение остаётся неявным, а линтер перестанет ловить настоящие пропущенные зависимости при будущих правках эффекта.
  answer: 0
