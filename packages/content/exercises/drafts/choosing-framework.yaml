# Черновик упражнений: «Как выбрать между Next.js, React Router и SPA на Vite?» (choosing-framework)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only choosing-framework

- id: choosing-framework-criteria-quiz
  skill: framework-choice-criteria
  question: choosing-framework
  difficulty: 2
  prompt: Команда спорит, брать ли Next.js для нового React-проекта. С чего правильнее начать выбор?
  explanation: Фреймворк выбирают под требования, а не по популярности. Сначала выясните, нужны ли SEO и быстрый первый контент, где грузятся данные, нужны ли RSC, где будет хостинг, что знает команда и насколько важна независимость от вендора. Только после этого сравнивайте Next.js, React Router v7, TanStack Start и Vite SPA.
  type: quiz
  options:
    - label: "С требований: SEO и первый контент, где грузятся данные, нужны ли RSC, хостинг, опыт команды, зависимость от вендора"
      why: Верно. Эти критерии отделяют случаи, где SSR и RSC окупаются, от случаев, где они только добавляют серверную инфраструктуру.
    - label: "С популярности: документация React рекомендует фреймворки, значит, Next.js подходит для любого проекта"
      why: Популярность не заменяет требования. Для админки за логином Next.js — лишний сервер, кэши и деплой, а Vite SPA проще и дешевле.
    - label: "С производительности: SSR всегда быстрее SPA, поэтому SSR-фреймворк выигрывает в любом случае"
      why: SSR ускоряет первый контент, но нагружает сервер и усложняет кэширование. В приложении за логином с долгими сессиями выигрыш обычно мал.
    - label: "С Server Components: без RSC приложение на React 19 быстро устареет"
      why: RSC — опциональная модель с новыми ограничениями. Клиентские SPA на React 19 полностью поддерживаются и остаются нормальным выбором.
  answer: 0

- id: choosing-framework-internal-admin
  skill: spa-vs-ssr-choice
  question: choosing-framework
  difficulty: 2
  prompt: "Внутренняя админка за логином: много таблиц и форм, SEO не нужен. Фронтенд раздаётся статикой с nginx, данные идут из готового REST API. Что выбрать?"
  explanation: "Если приложение за логином, SEO нет, а API уже существует, SSR почти ничего не даёт, но добавляет сервер, кэши и сложный деплой. Разумный стек здесь: Vite SPA, клиентский роутер и TanStack Query для серверного состояния. SSR-фреймворк нужен, когда важны SEO, первый контент или RSC."
  type: choose-tool
  options:
    - label: Vite SPA + React Router / TanStack Router + TanStack Query
      why: "Лучший выбор: сборка в статику ложится на nginx, сервер не нужен. Кэш, refetch и мутации берёт на себя TanStack Query."
    - label: Next.js App Router с Server Components
      why: Подходит для SEO-критичных сайтов и тяжёлой загрузки данных на сервере. Здесь это лишний Node-сервер, кэши фреймворка и новые ограничения RSC.
    - label: React Router v7 в режиме фреймворка с SSR
      why: Хорош, если нужен SSR на loaders/actions или идёт миграция с Remix. Для статичной админки серверный рендер не окупается.
    - label: Astro
      why: "Силён на преимущественно статичном контенте: блоги, документация, лендинги. Для насыщенного интерактивного приложения он не предназначен."
  answer: 0

# исправлено ревьюером:
# Шаги 2 и 3 (модель данных и ограничения хостинга/команды) не зависят друг от друга, их можно поменять местами, и порядок становится спорным.
# Исправлено: требования и ограничения объединены в один шаг, остальные шаги выстроены в цепочку, где каждый опирается на результат предыдущего.
- id: choosing-framework-decision-recipe
  skill: framework-choice-criteria
  question: choosing-framework
  difficulty: 3
  prompt: Соберите алгоритм выбора фреймворка для нового React-проекта.
  explanation: "Сначала требования и ограничения: они определяют, нужен ли сервер вообще. По ним составляют шорт-лист, затем сравнивают кандидатов по сложности, кэшам и зависимости от вендора. Прототип на целевом хостинге выявляет скрытые проблемы: кэш, ISR и изображения при self-hosted. Запись в ADR фиксирует критерии, чтобы через годы было понятно, когда и как мигрировать."
  type: order
  kind: recipe
  steps:
    - "Собрать требования и ограничения: SEO, первый контент, данные на сервере, RSC, хостинг, опыт команды"
    - По требованиям составить шорт-лист подходящих фреймворков
    - Сравнить кандидатов по сложности, отладке кэшей и зависимости от вендора
    - Проверить прототипом критичный сценарий с деплоем на целевой хостинг
    - Записать решение и критерии в ADR, оценив стоимость будущей миграции
