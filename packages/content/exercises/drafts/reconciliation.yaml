# Черновик упражнений: «По каким эвристикам работает reconciliation?» (reconciliation)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only reconciliation

- id: reconciliation-heuristics-quiz
  skill: reconciliation-heuristics
  question: reconciliation
  difficulty: 3
  prompt: На каких эвристиках React сравнивает деревья за O(n) вместо O(n³)?
  explanation: "Две эвристики: разный тип элемента — новое поддерево, одинаковый тип — обновление атрибутов и рекурсия в детей; дети списка сопоставляются по key, без него — по индексу. React сравнивает результат рендера, а не входные props. Пропустить компонент можно через memo или bailout."
  type: quiz
  options:
    - label: Элементы разных типов дают разные деревья, а дети списка сопоставляются по key (без key — по индексу)
      why: Верно. Смена типа сносит поддерево целиком без сравнения детей. Для одного типа обновляются атрибуты, а дети сравниваются рекурсивно.
    - label: React глубоко сравнивает props и вызывает только те компоненты, у которых props изменились
      why: "Нет: без memo React просто вызывает компонент и сравнивает возвращённый результат. Bailout проверяет props по ссылке, а не глубоко."
    - label: React ищет минимальный набор правок, поэтому Counter внутри новой обёртки сохранит state
      why: Минимальная правка — задача O(n³), от неё отказались. При смене типа обёртки Counter размонтируется и потеряет state.
    - label: "key нужен, только чтобы убрать предупреждение: React и так сопоставит детей по типу и содержимому"
      why: Содержимое React не сравнивает. Без key дети сопоставляются по позиции, и при вставке в начало обновится каждый элемент.
  answer: 0

- id: reconciliation-wrapper-type-switch
  skill: reconciliation-type-change
  question: reconciliation
  difficulty: 2
  prompt: При повороте телефона (isMobile меняется) форма поиска теряет введённый текст и заново грузит подсказки. Где причина?
  explanation: "Тип родителя сменился с div на section, и React снёс поддерево целиком: SearchForm размонтировался вместе со state. Обёртка должна быть одного типа, а различия лучше выразить через className: `<div className={isMobile ? 'stack' : 'grid'}>`."
  type: find-bug
  language: tsx
  code: |-
    function Layout({ isMobile }: Props) {
      return isMobile ? (
        <div className="stack">
          <SearchForm />
        </div>
      ) : (
        <section className="grid">
          <SearchForm />
        </section>
      );
    }
  bugLines:
    - 3
    - 7
  causes:
    - Тип обёртки меняется (div ↔ section) — React размонтирует поддерево вместе с SearchForm и его state
    - У SearchForm нет key, поэтому React не может сопоставить его между рендерами
    - Тернарный оператор в JSX всегда пересоздаёт компоненты — нужен if с ранним return
    - Смена className заставляет React пересоздать DOM-узел и его детей
  answer: 0

- id: reconciliation-dynamic-tag-remount
  skill: reconciliation-type-change
  question: reconciliation
  difficulty: 2
  prompt: App смонтировали (без StrictMode), затем дважды кликнули по контейнеру. Что будет в консоли?
  explanation: "Динамический тег — это тоже смена типа: div → section → div. Каждый раз React уничтожает старое поддерево (cleanup → unmount) и монтирует Probe заново. Неважно, что сам Probe на том же месте и того же типа: сравнение до его детей просто не доходит."
  type: predict-output
  language: tsx
  code: |-
    function Probe() {
      useEffect(() => {
        console.log('mount');
        return () => console.log('unmount');
      }, []);
      return null;
    }
    function App() {
      const [wide, setWide] = useState(false);
      const Box = wide ? 'section' : 'div';
      const toggle = () => setWide(!wide);
      return <Box onClick={toggle}><Probe /></Box>;
    }
  options:
    - mount → unmount → mount → unmount → mount
    - mount
    - mount → mount → mount
    - mount → unmount → mount
  answer: 0

# исправлено ревьюером:
# В правильном варианте текст расходится с кодом: key={userId} в тексте и key={id} в коде.
# В why третьего варианта «соседних id одинаковой чётности» противоречиво: соседние id имеют разную чётность.
- id: reconciliation-reset-form-by-key
  skill: reset-state-with-key
  question: reconciliation
  difficulty: 2
  prompt: "`<EditProfile userId={id} />` хранит в useState десяток полей формы. При выборе другого пользователя в списке форма должна полностью сброситься. Как лучше?"
  explanation: "key — часть идентичности элемента: новый key означает новый компонент, и React монтирует его с чистым state. Это прямое применение эвристики reconciliation и рекомендованный способ сбросить state поддерева. Сброс через эффект даёт лишний рендер со старыми данными и требует вручную перечислять поля."
  type: choose-tool
  options:
    - label: "Передать id и в key: `<EditProfile key={id} userId={id} />`"
      why: "Лучший вариант: для React смена key означает новый экземпляр. Весь state поддерева сбрасывается без ручного кода и промежуточного рендера."
    - label: useEffect по [userId], который вызывает все setState с начальными значениями
      why: Работает, но сначала рендерится форма со старыми полями, а новое поле легко забыть сбросить. Подходит, если сбросить нужно лишь часть state.
    - label: Обернуть EditProfile в разные контейнеры в зависимости от чётности id
      why: "Это хак на смене типа: он неочевиден и не сработает при переходе между id одной чётности (2 → 4). key выражает то же намерение явно."
    - label: Обернуть EditProfile в memo с компаратором по userId
      why: memo только пропускает лишние рендеры и никогда не сбрасывает state. Он уместен, когда проблема в производительности, а не в идентичности.
  answer: 0
