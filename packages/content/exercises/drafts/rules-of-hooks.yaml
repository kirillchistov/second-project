# Черновик упражнений: «Какие есть правила хуков и почему они существуют?» (rules-of-hooks)
# Сгенерировано claude-opus-5-5, 2026-10-11. Проверено ревьюером-моделью, нужна вычитка человеком.
# Принять: npm run approve -w @rr/content -- --only rules-of-hooks

- id: rules-of-hooks-hook-in-handler
  skill: rules-of-hooks
  question: rules-of-hooks
  difficulty: 1
  prompt: Найдите строку, которая нарушает правила хуков.
  explanation: "Хуки вызываются только во время рендера, на верхнем уровне компонента. Обработчик срабатывает позже, вне рендера, и React не знает, к какому компоненту относится вызов. Решение: вызвать `useContext(AuthContext)` рядом с useState, а в обработчике использовать уже полученный token. То же правило действует для useEffect, useMemo и колбэков."
  type: find-bug
  language: tsx
  code: |-
    function LikeButton({ postId }: Props) {
      const [liked, setLiked] = useState(false);

      async function handleClick() {
        const { token } = useContext(AuthContext);
        await likePost(postId, token);
        setLiked(true);
      }

      return (
        <button onClick={handleClick}>{liked ? '♥' : '♡'}</button>
      );
    }
  bugLines:
    - 5
  causes:
    - useContext вызывается в обработчике события, а не на верхнем уровне компонента во время рендера
    - useState нужно объявлять после всех функций-обработчиков
    - Обработчик события не может быть async-функцией
    - "setLiked после await не сработает: обновление вне батча теряется"
  answer: 0

- id: rules-of-hooks-extract-list-item
  skill: rules-of-hooks
  question: rules-of-hooks
  difficulty: 2
  prompt: Раньше useState вызывался прямо внутри items.map. Допишите рефакторинг так, чтобы у каждого вопроса было своё состояние «открыт/закрыт».
  explanation: "Хук в цикле или в map нарушает правила: число вызовов зависит от длины списка. Стандартный приём — вынести элемент в отдельный компонент, где хук стоит на верхнем уровне. Стабильный key={item.id} привязывает состояние к данным, а не к позиции в списке."
  type: fill-tokens
  language: tsx
  code: |-
    function FaqList({ items }: { items: Faq[] }) {
      return items.map((item) => (
        <___ key={item.___} item={item} />
      ));
    }

    function FaqItem({ item }: { item: Faq }) {
      const [open, setOpen] = ___(false);
      return (
        <div onClick={() => setOpen(!open)}>
          {item.q} {open && item.a}
        </div>
      );
    }
  tokens:
    - FaqItem
    - id
    - useState
  decoys:
    - FaqList
    - index
    - useRef
    - use

- id: rules-of-hooks-conditional-use
  skill: use-hook-conditional
  question: rules-of-hooks
  difficulty: 3
  prompt: Клиентский компонент Post получает пропсом commentsPromise (создан в серверном компоненте) и флаг expanded. Комментарии нужны только при expanded=true, и прочитать их хочется прямо в этой ветке if. Над Post есть Suspense. Что выбрать?
  explanation: "`use` — исключение из правил хуков: он не хранит состояние в списке хуков, поэтому его можно вызывать в условиях и циклах. Пока промис не разрешился, компонент приостанавливается до ближайшего Suspense. Остальные хуки по-прежнему вызываются только на верхнем уровне."
  type: choose-tool
  options:
    - label: "`use(commentsPromise)` внутри `if (expanded)`"
      why: "Лучший выбор: use разрешено вызывать условно, он интегрирован с Suspense, лишнего состояния и эффекта не нужно."
    - label: useState + useEffect с `commentsPromise.then(setComments)` на верхнем уровне
      why: Работает, но это лишний рендер, ручная обработка загрузки и никакой интеграции с Suspense. Подходит для стека без Suspense.
    - label: Сделать Post async-компонентом и написать `await commentsPromise` в ветке if
      why: Async-компоненты поддерживаются только на сервере. В серверном компоненте await был бы уместен, а клиентский так делать нельзя.
    - label: Обернуть `useState` и `useEffect` в `if (expanded)`
      why: "Нарушает правила хуков: при переключении expanded число хуков меняется, и React падает с ошибкой."
  answer: 0
