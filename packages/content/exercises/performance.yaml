# memoize-multi-arg: принято из черновика 2026-11-07
- id: memoize-json-key-quiz
  skill: memoize-cache-key
  question: memoize-multi-arg
  difficulty: 2
  prompt: Почему ключ кэша `JSON.stringify(args)` в memoize ненадёжен, даже если функция чистая?
  explanation: "Ключ кэша должен однозначно отражать аргументы. JSON-сериализация теряет информацию: `undefined`, функции и `NaN` превращаются в `null` или пропадают. Кроме того, она зависит от порядка ключей. Для примитивов надёжнее вложенные `Map`, для объектов — `Map`/`WeakMap` по ссылке."
  type: quiz
  options:
    - label: Разные аргументы могут дать одинаковый ключ, а равные по содержимому объекты с другим порядком полей — разные ключи
      why: Верно. `[undefined]` и `[null]` оба дают "[null]", а `{a,b}` и `{b,a}` дают разные строки. Возможны и ложные попадания, и промахи.
    - label: "Главная проблема — скорость: на корректность результата сериализация не влияет"
      why: "Сериализация на каждом вызове действительно стоит CPU. Но хуже другое: из-за коллизий ключей memoize может вернуть результат, посчитанный для других аргументов."
    - label: JSON.stringify бросает исключение на любом объекте, поэтому подходит только для примитивов
      why: Обычные объекты сериализуются без ошибок. Исключение будет только на циклических ссылках и BigInt.
    - label: Map не может хранить слишком длинные строковые ключи, поэтому кэш теряет записи
      why: Ограничения на длину строкового ключа у Map на практике нет. Проблема в том, что сама строка неточно описывает аргументы.
  answer: 0
