  explanation: "Если аргумент — объект и важна идентичность, ключом служит сама ссылка. WeakMap держит ключ слабо: удалённый узел соберёт GC вместе с записью кэша. Для примитивов подходит Map или LRU, сериализация — только для простых случаев."
