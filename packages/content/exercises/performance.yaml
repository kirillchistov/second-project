  explanation: "Observer устраняет частые onScroll-события, но не гарантирует один вызов на страницу. Пока запрос летит, якорь может выйти и снова войти во viewport, а пересозданный observer сразу сообщает текущее пересечение. Правило: старт загрузки = якорь виден && !loading && hasMore."
