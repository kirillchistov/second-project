- id: memoize-nested-map-build
  skill: memoize-nested-map
  question: memoize-multi-arg
  difficulty: 2
  prompt: Соберите memoize для функции двух примитивных аргументов на вложенных Map — без сериализации.
  explanation: "Внешняя Map по первому аргументу хранит внутреннюю Map по второму. Map сравнивает ключи через SameValueZero, поэтому `NaN`, `null` и `undefined` различаются корректно. Проверять нужно через `has`, а не через truthy `get`: иначе результаты `0`, `''` и `false` никогда не попадут из кэша. WeakMap не принимает примитивы в качестве ключей."
  type: parsons
  language: ts
  lines:
    - "function memo2<A, B, R>(fn: (a: A, b: B) => R) {"
    - "  const cache = new Map<A, Map<B, R>>();"
    - "  return (a: A, b: B): R => {"
    - "    let inner = cache.get(a);"
    - "    if (!inner) {"
    - "      inner = new Map<B, R>();"
    - "      cache.set(a, inner);"
    - "    }"
    - "    if (inner.has(b)) return inner.get(b)!;"
    - "    const result = fn(a, b);"
    - "    inner.set(b, result);"
    - "    return result;"
    - "  };"
    - "}"
  distractors:
    - "    if (inner.get(b)) return inner.get(b)!;"
    - "  const cache = new WeakMap<A, Map<B, R>>();"
