  prompt: Поле валидируется через debounce. Пользователь отправляет форму до окончания паузы. Что должен сделать `flush()`?
  explanation: "`cancel` отбрасывает ожидающий вызов, а `flush` выполняет его прямо сейчас. В обоих случаях таймер гасится, а `lastArgs` сбрасывается. Если вызова в очереди нет, `flush` ничего не делает. Иначе получится двойной вызов или вызов с устаревшими аргументами."
  type: quiz
  options:
    - label: Если вызов ожидается — погасить таймер и сразу вызвать fn с последними накопленными аргументами
      why: "Верно. Отложенная работа выполняется синхронно и ровно один раз: таймер больше не сработает, а lastArgs сброшен."
    - label: Сразу вызвать fn с текущими данными формы и не трогать таймер — он сработает с теми же данными
      why: Таймер всё равно выстрелит, и fn вызовется второй раз. Это именно та ошибка, которую flush должен предотвращать.
    - label: Погасить таймер и отбросить аргументы, чтобы валидация не мешала отправке
      why: Это семантика cancel. Он нужен при размонтировании, а при отправке формы валидацию как раз нужно выполнить.
    - label: "Перезапустить таймер с нулевой задержкой: setTimeout(fn, 0)"
      why: Вызов остаётся асинхронным, и submit пройдёт раньше валидации. Немедленного выполнения не будет.
  answer: 0
- id: debounce-flush-double-call
  skill: debounce-cancel-flush
  question: debounce-cancel-flush
  difficulty: 2
  prompt: Форма вызывает `flush()` при отправке, и иногда `fn` срабатывает дважды. Найдите строку с ошибкой.
  explanation: "`flush` вызывает `fn`, но не делает `clearTimeout` и не сбрасывает `last`. Запланированный таймер позже снова вызовет `flush` с теми же аргументами. Правильно так: `if (!last) return; clearTimeout(timer); const a = last; last = undefined; fn(...a);`."
  type: find-bug
  language: ts
  code: |-
    function debounce<A extends unknown[]>(
      fn: (...args: A) => void, ms: number) {
      let timer: ReturnType<typeof setTimeout>;
      let last: A | undefined;
      const d = (...args: A) => {
        last = args;
        clearTimeout(timer);
        timer = setTimeout(() => d.flush(), ms);
      };
      d.cancel = () => { clearTimeout(timer); last = undefined; };
      d.flush = () => { if (last) fn(...last); };
      return d;
    }
  bugLines:
    - 11
  causes:
    - flush не гасит таймер и не сбрасывает last — запланированный вызов сработает ещё раз с теми же аргументами
    - cancel должен присваивать timer = undefined, иначе clearTimeout не сработает
    - "Таймер должен вызывать fn напрямую: вызов d.flush изнутри setTimeout приводит к рекурсии"
    - clearTimeout в d нужно вызывать после setTimeout, а не перед ним
  answer: 0
