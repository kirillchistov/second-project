- id: infinite-scroll-feed-with-query
  skill: infinite-scroll-approach-choice
  question: infinite-scroll-intersection-observer
  difficulty: 2
  prompt: В проекте уже есть TanStack Query. Нужна лента с подгрузкой страниц при прокрутке, без дублей запросов и с мгновенным показом уже загруженных страниц при возврате из карточки. Что выбрать?
  explanation: "Серверные страницы — это серверное состояние: кэш, курсоры и флаги загрузки отдают `useInfiniteQuery`. IntersectionObserver лишь сигнализирует «пора»: вызываем `fetchNextPage()`, только если `hasNextPage && !isFetchingNextPage`. Для очень длинных лент сверху добавляют виртуализацию."
  type: choose-tool
  options:
    - label: useInfiniteQuery + якорь с IntersectionObserver
      why: "Лучший вариант: страницы кешируются и сразу видны при возврате, hasNextPage и isFetchingNextPage дают готовую защиту от дублей, IO запускает fetchNextPage."
    - label: onScroll с троттлингом и расчётом scrollTop
      why: Подходит, только если IO недоступен или нужна логика по точной позиции. Частые события, ручной троттлинг и кэш страниц всё равно придётся писать самому.
    - label: useEffect + useState с массивом страниц
      why: Годится для простого списка без кэша. Флаги загрузки, гонки и сохранение страниц между экранами придётся писать вручную, а при возврате данные потеряются.
    - label: Только виртуализация (TanStack Virtual)
      why: Решает другую задачу — рендер тысяч строк без тормозов. Загружать страницы она не умеет, её комбинируют с useInfiniteQuery.
