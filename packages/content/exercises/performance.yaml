- id: resource-loading-map-sdk
  skill: resource-hints-choice
  question: resource-loading
  difficulty: 3
  prompt: Виджету карты нужен SDK с maps.example.com, который надо загрузить и выполнить как можно раньше. На странице виджет может встретиться дважды, страница стримится с сервера. Что выбрать?
  explanation: "Правило: preinit — загрузить и выполнить (скрипт) или подключить (стиль), preload — только скачать заранее, preconnect/prefetchDNS — только подготовить соединение. React дедуплицирует вызовы и учитывает их при SSR-стриминге. Альтернатива для этого случая — `<script async src>` в JSX: React его тоже дедуплицирует."
  type: choose-tool
  options:
    - label: "preinit(url, { as: 'script' }) в компоненте"
      why: "Подходит лучше всего: скрипт загрузится и выполнится, повторный вызов React дедуплицирует, а при SSR подсказка попадёт в поток HTML."
    - label: "preload(url, { as: 'script' }) в компоненте"
      why: Только скачивает скрипт, но не выполняет его. Хорошо, когда скрипт понадобится позже и его подключат отдельно.
    - label: preconnect('https://maps.example.com')
      why: Лишь заранее открывает соединение с доменом. Полезно, если конкретный ресурс ещё неизвестен или потребуется позже.
    - label: useEffect, который создаёт `<script>` через document.createElement
      why: Срабатывает только после paint на клиенте. Дедупликацию придётся писать вручную, и на сервере такой скрипт не подключится. Это старый подход.
  answer: 0

# use-memo-use-callback: принято из черновика 2026-10-11
- id: use-memo-use-callback-when-needed
  skill: memoization-when-needed
  question: use-memo-use-callback
  difficulty: 2
  prompt: Когда в коде действительно оправданы useMemo и useCallback?
  explanation: "Три законных повода: измеримо дорогое вычисление, проп для `memo`-компонента и зависимость другого хука. В остальных случаях мемоизация только добавляет код и сравнения. useMemo — подсказка, а не гарантия: логика не должна зависеть от кэша. С React Compiler большая часть ручной мемоизации не нужна."
  type: quiz
  options:
    - label: Когда вычисление измеримо дорогое, значение уходит в memo-компонент или служит зависимостью другого хука
      why: Верно. Только в этих случаях стабильная ссылка или закэшированный результат дают реальный выигрыш. Без этих условий мемоизация — лишний код.
    - label: Всегда для объектов и функций внутри компонента — так дочерние компоненты рендерятся реже
      why: "Без `memo` у дочернего компонента стабильная ссылка ничего не даёт: он перерисуется вместе с родителем. Хранение значений и сравнение зависимостей тоже не бесплатны."
    - label: Когда значение должно вычисляться строго один раз — на useMemo можно опереться для корректности
      why: "useMemo — только подсказка для оптимизации: React может сбросить кэш. Для данных, которые обязаны жить между рендерами, нужны useRef или useState."
    - label: useCallback ускоряет код, потому что React перестаёт создавать функцию на каждом рендере
      why: Функция-аргумент всё равно создаётся на каждом рендере. useCallback лишь возвращает прежнюю ссылку, пока не изменились зависимости.
  answer: 0
- id: use-memo-unstable-dependency
  skill: memo-referential-stability
  question: use-memo-use-callback
  difficulty: 2
  prompt: Проект без React Compiler. При переключении вкладки тяжёлый Chart всё равно перерисовывается. Найдите причину.
  explanation: "Мемоизация ломается, если хотя бы одна зависимость каждый рендер создаётся заново. `options` — новый объект на каждом рендере, поэтому useMemo пересчитывает series, а memo у Chart получает новую ссылку. Решение: вынести константу за пределы компонента или создать объект внутри колбэка useMemo."
  type: find-bug
  language: tsx
  code: |-
    const Chart = memo(ChartImpl);
    function Dashboard({ data }: Props) {
      const [tab, setTab] = useState('day');
      const options = { color: 'blue', smooth: true };
      const series = useMemo(
        () => buildSeries(data, options),
        [data, options],
      );
      return (
        <Layout tab={tab} onTab={setTab}>
          <Chart series={series} />
        </Layout>
      );
    }
  bugLines:
    - 4
    - 7
  causes:
    - options каждый рендер создаётся заново, поэтому зависимость useMemo всегда «новая», series пересоздаётся и memo у Chart бесполезен
    - useMemo нужно заменить на useCallback, потому что series передаётся в дочерний компонент
    - Chart лежит внутри children компонента Layout, а memo не работает для элементов, переданных как children
    - setTab передаётся без useCallback, поэтому при каждом рендере перерисовывается всё дерево
  answer: 0
- id: use-callback-empty-deps-stale
  skill: usecallback-deps
  question: use-memo-use-callback
  difficulty: 2
  prompt: Без StrictMode и без React Compiler. Компонент смонтировали, дважды нажали «+», затем один раз нажали «pick». Что будет в консоли?
  explanation: "Ссылка на pick стабильна, поэтому memo-компонент Child рендерится только при монтировании. Но из-за пустого массива зависимостей колбэк навсегда замкнул n = 0. Правило: стабильная ссылка без честных зависимостей превращается в устаревшее замыкание. Чтобы видеть актуальное n, его нужно указать в deps."
  type: predict-output
  language: tsx
  code: |-
    const Child = memo(({ onPick }: Props) => {
      console.log('child');
      return <button onClick={onPick}>pick</button>;
    });
    function Parent() {
      const [n, setN] = useState(0);
      const pick = useCallback(() => console.log(n), []);
      return (
        <>
          <button onClick={() => setN(n + 1)}>+</button>
          <Child onPick={pick} />
        </>
      );
    }
  options:
    - child → 0
    - child → 2
    - child → child → child → 2
    - child → child → child → 0
  answer: 0
- id: use-memo-alternative-state-down
  skill: rerender-fix-without-memo
  question: use-memo-use-callback
  difficulty: 2
  prompt: Поле поиска в шапке хранит value в state корневого компонента Page; кроме самого поля, value нигде не используется. При каждом нажатии клавиши перерисовывается тяжёлый ExpensiveTree. Что сделать в первую очередь?
  explanation: "Прежде чем мемоизировать, переструктурируйте компоненты: опустите state ниже или передайте тяжёлую часть как children. Тогда лишний рендер исчезает сам, без хрупких зависимостей. memo и useDeferredValue — инструменты для случаев, когда структура уже не позволяет изолировать состояние."
  type: choose-tool
  options:
    - label: Вынести input и его state в отдельный компонент SearchBox
      why: "Лучший вариант: state живёт там, где используется. Page и ExpensiveTree больше не перерисовываются при вводе, и мемоизация не нужна."
    - label: Обернуть ExpensiveTree в memo и стабилизировать его props через useMemo/useCallback
      why: "Сработает, но это хрупко: одна нестабильная зависимость — и всё ломается. Оправдано, если state нельзя опустить ниже из-за структуры."
    - label: Обернуть onChange у input в useCallback
      why: "Не поможет: перерисовка ExpensiveTree вызвана рендером Page, а не ссылкой на обработчик. useCallback полезен только вместе с memo у получателя."
    - label: Передать value в ExpensiveTree через useDeferredValue
      why: useDeferredValue подходит, когда тяжёлое дерево зависит от value и ввод должен оставаться отзывчивым. Здесь дерево от value не зависит.
