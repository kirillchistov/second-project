# web-vitals: принято из черновика 2026-10-11
- id: web-vitals-react-causes-quiz
  skill: web-vitals-causes
  question: web-vitals
  difficulty: 2
  prompt: Какое утверждение о том, как React-приложение влияет на Core Web Vitals, верно?
  explanation: "Каждая метрика ломается по своей причине. LCP — когда главный контент поздно попадает на экран. INP — когда главный поток занят в момент взаимодействия. CLS — когда контент появляется без зарезервированного места. Поэтому сначала определите метрику, потом выбирайте технику: SSR, startTransition и memo лечат разные вещи."
  type: quiz
  options:
    - label: LCP страдает от CSR и поздней загрузки главного контента, INP — от долгих задач в главном потоке, CLS — от контента без места
      why: Верно. LCP — это то, когда виден главный контент. INP — насколько занят поток при взаимодействии. CLS — насколько сдвигается вёрстка.
    - label: "SSR закрывает все три метрики: HTML приходит готовым, поэтому и INP, и CLS будут в порядке"
      why: SSR помогает LCP, но гидрация — это долгая задача, и она может ухудшить INP. Картинки без размеров и баннеры дают CLS и при SSR.
    - label: Виртуальный DOM батчит изменения, поэтому React не может испортить INP — только LCP
      why: Батчинг не делает рендер дешёвым. Тяжёлый рендер или синхронный обработчик всё равно блокируют главный поток и задерживают следующий кадр.
    - label: CLS в основном вызывают лишние ререндеры, поэтому memo и React Compiler снижают сдвиги
      why: Ререндер без изменения геометрии ничего не сдвигает. CLS дают появляющиеся элементы без размеров, а memo влияет скорее на INP.
  answer: 0
