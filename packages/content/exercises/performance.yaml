    - label: "`<title>` в компоненте даёт SPA без SSR ту же SEO-выгоду, что и серверный рендеринг"
      why: Без SSR заголовок появится только после выполнения JS. Краулер, который не исполняет JS, его не увидит. Это типичный подводный камень.
