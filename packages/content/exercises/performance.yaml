# react-memo: принято из черновика 2026-10-11
- id: react-memo-how-it-works
  skill: react-memo-shallow-compare
  question: react-memo
  difficulty: 2
  prompt: Как работает React.memo и в каких случаях он не спасает от перерисовки?
  explanation: "memo — это проверка «props не изменились?» перед рендером: Object.is для каждого prop. Он бесполезен, если в props каждый раз новые ссылки (инлайн-объекты, стрелки, children) или если рендер вызван своим state или контекстом. Для дешёвых компонентов сравнение тоже стоит времени."
  type: quiz
  options:
    - label: Сравнивает каждый prop через Object.is и пропускает рендер при равенстве; не помогает при новых ссылках, своём state и контексте
      why: Верно. Сравнение поверхностное, поэтому новый объект или функция с тем же содержимым считается изменением, а state и useContext запускают рендер в обход memo.
    - label: Глубоко сравнивает props, поэтому инлайн-объект с тем же содержимым не вызовет повторный рендер
      why: "Сравнение поверхностное: {...item} — новая ссылка, Object.is вернёт false, и компонент перерисуется. Глубокое сравнение было бы слишком дорогим."
    - label: Кеширует результат компонента и блокирует любые перерисовки, пока не изменятся props
      why: memo не блокирует рендер из-за собственного state компонента и из-за изменения контекста, прочитанного через useContext.
    - label: Мемоизирует тяжёлые вычисления внутри компонента между рендерами, как useMemo
      why: "Это путаница с useMemo: тот кеширует значение внутри компонента, а memo решает, вызывать ли компонент вообще, глядя на props."
  answer: 0
- id: react-memo-render-log
  skill: react-memo-shallow-compare
  question: react-memo
  difficulty: 2
  prompt: Без StrictMode и без React Compiler. Компонент App смонтировали, затем один раз кликнули по div. Что будет в консоли?
  explanation: При рендере App обычный Child рендерится всегда. Memo с label="a" получает ту же строку — Object.is даёт true, рендер пропущен. У третьего label меняется с c0 на c1, поэтому он перерисуется. memo пропускает рендер только при поверхностно равных props.
  type: predict-output
  language: tsx
  code: |-
    function Child({ label }: { label: string }) {
      console.log(label);
      return <p>{label}</p>;
    }
    const Memo = memo(Child);
    function App() {
      const [n, setN] = useState(0);
      return <div onClick={() => setN(n + 1)}>
        <Memo label="a" />
        <Child label="b" />
        <Memo label={`c${n}`} />
      </div>;
    }
  options:
    - a, b, c0 → b, c1
    - a, b, c0 → a, b, c1
    - a, b, c0 → b
    - a, b, c0 → c1
  answer: 0
- id: react-memo-inline-callback
  skill: react-memo-unstable-props
  question: react-memo
  difficulty: 2
  prompt: При вводе в поиск все Row перерисовываются, хотя обёрнуты в memo. Найдите строку с причиной.
  explanation: "Стрелка (id) => onToggle(id) создаётся заново на каждом рендере List, и Object.is видит новый prop. Здесь обёртка вообще не нужна — передайте onToggle напрямую (и убедитесь, что он стабилен у родителя, например через useCallback). Правило: memo работает только со стабильными ссылками в props."
  type: find-bug
  language: tsx
  code: |-
    const Row = memo(function Row({ item, onToggle }: RowProps) {
      return <li onClick={() => onToggle(item.id)}>{item.title}</li>;
    });
    function List({ items, onToggle }: ListProps) {
      const [query, setQuery] = useState('');
      return (
        <>
          <input value={query} onChange={(e) => setQuery(e.target.value)} />
          {items.map((it) => (
            <Row key={it.id} item={it} onToggle={(id) => onToggle(id)} />
          ))}
        </>
      );
    }
  bugLines:
    - 10
  causes:
    - В onToggle передаётся новая стрелочная функция на каждом рендере List — поверхностное сравнение props всегда видит изменение
    - memo в принципе не защищает от перерисовки при изменении state родителя
    - items.map создаёт новые объекты item на каждом рендере, поэтому prop item всегда новый
    - Prop key участвует в сравнении memo и сбрасывает мемоизацию
  answer: 0
- id: react-memo-vs-state-colocation
  skill: memo-alternatives-composition
  question: react-memo
  difficulty: 2
  prompt: "Layout хранит scrollY (меняется на каждый scroll) и по нему рисует полоску прогресса. Ниже в том же Layout — тяжёлый Dashboard без props. Профайлер: Dashboard рендерится при каждом скролле. Какое исправление надёжнее всего?"
  explanation: "Прежде чем тянуться к memo, проверьте структуру: state, который нужен одному месту, опускается в это место (colocation), а тяжёлые части можно передавать как children. Тогда лишних рендеров нет вовсе, и не нужно следить за стабильностью props."
  type: choose-tool
