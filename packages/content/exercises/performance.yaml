- id: rerender-investigation-recipe
  type: order
  kind: recipe
  skill: rerender-investigation
  question: performance-methodology
  difficulty: 2
  prompt: Соберите алгоритм расследования «интерфейс тормозит при вводе».
  steps:
    - Воспроизвести проблему и зафиксировать метрику (INP, длительность коммита)
    - Записать профиль в React DevTools Profiler
    - Найти компоненты с частыми или долгими коммитами и узнать, почему они рендерятся
    - Устранить причину — опустить состояние ниже, разделить контекст, стабилизировать props
    - Повторить замер и сравнить с исходной метрикой
  explanation: >-
    Сначала измерение, потом оптимизация: без исходной метрики непонятно, помог ли фикс,
    а мемоизация «на всякий случай» часто не даёт выигрыша.
