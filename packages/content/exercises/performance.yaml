# inp-debugging-react-tracks: принято из черновика 2026-11-07
- id: inp-debugging-where-to-look
  skill: inp-diagnosis
  question: inp-debugging-react-tracks
  difficulty: 3
  prompt: Клик по фильтру таблицы даёт INP ≈ 220 мс, а сам `onClick` в профиле занимает 5 мс. Какой вывод верный?
  explanation: "INP — это путь от ввода до следующего кадра: задержка до обработки, обработчики и всё, что мешает отрисовке (рендер, коммит, синхронные эффекты). Быстрый обработчик не значит быстрое взаимодействие. Ищите, какой компонент и какая фаза держат поток, в треках `Components ⚛`/`Scheduler ⚛`."
  type: quiz
  options:
    - label: "Время съедает работа, запущенная кликом: рендер, коммит или эффекты до отрисовки. Искать компонент в треках React"
      why: Верно. INP заканчивается на следующем paint, поэтому в него входит и рендер после setState. React-треки покажут, какой компонент и какая фаза виноваты.
    - label: "Обработчик быстрый, значит задержка в сети: нужно ускорять API фильтрации"
      why: Ожидание fetch асинхронно и не блокирует отрисовку. INP растёт от занятого главного потока, а не от ожидания ответа.
    - label: INP, как FID, меряет только задержку до старта обработчика, так что виноваты чужие задачи до клика
      why: "Это описание FID. INP учитывает весь путь: input delay, обработку и presentation delay до следующего кадра."
    - label: "Хватит общего трека Long Tasks: он покажет, какой компонент тормозит"
      why: Long Tasks показывает лишь, что JS шёл долго. Чтобы найти конкретный компонент и фазу рендера или эффекта, нужны треки Components ⚛ и Scheduler ⚛.
  answer: 0
- id: inp-debugging-recipe
  skill: inp-diagnosis
  question: inp-debugging-react-tracks
  difficulty: 2
  prompt: Расставьте шаги разбора плохого INP на конкретном экране React-приложения.
  explanation: Сначала создайте условия, близкие к реальным. Затем найдите именно худшее взаимодействие, а не первое, что попалось в профиле. После этого определите фазу и компонент и только потом чините. Перемеряйте в тех же условиях, иначе улучшение может оказаться шумом.
  type: order
  kind: recipe
  steps:
    - Включить CPU throttling (4–6x), чтобы приблизиться к слабым устройствам
    - Записать Performance-профиль, повторяя проблемное взаимодействие
    - Найти в треке Interactions самое долгое взаимодействие
    - "Понять, что доминирует: input delay, обработка или presentation delay"
    - "В треках Components ⚛ / Scheduler ⚛ найти компонент и фазу: рендер или эффект"
    - Исправить и перемерить в тех же условиях
- id: inp-heavy-list-render
  skill: inp-fix-choice
  question: inp-debugging-react-tracks
  difficulty: 3
  prompt: "Трек Components ⚛ показывает: 180 из 220 мс после клика по фильтру уходит на рендер `OrdersTable`, который монтирует 5000 строк. На экране видно около 30. Обработчик быстрый. Что сделать в первую очередь?"
  explanation: Сначала уберите лишнюю работу, потом решайте, когда выполнять оставшуюся. Если рендерится намного больше, чем видно, нужна виртуализация. Если работа действительно необходима, `startTransition` делает её прерываемой. memo помогает при повторных рендерах с теми же props, а не при монтировании новых строк.
  type: choose-tool
  options:
    - label: Виртуализация списка (например, TanStack Virtual)
      why: "Лучший выбор: рендерятся только видимые строки, и работа после клика сокращается в десятки раз."
    - label: Обернуть обновление фильтра в startTransition
      why: "Хорошо, когда тяжёлая работа неизбежна: обновление станет прерываемым, а срочный отклик отрисуется раньше. Но 5000 строк всё равно будут рендериться."
    - label: React.memo на компонент строки
      why: Помогает, если строки перерисовываются с теми же props. При смене фильтра монтируется новый набор строк, и memo почти ничего не даст.
    - label: Debounce обработчика клика
      why: Подходит для частого ввода, например при наборе текста. Для одиночного клика debounce только добавит задержку и не уменьшит рендер.
  answer: 0
