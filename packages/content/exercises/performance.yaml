  options:
    - label: "Колбэк может сработать снова до конца запроса: якорь вышел и вернулся или observer пересоздан. Без флага уйдут параллельные дубли"
      why: Верно. Пересечение — это событие видимости, а не «одна страница». Защиту от дублей даёт только явный флаг идущего запроса.
    - label: IntersectionObserver вызывает колбэк на каждый пиксель прокрутки, как onScroll, поэтому его нужно ограничивать флагом
      why: "Нет: колбэк вызывается при пересечении порогов, а не на каждый пиксель. Именно поэтому IO и выбирают вместо onScroll с троттлингом."
    - label: Флаг нужен, чтобы React не перерисовывал список, пока идёт загрузка следующей страницы
      why: Флаг не управляет рендером списка. Его держат в useRef как раз для того, чтобы он вообще не влиял на рендер.
    - label: Без флага браузер сам отменит предыдущий fetch при новом пересечении, и первая страница потеряется
      why: "Браузер ничего не отменяет автоматически: оба запроса дойдут до конца, и данные задублируются, а не потеряются."
