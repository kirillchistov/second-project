    - setHasMore нельзя вызывать после await — обновление состояния потеряется
    - disconnect в cleanup отменяет текущий запрос loadMore, и он стартует заново
    - IntersectionObserver нужно создавать в useLayoutEffect, иначе он пропускает первые пересечения
