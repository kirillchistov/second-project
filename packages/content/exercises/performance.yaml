# virtualization: принято из черновика 2026-10-11
- id: virtualization-core-idea
  skill: list-virtualization
  question: virtualization
  difficulty: 2
  prompt: Список из 10 000 строк тормозит при открытии и прокрутке. В чём суть виртуализации (windowing) как решения?
  explanation: "Тормозят не вычисления, а объём: 10 000 компонентов и DOM-узлов. Виртуализация держит в DOM только окно видимых строк с запасом (overscan), а высоту остального имитирует отступом. Цена — Ctrl+F и скринридеры не видят скрытые строки. Для списка в 50 элементов это лишняя сложность."
  type: quiz
  options:
    - label: В DOM живут только видимые строки плюс небольшой запас, остальное заменено отступом нужной высоты
      why: Верно. Число узлов и компонентов почти не зависит от длины списка, поэтому монтирование и прокрутка остаются быстрыми. Платим поиском по странице и доступностью.
    - label: "Обернуть строки в memo: тогда React не будет их рендерить, и 10 000 элементов перестанут тормозить"
      why: memo пропускает только повторные рендеры. Первый рендер и 10 000 узлов в DOM никуда не деваются, а layout и память остаются тяжёлыми.
    - label: "Рендерить все строки, но невидимые скрывать через display: none, чтобы браузер их не рисовал"
      why: Компоненты всё равно монтируются, и узлы остаются в DOM. Экономится только отрисовка, а основная стоимость в рендере и создании узлов.
    - label: В React 19 конкурентный рендеринг сам разбивает длинный список на части, поэтому виртуализация больше не нужна
      why: Конкурентность может прерывать рендер, но не уменьшает число узлов. Все 10 000 строк всё равно окажутся в DOM.
  answer: 0
