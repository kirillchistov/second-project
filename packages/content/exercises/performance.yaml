  prompt: При быстрой прокрутке туда-обратно уходят дублирующие запросы одной страницы, хотя флаг loading проверяется. Где ошибка?
  explanation: "Колбэк observer создаётся один раз за запуск эффекта и видит `loading` из того рендера, т.е. false. setLoading(true) меняет state, но не значение в замыкании. Флаг, который читают из долгоживущего колбэка и который не влияет на UI, храните в `useRef`: `loadingRef.current` всегда актуален."
  type: find-bug
  language: tsx
  code: |-
    const [loading, setLoading] = useState(false);

    useEffect(() => {
      const el = ref.current;
      if (!el || !hasMore) return;
      const io = new IntersectionObserver(async ([e]) => {
        if (!e.isIntersecting || loading) return;
        setLoading(true);
        setHasMore(await loadMore());
        setLoading(false);
      });
      io.observe(el);
      return () => io.disconnect();
    }, [hasMore, loadMore]);
  bugLines:
