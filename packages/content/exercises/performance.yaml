  skill: scroll-anchoring-on-prepend
  question: virtualization-variable-height
  difficulty: 3
  prompt: Сверху чата подгружаются старые сообщения. Позицию корректируют, но пользователь всё равно видит, как контент на кадр «прыгает». Где ошибка?
  explanation: Коррекцию scrollTop надо сделать после изменения DOM, но до отрисовки кадра. useEffect обычно срабатывает уже после paint, поэтому браузер успевает показать сдвинутый контент. useLayoutEffect выполняется синхронно после commit и до paint — пользователь сразу видит исправленную позицию.
  type: find-bug
  language: tsx
  code: |-
    function ChatList({ messages }: Props) {
      const ref = useRef<HTMLDivElement>(null);
      const prevHeight = useRef(0);
      const prevFirst = useRef(messages[0]?.id);
      useEffect(() => {
        const el = ref.current!;
        if (messages[0]?.id !== prevFirst.current) {
          el.scrollTop += el.scrollHeight - prevHeight.current;
        }
        prevHeight.current = el.scrollHeight;
        prevFirst.current = messages[0]?.id;
      }, [messages]);
      return <div ref={ref}>{/* rows */}</div>;
    }
  bugLines:
    - 5
  causes:
    - "useEffect выполняется после paint: браузер успевает отрисовать кадр со сдвинутым контентом. Нужен useLayoutEffect"
    - "Вместо scrollHeight нужно брать clientHeight: он отражает высоту вставленного контента"
    - Массив зависимостей должен быть пустым, иначе эффект срабатывает при каждой подгрузке
    - Мутация prevHeight.current вызывает лишний ререндер, который и сбивает позицию
  answer: 0
