    - interactionTarget
    - processingDuration
    - presentationDelay
  decoys:
    - targetElement
    - handlerDuration
    - renderDelay
    - metrics

# virtualization-variable-height: принято из черновика 2026-11-07
- id: virtualization-variable-height-quiz
  skill: variable-height-virtualization
  question: virtualization-variable-height
  difficulty: 3
  prompt: Почему в списке строк переменной высоты нельзя найти первую видимую строку как `scrollTop / rowHeight`, и что делают вместо этого?
  explanation: С переменной высотой позиция строки — это сумма высот всех строк перед ней. Офсеты строят из оценок и уточняют измерениями (ResizeObserver). Пересчитывают их только при изменении данных или высот. При скролле ищут видимый диапазон по готовому массиву, бинарным поиском за O(log n).
  type: quiz
  options:
    - label: Хранят накопленные офсеты (оценка → измеренная высота), пересчитывают их при смене данных и высот, а при скролле ищут диапазон бинпоиском
      why: Верно. Позиция строки равна сумме предыдущих высот. Офсеты зависят от данных и измерений, а не от scrollTop, поэтому при скролле нужен только быстрый поиск.
    - label: "Делят scrollTop на среднюю высоту строки: погрешность на отдельной строке мала и незаметна"
      why: "Ошибка накапливается. Через тысячи строк расхождение достигает тысяч пикселей: показывается не тот диапазон, контент прыгает."
    - label: Один раз рендерят все строки скрытыми, измеряют их и только потом включают виртуализацию
      why: "50 000 DOM-узлов на старте — это ровно то, от чего спасает виртуализация: долгий первый рендер, лишняя память и layout."
    - label: На каждое событие scroll заново считают офсеты всех строк, чтобы они всегда были точными
      why: Это O(n) на каждый кадр скролла при 50 000 элементах. Офсеты от прокрутки не меняются, пересчитывать их нужно только при смене данных или высот.
  answer: 0
