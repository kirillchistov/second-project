- id: memory-leaks-listener-identity
  skill: effect-cleanup-subscriptions
  question: memory-leaks
  difficulty: 2
  prompt: После каждого монтирования и размонтирования хука в window остаётся слушатель. Найдите ошибку.
  explanation: removeEventListener удаляет слушатель, только если ему передали **ту же ссылку** на функцию. Две одинаковые стрелочные функции — это разные объекты. Нужно сохранить обработчик в переменную (`const onResize = ...`) и передать её и в add, и в remove.
