  skill: inp-rum-collection
  question: inp-debugging-react-tracks
  difficulty: 2
  prompt: Допишите сбор INP с реальных пользователей так, чтобы в аналитику уходили элемент взаимодействия и разбивка задержки по фазам.
  explanation: "Сборка `web-vitals/attribution` добавляет в метрику `attribution`. Там есть элемент (`interactionTarget`) и три фазы: `inputDelay`, `processingDuration`, `presentationDelay`. RUM-данные показывают, какой экран и элемент тормозят у реальных пользователей. Затем этот экран разбирают локально в профиле."
  type: fill-tokens
  language: ts
  code: |-
    import { onINP } from 'web-vitals/___';

    onINP((metric) => {
      const a = metric.attribution;
      sendToAnalytics({
        value: metric.value,
        target: a.___,
        inputDelay: a.inputDelay,
        processing: a.___,
        presentation: a.___,
      });
    });
  tokens:
