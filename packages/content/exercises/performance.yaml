# data-waterfalls: принято из черновика 2026-10-11
- id: data-waterfalls-cause-quiz
  skill: data-waterfalls-cause
  question: data-waterfalls
  difficulty: 2
  prompt: Почему загрузка данных внутри компонентов (`useQuery` в родителе и в ребёнке) часто даёт водопад и что помогает в первую очередь?
  explanation: "Водопад создаёт зависимость старта запроса от рендера, а не скорость сети. Лечится это так: начинать загрузку до рендера (loader, prefetch, Server Components), запускать независимые запросы параллельно и поднимать их выше. Кэш ускоряет только повторные визиты."
  type: quiz
  options:
    - label: Ребёнок монтируется и стартует запрос, только когда родитель загрузился и отрендерился. Помогает ранний старт и параллельные запросы
      why: Верно. Цепочку создаёт связь «запрос ← рендер». Если запросы стартуют при навигации или вместе через useQueries/Promise.all, ожидания не складываются.
    - label: Водопад возникает из-за медленной сети, и лучшее решение — закешировать все ответы
      why: Кэш помогает при повторном визите и дедуплицирует запросы. Первая загрузка всё равно идёт цепочкой, если запросы стартуют по очереди.
    - label: Достаточно обернуть каждый компонент в свою Suspense-границу, и запросы пойдут параллельно
      why: Suspense только показывает fallback. Если каждая вложенная граница грузит своё после родителя, получится водопад «по слоям».
    - label: Эффекты выполняются после paint. Если перенести загрузку в useLayoutEffect, запросы стартуют одновременно
      why: useLayoutEffect срабатывает чуть раньше, но всё так же после рендера своего компонента. Ребёнок по-прежнему ждёт данных родителя.
  answer: 0
- id: data-waterfalls-sequential-await
  skill: parallel-server-fetch
  question: data-waterfalls
  difficulty: 2
  prompt: Server Component грузится вдвое дольше, чем мог бы. Посты не зависят от данных пользователя. Найдите проблему.
  explanation: "Каждый `await` останавливает функцию, поэтому getPosts стартует только после ответа getUser. Независимые запросы нужно запустить сразу, без await, а ждать их вместе: `await Promise.all([userP, postsP])`. Тогда время загрузки равно самому долгому запросу, а не их сумме."
  type: find-bug
  language: tsx
  code: |-
    async function ProfilePage({ id }: Props) {
      const user = await getUser(id);
      const posts = await getPosts(id);
      return (
        <Layout user={user}>
          <Posts items={posts} />
        </Layout>
      );
    }
  bugLines:
    - 2
    - 3
  causes:
    - "Последовательные await у независимых запросов: getPosts ждёт завершения getUser"
    - Server Component не может быть async, данные нужно грузить в useEffect
    - getUser нужно обернуть в cache() — тогда запросы пойдут параллельно
    - Posts должен сам загружать свои данные, чтобы не блокировать Layout
  answer: 0
- id: data-waterfalls-prefetch-hover
  skill: prefetch-on-intent
  question: data-waterfalls
  difficulty: 2
  prompt: Допишите ссылку так, чтобы данные пользователя начинали грузиться уже при наведении курсора, до перехода на страницу.
  explanation: "`prefetchQuery` кладёт данные в кэш TanStack Query под тем же queryKey, что использует страница. Между наведением и кликом проходят сотни миллисекунд, поэтому к моменту рендера запрос уже летит или завершён. staleTime: 60_000 нужен, чтобы повторные наведения не перезапрашивали данные, которым меньше минуты."
  type: fill-tokens
  language: tsx
  code: |-
    function UserLink({ id }: { id: string }) {
      const queryClient = ___();
      const prefetch = () =>
        queryClient.___({
          queryKey: ['user', id],
          queryFn: () => getUser(id),
          staleTime: 60_000,
        });
      return (
        <Link to={`/users/${id}`} ___={prefetch}>
          {id}
        </Link>
      );
    }
  tokens:
    - useQueryClient
    - prefetchQuery
    - onMouseEnter
  decoys:
    - useQuery
    - invalidateQueries
    - onClick
    - refetchQueries
- id: data-waterfalls-dedupe-server
  skill: request-dedupe-cache
  question: data-waterfalls
  difficulty: 3
  prompt: В Next.js App Router getUser(id) вызывается в layout, в шапке и на странице — это разные Server Components одного рендера. В БД уходит 3 запроса. Нужен один на HTTP-запрос, без пробрасывания props. Что выбрать?
  explanation: "`cache()` из React мемоизирует функцию в рамках одного серверного рендера: все компоненты дерева получат один результат, а между HTTP-запросами кэш не живёт. Для кэша между запросами берут механизмы фреймворка, для клиентского серверного состояния — TanStack Query."
  type: choose-tool
  options:
    - label: Обернуть getUser в cache() из react
      why: "Лучший выбор: вызовы с теми же аргументами дедуплицируются в пределах одного серверного рендера, и данные не утекают между пользователями."
    - label: TanStack Query с queryClient на сервере
      why: Подходит для клиентского кэша, гидрации и фонового обновления. Ради дедупликации внутри одного RSC-рендера это лишняя инфраструктура.
    - label: Глобальный Map на уровне модуля
      why: "Map переживёт HTTP-запрос: данные одного пользователя могут попасть к другому, кэш устареет и будет расти. Годится только для общих данных с явной инвалидацией."
    - label: useMemo в каждом компоненте
      why: useMemo кэширует только внутри одного компонента и не делится результатом с layout, шапкой и страницей — запросов останется три.
  answer: 0

# debounce-throttle: принято из черновика 2026-10-11
- id: debounce-throttle-body-recreate-quiz
  skill: debounce-stable-instance
  question: debounce-throttle
  difficulty: 2
  prompt: Почему `const onSearch = debounce(search, 300)` прямо в теле компонента не уменьшает число запросов, если каждый ввод меняет state?
  explanation: "Debounce держит таймер в замыкании своего экземпляра. Экземпляр должен жить между рендерами: `useMemo`/`useRef` и `fnRef` для свежего колбэка. Отложенный вызов отменяют в cleanup при размонтировании."
  type: quiz
  options:
    - label: Каждый рендер — новый экземпляр со своим таймером; старые таймеры никто не сбрасывает, и запрос уходит на каждый ввод
      why: Верно. clearTimeout сбрасывает только таймер своего экземпляра. После setState вызывается уже новая функция, а таймер старой срабатывает.
    - label: "Проблема только в производительности: функция пересоздаётся, но таймер у всех экземпляров общий"
      why: "Общего таймера нет: id хранится в замыкании конкретного вызова debounce(). Поэтому это поломка логики, а не лишние аллокации."
    - label: Синтетические события React переиспользуются, и к срабатыванию таймера event уже пустой
      why: "Event pooling убрали в React 17. К тому же проблема не в событии: debounce не работает, даже если передавать строку."
    - label: Функция замыкается на устаревший query, поэтому запросы уходят со старым значением
      why: "Устаревшее замыкание — отдельная проблема. Она возникает при обратной ошибке: debounce создают один раз без fnRef. Здесь функция как раз свежая на каждом рендере."
  answer: 0
- id: debounce-throttle-inline-fn-deps
  skill: debounce-stable-instance
  question: debounce-throttle
  difficulty: 3
  prompt: "Хук используют, как показано внизу: search вызывают в onChange рядом с setQuery. Запросы почти не уходят. Найдите причину."
  explanation: Инлайн-стрелка новая на каждом рендере, поэтому `useMemo` с `[fn]` пересоздаёт debounce. Cleanup эффекта отменяет вызов, отложенный в прошлом экземпляре. Решение — держать fn в `useRef`, обновлять ref в эффекте, а в зависимостях оставить только delay.
  type: find-bug
  language: tsx
  code: |-
    function useDebounced<A extends unknown[]>(
      fn: (...args: A) => void,
      delay: number,
    ) {
      const debounced = useMemo(
        () => debounce(fn, delay),
        [fn, delay],
      );
      useEffect(() => () => debounced.cancel(), [debounced]);
      return debounced;
    }
    // in component:
    const search = useDebounced(
      (q: string) => api.search(q), 300);
  bugLines:
    - 7
  causes:
    - "fn — новая инлайн-функция на каждом рендере: useMemo пересоздаёт debounce, и cleanup отменяет отложенный вызов"
    - delay в зависимостях сбрасывает таймер, ведь число 300 каждый раз сравнивается заново
    - cancel нужно вызывать в теле эффекта, а не возвращать из него
    - useMemo не сохраняет функции между рендерами — нужен useCallback
  answer: 0
- id: debounce-throttle-callback-hook-fill
  skill: debounce-callback-hook
  question: debounce-throttle
  difficulty: 2
  prompt: "Допишите хук debounced-функции: экземпляр стабилен, вызывается свежий колбэк, при размонтировании вызов отменяется. Тип `Fn = (q: string) => void`."
  explanation: "`useRef` хранит последний fn, поэтому useMemo зависит только от delay и не пересоздаёт таймер. Вызов идёт через `fnRef.current` — без устаревшего замыкания. Cleanup возвращает `cancel`, и после размонтирования отложенный вызов не сработает."
  type: fill-tokens
  language: tsx
  code: |-
    function useDebouncedFn(fn: Fn, delay: number) {
      const fnRef = ___(fn);
      useEffect(() => { fnRef.current = fn; });
      const debounced = useMemo(() => {
        let id: ReturnType<typeof setTimeout>;
        const call = (q: string) => {
          clearTimeout(id);
          id = setTimeout(() => fnRef.___(q), delay);
        };
        return Object.assign(call, { cancel: () => clearTimeout(id) });
      }, [___]);
      useEffect(() => debounced.___, [debounced]);
      return debounced;
    }
  tokens:
    - useRef
    - current
    - delay
    - cancel
  decoys:
    - useState
    - fn
    - flush
    - useCallback
- id: debounce-throttle-local-filter-choice
  skill: deferred-value-for-heavy-render
  question: debounce-throttle
  difficulty: 2
  prompt: Поле фильтрует локальный список из 5000 строк, данные уже в памяти, запросов нет. При быстром вводе инпут подтормаживает. Что выбрать?
  explanation: "Debounce и throttle уменьшают число вызовов по времени — это нужно для запросов к API и частых событий. `useDeferredValue` ничего не ждёт: он рендерит тяжёлый результат с низким приоритетом, и ввод не блокируется. Для локальной фильтрации — useDeferredValue, для поиска по API — debounce."
  type: choose-tool
  options:
    - label: useDeferredValue для query + memo-компонент списка
      why: Ввод обновляется сразу, а тяжёлый рендер списка идёт с низким приоритетом и прерывается новым вводом. Искусственной задержки нет.
    - label: Debounce query на 300 мс
      why: Подходит для поиска по API, где важно сократить число запросов. Здесь он добавит лаг, а сам рендер после паузы всё равно заблокирует ввод.
    - label: Throttle фильтрации раз в 200 мс
      why: Хорош для scroll, resize и mousemove, где нужен регулярный отклик. При вводе фильтрует промежуточные значения, а рендер остаётся блокирующим.
    - label: Только useMemo для отфильтрованного массива
      why: Помогает, если дорого само вычисление. Но query меняется на каждый символ, и пересчёт с рендером 5000 строк всё равно будет. Тормозит рендер, а не повторное вычисление.
  answer: 0

# lazy-suspense: принято из черновика 2026-10-11
- id: lazy-suspense-core-idea
  skill: code-splitting-lazy-suspense
  question: lazy-suspense
  difficulty: 2
  prompt: Как `React.lazy` и `Suspense` вместе разделяют код приложения?
  explanation: "`lazy` превращает динамический `import()` в компонент. Сборщик выносит этот модуль в отдельный чанк, и React запрашивает его при первом рендере. Пока чанк грузится, ближайшая граница `Suspense` выше по дереву показывает fallback. Поэтому тяжёлые страницы не попадают в начальный бандл."
  type: quiz
  options:
    - label: При первом рендере lazy-компонент запрашивает свой чанк, а ближайший Suspense выше по дереву показывает fallback до загрузки
      why: Верно. `import()` вызывается при первом рендере, пока промис не разрешён. Fallback показывает граница Suspense, которая стоит над lazy-компонентом.
    - label: lazy загружает все чанки в фоне при старте приложения, а Suspense лишь скрывает компонент до монтирования
      why: Неверно. Загрузка начинается только при первом рендере. Раньше её можно запустить лишь вручную, вызвав `import()`, например при наведении.
    - label: Suspense нужно разместить внутри lazy-компонента, вокруг его собственной разметки
      why: Неверно. Пока чанк не загружен, кода компонента ещё нет. Граница должна стоять выше по дереву, иначе показывать fallback некому.
    - label: Код компонента всё равно остаётся в основном бандле, lazy лишь откладывает его монтирование
      why: Неверно. Сборщик видит динамический `import()` и выносит модуль в отдельный чанк. В этом и состоит смысл code splitting.
  answer: 0
- id: lazy-suspense-inside-component
  skill: lazy-module-level
  question: lazy-suspense
  difficulty: 2
  prompt: После каждого ввода в фильтр график мигает скелетоном и теряет зум. Найдите строку с ошибкой.
  explanation: "`lazy` внутри компонента на каждом рендере создаёт новый тип компонента. React видит другой тип, размонтирует старый `Chart` вместе с его состоянием и снова приостанавливается. Правило: `lazy` объявляют на уровне модуля, рядом с импортами."
  type: find-bug
  language: tsx
  code: |-
    function Dashboard({ filter }: Props) {
      const Chart = lazy(() => import('./Chart'));
      return (
        <Suspense fallback={<ChartSkeleton />}>
          <Chart filter={filter} />
        </Suspense>
      );
    }
  bugLines:
    - 2
  causes:
    - "lazy вызывается при каждом рендере: создаётся новый тип компонента, Chart перемонтируется и теряет состояние"
    - Suspense должен быть внутри Chart, а не снаружи
    - lazy работает только с именованными экспортами, а здесь импортируется default
    - Нельзя передавать props в lazy-компонент до загрузки чанка
  answer: 0
- id: lazy-suspense-named-export
  skill: lazy-named-export
  question: lazy-suspense
  difficulty: 2
  prompt: Модуль `./charts` экспортирует `Chart` именованно. Допишите ленивую загрузку с запасным UI.
  explanation: "`lazy` ожидает промис модуля с default-экспортом. Именованный экспорт заворачивают в `{ default: m.Chart }`. Запасной UI задаётся пропом `fallback` у ближайшего `Suspense`."
  type: fill-tokens
  language: tsx
  code: |-
    const Chart = ___(() =>
      import('./charts').then((m) => ({
        ___: m.Chart,
      }))
    );

    function Report() {
      return (
        <Suspense ___={<ChartSkeleton />}>
          <Chart />
        </Suspense>
      );
    }
  tokens:
    - lazy
    - default
    - fallback
  decoys:
    - memo
    - component
    - loading
    - placeholder
- id: lazy-suspense-tab-switch-fallback
  skill: suspense-transitions
  question: lazy-suspense
  difficulty: 3
  prompt: Вкладки отчёта загружаются через lazy. При переключении весь экран на полсекунды заменяется скелетоном. Нужно оставить старую вкладку на экране, пока грузится новая. Что выбрать?
  explanation: Если обновление, которое приостанавливает уже показанный контент, помечено как переход, React не прячет его за fallback. Он продолжает показывать старый экран, пока новый не готов. Предзагрузка и вложенные границы хорошо это дополняют.
  type: choose-tool
  options:
    - label: Переключать вкладку через startTransition (или useTransition с индикатором isPending)
      why: Лучший вариант. Переход позволяет React держать старый UI вместо fallback до загрузки чанка, а isPending даёт ненавязчивый индикатор загрузки.
    - label: Предзагружать чанк вкладки вызовом import() по onMouseEnter
      why: "Полезное дополнение: часто чанк успевает загрузиться. Но на медленной сети или при клике без наведения fallback всё равно появится."
    - label: Убрать lazy и импортировать вкладки статически
      why: Подходит, если вкладки лёгкие. Тяжёлые вкладки раздуют начальный бандл и замедлят первую загрузку.
    - label: Поднять Suspense выше, до корня приложения
      why: "Станет хуже: fallback заменит ещё больше интерфейса. Границы, наоборот, стоит дробить и ставить ближе к месту загрузки."
  answer: 0

# memory-leaks: принято из черновика 2026-10-11
- id: memory-leaks-root-cause
  skill: memory-leak-sources
  question: memory-leaks
  difficulty: 2
  prompt: Почему компонент, уже ушедший из дерева, может продолжать занимать память?
  explanation: "GC собирает только то, до чего нельзя дотянуться от корней. Утечка — это всегда **лишняя ссылка** от долгоживущего объекта: window, сокета, таймера, observer, глобального кэша, сторонней библиотеки. Поэтому каждый эффект, который что-то регистрирует снаружи, должен возвращать cleanup, а кэши — иметь лимит."
  type: quiz
  options:
    - label: Долгоживущий объект (window, сокет, таймер, глобальный кэш) хранит ссылку на колбэк или данные компонента, и GC не может их собрать
      why: Верно. Колбэк замыкает state, props и refs компонента. Пока на колбэк ссылается живой объект, вся эта цепочка достижима и не собирается.
    - label: React не освобождает память компонента, пока не произойдёт следующий ререндер корня
      why: "React отбрасывает Fiber-узлы при коммите размонтирования, а память освобождает GC. Ререндер корня тут ни при чём: держит память внешняя ссылка."
    - label: Утечку вызывает setState после размонтирования — об этом и предупреждал React
      why: Сам setState на размонтированном компоненте безвреден. Предупреждение убрали в React 18 как чаще ложное. Течёт подписка, которая этот setState вызывает.
    - label: Замыкания в JS удерживают память навсегда, поэтому стрелочные функции в JSX надо выносить
      why: Замыкание собирается вместе с функцией, когда на неё не осталось ссылок. Inline-функции в JSX не текут, если их не регистрирует внешний объект.
