# Квизы к шаблонам: когда артефакт уместен и какой выбор в нём ошибочен.
- id: problem-brief-quiz
  skill: product-problem-brief
  question: problem-brief
  difficulty: 1
  prompt: Команде нужно согласовать, что именно болит, до выбора фичи. Какой документ для этого уместен?
  explanation: Бриф проблемы описывает человека, ситуацию, обходной путь и свидетельства. Экраны и название релиза в нём означают, что решение уже выбрали.
  type: quiz
  options:
    - label: Бриф проблемы — кто, в какой ситуации, чем обходится сейчас и какое свидетельство подтвердит боль
      why: Верно. Бриф останавливает спор о фиче, пока команда не согласилась, что проблема стоит работы.
    - label: Спека экранов, чтобы инженеры сразу оценили срок
      why: Это постановка решения. Оценку имеет смысл просить после того, как боль и объём согласованы.
    - label: Бриф, заполненный только мнениями созвона, без разговоров с теми, у кого болит
      why: Мнение комнаты не заменяет свидетельство. Такой бриф удобно защищать и трудно проверить.
    - label: Отчёт об уже выпущенной фиче
      why: Отчёт смотрит назад. Бриф нужен до выбора, что строить.
  answer: 0
- id: opportunity-tree-quiz
  skill: product-opportunity-tree
  question: opportunity-tree
  difficulty: 1
  prompt: Какое дерево возможностей собрано правильно?
  explanation: Наверху исход, ниже возможности из исследований, под ними несколько решений, под решением эксперимент. Список фич по громкости просьб — это бэклог.
  type: quiz
  options:
    - label: Исход, под ним возможности из интервью и данных, под каждой несколько решений и дешёвый эксперимент
      why: Верно. Возможность — это потребность, решение и эксперимент лежат ниже и их можно выбросить, не теряя исхода.
    - label: Список фич, отсортированный по тому, кто громче просил
      why: В таком списке нет ни исхода, ни возможности. Проверять нечего, есть только очередь.
    - label: Одно решение и под ним технические задачи
      why: Это план разработки. Дерево как раз нужно, чтобы не принимать первое решение за единственное.
    - label: Дашборд метрик без привязки к потребности
      why: Метрика говорит, что изменилось, но не какую возможность вы проверяете.
  answer: 0
- id: one-pager-quiz
  skill: product-one-pager
  question: one-pager
  difficulty: 2
  prompt: One-pager уже выбирает подход. Какая строка делает его решением об объёме, а не пожеланием?
  explanation: Строка «не делаем» отсекает соседние просьбы. Без неё страница растёт с каждым комментарием, а несколько исходов сразу не дают понять, что проверять.
  type: quiz
  options:
    - label: "«Не делаем»: какие соседние просьбы в этот заход не входят, плюс одна метрика исхода"
      why: Верно. Объём ограничен явно, а успех назван одним исходом, а не набором задач.
    - label: План квартала со всеми ставками команды
      why: One-pager — одно решение. Квартальный план смешивает несколько ставок и не ограничивает эту.
    - label: Макет всех экранов и оценка в стори-пойнтах
      why: Это уже спецификация и оценка. Для согласования подхода они преждевременны.
    - label: Три исхода для трёх разных стейкхолдеров
      why: Тогда неясно, какой исход документ обещает и какую метрику смотреть.
  answer: 0
- id: experiment-card-quiz
  skill: product-experiment-card
  question: experiment-card
  difficulty: 2
  prompt: Эксперимент ещё не запущен. Чего в карточке не хватает, чтобы результат нельзя было подогнать?
  explanation: Правило решения пишут до данных. Метрика, выбранная после графика, и пакет из нескольких изменений не дают честного вывода.
  type: quiz
  options:
    - label: Заранее написанного правила, при каком значении основной и защитной метрики вы продолжаете или останавливаетесь
      why: Верно. Без правила до запуска любой график можно объявить успехом.
    - label: Пяти графиков, которые посмотрите после релиза и выберете удачный
      why: Выбор метрики после результата подгоняет вывод. Основная метрика одна и названа заранее.
    - label: Списка из нескольких изменений в одном запуске
      why: Тогда непонятно, что именно сдвинуло число. В карточке одно изменение.
    - label: Только p-value без того, какое изменение человек увидел
      why: Значимость без ясного изменения и правила решения не говорит, что делать дальше.
  answer: 0
